<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explorador Transmedia de WCAG 2.2 - Herramienta educativa para comprender y aplicar los criterios de accesibilidad web">
    <title>🛡️ AVIA-PRESERVE | Explorador WCAG 2.2</title>
    
    <style>
    /* ══════════════════════════════════════════════════════════
       AVIA-PRESERVE — STYLES EMBEBIDOS
       Versión: 0.9 (Alpha) - Autocontenido
       ══════════════════════════════════════════════════════════ */

    :root {
        --color-primary: #2563eb;
        --color-primary-dark: #1e40af;
        --color-primary-light: #3b82f6;
        --color-text-primary: #1e293b;
        --color-text-secondary: #475569;
        --color-text-tertiary: #64748b;
        --color-level-a: #059669;
        --color-level-aa: #d97706;
        --color-level-aaa: #dc2626;
        --color-perceivable: #7c3aed;
        --color-operable: #2563eb;
        --color-understandable: #059669;
        --color-robust: #d97706;
        --color-bg-primary: #ffffff;
        --color-bg-secondary: #f8fafc;
        --color-bg-tertiary: #f1f5f9;
        --color-border-light: #e2e8f0;
        --color-border-medium: #cbd5e1;
        --color-border-dark: #94a3b8;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
        --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.15);
        --spacing-xs: 0.25rem;
        --spacing-sm: 0.5rem;
        --spacing-md: 1rem;
        --spacing-lg: 1.5rem;
        --spacing-xl: 2rem;
        --spacing-2xl: 3rem;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --font-mono: 'Courier New', Courier, monospace;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --transition-fast: 150ms ease;
        --transition-base: 200ms ease;
        --transition-slow: 300ms ease;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        font-size: 16px;
        scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
        html {
            scroll-behavior: auto;
        }
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }

    body {
        font-family: var(--font-sans);
        font-size: 1rem;
        line-height: 1.6;
        color: var(--color-text-primary);
        background: var(--color-bg-secondary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    .container {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 var(--spacing-md);
    }

    @media (min-width: 768px) {
        .container {
            padding: 0 var(--spacing-xl);
        }
    }

    /* HEADER */
    .site-header {
        background: var(--color-bg-primary);
        border-bottom: 2px solid var(--color-border-light);
        padding: var(--spacing-lg) 0;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: var(--shadow-sm);
    }

    .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--spacing-md);
    }

    .logo-section h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--color-text-primary);
        margin-bottom: var(--spacing-xs);
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
    }

    .logo-icon {
        font-size: 2rem;
    }

    .tagline {
        font-size: 0.875rem;
        color: var(--color-text-secondary);
        font-weight: 500;
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
    }

    .wcag-version-badge {
        display: inline-flex;
        align-items: center;
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--color-primary);
        color: white;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: var(--radius-md);
        letter-spacing: 0.05em;
    }

    .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: transparent;
        border: 1px solid var(--color-border-medium);
        border-radius: var(--radius-md);
        color: var(--color-text-secondary);
        cursor: pointer;
        transition: all var(--transition-base);
    }

    .icon-button:hover {
        background: var(--color-bg-secondary);
        border-color: var(--color-primary);
        color: var(--color-primary);
    }

    .icon-button:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
    }

    /* FILTROS */
    .filters-section {
        background: var(--color-bg-primary);
        padding: var(--spacing-xl) 0;
        border-bottom: 1px solid var(--color-border-light);
    }

    .filters-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--spacing-lg);
        margin-bottom: var(--spacing-lg);
    }

    @media (min-width: 768px) {
        .filters-grid {
            grid-template-columns: 1fr 2fr;
        }
    }

    .filter-group {
        border: none;
        padding: 0;
    }

    .filter-group legend {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--color-text-secondary);
        margin-bottom: var(--spacing-md);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .filter-options {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-sm);
    }

    .filter-option {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--color-bg-secondary);
        border: 2px solid var(--color-border-light);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-base);
        position: relative;
    }

    .filter-option:hover {
        border-color: var(--color-primary);
        background: var(--color-bg-primary);
    }

    .filter-option:has(input:checked) {
        background: var(--color-primary);
        border-color: var(--color-primary);
        color: white;
    }

    .filter-option:has(input:checked) .filter-label,
    .filter-option:has(input:checked) .filter-count {
        color: white;
    }

    .filter-option input[type="radio"] {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
    }

    .filter-option:has(input:focus-visible) {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
    }

    .filter-label {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--color-text-primary);
    }

    .filter-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 20px;
        padding: 0 var(--spacing-sm);
        background: var(--color-bg-tertiary);
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--color-text-secondary);
    }

    .principle-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        font-size: 0.75rem;
        font-weight: 700;
        color: white;
    }

    .principle-badge.perceivable {
        background: var(--color-perceivable);
    }

    .principle-badge.operable {
        background: var(--color-operable);
    }

    .principle-badge.understandable {
        background: var(--color-understandable);
    }

    .principle-badge.robust {
        background: var(--color-robust);
    }

    .results-summary {
        font-size: 0.875rem;
        color: var(--color-text-secondary);
        padding: var(--spacing-md);
        background: var(--color-bg-secondary);
        border-radius: var(--radius-md);
        text-align: center;
    }

    .results-summary strong {
        color: var(--color-primary);
        font-weight: 700;
    }

    /* MAIN CONTENT */
    .main-content {
        padding: var(--spacing-2xl) 0;
        min-height: 60vh;
    }

    .criteria-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--spacing-lg);
    }

    @media (min-width: 640px) {
        .criteria-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (min-width: 1024px) {
        .criteria-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (min-width: 1280px) {
        .criteria-grid {
            grid-template-columns: repeat(4, 1fr);
        }
    }

    /* TARJETA */
    .criterion-card {
        background: var(--color-bg-primary);
        border: 1px solid var(--color-border-light);
        border-radius: var(--radius-lg);
        padding: var(--spacing-lg);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
        box-shadow: var(--shadow-sm);
        transition: all var(--transition-base);
    }

    @media (prefers-reduced-motion: no-preference) {
        .criterion-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
    }

    .criterion-card:focus-within {
        outline: 3px solid var(--color-primary);
        outline-offset: 2px;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .criterion-id {
        font-family: var(--font-mono);
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--color-text-secondary);
        letter-spacing: 0.05em;
    }

    .card-badges {
        display: flex;
        gap: var(--spacing-sm);
    }

    .level-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        height: 24px;
        padding: 0 var(--spacing-sm);
        font-size: 0.75rem;
        font-weight: 700;
        border-radius: var(--radius-sm);
        color: white;
    }

    .level-badge.level-a {
        background: var(--color-level-a);
    }

    .level-badge.level-aa {
        background: var(--color-level-aa);
    }

    .level-badge.level-aaa {
        background: var(--color-level-aaa);
    }

    .criterion-name {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.4;
        color: var(--color-text-primary);
        margin: 0;
    }

    .criterion-excerpt {
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--color-text-secondary);
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .card-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm) var(--spacing-md);
        background: transparent;
        border: 1px solid var(--color-border-medium);
        border-radius: var(--radius-md);
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--color-primary);
        cursor: pointer;
        transition: all var(--transition-base);
        width: 100%;
    }

    .card-action:hover {
        background: var(--color-bg-secondary);
        border-color: var(--color-primary);
    }

    .card-action:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
    }

    /* MODAL */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: var(--spacing-md);
    }

    .modal[aria-hidden="false"] {
        display: flex;
    }

    .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
    }

    .modal-container {
        position: relative;
        width: 100%;
        max-width: 800px;
        max-height: 90vh;
        background: var(--color-bg-primary);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-xl);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: var(--spacing-md);
        padding: var(--spacing-xl);
        border-bottom: 1px solid var(--color-border-light);
        background: var(--color-bg-secondary);
    }

    .modal-header h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--color-text-primary);
        margin: 0;
        flex: 1;
    }

    .modal-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: transparent;
        border: none;
        border-radius: var(--radius-md);
        color: var(--color-text-secondary);
        cursor: pointer;
        flex-shrink: 0;
        transition: all var(--transition-base);
    }

    .modal-close:hover {
        background: var(--color-bg-tertiary);
        color: var(--color-text-primary);
    }

    .modal-close:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
    }

    .modal-body {
        flex: 1;
        overflow-y: auto;
        padding: var(--spacing-xl);
    }

    .modal-body h3 {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: var(--spacing-lg) 0 var(--spacing-md) 0;
    }

    .modal-body p {
        margin-bottom: var(--spacing-md);
        line-height: 1.7;
    }

    .modal-body ul {
        margin: var(--spacing-md) 0;
        padding-left: var(--spacing-xl);
    }

    .modal-body li {
        margin-bottom: var(--spacing-sm);
        line-height: 1.6;
    }

    .modal-footer {
        display: flex;
        justify-content: space-between;
        gap: var(--spacing-md);
        padding: var(--spacing-lg) var(--spacing-xl);
        border-top: 1px solid var(--color-border-light);
        background: var(--color-bg-secondary);
    }

    .btn-secondary {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm) var(--spacing-lg);
        background: var(--color-bg-primary);
        border: 1px solid var(--color-border-medium);
        border-radius: var(--radius-md);
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--color-text-primary);
        cursor: pointer;
        transition: all var(--transition-base);
    }

    .btn-secondary:hover {
        background: var(--color-bg-tertiary);
        border-color: var(--color-primary);
        color: var(--color-primary);
    }

    .btn-secondary:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
    }

    .btn-secondary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* FOOTER */
    .site-footer {
        background: var(--color-text-primary);
        color: rgba(255, 255, 255, 0.9);
        padding: var(--spacing-2xl) 0;
        margin-top: var(--spacing-2xl);
    }

    .footer-content {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--spacing-xl);
        text-align: center;
    }

    @media (min-width: 768px) {
        .footer-content {
            grid-template-columns: repeat(3, 1fr);
            text-align: left;
        }
    }

    .footer-branding p {
        margin-bottom: var(--spacing-sm);
    }

    .footer-certifications {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-sm);
        justify-content: center;
    }

    @media (min-width: 768px) {
        .footer-certifications {
            justify-content: flex-start;
        }
    }

    .cert-badge {
        display: inline-flex;
        align-items: center;
        padding: var(--spacing-xs) var(--spacing-sm);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        font-weight: 600;
    }

    .footer-links {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
        align-items: center;
    }

    @media (min-width: 768px) {
        .footer-links {
            align-items: flex-end;
        }
    }

    .footer-links a {
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        font-size: 0.875rem;
        transition: color var(--transition-base);
    }

    .footer-links a:hover {
        color: white;
        text-decoration: underline;
    }

    .footer-links a:focus {
        outline: 2px solid white;
        outline-offset: 2px;
        border-radius: var(--radius-sm);
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
    }

    @media (max-width: 640px) {
        .site-header {
            padding: var(--spacing-md) 0;
        }
        .logo-section h1 {
            font-size: 1.25rem;
        }
        .tagline {
            font-size: 0.75rem;
        }
        .filters-section {
            padding: var(--spacing-md) 0;
        }
        .main-content {
            padding: var(--spacing-lg) 0;
        }
        .modal-container {
            max-height: 95vh;
        }
        .modal-header,
        .modal-body,
        .modal-footer {
            padding: var(--spacing-md);
        }
    }
    </style>
</head>
<body>
    
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <h1><span class="logo-icon">🛡️</span> AVIA-PRESERVE</h1>
                    <p class="tagline">Explorador Transmedia de WCAG 2.2</p>
                </div>
                
                <div class="header-actions">
                    <span class="wcag-version-badge">WCAG 2.2</span>
                    <button class="icon-button" aria-label="Información y ayuda" onclick="openHelpModal()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <section class="filters-section" aria-label="Filtros de criterios WCAG">
        <div class="container">
            <div class="filters-grid">
                
                <fieldset class="filter-group">
                    <legend>Nivel de conformidad</legend>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="radio" name="level-filter" value="all" checked>
                            <span class="filter-label">Todos</span>
                            <span class="filter-count" id="count-all">86</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="level-filter" value="A">
                            <span class="filter-label level-a">A</span>
                            <span class="filter-count" id="count-a">30</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="level-filter" value="AA">
                            <span class="filter-label level-aa">AA</span>
                            <span class="filter-count" id="count-aa">26</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="level-filter" value="AAA">
                            <span class="filter-label level-aaa">AAA</span>
                            <span class="filter-count" id="count-aaa">30</span>
                        </label>
                    </div>
                </fieldset>
                
                <fieldset class="filter-group">
                    <legend>Principio WCAG</legend>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="radio" name="principle-filter" value="all" checked>
                            <span class="filter-label">Todos</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="principle-filter" value="Perceivable">
                            <span class="principle-badge perceivable">P</span>
                            <span class="filter-label">Perceptible</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="principle-filter" value="Operable">
                            <span class="principle-badge operable">O</span>
                            <span class="filter-label">Operable</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="principle-filter" value="Understandable">
                            <span class="principle-badge understandable">U</span>
                            <span class="filter-label">Comprensible</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="principle-filter" value="Robust">
                            <span class="principle-badge robust">R</span>
                            <span class="filter-label">Robusto</span>
                        </label>
                    </div>
                </fieldset>
                
            </div>
            
            <div class="results-summary" role="status" aria-live="polite">
                Mostrando <strong id="results-count">86</strong> criterios
            </div>
        </div>
    </section>

    <main class="main-content">
        <div class="container">
            <div id="criteria-grid" class="criteria-grid">
                <!-- SE GENERA DINÁMICAMENTE -->
            </div>
        </div>
    </main>

    <div id="wcag-modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-criterion-title">
        <div class="modal-overlay" onclick="closeWCAGModal()"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modal-criterion-title" tabindex="-1"></h2>

                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">

            { id: "1.4.1", name: "Uso del color", level: "A", principle: "Perceivable", description: "El color no debe ser el único medio visual para transmitir información, indicar una acción o distinguir un elemento.", techniques: [{id: "G182", title: "Asegurar información adicional"}], failures: [{id: "F73", title: "Crear un enlace usando solo color"}] },
            { id: "1.4.2", name: "Control del audio", level: "A", principle: "Perceivable", description: "Si el audio se reproduce automáticamente por más de 3 segundos, debe haber un mecanismo para pausarlo o controlarlo.", techniques: [{id: "G60", title: "Reproducir audio solo por solicitud"}], failures: [] },

            { id: "2.4.1", name: "Evitar bloques", level: "A", principle: "Operable", description: "Debe existir un mecanismo para saltar bloques de contenido repetido.", techniques: [{id: "G1", title: "Añadir enlace para saltar"}], failures: [] },
            { id: "2.4.2", name: "Página titulada", level: "A", principle: "Operable", description: "Las páginas web deben tener títulos que describan el tema o propósito.", techniques: [{id: "H25", title: "Proporcionar título con elemento title"}], failures: [{id: "F25", title: "Título que no describe página"}] },
            { id: "2.4.3", name: "Orden del foco", level: "A", principle: "Operable", description: "Si una página puede navegarse secuencialmente, los componentes reciben foco en un orden que preserva significado.", techniques: [{id: "G59", title: "Colocar elementos interactivos en orden"}], failures: [{id: "F85", title: "Orden de tabulación no preserva significado"}] },

            { id: "2.5.8", name: "Tamaño del objetivo (mínimo)", level: "AA", principle: "Operable", description: "El tamaño del objetivo para entradas con puntero es de al menos 24x24 píxeles CSS.", techniques: [], failures: [] },

            // Principio 3: Understandable
            { id: "3.1.1", name: "Idioma de la página", level: "A", principle: "Understandable", description: "El idioma predeterminado de cada página puede ser determinado programáticamente.", techniques: [{id: "H57", title: "Usar atributo lang"}], failures: [{id: "F78", title: "Falta atributo lang"}] },

            { id: "3.1.3", name: "Palabras inusuales", level: "AAA", principle: "Understandable", description: "Debe haber un mecanismo para identificar definiciones de palabras usadas de forma inusual.", techniques: [], failures: [] },

            { id: "3.1.5", name: "Nivel de lectura", level: "AAA", principle: "Understandable", description: "Cuando el texto requiere lectura avanzada, se proporciona contenido suplementario o una versión más simple.", techniques: [], failures: [] },

            { id: "3.2.3", name: "Navegación consistente", level: "AA", principle: "Understandable", description: "Los mecanismos de navegación repetidos en múltiples páginas ocurren en el mismo orden relativo.", techniques: [{id: "G61", title: "Presentar componentes repetidos en mismo orden"}], failures: [] },
            { id: "3.2.4", name: "Identificación consistente", level: "AA", principle: "Understandable", description: "Componentes con la misma funcionalidad se identifican consistentemente.", techniques: [{id: "G197", title: "Usar etiquetas consistentes"}], failures: [{id: "F31", title: "Usar etiquetas diferentes"}] },

            { id: "3.3.9", name: "Autenticación accesible (mejorado)", level: "AAA", principle: "Understandable", description: "No se requiere prueba de función cognitiva para autenticación.", techniques: [], failures: [] },

            // Principio 4: Robust
            { id: "4.1.1", name: "Procesamiento", level: "A", principle: "Robust", description: "En contenido implementado con lenguajes de marcado, los elementos tienen etiquetas completas y están anidados correctamente.", techniques: [{id: "G134", title: "Validar páginas web"}], failures: [{id: "F70", title: "Elementos o atributos duplicados"}] },
            { id: "4.1.2", name: "Nombre, función, valor", level: "A", principle: "Robust", description: "Para todos los componentes de interfaz, el nombre y función pueden ser determinados programáticamente.", techniques: [{id: "H91", title: "Usar controles HTML"}], failures: [{id: "F59", title: "Usar script sin identificar función"}] },
            { id: "4.1.3", name: "Mensajes de estado", level: "AA", principle: "Robust", description: "Los mensajes de estado pueden ser determinados programáticamente mediante roles o propiedades.", techniques: [{id: "ARIA22", title: "Usar role=status"}], failures: [] }
        ]
    };

    // ══════════════════════════════════════════════════════════
    // LÓGICA DE LA APLICACIÓN
    // ══════════════════════════════════════════════════════════

    let currentFilters = {
        level: 'all',
        principle: 'all'
    };

    let currentModalCriterionId = null;

    document.addEventListener('DOMContentLoaded', () => {
        console.log('🛡️ Iniciando AVIA-PRESERVE...');
        console.log(`✅ Ontología cargada: ${wcagOntology.criteria.length} criterios`);
        
        initializeFilters();
        renderCriteriaGrid();
        initializeModalKeyboard();
        
        console.log('✅ AVIA-PRESERVE inicializado correctamente');
    });

    function renderCriteriaGrid() {
        const grid = document.getElementById('criteria-grid');
        if (!grid) return;
        
        grid.innerHTML = '';
        
        wcagOntology.criteria.forEach(criterion => {
            const card = createCriterionCard(criterion);
            grid.appendChild(card);
        });
        
        console.log(`✅ Renderizadas ${wcagOntology.criteria.length} tarjetas`);
        applyFilters();
    }

    function createCriterionCard(criterion) {
        const article = document.createElement('article');
        article.className = 'criterion-card';
        article.dataset.id = criterion.id;
        article.dataset.level = criterion.level;
        article.dataset.principle = criterion.principle;
        
        const header = document.createElement('div');
        header.className = 'card-header';
        
        const idSpan = document.createElement('span');
        idSpan.className = 'criterion-id';
        idSpan.textContent = criterion.id;
        
        const badges = document.createElement('div');
        badges.className = 'card-badges';
        
        const levelBadge = document.createElement('span');
        levelBadge.className = `level-badge level-${criterion.level.toLowerCase()}`;
        levelBadge.textContent = criterion.level;
        levelBadge.setAttribute('aria-label', `Nivel ${criterion.level}`);
        
        const principleBadge = document.createElement('span');
        const principleClass = criterion.principle.toLowerCase();
        principleBadge.className = `principle-badge ${principleClass}`;
        principleBadge.textContent = criterion.principle.charAt(0);
        principleBadge.setAttribute('aria-label', criterion.principle);
        
        badges.appendChild(levelBadge);
        badges.appendChild(principleBadge);
        header.appendChild(idSpan);
        header.appendChild(badges);
        
        const name = document.createElement('h3');
        name.className = 'criterion-name';
        name.textContent = criterion.name;
        
        const excerpt = document.createElement('p');
        excerpt.className = 'criterion-excerpt';
        const maxLength = 120;
        const description = criterion.description || 'Sin descripción disponible';
        excerpt.textContent = description.length > maxLength 
            ? description.substring(0, maxLength) + '...'
            : description;
        
        const button = document.createElement('button');
        button.className = 'card-action';
        button.setAttribute('aria-label', `Ver detalles de ${criterion.name}`);
        button.innerHTML = `
            Ver detalles
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
            </svg>
        `;
        
        button.addEventListener('click', () => {
            openWCAGModal(criterion.id);
        });
        
        article.appendChild(header);
        article.appendChild(name);
        article.appendChild(excerpt);
        article.appendChild(button);
        
        return article;
    }

    function initializeFilters() {
        document.querySelectorAll('[name="level-filter"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentFilters.level = e.target.value;
                applyFilters();
                announce(`Filtrando por nivel: ${e.target.value}`);
            });
        });
        
        document.querySelectorAll('[name="principle-filter"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentFilters.principle = e.target.value;
                applyFilters();
                announce(`Filtrando por principio: ${e.target.value}`);
            });
        });
    }

    function applyFilters() {
        const cards = document.querySelectorAll('.criterion-card');
        let visibleCount = 0;
        
        cards.forEach(card => {
            const cardLevel = card.dataset.level;
            const cardPrinciple = card.dataset.principle;
            
            const passesLevel = currentFilters.level === 'all' || cardLevel === currentFilters.level;
            const passesPrinciple = currentFilters.principle === 'all' || cardPrinciple === currentFilters.principle;
            
            if (passesLevel && passesPrinciple) {
                card.style.display = 'flex';
                card.setAttribute('aria-hidden', 'false');
                visibleCount++;
            } else {
                card.style.display = 'none';
                card.setAttribute('aria-hidden', 'true');
            }
        });
        
        updateResultsCount(visibleCount);
    }

    function updateResultsCount(count) {
        const counter = document.getElementById('results-count');
        if (counter) {
            counter.textContent = count;
        }
    }

    function openWCAGModal(criterionId) {
        const criterion = wcagOntology.criteria.find(c => c.id === criterionId);
        if (!criterion) return;
        
        currentModalCriterionId = criterionId;
        
        const modal = document.getElementById('wcag-modal');
        modal.dataset.previousFocus = document.activeElement.id || '';
        
        populateModalContent(modal, criterion);
        
        modal.style.display = 'flex';
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        
        setTimeout(() => {
            const title = modal.querySelector('#modal-criterion-title');
            if (title) title.focus();
        }, 100);
        
        announce(`Abriendo detalles del criterio ${criterion.id}: ${criterion.name}`);
    }

    function closeWCAGModal() {
        const modal = document.getElementById('wcag-modal');
        if (!modal) return;
        
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        
        const previousFocusId = modal.dataset.previousFocus;
        if (previousFocusId) {
            const previousElement = document.getElementById(previousFocusId) || 
                                  document.querySelector(`[data-id="${currentModalCriterionId}"] button`);
            if (previousElement) previousElement.focus();
        }
        
        currentModalCriterionId = null;
        announce('Modal cerrado');
    }

    function populateModalContent(modal, criterion) {
        const title = modal.querySelector('#modal-criterion-title');
        if (title) {
            title.innerHTML = `
                <span style="font-family: 'Courier New', monospace; color: #64748b; font-size: 1rem;">${criterion.id}</span><br>
                ${criterion.name}
            `;
        }
        
        const body = modal.querySelector('#modal-body');
        if (body) {
            body.innerHTML = `
                <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <span class="level-badge level-${criterion.level.toLowerCase()}">${criterion.level}</span>
                    <span class="principle-badge ${criterion.principle.toLowerCase()}">${criterion.principle.charAt(0)}</span>
                    <span style="padding: 0.25rem 0.75rem; background: #f1f5f9; border-radius: 6px; font-size: 0.875rem; color: #475569;">
                        ${criterion.principle}
                    </span>
                </div>
                
                <h3>📋 Descripción</h3>
                <p>${criterion.description || 'Sin descripción disponible'}</p>
                
                <h3>🎯 ¿Por qué es importante?</h3>
                <p>Este criterio es esencial para garantizar que el contenido web sea accesible para todas las personas, 
                independientemente de sus capacidades o de las tecnologías de asistencia que utilicen.</p>
                
                ${criterion.techniques && criterion.techniques.length > 0 ? `
                    <h3>✅ Técnicas para cumplir (${criterion.techniques.length})</h3>
                    <ul>
                        ${criterion.techniques.slice(0, 5).map(t => `<li><strong>${t.id}:</strong> ${t.title || 'Sin título'}</li>`).join('')}
                        ${criterion.techniques.length > 5 ? `<li><em>... y ${criterion.techniques.length - 5} técnicas más</em></li>` : ''}
                    </ul>
                ` : ''}
                
                ${criterion.failures && criterion.failures.length > 0 ? `
                    <h3>❌ Fallos comunes (${criterion.failures.length})</h3>
                    <ul>
                        ${criterion.failures.slice(0, 5).map(f => `<li><strong>${f.id}:</strong> ${f.title || 'Sin título'}</li>`).join('')}
                        ${criterion.failures.length > 5 ? `<li><em>... y ${criterion.failures.length - 5} fallos más</em></li>` : ''}
                    </ul>
                ` : ''}
                
                <h3>🔗 Recursos externos</h3>
                <ul>
                    <li><a href="https://www.w3.org/WAI/WCAG22/Understanding/${criterion.id.replace(/\./g, '')}" target="_blank" rel="noopener">
                        Understanding ${criterion.id} (W3C)
                    </a></li>
                    <li><a href="https://www.w3.org/WAI/WCAG22/quickref/#${criterion.id.replace(/\./g, '')}" target="_blank" rel="noopener">
                        How to Meet ${criterion.id} (Quick Reference)
                    </a></li>
                </ul>
            `;
        }
        
        updateModalNavigation();
    }

    function updateModalNavigation() {
        const allCriteria = wcagOntology.criteria;
        const currentIndex = allCriteria.findIndex(c => c.id === currentModalCriterionId);
        
        const prevBtn = document.getElementById('modal-prev-btn');
        const nextBtn = document.getElementById('modal-next-btn');
        
        if (prevBtn) {
            prevBtn.disabled = currentIndex <= 0;
        }
        
        if (nextBtn) {
            nextBtn.disabled = currentIndex >= allCriteria.length - 1;
        }
    }

    function navigateModal(direction) {
        const allCriteria = wcagOntology.criteria;
        const currentIndex = allCriteria.findIndex(c => c.id === currentModalCriterionId);
        
        let newIndex;
        if (direction === 'prev') {
            newIndex = Math.max(0, currentIndex - 1);
        } else {
            newIndex = Math.min(allCriteria.length - 1, currentIndex + 1);
        }
        
        if (newIndex !== currentIndex) {
            const newCriterion = allCriteria[newIndex];
            currentModalCriterionId = newCriterion.id;
            
            const modal = document.getElementById('wcag-modal');
            populateModalContent(modal, newCriterion);
            
            announce(`Navegando a criterio ${newCriterion.id}: ${newCriterion.name}`);
        }
    }

    function initializeModalKeyboard() {
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('wcag-modal');
            if (!modal || modal.getAttribute('aria-hidden') === 'true') return;
            
            if (e.key === 'Escape') {
                closeWCAGModal();
            }
        });
    }

    function openHelpModal() {
        alert('🛡️ AVIA-PRESERVE\n\nExplorador Transmedia de WCAG 2.2\n\nUtiliza los filtros para explorar los 86 criterios de éxito de las WCAG 2.2.\n\n• Filtra por nivel (A, AA, AAA)\n• Filtra por principio (Perceptible, Operable, Comprensible, Robusto)\n• Haz clic en "Ver detalles" para más información\n\nNavegación por teclado:\n• Tab: navegar entre elementos\n• Enter/Espacio: activar botones\n• Escape: cerrar modal');
    }

    function openAboutModal() {
        alert('Sobre AVIA-PRESERVE\n\nVersión: 0.9 (Alpha - Autocontenido)\n\nUna herramienta educativa transmedia para explorar, comprender y aplicar los criterios de éxito de las WCAG 2.2.\n\nCertificaciones:\n♿ AAA - Accesibilidad nivel AAA\n🎯 SIMPLIT - Simplicidad y usabilidad\n🔒 Pukkart - Trazabilidad\n✅ CertiAVIA - Calidad certificada\n\nDesarrollado con el ecosistema AVIA.');
    }

    function announce(message) {
        const liveRegion = document.querySelector('.results-summary');
        if (liveRegion) {
            const originalHTML = liveRegion.innerHTML;
            liveRegion.innerHTML = message;
            setTimeout(() => {
                liveRegion.innerHTML = originalHTML;
            }, 2000);
        }
    }

    console.log('✅ Sistema AVIA-PRESERVE v0.9 cargado completamente');
    </script>
</body>
</html>
