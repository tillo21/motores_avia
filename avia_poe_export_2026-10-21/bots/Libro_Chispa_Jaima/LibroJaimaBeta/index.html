<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AVIA Chispa - Aventura Digital</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(0); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 5px #fbbf24; } 50% { box-shadow: 0 0 20px #fbbf24, 0 0 30px #f59e0b; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rotateIn { from { opacity: 0; transform: rotate(-10deg) scale(0.9); } to { opacity: 1; transform: rotate(0) scale(1); } }

    .float { animation: float 3s ease-in-out infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .sparkle { animation: sparkle 2s ease-in-out infinite; }
    .slide-up { animation: slideUp 0.6s ease-out forwards; }
    .slide-in { animation: slideIn 0.5s ease-out forwards; }
    .bounce { animation: bounce 1s ease-in-out infinite; }
    .glow { animation: glow 2s ease-in-out infinite; }
    .shake { animation: shake 0.5s ease-in-out; }
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .rotate-in { animation: rotateIn 0.5s ease-out forwards; }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-radius: 50%;
      animation: sparkle 3s ease-in-out infinite;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #1e3a5f 100%);
    }

    .card-shadow { box-shadow: 0 10px 40px rgba(0,0,0,0.3); }

    .btn-primary {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      transition: all 0.3s ease;
    }
    .btn-primary:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(251, 191, 36, 0.4); }
    .btn-primary:active { transform: scale(0.98); }

    .avatar-option { transition: all 0.3s ease; cursor: pointer; }
    .avatar-option:hover { transform: scale(1.1); }
    .avatar-option.selected {
      transform: scale(1.15);
      box-shadow: 0 0 0 4px #fbbf24, 0 5px 20px rgba(251, 191, 36, 0.5);
    }

    .device-card { transition: all 0.3s ease; cursor: pointer; }
    .device-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }

    .back-btn { position: fixed; bottom: 20px; left: 20px; z-index: 100; }
    .forward-btn { position: fixed; bottom: 20px; right: 20px; z-index: 100; }

    .speech-bubble {
      position: relative;
      background: white;
      border-radius: 20px;
      padding: 15px 20px;
      max-width: 280px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 30px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 15px solid white;
    }

    .tooltip { position: relative; }
    .tooltip-text {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e3a5f;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    .tooltip:hover .tooltip-text { visibility: visible; opacity: 1; }

    input:focus { outline: none; box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.5); }
    .error-shake { animation: shake 0.5s ease-in-out; border-color: #ef4444 !important; }
    .error-message { color: #fca5a5; font-size: 14px; margin-top: 8px; animation: fadeIn 0.3s ease-out; }

    @keyframes listening { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 50% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } }
    .mic-btn { transition: all 0.3s ease; }
    .mic-btn:hover { transform: scale(1.1); }
    .mic-btn.active { background: #ef4444 !important; animation: listening 1.5s ease-in-out infinite; }
    .listening-indicator { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext, useRef } = React;

    // ========== AUDIO SYSTEM ==========
    class AudioSystem {
      constructor() {
        this.audioContext = null;
        this.initialized = false;
        this.speechSynthesis = null;
        this.recognition = null;
        this.available = { audio: false, speech: false, recognition: false };
        setTimeout(() => this.init(), 100);
      }

      init() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            this.AudioContextClass = AC;
            this.available.audio = true;
          }
        } catch (e) { console.log('AudioContext no disponible'); }

        try {
          if (typeof window !== 'undefined' && window.speechSynthesis) {
            this.speechSynthesis = window.speechSynthesis;
            this.available.speech = true;
          }
        } catch (e) { console.log('SpeechSynthesis no disponible'); }

        try {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SR) {
            this.recognition = new SR();
            this.recognition.lang = 'es-ES';
            this.recognition.continuous = false;
            this.recognition.interimResults = false;
            this.available.recognition = true;
          }
        } catch (e) { console.log('SpeechRecognition no disponible'); }

        this.initialized = true;
      }

      ensureAudioContext() {
        if (!this.audioContext && this.AudioContextClass) {
          try {
            this.audioContext = new this.AudioContextClass();
          } catch (e) {
            this.available.audio = false;
          }
        }
        return this.audioContext;
      }

      playTone(freq, duration, type = 'sine') {
        if (!this.available.audio) return;
        try {
          const ctx = this.ensureAudioContext();
          if (!ctx) return;
          if (ctx.state === 'suspended') ctx.resume();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = freq;
          osc.type = type;
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }

      playClick() { this.playTone(800, 0.1); }
      playSuccess() {
        this.playTone(523, 0.15);
        setTimeout(() => this.playTone(659, 0.15), 150);
        setTimeout(() => this.playTone(784, 0.2), 300);
      }
      playError() { this.playTone(200, 0.3, 'sawtooth'); }
      playWelcome() {
        [392, 440, 494, 523, 587, 659].forEach((f, i) =>
          setTimeout(() => this.playTone(f, 0.2), i * 100)
        );
      }

      speak(text, onEnd) {
        if (!this.available.speech || !this.speechSynthesis) {
          if (onEnd) onEnd();
          return;
        }
        try {
          this.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'es-ES';
          u.rate = 0.9;
          u.pitch = 1.3;
          const voices = this.speechSynthesis.getVoices();
          const v = voices.find(x => x.lang.includes('es') &&
            (x.name.includes('female') || x.name.includes('Paulina') || x.name.includes('Monica')))
            || voices.find(x => x.lang.includes('es'));
          if (v) u.voice = v;
          if (onEnd) u.onend = onEnd;
          this.speechSynthesis.speak(u);
        } catch (e) { if (onEnd) onEnd(); }
      }

      startListening(onResult, onError, onEnd) {
        if (!this.available.recognition || !this.recognition) {
          onError('Micrófono no disponible en este entorno');
          return false;
        }
        try {
          this.recognition.onresult = (e) => onResult(e.results[0][0].transcript);
          this.recognition.onerror = (e) => {
            const msg = e.error === 'no-speech' ? 'No se detectó voz' :
                        e.error === 'not-allowed' ? 'Permiso denegado' : 'Error de micrófono';
            onError(msg);
          };
          this.recognition.onend = () => { if (onEnd) onEnd(); };
          this.recognition.start();
          return true;
        } catch (e) {
          onError('No se pudo iniciar el micrófono');
          return false;
        }
      }

      stopListening() {
        try { if (this.recognition) this.recognition.stop(); } catch (e) {}
      }
    }

    const audioSystem = new AudioSystem();
    try {
      if (typeof window !== 'undefined' && window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {
          try { window.speechSynthesis.getVoices(); } catch(e) {}
        };
      }
    } catch (e) {}

    // ========== CONTEXT ==========
    const AppContext = createContext();

    function AppProvider({ children }) {
      const [state, setState] = useState({
        screen: 'splash',
        userName: '',
        pendingName: '',
        avatar: 0,
        completedDevices: [],
        quizScore: 0,
        currentDevice: null,
        soundEnabled: true
      });

      const updateState = (updates) => setState(prev => ({ ...prev, ...updates }));

      return (
        <AppContext.Provider value={{ state, updateState, audioSystem }}>
          {children}
        </AppContext.Provider>
      );
    }

    function useApp() {
      return useContext(AppContext);
    }

    // ========== SVG AVATARS ==========
    const AvatarSVG = ({ index, size = 60 }) => {
      const avatarData = [
        { hair: '#4a3728', skin: '#ffd5c8', shirt: '#3b82f6' },
        { hair: '#1a1a1a', skin: '#ffd5c8', shirt: '#ec4899' },
        { hair: '#2d1810', skin: '#d4a574', shirt: '#10b981' },
        { hair: '#1a1a1a', skin: '#d4a574', shirt: '#8b5cf6' },
        { hair: '#1a1a1a', skin: '#8d5524', shirt: '#f59e0b' },
        { hair: '#1a1a1a', skin: '#8d5524', shirt: '#ef4444' },
      ];

      const isGirl = index % 2 === 1;
      const data = avatarData[index] || avatarData[0];

      return (
        <svg width={size} height={size} viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="#e0f2fe" stroke="#93c5fd" strokeWidth="2"/>
          <ellipse cx="50" cy="55" rx="28" ry="30" fill={data.skin}/>
          {isGirl ? (
            <React.Fragment>
              <ellipse cx="50" cy="35" rx="32" ry="22" fill={data.hair}/>
              <ellipse cx="25" cy="55" rx="8" ry="20" fill={data.hair}/>
              <ellipse cx="75" cy="55" rx="8" ry="20" fill={data.hair}/>
            </React.Fragment>
          ) : (
            <ellipse cx="50" cy="32" rx="30" ry="18" fill={data.hair}/>
          )}
          <ellipse cx="40" cy="52" rx="5" ry="6" fill="white"/>
          <ellipse cx="60" cy="52" rx="5" ry="6" fill="white"/>
          <circle cx="41" cy="53" r="3" fill="#1a1a1a"/>
          <circle cx="61" cy="53" r="3" fill="#1a1a1a"/>
          <circle cx="42" cy="52" r="1" fill="white"/>
          <circle cx="62" cy="52" r="1" fill="white"/>
          <ellipse cx="32" cy="62" rx="5" ry="3" fill="#ffb4b4" opacity="0.6"/>
          <ellipse cx="68" cy="62" rx="5" ry="3" fill="#ffb4b4" opacity="0.6"/>
          <path d="M 40 68 Q 50 78 60 68" stroke="#1a1a1a" strokeWidth="2" fill="none" strokeLinecap="round"/>
          <ellipse cx="50" cy="95" rx="25" ry="15" fill={data.shirt}/>
        </svg>
      );
    };

    // ========== ATOMS ==========
    function Particles() {
      const [particles] = useState(() =>
        Array.from({ length: 20 }, (_, i) => ({
          id: i,
          left: Math.random() * 100,
          top: Math.random() * 100,
          delay: Math.random() * 3,
          size: 4 + Math.random() * 8
        }))
      );

      return (
        <div className="absolute inset-0 overflow-hidden pointer-events-none">
          {particles.map(p => (
            <div
              key={p.id}
              className="particle"
              style={{
                left: `${p.left}%`,
                top: `${p.top}%`,
                width: p.size,
                height: p.size,
                animationDelay: `${p.delay}s`
              }}
            />
          ))}
        </div>
      );
    }

    function Chispa({ size = 120, speaking = false, message = '' }) {
      const { audioSystem, state } = useApp();
      const [isSpeaking, setIsSpeaking] = useState(false);
      const lastMsg = useRef('');

      useEffect(() => {
        if (message && message !== lastMsg.current && state.soundEnabled) {
          lastMsg.current = message;
          setIsSpeaking(true);
          audioSystem.speak(message, () => setIsSpeaking(false));
        }
      }, [message, state.soundEnabled]);

      return (
        <div className="flex flex-col items-center">
          {message && (
            <div className="speech-bubble mb-4 slide-up">
              <p className="text-gray-700 text-sm leading-relaxed">{message}</p>
            </div>
          )}
          <div className={`float ${speaking || isSpeaking ? 'pulse' : ''}`}>
            <svg width={size} height={size} viewBox="0 0 120 120">
              <defs>
                <linearGradient id="chispaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#fbbf24"/>
                  <stop offset="50%" stopColor="#f59e0b"/>
                  <stop offset="100%" stopColor="#d97706"/>
                </linearGradient>
                <filter id="glow">
                  <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                  <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>
              <ellipse cx="60" cy="65" rx="45" ry="50" fill="#fef3c7" opacity="0.3" filter="url(#glow)"/>
              <path d="M60 10 C80 30 95 50 90 75 C85 95 70 105 60 105 C50 105 35 95 30 75 C25 50 40 30 60 10Z" fill="url(#chispaGrad)" filter="url(#glow)"/>
              <ellipse cx="60" cy="60" rx="30" ry="35" fill="#fef3c7"/>
              <ellipse cx="48" cy="55" rx="8" ry="10" fill="white"/>
              <ellipse cx="72" cy="55" rx="8" ry="10" fill="white"/>
              <circle cx="50" cy="57" r="5" fill="#1e3a5f"/>
              <circle cx="74" cy="57" r="5" fill="#1e3a5f"/>
              <circle cx="52" cy="55" r="2" fill="white"/>
              <circle cx="76" cy="55" r="2" fill="white"/>
              <ellipse cx="38" cy="68" rx="6" ry="4" fill="#fed7aa" opacity="0.8"/>
              <ellipse cx="82" cy="68" rx="6" ry="4" fill="#fed7aa" opacity="0.8"/>
              <path d={speaking ? "M 48 75 Q 60 88 72 75" : "M 48 75 Q 60 82 72 75"} stroke="#d97706" strokeWidth="3" fill="none" strokeLinecap="round"/>
              <circle cx="40" cy="25" r="3" fill="white" className="sparkle"/>
              <circle cx="85" cy="40" r="2" fill="white" className="sparkle" style={{animationDelay: '0.5s'}}/>
              <circle cx="30" cy="50" r="2" fill="white" className="sparkle" style={{animationDelay: '1s'}}/>
            </svg>
          </div>
        </div>
      );
    }

    function Button({ children, onClick, variant = 'primary', disabled = false, className = '' }) {
      const { audioSystem } = useApp();
      const handleClick = (e) => { audioSystem.playClick(); if (onClick) onClick(e); };
      const baseClass = "px-6 py-3 rounded-full font-bold text-lg transition-all duration-300";
      const variants = {
        primary: "btn-primary text-gray-800",
        secondary: "bg-white/20 text-white border-2 border-white/50 hover:bg-white/30",
      };
      return (
        <button onClick={handleClick} disabled={disabled} className={`${baseClass} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
          {children}
        </button>
      );
    }

    function BackButton({ onClick }) {
      const { audioSystem } = useApp();
      const handleClick = () => { audioSystem.playClick(); onClick(); };
      return (
        <button onClick={handleClick} className="back-btn w-14 h-14 rounded-full bg-white shadow-lg flex items-center justify-center hover:scale-110 transition-transform" aria-label="Volver">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      );
    }

    function ForwardButton({ onClick, disabled = false }) {
      const { audioSystem } = useApp();
      const handleClick = () => { if (!disabled) { audioSystem.playClick(); onClick(); } };
      return (
        <button onClick={handleClick} disabled={disabled} className={`forward-btn w-14 h-14 rounded-full bg-white shadow-lg flex items-center justify-center transition-transform ${disabled ? 'opacity-50' : 'hover:scale-110'}`} aria-label="Siguiente">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      );
    }

    function SoundToggle() {
      const { state, updateState, audioSystem } = useApp();
      const toggle = () => { audioSystem.playClick(); updateState({ soundEnabled: !state.soundEnabled }); };
      return (
        <button onClick={toggle} className="fixed top-4 right-4 w-12 h-12 rounded-full bg-white/20 backdrop-blur flex items-center justify-center hover:bg-white/30 transition-all z-50" aria-label="Toggle sonido">
          {state.soundEnabled ? (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
              <path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
          ) : (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
              <path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
          )}
        </button>
      );
    }

    // ========== DEVICES DATA ==========
    const devices = [
      { id: 'tablet', name: 'Tablet', icon: '📱', color: 'from-blue-400 to-blue-600', description: 'Una tablet es como un cuaderno mágico con pantalla táctil donde puedes dibujar, leer y jugar.', parts: ['Pantalla táctil', 'Botones', 'Cámara', 'Altavoz'], funFact: '¡Las tablets pueden reconocer hasta 10 dedos tocando la pantalla al mismo tiempo!' },
      { id: 'computer', name: 'Computadora', icon: '💻', color: 'from-purple-400 to-purple-600', description: 'Una computadora es una máquina inteligente que nos ayuda a crear, aprender y comunicarnos.', parts: ['Monitor o Pantalla', 'Teclado', 'Ratón', 'CPU que es el cerebro'], funFact: '¡Una computadora puede hacer millones de cálculos en un segundo!' },
      { id: 'smartphone', name: 'Teléfono', icon: '📲', color: 'from-green-400 to-green-600', description: 'Un teléfono inteligente es una pequeña computadora que cabe en tu bolsillo.', parts: ['Pantalla', 'Cámara', 'Micrófono', 'Batería'], funFact: '¡Tu teléfono es más potente que las computadoras que llevaron al hombre a la Luna!' },
      { id: 'robot', name: 'Robot', icon: '🤖', color: 'from-red-400 to-red-600', description: 'Un robot es una máquina programada para hacer tareas automáticamente.', parts: ['Sensores', 'Motor', 'Procesador', 'Batería'], funFact: '¡Hay robots que pueden bailar, cocinar y hasta jugar fútbol!' }
    ];

    const quizQuestions = [
      { question: '¿Qué parte de la computadora es como su cerebro?', options: ['El monitor', 'El CPU', 'El teclado', 'El ratón'], correct: 1 },
      { question: '¿Qué dispositivo tiene pantalla táctil?', options: ['Radio', 'Tablet', 'Reloj de pared', 'Lámpara'], correct: 1 },
      { question: '¿Para qué sirve el micrófono en un teléfono?', options: ['Para ver fotos', 'Para cargar batería', 'Para que te escuchen', 'Para encenderlo'], correct: 2 }
    ];

    // ========== SCREENS ==========
    function Splash() {
      const { updateState, audioSystem } = useApp();

      useEffect(() => {
        audioSystem.playWelcome();
        const timer = setTimeout(() => updateState({ screen: 'welcome' }), 3000);
        return () => clearTimeout(timer);
      }, []);

      return (
        <div className="gradient-bg w-full h-full flex flex-col items-center justify-center relative">
          <Particles />
          <SoundToggle />
          <div className="text-center slide-up">
            <Chispa size={150} />
            <h1 className="text-4xl font-bold text-white mt-6 tracking-wide">
              AVIA <span className="text-yellow-400">Chispa</span>
            </h1>
            <p className="text-white/80 mt-2 text-lg">Tu aventura digital comienza...</p>
          </div>
          <div className="absolute bottom-10 flex space-x-2">
            <div className="w-3 h-3 bg-yellow-400 rounded-full bounce" style={{animationDelay: '0s'}}/>
            <div className="w-3 h-3 bg-yellow-400 rounded-full bounce" style={{animationDelay: '0.2s'}}/>
            <div className="w-3 h-3 bg-yellow-400 rounded-full bounce" style={{animationDelay: '0.4s'}}/>
          </div>
        </div>
      );
    }

    function Welcome() {
      const { updateState } = useApp();

      return (
        <div className="gradient-bg w-full h-full flex flex-col items-center justify-center p-6 relative">
          <Particles />
          <SoundToggle />
          <div className="text-center max-w-md slide-up">
            <Chispa size={140} speaking={true} message="¡Hola! Soy Chispa, tu guía en esta aventura digital. ¿Estás listo para aprender sobre tecnología de forma divertida?" />
            <div className="mt-8">
              <Button onClick={() => updateState({ screen: 'personalization' })}>
                ¡Comenzar Aventura! 🚀
              </Button>
            </div>
          </div>
        </div>
      );
    }

    function Personalization() {
      const { state, updateState, audioSystem } = useApp();
      const [nameInput, setNameInput] = useState('');
      const [showConfirm, setShowConfirm] = useState(false);
      const [selectedAvatar, setSelectedAvatar] = useState(state.avatar);
      const [error, setError] = useState('');
      const [inputShake, setInputShake] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const inputRef = useRef(null);

      const handleContinue = () => {
        if (!nameInput.trim()) {
          setError('¡Escribe tu nombre para continuar!');
          setInputShake(true);
          if (state.soundEnabled) audioSystem.playError();
          setTimeout(() => setInputShake(false), 500);
          inputRef.current?.focus();
          return;
        }
        if (state.soundEnabled) audioSystem.playSuccess();
        updateState({ pendingName: nameInput.trim() });
        setShowConfirm(true);
      };

      const handleConfirmYes = () => {
        if (state.soundEnabled) audioSystem.playSuccess();
        updateState({ userName: nameInput.trim(), avatar: selectedAvatar, screen: 'explorer' });
      };

      const handleConfirmNo = () => {
        setShowConfirm(false);
        setNameInput('');
        inputRef.current?.focus();
      };

      const handleMicClick = () => {
        if (isListening) {
          audioSystem.stopListening();
          setIsListening(false);
          return;
        }
        setError('');
        setIsListening(true);
        const started = audioSystem.startListening(
          (transcript) => {
            setNameInput(transcript);
            setIsListening(false);
            if (state.soundEnabled) audioSystem.playSuccess();
          },
          (errMsg) => {
            setError(errMsg);
            setIsListening(false);
            if (state.soundEnabled) audioSystem.playError();
          },
          () => setIsListening(false)
        );
        if (!started) setIsListening(false);
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter') handleContinue();
      };

      return (
        <div className="gradient-bg w-full h-full flex flex-col items-center justify-center p-6 relative overflow-y-auto">
          <Particles />
          <SoundToggle />
          <BackButton onClick={() => updateState({ screen: 'welcome' })} />

          {showConfirm ? (
            <div className="text-center max-w-md slide-up">
              <Chispa size={120} speaking={true} message={`¿Te llamas ${nameInput}?`} />
              <div className="mt-8 flex justify-center space-x-4">
                <Button onClick={handleConfirmYes} variant="primary">¡Sí! ✓</Button>
                <Button onClick={handleConfirmNo} variant="secondary">No, cambiar</Button>
              </div>
            </div>
          ) : (
            <div className="text-center max-w-md slide-up">
              <Chispa size={100} speaking={true} message="¡Vamos a conocernos! Escribe tu nombre y elige cómo te gustaría verte." />

              <div className="mt-6 bg-white/10 backdrop-blur rounded-2xl p-6 card-shadow">
                <label className="block text-white text-left mb-2 font-medium">¿Cómo te llamas?</label>
                <div className="flex items-center space-x-2">
                  <input
                    ref={inputRef}
                    type="text"
                    value={nameInput}
                    onChange={(e) => { setNameInput(e.target.value); setError(''); }}
                    onKeyPress={handleKeyPress}
                    placeholder="Escribe o di tu nombre..."
                    className={`flex-1 px-4 py-3 rounded-xl text-lg border-2 border-transparent transition-all ${inputShake ? 'error-shake border-red-400' : ''}`}
                    maxLength={20}
                    autoComplete="off"
                    style={{ fontSize: '16px' }}
                  />
                  <div className="relative">
                    <button
                      onClick={handleMicClick}
                      className={`mic-btn w-12 h-12 rounded-full flex items-center justify-center ${isListening ? 'active bg-red-500' : 'bg-yellow-400 hover:bg-yellow-300'}`}
                      aria-label="Usar micrófono"
                    >
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={isListening ? 'white' : '#1e3a5f'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                      </svg>
                    </button>
                    {isListening && <div className="listening-indicator">Escuchando...</div>}
                  </div>
                </div>
                {error && <p className="error-message">{error}</p>}

                <div className="mt-6">
                  <div className="flex items-center justify-between mb-3">
                    <label className="text-white font-medium">Elige tu avatar:</label>
                    <span className="tooltip">
                      <span className="text-yellow-400 text-sm cursor-help">❓ ¿Qué es?</span>
                      <span className="tooltip-text">Un avatar es tu imagen o personaje en el mundo digital.</span>
                    </span>
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    {[0, 1, 2, 3, 4, 5].map((index) => (
                      <button
                        key={index}
                        onClick={() => setSelectedAvatar(index)}
                        className={`avatar-option p-2 rounded-xl bg-white/20 ${selectedAvatar === index ? 'selected' : ''}`}
                      >
                        <AvatarSVG index={index} size={50} />
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mt-6">
                  <Button onClick={handleContinue} className="w-full">Continuar →</Button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function Explorer() {
      const { state, updateState, audioSystem } = useApp();
      const [showWelcome, setShowWelcome] = useState(true);

      useEffect(() => {
        const timer = setTimeout(() => setShowWelcome(false), 4000);
        return () => clearTimeout(timer);
      }, []);

      const allCompleted = state.completedDevices.length >= devices.length;

      return (
        <div className="gradient-bg w-full h-full flex flex-col p-6 relative overflow-y-auto">
          <Particles />
          <SoundToggle />
          <BackButton onClick={() => updateState({ screen: 'personalization' })} />
          {allCompleted && <ForwardButton onClick={() => updateState({ screen: 'quiz' })} />}

          <div className="flex items-center justify-between mb-6 pt-2">
            <div className="flex items-center space-x-3">
              <div className="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center overflow-hidden">
                <AvatarSVG index={state.avatar} size={44} />
              </div>
              <div>
                <p className="text-white/80 text-sm">Explorador</p>
                <p className="text-white font-bold">{state.userName}</p>
              </div>
            </div>
            <div className="bg-yellow-400 px-3 py-1 rounded-full">
              <span className="text-gray-800 font-bold text-sm">{state.completedDevices.length}/{devices.length} ⭐</span>
            </div>
          </div>

          {showWelcome && (
            <div className="mb-6 slide-up">
              <Chispa size={80} speaking={true} message={`¡Excelente, ${state.userName}! Aquí están los dispositivos que exploraremos. Toca cada uno para aprender.`} />
            </div>
          )}

          <div className="grid grid-cols-2 gap-4 pb-20">
            {devices.map((device, index) => {
              const isCompleted = state.completedDevices.includes(device.id);
              return (
                <div
                  key={device.id}
                  onClick={() => updateState({ currentDevice: device, screen: 'detail' })}
                  className={`device-card bg-gradient-to-br ${device.color} rounded-2xl p-4 card-shadow slide-up relative`}
                  style={{ animationDelay: `${index * 0.1}s` }}
                >
                  {isCompleted && (
                    <div className="absolute top-2 right-2 w-6 h-6 bg-green-400 rounded-full flex items-center justify-center">
                      <span className="text-white text-sm">✓</span>
                    </div>
                  )}
                  <div className="text-5xl mb-2">{device.icon}</div>
                  <h3 className="text-white font-bold">{device.name}</h3>
                  <p className="text-white/80 text-xs mt-1">Toca para explorar</p>
                </div>
              );
            })}
          </div>

          {allCompleted && (
            <div className="fixed bottom-24 left-0 right-0 px-6">
              <div className="bg-yellow-400 rounded-2xl p-4 text-center glow">
                <p className="text-gray-800 font-bold">¡Has explorado todos los dispositivos! 🎉</p>
                <p className="text-gray-700 text-sm mt-1">Toca la flecha para hacer el quiz →</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    function Detail() {
      const { state, updateState, audioSystem } = useApp();
      const device = state.currentDevice;
      const [showParts, setShowParts] = useState(false);

      if (!device) return null;

      const handleComplete = () => {
        if (!state.completedDevices.includes(device.id)) {
          updateState({ completedDevices: [...state.completedDevices, device.id] });
          if (state.soundEnabled) audioSystem.playSuccess();
        }
        updateState({ screen: 'explorer', currentDevice: null });
      };

      return (
        <div className="gradient-bg w-full h-full flex flex-col p-6 relative overflow-y-auto">
          <Particles />
          <SoundToggle />
          <BackButton onClick={() => updateState({ screen: 'explorer', currentDevice: null })} />

          <div className="slide-up pb-20">
            <div className={`bg-gradient-to-br ${device.color} rounded-2xl p-6 card-shadow text-center mb-6`}>
              <div className="text-7xl mb-4">{device.icon}</div>
              <h1 className="text-3xl font-bold text-white">{device.name}</h1>
            </div>

            <div className="mb-6">
              <Chispa size={90} speaking={true} message={device.description} />
            </div>

            <div className="bg-white/10 backdrop-blur rounded-2xl p-4 mb-6">
              <button onClick={() => setShowParts(!showParts)} className="w-full flex items-center justify-between text-white font-bold">
                <span>🔧 Partes del {device.name}</span>
                <span className="text-2xl">{showParts ? '−' : '+'}</span>
              </button>

              {showParts && (
                <div className="mt-4 space-y-2">
                  {device.parts.map((part, index) => (
                    <div key={part} className="bg-white/20 rounded-lg p-3 text-white slide-in" style={{ animationDelay: `${index * 0.1}s` }}>
                      • {part}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="bg-yellow-400/20 border-2 border-yellow-400 rounded-2xl p-4 mb-6">
              <p className="text-yellow-400 font-bold mb-2">💡 Dato Curioso:</p>
              <p className="text-white">{device.funFact}</p>
            </div>

            <Button onClick={handleComplete} className="w-full">¡Entendido! Continuar →</Button>
          </div>
        </div>
      );
    }

    function Quiz() {
      const { state, updateState, audioSystem } = useApp();
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showResult, setShowResult] = useState(false);

      const question = quizQuestions[currentQuestion];

      const handleAnswer = (index) => {
        if (selectedAnswer !== null) return;

        setSelectedAnswer(index);
        const isCorrect = index === question.correct;
        if (isCorrect) {
          setScore(score + 1);
          if (state.soundEnabled) audioSystem.playSuccess();
        } else {
          if (state.soundEnabled) audioSystem.playError();
        }

        setTimeout(() => {
          if (currentQuestion < quizQuestions.length - 1) {
            setCurrentQuestion(currentQuestion + 1);
            setSelectedAnswer(null);
          } else {
            updateState({ quizScore: score + (isCorrect ? 1 : 0) });
            setShowResult(true);
          }
        }, 1500);
      };

      if (showResult) {
        const finalScore = score + (selectedAnswer === question.correct ? 1 : 0);
        const isPerfect = finalScore === quizQuestions.length;

        return (
          <div className="gradient-bg w-full h-full flex flex-col items-center justify-center p-6 relative">
            <Particles />
            <SoundToggle />
            <div className="text-center slide-up">
              <Chispa size={120} speaking={true} message={isPerfect ? `¡Increíble, ${state.userName}! ¡Respondiste todas correctamente!` : `¡Muy bien, ${state.userName}! Obtuviste ${finalScore} de ${quizQuestions.length}.`} />
              <div className="mt-8 bg-white/10 backdrop-blur rounded-2xl p-6">
                <div className="text-6xl mb-4">{isPerfect ? '🏆' : '⭐'}</div>
                <p className="text-white text-xl font-bold">Puntuación: {finalScore}/{quizQuestions.length}</p>
              </div>
              <div className="mt-6">
                <Button onClick={() => updateState({ screen: 'complete' })}>Ver mi Diploma 🎓</Button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="gradient-bg w-full h-full flex flex-col p-6 relative overflow-y-auto">
          <Particles />
          <SoundToggle />
          <BackButton onClick={() => updateState({ screen: 'explorer' })} />

          <div className="mb-6">
            <div className="flex justify-between text-white mb-2">
              <span>Pregunta {currentQuestion + 1}/{quizQuestions.length}</span>
              <span>⭐ {score}</span>
            </div>
            <div className="h-2 bg-white/20 rounded-full overflow-hidden">
              <div className="h-full bg-yellow-400 transition-all duration-500" style={{ width: `${((currentQuestion + 1) / quizQuestions.length) * 100}%` }} />
            </div>
          </div>

          <div className="slide-up pb-20">
            <div className="bg-white/10 backdrop-blur rounded-2xl p-6 mb-6">
              <Chispa size={70} speaking={true} />
              <p className="text-white text-xl font-bold mt-4 text-center">{question.question}</p>
            </div>

            <div className="space-y-3">
              {question.options.map((option, index) => {
                let bgClass = 'bg-white/20';
                if (selectedAnswer !== null) {
                  if (index === question.correct) bgClass = 'bg-green-500';
                  else if (index === selectedAnswer) bgClass = 'bg-red-500';
                }

                return (
                  <button
                    key={index}
                    onClick={() => handleAnswer(index)}
                    disabled={selectedAnswer !== null}
                    className={`w-full ${bgClass} rounded-xl p-4 text-white text-left font-medium transition-all ${selectedAnswer === null ? 'hover:bg-white/30' : ''}`}
                  >
                    {String.fromCharCode(65 + index)}. {option}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function Complete() {
      const { state, updateState, audioSystem } = useApp();
      const today = new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });

      useEffect(() => {
        if (state.soundEnabled) {
          audioSystem.playWelcome();
          setTimeout(() => audioSystem.playSuccess(), 600);
        }
      }, []);

      return (
        <div className="gradient-bg w-full h-full flex flex-col items-center justify-center p-6 relative overflow-y-auto">
          <Particles />
          <SoundToggle />
          <BackButton onClick={() => updateState({ screen: 'quiz' })} />

          <div className="slide-up w-full max-w-sm">
            <div className="bg-gradient-to-br from-yellow-100 to-yellow-50 rounded-2xl p-6 card-shadow border-4 border-yellow-400 rotate-in">
              <div className="text-center">
                <div className="text-4xl mb-2">🎓</div>
                <h1 className="text-2xl font-bold text-gray-800 mb-1">DIPLOMA</h1>
                <p className="text-gray-600 text-sm mb-4">Explorador Digital</p>

                <div className="border-t-2 border-b-2 border-yellow-400 py-4 my-4">
                  <p className="text-gray-600 text-sm">Este diploma certifica que</p>
                  <p className="text-2xl font-bold text-gray-800 my-2">{state.userName}</p>
                  <p className="text-gray-600 text-sm">ha completado exitosamente la aventura</p>
                  <p className="text-lg font-bold text-yellow-600">AVIA Chispa</p>
                </div>

                <div className="flex justify-center items-center space-x-2 mb-4">
                  <span className="text-yellow-500">⭐</span>
                  <span className="text-gray-700 font-bold">Puntuación: {state.quizScore}/{quizQuestions.length}</span>
                  <span className="text-yellow-500">⭐</span>
                </div>

                <div className="flex justify-center mb-4">
                  <AvatarSVG index={state.avatar} size={60} />
                </div>

                <p className="text-gray-500 text-xs">{today}</p>
              </div>
            </div>

            <div className="mt-6 text-center">
              <Chispa size={100} speaking={true} message={`¡Felicidades, ${state.userName}! Ahora eres un Explorador Digital oficial.`} />
            </div>

            <div className="mt-6 text-center">
              <Button onClick={() => updateState({
                screen: 'splash', userName: '', pendingName: '', avatar: 0,
                completedDevices: [], quizScore: 0, currentDevice: null
              })}>
                Jugar de Nuevo 🔄
              </Button>
            </div>
          </div>
        </div>
      );
    }

    // ========== MAIN APP ==========
    function App() {
      const { state } = useApp();
      const screens = { splash: Splash, welcome: Welcome, personalization: Personalization, explorer: Explorer, detail: Detail, quiz: Quiz, complete: Complete };
      const Screen = screens[state.screen] || Splash;
      return <Screen />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider><App /></AppProvider>
    );
  </script>
</body>
</html>
