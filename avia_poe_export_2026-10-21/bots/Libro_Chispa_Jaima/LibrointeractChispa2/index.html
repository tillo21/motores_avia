<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVIA Chispa - Constelación de Consenso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background: #1A1A2E;
    }
    #root { height: 100vh; width: 100vw; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      75% { transform: rotate(-20deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.5); }
      50% { box-shadow: 0 0 40px rgba(255,215,0,0.8); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOutLeft {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(-100px); }
    }
    @keyframes particleMove {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1.5); }
      100% { opacity: 0; transform: scale(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    
    .float-animation { animation: float 3s ease-in-out infinite; }
    .sparkle-animation { animation: sparkle 1.5s ease-in-out infinite; }
    .wave-animation { animation: wave 0.5s ease-in-out 3; }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    .fade-in-scale { animation: fadeInScale 0.5s ease-out forwards; }
    .slide-in-right { animation: slideInRight 0.5s ease-out forwards; }
    .bounce-animation { animation: bounce 1s ease-in-out infinite; }
    .pulse-animation { animation: pulse 1.5s ease-in-out infinite; }
    .blink-animation { animation: blink 4s ease-in-out infinite; }
    
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      border: 15px solid transparent;
      border-bottom-color: white;
    }
    
    .screen-transition-enter {
      animation: slideInRight 0.5s ease-out forwards;
    }
    .screen-transition-exit {
      animation: slideOutLeft 0.4s ease-in forwards;
    }
    
    .btn-interactive {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-interactive:hover {
      transform: scale(1.05);
    }
    .btn-interactive:active {
      transform: scale(0.95);
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'avia-blue': '#1A1A2E',
            'avia-gold': '#FFD700',
            'avia-light': '#F0F4F8',
            'avia-purple': '#4A1A6B',
          }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ═══════════════════════════════════════════════════════════════
    // 🎮 COMPONENTE: Partículas Doradas (Splash Screen)
    // ═══════════════════════════════════════════════════════════════
    const GoldenParticles = ({ count = 25 }) => {
      const [particles] = useState(() => 
        Array.from({ length: count }, (_, i) => ({
          id: i,
          startX: Math.random() * 100,
          startY: Math.random() * 100,
          delay: i * 0.08,
          size: Math.random() * 8 + 4,
          duration: 2 + Math.random(),
        }))
      );

      return (
        <div className="absolute inset-0 overflow-hidden pointer-events-none">
          {particles.map((p) => (
            <div
              key={p.id}
              className="absolute rounded-full bg-gradient-to-br from-yellow-300 to-yellow-500"
              style={{ 
                width: p.size, 
                height: p.size,
                left: `${p.startX}%`,
                top: `${p.startY}%`,
                animation: `particleMove ${p.duration}s ease-in-out ${p.delay}s forwards`,
              }}
            />
          ))}
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════
    // 🌟 COMPONENTE: Avatar de Chispa
    // ═══════════════════════════════════════════════════════════════
    const ChispaAvatar = ({ state = 'IDLE', size = 'md', onClick }) => {
      const [isWaving, setIsWaving] = useState(false);
      const [isPressed, setIsPressed] = useState(false);
      
      const sizeClasses = {
        sm: 'w-24 h-24',
        md: 'w-32 h-32',
        lg: 'w-40 h-40',
        xl: 'w-48 h-48'
      };

      const handleClick = () => {
        setIsWaving(true);
        setIsPressed(true);
        setTimeout(() => setIsPressed(false), 150);
        setTimeout(() => setIsWaving(false), 1500);
        onClick?.();
      };

      return (
        <div
          onClick={handleClick}
          className={`${sizeClasses[size]} relative cursor-pointer transition-transform duration-150`}
          style={{ transform: isPressed ? 'scale(0.95) rotate(-5deg)' : 'scale(1)' }}
        >
          {/* Cuerpo principal de Chispa */}
          <div className={`
            w-full h-full rounded-full 
            bg-gradient-to-br from-yellow-300 via-yellow-400 to-orange-400
            border-4 border-white shadow-xl
            flex items-center justify-center
            ${state === 'HAPPY' ? 'float-animation pulse-glow' : ''}
            ${state === 'CELEBRATING' ? 'sparkle-animation' : ''}
            ${state === 'CURIOUS' ? 'bounce-animation' : ''}
          `}>
            {/* Cara de Chispa */}
            <div className="relative w-3/4 h-3/4 flex flex-col items-center justify-center">
              {/* Ojos */}
              <div className="flex gap-4 mb-2">
                <div 
                  className={`w-4 h-4 bg-gray-800 rounded-full ${state === 'HAPPY' ? 'blink-animation' : ''}`}
                />
                <div 
                  className={`w-4 h-4 bg-gray-800 rounded-full ${state === 'HAPPY' ? 'blink-animation' : ''}`}
                />
              </div>
              {/* Boca */}
              <div 
                className="w-8 h-4 border-b-4 border-gray-800 rounded-b-full transition-transform"
                style={{ transform: state === 'HAPPY' ? 'scaleX(1.2)' : 'scaleX(1)' }}
              />
            </div>
          </div>
          
          {/* Destellos alrededor */}
          {['top-0 left-1/2 -translate-x-1/2 -translate-y-2', 
            'top-1/4 right-0 translate-x-2',
            'bottom-1/4 left-0 -translate-x-2',
            'bottom-0 left-1/2 -translate-x-1/2 translate-y-2'].map((pos, i) => (
            <span
              key={i}
              className={`absolute ${pos} text-xl sparkle-animation`}
              style={{ animationDelay: `${i * 0.3}s` }}
            >
              ✨
            </span>
          ))}
          
          {/* Mano saludando */}
          {(state === 'HAPPY' || isWaving) && (
            <span
              className={`absolute -top-2 -right-2 text-3xl fade-in-scale ${isWaving ? 'wave-animation' : ''}`}
            >
              👋
            </span>
          )}
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════
    // 📺 PANTALLA 1: Splash Screen
    // ═══════════════════════════════════════════════════════════════
    const SplashScreen = ({ onComplete }) => {
      const [showTitle, setShowTitle] = useState(false);
      const [showSubtitle, setShowSubtitle] = useState(false);
      const [showStar, setShowStar] = useState(false);

      useEffect(() => {
        const starTimer = setTimeout(() => setShowStar(true), 200);
        const titleTimer = setTimeout(() => setShowTitle(true), 1200);
        const subtitleTimer = setTimeout(() => setShowSubtitle(true), 1800);
        const completeTimer = setTimeout(onComplete, 3500);
        
        return () => {
          clearTimeout(starTimer);
          clearTimeout(titleTimer);
          clearTimeout(subtitleTimer);
          clearTimeout(completeTimer);
        };
      }, [onComplete]);

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia-blue via-indigo-900 to-avia-purple relative overflow-hidden">
          <GoldenParticles count={30} />
          
          {/* Logo/Estrella central */}
          {showStar && (
            <div className="text-8xl mb-8 z-10 fade-in-scale">
              ⭐
            </div>
          )}
          
          {/* Título */}
          {showTitle && (
            <h1 className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500 z-10 text-center fade-in-up">
              AVIA CONSTELACIÓN
            </h1>
          )}
          
          {/* Subtítulo */}
          {showSubtitle && (
            <p className="text-xl text-yellow-200 mt-4 z-10 fade-in-up" style={{ animationDelay: '0.2s' }}>
              ✨ Aprendiendo juntos ✨
            </p>
          )}
          
          {/* Indicador de carga */}
          <div className="absolute bottom-20 flex gap-2 fade-in-up" style={{ animationDelay: '0.5s' }}>
            {[0, 1, 2].map((i) => (
              <div
                key={i}
                className="w-3 h-3 rounded-full bg-yellow-400 pulse-animation"
                style={{ animationDelay: `${i * 0.2}s` }}
              />
            ))}
          </div>
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════
    // 📺 PANTALLA 2: Welcome Screen
    // ═══════════════════════════════════════════════════════════════
    const WelcomeScreen = ({ onContinue }) => {
      const [showDialogue, setShowDialogue] = useState(false);
      const [showButton, setShowButton] = useState(false);
      const [typedText, setTypedText] = useState('');
      
      const fullText = "¡Hola! Soy Chispa ✨\n¡Vamos a aprender juntos sobre dispositivos!";

      useEffect(() => {
        const dialogueTimer = setTimeout(() => setShowDialogue(true), 500);
        return () => clearTimeout(dialogueTimer);
      }, []);

      useEffect(() => {
        if (showDialogue && typedText.length < fullText.length) {
          const typeTimer = setTimeout(() => {
            setTypedText(fullText.slice(0, typedText.length + 1));
          }, 40);
          return () => clearTimeout(typeTimer);
        } else if (typedText.length === fullText.length) {
          setTimeout(() => setShowButton(true), 300);
        }
      }, [showDialogue, typedText]);

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia-blue via-indigo-900 to-purple-900 p-8">
          <div className="flex flex-col items-center text-center space-y-8 max-w-md fade-in-up">
            {/* Chispa Avatar */}
            <ChispaAvatar state="HAPPY" size="xl" />
            
            {/* Globo de diálogo */}
            {showDialogue && (
              <div className="bg-white text-gray-800 p-6 rounded-3xl shadow-2xl relative speech-bubble min-h-[120px] fade-in-scale">
                <p className="text-xl font-bold whitespace-pre-line">
                  {typedText}
                  <span className="pulse-animation inline-block">|</span>
                </p>
              </div>
            )}
            
            {/* Indicador de audio */}
            <div className="flex items-center gap-2 text-yellow-200 pulse-animation">
              <span className="text-2xl">🔊</span>
              <span>Escuchando a Chispa...</span>
            </div>
            
            {/* Botón continuar */}
            {showButton && (
              <button
                onClick={onContinue}
                className="bg-gradient-to-r from-green-400 to-green-600 text-white px-10 py-4 rounded-full font-bold text-xl shadow-lg flex items-center gap-3 btn-interactive fade-in-up"
              >
                <span className="pulse-animation">🟢</span>
                TOCA PARA CONTINUAR
              </button>
            )}
          </div>
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════
    // 📺 PANTALLA 3: Personalización
    // ═══════════════════════════════════════════════════════════════
    const PersonalizationScreen = ({ onContinue }) => {
      const [name, setName] = useState('');
      const [selectedAvatar, setSelectedAvatar] = useState(null);
      
      const avatars = ['🧒', '👧', '🧒🏽', '👧🏻', '🧒🏿', '👧🏾'];

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia-blue to-purple-900 p-8">
          <div className="flex flex-col items-center space-y-8 max-w-md w-full fade-in-up">
            <ChispaAvatar state="CURIOUS" size="md" />
            
            <h2 className="text-3xl font-bold text-yellow-400 text-center fade-in-up" style={{ animationDelay: '0.2s' }}>
              ¡Personaliza tu aventura!
            </h2>
            
            {/* Input de nombre */}
            <div className="w-full fade-in-up" style={{ animationDelay: '0.4s' }}>
              <label className="text-yellow-200 text-lg mb-2 block">¿Cómo te llamas?</label>
              <input
                type="text"
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="Escribe tu nombre..."
                className="w-full p-4 rounded-2xl bg-white/10 border-2 border-yellow-400/50 text-white text-xl placeholder-gray-400 focus:outline-none focus:border-yellow-400 transition-colors"
              />
            </div>
            
            {/* Selector de avatar */}
            <div className="w-full fade-in-up" style={{ animationDelay: '0.6s' }}>
              <label className="text-yellow-200 text-lg mb-3 block">Elige tu avatar:</label>
              <div className="flex justify-center gap-3 flex-wrap">
                {avatars.map((avatar, i) => (
                  <button
                    key={i}
                    onClick={() => setSelectedAvatar(i)}
                    className={`w-16 h-16 text-4xl rounded-2xl flex items-center justify-center transition-all btn-interactive ${
                      selectedAvatar === i 
                        ? 'bg-yellow-400 ring-4 ring-yellow-200' 
                        : 'bg-white/10 hover:bg-white/20'
                    }`}
                  >
                    {avatar}
                  </button>
                ))}
              </div>
            </div>
            
            {/* Botón continuar */}
            <button
              disabled={!name || selectedAvatar === null}
              onClick={onContinue}
              className="bg-gradient-to-r from-green-400 to-green-600 text-white px-10 py-4 rounded-full font-bold text-xl shadow-lg disabled:opacity-50 disabled:cursor-not-allowed btn-interactive fade-in-up"
              style={{ animationDelay: '0.8s' }}
            >
              ¡Comenzar aventura! 🚀
            </button>
          </div>
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════
    // 📺 PANTALLA 4: Explorador de Dispositivos
    // ═══════════════════════════════════════════════════════════════
    const DeviceExplorerScreen = () => {
      const [selectedDevice, setSelectedDevice] = useState(null);
      
      const devices = [
        { emoji: '📱', name: 'Teléfono', color: 'from-blue-400 to-blue-600', info: '¡Sirve para llamar y jugar!' },
        { emoji: '💻', name: 'Computadora', color: 'from-purple-400 to-purple-600', info: '¡Puedes hacer tareas y dibujar!' },
        { emoji: '🎮', name: 'Consola', color: 'from-green-400 to-green-600', info: '¡Para jugar videojuegos!' },
        { emoji: '📺', name: 'Televisor', color: 'from-red-400 to-red-600', info: '¡Para ver películas y caricaturas!' },
      ];

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia-blue to-indigo-900 p-8 overflow-auto">
          <ChispaAvatar state="CELEBRATING" size="md" />
          
          <h2 className="text-3xl font-bold text-yellow-400 mt-6 mb-8 text-center fade-in-up">
            🎉 ¡Explora los dispositivos! 🎉
          </h2>
          
          <div className="grid grid-cols-2 gap-4 max-w-sm">
            {devices.map((device, i) => (
              <button
                key={device.name}
                onClick={() => setSelectedDevice(selectedDevice === i ? null : i)}
                className={`bg-gradient-to-br ${device.color} p-6 rounded-3xl shadow-xl cursor-pointer flex flex-col items-center btn-interactive fade-in-scale ${
                  selectedDevice === i ? 'ring-4 ring-yellow-400 scale-105' : ''
                }`}
                style={{ animationDelay: `${0.2 + i * 0.15}s` }}
              >
                <span className="text-5xl mb-2">{device.emoji}</span>
                <span className="text-white font-bold text-lg">{device.name}</span>
              </button>
            ))}
          </div>
          
          {/* Info del dispositivo seleccionado */}
          {selectedDevice !== null && (
            <div className="mt-6 bg-white/20 p-4 rounded-2xl max-w-sm text-center fade-in-scale">
              <p className="text-yellow-200 text-lg">
                <span className="text-2xl mr-2">{devices[selectedDevice].emoji}</span>
                {devices[selectedDevice].info}
              </p>
            </div>
          )}
          
          <p className="text-yellow-200 mt-6 text-center fade-in-up" style={{ animationDelay: '1s' }}>
            ¡Toca un dispositivo para aprender más! ✨
          </p>
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════
    // 🎬 APLICACIÓN PRINCIPAL
    // ═══════════════════════════════════════════════════════════════
    const App = () => {
      const [currentScreen, setCurrentScreen] = useState('SPLASH');
      const [isTransitioning, setIsTransitioning] = useState(false);
      
      const changeScreen = (newScreen) => {
        setIsTransitioning(true);
        setTimeout(() => {
          setCurrentScreen(newScreen);
          setIsTransitioning(false);
        }, 400);
      };

      const renderScreen = () => {
        switch(currentScreen) {
          case 'SPLASH':
            return <SplashScreen onComplete={() => changeScreen('WELCOME')} />;
          case 'WELCOME':
            return <WelcomeScreen onContinue={() => changeScreen('PERSONALIZATION')} />;
          case 'PERSONALIZATION':
            return <PersonalizationScreen onContinue={() => changeScreen('EXPLORER')} />;
          case 'EXPLORER':
            return <DeviceExplorerScreen />;
          default:
            return null;
        }
      };

      return (
        <div className="w-full h-full overflow-hidden relative bg-avia-blue">
          <div 
            className={`h-full w-full ${isTransitioning ? 'screen-transition-exit' : 'screen-transition-enter'}`}
            key={currentScreen}
          >
            {renderScreen()}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
