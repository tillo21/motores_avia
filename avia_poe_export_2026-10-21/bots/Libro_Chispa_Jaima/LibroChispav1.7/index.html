<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVIA Chispa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; overflow: hidden; background: #1A1A2E; }
    #root { height: 100vh; width: 100vw; }
    
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes sparkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(20deg); } 75% { transform: rotate(-20deg); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.5); } 50% { box-shadow: 0 0 40px rgba(255,215,0,0.8); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeScale { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    @keyframes confetti { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    @keyframes starPop { 0% { transform: scale(0); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    @keyframes particle { 0% { opacity: 0; transform: scale(0); } 50% { opacity: 1; } 100% { opacity: 0; transform: scale(1.5); } }
    
    .anim-float { animation: float 3s ease-in-out infinite; }
    .anim-sparkle { animation: sparkle 1.5s ease-in-out infinite; }
    .anim-wave { animation: wave 0.5s ease-in-out 3; }
    .anim-glow { animation: glow 2s ease-in-out infinite; }
    .anim-fadeUp { animation: fadeUp 0.6s ease-out forwards; }
    .anim-fadeScale { animation: fadeScale 0.5s ease-out forwards; }
    .anim-slideIn { animation: slideIn 0.5s ease-out forwards; }
    .anim-bounce { animation: bounce 1s ease-in-out infinite; }
    .anim-pulse { animation: pulse 1.5s ease-in-out infinite; }
    .anim-blink { animation: blink 4s ease-in-out infinite; }
    .anim-shake { animation: shake 0.3s ease-in-out; }
    .anim-starPop { animation: starPop 0.5s ease-out forwards; }
    
    .btn { transition: transform 0.15s; cursor: pointer; }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.95); }
    
    .bubble::before { 
      content: ''; position: absolute; top: -12px; left: 50%; 
      transform: translateX(-50%); border: 12px solid transparent; 
      border-bottom-color: white; 
    }
  </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { avia: '#1A1A2E', gold: '#FFD700' } } } };
  </script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    // === COMPONENTES SIMPLES ===
    
    function Particles() {
      var items = [];
      for (var i = 0; i < 20; i++) {
        items.push(
          <div
            key={i}
            className="absolute rounded-full bg-gradient-to-br from-yellow-300 to-yellow-500"
            style={{
              width: 6 + Math.random() * 8,
              height: 6 + Math.random() * 8,
              left: Math.random() * 100 + '%',
              top: Math.random() * 100 + '%',
              animation: 'particle 2s ease-in-out ' + (i * 0.1) + 's forwards'
            }}
          />
        );
      }
      return <div className="absolute inset-0 overflow-hidden pointer-events-none">{items}</div>;
    }

    function Confetti() {
      var colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7'];
      var items = [];
      for (var i = 0; i < 40; i++) {
        items.push(
          <div
            key={i}
            className="absolute"
            style={{
              left: Math.random() * 100 + '%',
              top: -20,
              width: 8 + Math.random() * 8,
              height: 8 + Math.random() * 8,
              backgroundColor: colors[Math.floor(Math.random() * colors.length)],
              borderRadius: Math.random() > 0.5 ? '50%' : '2px',
              animation: 'confetti ' + (2 + Math.random() * 2) + 's ease-in ' + (Math.random() * 2) + 's forwards'
            }}
          />
        );
      }
      return <div className="absolute inset-0 overflow-hidden pointer-events-none z-50">{items}</div>;
    }

    function Chispa(props) {
      var state = props.state || 'IDLE';
      var size = props.size || 'md';
      var onClick = props.onClick;
      var waving = React.useState(false);
      var isWaving = waving[0];
      var setWaving = waving[1];
      
      var sizes = { sm: 'w-20 h-20', md: 'w-32 h-32', lg: 'w-40 h-40', xl: 'w-48 h-48' };
      var animClass = state === 'HAPPY' ? 'anim-float anim-glow' : state === 'CELEBRATING' ? 'anim-sparkle' : state === 'CURIOUS' ? 'anim-bounce' : '';

      function handleClick() {
        setWaving(true);
        setTimeout(function() { setWaving(false); }, 1500);
        if (onClick) onClick();
      }

      return (
        <div onClick={handleClick} className={sizes[size] + ' relative cursor-pointer btn'}>
          <div className={'w-full h-full rounded-full bg-gradient-to-br from-yellow-300 via-yellow-400 to-orange-400 border-4 border-white shadow-xl flex items-center justify-center ' + animClass}>
            <div className="flex flex-col items-center">
              <div className="flex gap-3 mb-2">
                <div className={'w-3 h-3 bg-gray-800 rounded-full ' + (state === 'HAPPY' ? 'anim-blink' : '')}></div>
                <div className={'w-3 h-3 bg-gray-800 rounded-full ' + (state === 'HAPPY' ? 'anim-blink' : '')}></div>
              </div>
              <div className="w-6 h-3 border-b-4 border-gray-800 rounded-b-full"></div>
            </div>
          </div>
          <span className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1 text-lg anim-sparkle">✨</span>
          <span className="absolute top-1/4 right-0 translate-x-1 text-lg anim-sparkle" style={{animationDelay: '0.3s'}}>✨</span>
          {(state === 'HAPPY' || isWaving) && <span className={'absolute -top-1 -right-1 text-2xl anim-fadeScale ' + (isWaving ? 'anim-wave' : '')}>👋</span>}
        </div>
      );
    }

    function BackBtn(props) {
      return (
        <button onClick={props.onClick} className="absolute top-5 left-5 z-50 w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center btn">
          <svg className="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
      );
    }

    function NextBtn(props) {
      var disabled = props.disabled;
      return (
        <button onClick={disabled ? null : props.onClick} className={'absolute top-5 right-5 z-50 w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center btn ' + (disabled ? 'opacity-40' : '')}>
          <svg className="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>
      );
    }

    function Toast(props) {
      if (!props.message) return null;
      var colors = { error: 'from-orange-500 to-red-500', hint: 'from-purple-500 to-pink-500', success: 'from-green-500 to-green-600' };
      var icons = { error: '😮', hint: '🤔', success: '😊' };
      
      React.useEffect(function() {
        var t = setTimeout(props.onClose, 4000);
        return function() { clearTimeout(t); };
      }, [props.message]);

      return (
        <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 max-w-sm w-full px-4 anim-fadeUp">
          <div className={'bg-gradient-to-r p-4 rounded-2xl shadow-2xl flex items-center gap-3 ' + colors[props.type]}>
            <div className="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center border-2 border-white">
              <span>{icons[props.type]}</span>
            </div>
            <p className="text-white font-medium text-sm flex-1">{props.message}</p>
            <button onClick={props.onClose} className="text-white/70 hover:text-white">✕</button>
          </div>
        </div>
      );
    }

    // === PANTALLAS ===

    function Splash(props) {
      var showStar = React.useState(false);
      var showTitle = React.useState(false);
      var showSub = React.useState(false);

      React.useEffect(function() {
        setTimeout(function() { showStar[1](true); }, 300);
        setTimeout(function() { showTitle[1](true); }, 1200);
        setTimeout(function() { showSub[1](true); }, 1800);
        setTimeout(props.onDone, 3500);
      }, []);

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia via-indigo-900 to-purple-900 relative overflow-hidden">
          <Particles />
          {showStar[0] && <div className="text-8xl mb-8 z-10 anim-fadeScale">⭐</div>}
          {showTitle[0] && <h1 className="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500 z-10 text-center px-4 anim-fadeUp">AVIA CONSTELACIÓN</h1>}
          {showSub[0] && <p className="text-xl text-yellow-200 mt-4 z-10 anim-fadeUp">✨ Aprendiendo juntos ✨</p>}
          <div className="absolute bottom-20 flex gap-2">
            <div className="w-3 h-3 rounded-full bg-yellow-400 anim-pulse"></div>
            <div className="w-3 h-3 rounded-full bg-yellow-400 anim-pulse" style={{animationDelay: '0.2s'}}></div>
            <div className="w-3 h-3 rounded-full bg-yellow-400 anim-pulse" style={{animationDelay: '0.4s'}}></div>
          </div>
        </div>
      );
    }

    function Welcome(props) {
      var showDialog = React.useState(false);
      var showBtn = React.useState(false);
      var text = React.useState('');
      var fullText = '¡Hola! Soy Chispa ✨\n¡Vamos a aprender juntos!';

      React.useEffect(function() {
        setTimeout(function() { showDialog[1](true); }, 500);
      }, []);

      React.useEffect(function() {
        if (showDialog[0] && text[0].length < fullText.length) {
          var t = setTimeout(function() { text[1](fullText.slice(0, text[0].length + 1)); }, 40);
          return function() { clearTimeout(t); };
        } else if (text[0].length === fullText.length) {
          setTimeout(function() { showBtn[1](true); }, 300);
        }
      }, [showDialog[0], text[0]]);

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia via-indigo-900 to-purple-900 p-8">
          <div className="flex flex-col items-center text-center space-y-6 max-w-md anim-fadeUp">
            <Chispa state="HAPPY" size="xl" />
            {showDialog[0] && (
              <div className="bg-white text-gray-800 p-6 rounded-3xl shadow-2xl relative bubble min-h-20 anim-fadeScale">
                <p className="text-lg font-bold whitespace-pre-line">{text[0]}<span className="anim-pulse inline-block">|</span></p>
              </div>
            )}
            {showBtn[0] && (
              <button onClick={props.onNext} className="bg-gradient-to-r from-green-400 to-green-600 text-white px-8 py-4 rounded-full font-bold text-lg shadow-lg flex items-center gap-3 btn anim-fadeUp">
                <span className="anim-pulse">🟢</span>CONTINUAR
              </button>
            )}
          </div>
        </div>
      );
    }

    function Personalization(props) {
      var name = React.useState('');
      var avatar = React.useState(null);
      var toast = React.useState(null);
      var avatars = ['👦', '👧', '👦🏽', '👧🏽', '👦🏾', '👧🏾'];

      function handleContinue() {
        if (!name[0].trim()) {
          toast[1]({ type: 'error', msg: '¡Primero escribe tu nombre!' });
          return;
        }
        if (avatar[0] === null) {
          toast[1]({ type: 'hint', msg: '¡Elige tu avatar! Es la imagen que te representa.' });
          return;
        }
        props.setUser({ name: name[0], avatar: avatars[avatar[0]] });
        props.onNext();
      }

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia to-purple-900 p-6 relative">
          <BackBtn onClick={props.onBack} />
          <Toast message={toast[0] ? toast[0].msg : null} type={toast[0] ? toast[0].type : 'hint'} onClose={function() { toast[1](null); }} />
          
          <div className="flex flex-col items-center space-y-5 max-w-md w-full anim-fadeUp">
            <Chispa state="CURIOUS" size="md" />
            <h2 className="text-2xl font-bold text-yellow-400 text-center">¡Personaliza tu aventura!</h2>
            
            <div className="w-full">
              <label className="text-yellow-200 text-lg mb-2 block">¿Cómo te llamas?</label>
              <input
                type="text"
                value={name[0]}
                onChange={function(e) { name[1](e.target.value); }}
                placeholder="Escribe tu nombre..."
                className={'w-full p-4 rounded-2xl bg-white/10 border-2 text-white text-xl placeholder-gray-400 focus:outline-none ' + (!name[0] && toast[0] ? 'border-orange-400' : 'border-yellow-400/50 focus:border-yellow-400')}
              />
            </div>

            <div className="w-full">
              <label className="text-yellow-200 text-lg mb-3 block">Elige tu avatar:</label>
              <div className={'flex justify-center gap-3 flex-wrap p-3 rounded-2xl ' + (avatar[0] === null && toast[0] ? 'ring-2 ring-orange-400 bg-orange-400/10' : '')}>
                {avatars.map(function(av, i) {
                  return (
                    <button
                      key={i}
                      onClick={function() { avatar[1](i); toast[1](null); }}
                      className={'w-14 h-14 text-3xl rounded-2xl flex items-center justify-center btn ' + (avatar[0] === i ? 'bg-yellow-400 ring-4 ring-yellow-200 scale-110' : 'bg-white/10 hover:bg-white/20')}
                    >
                      {av}
                    </button>
                  );
                })}
              </div>
              {avatar[0] === null && <p className="text-yellow-200/70 text-sm text-center mt-2">👆 Toca una carita</p>}
            </div>

            <button
              onClick={handleContinue}
              className={'bg-gradient-to-r from-green-400 to-green-600 text-white px-8 py-4 rounded-full font-bold text-lg shadow-lg btn ' + ((!name[0] || avatar[0] === null) ? 'opacity-70' : '')}
            >
              ¡Comenzar! 🚀
            </button>

            <div className="flex gap-4 text-sm">
              <span className={name[0] ? 'text-green-400' : 'text-white/50'}>{name[0] ? '✅' : '⬜'} Nombre</span>
              <span className={avatar[0] !== null ? 'text-green-400' : 'text-white/50'}>{avatar[0] !== null ? '✅' : '⬜'} Avatar</span>
            </div>
          </div>
        </div>
      );
    }

    function Explorer(props) {
      var sel = React.useState(null);
      var toast = React.useState(null);
      var devices = [
        { emoji: '📱', name: 'Teléfono', color: 'from-blue-400 to-blue-600', info: '¡Para llamar y jugar!' },
        { emoji: '💻', name: 'Computadora', color: 'from-purple-400 to-purple-600', info: '¡Para tareas y dibujar!' },
        { emoji: '🎮', name: 'Consola', color: 'from-green-400 to-green-600', info: '¡Para videojuegos!' },
        { emoji: '📺', name: 'Televisor', color: 'from-red-400 to-red-600', info: '¡Para películas!' }
      ];

      function handleNext() {
        if (sel[0] === null) {
          toast[1]({ type: 'hint', msg: '¡Primero elige un dispositivo!' });
          return;
        }
        props.setDevice(devices[sel[0]]);
        props.onNext();
      }

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia to-indigo-900 p-6 relative">
          <BackBtn onClick={props.onBack} />
          <NextBtn onClick={handleNext} disabled={sel[0] === null} />
          <Toast message={toast[0] ? toast[0].msg : null} type="hint" onClose={function() { toast[1](null); }} />

          <div className="flex items-center gap-3 mb-4">
            <Chispa state="CELEBRATING" size="sm" />
            {props.user && <div className="bg-white/20 px-4 py-2 rounded-full"><span className="text-yellow-200">{props.user.avatar} {props.user.name}</span></div>}
          </div>

          <h2 className="text-2xl font-bold text-yellow-400 mb-6 text-center">🎉 ¡Explora los dispositivos! 🎉</h2>

          <div className="grid grid-cols-2 gap-3 max-w-sm">
            {devices.map(function(d, i) {
              return (
                <button
                  key={i}
                  onClick={function() { sel[1](i); }}
                  className={'bg-gradient-to-br p-4 rounded-3xl shadow-xl flex flex-col items-center btn anim-fadeScale ' + d.color + (sel[0] === i ? ' ring-4 ring-yellow-400 scale-105' : '')}
                  style={{ animationDelay: (0.1 * i) + 's' }}
                >
                  <span className="text-4xl mb-2">{d.emoji}</span>
                  <span className="text-white font-bold">{d.name}</span>
                </button>
              );
            })}
          </div>

          {sel[0] !== null ? (
            <div className="mt-4 bg-white/20 p-4 rounded-2xl max-w-sm text-center anim-fadeScale">
              <p className="text-yellow-200"><span className="text-2xl mr-2">{devices[sel[0]].emoji}</span>{devices[sel[0]].info}</p>
              <p className="text-green-300 mt-2 text-sm">Toca ➡️ para continuar</p>
            </div>
          ) : (
            <p className="text-yellow-200 mt-6 text-center">¡Toca un dispositivo! ✨</p>
          )}
        </div>
      );
    }

    function Detail(props) {
      var cur = React.useState(0);
      var d = props.device;
      var factsMap = {
        'Teléfono': [{i:'📞',t:'Puedes llamar a tu familia'},{i:'📸',t:'Toma fotos'},{i:'🎵',t:'Escucha música'},{i:'🎮',t:'Juega juegos'}],
        'Computadora': [{i:'📝',t:'Escribe historias'},{i:'🎨',t:'Dibuja arte digital'},{i:'🌐',t:'Explora internet'},{i:'📹',t:'Haz videollamadas'}],
        'Consola': [{i:'🕹️',t:'Controles para jugar'},{i:'👥',t:'Juega con amigos'},{i:'🏆',t:'Gana trofeos'},{i:'🌍',t:'Mundos virtuales'}],
        'Televisor': [{i:'📺',t:'Programas favoritos'},{i:'🎬',t:'Películas en familia'},{i:'📡',t:'Conecta dispositivos'},{i:'🔊',t:'Sonido envolvente'}]
      };
      var facts = factsMap[d.name] || [];

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia to-indigo-900 p-6 relative">
          <BackBtn onClick={props.onBack} />
          <NextBtn onClick={props.onNext} />

          <div className="flex flex-col items-center space-y-6 max-w-md w-full">
            <div className="text-8xl anim-fadeScale">{d.emoji}</div>
            <h2 className="text-3xl font-bold text-yellow-400">{d.name}</h2>

            <div className="bg-white/10 p-6 rounded-3xl w-full min-h-36 flex flex-col items-center justify-center anim-fadeUp">
              <span className="text-5xl mb-4">{facts[cur[0]] ? facts[cur[0]].i : ''}</span>
              <p className="text-white text-xl text-center font-medium">{facts[cur[0]] ? facts[cur[0]].t : ''}</p>
            </div>

            <div className="flex items-center gap-4">
              <button onClick={function() { if(cur[0]>0) cur[1](cur[0]-1); }} disabled={cur[0]===0} className={'w-12 h-12 bg-white/20 rounded-full flex items-center justify-center btn ' + (cur[0]===0?'opacity-30':'')}>
                <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
              </button>
              <div className="flex gap-2">
                {facts.map(function(_,i) { return <div key={i} className={'w-3 h-3 rounded-full '+(i===cur[0]?'bg-yellow-400 scale-125':'bg-white/30')}></div>; })}
              </div>
              <button onClick={function() { if(cur[0]<facts.length-1) cur[1](cur[0]+1); }} disabled={cur[0]===facts.length-1} className={'w-12 h-12 bg-white/20 rounded-full flex items-center justify-center btn ' + (cur[0]===facts.length-1?'opacity-30':'')}>
                <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
              </button>
            </div>

            <Chispa state="CURIOUS" size="sm" />
            <p className="text-yellow-200 text-center text-sm">¡Usa las flechas! Luego toca ➡️</p>
          </div>
        </div>
      );
    }

    function Quiz(props) {
      var score = React.useState(0);
      var q = React.useState(0);
      var sel = React.useState(null);
      var fb = React.useState(null);
      var done = React.useState(false);
      var d = props.device;

      var qMap = {
        'Teléfono': [{q:'¿Qué puedes hacer con un teléfono?',a:['📞 Llamar','🚗 Conducir','✈️ Volar'],c:0},{q:'¿Dónde se guarda?',a:['🎒 Bolsillo','🌊 Agua','🔥 Fuego'],c:0}],
        'Computadora': [{q:'¿Para qué sirve?',a:['📝 Escribir','🏊 Nadar','🍳 Cocinar'],c:0},{q:'¿Qué tiene?',a:['⌨️ Teclado','🦷 Dientes','👂 Orejas'],c:0}],
        'Consola': [{q:'¿Qué haces con ella?',a:['🎮 Jugar','🧹 Barrer','🛏️ Dormir'],c:0},{q:'¿Qué usas para controlarla?',a:['🕹️ Control','🥄 Cuchara','📚 Libro'],c:0}],
        'Televisor': [{q:'¿Qué puedes ver?',a:['🎬 Películas','👃 Olores','🎵 Solo música'],c:0},{q:'¿Con qué cambias canal?',a:['📺 Control','🧲 Imán','🪥 Cepillo'],c:0}]
      };
      var qs = qMap[d.name] || qMap['Teléfono'];
      var curr = qs[q[0]];

      function answer(i) {
        if (sel[0] !== null) return;
        sel[1](i);
        var isCorrect = i === curr.c;
        if (isCorrect) score[1](score[0] + 1);
        fb[1](isCorrect ? 'correct' : 'wrong');
        setTimeout(function() {
          fb[1](null); sel[1](null);
          if (q[0] < qs.length - 1) { q[1](q[0] + 1); }
          else { done[1](true); }
        }, 1500);
      }

      if (done[0]) {
        var stars = Math.ceil((score[0] / qs.length) * 3);
        return (
          <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia to-purple-900 p-6 relative">
            <Confetti />
            <BackBtn onClick={props.onBack} />
            <div className="flex flex-col items-center space-y-6 text-center z-10">
              <Chispa state="CELEBRATING" size="lg" />
              <h2 className="text-3xl font-bold text-yellow-400 anim-fadeUp">🎉 ¡Excelente {props.user ? props.user.name : ''}! 🎉</h2>
              <div className="bg-white/20 p-6 rounded-3xl anim-fadeScale">
                <p className="text-white text-xl mb-4">¡Completaste el quiz!</p>
                <p className="text-yellow-300 text-lg mb-4">Puntuación: {score[0]}/{qs.length}</p>
                <div className="flex justify-center gap-2">
                  {[0,1,2].map(function(i) { return <span key={i} className="text-4xl anim-starPop" style={{animationDelay:(i*0.2)+'s'}}>{i<stars?'⭐':'☆'}</span>; })}
                </div>
              </div>
              <button onClick={props.onNext} className="bg-gradient-to-r from-green-400 to-green-600 text-white px-8 py-4 rounded-full font-bold text-lg shadow-lg btn">¡Continuar! 🚀</button>
            </div>
          </div>
        );
      }

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia to-indigo-900 p-6 relative">
          <BackBtn onClick={props.onBack} />
          <div className="flex flex-col items-center w-full max-w-md">
            <div className="flex items-center gap-2 mb-4">
              <span className="text-4xl">{d.emoji}</span>
              <div className="bg-white/20 px-4 py-1 rounded-full"><span className="text-yellow-300">Pregunta {q[0]+1}/{qs.length}</span></div>
            </div>
            <Chispa state={fb[0]==='correct' ? 'HAPPY' : 'CURIOUS'} size="sm" />
            <h2 className="text-xl font-bold text-white text-center my-6">{curr.q}</h2>

            {fb[0] && <div className={'mb-4 px-6 py-2 rounded-full font-bold anim-fadeScale text-white '+(fb[0]==='correct'?'bg-green-500':'bg-red-500')}>{fb[0]==='correct'?'¡Correcto! 🎉':'¡Casi!'}</div>}

            <div className="flex flex-col gap-3 w-full">
              {curr.a.map(function(ans, i) {
                var cls = 'bg-white/20 text-white hover:bg-white/30';
                if (sel[0] === i) cls = i === curr.c ? 'bg-green-500 text-white' : 'bg-red-500 text-white anim-shake';
                else if (sel[0] !== null && i === curr.c) cls = 'bg-green-500 text-white';
                return <button key={i} onClick={function(){answer(i);}} disabled={sel[0]!==null} className={'p-4 rounded-2xl text-lg font-bold btn '+cls}>{ans}</button>;
              })}
            </div>

            <div className="flex gap-2 mt-6">
              {qs.map(function(_,i) { return <div key={i} className={'w-4 h-4 rounded-full '+(i<q[0]?'bg-green-400':i===q[0]?'bg-yellow-400 scale-125':'bg-white/30')}></div>; })}
            </div>
          </div>
        </div>
      );
    }

    function Complete(props) {
      var showCert = React.useState(false);
      React.useEffect(function() { setTimeout(function() { showCert[1](true); }, 1500); }, []);
      var u = props.user || { name: 'Amigo', avatar: '👤' };

      return (
        <div className="h-full w-full flex flex-col items-center justify-center bg-gradient-to-b from-avia via-purple-900 to-indigo-900 p-6 relative overflow-hidden">
          <Confetti />
          <div className="flex flex-col items-center space-y-6 text-center z-10">
            <Chispa state="CELEBRATING" size="lg" />
            <h1 className="text-3xl font-bold text-yellow-400 anim-fadeUp">🏆 ¡Felicidades {u.name}! 🏆</h1>
            
            {showCert[0] && (
              <div className="bg-gradient-to-br from-yellow-100 to-yellow-200 p-6 rounded-3xl shadow-2xl max-w-sm anim-fadeScale">
                <div className="border-4 border-yellow-500 rounded-2xl p-4">
                  <h3 className="text-yellow-800 text-lg font-bold mb-2">📜 CERTIFICADO</h3>
                  <p className="text-gray-700 mb-4"><span className="text-2xl">{u.avatar}</span> <strong>{u.name}</strong></p>
                  <p className="text-gray-600 text-sm mb-4">Ha completado<br/><strong className="text-yellow-700">Explorador de Dispositivos</strong></p>
                  <div className="flex justify-center gap-1 mb-4">
                    {[0,1,2,3,4].map(function(i) { return <span key={i} className="text-2xl anim-starPop" style={{animationDelay:(1+i*0.15)+'s'}}>⭐</span>; })}
                  </div>
                  <p className="text-xs text-gray-500">AVIA Constelación ✨</p>
                </div>
              </div>
            )}
            
            <button onClick={props.onRestart} className="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-8 py-4 rounded-full font-bold text-lg shadow-lg btn mt-4">🔄 ¡Jugar de nuevo!</button>
          </div>
        </div>
      );
    }

    // === APP ===
    function App() {
      var screen = React.useState('SPLASH');
      var user = React.useState(null);
      var device = React.useState(null);

      function go(s) { screen[1](s); }
      function restart() { user[1](null); device[1](null); go('SPLASH'); }

      var s = screen[0];
      if (s === 'SPLASH') return <Splash onDone={function(){go('WELCOME');}} />;
      if (s === 'WELCOME') return <Welcome onNext={function(){go('PERSON');}} />;
      if (s === 'PERSON') return <Personalization onBack={function(){go('WELCOME');}} onNext={function(){go('EXPLORE');}} setUser={user[1]} />;
      if (s === 'EXPLORE') return <Explorer onBack={function(){go('PERSON');}} onNext={function(){go('DETAIL');}} user={user[0]} setDevice={device[1]} />;
      if (s === 'DETAIL') return <Detail onBack={function(){go('EXPLORE');}} onNext={function(){go('QUIZ');}} device={device[0]} />;
      if (s === 'QUIZ') return <Quiz onBack={function(){go('DETAIL');}} onNext={function(){go('COMPLETE');}} device={device[0]} user={user[0]} />;
      if (s === 'COMPLETE') return <Complete user={user[0]} onRestart={restart} />;
      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
