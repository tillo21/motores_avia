<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIA Senior — Sprint 5 Planning Board</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,wght@0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #FAFAF7;
  --bg-board: #F0EDE6;
  --bg-card: #FFFFFF;
  --bg-card-drag: #FFFDF5;
  --bg-column: #F5F3EE;
  --bg-input: #FFFFFF;
  --text: #1C1917;
  --text-sec: #57534E;
  --text-muted: #A8A29E;
  --accent: #B45309;
  --accent-bg: rgba(180, 83, 9, 0.08);
  --accent-border: rgba(180, 83, 9, 0.25);
  --blue: #1D4ED8;
  --blue-bg: rgba(29, 78, 216, 0.07);
  --green: #15803D;
  --green-bg: rgba(21, 128, 61, 0.07);
  --purple: #7E22CE;
  --purple-bg: rgba(126, 34, 206, 0.07);
  --rose: #BE123C;
  --rose-bg: rgba(190, 18, 60, 0.07);
  --teal: #0F766E;
  --teal-bg: rgba(15, 118, 110, 0.07);
  --border: #E7E5E4;
  --border-active: #D6D3D1;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.07);
  --shadow-drag: 0 12px 36px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 5px;
  --tr: 0.2s ease;
}

html.dark {
  --bg: #0C0A09;
  --bg-board: #1C1917;
  --bg-card: #292524;
  --bg-card-drag: #33302D;
  --bg-column: #1C1917;
  --bg-input: #292524;
  --text: #FAFAF9;
  --text-sec: #A8A29E;
  --text-muted: #57534E;
  --accent: #F59E0B;
  --accent-bg: rgba(245, 158, 11, 0.1);
  --accent-border: rgba(245, 158, 11, 0.3);
  --blue: #60A5FA;
  --blue-bg: rgba(96, 165, 250, 0.1);
  --green: #4ADE80;
  --green-bg: rgba(74, 222, 128, 0.08);
  --purple: #C084FC;
  --purple-bg: rgba(192, 132, 252, 0.08);
  --rose: #FB7185;
  --rose-bg: rgba(251, 113, 133, 0.08);
  --teal: #2DD4BF;
  --teal-bg: rgba(45, 212, 191, 0.08);
  --border: #292524;
  --border-active: #44403C;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-drag: 0 12px 36px rgba(0,0,0,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'IBM Plex Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }

/* ── App Shell ── */
.app { max-width:1400px; margin:0 auto; padding:16px 14px 40px; }

/* ── Header ── */
.hdr { display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; animation:fadeIn .5s ease; }
.hdr-left { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
.hdr-logo {
  width:40px; height:40px; border-radius:var(--radius-sm);
  background:var(--accent-bg); border:1px solid var(--accent-border);
  display:flex; align-items:center; justify-content:center;
  color:var(--accent); font-size:16px; flex-shrink:0;
}
.hdr h1 { font-family:'Literata',serif; font-weight:800; font-size:clamp(18px,3.5vw,24px); line-height:1.1; }
.hdr h1 em { font-style:italic; color:var(--accent); }
.sprint-pill {
  font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600;
  letter-spacing:1px; text-transform:uppercase; color:var(--accent);
  background:var(--accent-bg); border:1px solid var(--accent-border);
  padding:3px 10px; border-radius:100px; white-space:nowrap;
}

.hdr-actions { display:flex; gap:8px; flex-shrink:0; }
.btn {
  display:inline-flex; align-items:center; gap:6px;
  font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:600;
  padding:8px 14px; border-radius:100px; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text-sec); cursor:pointer;
  transition:var(--tr);
}
.btn:hover { border-color:var(--border-active); color:var(--text); box-shadow:var(--shadow-sm); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn i { font-size:11px; }
.btn-accent { background:var(--accent); color:#fff; border-color:var(--accent); }
html:not(.dark) .btn-accent { color:#fff; }
.btn-accent:hover { opacity:.9; }

/* ── Capacity Bar ── */
.capacity-bar { display:flex; align-items:center; gap:12px; margin-bottom:16px; padding:12px 16px; background:var(--bg-column); border:1px solid var(--border); border-radius:var(--radius-sm); flex-wrap:wrap; animation:fadeIn .5s ease .1s both; }
.cap-label { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
.cap-track { flex:1; min-width:120px; height:6px; background:var(--border); border-radius:4px; overflow:hidden; }
.cap-fill { height:100%; border-radius:4px; transition:width .5s ease; }
.cap-fill.ok { background:var(--green); }
.cap-fill.warn { background:var(--accent); }
.cap-fill.over { background:var(--rose); }
.cap-value { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; }
.cap-stat { display:flex; align-items:center; gap:5px; font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--text-muted); }
.cap-stat strong { color:var(--text); font-weight:600; }

/* ── Board ── */
.board { display:flex; gap:12px; overflow-x:auto; padding-bottom:12px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; animation:fadeIn .5s ease .2s both; }
.column { flex:0 0 280px; min-width:280px; scroll-snap-align:start; }
.col-header { display:flex; align-items:center; gap:8px; padding:10px 12px; margin-bottom:8px; }
.col-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.col-title { font-weight:700; font-size:13px; flex:1; }
.col-count { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); background:var(--bg-column); padding:2px 7px; border-radius:100px; }
.col-cards { min-height:60px; padding:4px; border-radius:var(--radius-sm); transition:background var(--tr); }
.col-cards.drag-over { background:var(--accent-bg); }

/* ── Cards ── */
.card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:12px; margin-bottom:8px; cursor:grab; transition:var(--tr);
  box-shadow:var(--shadow-sm); position:relative;
}
.card:hover { border-color:var(--border-active); box-shadow:var(--shadow-md); }
.card.dragging { opacity:.5; transform:rotate(2deg); box-shadow:var(--shadow-drag); cursor:grabbing; }
.card-top { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.card-id { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-muted); }
.card-priority {
  width:6px; height:6px; border-radius:50%; flex-shrink:0;
}
.card-priority.high { background:var(--rose); }
.card-priority.medium { background:var(--accent); }
.card-priority.low { background:var(--green); }
.card-title-text { font-weight:600; font-size:13px; line-height:1.4; margin-bottom:6px; }
.card-desc { font-size:11.5px; color:var(--text-sec); line-height:1.45; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-footer { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card-tag {
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:500;
  padding:2px 7px; border-radius:100px;
}
.tag-feature { background:var(--blue-bg); color:var(--blue); }
.tag-bug { background:var(--rose-bg); color:var(--rose); }
.tag-tech { background:var(--purple-bg); color:var(--purple); }
.tag-test { background:var(--green-bg); color:var(--green); }
.tag-ux { background:var(--teal-bg); color:var(--teal); }
.card-pts {
  margin-left:auto; font-family:'IBM Plex Mono',monospace;
  font-size:10px; font-weight:600; color:var(--text-muted);
  background:var(--bg-column); padding:2px 6px; border-radius:4px;
}
.card-delete {
  position:absolute; top:8px; right:8px; width:20px; height:20px;
  border:none; background:transparent; color:var(--text-muted);
  cursor:pointer; font-size:10px; border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:var(--tr);
}
.card:hover .card-delete { opacity:1; }
.card-delete:hover { background:var(--rose-bg); color:var(--rose); }

/* ── Add Card Form ── */
.add-btn {
  width:100%; padding:8px; border:1px dashed var(--border);
  border-radius:var(--radius-sm); background:transparent;
  color:var(--text-muted); font-family:'IBM Plex Sans',sans-serif;
  font-size:12px; cursor:pointer; transition:var(--tr);
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.add-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }

.add-form { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; display:none; }
.add-form.active { display:block; }
.add-form input, .add-form textarea, .add-form select {
  width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:14px;
  padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-xs);
  background:var(--bg-input); color:var(--text); margin-bottom:8px;
  transition:border-color var(--tr); outline:none; resize:vertical;
}
.add-form input:focus, .add-form textarea:focus, .add-form select:focus { border-color:var(--accent); }
.add-form textarea { min-height:48px; font-size:13px; }
.add-form select { font-size:13px; cursor:pointer; }
.form-row { display:flex; gap:8px; }
.form-row > * { flex:1; }
.form-actions { display:flex; gap:6px; justify-content:flex-end; }
.btn-sm { font-size:11px; padding:6px 12px; border-radius:var(--radius-xs); }

/* ── AI Panel ── */
.ai-panel {
  margin-top:20px; background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden;
  animation:fadeIn .5s ease .35s both;
}
.ai-bar { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.ai-badge { width:32px; height:32px; border-radius:var(--radius-xs); background:var(--accent-bg); border:1px solid var(--accent-border); display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:14px; flex-shrink:0; }
.ai-bar-title { font-weight:700; font-size:14px; }
.ai-bar-sub { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); }
.ai-bar-actions { margin-left:auto; display:flex; gap:6px; }
.ai-body { padding:16px; min-height:60px; }
.ai-placeholder { color:var(--text-muted); font-size:12.5px; font-style:italic; display:flex; align-items:center; gap:7px; }
.ai-md { font-size:13.5px; line-height:1.7; color:var(--text-sec); }
.ai-md h1,.ai-md h2,.ai-md h3,.ai-md h4 { color:var(--text); margin:14px 0 6px; }
.ai-md h2 { font-size:16px; border-bottom:1px solid var(--border); padding-bottom:5px; }
.ai-md h3 { font-size:14px; }
.ai-md p { margin-bottom:8px; }
.ai-md ul,.ai-md ol { margin:4px 0 10px 16px; }
.ai-md li { margin-bottom:4px; }
.ai-md code { font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--bg-column); padding:1px 5px; border-radius:3px; color:var(--accent); }
.ai-md pre { background:var(--bg-column); border:1px solid var(--border); border-radius:var(--radius-xs); padding:10px; overflow-x:auto; margin:8px 0; }
.ai-md pre code { background:none; padding:0; color:var(--text); }
.ai-md strong { color:var(--text); }
.ai-md table { width:100%; border-collapse:collapse; margin:8px 0; font-size:12px; }
.ai-md th,.ai-md td { border:1px solid var(--border); padding:6px 8px; text-align:left; }
.ai-md th { background:var(--bg-column); font-weight:600; color:var(--text); }
.ai-md blockquote { border-left:3px solid var(--accent); padding:4px 12px; margin:8px 0; background:var(--accent-bg); border-radius:0 var(--radius-xs) var(--radius-xs) 0; }

.typing { display:inline-flex; align-items:center; gap:3px; }
.typing span { width:5px; height:5px; background:var(--accent); border-radius:50%; animation:bounce 1.2s ease-in-out infinite; }
.typing span:nth-child(2) { animation-delay:.15s; }
.typing span:nth-child(3) { animation-delay:.3s; }

.spin { display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }

/* ── Confirm Modal ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:999; animation:fadeIn .2s ease; }
.modal-box { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; max-width:360px; width:90%; box-shadow:var(--shadow-drag); }
.modal-box p { font-size:14px; color:var(--text-sec); margin-bottom:16px; line-height:1.5; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; }

/* ── Footer ── */
.footer { text-align:center; padding:20px; color:var(--text-muted); font-size:11px; font-family:'IBM Plex Mono',monospace; }

@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
@keyframes spin { to{transform:rotate(360deg)} }

@media(max-width:700px) {
  .column { flex:0 0 260px; min-width:260px; }
  .hdr { gap:10px; }
  .hdr-actions { width:100%; }
  .hdr-actions .btn { flex:1; justify-content:center; }
  .capacity-bar { padding:10px 12px; gap:8px; }
  .ai-bar-actions { width:100%; margin-left:0; margin-top:6px; }
  .ai-bar-actions .btn { flex:1; justify-content:center; }
}

::-webkit-scrollbar { height:5px; width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-active); border-radius:3px; }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-logo"><i class="fas fa-columns"></i></div>
      <div>
        <h1>AVIA <em>Senior</em></h1>
        <span class="sprint-pill"><i class="fas fa-flag"></i> Sprint 5 Planning</span>
      </div>
    </div>
    <div class="hdr-actions">
      <button class="btn" id="btnExport"><i class="fas fa-download"></i> Exportar</button>
      <button class="btn btn-accent" id="btnAiGenerate"><i class="fas fa-wand-magic-sparkles"></i> Generar Stories IA</button>
    </div>
  </div>

  <!-- Capacity -->
  <div class="capacity-bar">
    <span class="cap-label">Capacidad Sprint</span>
    <div class="cap-track"><div class="cap-fill ok" id="capFill" style="width:0%"></div></div>
    <span class="cap-value" id="capValue">0 / 45 pts</span>
    <span class="cap-stat"><i class="fas fa-layer-group"></i> <strong id="statCards">0</strong> cards</span>
    <span class="cap-stat"><i class="fas fa-fire"></i> Vel: <strong>42</strong></span>
  </div>

  <!-- Board -->
  <div class="board" id="board"></div>

  <!-- AI Panel -->
  <div class="ai-panel">
    <div class="ai-bar">
      <div class="ai-badge"><i class="fas fa-robot"></i></div>
      <div>
        <div class="ai-bar-title">Sprint Intelligence</div>
        <div class="ai-bar-sub">Claude Sonnet 4.5</div>
      </div>
      <div class="ai-bar-actions">
        <button class="btn btn-sm" id="btnAiSuggest"><i class="fas fa-lightbulb"></i> Sugerencias</button>
        <button class="btn btn-sm" id="btnAiEstimate"><i class="fas fa-calculator"></i> Re-estimar</button>
      </div>
    </div>
    <div class="ai-body">
      <div class="ai-md" id="aiOutput">
        <div class="ai-placeholder"><i class="fas fa-sparkles"></i> Usa los botones de IA para obtener sugerencias de planning o re-estimaci&oacute;n</div>
      </div>
    </div>
  </div>

  <div class="footer">AVIA Senior &middot; Sprint 5 Planning Board &middot; <span style="color:var(--accent)">Claude Sonnet 4.5</span></div>
</div>

<script>
/* ═══════ Dark Mode ═══════ */
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches){document.documentElement.classList.add("dark")}
  window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change",function(e){document.documentElement.classList.toggle("dark",e.matches)});
})();

if(typeof marked!=="undefined"){marked.setOptions({breaks:true,gfm:true})}

/* ═══════ Column Definitions ═══════ */
var COLUMNS = [
  { id:"backlog", title:"Backlog", color:"var(--text-muted)", cards:[] },
  { id:"todo",    title:"To Do",   color:"var(--blue)",   cards:[] },
  { id:"doing",   title:"In Progress", color:"var(--accent)", cards:[] },
  { id:"review",  title:"Review",  color:"var(--purple)", cards:[] },
  { id:"done",    title:"Done",    color:"var(--green)",  cards:[] }
];

/* ═══════ Seed Data (from Sprint 4 carryover) ═══════ */
var nextId = 1;
function sid() { return "AS-" + (100 + nextId++); }

var INITIAL_CARDS = [
  { id:sid(), col:"backlog", title:"Completar tests E2E principales", desc:"Pendiente de Sprint 4: cubrir flujos cr\u00edticos de pacientes y terapias", priority:"high", tag:"test", pts:5 },
  { id:sid(), col:"backlog", title:"Resolver deuda t\u00e9cnica cr\u00edtica", desc:"Refactorizar servicios de autenticaci\u00f3n y optimizar queries N+1", priority:"high", tag:"tech", pts:8 },
  { id:sid(), col:"backlog", title:"Implementar micro-interacciones UI", desc:"Pendiente de Sprint 4: transiciones, feedback visual en formularios", priority:"medium", tag:"ux", pts:3 },
  { id:sid(), col:"backlog", title:"Generar changelog Sprint 4", desc:"Documentar todos los cambios, features y fixes del sprint anterior", priority:"low", tag:"tech", pts:2 },
  { id:sid(), col:"todo", title:"M\u00f3dulo de reportes mensuales", desc:"Dashboard con m\u00e9tricas de ocupaci\u00f3n, terapias realizadas y estado de pacientes", priority:"high", tag:"feature", pts:8 },
  { id:sid(), col:"todo", title:"Sistema de notificaciones push", desc:"Alertas en tiempo real para cuidadores: medicaci\u00f3n, citas, emergencias", priority:"high", tag:"feature", pts:5 },
  { id:sid(), col:"todo", title:"Exportaci\u00f3n PDF de historiales", desc:"Generar PDFs con formato cl\u00ednico est\u00e1ndar desde historial de paciente", priority:"medium", tag:"feature", pts:5 },
  { id:sid(), col:"doing", title:"Optimizar rendimiento del dashboard", desc:"Lazy loading de componentes, cach\u00e9 de API calls, virtualizaci\u00f3n de listas", priority:"medium", tag:"tech", pts:3 },
  { id:sid(), col:"review", title:"Migrar autenticaci\u00f3n a OAuth 2.0", desc:"Reemplazar JWT custom por flujo OAuth con refresh tokens", priority:"high", tag:"tech", pts:5 }
];

INITIAL_CARDS.forEach(function(c) {
  var col = COLUMNS.find(function(cl){return cl.id===c.col});
  if(col){col.cards.push(c)}
});

var SPRINT_CAPACITY = 45;
var draggedCard = null;
var draggedFrom = null;

/* ═══════ Render Board ═══════ */
function renderBoard() {
  var board = document.getElementById("board");
  board.innerHTML = "";

  COLUMNS.forEach(function(col) {
    var colEl = document.createElement("div");
    colEl.className = "column";
    colEl.dataset.colId = col.id;

    var hdr = document.createElement("div");
    hdr.className = "col-header";
    hdr.innerHTML = '<span class="col-dot" style="background:'+col.color+'"></span>' +
      '<span class="col-title">'+col.title+'</span>' +
      '<span class="col-count">'+col.cards.length+'</span>';

    var cardsEl = document.createElement("div");
    cardsEl.className = "col-cards";
    cardsEl.dataset.colId = col.id;

    // Drag events on drop zone
    cardsEl.addEventListener("dragover", function(e) { e.preventDefault(); cardsEl.classList.add("drag-over"); });
    cardsEl.addEventListener("dragleave", function() { cardsEl.classList.remove("drag-over"); });
    cardsEl.addEventListener("drop", function(e) {
      e.preventDefault();
      cardsEl.classList.remove("drag-over");
      if(!draggedCard || !draggedFrom) return;
      var targetCol = col.id;
      if(draggedFrom === targetCol) return;
      // Move card
      var srcCol = COLUMNS.find(function(c){return c.id===draggedFrom});
      var idx = srcCol.cards.findIndex(function(c){return c.id===draggedCard});
      if(idx===-1) return;
      var card = srcCol.cards.splice(idx,1)[0];
      card.col = targetCol;
      col.cards.push(card);
      draggedCard=null; draggedFrom=null;
      renderBoard();
      updateCapacity();
    });

    col.cards.forEach(function(card) {
      var el = createCardEl(card, col.id);
      cardsEl.appendChild(el);
    });

    // Add form
    var formWrap = document.createElement("div");
    formWrap.innerHTML = buildAddForm(col.id);

    colEl.appendChild(hdr);
    colEl.appendChild(cardsEl);
    colEl.appendChild(formWrap);
    board.appendChild(colEl);
  });

  updateCapacity();
  bindAddForms();
}

function createCardEl(card, colId) {
  var el = document.createElement("div");
  el.className = "card";
  el.draggable = true;
  el.dataset.cardId = card.id;

  el.addEventListener("dragstart", function(e) {
    draggedCard = card.id;
    draggedFrom = colId;
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  el.addEventListener("dragend", function() { el.classList.remove("dragging"); });

  var tagClass = "tag-" + card.tag;
  var tagLabels = { feature:"Feature", bug:"Bug", tech:"Tech Debt", test:"Testing", ux:"UX/UI" };
  var prioLabels = { high:"Alta", medium:"Media", low:"Baja" };

  el.innerHTML =
    '<button class="card-delete" data-card-id="'+card.id+'" data-col-id="'+colId+'" title="Eliminar"><i class="fas fa-xmark"></i></button>' +
    '<div class="card-top"><span class="card-priority '+card.priority+'"></span><span class="card-id">'+card.id+'</span><span style="margin-left:auto;font-size:10px;color:var(--text-muted)">'+prioLabels[card.priority]+'</span></div>' +
    '<div class="card-title-text">'+card.title+'</div>' +
    (card.desc ? '<div class="card-desc">'+card.desc+'</div>' : '') +
    '<div class="card-footer"><span class="card-tag '+tagClass+'">'+(tagLabels[card.tag]||card.tag)+'</span><span class="card-pts">'+card.pts+' pts</span></div>';

  // Delete handler
  el.querySelector(".card-delete").addEventListener("click", function(e) {
    e.stopPropagation();
    showConfirm("\u00bfEliminar la card " + card.id + "?", function() {
      var col = COLUMNS.find(function(c){return c.id===colId});
      var idx = col.cards.findIndex(function(c){return c.id===card.id});
      if(idx!==-1){ col.cards.splice(idx,1); }
      renderBoard();
      updateCapacity();
    });
  });

  return el;
}

function buildAddForm(colId) {
  return '<div class="add-form" id="form-'+colId+'">' +
    '<input type="text" placeholder="T\u00edtulo de la story..." id="input-title-'+colId+'" />' +
    '<textarea placeholder="Descripci\u00f3n (opcional)..." id="input-desc-'+colId+'"></textarea>' +
    '<div class="form-row">' +
      '<select id="input-tag-'+colId+'"><option value="feature">Feature</option><option value="bug">Bug</option><option value="tech">Tech Debt</option><option value="test">Testing</option><option value="ux">UX/UI</option></select>' +
      '<select id="input-prio-'+colId+'"><option value="medium">Media</option><option value="high">Alta</option><option value="low">Baja</option></select>' +
      '<select id="input-pts-'+colId+'"><option value="1">1 pt</option><option value="2">2 pts</option><option value="3" selected>3 pts</option><option value="5">5 pts</option><option value="8">8 pts</option><option value="13">13 pts</option></select>' +
    '</div>' +
    '<div class="form-actions">' +
      '<button class="btn btn-sm" onclick="closeForm(\''+colId+'\')">Cancelar</button>' +
      '<button class="btn btn-sm btn-accent" onclick="submitForm(\''+colId+'\')">A\u00f1adir</button>' +
    '</div>' +
  '</div>' +
  '<button class="add-btn" onclick="openForm(\''+colId+'\')"><i class="fas fa-plus"></i> A\u00f1adir card</button>';
}

function bindAddForms() {
  // Forms are bound via inline onclick
}

 
function openForm(colId) {
  var f = document.getElementById("form-"+colId);
  if(f) f.classList.add("active");
}

 
function closeForm(colId) {
  var f = document.getElementById("form-"+colId);
  if(f){ f.classList.remove("active"); }
  var ti = document.getElementById("input-title-"+colId);
  var de = document.getElementById("input-desc-"+colId);
  if(ti) ti.value="";
  if(de) de.value="";
}

 
function submitForm(colId) {
  var ti = document.getElementById("input-title-"+colId);
  var de = document.getElementById("input-desc-"+colId);
  var tg = document.getElementById("input-tag-"+colId);
  var pr = document.getElementById("input-prio-"+colId);
  var pt = document.getElementById("input-pts-"+colId);
  if(!ti || !ti.value.trim()) return;

  var card = {
    id: sid(),
    col: colId,
    title: ti.value.trim(),
    desc: de ? de.value.trim() : "",
    priority: pr ? pr.value : "medium",
    tag: tg ? tg.value : "feature",
    pts: pt ? parseInt(pt.value, 10) : 3
  };

  var col = COLUMNS.find(function(c){return c.id===colId});
  if(col){ col.cards.push(card); }
  renderBoard();
  updateCapacity();
}

/* ═══════ Capacity ═══════ */
function updateCapacity() {
  var total = 0;
  var count = 0;
  COLUMNS.forEach(function(col) {
    col.cards.forEach(function(c) { total += c.pts; count++; });
  });
  var pct = Math.min(Math.round((total/SPRINT_CAPACITY)*100), 100);
  var fill = document.getElementById("capFill");
  fill.style.width = pct + "%";
  fill.className = "cap-fill " + (pct <= 80 ? "ok" : pct <= 100 ? "warn" : "over");
  document.getElementById("capValue").textContent = total + " / " + SPRINT_CAPACITY + " pts";
  document.getElementById("statCards").textContent = count;
}

/* ═══════ Confirm Dialog ═══════ */
function showConfirm(message, onConfirm) {
  var overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = '<div class="modal-box"><p>'+message+'</p><div class="modal-actions">' +
    '<button class="btn btn-sm" id="modalCancel">Cancelar</button>' +
    '<button class="btn btn-sm btn-accent" id="modalOk">Eliminar</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector("#modalCancel").addEventListener("click",function(){overlay.remove()});
  overlay.querySelector("#modalOk").addEventListener("click",function(){overlay.remove();onConfirm()});
  overlay.addEventListener("click",function(e){if(e.target===overlay)overlay.remove()});
}

/* ═══════ Export ═══════ */
document.getElementById("btnExport").addEventListener("click", function() {
  var lines = ["# AVIA Senior \u2014 Sprint 5 Planning\n"];
  COLUMNS.forEach(function(col) {
    lines.push("## " + col.title + " (" + col.cards.length + ")");
    col.cards.forEach(function(c) {
      lines.push("- [" + c.id + "] " + c.title + " (" + c.pts + " pts, " + c.priority + ")");
      if(c.desc) lines.push("  " + c.desc);
    });
    lines.push("");
  });
  var blob = new Blob([lines.join("\n")], {type:"text/markdown"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "sprint5-planning.md";
  a.click();
  URL.revokeObjectURL(url);
});

/* ═══════ Build Board Context for AI ═══════ */
function buildBoardContext() {
  var ctx = "Sprint 5 Planning Board de AVIA Senior (sistema de gesti\u00f3n para residencias de adultos mayores).\n";
  ctx += "Capacidad del sprint: " + SPRINT_CAPACITY + " puntos. Velocidad previa: 42 pts.\n\n";
  COLUMNS.forEach(function(col) {
    ctx += col.title + " (" + col.cards.length + " cards):\n";
    col.cards.forEach(function(c) {
      ctx += "- [" + c.id + "] " + c.title + " | " + c.pts + " pts | Prioridad: " + c.priority + " | Tipo: " + c.tag + "\n";
      if(c.desc) ctx += "  Desc: " + c.desc + "\n";
    });
    ctx += "\n";
  });
  ctx += "Carryover de Sprint 4: tests E2E pendientes, deuda t\u00e9cnica cr\u00edtica, micro-interacciones, changelog.\n";
  ctx += "Tecnolog\u00edas: Vue 3, REST API, OAuth 2.0, PostgreSQL, WCAG 2.1 AA.\n";
  return ctx;
}

/* ═══════ Parse Bot Response JSON ═══════ */
function parseBotResponseJson(text) {
  text = text.replace(/\*Thinking\.\.\.\*\n\n(?:> [^\n]*\n?)*/g, '');
  text = text.replace(/\n*---\n+(?:Learn more|Related searches):\n[\s\S]*$/, '');
  var codeblock = text.match(/```json\s*([\[{][\s\S]*?[\]}])\s*```/);
  if (codeblock) return JSON.parse(codeblock[1]);
  var raw = text.match(/[\[{][\s\S]*[\]}]/);
  if (raw) return JSON.parse(raw[0]);
  throw new Error('Could not find JSON in response');
}

/* ═══════ AI Handlers ═══════ */
var aiRunning = false;

function setAiButtonsState(disabled) {
  document.getElementById("btnAiGenerate").disabled = disabled;
  document.getElementById("btnAiSuggest").disabled = disabled;
  document.getElementById("btnAiEstimate").disabled = disabled;
}

function showAiTyping(btnEl, label) {
  aiRunning = true;
  setAiButtonsState(true);
  if(btnEl) btnEl.innerHTML = '<span class="spin"></span> ' + label;
  document.getElementById("aiOutput").innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
}

function resetAiButtons() {
  aiRunning = false;
  setAiButtonsState(false);
  document.getElementById("btnAiGenerate").innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Generar Stories IA';
  document.getElementById("btnAiSuggest").innerHTML = '<i class="fas fa-lightbulb"></i> Sugerencias';
  document.getElementById("btnAiEstimate").innerHTML = '<i class="fas fa-calculator"></i> Re-estimar';
}

function handleAiStream(result) {
  var msg = result.responses[0];
  if(!msg) return;
  var el = document.getElementById("aiOutput");
  if(msg.status === "error") {
    el.innerHTML = '<div style="color:var(--rose)"><i class="fas fa-exclamation-triangle"></i> ' + (msg.statusText||"Error") + '</div>';
    resetAiButtons();
  } else if(msg.status === "incomplete") {
    try { el.innerHTML = marked.parse(msg.content); } catch(_e) { el.textContent = msg.content; }
  } else if(msg.status === "complete") {
    try { el.innerHTML = marked.parse(msg.content); } catch(_e) { el.textContent = msg.content; }
    resetAiButtons();
  }
}

function handleStoryGeneration(result) {
  var msg = result.responses[0];
  if(!msg) return;
  var el = document.getElementById("aiOutput");

  if(msg.status === "error") {
    el.innerHTML = '<div style="color:var(--rose)"><i class="fas fa-exclamation-triangle"></i> ' + (msg.statusText||"Error") + '</div>';
    resetAiButtons();
    return;
  }

  if(msg.status === "incomplete") {
    try { el.innerHTML = marked.parse(msg.content); } catch(_e) { el.textContent = msg.content; }
    return;
  }

  if(msg.status === "complete") {
    // Try to parse JSON stories from the response
    var added = false;
    try {
      var stories = parseBotResponseJson(msg.content);
      if(Array.isArray(stories)) {
        stories.forEach(function(s) {
          var card = {
            id: sid(),
            col: "backlog",
            title: s.title || "Nueva story",
            desc: s.desc || s.description || "",
            priority: s.priority || "medium",
            tag: s.tag || s.type || "feature",
            pts: parseInt(s.pts || s.points || 3, 10)
          };
          var backlog = COLUMNS.find(function(c){return c.id==="backlog"});
          if(backlog){ backlog.cards.push(card); }
        });
        added = true;
        renderBoard();
        updateCapacity();
      }
    } catch(_e) { /* JSON parse failed, just show markdown */ }

    try { el.innerHTML = marked.parse(msg.content); } catch(_e2) { el.textContent = msg.content; }
    if(added) {
      el.innerHTML += '<div style="margin-top:12px;padding:10px;background:var(--green-bg);border-radius:var(--radius-xs);font-size:12px;color:var(--green);font-weight:600"><i class="fas fa-check-circle"></i> Stories a\u00f1adidas al Backlog autom\u00e1ticamente</div>';
    }
    resetAiButtons();
  }
}

if(window.Poe) {
  window.Poe.registerHandler("ai-suggest", handleAiStream);
  window.Poe.registerHandler("ai-estimate", handleAiStream);
  window.Poe.registerHandler("ai-generate", handleStoryGeneration);
}

/* ── Generate Stories ── */
document.getElementById("btnAiGenerate").addEventListener("click", async function() {
  if(aiRunning) return;
  showAiTyping(this, "Generando...");
  if(!window.Poe) { document.getElementById("aiOutput").innerHTML='<div style="color:var(--rose)">Poe API no disponible</div>'; resetAiButtons(); return; }
  try {
    await window.Poe.sendUserMessage(
      "@Claude-Sonnet-4.5 Basado en el contexto de este sprint, genera 4-5 user stories nuevas que complementen el backlog existente.\n\n" +
      buildBoardContext() +
      "\n\nIMPORTANTE: Tu respuesta debe contener un bloque ```json con un array de objetos. Cada objeto debe tener: title, desc, priority (high/medium/low), tag (feature/bug/tech/test/ux), pts (1,2,3,5,8,13).\n" +
      "Despu\u00e9s del JSON, a\u00f1ade una breve justificaci\u00f3n de cada story. Responde en espa\u00f1ol.",
      { handler:"ai-generate", stream:true, openChat:false, parameters:{} }
    );
  } catch(err) { document.getElementById("aiOutput").innerHTML='<div style="color:var(--rose)">'+err.message+'</div>'; resetAiButtons(); }
});

/* ── Suggestions ── */
document.getElementById("btnAiSuggest").addEventListener("click", async function() {
  if(aiRunning) return;
  showAiTyping(this, "Analizando...");
  if(!window.Poe) { document.getElementById("aiOutput").innerHTML='<div style="color:var(--rose)">Poe API no disponible</div>'; resetAiButtons(); return; }
  try {
    await window.Poe.sendUserMessage(
      "@Claude-Sonnet-4.5 Analiza este Sprint 5 planning board y dame sugerencias concretas:\n\n" +
      buildBoardContext() +
      "\n\nIncluye: 1) An\u00e1lisis de balance de carga (distribuci\u00f3n de puntos por columna), 2) Riesgos de sobre-compromiso, 3) Dependencias entre cards, 4) Sugerencias de re-priorizaci\u00f3n, 5) Items que faltan considerando el carryover de Sprint 4. Formato Markdown en espa\u00f1ol.",
      { handler:"ai-suggest", stream:true, openChat:false, parameters:{} }
    );
  } catch(err) { document.getElementById("aiOutput").innerHTML='<div style="color:var(--rose)">'+err.message+'</div>'; resetAiButtons(); }
});

/* ── Re-estimate ── */
document.getElementById("btnAiEstimate").addEventListener("click", async function() {
  if(aiRunning) return;
  showAiTyping(this, "Estimando...");
  if(!window.Poe) { document.getElementById("aiOutput").innerHTML='<div style="color:var(--rose)">Poe API no disponible</div>'; resetAiButtons(); return; }
  try {
    await window.Poe.sendUserMessage(
      "@Claude-Sonnet-4.5 Analiza las estimaciones de puntos de todas las cards en este board y sugiere re-estimaciones basadas en complejidad real:\n\n" +
      buildBoardContext() +
      "\n\nPara cada card, indica: estimaci\u00f3n actual, estimaci\u00f3n sugerida, justificaci\u00f3n. Incluye una tabla resumen al inicio y luego el detalle. Si la estimaci\u00f3n actual es correcta, ind\u00edcalo tambi\u00e9n. Formato Markdown en espa\u00f1ol.",
      { handler:"ai-estimate", stream:true, openChat:false, parameters:{} }
    );
  } catch(err) { document.getElementById("aiOutput").innerHTML='<div style="color:var(--rose)">'+err.message+'</div>'; resetAiButtons(); }
});

/* ═══════ Init ═══════ */
renderBoard();
</script>
