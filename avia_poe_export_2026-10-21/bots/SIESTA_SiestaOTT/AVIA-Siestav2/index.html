    <style>
        * { font-family: 'Inter', sans-serif; }
        
        /* Sistema de Alto Contraste */
        .high-contrast {
            --bg-primary: #000000;
            --bg-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #ffff00;
            --accent: #00ffff;
            --border: #ffffff;
        }
        
        .high-contrast body { background: var(--bg-primary) !important; }
        .high-contrast .card-bg { background: var(--bg-secondary) !important; border: 2px solid var(--border) !important; }
        .high-contrast .text-contrast { color: var(--text-secondary) !important; }
        
        /* Tamaños de fuente accesibles */
        .font-size-large { font-size: 1.25em !important; }
        .font-size-xlarge { font-size: 1.5em !important; }
        
        /* Animaciones reducidas */
        .reduce-motion * { animation: none !important; transition: none !important; }
        
        /* Gradientes y efectos */
        .gradient-aurora {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 25%, #0d0d1a 50%, #1f1f4a 75%, #0a0a15 100%);
        }
        
        .card-glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
            transition: all 0.3s ease;
        }
        
        .card-glow:hover {
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
            transform: translateY(-4px);
        }
        
        .category-bienestar { border-left: 4px solid #10b981; }
        .category-inclusion { border-left: 4px solid #8b5cf6; }
        .category-poblaciones { border-left: 4px solid #f59e0b; }
        .category-innovacion { border-left: 4px solid #3b82f6; }
        .category-comunidad { border-left: 4px solid #ec4899; }
        .category-participacion { border-left: 4px solid #14b8a6; }
        
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        /* Scrollbar personalizado */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f1f3a; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
        
        /* Focus visible para accesibilidad */
        :focus-visible {
            outline: 3px solid #fbbf24 !important;
            outline-offset: 2px !important;
        }
        
        /* Skip link */

            position: absolute;
            top: -40px;
            left: 0;
            background: #fbbf24;
            color: #000;
            padding: 8px 16px;
            z-index: 100;
            transition: top 0.3s;
        }
        
        .skip-link:focus { top: 0; }
        
        /* Tooltip accesible */
        .tooltip {
            position: relative;
        }
        
        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 12px;
            background: #1f2937;
            color: white;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        
        .tooltip:hover::after,
        .tooltip:focus::after {
            opacity: 1;
        }
        
        /* SIESTA diagram */
        .siesta-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            margin: 0 4px;
            transition: all 0.3s;
        }
        
        .siesta-letter:hover {
            transform: scale(1.2);
        }
        
        /* Vigilancia cards */
        .vigilancia-card {
            background: linear-gradient(145deg, #1e1e3f 0%, #2d2d5a 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            transition: all 0.3s;
        }
        
        .vigilancia-card:hover {
            border-color: rgba(99, 102, 241, 0.6);
            transform: translateY(-2px);
        }
        
        /* Constellation view */
        .constellation-node {
            position: absolute;
            transition: all 0.5s ease;
        }
        
        .constellation-line {
            stroke: rgba(99, 102, 241, 0.3);
            stroke-width: 1;
        }
        
        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
        
        .toast {
            background: #1f2937;
            border-left: 4px solid #10b981;
            padding: 16px 20px;
            border-radius: 8px;
            margin-top: 10px;
            animation: slideIn 0.3s ease;
        }
        
        .toast-error { border-left-color: #ef4444; }
        .toast-warning { border-left-color: #f59e0b; }
        .toast-info { border-left-color: #3b82f6; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Loading spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #6366f1;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Progress bar */
        .progress-bar {
            height: 4px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.5s ease;
        }
        
        /* Voice indicator */
        .voice-indicator {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        
        .voice-bar {
            width: 4px;
            background: #10b981;
            border-radius: 2px;
            animation: voiceWave 0.5s ease infinite;
        }
        
        .voice-bar:nth-child(1) { animation-delay: 0s; height: 8px; }
        .voice-bar:nth-child(2) { animation-delay: 0.1s; height: 16px; }
        .voice-bar:nth-child(3) { animation-delay: 0.2s; height: 12px; }
        .voice-bar:nth-child(4) { animation-delay: 0.3s; height: 20px; }
        .voice-bar:nth-child(5) { animation-delay: 0.4s; height: 8px; }
        
        @keyframes voiceWave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.5); }
        }
    </style>
</head>

        // Sistema de Toast
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="flex items-center gap-3">
                    <span class="text-lg">${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}</span>
                    <span class="text-white">${message}</span>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // Speech synthesis
        function speak(text) {
            if ('speechSynthesis' in window && AppState.accessibility.screenReader) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }

        // Storage seguro
        const SafeStorage = {
            get: (key) => {
                try { return JSON.parse(localStorage.getItem(key)); } 
                catch { return null; }
            },
            set: (key, value) => {
                try { localStorage.setItem(key, JSON.stringify(value)); } 
                catch { /* silently fail */ }
            }
        };

        function filterBots() {
            let filtered = [...botsData];
            
            if (AppState.searchTerm) {

                filtered = filtered.filter(bot => 
                    bot.name.toLowerCase().includes(term) ||

                    bot.features.some(f => f.toLowerCase().includes(term)) ||
                    bot.targetAudience.some(t => t.toLowerCase().includes(term))
                );
            }
            
            if (AppState.selectedCategory !== 'todos') {
                filtered = filtered.filter(bot => bot.category === AppState.selectedCategory);
            }
            
            return filtered;
        }

        function renderBotCard(bot) {
            const categoryColors = {

                innovacion: 'category-innovacion',
                comunidad: 'category-comunidad',
                participacion: 'category-participacion'

            const isActive = AppState.activeBots.has(bot.id);
            const isFavorite = AppState.favorites.has(bot.id);

            return `
                <article 
                    class="card-bg bg-gray-800/50 rounded-xl p-5 card-glow cursor-pointer ${categoryColors[bot.category]} relative"

                            bot.status === 'active' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'

        }

        function renderBotModal() {
            if (!AppState.showModal || !AppState.selectedBot) return '';
            
            const bot = botsData.find(b => b.id === AppState.selectedBot);
            if (!bot) return '';

            const isActive = AppState.activeBots.has(bot.id);
            const isFavorite = AppState.favorites.has(bot.id);

            return `
                <div 
                    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
                    onclick="closeModal()"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="modal-title"
                >
                    <div 
                        class="bg-gray-900 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"
                        onclick="event.stopPropagation()"
                    >
                        <!-- Header -->
                        <div class="sticky top-0 bg-gray-900 p-6 border-b border-gray-800 flex items-start justify-between">
                            <div class="flex items-center gap-4">
                                <div class="text-5xl">${bot.emoji}</div>
                                <div>
                                    <h2 id="modal-title" class="text-2xl font-bold text-white">${bot.name}</h2>
                                    <div class="flex items-center gap-2 mt-1">
                                        <span class="text-sm text-gray-400">v${bot.version}</span>
                                        <span class="text-xs px-2 py-0.5 rounded-full ${
                                            bot.status === 'active' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'
                                        }">
                                            ${bot.status === 'active' ? 'Activo' : 'Beta'}
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <button 
                                onclick="closeModal()"
                                class="p-2 hover:bg-gray-800 rounded-lg transition"
                                aria-label="Cerrar modal"
                            >
                                ✕
                            </button>
                        </div>
                        
                        <!-- Content -->
                        <div class="p-6 space-y-6">
                            <!-- Description -->
                            <div>
                                <h3 class="text-sm font-medium text-gray-400 mb-2">Descripción</h3>
                                <p class="text-white">${bot.description}</p>
                            </div>
                            
                            <!-- Features -->
                            <div>
                                <h3 class="text-sm font-medium text-gray-400 mb-2">Funcionalidades</h3>
                                <div class="flex flex-wrap gap-2">
                                    ${bot.features.map(f => `
                                        <span class="px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-full text-sm">${f}</span>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <!-- Accessibility -->
                            <div>
                                <h3 class="text-sm font-medium text-gray-400 mb-2">Accesibilidad</h3>
                                <div class="flex flex-wrap gap-2">
                                    ${bot.accessibility.map(a => `
                                        <span class="px-3 py-1 bg-green-500/20 text-green-300 rounded-full text-sm">♿ ${a}</span>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <!-- Target Audience -->
                            <div>
                                <h3 class="text-sm font-medium text-gray-400 mb-2">Público objetivo</h3>
                                <div class="flex flex-wrap gap-2">
                                    ${bot.targetAudience.map(t => `
                                        <span class="px-3 py-1 bg-purple-500/20 text-purple-300 rounded-full text-sm">👥 ${t}</span>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <!-- Integration -->
                            <div>
                                <h3 class="text-sm font-medium text-gray-400 mb-2">Integraciones</h3>
                                <div class="flex flex-wrap gap-2">
                                    ${bot.integration.map(i => `
                                        <span class="px-3 py-1 bg-blue-500/20 text-blue-300 rounded-full text-sm">🔌 ${i}</span>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <!-- Metrics -->
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-gray-800/50 rounded-xl p-4 text-center">
                                    <div class="text-2xl font-bold text-indigo-400">${bot.metrics.uses.toLocaleString()}</div>
                                    <div class="text-sm text-gray-400">Usos totales</div>
                                </div>
                                <div class="bg-gray-800/50 rounded-xl p-4 text-center">
                                    <div class="text-2xl font-bold text-yellow-400">⭐ ${bot.metrics.satisfaction}</div>
                                    <div class="text-sm text-gray-400">Satisfacción</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Footer -->
                        <div class="sticky bottom-0 bg-gray-900 p-6 border-t border-gray-800 flex flex-wrap gap-3">
                            <button 
                                onclick="activateBot('${bot.id}')"
                                class="flex-1 py-3 px-4 ${isActive ? 'bg-green-600 hover:bg-green-700' : 'bg-indigo-600 hover:bg-indigo-700'} rounded-lg font-medium transition flex items-center justify-center gap-2"
                            >
                                ${isActive ? '✅ Bot Activo' : '🚀 Activar Bot'}
                            </button>
                            <button 
                                onclick="toggleFavorite('${bot.id}')"
                                class="py-3 px-4 bg-gray-800 hover:bg-gray-700 rounded-lg transition"
                                aria-label="${isFavorite ? 'Quitar de favoritos' : 'Añadir a favoritos'}"
                            >
                                ${isFavorite ? '⭐' : '☆'}
                            </button>
                            <button 
                                onclick="showDocumentation('${bot.id}')"
                                class="py-3 px-4 bg-gray-800 hover:bg-gray-700 rounded-lg transition"
                                aria-label="Ver documentación"
                            >
                                📄
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDocumentationPanel() {
            if (!AppState.showDocPanel || !AppState.selectedBot) return '';
            
            const bot = botsData.find(b => b.id === AppState.selectedBot);
            if (!bot) return '';

            return `
                <div 
                    class="fixed inset-y-0 right-0 z-50 w-full max-w-lg bg-gray-900 shadow-2xl transform transition-transform"
                    role="complementary"
                    aria-label="Panel de documentación"
                >
                    <div class="h-full flex flex-col">
                        <!-- Header -->
                        <div class="p-4 border-b border-gray-800 flex items-center justify-between">
                            <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                                <span>📄</span> Documentación: ${bot.name}
                            </h3>
                            <button 
                                onclick="closeDocPanel()"
                                class="p-2 hover:bg-gray-800 rounded-lg transition"
                            >
                                ✕
                            </button>
                        </div>
                        
                        <!-- Content -->
                        <div class="flex-1 overflow-y-auto p-6">
                            <div class="prose prose-invert prose-sm max-w-none">
                                <pre class="whitespace-pre-wrap text-gray-300 text-sm font-sans">${bot.documentation || 'Documentación en desarrollo...'}</pre>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAccessibilityPanel() {
            if (!AppState.showAccessibilityPanel) return '';

            return `
                <div 
                    class="fixed inset-y-0 right-0 z-50 w-full max-w-sm bg-gray-900 shadow-2xl"
                    role="complementary"
                    aria-label="Panel de accesibilidad"
                >
                    <div class="h-full flex flex-col">
                        <!-- Header -->
                        <div class="p-4 border-b border-gray-800 flex items-center justify-between">
                            <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                                <span>♿</span> Accesibilidad
                            </h3>
                            <button 
                                onclick="toggleAccessibilityPanel()"
                                class="p-2 hover:bg-gray-800 rounded-lg transition"
                            >
                                ✕
                            </button>
                        </div>
                        
                        <!-- Content -->
                        <div class="flex-1 overflow-y-auto p-6 space-y-6">
                            <!-- Alto contraste -->
                            <div class="flex items-center justify-between">
                                <div>
                                    <h4 class="font-medium text-white">Alto contraste</h4>
                                    <p class="text-sm text-gray-400">Mejora la visibilidad del texto</p>
                                </div>
                                <button 
                                    onclick="toggleHighContrast()"
                                    class="w-12 h-6 rounded-full transition ${AppState.accessibility.highContrast ? 'bg-indigo-600' : 'bg-gray-700'}"
                                    role="switch"
                                    aria-checked="${AppState.accessibility.highContrast}"
                                >
                                    <div class="w-5 h-5 rounded-full bg-white shadow transform transition ${AppState.accessibility.highContrast ? 'translate-x-6' : 'translate-x-0.5'}"></div>
                                </button>
                            </div>
                            
                            <!-- Tamaño de fuente -->
                            <div>
                                <h4 class="font-medium text-white mb-3">Tamaño de fuente</h4>
                                <div class="flex gap-2">
                                    <button 
                                        onclick="setFontSize('normal')"
                                        class="flex-1 py-2 rounded-lg ${AppState.accessibility.fontSize === 'normal' ? 'bg-indigo-600' : 'bg-gray-700'}"
                                    >
                                        A
                                    </button>
                                    <button 
                                        onclick="setFontSize('large')"
                                        class="flex-1 py-2 rounded-lg text-lg ${AppState.accessibility.fontSize === 'large' ? 'bg-indigo-600' : 'bg-gray-700'}"
                                    >
                                        A
                                    </button>
                                    <button 
                                        onclick="setFontSize('xlarge')"
                                        class="flex-1 py-2 rounded-lg text-xl ${AppState.accessibility.fontSize === 'xlarge' ? 'bg-indigo-600' : 'bg-gray-700'}"
                                    >
                                        A
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Reducir movimiento -->
                            <div class="flex items-center justify-between">
                                <div>
                                    <h4 class="font-medium text-white">Reducir movimiento</h4>
                                    <p class="text-sm text-gray-400">Desactiva animaciones</p>
                                </div>
                                <button 
                                    onclick="toggleReduceMotion()"
                                    class="w-12 h-6 rounded-full transition ${AppState.accessibility.reduceMotion ? 'bg-indigo-600' : 'bg-gray-700'}"
                                    role="switch"
                                    aria-checked="${AppState.accessibility.reduceMotion}"
                                >
                                    <div class="w-5 h-5 rounded-full bg-white shadow transform transition ${AppState.accessibility.reduceMotion ? 'translate-x-6' : 'translate-x-0.5'}"></div>
                                </button>
                            </div>
                            
                            <!-- Lector de pantalla -->
                            <div class="flex items-center justify-between">
                                <div>
                                    <h4 class="font-medium text-white">Lector de voz</h4>
                                    <p class="text-sm text-gray-400">Lee el contenido en voz alta</p>
                                </div>
                                <button 
                                    onclick="toggleScreenReader()"
                                    class="w-12 h-6 rounded-full transition ${AppState.accessibility.screenReader ? 'bg-indigo-600' : 'bg-gray-700'}"
                                    role="switch"
                                    aria-checked="${AppState.accessibility.screenReader}"
                                >
                                    <div class="w-5 h-5 rounded-full bg-white shadow transform transition ${AppState.accessibility.screenReader ? 'translate-x-6' : 'translate-x-0.5'}"></div>
                                </button>
                            </div>
                            
                            <!-- Control por voz -->
                            <div class="flex items-center justify-between">
                                <div>
                                    <h4 class="font-medium text-white">Control por voz</h4>
                                    <p class="text-sm text-gray-400">Navega usando tu voz</p>
                                </div>
                                <button 
                                    onclick="toggleVoiceControl()"
                                    class="w-12 h-6 rounded-full transition ${AppState.accessibility.voiceControl ? 'bg-indigo-600' : 'bg-gray-700'}"
                                    role="switch"
                                    aria-checked="${AppState.accessibility.voiceControl}"
                                >
                                    <div class="w-5 h-5 rounded-full bg-white shadow transform transition ${AppState.accessibility.voiceControl ? 'translate-x-6' : 'translate-x-0.5'}"></div>
                                </button>
                            </div>
                            
                            <!-- Indicador de voz activa -->
                            ${AppState.voice.isListening ? `
                                <div class="p-4 bg-green-500/20 rounded-lg">
                                    <div class="flex items-center gap-3 mb-2">
                                        <div class="voice-indicator">
                                            <div class="voice-bar"></div>
                                            <div class="voice-bar"></div>
                                            <div class="voice-bar"></div>
                                            <div class="voice-bar"></div>
                                            <div class="voice-bar"></div>
                                        </div>
                                        <span class="text-green-400 font-medium">Escuchando...</span>
                                    </div>
                                    <p class="text-sm text-gray-300">Di: "buscar [término]", "abrir [bot]", "activar [bot]"</p>
                                </div>
                            ` : ''}
                        </div>
                        
                        <!-- Footer -->
                        <div class="p-4 border-t border-gray-800">
                            <button 
                                onclick="resetAccessibility()"
                                class="w-full py-2 bg-gray-800 hover:bg-gray-700 rounded-lg transition text-sm"
                            >
                                🔄 Restablecer valores por defecto
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // FUNCIONES DE ESTADO Y ACCIONES
        // ==========================================

        function setActiveTab(tab) {
            AppState.activeTab = tab;
            speak(`Pestaña ${tab} seleccionada`);
            render();
        }

        function setCategory(category) {
            AppState.selectedCategory = category;
            const cat = categories.find(c => c.id === category);
            speak(`Categoría ${cat.name} seleccionada`);
            render();
        }

        function handleSearch(event) {
            AppState.searchTerm = event.target.value;
            render();
        }

        function clearSearch() {
            AppState.searchTerm = '';
            render();
        }

        function openBotModal(botId) {
            AppState.selectedBot = botId;
            AppState.showModal = true;
            const bot = botsData.find(b => b.id === botId);
            speak(`Abriendo detalles de ${bot.name}`);
            render();
        }

        function closeModal() {
            AppState.showModal = false;
            AppState.showDocPanel = false;
            render();
        }

        function activateBot(botId) {
            const bot = botsData.find(b => b.id === botId);
            if (AppState.activeBots.has(botId)) {
                AppState.activeBots.delete(botId);
                showToast(`${bot.name} desactivado`, 'info');
                speak(`${bot.name} desactivado`);
            } else {
                AppState.activeBots.add(botId);
                showToast(`🚀 ${bot.name} activado correctamente`, 'success');
                speak(`${bot.name} activado`);
            }
            render();
        }

        function toggleFavorite(botId) {
            const bot = botsData.find(b => b.id === botId);
            if (AppState.favorites.has(botId)) {
                AppState.favorites.delete(botId);
                showToast(`${bot.name} eliminado de favoritos`, 'info');
            } else {
                AppState.favorites.add(botId);
                showToast(`⭐ ${bot.name} añadido a favoritos`, 'success');
            }
            render();
        }

        function showDocumentation(botId) {
            AppState.showDocPanel = true;
            render();
        }

        function closeDocPanel() {
            AppState.showDocPanel = false;
            render();
        }

        function toggleAccessibilityPanel() {
            AppState.showAccessibilityPanel = !AppState.showAccessibilityPanel;
            render();
        }

        function toggleHighContrast() {
            AppState.accessibility.highContrast = !AppState.accessibility.highContrast;
            document.documentElement.classList.toggle('high-contrast', AppState.accessibility.highContrast);
            showToast(AppState.accessibility.highContrast ? 'Alto contraste activado' : 'Alto contraste desactivado', 'info');
            render();
        }

        function setFontSize(size) {
            AppState.accessibility.fontSize = size;
            document.documentElement.classList.remove('font-size-large', 'font-size-xlarge');
            if (size === 'large') document.documentElement.classList.add('font-size-large');
            if (size === 'xlarge') document.documentElement.classList.add('font-size-xlarge');
            render();
        }

        function toggleReduceMotion() {
            AppState.accessibility.reduceMotion = !AppState.accessibility.reduceMotion;
            document.documentElement.classList.toggle('reduce-motion', AppState.accessibility.reduceMotion);
            render();
        }

        function toggleScreenReader() {
            AppState.accessibility.screenReader = !AppState.accessibility.screenReader;
            if (AppState.accessibility.screenReader) {
                speak('Lector de voz activado. Ahora escucharás las interacciones.');
            }
            showToast(AppState.accessibility.screenReader ? '🔊 Lector de voz activado' : 'Lector de voz desactivado', 'info');
            render();
        }

        function toggleVoiceControl() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showToast('Tu navegador no soporta control por voz', 'error');
                return;
            }
            
            AppState.accessibility.voiceControl = !AppState.accessibility.voiceControl;
            AppState.voice.isListening = AppState.accessibility.voiceControl;
            
            if (AppState.accessibility.voiceControl) {
                initVoiceControl();
                showToast('🎤 Control por voz activado', 'success');
            } else {
                showToast('Control por voz desactivado', 'info');
            }
            render();
        }

        function initVoiceControl() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = false;
            
            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                processVoiceCommand(transcript);
            };
            
            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    showToast('Error de reconocimiento de voz', 'error');
                }
            };
            
            recognition.onend = () => {
                if (AppState.accessibility.voiceControl) {
                    recognition.start();
                }
            };
            
            recognition.start();
        }

        function processVoiceCommand(command) {
            if (command.includes('buscar')) {
                const term = command.replace('buscar', '').trim();
                AppState.searchTerm = term;
                speak(`Buscando ${term}`);
                render();
            } else if (command.includes('abrir')) {
                const botName = command.replace('abrir', '').trim();
                const bot = botsData.find(b => b.name.toLowerCase().includes(botName));
                if (bot) {
                    openBotModal(bot.id);
                } else {
                    speak('Bot no encontrado');
                }
            } else if (command.includes('activar')) {
                const botName = command.replace('activar', '').trim();
                const bot = botsData.find(b => b.name.toLowerCase().includes(botName));
                if (bot) {
                    activateBot(bot.id);
                }
            } else if (command.includes('cerrar')) {
                closeModal();
                speak('Modal cerrado');
            }
        }

        function resetAccessibility() {
            AppState.accessibility = {
                highContrast: false,
                largeText: false,
                reduceMotion: false,
                screenReader: false,
                voiceControl: false,
                fontSize: 'normal'
            };
            document.documentElement.classList.remove('high-contrast', 'font-size-large', 'font-size-xlarge', 'reduce-motion');
            AppState.voice.isListening = false;
            showToast('Configuración de accesibilidad restablecida', 'info');
            render();
        }

        function refreshVigilancia() {
            showToast('🔄 Actualizando fuentes de vigilancia...', 'info');
            setTimeout(() => {
                showToast('✅ Fuentes actualizadas', 'success');
            }, 1500);
        }

        // ==========================================
        // FUNCIÓN PRINCIPAL DE RENDERIZADO
        // ==========================================

        function render() {
            let content = '';
            
            switch (AppState.activeTab) {
                case 'constelacion':
                    content = renderConstellationContent();
                    break;
                case 'siesta':
                    content = renderSiestaContent();
                    break;
                case 'vigilancia':
                    content = renderVigilanciaContent();
                    break;
            }

            const app = document.getElementById('app');
            app.innerHTML = `
                ${renderHeader()}
                ${renderNavTabs()}
                <main id="main-content">
                    ${content}
                </main>
                ${renderBotModal()}
                ${renderDocumentationPanel()}
                ${renderAccessibilityPanel()}
            `;

            // Re-attach event listeners
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', handleSearch);
                searchInput.value = AppState.searchTerm;
            }
        }

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================

        document.addEventListener('DOMContentLoaded', () => {
            // Cargar configuración guardada
            const savedAccessibility = SafeStorage.get('avia-accessibility');
            if (savedAccessibility) {
                AppState.accessibility = { ...AppState.accessibility, ...savedAccessibility };
                if (AppState.accessibility.highContrast) {
                    document.documentElement.classList.add('high-contrast');
                }
                if (AppState.accessibility.reduceMotion) {
                    document.documentElement.classList.add('reduce-motion');
                }
                if (AppState.accessibility.fontSize !== 'normal') {
                    document.documentElement.classList.add(`font-size-${AppState.accessibility.fontSize}`);
                }
            }

            const savedFavorites = SafeStorage.get('avia-favorites');
            if (savedFavorites) {
                AppState.favorites = new Set(savedFavorites);
            }

            // Render inicial
            render();

            // Guardar configuración al salir
            window.addEventListener('beforeunload', () => {
                SafeStorage.set('avia-accessibility', AppState.accessibility);
                SafeStorage.set('avia-favorites', [...AppState.favorites]);
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (AppState.showModal) closeModal();
                    if (AppState.showAccessibilityPanel) toggleAccessibilityPanel();
                    if (AppState.showDocPanel) closeDocPanel();
                }
            });
        });
    </script>
</body>
</html>
