<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Studio v4 - Constelación de Bots Inclusivos</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #8b5cf6; --primary-light: #a78bfa; --primary-dark: #7c3aed;
            --secondary: #06b6d4; --accent: #f59e0b; --success: #10b981;
            --warning: #f59e0b; --error: #ef4444; --info: #3b82f6;
            --bg-primary: #09090b; --bg-secondary: #18181b; --bg-tertiary: #27272a;
            --bg-elevated: #3f3f46; --bg-glass: rgba(24, 24, 27, 0.85);
            --text-primary: #fafafa; --text-secondary: #a1a1aa; --text-muted: #71717a;
            --border: #3f3f46; --border-light: #52525b;
            --gradient-primary: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 50%, #10b981 100%);
            --gradient-warm: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            --gradient-bg: radial-gradient(ellipse at top left, #27272a 0%, #09090b 50%, #18181b 100%);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.5); --shadow-lg: 0 20px 60px rgba(0,0,0,0.6);
            --shadow-glow: 0 0 60px rgba(139, 92, 246, 0.25);
        }
        .light {
            --bg-primary: #fafafa; --bg-secondary: #f4f4f5; --bg-tertiary: #e4e4e7;
            --bg-elevated: #ffffff; --bg-glass: rgba(250, 250, 250, 0.92);
            --text-primary: #18181b; --text-secondary: #52525b; --text-muted: #71717a;
            --border: #d4d4d8; --border-light: #a1a1aa;
            --gradient-bg: radial-gradient(ellipse at top left, #f4f4f5 0%, #fafafa 50%, #e4e4e7 100%);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.1); --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
        }
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gradient-bg); background-attachment: fixed;
            color: var(--text-primary); min-height: 100vh; line-height: 1.6;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); } 50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6); } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        .animate-fadeInUp { animation: fadeInUp 0.5s ease-out backwards; }
        .animate-fadeInScale { animation: fadeInScale 0.35s ease-out; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }
        .animate-glow { animation: glow 2s ease-in-out infinite; }
        .animate-slideIn { animation: slideIn 0.4s ease-out; }
        .app-container { display: flex; flex-direction: column; min-height: 100vh; }
        .header {
            background: var(--bg-glass); backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem;
            position: sticky; top: 0; z-index: 100;
        }
        .header-content {
            max-width: 1800px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
        }
        .logo { display: flex; align-items: center; gap: 14px; }
        .logo-icon {
            width: 48px; height: 48px; background: var(--gradient-primary);
            border-radius: 14px; display: flex; align-items: center;
            justify-content: center; font-size: 24px; box-shadow: var(--shadow-glow);
        }
        .logo-text h1 {
            font-size: 1.5rem; font-weight: 800; background: var(--gradient-primary);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .logo-text span { font-size: 0.72rem; color: var(--text-muted); display: block; letter-spacing: 0.5px; }
        .search-container { flex: 1; max-width: 420px; position: relative; }
        .search-input {
            width: 100%; padding: 12px 18px 12px 48px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: 14px; color: var(--text-primary);
            font-size: 0.95rem; font-family: inherit; transition: all 0.3s ease;
        }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15); }
        .search-input::placeholder { color: var(--text-muted); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.1rem; }
        .nav-tabs { display: flex; gap: 4px; background: var(--bg-tertiary); padding: 5px; border-radius: 14px; }
        .nav-tab {
            padding: 10px 18px; border: none; background: transparent; color: var(--text-secondary);
            font-size: 0.88rem; font-weight: 600; cursor: pointer; border-radius: 10px;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; font-family: inherit;
        }
        .nav-tab:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .nav-tab.active { background: var(--gradient-primary); color: white; }
        .nav-tab .badge { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 8px; font-size: 0.72rem; }
        .theme-toggle {
            background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 14px; cursor: pointer; color: var(--text-secondary); font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover { background: var(--bg-elevated); color: var(--text-primary); transform: scale(1.05); }
        .main-content { flex: 1; max-width: 1800px; margin: 0 auto; padding: 1.5rem; width: 100%; }
        .task-dashboard { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .task-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .task-progress { display: flex; align-items: center; gap: 14px; }
        .progress-bar { width: 220px; height: 10px; background: var(--bg-tertiary); border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--gradient-primary); border-radius: 5px; transition: width 0.6s ease; }
        .progress-text { font-size: 0.88rem; color: var(--text-secondary); font-weight: 600; }
        .task-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
        .task-category { background: var(--bg-tertiary); border-radius: 14px; padding: 1.25rem; }
        .task-category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
        .task-category-title { font-size: 0.95rem; font-weight: 700; }
        .task-count { background: var(--bg-elevated); padding: 3px 10px; border-radius: 8px; font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
        .task-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .task-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-secondary); border-radius: 10px; font-size: 0.85rem; transition: all 0.2s ease; }
        .task-item:hover { background: var(--bg-elevated); transform: translateX(4px); }
        .task-item.completed { opacity: 0.5; }
        .task-item.completed .task-text { text-decoration: line-through; }
        .task-checkbox { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.75rem; }
        .task-checkbox.completed { background: var(--success); border-color: var(--success); color: white; }
        .task-checkbox.in-progress { background: var(--warning); border-color: var(--warning); color: white; }
        .task-text { flex: 1; color: var(--text-secondary); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .section-title { font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; gap: 12px; }
        .section-subtitle { color: var(--text-secondary); font-size: 1rem; margin-top: 6px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
        .bot-card {
            background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px;
            padding: 1.5rem; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
            position: relative; overflow: hidden;
        }
        .bot-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--gradient-primary); opacity: 0; transition: opacity 0.3s ease;
        }
        .bot-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: var(--shadow-lg), var(--shadow-glow); }
        .bot-card:hover::before { opacity: 1; }
        .bot-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
        .bot-avatar { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
        .bot-info h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 3px; }
        .bot-info .acronym { font-size: 0.78rem; color: var(--text-muted); }
        .bot-description { color: var(--text-secondary); font-size: 0.88rem; line-height: 1.6; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .bot-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .bot-tag { padding: 4px 12px; background: var(--bg-tertiary); border-radius: 8px; font-size: 0.75rem; color: var(--text-muted); border: 1px solid var(--border); font-weight: 500; }
        .bot-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--border); }
        .status-badge { padding: 5px 12px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-badge.development { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-badge.planned { background: rgba(139, 92, 246, 0.15); color: var(--primary); }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; }
        .btn-primary { background: var(--gradient-primary); color: white; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: var(--shadow-md), var(--shadow-glow); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-elevated); border-color: var(--primary); }
        .btn-ghost { background: transparent; color: var(--text-secondary); padding: 8px 14px; }
        .btn-ghost:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .btn-sm { padding: 8px 14px; font-size: 0.8rem; border-radius: 8px; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 10px 18px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-secondary); border-radius: 24px; font-size: 0.88rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; font-family: inherit; font-weight: 500; }
        .filter-btn:hover, .filter-btn.active { background: var(--gradient-primary); color: white; border-color: transparent; }
        .filter-count { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; }
        .module-card { background: linear-gradient(145deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%); border: 1px solid var(--border); border-radius: 24px; padding: 2rem; margin-bottom: 2rem; position: relative; overflow: hidden; }
        .module-card::before { content: ''; position: absolute; top: -100%; right: -100%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 60%); pointer-events: none; }
        .module-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; position: relative; flex-wrap: wrap; gap: 1rem; }
        .module-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
        .module-desc { color: var(--text-secondary); font-size: 0.95rem; max-width: 650px; line-height: 1.7; }
        .pipeline-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .pipeline-step { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; text-align: center; position: relative; transition: all 0.3s ease; }
        .pipeline-step:hover { transform: translateY(-4px); border-color: var(--primary); }
        .pipeline-step::after { content: '→'; position: absolute; right: -14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.3rem; font-weight: 300; }
        .pipeline-step:last-child::after { display: none; }
        .pipeline-step.active { border-color: var(--primary); background: linear-gradient(135deg, rgba(139,92,246,0.1) 0%, rgba(6,182,212,0.1) 100%); }
        .pipeline-step.completed { border-color: var(--success); }
        .pipeline-step.completed::before { content: '✓'; position: absolute; top: 8px; right: 8px; background: var(--success); color: white; width: 18px; height: 18px; border-radius: 50%; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; }
        .pipeline-icon { font-size: 2.2rem; margin-bottom: 10px; }
        .pipeline-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; }
        .pipeline-bot { font-size: 0.78rem; color: var(--primary-light); font-family: 'Fira Code', monospace; }
        .chat-container { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; height: 520px; }
        .chat-header { padding: 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; background: var(--bg-tertiary); }
        .chat-avatar { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .chat-info h4 { font-size: 1rem; font-weight: 700; }
        .chat-info span { font-size: 0.78rem; color: var(--text-muted); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 14px; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 18px; font-size: 0.92rem; line-height: 1.6; }
        .message.user { background: var(--gradient-primary); color: white; align-self: flex-end; border-bottom-right-radius: 6px; }
        .message.bot { background: var(--bg-tertiary); color: var(--text-primary); align-self: flex-start; border-bottom-left-radius: 6px; }
        .message.system { background: rgba(139, 92, 246, 0.1); color: var(--primary-light); align-self: center; font-size: 0.85rem; text-align: center; border-radius: 12px; }
        .message.loading { display: flex; gap: 6px; padding: 16px 20px; }
        .loading-dot { width: 10px; height: 10px; background: var(--text-muted); border-radius: 50%; animation: pulse 1.4s ease-in-out infinite; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        .chat-input-container { padding: 1.25rem; border-top: 1px solid var(--border); display: flex; gap: 12px; background: var(--bg-tertiary); }
        .chat-input { flex: 1; padding: 14px 18px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; color: var(--text-primary); font-size: 0.95rem; font-family: inherit; }
        .chat-input:focus { outline: none; border-color: var(--primary); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; text-align: center; transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .stat-icon { font-size: 2rem; margin-bottom: 10px; }
        .stat-value { font-size: 2rem; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stat-label { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; font-weight: 500; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px; animation: fadeIn 0.25s ease; }
        .modal-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 24px; max-width: 750px; width: 100%; max-height: 88vh; overflow-y: auto; animation: fadeInScale 0.35s ease; }
        .modal-header { padding: 1.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 18px; position: relative; }
        .modal-close { position: absolute; top: 18px; right: 18px; background: var(--bg-tertiary); border: none; color: var(--text-secondary); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .modal-close:hover { background: var(--error); color: white; }
        .modal-body { padding: 1.75rem; }
        .feature-list { list-style: none; padding: 0; }
        .feature-list li { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; color: var(--text-secondary); font-size: 0.92rem; }
        .feature-list li:last-child { border-bottom: none; }
        .feature-icon { color: var(--success); font-size: 1.1rem; }
        .tabs-container { display: flex; gap: 8px; margin-bottom: 1.5rem; background: var(--bg-tertiary); padding: 6px; border-radius: 14px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: none; background: transparent; color: var(--text-secondary); font-size: 0.88rem; font-weight: 600; cursor: pointer; border-radius: 10px; transition: all 0.3s ease; font-family: inherit; }
        .tab-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .tab-btn.active { background: var(--bg-secondary); color: var(--text-primary); box-shadow: var(--shadow-md); }
        .siesta-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .siesta-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px; padding: 1.75rem; transition: all 0.3s ease; }
        .siesta-card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .siesta-card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 1rem; }
        .siesta-card-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
        .siesta-card h3 { font-size: 1.15rem; font-weight: 700; }
        .siesta-card p { color: var(--text-secondary); font-size: 0.88rem; line-height: 1.7; }
        .timeline { position: relative; padding-left: 35px; }
        .timeline::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--success) 0%, var(--primary) 50%, var(--text-muted) 100%); border-radius: 2px; }
        .timeline-item { position: relative; padding-bottom: 1.75rem; }
        .timeline-item::before { content: ''; position: absolute; left: -29px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); border: 3px solid var(--bg-secondary); }
        .timeline-item.completed::before { background: var(--success); }
        .timeline-item.pending::before { background: var(--text-muted); }
        .timeline-date { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
        .timeline-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 5px; }
        .timeline-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; }
        .toast-container { position: fixed; bottom: 28px; right: 28px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; padding: 16px 22px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-lg); animation: slideIn 0.35s ease; min-width: 300px; }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.warning { border-left: 5px solid var(--warning); }
        .toast.error { border-left: 5px solid var(--error); }
        .toast.info { border-left: 5px solid var(--info); }
        .toast-icon { font-size: 1.3rem; }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 700; font-size: 0.95rem; }
        .toast-message { font-size: 0.85rem; color: var(--text-secondary); }

                        openChat: false
                    }).catch(function(err) {

                } else {
                    // Modo demo

                        setAudioUrl('demo');
                        addToast({ type: 'success', title: '🎙️ Demo completado', message: 'En Poe se generaría audio real con ElevenLabs' });
                    }, 2500);
                }

            function generateFullVideo() {
                setGeneratingVideo(true);
                addToast({ type: 'info', title: '🎬 Iniciando generación', message: 'Creando video con Veo-v3.1...' });

                if (window.Poe && window.Poe.sendUserMessage) {
                    var handlerName = 'veo-video-' + Date.now();
                    window.Poe.registerHandler(handlerName, function(result) {
                        var response = result.responses && result.responses[0];
                        if (response) {
                            if (response.attachments && response.attachments.length > 0) {
                                var videoAtt = response.attachments.find(function(a) {
                                    return a.mimeType && a.mimeType.indexOf('video') !== -1;
                                });
                                if (videoAtt) {
                                    setVideoUrl(videoAtt.url);
                                    addToast({ type: 'success', title: '🎬 ¡Video generado!', message: 'Video listo para reproducir' });
                                }
                            }
                            if (response.status === 'complete' || response.status === 'error') {
                                setGeneratingVideo(false);
                                if (response.status === 'error') {
                                    addToast({ type: 'error', title: 'Error', message: response.statusText || 'Error generando video' });
                                }
                            }
                        }
                    });

                    var videoPrompt = 'Crea un video educativo animado de 8 segundos sobre: ' + prompt + '. ' +
                                     'Estilo: colorido, moderno, dinámico. Incluye texto superpuesto con el título. ' +
                                     'Transiciones suaves entre escenas. Fondo con gradientes vibrantes.';

                    window.Poe.sendUserMessage('@Veo-v3.1 ' + videoPrompt + ' --duration 8s --aspect 9:16', {
                        handler: handlerName,
                        stream: false,
                        openChat: false
                    }).catch(function(err) {
                        addToast({ type: 'error', title: 'Error', message: err.message });
                        setGeneratingVideo(false);
                    });
                } else {
                    // Modo demo
                    setTimeout(function() {
                        setGeneratingVideo(false);
                        setVideoUrl('demo');
                        addToast({ type: 'success', title: '🎬 Demo completado', message: 'En Poe se generaría video real con Veo-v3.1' });
                    }, 3000);
                }
            }

            function generateCover() {
                addToast({ type: 'info', title: '🎨 Generando portada', message: 'Conectando con Nano-Banana...' });

                if (window.Poe && window.Poe.sendUserMessage) {
                    var coverPrompt = 'Crea una portada atractiva para un video educativo sobre: ' + prompt + '. ' +
                                     'Estilo: flat design moderno, colores vibrantes (morado, cian, verde). ' +
                                     'Incluir iconos relacionados al tema, texto del título grande y legible. ' +
                                     'Fondo con gradiente. Orientación vertical para TikTok/Reels.';

                    window.Poe.sendUserMessage('@Nano-Banana ' + coverPrompt + ' --aspect_ratio 9:16 --image_only true', {
                        openChat: true
                    }).catch(function(err) {
                        addToast({ type: 'error', title: 'Error', message: err.message });
                    });
                } else {
                    addToast({ type: 'warning', title: 'Modo Demo', message: 'Conecta desde Poe para generar portada' });
                }
            }

            function downloadProject() {
                var projectData = {
                    title: 'Video Educativo: ' + prompt,
                    created: new Date().toISOString(),
                    scenes: scenes.map(function(s) {
                        return {
                            id: s.id,
                            title: s.title,
                            duration: s.duration,
                            narration: s.narration,
                            interaction: s.interaction ? s.interaction.type : null
                        };
                    }),
                    totalDuration: scenes.reduce(function(sum, s) { return sum + s.duration; }, 0),
                    script: fullScript,
                    elevenLabsCommand: '@ElevenLabs-v2.5-Turbo ' + elevenLabsScript.substring(0, 200) + '... --voice Jessica --language es',
                    veoCommand: '@Veo-v3.1 Video sobre ' + prompt + ' --duration 8s --aspect 9:16',
                    audioUrl: audioUrl,
                    videoUrl: videoUrl
                };

                var blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'proyecto-video-' + prompt.replace(/\s+/g, '-').toLowerCase() + '.json';
                a.click();
                URL.revokeObjectURL(url);
                addToast({ type: 'success', title: '📦 Proyecto descargado', message: 'Archivo JSON guardado' });

            var scene = scenes[currentScene] || scenes[0];
            var totalDuration = scenes.reduce(function(sum, s) { return sum + s.duration; }, 0);
            var completedInteractions = Object.keys(interactionResults).length;
            var totalInteractions = scenes.filter(function(s) { return s.interaction; }).length;

            // Renderizar interacción según tipo
            function renderInteraction(inter, sceneId) {
                if (!inter) return null;

                var isCompleted = interactionResults[sceneId];

                if (inter.type === 'quiz') {
                    return h('div', { style: { display: 'flex', gap: '10px', justifyContent: 'center', flexWrap: 'wrap' } },

                                    opacity: isCompleted ? 0.6 : 1

                                disabled: isCompleted,
                                onClick: function() {
                                    handleInteraction(sceneId, { option: i, text: opt });

                        })

                }

                if (inter.type === 'hotspot') {
                    return h('div', { style: { position: 'relative', width: '100%', height: '80px', background: 'rgba(0,0,0,0.2)', borderRadius: '12px', marginTop: '1rem' } },

                            var revealed = hotspotsRevealed.indexOf(spot.id) !== -1;
                            return h('button', {
                                key: spot.id,
                                style: {
                                    position: 'absolute',
                                    left: spot.x + '%',
                                    top: spot.y + '%',
                                    transform: 'translate(-50%, -50%)',
                                    width: '36px', height: '36px', borderRadius: '50%',
                                    background: revealed ? 'var(--success)' : 'var(--primary)',
                                    border: '3px solid white',
                                    cursor: 'pointer',
                                    animation: revealed ? 'none' : 'pulse 1.5s infinite',
                                    fontSize: '0.8rem', color: 'white', fontWeight: 700
                                },
                                onClick: function() {
                                    if (!revealed) {
                                        setHotspotsRevealed(function(prev) { return prev.concat([spot.id]); });
                                        addToast({ type: 'info', title: spot.label, message: spot.info });
                                        if (hotspotsRevealed.length + 1 >= inter.spots.length) {
                                            handleInteraction(sceneId, { completed: true });
                                        }
                                    }
                                }
                            }, revealed ? '✓' : spot.label.charAt(0));

                                className: 'btn btn-sm btn-secondary',
                                style: { cursor: isCompleted ? 'default' : 'grab', opacity: isCompleted ? 0.6 : 1 },

                                key: i,

                                    }
                                }
                            }, revealed ? '✓ ' + item.title : '🔍 ' + item.title);
                        })
                    );
                }

                if (inter.type === 'fillblank') {
                    return h('div', { style: { textAlign: 'center' } },
                        h('p', { style: { marginBottom: '1rem', fontSize: '0.95rem' } }, inter.sentence.replace('_____', ' _____ ')),
                        h('div', { style: { display: 'flex', gap: '8px', justifyContent: 'center', flexWrap: 'wrap' } },
                            inter.options.map(function(opt, i) {

                                    key: i,
                                    className: 'btn btn-sm',

                                        border: '2px solid ' + (isCorrect ? 'var(--success)' : selected ? 'var(--primary)' : 'var(--border)')

                                    disabled: isCompleted,

                                        setFillBlanks(opt);

                                    }

                if (inter.type === 'matching') {

                        inter.pairs.map(function(pair, i) {

                                key: i,
                                style: {
                                    display: 'flex',
                                    justifyContent: 'space-between',
                                    alignItems: 'center',

                                    borderRadius: '8px',
                                    cursor: isCompleted ? 'default' : 'pointer'
                                },
                                onClick: function() {

                                        addToast({ type: 'success', title: '🔗 Conectado', message: pair.left + ' ↔ ' + pair.right });

                                    }

                                h('span', { style: { fontWeight: 600 } }, pair.left),
                                h('span', { style: { color: 'var(--primary)' } }, '↔'),
                                h('span', { style: { fontSize: '0.85rem', color: 'var(--text-secondary)' } }, pair.right)
                            );
                        })
                    );
                }

                if (inter.type === 'cta') {
                    return h('div', { style: { display: 'flex', gap: '10px', justifyContent: 'center', flexWrap: 'wrap' } },
                        inter.buttons.map(function(btn, i) {
                            return h('button', {
                                key: i,
                                className: 'btn btn-sm',
                                style: { background: btn.color, color: 'white' },
                                onClick: function() {
                                    if (btn.action === 'replay') {
                                        setCurrentScene(0);
                                        setPlaying(true);
                                        setInteractionResults({});
                                        setHotspotsRevealed([]);
                                    } else {
                                        addToast({ type: 'success', title: 'Acción', message: btn.text + ' - ¡Gracias!' });
                                    }
                                }
                            }, btn.text);
                        })
                    );
                }

                return null;
            }

            return h('div', { style: { marginTop: '2rem', background: 'linear-gradient(145deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%)', borderRadius: '24px', padding: '1.5rem', border: '2px solid var(--primary)', boxShadow: 'var(--shadow-glow)' } },
                // Header con estadísticas
                h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', flexWrap: 'wrap', gap: '1rem' } },
                    h('div', null,
                        h('h3', { style: { fontSize: '1.4rem', fontWeight: 800, display: 'flex', alignItems: 'center', gap: '10px' } },
                            '🎥 Video Interactivo Completo'),
                        h('p', { style: { fontSize: '0.85rem', color: 'var(--text-muted)', marginTop: '4px' } },
                            scenes.length + ' escenas • ' + totalDuration + 's • ' + totalInteractions + ' interacciones')
                    ),
                    h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } },
                        h('span', { className: 'status-badge active', style: { fontSize: '0.75rem' } },
                            '🎮 ' + completedInteractions + '/' + totalInteractions),
                        audioUrl && h('span', { className: 'status-badge', style: { background: 'rgba(16, 185, 129, 0.15)', color: 'var(--success)', fontSize: '0.75rem' } }, '🎙️ Audio'),
                        videoUrl && h('span', { className: 'status-badge', style: { background: 'rgba(239, 68, 68, 0.15)', color: 'var(--error)', fontSize: '0.75rem' } }, '🎬 Video')
                    )
                ),

                // Toolbar de acciones
                h('div', { style: { display: 'flex', gap: '8px', marginBottom: '1.5rem', flexWrap: 'wrap' } },
                    h('button', { className: 'btn btn-sm btn-secondary', onClick: function() { setShowScript(!showScript); } },
                        showScript ? '📖 Ocultar Script' : '📖 Ver Script'),
                    h('button', { className: 'btn btn-sm btn-secondary', onClick: function() { setShowTimeline(!showTimeline); } },
                        showTimeline ? '🎞️ Ocultar Timeline' : '🎞️ Ver Timeline'),
                    h('button', {
                        className: 'btn btn-sm ' + (isNarrating ? 'btn-secondary' : 'btn-primary'),
                        onClick: generateNarration,
                        disabled: isNarrating || audioUrl
                    }, isNarrating ? [h('span', { key: 's', className: 'spinner', style: { width: '12px', height: '12px' } }), ' Generando...'] : (audioUrl ? '✅ Audio Listo' : '🎙️ Crear Narración')),
                    h('button', {
                        className: 'btn btn-sm ' + (generatingVideo ? 'btn-secondary' : 'btn-primary'),
                        onClick: generateFullVideo,
                        disabled: generatingVideo || videoUrl
                    }, generatingVideo ? [h('span', { key: 's', className: 'spinner', style: { width: '12px', height: '12px' } }), ' Generando...'] : (videoUrl ? '✅ Video Listo' : '🎬 Crear Video'))
                ),

                // Panel de Script
                showScript && h('div', { style: { background: 'var(--bg-secondary)', borderRadius: '16px', padding: '1.25rem', marginBottom: '1.5rem', border: '1px solid var(--primary)' } },
                    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem' } },
                        h('h4', { style: { fontSize: '1rem', color: 'var(--primary)', fontWeight: 700 } }, '📜 Script de Producción Completo'),
                        h('div', { style: { display: 'flex', gap: '8px' } },
                            h('button', { className: 'btn btn-ghost btn-sm', onClick: function() {
                                if (navigator.clipboard) {
                                    navigator.clipboard.writeText(fullScript);
                                    addToast({ type: 'success', title: 'Copiado', message: 'Script completo en portapapeles' });
                                }
                            } }, '📋 Copiar'),
                            h('button', { className: 'btn btn-ghost btn-sm', onClick: function() {
                                var blob = new Blob([fullScript], { type: 'text/plain' });
                                var url = URL.createObjectURL(blob);
                                var a = document.createElement('a');
                                a.href = url; a.download = 'script-' + prompt.replace(/\s+/g, '-').toLowerCase() + '.txt';
                                a.click(); URL.revokeObjectURL(url);
                                addToast({ type: 'success', title: 'Descargado', message: 'Script guardado' });
                            } }, '📥 Descargar')
                        )

                    h('div', { style: { marginTop: '1rem', padding: '0.75rem', background: 'rgba(139, 92, 246, 0.1)', borderRadius: '10px', display: 'flex', flexDirection: 'column', gap: '8px' } },
                        h('p', { style: { fontSize: '0.8rem', color: 'var(--primary)', fontWeight: 600 } }, '💡 Comandos rápidos:'),
                        h('code', { style: { fontSize: '0.75rem', background: 'var(--bg-tertiary)', padding: '6px 10px', borderRadius: '6px', display: 'block', overflowX: 'auto' } },
                            '@ElevenLabs-v2.5-Turbo ' + elevenLabsScript.substring(0, 80) + '... --voice Jessica'),
                        h('code', { style: { fontSize: '0.75rem', background: 'var(--bg-tertiary)', padding: '6px 10px', borderRadius: '6px', display: 'block' } },
                            '@Veo-v3.1 Video sobre ' + prompt + ' --duration 8s --aspect 9:16')
                    )
                ),

                // Timeline Editor
                showTimeline && h('div', { style: { background: 'var(--bg-secondary)', borderRadius: '16px', padding: '1.25rem', marginBottom: '1.5rem', border: '1px solid var(--secondary)' } },
                    h('h4', { style: { fontSize: '1rem', color: 'var(--secondary)', fontWeight: 700, marginBottom: '1rem' } }, '🎞️ Timeline del Video'),
                    h('div', { style: { display: 'flex', gap: '4px', overflowX: 'auto', paddingBottom: '10px' } },
                        scenes.map(function(s, i) {
                            var width = (s.duration / totalDuration) * 100;
                            var isActive = i === currentScene;
                            return h('div', {
                                key: i,
                                style: {
                                    flex: '0 0 ' + Math.max(width, 8) + '%',

                                    transition: 'all 0.2s'
                                },
                                onClick: function() { setCurrentScene(i); setPlaying(false); setVideoProgress(0); }

                        scene.interaction && h('span', { style: { background: interactionResults[scene.id] ? 'var(--success)' : 'var(--warning)', color: 'white', padding: '6px 10px', borderRadius: '10px', fontSize: '0.75rem' } }, interactionResults[scene.id] ? '✅' : '🎮')
                    ),

        var DiagnosticModule = {
            errors: [],

            tests: [],

            log: function(type, msg, details) {
                var entry = { time: new Date().toISOString(), type: type, msg: msg, details: details };
                if (type === 'error') this.errors.push(entry);
                else if (type === 'warning') this.warnings.push(entry);
                console.log('[AVIA-' + type.toUpperCase() + '] ' + msg, details || '');
            },

            runTests: function() {
                var self = this;
                this.tests = [];

                // Test 1: React disponible
                this.tests.push({ name: 'React cargado', pass: typeof React !== 'undefined' });

                // Test 2: ReactDOM disponible
                this.tests.push({ name: 'ReactDOM cargado', pass: typeof ReactDOM !== 'undefined' });

                // Test 3: Datos de bots válidos
                this.tests.push({ name: 'botsData válido', pass: Array.isArray(botsData) && botsData.length > 0 });

                // Test 4: Todos los bots tienen campos requeridos
                var botsValid = botsData.every(function(b) {
                    return b && b.id && b.name && b.emoji && b.description && b.features && Array.isArray(b.features);
                });
                this.tests.push({ name: 'Bots con campos requeridos', pass: botsValid });

                // Test 5: Pipeline de video válido

                    return p && p.name && p.bot && p.icon;
                });
                this.tests.push({ name: 'videoPipeline válido', pass: pipelineValid });

                // Test 6: Categorías válidas
                this.tests.push({ name: 'Categorías definidas', pass: Array.isArray(categories) && categories.length > 0 });

                // Test 7: Quiz questions válidas
                var quizValid = Array.isArray(quizQuestions) && quizQuestions.every(function(q) {
                    return q && q.question && Array.isArray(q.options) && typeof q.correct === 'number';
                });
                this.tests.push({ name: 'quizQuestions válido', pass: quizValid });

                // Test 8: projectTasks válido
                var tasksValid = projectTasks && projectTasks.completed && projectTasks.inProgress && projectTasks.pending;
                this.tests.push({ name: 'projectTasks válido', pass: tasksValid });

                // Generar reporte
                var passed = this.tests.filter(function(t) { return t.pass; }).length;
                var total = this.tests.length;

                console.log('%c═══════════════════════════════════════════', 'color: #8b5cf6; font-weight: bold;');
                console.log('%c   AVIA Studio v4 - Diagnóstico Automático', 'color: #8b5cf6; font-weight: bold; font-size: 14px;');
                console.log('%c═══════════════════════════════════════════', 'color: #8b5cf6; font-weight: bold;');

                this.tests.forEach(function(t) {
                    var icon = t.pass ? '✅' : '❌';
                    var color = t.pass ? 'color: #10b981' : 'color: #ef4444; font-weight: bold';
                    console.log('%c' + icon + ' ' + t.name, color);
                });

                console.log('%c───────────────────────────────────────────', 'color: #71717a;');
                var resultColor = passed === total ? 'color: #10b981; font-weight: bold' : 'color: #f59e0b; font-weight: bold';
                console.log('%c📊 Resultado: ' + passed + '/' + total + ' tests pasados (' + Math.round(passed/total*100) + '%)', resultColor);

                if (this.errors.length > 0) {
                    console.log('%c⚠️ Errores detectados: ' + this.errors.length, 'color: #ef4444; font-weight: bold');
                }

                return { passed: passed, total: total, tests: this.tests, errors: this.errors };
            },

            getReport: function() {
                return {
                    timestamp: new Date().toISOString(),
                    version: 'AVIA Studio v4',
                    tests: this.tests,
                    errors: this.errors,
                    warnings: this.warnings,
                    summary: {
                        testsRun: this.tests.length,
                        testsPassed: this.tests.filter(function(t) { return t.pass; }).length,
                        errorsCount: this.errors.length,
                        warningsCount: this.warnings.length
                    }
                };
            }
        };

        // Capturar errores globales
        window.onerror = function(msg, url, line, col, error) {
            DiagnosticModule.log('error', msg, { url: url, line: line, col: col, stack: error ? error.stack : null });
            return false;
        };

        // Ejecutar diagnóstico al cargar
        window.AVIA_Diagnostic = DiagnosticModule;
        setTimeout(function() { DiagnosticModule.runTests(); }, 1000);

        ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
    });
    </script>
</body>
</html>
