    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg-dark: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-elevated: #252542;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b2;
            --border: #2a2a4a;
            --glow: rgba(99, 102, 241, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animaciones */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px var(--glow); }
            50% { box-shadow: 0 0 40px var(--glow), 0 0 60px var(--glow); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Layout Principal */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: glow 3s ease-in-out infinite;
        }

        .logo-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text span {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Navegación */
        .nav-tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-dark);
            padding: 6px;
            border-radius: 12px;
        }

        .nav-tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tab:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-dark);
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.warning {
            background: var(--warning);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 3rem 0;
            margin-bottom: 2rem;
        }

        .hero h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* Constelación Grid */
        .constellation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 2rem;
        }

        /* Bot Card */
        .bot-card {
            background: linear-gradient(145deg, var(--bg-card), var(--bg-elevated));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .bot-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bot-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
        }

        .bot-card:hover::before {
            opacity: 1;
        }

        .bot-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .bot-avatar {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .bot-info h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .bot-info .acronym {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .bot-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .bot-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .bot-tag {
            padding: 4px 12px;
            background: var(--bg-dark);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .bot-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .bot-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-badge.development {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-badge.planned {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        /* Botón de acción */
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .action-btn.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .action-btn.secondary {
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .action-btn.secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Categories Filter */
        .categories-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .category-btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-btn:hover,
        .category-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: transparent;
        }

        .category-count {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        /* Stats Section */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 2rem 0;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeInUp 0.3s ease;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-dark);
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--error);
            color: white;
        }

        .feature-list {
            list-style: none;
            padding: 0;
        }

        .feature-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
        }

        .feature-list li:last-child {
            border-bottom: none;
        }

        .feature-icon {
            color: var(--success);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: fadeInUp 0.3s ease;
            z-index: 2000;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.warning {
            border-left: 4px solid var(--warning);
        }

        .toast.error {
            border-left: 4px solid var(--error);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 16px;
            }

            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h2 {
                font-size: 1.8rem;
            }

            .constellation-grid {
                grid-template-columns: 1fr;
            }

            .categories-filter {
                justify-content: flex-start;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 8px;
            }
        }

        /* Loading Spinner */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        /* SIESTA Banner */
        .siesta-banner {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid var(--primary);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .siesta-icon {
            font-size: 3rem;
            animation: float 3s ease-in-out infinite;
        }

        .siesta-info h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .siesta-info p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Sources Section */
        .sources-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-top: 2rem;
        }

        .sources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .source-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-dark);
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .source-icon {
            font-size: 1.2rem;
        }
    </style>
</head>

        // SISTEMA DE PERSISTENCIA SEGURO (Sin localStorage)
        // ============================================
        const SafeStorage = {
            _memoryStore: {},
            
            isAvailable: () => {
                try {
                    const test = '__storage_test__';
                    localStorage.setItem(test, test);
                    localStorage.removeItem(test);
                    return true;
                } catch (e) {
                    return false;
                }
            },
            
            getItem: (key) => {
                if (SafeStorage.isAvailable()) {
                    return localStorage.getItem(key);
                }
                return SafeStorage._memoryStore[key] || null;
            },
            
            setItem: (key, value) => {
                if (SafeStorage.isAvailable()) {
                    localStorage.setItem(key, value);
                } else {
                    SafeStorage._memoryStore[key] = value;
                }
            },
            
            removeItem: (key) => {
                if (SafeStorage.isAvailable()) {
                    localStorage.removeItem(key);
                } else {
                    delete SafeStorage._memoryStore[key];
                }
            }
        };

                description: 'Enfoque emocional para acompañamiento en salud mental con técnicas de mindfulness.',
                category: 'bienestar',
                status: 'active',
                tags: ['Salud Mental', 'Mindfulness', 'Emociones', 'Apoyo'],
                features: [

            {

                fullName: 'Apoyo a Personas Migrantes',

                color: '#f97316',
                description: 'Enfoque multicultural con traducción automática y guía de integración.',
                category: 'poblaciones',
                status: 'development',
                tags: ['Migración', 'Multicultural', 'Traducción', 'Integración'],
                features: [
                    'Traducción en tiempo real',
                    'Guía de trámites migratorios',
                    'Preservación de identidad cultural',
                    'Red de apoyo comunitario'
                ],
                source: 'Nature Human Behaviour'
            },
            // Nuevos módulos pendientes
            {

                emoji: '🏥',
                color: '#ef4444',
                description: 'Diseñado para pacientes hospitalizados con entretenimiento y comunicación familiar.',
                category: 'poblaciones',
                status: 'planned',
                tags: ['Hospital', 'Pacientes', 'Familia', 'Entretenimiento'],
                features: [
                    'Videollamadas simplificadas',
                    'Entretenimiento adaptado',
                    'Comunicación con equipo médico',
                    'Seguimiento de recuperación'
                ],
                source: 'Stanford HAI'
            },
            {
                id: 'maternidad',
                name: 'AVIA Nido',
                fullName: 'Acompañamiento en Maternidad',
                emoji: '🤱',
                color: '#f472b6',
                description: 'Apoyo integral durante el embarazo, parto y crianza temprana.',
                category: 'poblaciones',
                status: 'planned',
                tags: ['Maternidad', 'Embarazo', 'Crianza', 'Lactancia'],
                features: [
                    'Seguimiento del embarazo',
                    'Preparación para el parto',
                    'Guía de lactancia',
                    'Red de madres'
                ],
                source: 'MIT Media Lab'
            },
            {
                id: 'libertad',
                name: 'AVIA Horizonte',
                fullName: 'Reinserción de Personas Privadas de Libertad',
                emoji: '🔓',
                color: '#6b7280',
                description: 'Formación y apoyo para la reinserción social de personas en centros penitenciarios.',
                category: 'poblaciones',
                status: 'planned',
                tags: ['Reinserción', 'Formación', 'Empleo', 'Segunda Oportunidad'],
                features: [
                    'Cursos de formación profesional',
                    'Preparación para entrevistas',
                    'Conexión con empresas inclusivas',
                    'Apoyo psicológico continuo'
                ],
                source: 'OECD'
            }
        ];

        // Categorías
        const categories = [
            { id: 'all', name: 'Todos', emoji: '🌟', count: botsData.length },
            { id: 'inclusion', name: 'Inclusión', emoji: '♿', count: botsData.filter(b => b.category === 'inclusion').length },
            { id: 'poblaciones', name: 'Poblaciones', emoji: '👥', count: botsData.filter(b => b.category === 'poblaciones').length },
            { id: 'bienestar', name: 'Bienestar', emoji: '💚', count: botsData.filter(b => b.category === 'bienestar').length },
            { id: 'innovacion', name: 'Innovación', emoji: '🚀', count: botsData.filter(b => b.category === 'innovacion').length }
        ];

        // Fuentes clave
        const sources = [
            { name: 'Stanford HAI', icon: '🎓' },
            { name: 'MIT Media Lab', icon: '🔬' },
            { name: 'Nature Human Behaviour', icon: '📊' },
            { name: 'Frontiers in Psychology', icon: '🧠' },
            { name: 'UNESCO', icon: '🌐' },
            { name: 'OECD', icon: '📈' },
            { name: 'Digital Wellness', icon: '💚' }
        ];

        // ============================================
        // COMPONENTES
        // ============================================

        // Toast Component
        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`toast ${type}`}>
                    <span>{type === 'success' ? '✅' : type === 'warning' ? '⚠️' : '❌'}</span>
                    <span>{message}</span>
                </div>
            );
        }

        // Bot Card Component
        function BotCard({ bot, onClick }) {
            return (
                <div 
                    className="bot-card animate-fadeInUp"
                    onClick={() => onClick(bot)}
                    style={{ animationDelay: `${Math.random() * 0.3}s` }}
                >
                    <div className="bot-header">
                        <div 
                            className="bot-avatar"
                            style={{ background: `linear-gradient(135deg, ${bot.color}22, ${bot.color}44)` }}
                        >
                            {bot.emoji}
                        </div>
                        <div className="bot-info">
                            <h3>{bot.name}</h3>
                            <span className="acronym">{bot.fullName}</span>
                        </div>
                    </div>
                    
                    <p className="bot-description">{bot.description}</p>
                    
                    <div className="bot-tags">
                        {bot.tags.slice(0, 3).map((tag, i) => (
                            <span key={i} className="bot-tag">{tag}</span>
                        ))}
                    </div>
                    
                    <div className="bot-footer">
                        <div className="bot-status">
                            <span className={`status-badge ${bot.status}`}>
                                {bot.status === 'active' ? '✓ Activo' : 
                                 bot.status === 'development' ? '🔧 En desarrollo' : '📋 Planificado'}
                            </span>
                        </div>
                        <button className="action-btn secondary">
                            Ver más →
                        </button>
                    </div>
                </div>
            );
        }

        // Modal Component
        function BotModal({ bot, onClose }) {
            if (!bot) return null;

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <button className="modal-close" onClick={onClose}>×</button>
                        
                        <div className="modal-header">
                            <div 
                                className="bot-avatar animate-float"
                                style={{ 
                                    background: `linear-gradient(135deg, ${bot.color}33, ${bot.color}66)`,
                                    fontSize: '2.5rem',
                                    width: '80px',
                                    height: '80px'
                                }}
                            >
                                {bot.emoji}
                            </div>
                            <div>
                                <h2 style={{ fontSize: '1.5rem', marginBottom: '4px' }}>{bot.name}</h2>
                                <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>{bot.fullName}</p>
                                <span className="bot-tag" style={{ marginTop: '8px', display: 'inline-block' }}>
                                    Fuente: {bot.source}
                                </span>
                            </div>
                        </div>
                        
                        <div className="modal-body">
                            <p style={{ marginBottom: '24px', lineHeight: '1.7', color: 'var(--text-secondary)' }}>
                                {bot.description}
                            </p>
                            
                            <h4 style={{ marginBottom: '16px', color: 'var(--primary)' }}>
                                ✨ Características Principales
                            </h4>
                            <ul className="feature-list">
                                {bot.features.map((feature, i) => (
                                    <li key={i}>
                                        <span className="feature-icon">✓</span>
                                        {feature}
                                    </li>
                                ))}
                            </ul>
                            
                            <div style={{ marginTop: '24px', display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                                {bot.tags.map((tag, i) => (
                                    <span key={i} className="bot-tag">{tag}</span>
                                ))}
                            </div>
                            
                            <div style={{ marginTop: '24px', display: 'flex', gap: '12px' }}>
                                <button className="action-btn primary" style={{ flex: 1 }}>
                                    🚀 Activar Bot
                                </button>
                                <button className="action-btn secondary">
                                    📄 Documentación
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================
        // APP PRINCIPAL
        // ============================================
        function App() {
            const [activeTab, setActiveTab] = useState('constelacion');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [selectedBot, setSelectedBot] = useState(null);
            const [toast, setToast] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            // Inicialización segura (sin errores de localStorage)
            useEffect(() => {
                const savedCategory = SafeStorage.getItem('avia_category');
                if (savedCategory) {
                    setSelectedCategory(savedCategory);
                }
                console.log('✅ AVIA Studio v2 inicializado correctamente');
                console.log('📦 Modo de persistencia:', SafeStorage.isAvailable() ? 'localStorage' : 'memoria');
            }, []);

            // Guardar preferencias
            useEffect(() => {
                SafeStorage.setItem('avia_category', selectedCategory);
            }, [selectedCategory]);

            // Filtrar bots
            const filteredBots = botsData.filter(bot => {
                const matchesCategory = selectedCategory === 'all' || bot.category === selectedCategory;
                const matchesSearch = bot.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                     bot.fullName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                     bot.description.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            };

            const stats = {
                total: botsData.length,
                active: botsData.filter(b => b.status === 'active').length,
                development: botsData.filter(b => b.status === 'development').length,
                planned: botsData.filter(b => b.status === 'planned').length
            };

            return (
                <div className="app-container">
                    {/* Header */}
                    <header className="header">
                        <div className="header-content">
                            <div className="logo">
                                <div className="logo-icon">🧠</div>
                                <div className="logo-text">
                                    <h1>AVIA Studio</h1>
                                    <span>Constelación de Bots Inclusivos</span>
                                </div>
                            </div>
                            
                            <nav className="nav-tabs">
                                <button 
                                    className={`nav-tab ${activeTab === 'constelacion' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('constelacion')}
                                >
                                    🌟 Constelación
                                </button>
                                <button 
                                    className={`nav-tab ${activeTab === 'siesta' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('siesta')}
                                >
                                    🛌 SIESTA
                                </button>
                                <button 
                                    className={`nav-tab ${activeTab === 'vigilancia' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('vigilancia')}
                                >
                                    📡 Vigilancia
                                </button>
                            </nav>
                            
                            <div className="status-bar">
                                <div className="status-indicator">
                                    <span className="status-dot"></span>
                                    <span>{stats.active} bots activos</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="main-content">
                        {/* Hero */}
                        <section className="hero">
                            <h2>🌟 Constelación de Bots AVIA</h2>
                            <p>
                                Ecosistema de agentes inteligentes diseñados para empoderar a poblaciones vulnerables,
                                eliminar la brecha digital y promover la inclusión global. Basado en el marco metodológico
                                SIESTA y fuentes de Stanford HAI, MIT Media Lab, UNESCO y más.
                            </p>
                        </section>

                        {/* SIESTA Banner */}
                        <div className="siesta-banner">
                            <div className="siesta-icon">🛌</div>
                            <div className="siesta-info">
                                <h3>SIESTA - Sistema Integrado de e-Servicios y Tecnologías de Ayuda</h3>
                                <p>
                                    Marco metodológico núcleo que guía el desarrollo de todos los bots de la constelación.
                                    Tecnologías centradas en personas vulnerables con evaluación mediante rúbricas AVIA.
                                </p>
                            </div>
                        </div>

                        {/* Stats */}
                        <section className="stats-section">
                            <div className="stat-card">
                                <div className="stat-icon">🤖</div>
                                <div className="stat-value">{stats.total}</div>
                                <div className="stat-label">Bots Totales</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-icon">✅</div>
                                <div className="stat-value">{stats.active}</div>
                                <div className="stat-label">Activos</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-icon">🔧</div>
                                <div className="stat-value">{stats.development}</div>
                                <div className="stat-label">En Desarrollo</div>
                            </div>
                            <div className="stat-card">

                                <div className="stat-value">{stats.planned}</div>
                                <div className="stat-label">Planificados</div>
                            </div>
                        </section>

                        {/* Categories Filter */}
                        <div className="categories-filter">
                            {categories.map(cat => (
                                <button
                                    key={cat.id}
                                    className={`category-btn ${selectedCategory === cat.id ? 'active' : ''}`}
                                    onClick={() => setSelectedCategory(cat.id)}
                                >
                                    <span>{cat.emoji}</span>
                                    <span>{cat.name}</span>
                                    <span className="category-count">{cat.count}</span>
                                </button>
                            ))}
                        </div>

                        {/* Constellation Grid */}
                        <div className="constellation-grid">
                            {filteredBots.map(bot => (
                                <BotCard 
                                    key={bot.id} 
                                    bot={bot} 
                                    onClick={setSelectedBot}

                            ))}
                        </div>

                        {/* Sources Section */}
                        <section className="sources-section">
                            <h3 style={{ marginBottom: '8px' }}>📚 Fuentes de Vigilancia Transmedia</h3>

                                Basado en investigación de instituciones líderes en IA ética e inclusión digital

                                {sources.map((source, i) => (
                                    <div key={i} className="source-item">
                                        <span className="source-icon">{source.icon}</span>
                                        <span>{source.name}</span>

                    </main>

                    {/* Modal */}
                    {selectedBot && (
                        <BotModal 
                            bot={selectedBot} 
                            onClose={() => setSelectedBot(null)}

                    {/* Toast */}
                    {toast && (
                        <Toast 
                            message={toast.message} 
                            type={toast.type} 
                            onClose={() => setToast(null)} 
                        />
                    )}
                </div>
            );
        }

        // Render
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
