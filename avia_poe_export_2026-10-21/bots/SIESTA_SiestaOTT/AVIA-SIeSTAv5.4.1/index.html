<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA-SIESTA v5.4 - Constelación de Bots Inclusivos | Asistente TOOC v2.0 | Arquitectura Ontológica | Design Atomic | Protocolo MultiBot | WCAG 2.1 AA</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ============ AVIA-SIESTA v5.4 - ONTOLOGÍA & MULTIBOT EDITION ============ */
        /* WCAG 2.1 AA | Design Atomic | Protocolo MultiBot | Arquitectura Ontológica | 2025 */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* === VARIABLES CSS OPTIMIZADAS === */
        :root {
            /* Colores con contraste WCAG AA (4.5:1 mínimo) */
            --primary: #8b5cf6; --primary-light: #a78bfa; --primary-dark: #7c3aed;
            --secondary: #06b6d4; --accent: #f59e0b; --success: #10b981;
            --warning: #d97706; --error: #dc2626; --info: #2563eb;
            --bg-primary: #09090b; --bg-secondary: #18181b; --bg-tertiary: #27272a;
            --bg-elevated: #3f3f46; --bg-glass: rgba(24, 24, 27, 0.85);
            --text-primary: #fafafa; --text-secondary: #d4d4d8; --text-muted: #a1a1aa;
            --border: #3f3f46; --border-light: #52525b;
            --gradient-primary: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 50%, #10b981 100%);
            --gradient-warm: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            --gradient-bg: radial-gradient(ellipse at top left, #27272a 0%, #09090b 50%, #18181b 100%);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.5); --shadow-lg: 0 20px 60px rgba(0,0,0,0.6);
            --shadow-glow: 0 0 60px rgba(139, 92, 246, 0.25);
            /* Focus visible para accesibilidad */
            --focus-ring: 0 0 0 3px rgba(139, 92, 246, 0.5);
            --focus-ring-offset: 0 0 0 2px var(--bg-primary);
        }
        .light {
            --bg-primary: #fafafa; --bg-secondary: #f4f4f5; --bg-tertiary: #e4e4e7;
            --bg-elevated: #ffffff; --bg-glass: rgba(250, 250, 250, 0.92);
            --text-primary: #18181b; --text-secondary: #3f3f46; --text-muted: #52525b;
            --border: #d4d4d8; --border-light: #a1a1aa;
            --gradient-bg: radial-gradient(ellipse at top left, #f4f4f5 0%, #fafafa 50%, #e4e4e7 100%);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.1); --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
            --focus-ring-offset: 0 0 0 2px var(--bg-primary);
        }

        /* === ACCESIBILIDAD: Focus Visible === */
        *:focus { outline: none; }
        *:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
            box-shadow: var(--focus-ring);
        }

        /* === ACCESIBILIDAD: Reduced Motion === */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* === ACCESIBILIDAD: Skip Link === */
        .skip-link {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 12px 24px;
            border-radius: 0 0 12px 12px; z-index: 9999; font-weight: 600;
            transition: top 0.3s ease;
        }
        .skip-link:focus { top: 0; }

        /* === ACCESIBILIDAD: Screen Reader Only === */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gradient-bg); background-attachment: fixed;
            color: var(--text-primary); min-height: 100vh; line-height: 1.6;
            /* Mejora de rendimiento */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); } 50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6); } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* === AVIA AVATAR 3D - CAIMAN-BOT === */
        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-3px) rotate(1deg); }
            50% { transform: translateY(-6px) rotate(0deg); }
            75% { transform: translateY(-3px) rotate(-1deg); }
        }
        @keyframes avatarBlink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
        @keyframes avatarTalk {
            0%, 100% { transform: scaleY(1); }
            25% { transform: scaleY(0.7); }
            50% { transform: scaleY(1.1); }
            75% { transform: scaleY(0.8); }
        }
        @keyframes avatarThink {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px) rotate(-3deg); }
            75% { transform: translateX(2px) rotate(3deg); }
        }
        @keyframes avatarWave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(15deg); }
        }
        @keyframes avatarTailWag {
            0%, 100% { transform: rotate(-5deg) scaleX(1); }
            50% { transform: rotate(10deg) scaleX(1.05); }
        }
        @keyframes avatarBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes avatarGlow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(100, 180, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 20px rgba(100, 180, 255, 0.8)); }
        }
        @keyframes avatarBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        .avia-avatar-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .avia-avatar-container:hover {
            transform: scale(1.08);
        }
        .avia-avatar {
            width: 52px;
            height: 52px;
            animation: avatarFloat 4s ease-in-out infinite, avatarGlow 3s ease-in-out infinite;
        }
        .avia-avatar.talking {
            animation: avatarFloat 2s ease-in-out infinite, avatarGlow 1s ease-in-out infinite;
        }
        .avia-avatar.thinking {
            animation: avatarThink 1.5s ease-in-out infinite, avatarGlow 2s ease-in-out infinite;
        }
        .avia-avatar.celebrating {
            animation: avatarBounce 0.6s ease-in-out infinite, avatarGlow 0.5s ease-in-out infinite;
        }
        .avia-avatar .avatar-eye {
            transform-origin: center;
            animation: avatarBlink 4s ease-in-out infinite;
        }
        .avia-avatar.talking .avatar-mouth {
            animation: avatarTalk 0.3s ease-in-out infinite;
        }
        .avia-avatar .avatar-tail {
            transform-origin: left center;
            animation: avatarTailWag 1.5s ease-in-out infinite;
        }
        .avia-avatar .avatar-body {
            animation: avatarBreathe 3s ease-in-out infinite;
        }
        .avia-avatar .avatar-arm-right {
            transform-origin: top center;
        }
        .avia-avatar.waving .avatar-arm-right {
            animation: avatarWave 0.8s ease-in-out infinite;
        }

        .avatar-status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            border: 2px solid var(--bg-primary);
            animation: pulse 2s ease-in-out infinite;
        }
        .avatar-status-dot.busy {
            background: var(--warning);
        }
        .avatar-status-dot.offline {
            background: var(--text-muted);
            animation: none;
        }

        /* Avatar Panel Flotante */
        .avatar-panel {
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            opacity: 0;
            visibility: hidden;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            min-width: 280px;
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .avatar-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
        }
        .avatar-panel::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 14px;
            height: 14px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            border-top: 1px solid var(--border);
        }
        .avatar-panel-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .avatar-panel-avatar {
            width: 60px;
            height: 60px;
        }
        .avatar-panel-info h4 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .avatar-panel-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .avatar-panel-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            font-size: 0.88rem;
        }
        .avatar-panel-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        .avatar-panel-status-dot.talking {
            background: linear-gradient(135deg, #5BA4D9, #3A7AB9);
            animation: talkingWave 0.5s ease-in-out infinite alternate;
        }
        @keyframes talkingWave {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(91, 164, 217, 0.7); }
            100% { transform: scale(1.3); box-shadow: 0 0 0 6px rgba(91, 164, 217, 0); }
        }
        .avatar-panel-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .avatar-panel-btn {
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .avatar-panel-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .avatar-panel-btn.speaking {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--primary);
            color: white;
            animation: speakingPulse 1s ease-in-out infinite;
        }
        @keyframes speakingPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(91, 164, 217, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(91, 164, 217, 0); }
        }
        .avatar-mood-bar {
            display: flex;
            gap: 6px;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .mood-btn {
            flex: 1;
            padding: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mood-btn:hover, .mood-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.1);
        }
        .mood-btn.stop-btn {
            background: var(--danger);
            border-color: var(--danger);
        }
        .mood-btn.stop-btn:hover {
            background: #dc2626;
            border-color: #dc2626;
        }
        .avatar-panel-tip {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border);
        }

        /* Avatar grande para panel */
        .avatar-lg {
            width: 120px;
            height: 120px;
        }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        .animate-fadeInUp { animation: fadeInUp 0.5s ease-out backwards; }
        .animate-fadeInScale { animation: fadeInScale 0.35s ease-out; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }
        .animate-glow { animation: glow 2s ease-in-out infinite; }
        .animate-slideIn { animation: slideIn 0.4s ease-out; }
        .app-container { display: flex; flex-direction: column; min-height: 100vh; }
        .header {
            background: var(--bg-glass); backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem;
            position: sticky; top: 0; z-index: 100;
        }
        .header-content {
            max-width: 1800px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
        }
        .logo { display: flex; align-items: center; gap: 14px; }
        .logo-icon {
            width: 48px; height: 48px; background: var(--gradient-primary);
            border-radius: 14px; display: flex; align-items: center;
            justify-content: center; font-size: 24px; box-shadow: var(--shadow-glow);
        }
        .logo-text h1 {
            font-size: 1.5rem; font-weight: 800; background: var(--gradient-primary);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .logo-text span { font-size: 0.72rem; color: var(--text-muted); display: block; letter-spacing: 0.5px; }
        .search-container { flex: 1; max-width: 420px; position: relative; }
        .search-input {
            width: 100%; padding: 12px 18px 12px 48px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: 14px; color: var(--text-primary);
            font-size: 0.95rem; font-family: inherit; transition: all 0.3s ease;
        }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15); }
        .search-input::placeholder { color: var(--text-muted); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.1rem; }
        .nav-tabs { display: flex; gap: 4px; background: var(--bg-tertiary); padding: 5px; border-radius: 14px; }
        .nav-tab {
            padding: 10px 18px; border: none; background: transparent; color: var(--text-secondary);
            font-size: 0.88rem; font-weight: 600; cursor: pointer; border-radius: 10px;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; font-family: inherit;
        }
        .nav-tab:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .nav-tab.active { background: var(--gradient-primary); color: white; }
        .nav-tab .badge { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 8px; font-size: 0.72rem; }
        .theme-toggle {
            background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 14px; cursor: pointer; color: var(--text-secondary); font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover { background: var(--bg-elevated); color: var(--text-primary); transform: scale(1.05); }
        .main-content { flex: 1; max-width: 1800px; margin: 0 auto; padding: 1.5rem; width: 100%; }
        .task-dashboard { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .task-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .task-progress { display: flex; align-items: center; gap: 14px; }
        .progress-bar { width: 220px; height: 10px; background: var(--bg-tertiary); border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--gradient-primary); border-radius: 5px; transition: width 0.6s ease; }
        .progress-text { font-size: 0.88rem; color: var(--text-secondary); font-weight: 600; }
        .task-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
        .task-category { background: var(--bg-tertiary); border-radius: 14px; padding: 1.25rem; }
        .task-category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
        .task-category-title { font-size: 0.95rem; font-weight: 700; }
        .task-count { background: var(--bg-elevated); padding: 3px 10px; border-radius: 8px; font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
        .task-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .task-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-secondary); border-radius: 10px; font-size: 0.85rem; transition: all 0.2s ease; }
        .task-item:hover { background: var(--bg-elevated); transform: translateX(4px); }
        .task-item.completed { opacity: 0.5; }
        .task-item.completed .task-text { text-decoration: line-through; }
        .task-checkbox { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.75rem; }
        .task-checkbox.completed { background: var(--success); border-color: var(--success); color: white; }
        .task-checkbox.in-progress { background: var(--warning); border-color: var(--warning); color: white; }
        .task-text { flex: 1; color: var(--text-secondary); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .section-title { font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; gap: 12px; }
        .section-subtitle { color: var(--text-secondary); font-size: 1rem; margin-top: 6px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
        .bot-card {
            background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px;
            padding: 1.5rem; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
            position: relative; overflow: hidden;
        }
        .bot-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--gradient-primary); opacity: 0; transition: opacity 0.3s ease;
        }
        .bot-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: var(--shadow-lg), var(--shadow-glow); }
        .bot-card:hover::before { opacity: 1; }
        .bot-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
        .bot-avatar { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
        .bot-info h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 3px; }
        .bot-info .acronym { font-size: 0.78rem; color: var(--text-muted); }
        .bot-description { color: var(--text-secondary); font-size: 0.88rem; line-height: 1.6; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .bot-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .bot-tag { padding: 4px 12px; background: var(--bg-tertiary); border-radius: 8px; font-size: 0.75rem; color: var(--text-muted); border: 1px solid var(--border); font-weight: 500; }
        .bot-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--border); }
        .status-badge { padding: 5px 12px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-badge.development { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-badge.planned { background: rgba(139, 92, 246, 0.15); color: var(--primary); }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; }
        .btn-primary { background: var(--gradient-primary); color: white; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: var(--shadow-md), var(--shadow-glow); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-elevated); border-color: var(--primary); }
        .btn-ghost { background: transparent; color: var(--text-secondary); padding: 8px 14px; }

        /* ============ ONTOLOGÍA AVIA - MODAL DE DESAMBIGUACIÓN ============ */
        .ontology-disambiguation-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }
        .ontology-disambiguation-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            animation: fadeInScale 0.3s ease;
        }
        .ontology-disambiguation-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .ontology-disambiguation-header .icon {
            font-size: 2rem;
        }
        .ontology-disambiguation-header h3 {
            margin: 0;
            color: var(--text-primary);
            font-size: 1.25rem;
        }
        .ontology-disambiguation-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .ontology-option {
            padding: 16px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--bg-tertiary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .ontology-option:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.1);
        }
        .ontology-option.recommended {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }
        .ontology-option-label {
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ontology-option-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .ontology-recommended-badge {
            background: var(--success);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .ontology-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));

            font-weight: 600;
            color: var(--primary-light);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        .ontology-indicator .term {
            color: var(--secondary);
        }
        .ontology-term-tooltip {
            position: relative;
        }
        .ontology-term-tooltip:hover::after {
            content: attr(data-definition);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            max-width: 300px;
            white-space: normal;
            z-index: 1000;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        /* ============ COMANDOS ONTOLÓGICOS - GRAFO DE CONOCIMIENTO ============ */
        .ontology-graph-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .ontology-graph-svg {
            width: 100%;
            height: 100%;
        }
        .ontology-graph-node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .ontology-graph-node:hover {
            filter: brightness(1.2);
        }
        .ontology-graph-node circle {
            stroke: var(--bg-primary);
            stroke-width: 2;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }
        .ontology-graph-node text {
            fill: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
        }
        .ontology-graph-node .node-emoji {
            font-size: 16px;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .ontology-graph-link {
            stroke: var(--border-light);
            stroke-width: 1.5;
            fill: none;
            opacity: 0.6;
        }
        .ontology-graph-link.active {
            stroke: var(--primary);
            stroke-width: 2.5;
            opacity: 1;
        }
        .ontology-graph-legend {
            position: absolute;
            bottom: 16px;
            left: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: var(--bg-glass);
            padding: 12px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }
        .ontology-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .ontology-legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .ontology-graph-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
        }
        .ontology-graph-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-glass);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        .ontology-graph-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }
        .ontology-node-detail {
            position: absolute;
            top: 16px;
            left: 16px;
            max-width: 320px;
            background: var(--bg-glass);
            padding: 16px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            animation: fadeInScale 0.2s ease;
        }
        .ontology-node-detail h4 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .ontology-node-detail .definition {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .ontology-node-detail .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .ontology-node-detail .meta-tag {
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .ontology-commands-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .ontology-command-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .ontology-command-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .ontology-command-btn.active {
            background: linear-gradient(135deg, rgba(139,92,246,0.15) 0%, rgba(6,182,212,0.15) 100%);
            border-color: var(--primary);
        }
        .ontology-command-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: var(--bg-tertiary);
        }
        .ontology-command-info h4 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .ontology-command-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .ontology-validation-result {
            padding: 16px;
            border-radius: 12px;
            margin-top: 12px;
        }
        .ontology-validation-result.valid {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .ontology-validation-result.warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .ontology-validation-result.error {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
        }
        .ontology-context-output {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            color: var(--text-secondary);
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .ontology-term-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .ontology-term-card:hover {
            border-color: var(--primary);
        }
        .ontology-term-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .ontology-term-emoji {
            font-size: 24px;
        }
        .ontology-term-names h4 {
            font-size: 1rem;
            color: var(--text-primary);
        }
        .ontology-term-names span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .ontology-term-body p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .ontology-term-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .ontology-term-tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .ontology-term-tag.layer-red { background: rgba(220,38,38,0.15); color: #f87171; }
        .ontology-term-tag.layer-blue { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .ontology-term-tag.layer-green { background: rgba(16,185,129,0.15); color: #34d399; }
        .ontology-term-tag.layer-yellow { background: rgba(245,158,11,0.15); color: #fbbf24; }

        /* ============ ASISTENTE AVIA-SIESTA ============ */
        /* Botón flotante naranja cuadrado */
        .avia-assistant-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4), 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 9000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .avia-assistant-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            border-radius: 12px;
        }
        .avia-assistant-btn:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 6px 28px rgba(245, 158, 11, 0.5), 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        .avia-assistant-btn:active {
            transform: scale(0.98);
        }
        .avia-assistant-btn.pulse {
            animation: assistantPulse 2s ease-in-out infinite;
        }
        .avia-assistant-btn.open {
            transform: rotate(45deg);
        }
        @keyframes assistantPulse {
            0%, 100% { box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4), 0 0 0 0 rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 4px 20px rgba(245, 158, 11, 0.6), 0 0 0 12px rgba(245, 158, 11, 0); }
        }
        .avia-assistant-btn .icon-default,
        .avia-assistant-btn .icon-close {
            position: absolute;
            transition: all 0.3s ease;
        }
        .avia-assistant-btn .icon-close {
            opacity: 0;
            transform: rotate(-45deg) scale(0.8);
        }
        .avia-assistant-btn.open .icon-default {
            opacity: 0;
            transform: rotate(45deg) scale(0.8);
        }
        .avia-assistant-btn.open .icon-close {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        /* Badge de notificación */
        .avia-assistant-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            background: var(--error);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: white;
            border: 2px solid var(--bg-primary);
            animation: badgeBounce 0.5s ease;
        }
        @keyframes badgeBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Ventana del asistente */
        .avia-assistant-window {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 400px;
            max-width: calc(100vw - 40px);
            height: 600px;
            max-height: calc(100vh - 130px);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow-lg), 0 0 60px rgba(245, 158, 11, 0.15);
            z-index: 8999;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: assistantWindowOpen 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right;
        }
        .avia-assistant-window.closing {
            animation: assistantWindowClose 0.25s ease forwards;
        }
        @keyframes assistantWindowOpen {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes assistantWindowClose {
            from {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            to {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
        }

        /* Header de la ventana */
        .assistant-header {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .assistant-header-avatar {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .assistant-header-info {
            flex: 1;
        }
        .assistant-header-info h3 {
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .assistant-header-info span {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.8rem;
        }
        .assistant-header-actions {
            display: flex;
            gap: 8px;
        }
        .assistant-header-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .assistant-header-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.08);
        }

        /* Indicador de conexión VideoStudio */
        .assistant-videostudio-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.9);
            margin-right: 8px;
        }
        .assistant-videostudio-indicator .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: statusPulse 2s infinite;
        }
        .assistant-videostudio-indicator.disconnected .status-dot {
            background: #ef4444;
            animation: none;
        }
        .assistant-videostudio-indicator.generating .status-dot {
            background: #f59e0b;
            animation: statusPulse 0.5s infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        /* Mensaje de integración VideoStudio */
        .assistant-message.video-integration .message-bubble {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(217, 119, 6, 0.1) 100%);
            border-left: 3px solid #f59e0b;
        }
        .assistant-message.video-integration .message-bubble::before {
            content: '🎬';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 1.2rem;
        }

        /* Contenido del chat */
        .assistant-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Mensajes del asistente */
        .assistant-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .assistant-message {
            display: flex;
            gap: 12px;
            max-width: 100%;
        }
        .assistant-message.from-assistant {
            flex-direction: row;
        }
        .assistant-message.from-user {
            flex-direction: row-reverse;
        }
        .assistant-message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .assistant-message.from-assistant .assistant-message-avatar {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .assistant-message.from-user .assistant-message-avatar {

                        { id: 'operativa', name: 'Operativa', color: '#ef4444', icon: '⚙️' }
                    ]
                }
            },

            // Función de desambiguación principal
            disambiguate: function(input) {
                var result = {
                    found: false,
                    term: null,
                    context: '',
                    warnings: [],
                    suggestions: []
                };

                if (!input) return result;

                var upperInput = input.toUpperCase();
                var lowerInput = input.toLowerCase();

                // Buscar coincidencias exactas primero
                for (var key in this.terms) {
                    var term = this.terms[key];
                    var keyUpper = key.toUpperCase();

                    // Verificar si el término aparece en el input
                    if (upperInput.indexOf(keyUpper) !== -1) {
                        result.found = true;
                        result.term = term;
                        result.context = '🔒 DEFINICIÓN AVIA CANÓNICA:\n' +
                            '• ' + term.canonical + ' = ' + term.fullName + '\n' +
                            '• Definición: ' + term.definition + '\n' +
                            '• ⚠️ NO CONFUNDIR CON: ' + term.notConfuseWith.join(', ') + '\n' +
                            '• Categoría: ' + term.category + '\n' +
                            '• Términos relacionados: ' + term.related.join(', ');

                        // Verificar si hay potencial confusión
                        term.notConfuseWith.forEach(function(confusable) {
                            if (lowerInput.indexOf(confusable.toLowerCase()) !== -1) {
                                result.warnings.push({
                                    type: 'potential_confusion',
                                    message: 'Detectada posible confusión: "' + confusable + '" vs "' + term.canonical + '"',
                                    aviaInterpretation: term.canonical + ': ' + term.fullName,
                                    commonInterpretation: confusable
                                });
                            }
                        });

                        break; // Encontrado, salir del bucle
                    }
                }

                // Si no se encontró término exacto, buscar posibles confusiones
                if (!result.found) {
                    for (var k in this.terms) {
                        var t = this.terms[k];
                        t.notConfuseWith.forEach(function(confusable) {
                            if (lowerInput.indexOf(confusable.toLowerCase()) !== -1) {
                                result.suggestions.push({
                                    detected: confusable,
                                    suggestion: '¿Quisiste decir "' + t.canonical + '" (' + t.fullName + ')?',
                                    aviaDefinition: t.definition
                                });
                            }
                        });
                    }
                }

                return result;
            },

            // Generar contexto ontológico para inyección en prompts
            generateOntologyContext: function(input) {
                var disambiguation = this.disambiguate(input);
                var context = '';

                if (disambiguation.found) {
                    context = '\n\n🔒 === GUARDARRAÍL ONTOLÓGICO AVIA ===\n' +
                        disambiguation.context + '\n' +
                        '=== FIN GUARDARRAÍL ===\n';

                    if (disambiguation.warnings.length > 0) {
                        context += '\n⚠️ ALERTAS DE DESAMBIGUACIÓN:\n';
                        disambiguation.warnings.forEach(function(w) {
                            context += '• ' + w.message + '\n';
                        });
                    }
                }

                if (disambiguation.suggestions.length > 0) {
                    context += '\n💡 SUGERENCIAS ONTOLÓGICAS:\n';
                    disambiguation.suggestions.forEach(function(s) {
                        context += '• Detectado: "' + s.detected + '" → ' + s.suggestion + '\n';
                    });
                }

                return context;
            },

            // Verificar si necesita desambiguación interactiva
            needsUserDisambiguation: function(input) {
                var result = this.disambiguate(input);
                return result.warnings.length > 0 || result.suggestions.length > 0;
            },

            // Obtener todas las posibles interpretaciones para UI
            getInterpretations: function(input) {
                var result = this.disambiguate(input);
                var interpretations = [];

                if (result.found && result.warnings.length > 0) {
                    result.warnings.forEach(function(w) {
                        interpretations.push({
                            type: 'avia',
                            label: w.aviaInterpretation,
                            description: result.term.definition,
                            recommended: true
                        });
                        interpretations.push({
                            type: 'common',
                            label: w.commonInterpretation,
                            description: 'Interpretación común/externa',
                            recommended: false
                        });
                    });
                }

                result.suggestions.forEach(function(s) {
                    interpretations.push({
                        type: 'suggestion',
                        label: s.suggestion,
                        description: s.aviaDefinition,
                        detected: s.detected
                    });
                });

                return interpretations;
            },

            // Aplicar interpretación seleccionada por el usuario
            applyInterpretation: function(input, interpretation) {
                if (interpretation.type === 'avia' && interpretation.recommended) {
                    // Usar contexto AVIA completo
                    return {
                        modifiedInput: input,
                        contextToInject: this.generateOntologyContext(input),
                        useAVIAContext: true
                    };
                } else {
                    // Usuario eligió interpretación común, no inyectar contexto AVIA
                    return {
                        modifiedInput: input,
                        contextToInject: '',
                        useAVIAContext: false
                    };
                }
            },

            // Obtener término por ID
            getTerm: function(termId) {
                return this.terms[termId.toUpperCase()] || null;
            },

            // Listar todos los términos
            listTerms: function() {
                var list = [];
                for (var key in this.terms) {
                    list.push({
                        id: key,
                        name: this.terms[key].canonical,
                        fullName: this.terms[key].fullName,
                        category: this.terms[key].category,
                        layer: this.terms[key].layer
                    });
                }
                return list;
            },

            // ============ COMANDOS ONTOLÓGICOS ============

            // COMANDO 1: Generar datos para Grafo de Conocimiento
            generateKnowledgeGraph: function() {
                var self = this;
                var nodes = [];
                var links = [];
                var layerColors = {
                    'red': '#ef4444',
                    'blue': '#3b82f6',
                    'green': '#10b981',
                    'yellow': '#f59e0b',
                    'orange': '#f97316'
                };
                var categoryIcons = {
                    'LearningCanvas': '📚',
                    'SubEcosystem': '🏠',
                    'Ecosystem': '🌐',
                    'Suite': '🛠️',
                    'Agent': '🤖',
                    'Workspace': '📐',
                    'Architecture': '🏗️',
                    'Design': '⚛️',
                    'AI': '🧠',
                    'Documentation': '📖',
                    'inclusion': '♿',
                    'bienestar': '💚',
                    'innovacion': '🚀'
                };

                // Crear nodos para cada término
                var termIds = Object.keys(this.terms);
                termIds.forEach(function(termId, index) {
                    var term = self.terms[termId];
                    var angle = (2 * Math.PI * index) / termIds.length;
                    var radius = 180;
                    nodes.push({
                        id: termId,
                        name: term.canonical,
                        fullName: term.fullName,
                        definition: term.definition ? term.definition.substring(0, 150) + '...' : '',
                        category: term.category,
                        layer: term.layer,
                        color: layerColors[term.layer] || '#8b5cf6',
                        icon: categoryIcons[term.category] || '📌',
                        x: 400 + radius * Math.cos(angle),
                        y: 250 + radius * Math.sin(angle),
                        radius: term.category === 'Ecosystem' || term.category === 'Architecture' ? 35 : 25,
                        related: term.related || []
                    });
                });

                // Crear enlaces basados en términos relacionados
                nodes.forEach(function(node) {
                    if (node.related && node.related.length > 0) {
                        node.related.forEach(function(relatedName) {
                            // Buscar si el término relacionado existe como nodo
                            var targetNode = nodes.find(function(n) {
                                return n.name.toLowerCase().indexOf(relatedName.toLowerCase()) !== -1 ||
                                       relatedName.toLowerCase().indexOf(n.name.toLowerCase()) !== -1;
                            });
                            if (targetNode && targetNode.id !== node.id) {
                                // Evitar duplicados
                                var exists = links.some(function(l) {
                                    return (l.source === node.id && l.target === targetNode.id) ||
                                           (l.source === targetNode.id && l.target === node.id);
                                });
                                if (!exists) {
                                    links.push({
                                        source: node.id,
                                        target: targetNode.id,
                                        strength: 0.5
                                    });
                                }
                            }
                        });
                    }
                });

                return {
                    nodes: nodes,
                    links: links,
                    legend: [
                        { color: '#ef4444', label: 'Gobierno/Arquitectura' },
                        { color: '#3b82f6', label: 'Innovación/Tecnología' },
                        { color: '#10b981', label: 'Impacto Humano' },
                        { color: '#f59e0b', label: 'Ética/Valores' }
                    ],
                    stats: {
                        totalTerms: nodes.length,
                        totalRelations: links.length,
                        categories: [...new Set(nodes.map(function(n) { return n.category; }))]
                    }
                };
            },

            // COMANDO 2: Explorar término ontológico en profundidad
            exploreTerm: function(termId) {
                var term = this.terms[termId.toUpperCase()];
                if (!term) {
                    // Buscar por nombre canónico
                    for (var key in this.terms) {
                        if (this.terms[key].canonical.toLowerCase() === termId.toLowerCase()) {
                            term = this.terms[key];
                            termId = key;
                            break;
                        }
                    }
                }
                if (!term) {
                    return {
                        found: false,
                        error: 'Término "' + termId + '" no encontrado en la ontología AVIA.',
                        suggestions: this.listTerms().slice(0, 5).map(function(t) { return t.name; })
                    };
                }

                // Construir exploración completa
                var exploration = {
                    found: true,
                    term: {
                        id: termId,
                        canonical: term.canonical,
                        fullName: term.fullName,
                        definition: term.definition,
                        category: term.category,
                        layer: term.layer
                    },
                    semantics: {
                        notConfuseWith: term.notConfuseWith || [],
                        related: term.related || [],
                        examples: term.examples || []
                    },
                    metadata: {
                        evidence: term.evidence || null,
                        creator: term.creator || null,
                        institution: term.institution || null
                    },
                    extras: {}
                };

                // Añadir campos específicos si existen
                if (term.keyFeatures) exploration.extras.keyFeatures = term.keyFeatures;
                if (term.pipeline) exploration.extras.pipeline = term.pipeline;
                if (term.hierarchy) exploration.extras.hierarchy = term.hierarchy;
                if (term.models) exploration.extras.models = term.models;
                if (term.chapters) exploration.extras.chapters = term.chapters;
                if (term.layers) exploration.extras.layers = term.layers;

                return exploration;
            },

            // COMANDO 3: Validar consistencia ontológica de un texto
            validateConsistency: function(text) {
                var self = this;
                var result = {
                    isConsistent: true,
                    termsFound: [],
                    warnings: [],
                    errors: [],
                    suggestions: [],
                    score: 100
                };

                if (!text || text.trim().length === 0) {
                    return {
                        isConsistent: false,
                        error: 'No se proporcionó texto para validar.',
                        score: 0
                    };
                }

                var lowerText = text.toLowerCase();

                // Verificar cada término de la ontología
                for (var termId in this.terms) {
                    var term = this.terms[termId];
                    var termLower = term.canonical.toLowerCase();

                    // Buscar si el término aparece en el texto
                    if (lowerText.indexOf(termLower) !== -1) {
                        result.termsFound.push({
                            term: term.canonical,
                            category: term.category,
                            layer: term.layer
                        });
                    }

                    // Verificar confusiones potenciales
                    if (term.notConfuseWith) {
                        term.notConfuseWith.forEach(function(confusable) {
                            if (lowerText.indexOf(confusable.toLowerCase()) !== -1) {
                                // Verificar si también aparece el término correcto
                                if (lowerText.indexOf(termLower) === -1) {
                                    result.warnings.push({
                                        type: 'potential_confusion',
                                        detected: confusable,
                                        suggestion: 'Posible confusión con "' + term.canonical + '" (' + term.fullName + ')',
                                        severity: 'medium'
                                    });
                                    result.score -= 10;
                                }
                            }
                        });
                    }
                }

                // Verificar uso de acrónimos sin contexto
                var acronyms = text.match(/\b[A-Z]{3,}\b/g) || [];
                acronyms.forEach(function(acronym) {
                    if (!self.terms[acronym]) {
                        result.suggestions.push({
                            type: 'unknown_acronym',
                            acronym: acronym,
                            message: 'Acrónimo "' + acronym + '" no encontrado en la ontología AVIA. Considere añadirlo o usar el término completo.'
                        });
                        result.score -= 5;
                    }
                });

                // Determinar consistencia final
                result.isConsistent = result.errors.length === 0 && result.warnings.length <= 2;
                result.score = Math.max(0, Math.min(100, result.score));

                // Generar resumen
                result.summary = {
                    status: result.score >= 80 ? 'valid' : (result.score >= 50 ? 'warning' : 'error'),
                    message: result.score >= 80
                        ? '✅ Texto consistente con la ontología AVIA'
                        : (result.score >= 50
                            ? '⚠️ Texto con algunas inconsistencias menores'
                            : '❌ Texto con problemas de consistencia ontológica'),
                    termsUsed: result.termsFound.length,
                    warningsCount: result.warnings.length
                };

                return result;
            },

            // COMANDO 4: Generar contexto ontológico para inyección en LLM
            generateLLMContext: function(userPrompt, options) {
                options = options || {};
                var includeFullDefinitions = options.fullDefinitions !== false;
                var includeExamples = options.examples !== false;
                var includeWarnings = options.warnings !== false;
                var maxTerms = options.maxTerms || 5;

                var self = this;
                var context = '';
                var termsIncluded = [];

                // Detectar términos mencionados
                var lowerPrompt = userPrompt.toLowerCase();

                for (var termId in this.terms) {
                    var term = this.terms[termId];
                    var termLower = term.canonical.toLowerCase();

                    if (lowerPrompt.indexOf(termLower) !== -1 && termsIncluded.length < maxTerms) {
                        termsIncluded.push({
                            id: termId,
                            term: term
                        });
                    }
                }

                if (termsIncluded.length === 0) {
                    return {
                        context: '',
                        termsDetected: 0,
                        message: 'No se detectaron términos AVIA en el prompt.'
                    };
                }

                // Construir contexto estructurado
                context = '\n\n🔒 ══════════ CONTEXTO ONTOLÓGICO AVIA ══════════\n\n';
                context += '📌 SISTEMA: Guardarraíl semántico activo\n';
                context += '📊 TÉRMINOS DETECTADOS: ' + termsIncluded.length + '\n\n';

                termsIncluded.forEach(function(item, index) {
                    var term = item.term;
                    context += '━━━ TÉRMINO ' + (index + 1) + ': ' + term.canonical + ' ━━━\n';
                    context += '• Nombre completo: ' + term.fullName + '\n';

                    if (includeFullDefinitions && term.definition) {
                        context += '• Definición: ' + term.definition + '\n';
                    }

                    context += '• Categoría: ' + term.category + '\n';

                    if (includeWarnings && term.notConfuseWith && term.notConfuseWith.length > 0) {
                        context += '• ⚠️ NO CONFUNDIR CON: ' + term.notConfuseWith.join(', ') + '\n';
                    }

                    if (includeExamples && term.examples && term.examples.length > 0) {
                        context += '• Ejemplos: ' + term.examples.slice(0, 2).join('; ') + '\n';
                    }

                    if (term.creator) {
                        context += '• Creador: ' + term.creator + (term.institution ? ' (' + term.institution + ')' : '') + '\n';
                    }

                    context += '\n';
                });

                context += '══════════ FIN CONTEXTO ONTOLÓGICO ══════════\n\n';
                context += '💡 INSTRUCCIÓN: Usa estas definiciones canónicas de AVIA en tu respuesta.\n';

                return {
                    context: context,
                    termsDetected: termsIncluded.length,
                    terms: termsIncluded.map(function(i) { return i.term.canonical; }),
                    message: 'Contexto generado con ' + termsIncluded.length + ' término(s) AVIA.',
                    promptEnriched: userPrompt + context
                };
            },

            // COMANDO 1 AVANZADO: Grafo con filtros y configuración
            generateAdvancedGraph: function(options) {
                options = options || {};
                var self = this;
                var filterCategories = options.filterCategories || null;
                var filterLayers = options.filterLayers || null;
                var highlightTerms = options.highlightTerms || [];
                var layout = options.layout || 'circular'; // 'circular', 'hierarchical', 'force'
                var showRelationLabels = options.showRelationLabels || false;

                var baseGraph = this.generateKnowledgeGraph();
                var nodes = baseGraph.nodes;
                var links = baseGraph.links;

                // Aplicar filtros
                if (filterCategories && filterCategories.length > 0) {
                    nodes = nodes.filter(function(n) {
                        return filterCategories.indexOf(n.category) !== -1;
                    });
                    var nodeIds = nodes.map(function(n) { return n.id; });
                    links = links.filter(function(l) {
                        return nodeIds.indexOf(l.source) !== -1 && nodeIds.indexOf(l.target) !== -1;
                    });
                }

                if (filterLayers && filterLayers.length > 0) {
                    nodes = nodes.filter(function(n) {
                        return filterLayers.indexOf(n.layer) !== -1;
                    });
                    var nodeIds2 = nodes.map(function(n) { return n.id; });
                    links = links.filter(function(l) {
                        return nodeIds2.indexOf(l.source) !== -1 && nodeIds2.indexOf(l.target) !== -1;
                    });
                }

                // Recalcular posiciones según layout
                if (layout === 'circular') {
                    nodes.forEach(function(node, index) {
                        var angle = (2 * Math.PI * index) / nodes.length;
                        var radius = 180;
                        node.x = 400 + radius * Math.cos(angle);
                        node.y = 250 + radius * Math.sin(angle);
                    });
                } else if (layout === 'hierarchical') {
                    // Organizar por capas
                    var layerOrder = ['red', 'blue', 'green', 'yellow'];
                    var layerGroups = {};
                    nodes.forEach(function(node) {
                        if (!layerGroups[node.layer]) layerGroups[node.layer] = [];
                        layerGroups[node.layer].push(node);
                    });
                    var yOffset = 80;
                    layerOrder.forEach(function(layer, layerIndex) {
                        var group = layerGroups[layer] || [];
                        group.forEach(function(node, nodeIndex) {
                            node.x = 100 + (nodeIndex * 150);
                            node.y = yOffset + (layerIndex * 120);
                        });
                    });
                }

                // Marcar nodos destacados
                if (highlightTerms.length > 0) {
                    nodes.forEach(function(node) {
                        node.highlighted = highlightTerms.some(function(t) {
                            return node.name.toLowerCase().indexOf(t.toLowerCase()) !== -1;
                        });
                    });
                }

                return {
                    nodes: nodes,
                    links: links,
                    legend: baseGraph.legend,
                    stats: {
                        totalTerms: nodes.length,
                        totalRelations: links.length,
                        filteredFrom: baseGraph.stats.totalTerms,
                        layout: layout
                    },
                    config: options
                };
            },

            // COMANDO 2 AVANZADO: Exploración con comparación y navegación
            exploreTermAdvanced: function(termId, options) {
                options = options || {};
                var includeRelatedDetails = options.includeRelatedDetails || false;
                var compareWith = options.compareWith || null;
                var showUsageExamples = options.showUsageExamples || false;

                var baseExploration = this.exploreTerm(termId);
                if (!baseExploration.found) return baseExploration;

                var self = this;
                var result = Object.assign({}, baseExploration);

                // Añadir detalles de términos relacionados
                if (includeRelatedDetails && result.semantics.related.length > 0) {
                    result.relatedDetails = [];
                    result.semantics.related.slice(0, 5).forEach(function(relName) {
                        for (var key in self.terms) {
                            if (self.terms[key].canonical.toLowerCase().indexOf(relName.toLowerCase()) !== -1) {
                                result.relatedDetails.push({
                                    id: key,
                                    name: self.terms[key].canonical,
                                    fullName: self.terms[key].fullName,
                                    category: self.terms[key].category,
                                    layer: self.terms[key].layer
                                });
                                break;
                            }
                        }
                    });
                }

                // Comparar con otro término
                if (compareWith) {
                    var otherTerm = this.exploreTerm(compareWith);
                    if (otherTerm.found) {
                        result.comparison = {
                            term1: result.term,
                            term2: otherTerm.term,
                            similarities: [],
                            differences: []
                        };

                        // Encontrar similitudes
                        if (result.term.category === otherTerm.term.category) {
                            result.comparison.similarities.push('Misma categoría: ' + result.term.category);
                        }
                        if (result.term.layer === otherTerm.term.layer) {
                            result.comparison.similarities.push('Misma capa: ' + result.term.layer);

                            result.comparison.differences.push('Categorías: ' + result.term.category + ' vs ' + otherTerm.term.category);
                        }
                        if (result.term.layer !== otherTerm.term.layer) {
                            result.comparison.differences.push('Capas: ' + result.term.layer + ' vs ' + otherTerm.term.layer);
                        }

                        // Verificar si están relacionados
                        var term1Related = result.semantics.related.map(function(r) { return r.toLowerCase(); });
                        var term2Related = otherTerm.semantics.related.map(function(r) { return r.toLowerCase(); });
                        if (term1Related.indexOf(otherTerm.term.canonical.toLowerCase()) !== -1 ||
                            term2Related.indexOf(result.term.canonical.toLowerCase()) !== -1) {
                            result.comparison.similarities.push('Términos directamente relacionados');
                        }
                    }
                }

                // Ejemplos de uso en proyectos

                }
