            // COMANDO 3 AVANZADO: Validación con perfiles y reglas personalizadas
            validateAdvanced: function(text, options) {
                options = options || {};
                var profile = options.profile ? this.projectProfiles[options.profile] : null;
                var customRules = options.customRules || {};
                var strictMode = options.strictMode || false;

                // Validación base
                var baseValidation = this.validateConsistency(text);
                var result = Object.assign({}, baseValidation);
                result.profileUsed = profile ? profile.name : 'Ninguno';
                result.customChecks = [];

                // Aplicar reglas del perfil
                if (profile) {
                    // Verificar términos requeridos
                    var lowerText = text.toLowerCase();
                    profile.requiredTerms.forEach(function(reqTerm) {
                        var found = lowerText.indexOf(reqTerm.toLowerCase()) !== -1;
                        if (!found) {
                            result.customChecks.push({
                                type: 'missing_required',
                                term: reqTerm,
                                message: 'Término requerido "' + reqTerm + '" no encontrado',
                                severity: strictMode ? 'error' : 'warning'
                            });
                            result.score -= strictMode ? 15 : 8;
                        }
                    });

                    // Verificar mínimo de términos
                    if (profile.validationRules.minTerms && result.termsFound.length < profile.validationRules.minTerms) {
                        result.customChecks.push({
                            type: 'insufficient_terms',
                            required: profile.validationRules.minTerms,
                            found: result.termsFound.length,
                            message: 'Se requieren al menos ' + profile.validationRules.minTerms + ' términos AVIA',
                            severity: 'warning'
                        });
                        result.score -= 10;
                    }

                    // Verificar accesibilidad si es requerida
                    if (profile.validationRules.requireAccessibility) {
                        var accessibilityTerms = ['accesib', 'wcag', 'inclusiv', 'universal', 'a11y'];
                        var hasAccessibility = accessibilityTerms.some(function(t) {
                            return lowerText.indexOf(t) !== -1;
                        });
                        if (!hasAccessibility) {
                            result.customChecks.push({
                                type: 'accessibility_missing',
                                message: 'El perfil requiere menciones de accesibilidad',
                                severity: 'warning'
                            });
                            result.score -= 5;
                        }
                    }

                    // Verificar creador si es requerido
                    if (profile.validationRules.requireCreator) {
                        var hasCreator = lowerText.indexOf('carlos de castro') !== -1 ||
                                        lowerText.indexOf('universidad de córdoba') !== -1 ||
                                        lowerText.indexOf('uco') !== -1;
                        if (!hasCreator) {
                            result.customChecks.push({
                                type: 'creator_missing',
                                message: 'El perfil académico recomienda citar al creador/institución',
                                severity: 'suggestion'
                            });
                        }
                    }
                }

                // Aplicar reglas personalizadas
                if (customRules.forbiddenWords) {
                    customRules.forbiddenWords.forEach(function(word) {
                        if (text.toLowerCase().indexOf(word.toLowerCase()) !== -1) {
                            result.customChecks.push({
                                type: 'forbidden_word',
                                word: word,
                                message: 'Palabra no permitida: "' + word + '"',
                                severity: 'error'
                            });
                            result.score -= 20;
                        }
                    });
                }

                if (customRules.requiredPhrases) {
                    customRules.requiredPhrases.forEach(function(phrase) {
                        if (text.toLowerCase().indexOf(phrase.toLowerCase()) === -1) {
                            result.customChecks.push({
                                type: 'missing_phrase',
                                phrase: phrase,
                                message: 'Frase requerida no encontrada: "' + phrase + '"',
                                severity: 'warning'
                            });
                            result.score -= 10;
                        }
                    });
                }

                // Recalcular estado
                result.score = Math.max(0, Math.min(100, result.score));
                result.summary.status = result.score >= 80 ? 'valid' : (result.score >= 50 ? 'warning' : 'error');
                result.summary.message = result.score >= 80
                    ? '✅ Texto consistente con ontología AVIA' + (profile ? ' (perfil: ' + profile.name + ')' : '')
                    : (result.score >= 50
                        ? '⚠️ Texto con inconsistencias menores'
                        : '❌ Texto con problemas significativos');

                return result;
            },

            // COMANDO 4 AVANZADO: Generación de contexto multi-formato
            generateAdvancedContext: function(userPrompt, options) {
                options = options || {};
                var profile = options.profile ? this.projectProfiles[options.profile] : null;
                var template = options.template ? this.contextTemplates[options.template] : null;
                var format = options.format || 'structured'; // 'structured', 'json', 'markdown', 'minimal'
                var includeSystemPrompt = options.includeSystemPrompt !== false;
                var targetBot = options.targetBot || 'Claude-Sonnet-4.5';

                var baseContext = this.generateLLMContext(userPrompt, {
                    fullDefinitions: options.fullDefinitions !== false,
                    examples: options.examples !== false,
                    warnings: options.warnings !== false,
                    maxTerms: options.maxTerms || 5
                });

                if (baseContext.termsDetected === 0) {
                    return baseContext;
                }

                var self = this;
                var result = Object.assign({}, baseContext);
                result.format = format;
                result.profile = profile ? profile.name : null;

                // Aplicar plantilla de contexto
                if (template || (profile && profile.contextTemplate)) {
                    var tpl = template || this.contextTemplates[profile.contextTemplate];
                    result.templateApplied = tpl.header;
                    result.instruction = tpl.instruction;
                    result.tone = tpl.tone;
                }

                // Generar en diferentes formatos
                switch (format) {
                    case 'json':
                        result.contextFormatted = JSON.stringify({
                            system: 'AVIA Ontology Guardrail',
                            terms: result.terms,
                            definitions: baseContext.context,
                            instruction: result.instruction || 'Usa estas definiciones canónicas',
                            tone: result.tone || 'neutro'
                        }, null, 2);
                        break;

                    case 'markdown':
                        var md = '# 🔒 Contexto Ontológico AVIA\n\n';
                        md += '> **Sistema:** Guardarraíl semántico activo\n\n';
                        md += '## Términos Detectados: ' + result.terms.length + '\n\n';
                        result.terms.forEach(function(termName, i) {
                            var termData = null;
                            for (var key in self.terms) {
                                if (self.terms[key].canonical === termName) {
                                    termData = self.terms[key];
                                    break;
                                }
                            }
                            if (termData) {
                                md += '### ' + (i + 1) + '. ' + termData.canonical + '\n\n';
                                md += '**Nombre completo:** ' + termData.fullName + '\n\n';
                                md += termData.definition + '\n\n';
                                if (termData.notConfuseWith && termData.notConfuseWith.length > 0) {
                                    md += '⚠️ **No confundir con:** ' + termData.notConfuseWith.join(', ') + '\n\n';
                                }
                                md += '---\n\n';
                            }
                        });
                        if (result.instruction) {
                            md += '## 💡 Instrucción\n\n' + result.instruction + '\n';
                        }
                        result.contextFormatted = md;
                        break;

                    case 'minimal':
                        var min = 'AVIA TERMS: ' + result.terms.join(', ') + '. ';
                        min += 'Use canonical definitions. ';
                        if (result.instruction) {
                            min += result.instruction;
                        }
                        result.contextFormatted = min;
                        break;

                    default: // structured
                        result.contextFormatted = baseContext.context;
                }

                // Generar system prompt si se solicita
                if (includeSystemPrompt) {
                    var sysPrompt = 'Eres un asistente especializado en el ecosistema AVIA. ';
                    if (profile) {
                        sysPrompt += 'Estás trabajando en un proyecto de tipo "' + profile.name + '". ';
                    }
                    if (result.tone) {
                        sysPrompt += 'Tu tono debe ser: ' + result.tone + '. ';
                    }
                    sysPrompt += 'Usa las definiciones canónicas de AVIA proporcionadas en el contexto.';
                    result.systemPrompt = sysPrompt;
                }

                // Generar prompt enriquecido final
                result.promptEnriched = (result.systemPrompt ? '[SYSTEM] ' + result.systemPrompt + '\n\n' : '') +
                                        userPrompt + '\n\n' + result.contextFormatted;

                // Información de integración
                result.integration = {
                    videoStudio: 'window.AVIA_VideoStudio.setTopic("' + userPrompt.substring(0, 50) + '...")',
                    assistant: 'Enviar al asistente AVIA con contexto',
                    poeAPI: '@' + targetBot + ' ' + result.promptEnriched.substring(0, 100) + '...'
                };

                return result;
            },

            },

            // Obtener frase aleatoria por categoría
            getPhrase: function(category) {
                var categoryPhrases = this.phrases[category] || this.phrases.greeting;
                return categoryPhrases[Math.floor(Math.random() * categoryPhrases.length)];
            },

            // Reproducir voz con Poe API (ElevenLabs)
            speak: function(text, onStart, onEnd) {
                var self = this;
                if (self.isPlaying) {
                    console.log('[AVIA Voice] Ya hay audio reproduciéndose');
                    return;
                }

                self.currentPhrase = text;
                self.isPlaying = true;
                if (onStart) onStart();

                // Verificar si Poe API está disponible
                if (!window.Poe || !window.Poe.sendUserMessage) {
                    console.log('%c[AVIA Voice] Modo demo - Poe API no disponible', 'color: #f59e0b;');
                    console.log('%c[AVIA dice] ' + text, 'color: #5BA4D9; font-style: italic;');
                    // Simular duración del audio
                    setTimeout(function() {
                        self.isPlaying = false;
                        if (onEnd) onEnd();
                    }, 2000 + text.length * 50);
                    return;
                }

                // Usar ElevenLabs a través de Poe
                var handlerName = 'avia-voice-' + Date.now();

                window.Poe.registerHandler(handlerName, function(result) {
                    var response = result.responses && result.responses[0];
                    if (response) {
                        if (response.status === 'complete') {
                            // Buscar attachment de audio
                            if (response.attachments && response.attachments.length > 0) {
                                var audioAttachment = response.attachments.find(function(a) {
                                    return a.mimeType && a.mimeType.startsWith('audio/');
                                });
                                if (audioAttachment) {
                                    self.playAudio(audioAttachment.url, onEnd);
                                } else {
                                    self.isPlaying = false;
                                    if (onEnd) onEnd();
                                }
                            } else {
                                self.isPlaying = false;
                                if (onEnd) onEnd();
                            }
                        } else if (response.status === 'error') {
                            console.error('[AVIA Voice] Error:', response.statusText);
                            self.isPlaying = false;
                            if (onEnd) onEnd();
                        }
                    }
                });

                window.Poe.sendUserMessage('@ElevenLabs-v2.5-Turbo ' + text + ' --voice Jessica --language es', {
                    handler: handlerName,
                    stream: false,
                    openChat: false
                }).catch(function(err) {
                    console.error('[AVIA Voice] Error enviando mensaje:', err);
                    self.isPlaying = false;
                    if (onEnd) onEnd();
                });
            },

            // Reproducir audio desde URL
            playAudio: function(url, onEnd) {
                var self = this;
                if (self.audioElement) {
                    self.audioElement.pause();
                }
                self.audioElement = new Audio(url);
                self.audioElement.onended = function() {
                    self.isPlaying = false;
                    if (onEnd) onEnd();
                };
                self.audioElement.onerror = function() {
                    console.error('[AVIA Voice] Error reproduciendo audio');
                    self.isPlaying = false;
                    if (onEnd) onEnd();
                };
                self.audioElement.play().catch(function(err) {
                    console.error('[AVIA Voice] Error play():', err);
                    self.isPlaying = false;
                    if (onEnd) onEnd();
                });
            },

            // Detener audio
            stop: function() {
                if (this.audioElement) {
                    this.audioElement.pause();
                    this.audioElement = null;
                }
                this.isPlaying = false;
            },

            speakForState: function(state, onStart, onEnd) {
                var categoryMap = {
                    'idle': 'greeting',
                    'talking': 'talking',
                    'thinking': 'thinking',
                    'celebrating': 'celebrating',
                    'waving': 'waving'
                };
                var category = categoryMap[state] || 'greeting';
                var phrase = this.getPhrase(category);
                this.speak(phrase, onStart, onEnd);
            }

            var stateShowTemplates = useState(false), showTemplates = stateShowTemplates[0], setShowTemplates = stateShowTemplates[1];

            // Función para aplicar plantilla
            function applyTemplate(template) {
                if (template && template.promptTemplate) {

                    var currentTopic = prompt.trim() || 'el tema seleccionado';
                    var newPrompt = template.promptTemplate.replace(/\[TEMA\]/g, currentTopic);

            // Función para guardar en historial
            function saveToHistory(topic, style, resultsData, timingsData, totalTimeVal) {
                var entry = {

            // ============ EXPOSICIÓN GLOBAL PARA INTEGRACIÓN CON ASISTENTE ============
            // Exponer controles de VideoStudio globalmente para que el Asistente pueda interactuar

            // Obtener estilo seleccionado
            var currentStyle = videoStyles.find(function(s) { return s.id === selectedStyle; }) || videoStyles[0];

            // ============ SISTEMA DE CONTEXTO INTELIGENTE CON ONTOLOGÍA ============
            // Detectar si el tema está relacionado con AVIA + validación ontológica
            function detectAVIAContext(inputText) {
                var lowerInput = inputText.toLowerCase();
                var upperInput = inputText.toUpperCase();

                // NUEVO: Primero validar contra la ontología AVIA
                var ontologyResult = aviaOntology.disambiguate(inputText);

                var aviaKeywords = ['avia', 'constelación', 'constelacion', 'bots inclusivos', 'siesta', 'videolab', 'simlab', 'cuida', 'humana', 'diversia', 'chispa', 'nómada', 'nomada', 'raíces', 'raices', 'calma', 'guardián', 'guardian', 'mentor', 'caiman', 'caimán', 'tooc', 'scorm', 'lti'];

                var isAVIARelated = aviaKeywords.some(function(kw) { return lowerInput.indexOf(kw) !== -1; });

                // Si la ontología encontró un término, también es AVIA-related
                if (ontologyResult.found) {
                    isAVIARelated = true;
                }

                // Detectar qué bots específicos se mencionan
                var mentionedBots = [];
                botsData.forEach(function(bot) {
                    if (lowerInput.indexOf(bot.name.toLowerCase()) !== -1 ||
                        lowerInput.indexOf(bot.id.toLowerCase()) !== -1) {
                        mentionedBots.push(bot);
                    }
                });

                return {
                    isAVIARelated: isAVIARelated,
                    mentionedBots: mentionedBots,
                    needsMoreInfo: !isAVIARelated && lowerInput.length < 20,
                    // NUEVO: Datos de la ontología
                    ontologyMatch: ontologyResult.found ? ontologyResult.term : null,
                    ontologyContext: ontologyResult.found ? aviaOntology.generateOntologyContext(inputText) : '',
                    needsDisambiguation: ontologyResult.warnings.length > 0 || ontologyResult.suggestions.length > 0,
                    disambiguationWarnings: ontologyResult.warnings,
                    disambiguationSuggestions: ontologyResult.suggestions
                };
            }

            // Generar contexto de conocimiento basado en botsData
            function generateAVIAKnowledge() {
                var knowledge = '## BASE DE CONOCIMIENTO AVIA STUDIO\n\n';
                knowledge += '**AVIA Studio** es una Constelación de Bots Inclusivos diseñada para hacer la tecnología accesible para todos.\n\n';
                knowledge += '### Bots de la Constelación:\n';

                botsData.forEach(function(bot) {
                    knowledge += '- **' + bot.name + '** (' + bot.emoji + '): ' + bot.description + '\n';
                    knowledge += '  Características: ' + bot.features.join(', ') + '\n';
                });

                knowledge += '\n### Metodología SIESTA:\n';
                knowledge += '- S: Sistemas inteligentes\n- I: Inclusión total\n- E: Experiencia accesible\n- S: Soporte multimodal\n- T: Tecnología adaptativa\n- A: Asistencia personalizada\n';

                return knowledge;
            }

            // Generar contexto específico para un bot mencionado
            function generateBotContext(bots) {
                if (!bots || bots.length === 0) return '';
                var context = '\n## INFORMACIÓN ESPECÍFICA:\n';
                bots.forEach(function(bot) {
                    context += '\n### ' + bot.name + ' ' + bot.emoji + '\n';
                    context += '- **Descripción completa:** ' + bot.description + '\n';
                    context += '- **Categoría:** ' + bot.category + '\n';
                    context += '- **Estado:** ' + bot.status + '\n';
                    context += '- **Características:**\n';
                    bot.features.forEach(function(f) {
                        context += '  • ' + f + '\n';
                    });
                    if (bot.tags) {
                        context += '- **Tags:** ' + bot.tags.join(', ') + '\n';
                    }
                    if (bot.pipeline) {
                        context += '- **Pipeline de bots:** ' + bot.pipeline.join(' → ') + '\n';
                    }

                return context;

            // Reproducción automática con sincronización de audio
            useEffect(function() {

                    // Actualizar progreso
                    var progressInterval = setInterval(function() {
                        setVideoProgress(function(prev) {
                            var increment = (100 / (sceneDuration / 100));
                            return Math.min(100, prev + increment);
                        });
                    }, 100);

                    intervalRef.current = setTimeout(function() {
                        if (currentScene >= scenes.length - 1) {

                    return function() {

        // Función para parsear Markdown simple a HTML
        function parseAssistantMarkdown(text) {
            if (!text) return '';
            var html = text
                // Headers
                .replace(/^### (.+)$/gm, '<h4>$1</h4>')
                .replace(/^## (.+)$/gm, '<h3>$1</h3>')
                // Bold
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                // Code blocks
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                // Inline code
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                // Lists
                .replace(/^• (.+)$/gm, '<li>$1</li>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                // Tables (simple)
                .replace(/\|(.+)\|/g, function(match) {
                    var cells = match.split('|').filter(function(c) { return c.trim(); });
                    return '<tr>' + cells.map(function(c) { return '<td>' + c.trim() + '</td>'; }).join('') + '</tr>';
                })
                // Paragraphs
                .replace(/\n\n/g, '</p><p>')
                // Line breaks
                .replace(/\n/g, '<br>');

            // Wrap in paragraph if not already
            if (!html.startsWith('<')) {
                html = '<p>' + html + '</p>';
            }

            return html;
        }

                if (lowerContent.indexOf('guión') !== -1 || lowerContent.indexOf('guion') !== -1 || lowerContent.indexOf('script') !== -1) {
                    return ['🎬 Generar escenas', '🎙️ Crear narración', '📊 Añadir quiz'];
                }
                if (lowerContent.indexOf('quiz') !== -1 || lowerContent.indexOf('pregunta') !== -1) {
                    return ['➕ Más preguntas', '🔬 Crear simulación', '✅ Revisar respuestas'];
                }
                if (lowerContent.indexOf('simulación') !== -1 || lowerContent.indexOf('simulacion') !== -1) {
                    return ['⚙️ Ajustar parámetros', '📝 Añadir instrucciones', '🎬 Integrar en video'];
                }
                if (lowerContent.indexOf('video') !== -1 || lowerContent.indexOf('microvideo') !== -1) {
                    return ['🎨 Elegir estilo', '🎙️ Añadir narración', '♿ Revisar accesibilidad'];
                }
                return ['🎬 Crear TOOC', '❓ Más información', '🤖 Cambiar bot'];
            }

            // Detectar mejor bot para la tarea
            function detectBestBot(userInput) {
                var lowerInput = userInput.toLowerCase();

                if (lowerInput.indexOf('guión') !== -1 || lowerInput.indexOf('guion') !== -1 || lowerInput.indexOf('script') !== -1 || lowerInput.indexOf('escribir') !== -1) {
                    return 'avia-guionista';
                }
                if (lowerInput.indexOf('escena') !== -1 || lowerInput.indexOf('cámara') !== -1 || lowerInput.indexOf('dirigir') !== -1 || lowerInput.indexOf('toma') !== -1) {
                    return 'avia-director';
                }
                if (lowerInput.indexOf('simulación') !== -1 || lowerInput.indexOf('simulacion') !== -1 || lowerInput.indexOf('experimento') !== -1 || lowerInput.indexOf('laboratorio') !== -1 || lowerInput.indexOf('física') !== -1 || lowerInput.indexOf('física') !== -1) {
                    return 'avia-simlab';
                }
                if (lowerInput.indexOf('quiz') !== -1 || lowerInput.indexOf('pregunta') !== -1 || lowerInput.indexOf('evaluación') !== -1 || lowerInput.indexOf('evaluacion') !== -1 || lowerInput.indexOf('test') !== -1) {
                    return 'avia-quiz';
                }
                if (lowerInput.indexOf('narración') !== -1 || lowerInput.indexOf('narracion') !== -1 || lowerInput.indexOf('voz') !== -1 || lowerInput.indexOf('audio') !== -1 || lowerInput.indexOf('leer') !== -1) {
                    return 'avia-narrador';
                }
                if (lowerInput.indexOf('editar') !== -1 || lowerInput.indexOf('subtítulo') !== -1 || lowerInput.indexOf('accesibilidad') !== -1 || lowerInput.indexOf('wcag') !== -1) {
                    return 'avia-editor';
                }
                if (lowerInput.indexOf('carlos') !== -1 || lowerInput.indexOf('siesta') !== -1 || lowerInput.indexOf('metodología') !== -1 || lowerInput.indexOf('tooc') !== -1) {
                    return 'avia-carlos';
                }
                return 'auto';
            }

            // ============ INTEGRACIÓN CON VIDEOSTUDIO ============
            // Detectar intención de crear video en el mensaje del usuario
            function detectVideoCreationIntent(userInput) {
                var lowerInput = userInput.toLowerCase();
                // También trabajar con la versión sin emojis para patrones
                var cleanInput = userInput.replace(/[🎬📹🎥]/g, '').trim();
                var lowerClean = cleanInput.toLowerCase();

                // Patrones que indican intención de crear un video
                var createPatterns = [
                    'crear video', 'crea un video', 'crear un video',
                    'generar video', 'genera un video', 'generar un video',
                    'hacer video', 'haz un video', 'hacer un video',
                    'quiero un video', 'necesito un video',
                    'video sobre', 'video de', 'video para',
                    'crear tooc', 'generar tooc', 'hacer tooc',
                    'crear microvideo', 'generar microvideo',
                    'crea microvideo', 'genera microvideo',
                    'crear mi primer tooc', 'mi primer tooc'
                ];

                // Verificar tanto en el input original como en el limpio
                var hasCreateIntent = createPatterns.some(function(pattern) {
                    return lowerInput.indexOf(pattern) !== -1 || lowerClean.indexOf(pattern) !== -1;
                });

                // También detectar si empieza con emoji 🎬 y tiene "crear/video"
                if (!hasCreateIntent && userInput.indexOf('🎬') !== -1) {
                    if (lowerClean.indexOf('crear') !== -1 || lowerClean.indexOf('video') !== -1) {
                        hasCreateIntent = true;
                    }
                }

                if (!hasCreateIntent) {
                    return null;
                }

                // Extraer el tema del video
                var topic = userInput;

                // Remover emojis primero
                topic = topic.replace(/[🎬📹🎥]/g, '').trim();

                // Remover frases de intención para obtener el tema limpio
                var removePatterns = [
                    /^(quiero |necesito |puedes |podrías |podrias )/i,
                    /(crear|crea|generar|genera|hacer|haz) (un |una )?(video|microvideo|tooc) (sobre|de|para|acerca de) /i,
                    /(crear|crea|generar|genera|hacer|haz) (un |una )?(video|microvideo|tooc) /i,
                    /^(video|microvideo|tooc) (sobre|de|para) /i,
                    /^(crear|crea|generar|genera|hacer|haz) (mi primer )?(video|microvideo|tooc)/i,
                    /mi primer /i
                ];

                removePatterns.forEach(function(pattern) {
                    topic = topic.replace(pattern, '');
                });

                topic = topic.trim();

                // Si el tema está vacío o es muy corto, usar un tema por defecto basado en el contexto
                if (topic.length < 3) {
                    // Si mencionó TOOC, el tema es TOOC
                    if (lowerInput.indexOf('tooc') !== -1) {
                        topic = 'TOOC (Transmedia Open Online Course)';
                    } else if (lowerInput.indexOf('siesta') !== -1) {
                        topic = 'Metodología SIESTA';
                    } else {
                        // No hay tema claro, pedir al usuario
                        return null;
                    }
                }

                return {
                    detected: true,
                    topic: topic,
                    originalInput: userInput
                };
            }

            // Función para integrar con VideoStudio
            function integrateWithVideoStudio(topic, options) {
                options = options || {};
                var autoStart = options.autoStart || false;
                var style = options.style || null;

                // Verificar si VideoStudio está disponible
                if (!window.AVIA_VideoStudio) {
                    return {
                        success: false,
                        error: 'VideoStudio no está disponible. Asegúrate de estar en la pestaña "Constelación".'
                    };
                }

                // Verificar si ya está generando
                if (window.AVIA_VideoStudio.isGenerating()) {
                    return {
                        success: false,
                        error: 'VideoStudio ya está generando un video. Espera a que termine.'
                    };
                }

                // Establecer el tema
                var topicSet = window.AVIA_VideoStudio.setTopic(topic);
                if (!topicSet) {
                    return {
                        success: false,
                        error: 'No se pudo establecer el tema en VideoStudio.'
                    };
                }

                // Establecer estilo si se especificó
                if (style) {
                    window.AVIA_VideoStudio.setStyle(style);
                }

                // Iniciar generación automática si se solicita
                if (autoStart) {
                    setTimeout(function() {
                        window.AVIA_VideoStudio.startGeneration();
                    }, 500);
                }

                // Obtener estilos disponibles para sugerir
                var availableStyles = window.AVIA_VideoStudio.getStyles();

                return {
                    success: true,
                    topic: topic,
                    autoStarted: autoStart,
                    styleSet: style,
                    availableStyles: availableStyles
                };
            }

            // Generar respuesta de integración para el usuario
            function generateVideoIntegrationResponse(intent, integrationResult) {
                if (!integrationResult.success) {
                    return {
                        content: '⚠️ **No se pudo conectar con VideoStudio**\n\n' + integrationResult.error + '\n\nPuedes escribir el tema directamente en el campo de VideoStudio.',
                        suggestions: ['🔄 Intentar de nuevo', '❓ Ayuda', '🤖 Cambiar bot']
                    };
                }

                var styles = integrationResult.availableStyles || [];
                var stylesList = styles.slice(0, 4).map(function(s) {
                    return s.emoji + ' ' + s.name;
                }).join(', ');

                if (integrationResult.autoStarted) {
                    return {
                        content: '🎬 **¡Generando video!**\n\n' +
                            '📋 **Tema:** ' + integrationResult.topic + '\n' +
                            '🎨 **Estilo:** ' + (integrationResult.styleSet || 'TikTok (por defecto)') + '\n\n' +
                            '✅ He iniciado la generación en **VideoStudio**. Puedes ver el progreso en la pestaña principal.\n\n' +
                            '💡 El pipeline incluye: Guión → Escenas → Portada → Animaciones → Narración → Edición',
                        suggestions: ['📊 Ver progreso', '🛑 Detener', '🎨 Cambiar estilo', '📝 Nuevo video']
                    };
                } else {
                    return {
                        content: '📋 **Tema preparado en VideoStudio**\n\n' +
                            '✅ He cargado el tema: **"' + integrationResult.topic + '"**\n\n' +
                            '**Estilos disponibles:** ' + stylesList + '\n\n' +
                            '¿Quieres que inicie la generación automáticamente o prefieres revisar las opciones primero?',
                        suggestions: ['🚀 Iniciar generación', '🎨 Elegir estilo', '✏️ Editar tema', '📐 Ver estructura TOOC']
                    };
                }
            }

            // Manejar acciones especiales del asistente
            function handleSpecialAction(actionText) {
                var lowerAction = actionText.toLowerCase();

                // Acción: Iniciar generación
                if (lowerAction.indexOf('iniciar generación') !== -1 || lowerAction.indexOf('🚀 iniciar') !== -1) {
                    if (window.AVIA_VideoStudio && !window.AVIA_VideoStudio.isGenerating()) {
                        var currentTopic = window.AVIA_VideoStudio.getTopic();
                        if (currentTopic && currentTopic.trim()) {
                            window.AVIA_VideoStudio.startGeneration();
                            return {
                                content: '🚀 **¡Generación iniciada!**\n\nCreando video sobre: **"' + currentTopic + '"**\n\nPuedes seguir el progreso en VideoStudio.',
                                suggestions: ['📊 Ver progreso', '💬 Otra consulta']
                            };
                        } else {
                            return {
                                content: '⚠️ **No hay tema configurado**\n\nPrimero escribe sobre qué quieres crear el video.',
                                suggestions: ['🎬 Crear video sobre TOOC', '🎬 Crear video sobre SIESTA', '❓ Ayuda']
                            };
                        }
                    }
                    return null;
                }

                // Acción: Elegir estilo
                if (lowerAction.indexOf('elegir estilo') !== -1 || lowerAction.indexOf('🎨 elegir') !== -1 || lowerAction.indexOf('cambiar estilo') !== -1) {
                    if (window.AVIA_VideoStudio) {
                        var styles = window.AVIA_VideoStudio.getStyles();
                        var styleList = styles.map(function(s) {
                            return '• ' + s.emoji + ' **' + s.name + '** (' + s.duration + ')';
                        }).join('\n');
                        return {
                            content: '🎨 **Estilos disponibles:**\n\n' + styleList + '\n\n¿Cuál prefieres?',
                            suggestions: styles.slice(0, 4).map(function(s) { return s.emoji + ' ' + s.name; })
                        };
                    }
                    return null;
                }

                // Acción: Aplicar estilo específico
                var stylePatterns = [
                    { pattern: /tiktok/i, id: 'tiktok' },
                    { pattern: /youtube|shorts/i, id: 'youtube' },
                    { pattern: /instagram|reels/i, id: 'instagram' },
                    { pattern: /educativo|formal/i, id: 'educativo' },
                    { pattern: /documental/i, id: 'documental' }
                ];

                for (var i = 0; i < stylePatterns.length; i++) {
                    if (stylePatterns[i].pattern.test(lowerAction)) {
                        if (window.AVIA_VideoStudio) {
                            window.AVIA_VideoStudio.setStyle(stylePatterns[i].id);
                            return {
                                content: '✅ **Estilo cambiado a ' + stylePatterns[i].id + '**\n\n¿Quieres iniciar la generación ahora?',
                                suggestions: ['🚀 Iniciar generación', '🎨 Otro estilo', '✏️ Cambiar tema']
                            };
                        }
                    }
                }

                // Acción: Ver progreso
                if (lowerAction.indexOf('ver progreso') !== -1 || lowerAction.indexOf('📊 ver') !== -1) {
                    if (window.AVIA_VideoStudio) {
                        var isGen = window.AVIA_VideoStudio.isGenerating();
                        var results = window.AVIA_VideoStudio.getResults();
                        var stepCount = Object.keys(results).length;

                        if (isGen) {
                            return {
                                content: '⏳ **Generación en progreso...**\n\nPasos completados: ' + stepCount + '/6\n\nPuedes ver los detalles en VideoStudio.',
                                suggestions: ['🔄 Actualizar estado', '💬 Otra consulta']
                            };
                        } else if (stepCount > 0) {
                            return {
                                content: '✅ **Generación completada**\n\nTodos los pasos finalizados (' + stepCount + '/6).\n\nRevisa los resultados en VideoStudio.',
                                suggestions: ['📝 Nuevo video', '🔄 Regenerar', '💬 Otra consulta']
                            };
                        }
                    }
                    return null;
                }

                return null; // No es una acción especial
            }

            // Construir prompt con contexto ontológico
            function buildPromptWithContext(userInput, botId) {
                var bot = botMappings[botId] || botMappings['auto'];
                var systemPrompt = bot.systemPrompt || '';

                // Añadir contexto ontológico AVIA
                var ontologyContext = '\n\n[CONTEXTO AVIA]\n';
                ontologyContext += '• TOOC = Transmedia Open Online Course (creado por Carlos de Castro Lozano, UCO)\n';
                ontologyContext += '• SIESTA = Sistema Integral de Enseñanza Transmedia Accesible\n';
                ontologyContext += '• ⚠️ NO confundir TOOC con TOC (Trastorno Obsesivo Compulsivo)\n';
                ontologyContext += '• Microvideos: piezas de 1-5 min con interactividad integrada\n';
                ontologyContext += '• Accesibilidad: WCAG 2.1 AA obligatorio\n';

                if (systemPrompt) {
                    return systemPrompt + ontologyContext + '\n\n[CONSULTA DEL USUARIO]\n' + userInput;
                }
                return ontologyContext + '\n[CONSULTA DEL USUARIO]\n' + userInput;
            }

            // Verificar respuestas predefinidas locales
            function getLocalResponse(userInput) {
                var lowerInput = userInput.toLowerCase();

                // Respuestas rápidas que no necesitan API
                if (lowerInput.indexOf('hola') !== -1 || lowerInput === 'hi' || lowerInput === 'hey') {
                    return {
                        content: '¡Hola! 👋 Soy **AVIA-Siesta**, tu asistente para crear **TOOCs**.\n\n¿En qué puedo ayudarte hoy?',
                        suggestions: ['🎬 Crear video TOOC', '📚 ¿Qué es un TOOC?', '🎯 Tipos de interactividades']
                    };
                }
                if (lowerInput === 'ayuda' || lowerInput === 'help' || lowerInput === '?') {
                    return assistantResponses.help;
                }
                if ((lowerInput.indexOf('qué es') !== -1 || lowerInput.indexOf('que es') !== -1) && lowerInput.indexOf('tooc') !== -1) {
                    return assistantResponses.whatIsTOOC;
                }
                // Nuevos patrones para principios fundamentales AVIA
                if (lowerInput.indexOf('multibot') !== -1 || lowerInput.indexOf('protocolo') !== -1 || lowerInput.indexOf('pipeline') !== -1 || lowerInput.indexOf('orquestación') !== -1 || lowerInput.indexOf('orquestacion') !== -1) {
                    return assistantResponses.protocoloMultiBot;
                }
                if (lowerInput.indexOf('arquitectura') !== -1 || lowerInput.indexOf('ontolog') !== -1 || lowerInput.indexOf('capas') !== -1 || lowerInput.indexOf('6 capas') !== -1) {
                    return assistantResponses.arquitecturaOntologica;
                }
                if (lowerInput.indexOf('libro blanco') !== -1 || lowerInput.indexOf('documentación') !== -1 || lowerInput.indexOf('documentacion') !== -1 || lowerInput.indexOf('white paper') !== -1) {
                    return assistantResponses.libroBlanco;
                }
                if (lowerInput.indexOf('design atomic') !== -1 || lowerInput.indexOf('diseño atómico') !== -1 || lowerInput.indexOf('atoms') !== -1 || lowerInput.indexOf('molecules') !== -1 || lowerInput.indexOf('organisms') !== -1) {
                    return assistantResponses.designAtomic;
                }
                if (lowerInput.indexOf('simbiosis') !== -1 || (lowerInput.indexOf('llm') !== -1 && lowerInput.indexOf('colabora') !== -1)) {
                    return assistantResponses.protocoloMultiBot; // Incluido en MultiBot
                }

                return null; // No hay respuesta local, usar API
            }

            // Enviar mensaje con Poe API real
            async function sendWithPoeAPI(userInput, botId) {
                var bot = botMappings[botId] || botMappings['auto'];
                var prompt = buildPromptWithContext(userInput, botId);

                setLoadingStatus('Conectando con ' + bot.name + '...');

                try {
                    await window.Poe.sendUserMessage(
                        '@' + bot.poeHandle + ' ' + prompt,
                        {
                            handler: 'avia-assistant-handler',
                            stream: true,
                            openChat: false,
                            handlerContext: {
                                botUsed: bot.name,
                                botId: botId,
                                userQuery: userInput,
                                messageId: Date.now()
                            }
                        }
                    );
                } catch (err) {
                    setIsLoading(false);
                    setLoadingStatus('');
                    setCurrentStreamingMsg(null);

                    var errorType = err.errorType || 'UNKNOWN';
                    var errorContent = '❌ **Error de conexión**\n\n';

                    if (errorType === 'USER_REJECTED_CONFIRMATION') {
                        errorContent += 'Has cancelado la confirmación. Puedes intentar de nuevo cuando quieras.';
                    } else if (errorType === 'ANOTHER_CONFIRMATION_IS_OPEN') {
                        errorContent += 'Hay otra confirmación abierta. Ciérrala primero e intenta de nuevo.';
                    } else {
                        errorContent += 'No se pudo conectar con el bot. Error: ' + (err.message || errorType) + '\n\nUsando respuesta local...';
                        // Fallback a respuesta local
                        setTimeout(function() {
                            var fallbackResponse = processLocalFallback(userInput);
                            var fallbackMsg = {
                                id: Date.now(),
                                from: 'assistant',
                                content: fallbackResponse.content + '\n\n*⚠️ Respuesta local (sin conexión API)*',
                                time: new Date(),
                                botUsed: 'Local',
                                isFallback: true
                            };
                            setMessages(function(prev) { return prev.concat([fallbackMsg]); });
                            setSuggestions(fallbackResponse.suggestions || []);
                        }, 500);
                        return;
                    }

                    var errorMsg = {
                        id: Date.now(),
                        from: 'assistant',
                        content: errorContent,
                        time: new Date(),
                        botUsed: 'Sistema',
                        isError: true
                    };
                    setMessages(function(prev) { return prev.concat([errorMsg]); });
                    setSuggestions(['🔄 Intentar de nuevo', '📴 Usar modo offline']);
                }
            }

            // Fallback local cuando API no disponible
            function processLocalFallback(userInput) {
                var lowerInput = userInput.toLowerCase();

                if (lowerInput.indexOf('tooc') !== -1) {
                    return assistantResponses.whatIsTOOC;
                }
                if (lowerInput.indexOf('crear') !== -1) {
                    return assistantResponses.createTOOC;
                }
                if (lowerInput.indexOf('interactiv') !== -1) {
                    return assistantResponses.interactivities;
                }
                if (lowerInput.indexOf('estilo') !== -1) {
                    return assistantResponses.styles;
                }
                // Patrones para principios fundamentales AVIA
                if (lowerInput.indexOf('multibot') !== -1 || lowerInput.indexOf('protocolo') !== -1 || lowerInput.indexOf('pipeline') !== -1) {
                    return assistantResponses.protocoloMultiBot;
                }
                if (lowerInput.indexOf('arquitectura') !== -1 || lowerInput.indexOf('ontolog') !== -1) {
                    return assistantResponses.arquitecturaOntologica;
                }
                if (lowerInput.indexOf('libro blanco') !== -1 || lowerInput.indexOf('documentación') !== -1) {
                    return assistantResponses.libroBlanco;
                }
                if (lowerInput.indexOf('design atomic') !== -1 || lowerInput.indexOf('atómico') !== -1) {
                    return assistantResponses.designAtomic;
                }
                return {
                    content: 'Entiendo tu consulta sobre: **' + userInput + '**\n\nComo asistente AVIA, puedo ayudarte con TOOCs, microvideos, interactividades, el **Protocolo MultiBot** y la **Arquitectura Ontológica**.\n\n¿Qué aspecto te interesa más?',
                    suggestions: ['🎬 Crear TOOC', '🤖 Protocolo MultiBot', '🏗️ Arquitectura Ontológica', '❓ Ayuda']
                };
            }

            // Enviar mensaje principal
            function handleSend() {
                if (!inputValue.trim() || isLoading) return;

                var userInput = inputValue.trim();
                var userMessage = {
                    id: Date.now(),
                    from: 'user',
                    content: userInput,
                    time: new Date()
                };

                setMessages(function(prev) { return prev.concat([userMessage]); });
                setInputValue('');
                setIsLoading(true);
                setSuggestions([]);
                setCurrentStreamingMsg(null);

                // ============ INTEGRACIÓN CON VIDEOSTUDIO ============
                // 1. Primero verificar si es una acción especial (botones de sugerencia)
                var specialAction = handleSpecialAction(userInput);
                if (specialAction) {
                    setTimeout(function() {
                        var actionMsg = {
                            id: Date.now(),
                            from: 'assistant',
                            content: specialAction.content,
                            time: new Date(),
                            botUsed: 'VideoStudio'
                        };
                        setMessages(function(prev) { return prev.concat([actionMsg]); });
                        setSuggestions(specialAction.suggestions || []);
                        setSuggestionPage(0);
                        setIsLoading(false);
                    }, 300);
                    return;
                }

                // 2. Detectar intención de crear video
                var videoIntent = detectVideoCreationIntent(userInput);
                if (videoIntent && videoIntent.detected) {
                    // Intentar integrar con VideoStudio
                    var integrationResult = integrateWithVideoStudio(videoIntent.topic, { autoStart: false });
                    var integrationResponse = generateVideoIntegrationResponse(videoIntent, integrationResult);

                    setTimeout(function() {
                        var videoMsg = {
                            id: Date.now(),
                            from: 'assistant',
                            content: integrationResponse.content,
                            time: new Date(),
                            botUsed: 'VideoStudio',
                            isVideoIntegration: true
                        };
                        setMessages(function(prev) { return prev.concat([videoMsg]); });
                        setSuggestions(integrationResponse.suggestions || []);
                        setSuggestionPage(0);
                        setIsLoading(false);

                        // Toast de confirmación
                        if (addToast && integrationResult.success) {
                            addToast({
                                type: 'success',
                                title: '🎬 VideoStudio',
                                message: 'Tema cargado: "' + videoIntent.topic + '"'
                            });
                        }
                    }, 400);
                    return;
                }

                // Primero verificar respuestas locales rápidas
                var localResponse = getLocalResponse(userInput);
                if (localResponse) {
                    setTimeout(function() {
                        var assistantMsg = {
                            id: Date.now(),
                            from: 'assistant',
                            content: localResponse.content,
                            time: new Date(),
                            botUsed: 'Local'
                        };
                        setMessages(function(prev) { return prev.concat([assistantMsg]); });
                        setSuggestions(localResponse.suggestions || []);
                        setIsLoading(false);
                    }, 300);
                    return;
                }

                // Determinar qué bot usar
                var botToUse = selectedBot;
                if (selectedBot === 'auto') {
                    botToUse = detectBestBot(userInput);
                    setLoadingStatus('Seleccionando mejor agente...');
                }

                // Usar API real o fallback local
                if (useRealAPI && window.Poe) {
                    sendWithPoeAPI(userInput, botToUse);
                } else {
                    // Modo offline
                    setLoadingStatus('Procesando localmente...');
                    setTimeout(function() {
                        var fallback = processLocalFallback(userInput);
                        var offlineMsg = {
                            id: Date.now(),
                            from: 'assistant',
                            content: fallback.content + '\n\n*📴 Modo offline*',
                            time: new Date(),
                            botUsed: 'Offline'
                        };
                        setMessages(function(prev) { return prev.concat([offlineMsg]); });
                        setSuggestions(fallback.suggestions || []);
                        setIsLoading(false);
                        setLoadingStatus('');
                    }, 600);
                }
            }

            // Manejar click en sugerencias
            function handleSuggestionClick(suggestion) {
                // Simplificado: usar directamente handleSend con el valor de la sugerencia
                setInputValue(suggestion);
                setTimeout(function() {

                        id: Date.now(),
                        from: 'user',
                        content: suggestion,
                        time: new Date()
                    };
                    setMessages(function(prev) { return prev.concat([userMessage]); });
                    setInputValue('');
                    setIsLoading(true);
                    setSuggestions([]);
                    setCurrentStreamingMsg(null);

                    // ============ INTEGRACIÓN CON VIDEOSTUDIO (SUGERENCIAS) ============
                    // 1. Primero verificar si es una acción especial
                    var specialAction = handleSpecialAction(suggestion);
                    if (specialAction) {
                        setTimeout(function() {
                            var actionMsg = {
                                id: Date.now(),

                        passed = false;
                    }

                    results.push({
                        id: test.id,
                        name: test.name,
                        passed: passed,
                        critical: test.critical
                    });

                    if (!passed) {
                        if (test.critical) {
                            self.state.errors.push({
                                type: 'integrity',
                                id: test.id,
                                message: test.name + ' - FALLIDO',
                                critical: true
                            });
                            self.state.isHealthy = false;
                        } else {
                            self.state.warnings.push({
                                type: 'integrity',

                    var valid = false;
                    try {
                        valid = component.validator();

                        valid = false;

                    results.push({
                        name: key,
                        description: component.description,
                        valid: valid,
                        risk: component.breakageRisk,
                        lastModified: component.lastModified

                    if (!valid && component.breakageRisk === 'CRITICAL') {
                        self.state.errors.push({

                            name: key,
                            message: 'Componente crítico inválido: ' + key,
                            risk: 'CRITICAL'

                // Test 6: Categorías válidas
                this.tests.push({ name: 'Categorías definidas', pass: Array.isArray(categories) && categories.length > 0 });

                        return Array.from(sheet.cssRules || []).some(function(rule) {

                    } catch (e) { return false; }

                // Generar reporte
                var passed = this.tests.filter(function(t) { return t.pass; }).length;
