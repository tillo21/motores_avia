         *
         * REGLA 8: Limitaciones de Tailwind CSS (CRÍTICO - Evitar errores silenciosos):
         *
         * PROBLEMA: Tailwind CSS NO soporta clases dinámicas generadas en runtime.
         *
         * ❌ INCORRECTO (NO FUNCIONA):
         * `bg-${color}-500`  → Tailwind NO genera estas clases
         * `border-${size}-4` → No se aplica ningún estilo
         * `text-${theme}-600` → Falla silenciosamente
         *
         * ✅ CORRECTO (SÍ FUNCIONA):
         * const COLORS = {
         *   red: 'bg-red-500 border-red-600',
         *   blue: 'bg-blue-500 border-blue-600'
         * };
         * return `<div class="${COLORS[color]}">`;
         *
         * SOLUCIÓN UNIVERSAL:
         * 1. Crear constantes con clases LITERALES completas
         * 2. Mapear todos los valores posibles antes de usarlos
         * 3. NUNCA interpolar variables dentro de nombres de clases
         * 4. Usar style inline si necesitas valores verdaderamente dinámicos

         * - Tablas: Máximo 20 filas por tabla
         * - Código de ejemplo: Máximo 50 líneas por bloque
         * - Evitar markdown excesivamente complejo
         *
         * MEJORES PRÁCTICAS:

         * PROHIBIDO:

         * NIVEL 1 - ÁTOMOS (Componentes básicos):

         * COHERENCIA: Footer Config → Categorías → Ventana (nunca saltar niveles)
         *
         * REGLA 16: Sistema AVIA de Notificaciones Inteligentes (UNIVERSAL):
         *
         * Notificaciones = Organismos reutilizables, plantillas guardadas en Config
         *
         * ESTRUCTURA OBLIGATORIA:
         * - Header con REGLA 13: Negro (cerrar) + Rojo (🔇 silenciar TTS)
         * - Franja color izquierda según tipo: verde=éxito, amarillo=warn, rojo=error, azul=info
         * - Adaptativo: Corto (<50 chars) = modal 400px, Largo = panel lateral
         *
         * AUDIO TTS (Text-To-Speech):
         * - Por defecto: ACTIVO, locutor lee mensaje completo
         * - Botón rojo: Silenciar/Activar (toggle, guarda en localStorage)
         * - Voz: Usar ElevenLabs API o Web Speech API
         * - Usuario puede configurar voz preferida en "Mi Configuración"
         *
         * ESTADOS VISUALES:
         * - Fondo: Cards opacity 0.3, botones sistema opacity 1.0
         * - Urgente: Pulso sutil en borde
         * - Clustering: Agrupa notificaciones similares ("3 análisis completados")
         *
         * CONSTELACIÓN:
         * - Todas las notificaciones se guardan como plantillas en Config
         * - Categoría: "Notificaciones" con historial temporal
         * - Reutilizables y editables
         *
         * REGLA 17: Filtros de Inactividad Consistentes (UNIVERSAL):
         *
         * Cuando modal/panel está abierto, fondo e inactivos DEBEN ser sutiles:
         *
         * VALORES CORRECTOS:
         * - Fondo modal: bg-black bg-opacity-20 (NO 50, muy oscuro)
         * - Cards inactivas: opacity: 0.3 (mantienen color original)
         * - Botones sistema: opacity: 1.0 SIEMPRE (blanco/negro/naranja/morado)
         * - Backdrop blur: backdrop-filter: blur(2px) para efecto moderno
         * - Transición: transition: all 200ms ease
         *
         * MEJORAS INNOVADORAS:
         * - Fade Contextual: Elementos cerca del modal = opacity 0.5, lejos = 0.2
         * - Modo Foco: Usuario puede configurar opacidad extrema (accesibilidad)
         * - Animación suave: Estados activo/inactivo con 200ms smooth
         * - Respeto visual: NUNCA perder identidad de colores de marca
         *
         * PROHIBIDO: bg-opacity-20 o mayor (demasiado oscuro, pierde contexto)
         *
         * ECOSISTEMA AVIA - PRINCIPIOS FUNDAMENTALES:
         *
         * 1. MODULARIDAD: Cada módulo es independiente y autocompleto
         * 2. COMUNICACIÓN: Event Bus para mensajes entre módulos
         * 3. SALUD: HealthMonitor detecta y repara errores automáticamente
         * 4. REGISTRO: ModuleRegistry gestiona ciclo de vida
         * 5. CONSISTENCIA: Libro Blanco como única fuente de verdad
         * 6. ACCESIBILIDAD: Soporte teclado, screen readers, WAI-ARIA
         * 7. PERFORMANCE: Lazy loading, debouncing, optimización
         * 8. PERSISTENCIA: LocalStorage para datos del usuario
         *
         * ============================================
         */

        /* Regla Universal: Todos los botones inactivos por defecto */
        button,
        [onclick],
        .interactive-button,
        .module-card,
        /* ============================================ */
        /* LIBRO BLANCO 2.2: BOTONES INACTIVOS (CATEGORÍAS Y SUBCATEGORÍAS) */
        /* ============================================ */

        .category-item,
        .subcategory-item {
            opacity: 0.3 !important;           /* Transparente 30% */
            box-shadow: none !important;       /* Sin sombra volumétrica */
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* HOVER: Categorías y subcategorías se ACTIVAN */
        .category-item:hover,
        .subcategory-item:hover {
            opacity: 1.0 !important;           /* Opaco 100% */
            transform: scale(1.10) !important; /* Zoom 10% */
            box-shadow:
                0 6px 10px rgba(0,0,0,0.4),
                0 2px 4px rgba(0,0,0,0.3),
                inset 0 -2px 4px rgba(0,0,0,0.15) !important; /* Sombra volumétrica */
        }

        /* FOCUS: Categorías y subcategorías con teclado */
        .category-item:focus,
        .subcategory-item:focus {
            opacity: 1.0 !important;
            transform: scale(1.10) !important;
            outline: none;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.5) !important; /* Ring morado */
        }

        /* Estado activo al hacer hover (otros elementos) */
        button:hover,
        [onclick]:hover,
        .interactive-button:hover,
        .module-card:hover {
            opacity: 1.0 !important;
        }

        /* REGLA 2: Botones activos por defecto (pantallas con ≤7 botones) */
        .default-active,
        button.default-active,
        [onclick].default-active,
        .module-card.default-active,
        .category-item.default-active,
        .subcategory-item.default-active {
            opacity: 1.0 !important;
        }

        /* Colores más intensos y saturados para botones activos (excepto botones triangulares) */
        .module-card.default-active,
        .category-item.default-active,
        .subcategory-item.default-active {
            filter: saturate(1.3) brightness(1.05);
        }

        /* Botones triangulares de navegación activos (sin filtro de saturación) */
        button.default-active[style*="border-"] {
            filter: none;
        }

        /* Botones de navegación principales (Edición, etc.) mantienen su estilo */
        button.default-active.fixed {
            filter: none;
        }

        /* Botones activos mantienen su estado incluso sin hover */
        .default-active:not(:hover) {
            opacity: 1.0 !important;
        }

        /* REGLA 3: Botones de navegación SIEMPRE activos (PRIORIDAD MÁXIMA) */
        .always-active-button,
        button.always-active-button,
        [onclick].always-active-button {
            opacity: 1.0 !important;
            /* Sin filtros adicionales para mantener colores originales */
            filter: none !important;
        }

        /* Asegurar que siempre estén visibles incluso sin hover */
        .always-active-button:not(:hover) {
            opacity: 1.0 !important;
        }

        /* ============================================ */
        /* LIBRO BLANCO 2.2: BOTONES INACTIVOS */
        /* ============================================ */

        /* REGLA UNIVERSAL: Botones inactivos (8º botón en adelante) */
        .inactive-button,
        button.inactive-button {
            opacity: 0.3 !important;           /* Transparente 30% */
            box-shadow: none !important;       /* Sin sombra volumétrica */
            cursor: pointer;                   /* Indica que es clickeable */
            transition: all 0.3s ease;
        }

        /* HOVER: Botón inactivo se ACTIVA visualmente */
        .inactive-button:hover,
        button.inactive-button:hover {
            opacity: 1.0 !important;           /* Se vuelve opaco 100% */
            transform: scale(1.10) !important; /* Zoom 10% */
            box-shadow:
                0 6px 10px rgba(0,0,0,0.4),
                0 2px 4px rgba(0,0,0,0.3),
                inset 0 -2px 4px rgba(0,0,0,0.15) !important; /* Sombra volumétrica aparece */
        }

        /* FOCUS: Botón inactivo se ACTIVA con teclado */
        .inactive-button:focus,
        button.inactive-button:focus {
            opacity: 1.0 !important;
            transform: scale(1.10) !important;
            outline: none;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.5) !important; /* Ring naranja */
        }

        /* ACTIVE: Feedback al hacer click */
        .inactive-button:active,
        button.inactive-button:active {
            transform: scale(1.05) !important; /* Ligeramente menor que hover */
        }

        /* Excepción: Elementos que deben estar siempre visibles (no son botones) */
        .always-visible,
        header,
        h1, h2, h3, h4, h5, h6,
        p:not([onclick]),
        span:not([onclick]),
        div:not([onclick]):not(.module-card):not(.category-item):not(.subcategory-item),
        img:not([onclick]) {
            opacity: 1.0 !important;
        }

        /* SVG dentro de botones hereda la opacidad del botón padre */
        button svg,
        [onclick] svg {
            opacity: inherit;
        }

        /* Textos dentro de botones siempre visibles */
        button h1, button h2, button h3, button h4, button h5, button h6,
        button p, button span, button div,
        [onclick] h1, [onclick] h2, [onclick] h3, [onclick] h4, [onclick] h5, [onclick] h6,
        [onclick] p, [onclick] span, [onclick] div {
            opacity: 1.0 !important;
        }

        /* Asegurar que elementos dentro de module-card sean visibles */
        .module-card h1, .module-card h2, .module-card h3, .module-card h4, .module-card h5, .module-card h6,
        .module-card p, .module-card span, .module-card div,
        .category-item h1, .category-item h2, .category-item h3, .category-item h4, .category-item h5, .category-item h6,
        .category-item p, .category-item span, .category-item div,
        .subcategory-item h1, .subcategory-item h2, .subcategory-item h3, .subcategory-item h4, .subcategory-item h5, .subcategory-item h6,
        .subcategory-item p, .subcategory-item span, .subcategory-item div {
            opacity: 1.0 !important;
        }

        /* Botones de navegación principal mantienen su comportamiento visual */
        .fixed.bottom-6 {
            opacity: 0.4;
        }

        .fixed.bottom-6:hover {
            opacity: 1.0;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* REGLA 4: Sombras volumétricas intensas para botones activos (sin animación) */
        .volumetric-shadow-white {
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.9))
                    drop-shadow(0 8px 16px rgba(0,0,0,0.6))
                    drop-shadow(0 4px 8px rgba(0,0,0,0.4))
                    drop-shadow(0 0 40px rgba(100,100,255,0.3));
        }

        .volumetric-shadow-black {
            filter: drop-shadow(0 0 25px rgba(26,26,26,0.8))
                    drop-shadow(0 8px 20px rgba(0,0,0,0.7))
                    drop-shadow(0 4px 10px rgba(0,0,0,0.5))
                    drop-shadow(0 0 35px rgba(100,150,255,0.4));
        }

        .modal-backdrop {
            backdrop-filter: blur(4px);
        }

        /* Botones de calculadora con regla universal */
        .btn-calc {
            @apply px-4 py-4 rounded-lg font-semibold text-lg transition-all shadow-sm hover:shadow-md active:scale-95;
            opacity: 0.4;
        }
        .btn-calc:hover {
            opacity: 1.0;
        }

        .btn-number {
            @apply bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-600;
        }
        .btn-operator {
            @apply bg-blue-500 text-white hover:bg-blue-600;
        }
        .btn-equals {
            @apply bg-green-500 text-white hover:bg-green-600;
        }
        .btn-clear {
            @apply bg-red-500 text-white hover:bg-red-600;
        }

        /* Botones de rango de tiempo con regla universal */
        .time-range-btn {
            @apply px-4 py-2 rounded-lg text-sm font-medium transition-all;
            @apply bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300;
            @apply hover:bg-gray-200 dark:hover:bg-gray-600;
            opacity: 0.4;
        }
        .time-range-btn:hover {
            opacity: 1.0;
        }
        .time-range-btn.active {
            @apply bg-primary text-white;
            opacity: 1.0;
        }
    </style>
</head>

    <script>
        // ============================================
        // AVIA MODULAR ARCHITECTURE - Carlos System
        // ============================================

        /**
         * Event Bus - Sistema de comunicación inter-modular sin dependencias
         * Permite que los módulos se comuniquen sin acoplamiento
         */
        class AVIAEventBus {
            constructor() {
                this.listeners = new Map();
                this.eventHistory = [];
                this.maxHistory = 100;
            }

            on(event, callback, moduleId = 'unknown') {
                if (!this.listeners.has(event)) {
                    this.listeners.set(event, []);
                }
                this.listeners.get(event).push({ callback, moduleId });
                console.log(`📡 EventBus: ${moduleId} listening to '${event}'`);
            }

            off(event, callback) {
                if (this.listeners.has(event)) {
                    const callbacks = this.listeners.get(event);
                    const index = callbacks.findIndex(cb => cb.callback === callback);
                    if (index !== -1) callbacks.splice(index, 1);
                }
            }

            emit(event, data = {}, sourceModule = 'unknown') {
                console.log(`📡 EventBus: Event '${event}' emitted by ${sourceModule}`, data);

                // Guardar en historial
                this.eventHistory.push({
                    event,
                    data,
                    sourceModule,
                    timestamp: Date.now()
                });
                if (this.eventHistory.length > this.maxHistory) {
                    this.eventHistory.shift();
                }

                if (this.listeners.has(event)) {
                    this.listeners.get(event).forEach(({ callback, moduleId }) => {
                        try {
                            callback(data, sourceModule);
                        } catch (error) {
                            console.error(`❌ Error in listener ${moduleId} for event ${event}:`, error);
                        }
                    });
                }
            }

            getHistory() {
                return [...this.eventHistory];
            }
        }

        /**
         * Module Health Monitor - Monitoreo de salud de módulos
         * Detecta y reporta problemas en tiempo real
         */
        class ModuleHealthMonitor {
            constructor() {
                this.modules = new Map();
                this.checkInterval = 30000; // 30 segundos
                this.autoRepairEnabled = true;
            }

            register(moduleId, module) {
                this.modules.set(moduleId, {
                    module,
                    status: 'healthy',
                    lastCheck: Date.now(),
                    errorCount: 0,
                    lastError: null
                });
                console.log(`💚 HealthMonitor: Module '${moduleId}' registered`);
            }

            reportError(moduleId, error) {
                if (this.modules.has(moduleId)) {
                    const info = this.modules.get(moduleId);
                    info.errorCount++;
                    info.lastError = {
                        message: error.message,
                        stack: error.stack,
                        timestamp: Date.now()
                    };

                    if (info.errorCount > 3) {
                        info.status = 'critical';
                        console.error(`🔴 Module '${moduleId}' is CRITICAL (${info.errorCount} errors)`);

                        if (this.autoRepairEnabled) {
                            this.attemptRepair(moduleId);
                        }
                    } else {
                        info.status = 'warning';
                        console.warn(`⚠️ Module '${moduleId}' has warning (${info.errorCount} errors)`);
                    }
                }
            }

            attemptRepair(moduleId) {
                console.log(`🔧 Attempting auto-repair for module '${moduleId}'...`);
                const info = this.modules.get(moduleId);

                try {
                    // Intentar reinicializar el módulo
                    if (info.module && typeof info.module.reset === 'function') {
                        info.module.reset();
                        info.errorCount = 0;
                        info.status = 'healthy';
                        console.log(`✅ Module '${moduleId}' repaired successfully`);
                        window.aviaEventBus?.emit('module:repaired', { moduleId }, 'HealthMonitor');
                    }
                } catch (error) {
                    console.error(`❌ Auto-repair failed for '${moduleId}':`, error);
                }
            }

            getStatus(moduleId) {
                return this.modules.get(moduleId)?.status || 'unknown';
            }

            getAllStatus() {
                const status = {};
                this.modules.forEach((info, id) => {
                    status[id] = {
                        status: info.status,
                        errorCount: info.errorCount,
                        lastError: info.lastError
                    };
                });
                return status;
            }
        }

        /**
         * Error Boundary - Wrapper para módulos con manejo de errores
         * Contiene errores dentro del módulo sin afectar a otros
         */
        class ErrorBoundary {
            constructor(moduleId, component) {
                this.moduleId = moduleId;
                this.component = component;
                this.hasError = false;
                this.error = null;
            }

            wrap(method, methodName) {
                return (...args) => {
                    try {
                        return method.apply(this.component, args);
                    } catch (error) {
                        this.hasError = true;
                        this.error = error;
                        console.error(`❌ Error in ${this.moduleId}.${methodName}:`, error);
                        window.aviaHealth?.reportError(this.moduleId, error);

                        // Mostrar error en UI si es un método de render
                        if (methodName === 'render' && args[0]) {
                            args[0].innerHTML = `
                                <div class="max-w-2xl mx-auto mt-8">
                                    <div class="bg-red-50 dark:bg-red-900/20 border-l-8 border-red-500 rounded-lg p-6">
                                        <div class="flex items-start gap-4">
                                            <div class="text-4xl">⚠️</div>
                                            <div class="flex-1">
                                                <h3 class="text-xl font-bold text-red-800 dark:text-red-200 mb-2">
                                                    Error en módulo: ${this.moduleId}
                                                </h3>
                                                <p class="text-red-700 dark:text-red-300 mb-4">
                                                    ${error.message}
                                                </p>
                                                <button onclick="window.aviaHealth?.attemptRepair('${this.moduleId}')"
                                                        class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">
                                                    🔧 Intentar Reparar
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }

                        return null;
                    }
                };
            }

            /**
             * Maneja errores específicos de Poe API
             * @param {Error} error - Error de Poe API con errorType
             * @param {string} method - Nombre del método donde ocurrió el error
             */
            handlePoeError(error, method = 'unknown') {
                const errorMessages = {
                    'USER_REJECTED_CONFIRMATION': {
                        title: 'Operación Cancelada',
                        message: 'Has cancelado la confirmación. No se enviará el mensaje.',
                        icon: '🚫',
                        color: 'yellow'
                    },
                    'ANOTHER_CONFIRMATION_IS_OPEN': {
                        title: 'Confirmación Pendiente',
                        message: 'Ya hay una confirmación abierta. Por favor, responde primero.',
                        icon: '⏳',
                        color: 'blue'
                    },
                    'INVALID_INPUT': {
                        title: 'Entrada Inválida',
                        message: 'Los datos proporcionados no son válidos. Verifica e intenta nuevamente.',
                        icon: '⚠️',
                        color: 'orange'
                    },
                    'UNAVAILABLE': {
                        title: 'Servicio No Disponible',
                        message: 'Poe API no está disponible en este momento. Intenta más tarde.',
                        icon: '📡',
                        color: 'red'
                    },
                    'UNKNOWN': {
                        title: 'Error Desconocido',
                        message: error.message || 'Ocurrió un error inesperado al comunicarse con Poe API.',
                        icon: '❌',
                        color: 'red'
                    }
                };

                const errorInfo = errorMessages[error.errorType] || errorMessages['UNKNOWN'];

                // Registrar error
                console.error(`❌ Poe API Error in ${this.moduleId}.${method}:`, error);
                this.hasError = true;
                this.error = error;
                window.aviaHealth?.reportError(this.moduleId, error);

                // Mostrar modal de error personalizado
                this.showPoeErrorModal(errorInfo, error);
            }

            /**
             * Muestra modal de error de Poe API
             * @private
             */
            showPoeErrorModal(errorInfo, error) {
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-20 modal-backdrop flex items-center justify-center z-50 fade-in';
                modal.innerHTML = `
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 border-l-8 border-${errorInfo.color}-500 relative">
                        <!-- Botón cerrar (X) superior derecha -->
                        <div class="absolute top-4 right-4 flex flex-col items-center gap-1">
                            <button class="close-btn w-12 h-12 bg-white hover:bg-gray-100 dark:bg-gray-700 dark:hover:bg-gray-600 rounded-full flex items-center justify-center transition-all hover:scale-110 volumetric-shadow-white" title="Cerrar">
                                <svg class="w-5 h-5 fill-gray-800 dark:fill-gray-200" viewBox="0 0 24 24">
                                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                                </svg>
                            </button>
                            <span class="text-xs font-medium text-gray-800 dark:text-gray-200">Cerrar</span>
                        </div>

                        <div class="flex items-start gap-4 pr-20">
                            <div class="text-5xl">${errorInfo.icon}</div>
                            <div class="flex-1">
                                <h3 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-2">
                                    ${errorInfo.title}
                                </h3>
                                <p class="text-gray-700 dark:text-gray-300 mb-4">
                                    ${errorInfo.message}
                                </p>
                                ${error.errorType === 'UNKNOWN' ? `
                                    <details class="text-xs text-gray-600 dark:text-gray-400 mt-2">
                                        <summary class="cursor-pointer hover:text-gray-800 dark:hover:text-gray-200">Detalles técnicos</summary>
                                        <pre class="mt-2 p-2 bg-gray-100 dark:bg-gray-900 rounded overflow-x-auto">${error.stack || error.message}</pre>
                                    </details>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;

                document.body.appendChild(modal);

                const closeHandler = () => {
                    document.body.removeChild(modal);
                };

                modal.querySelector('.close-btn').onclick = closeHandler;
                modal.onclick = (e) => {
                    if (e.target === modal) closeHandler();
                };
            }

            wrapAll() {
                const methods = Object.getOwnPropertyNames(Object.getPrototypeOf(this.component));
                methods.forEach(method => {
                    if (method !== 'constructor' && typeof this.component[method] === 'function') {
                        this.component[method] = this.wrap(this.component[method], method);
                    }
                });
                return this.component;
            }
        }

        /**
         * Module Registry - Registro central de módulos
         * Gestiona el ciclo de vida de todos los módulos
         */
        class ModuleRegistry {
            constructor() {
                this.modules = new Map();
                this.activeModules = new Set();
            }

            register(moduleId, ModuleClass, config = {}) {
                try {
                    const instance = new ModuleClass();
                    const boundary = new ErrorBoundary(moduleId, instance);
                    const wrappedInstance = boundary.wrapAll();

                    this.modules.set(moduleId, {
                        instance: wrappedInstance,
                        class: ModuleClass,
                        config,
                        boundary,
                        createdAt: Date.now()
                    });

                    window.aviaHealth?.register(moduleId, wrappedInstance);
                    console.log(`✅ Module '${moduleId}' registered successfully`);

                    return wrappedInstance;
                } catch (error) {
                    console.error(`❌ Failed to register module '${moduleId}':`, error);
                    return null;
                }
            }

            get(moduleId) {
                return this.modules.get(moduleId)?.instance;
            }

            has(moduleId) {
                return this.modules.has(moduleId);
            }

            activate(moduleId) {
                this.activeModules.add(moduleId);
                window.aviaEventBus?.emit('module:activated', { moduleId }, 'Registry');
            }

            deactivate(moduleId) {
                this.activeModules.delete(moduleId);
                window.aviaEventBus?.emit('module:deactivated', { moduleId }, 'Registry');
            }

            getAll() {
                const result = {};
                this.modules.forEach((data, id) => {
                    result[id] = {
                        title: data.instance.title,
                        active: this.activeModules.has(id),
                        status: window.aviaHealth?.getStatus(id)
                    };
                });
                return result;
            }
        }

        // ============================================
        // POE API MANAGER - Capa Centralizada de Comunicación
        // ============================================

        class PoeAPIManager {
            constructor() {
                this.handlers = new Map();
                this.activeRequests = new Map();
                this.isAvailable = typeof window.Poe !== 'undefined';
                this.requestCounter = 0;

                if (this.isAvailable) {
                    console.log('✅ Poe API disponible - PoeAPIManager inicializado');
                } else {
                    console.warn('⚠️ Poe API no disponible - Funcionando en modo simulación');
                }
            }

            /**
             * Registra un handler para respuestas de Poe
             * @param {string} handlerId - ID único del handler
             * @param {function} callback - Función callback para manejar respuestas
             * @param {string} moduleId - ID del módulo que registra el handler
             * @returns {boolean} - true si se registró exitosamente
             */
            registerHandler(handlerId, callback, moduleId) {
                if (!this.isAvailable) {
                    console.warn(`⚠️ No se puede registrar handler '${handlerId}' - Poe API no disponible`);
                    return false;
                }

                window.Poe.registerHandler(handlerId, (result, context) => {
                    // Emitir evento al EventBus para tracking
                    window.aviaEventBus?.emit('poe:response', {
                        handlerId,
                        moduleId,
                        status: result.status,
                        timestamp: Date.now()
                    }, moduleId);

                    // Ejecutar callback del módulo
                    try {
                        callback(result, context);
                    } catch (error) {
                        console.error(`❌ Error en handler '${handlerId}':`, error);
                        window.aviaHealth?.reportError(moduleId, error);
                    }

                    // Monitorear salud en caso de errores
                    if (result.status === 'error') {
                        window.aviaHealth?.reportError(moduleId, new Error(`Poe API error: ${result.responses[0]?.statusText || 'Unknown'}`));
                    }
                });

                this.handlers.set(handlerId, { callback, moduleId, createdAt: Date.now() });
                console.log(`✅ Handler '${handlerId}' registrado para módulo '${moduleId}'`);
                return true;
            }

            /**
             * Envía un mensaje a través de Poe API
             * @param {Object} config - Configuración del mensaje
             * @returns {Promise<Object>} - Resultado de la operación
             */
            async sendMessage(config) {
                const {
                    prompt,
                    bot = '@Claude-Sonnet-4.5',
                    handlerId,
                    moduleId,
                    stream = true,
                    openChat = false,
                    handlerContext = {},
                    attachments = []
                } = config;

                if (!this.isAvailable) {
                    const error = new Error('Poe API no disponible');
                    error.errorType = 'UNAVAILABLE';
                    throw error;
                }

                // Validar inputs
                if (!prompt || !handlerId || !moduleId) {
                    const error = new Error('Faltan parámetros requeridos: prompt, handlerId, moduleId');
                    error.errorType = 'INVALID_INPUT';
                    throw error;
                }

                const fullPrompt = `${bot} ${prompt}`;
                const requestId = `${moduleId}_${++this.requestCounter}_${Date.now()}`;

                try {
                    // Registrar request activo
                    this.activeRequests.set(requestId, {
                        moduleId,
                        handlerId,
                        timestamp: Date.now(),
                        prompt: prompt.substring(0, 100) // Solo primeros 100 chars para logging
                    });

                    // Emitir evento de inicio
                    window.aviaEventBus?.emit('poe:request:start', {
                        requestId,
                        moduleId,
                        handlerId,
                        bot
                    }, moduleId);

                    // Llamar a Poe API
                    const result = await window.Poe.sendUserMessage(fullPrompt, {
                        handler: handlerId,
                        stream,
                        openChat,
                        handlerContext: { ...handlerContext, requestId, moduleId },
                        attachments
                    });

                    // Emitir evento de éxito
                    window.aviaEventBus?.emit('poe:request:success', {
                        requestId,
                        moduleId
                    }, moduleId);

                    console.log(`✅ Mensaje enviado exitosamente [${requestId}]`);

                    return { success: true, requestId };

                } catch (err) {
                    // Manejo de errores específicos de Poe API
                    console.error(`❌ Error en sendMessage [${requestId}]:`, err);

                    // Registrar error en HealthMonitor
                    window.aviaHealth?.reportError(moduleId, err);

                    // Emitir evento de error
                    window.aviaEventBus?.emit('poe:request:error', {
                        requestId,
                        moduleId,
                        errorType: err.errorType || 'UNKNOWN',
                        message: err.message
                    }, moduleId);

                    // Limpiar request activo
                    this.activeRequests.delete(requestId);

                    throw err;
                }
            }

            /**
             * Limpia todos los handlers de un módulo específico
             * @param {string} moduleId - ID del módulo
             */
            cleanupModule(moduleId) {
                let cleaned = 0;
                for (const [handlerId, data] of this.handlers.entries()) {
                    if (data.moduleId === moduleId) {
                        this.handlers.delete(handlerId);
                        cleaned++;
                    }
                }

                if (cleaned > 0) {
                    console.log(`🧹 Limpiados ${cleaned} handlers del módulo '${moduleId}'`);
                }
            }

            /**
             * Obtiene estadísticas del PoeAPIManager
             * @returns {Object} - Estadísticas
             */
            getStats() {
                return {
                    isAvailable: this.isAvailable,
                    totalHandlers: this.handlers.size,
                    activeRequests: this.activeRequests.size,
                    totalRequestsSent: this.requestCounter,
                    handlersByModule: this.getHandlersByModule()
                };
            }

            /**
             * Agrupa handlers por módulo
             * @private
             */
            getHandlersByModule() {
                const grouped = {};
                for (const [handlerId, data] of this.handlers.entries()) {
                    if (!grouped[data.moduleId]) {
                        grouped[data.moduleId] = [];
                    }
                    grouped[data.moduleId].push(handlerId);
                }
                return grouped;
            }
        }

        // Inicializar sistemas globales
        window.aviaEventBus = new AVIAEventBus();
        window.aviaHealth = new ModuleHealthMonitor();
        window.aviaRegistry = new ModuleRegistry();
        window.poeManager = new PoeAPIManager();

        console.log('🚀 AVIA Modular Architecture initialized');
        console.log('📡 PoeAPIManager initialized');
        console.log(`   - Poe API Available: ${window.poeManager.isAvailable}`);

                                <svg class="w-5 h-5 fill-gray-800 dark:fill-gray-200" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>

                    document.body.removeChild(modal);
                    resolve();
                };

                modal.querySelector('.close-btn').onclick = closeHandler;
            });

        function showCustomConfirm(message) {
            return new Promise((resolve) => {
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-20 modal-backdrop flex items-center justify-center z-50 fade-in';
                modal.innerHTML = `
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 border-l-8 border-yellow-500 relative">
                        <!-- Botón de acción: Confirmar con texto debajo -->
                        <div class="absolute top-4 right-20 flex flex-col items-center gap-1">
                            <button class="confirm-btn w-12 h-12 bg-black hover:bg-gray-800 dark:hover:bg-gray-900 rounded-full flex items-center justify-center transition-all hover:scale-110" style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);" title="Confirmar">
                                <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                            </button>
                            <span class="text-xs font-medium text-gray-800 dark:text-gray-200">Confirmar</span>
                        </div>

            inputDigit(digit) {
                if (this.waitingForOperand) {
                    this.currentValue = String(digit);
                    this.waitingForOperand = false;
                } else {
                    this.currentValue = this.currentValue === '0' ? String(digit) : this.currentValue + digit;
                }
                this.updateDisplay();
            }

            inputOperator(op) {
                const value = parseFloat(this.currentValue);
                if (this.previousValue === '') {
                    this.previousValue = value;
                } else if (this.operation) {
                    const result = this.performOperation(this.previousValue, value, this.operation);
                    this.currentValue = String(result);
                    this.previousValue = result;
                }
                this.waitingForOperand = true;
                this.operation = op;
            }

            performOperation(prev, current, op) {
                switch (op) {
                    case '+': return prev + current;
                    case '-': return prev - current;
                    case '*': return prev * current;
                    case '/': return prev / current;
                    case '%': return prev % current;
                    default: return current;
                }
            }

            calculate() {
                const value = parseFloat(this.currentValue);
                if (this.previousValue !== '' && this.operation) {
                    const result = this.performOperation(this.previousValue, value, this.operation);
                    const expr = `${this.previousValue} ${this.operation} ${value} = ${result}`;
                    this.history.unshift(expr);
                    if (this.history.length > 10) this.history.pop();
                    this.currentValue = String(result);
                    this.previousValue = '';
                    this.operation = null;
                    this.updateDisplay();
                    this.updateHistory();
                }
            }

            clear() {
                this.currentValue = '0';
                this.previousValue = '';
                this.operation = null;
                this.updateDisplay();
            }

            delete() {
                this.currentValue = this.currentValue.slice(0, -1) || '0';
                this.updateDisplay();
            }

            updateDisplay() {
                const display = document.getElementById('calcDisplay');
                if (display) display.value = this.currentValue;
            }

            updateHistory() {
                const histEl = document.getElementById('calcHistory');
                if (histEl) {
                    histEl.innerHTML = this.history.map(h => `<div>${h}</div>`).join('');
                }
            }
        }

                if (title) {

                        title: title,
                        content: '',
                        date: new Date().toISOString()
                    });
                    this.saveNotes();
                    this.renderNotes();

            async editNote(id) {
                const note = this.notes.find(n => n.id === id);
                if (!note) return;

                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-20 modal-backdrop flex items-center justify-center z-50 fade-in';
                modal.innerHTML = `

                        <textarea id="noteContent" rows="12"
                                  class="w-full px-4 py-3 text-base bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 border-2 border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:border-yellow-500 mb-4 resize-none"
                                  placeholder="Escribe el contenido de tu nota aquí...">${note.content || ''}</textarea>
                    </div>
                `;
                document.body.appendChild(modal);

                const textarea = modal.querySelector('#noteContent');

                modal.querySelector('.close-btn').onclick = () => {

                modal.querySelector('.save-btn').onclick = () => {

                    note.date = new Date().toISOString();
                    this.saveNotes();
                    document.body.removeChild(modal);
                    this.renderNotes();
                };

            async deleteNote(id) {
                const confirmed = await showCustomConfirm('¿Eliminar esta nota?');

                    this.saveNotes();
                    this.renderNotes();

            async addTask(title) {
                if (!title) {
                    title = await showCustomPrompt('Nueva tarea:');
                }
                if (title) {
                    this.tasks.unshift({

                        title: title,
                        completed: false,

                    });

                this.saveTasks();
                this.renderTasks();

                            <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow-sm flex flex-col min-h-0">

            loadConfig() {
                this.config = {
                    theme: {
                        primaryColor: "#5D5CDE",
                        chartColors: ["#3B82F6", "#10B981", "#F59E0B", "#EF4444", "#8B5CF6", "#EC4899"]
                    },
                    kpis: [
                        { id: "users", title: "Usuarios Activos", icon: "👥", format: "number", color: "blue" },
                        { id: "revenue", title: "Ingresos", icon: "💰", format: "currency", color: "green" },
                        { id: "conversions", title: "Conversiones", icon: "🎯", format: "percentage", color: "purple" },
                        { id: "satisfaction", title: "Satisfacción", icon: "⭐", format: "rating", color: "yellow" }
                    ]
                };
            }

            generateSampleData() {
                const now = new Date();
                const days = 30;

                this.data = {
                    kpiValues: {
                        users: { current: 12543, previous: 11234, trend: "up" },
                        revenue: { current: 45678.90, previous: 42345.50, trend: "up" },
                        conversions: { current: 3.45, previous: 3.12, trend: "up" },
                        satisfaction: { current: 4.7, previous: 4.5, trend: "up" }
                    },
                    timeSeries: Array.from({length: days}, (_, i) => ({
                        date: new Date(now.getTime() - (days - i - 1) * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                        users: Math.floor(10000 + Math.random() * 5000),
                        revenue: Math.floor(40000 + Math.random() * 20000)
                    })),
                    categories: [
                        { name: "Producto A", value: 35, revenue: 15000 },
                        { name: "Producto B", value: 25, revenue: 12000 },
                        { name: "Producto C", value: 20, revenue: 10000 },
                        { name: "Producto D", value: 12, revenue: 6000 },
                        { name: "Otros", value: 8, revenue: 2678 }
                    ],
                    performance: {
                        Velocidad: 85,
                        Calidad: 92,
                        Usabilidad: 88,
                        Seguridad: 95,
                        SEO: 78,
                        Accesibilidad: 90
                    }
                };
            }

            setupEventListeners() {
                document.querySelectorAll('.time-range-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.time-range-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentRange = e.target.dataset.range;
                        this.generateSampleData();
                        this.renderKPIs();
                        this.renderCharts();
                    });
                });
            }

            renderKPIs() {
                const container = document.getElementById('kpiContainer');
                if (!container) return;

                container.innerHTML = '';

                this.config.kpis.forEach(kpi => {
                    const data = this.data.kpiValues[kpi.id];
                    const change = ((data.current - data.previous) / data.previous * 100).toFixed(1);

                    const card = document.createElement('div');
                    // Fondo gris para no parecer botones - más compacto
                    card.className = 'bg-gray-100 dark:bg-gray-700 rounded-lg p-3 shadow-sm border-l-4 border-gray-400 dark:border-gray-500';
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div class="text-2xl">${kpi.icon}</div>
                            <span class="text-xs bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-300 px-2 py-1 rounded">${data.trend === 'up' ? '📈' : '📉'} ${change}%</span>
                        </div>
                        <div class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-1">${this.formatValue(data.current, kpi.format)}</div>
                        <div class="text-xs text-gray-600 dark:text-gray-400">${kpi.title}</div>
                    `;
                    container.appendChild(card);
                });
            }

            renderCharts() {
                this.renderLineChart();
                this.renderBarChart();
                this.renderPieChart();
                this.renderRadarChart();
            }

            renderLineChart() {
                const ctx = document.getElementById('lineChart');
                if (!ctx) return;
                if (this.charts.line) this.charts.line.destroy();

                this.charts.line = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: this.data.timeSeries.map(d => d.date.split('-')[2]),
                        datasets: [{
                            label: 'Usuarios',
                            data: this.data.timeSeries.map(d => d.users),
                            borderColor: this.config.theme.chartColors[0],
                            backgroundColor: this.config.theme.chartColors[0] + '20',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: false } }
                    }
                });
            }

            renderBarChart() {
                const ctx = document.getElementById('barChart');
                if (!ctx) return;
                if (this.charts.bar) this.charts.bar.destroy();

                this.charts.bar = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: this.data.categories.map(c => c.name),
                        datasets: [{
                            label: 'Ingresos',
                            data: this.data.categories.map(c => c.revenue),
                            backgroundColor: this.config.theme.chartColors
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: false } }
                    }
                });
            }

            renderPieChart() {
                const ctx = document.getElementById('pieChart');
                if (!ctx) return;
                if (this.charts.pie) this.charts.pie.destroy();

                this.charts.pie = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: this.data.categories.map(c => c.name),
                        datasets: [{
                            data: this.data.categories.map(c => c.value),
                            backgroundColor: this.config.theme.chartColors
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
            }

            renderRadarChart() {
                const ctx = document.getElementById('radarChart');
                if (!ctx) return;
                if (this.charts.radar) this.charts.radar.destroy();

                this.charts.radar = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: Object.keys(this.data.performance),
                        datasets: [{
                            label: 'Rendimiento',
                            data: Object.values(this.data.performance),
                            backgroundColor: this.config.theme.chartColors[4] + '40',
                            borderColor: this.config.theme.chartColors[4],
                            pointBackgroundColor: this.config.theme.chartColors[4]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            r: {
                                beginAtZero: true,
                                max: 100
                            }
                        }
                    }
                });
            }

            formatValue(value, format) {
                switch(format) {
                    case 'currency':
                        return '$' + value.toLocaleString('es-ES', {minimumFractionDigits: 2});
                    case 'percentage':
                        return value.toFixed(2) + '%';
                    case 'rating':
                        return '⭐ ' + value.toFixed(1);
                    default:
                        return value.toLocaleString();
                }
            }

            nextPage() {
                this.currentPage = 1;
                document.getElementById('chartsPage1').classList.add('hidden');
                document.getElementById('chartsPage2').classList.remove('hidden');
                // Ocultar botón siguiente (no hay más páginas)
                document.getElementById('nextPageBtn').classList.add('hidden');
                // Mostrar botón anterior
                document.getElementById('prevPageBtn').classList.remove('hidden');
            }

            previousPage() {
                this.currentPage = 0;
                document.getElementById('chartsPage1').classList.remove('hidden');
                document.getElementById('chartsPage2').classList.add('hidden');
                // Mostrar botón siguiente
                document.getElementById('nextPageBtn').classList.remove('hidden');
                // Ocultar botón anterior (ya estamos en la primera página)
                document.getElementById('prevPageBtn').classList.add('hidden');
            }

            destroy() {
                if (this.charts.line) this.charts.line.destroy();
                if (this.charts.bar) this.charts.bar.destroy();
                if (this.charts.pie) this.charts.pie.destroy();
                if (this.charts.radar) this.charts.radar.destroy();
            }
        }

            renderCalendar() {
                const monthEl = document.getElementById('calendarMonth');
                const gridEl = document.getElementById('calendarGrid');
                const yearEl = document.getElementById('calendarYear');
                const currentDateTextEl = document.getElementById('currentDateText');
                if (!monthEl || !gridEl) return;

                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();

                // Actualizar título del mes
                const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                                   'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                const dayNames = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

                monthEl.textContent = monthNames[month];

                // Actualizar año
                if (yearEl) {
                    yearEl.textContent = year;
                }

                // Actualizar fecha completa basada en el día seleccionado
                if (currentDateTextEl && this.selectedDate) {
                    const selectedDateObj = new Date(this.selectedDate + 'T00:00:00');
                    const dayName = dayNames[selectedDateObj.getDay()];
                    const dayNum = selectedDateObj.getDate();
                    const monthName = monthNames[selectedDateObj.getMonth()];
                    const yearNum = selectedDateObj.getFullYear();
                    currentDateTextEl.textContent = `${dayName} ${dayNum} de ${monthName} ${yearNum}`;
                }

                // Calcular primer día del mes y total de días
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const today = new Date();

                // Limpiar grid
                gridEl.innerHTML = '';

                // Días vacíos al inicio
                for (let i = 0; i < firstDay; i++) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'aspect-square';
                    gridEl.appendChild(emptyDiv);
                }

                // Días del mes
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = this.formatDate(new Date(year, month, day));
                    const dayEvents = this.events.filter(e => e.date === dateStr);
                    const isToday = today.getDate() === day &&
                                   today.getMonth() === month &&
                                   today.getFullYear() === year;
                    const isSelected = this.selectedDate === dateStr;

                    const dayDiv = document.createElement('div');
                    // Si está seleccionado: fondo azul con número blanco
                    // Si es hoy pero no seleccionado: borde verde
                    // Si tiene eventos: indicador morado
                    if (isSelected) {
                        dayDiv.className = 'aspect-square p-2 rounded-lg cursor-pointer transition-all bg-blue-500 hover:bg-blue-600';
                        dayDiv.innerHTML = `
                            <div class="text-center font-bold text-white text-2xl">${day}</div>
                            ${dayEvents.length > 0 ? `<div class="text-xs text-center text-white font-bold mt-1">${dayEvents.length} 🔔</div>` : ''}
                        `;
                    } else {
                        dayDiv.className = `aspect-square p-2 rounded-lg cursor-pointer transition-all border-2 ${
                            isToday ? 'border-green-500 bg-green-50 dark:bg-green-900/30' :
                            'border-gray-200 dark:border-gray-700 hover:border-blue-300 dark:hover:border-blue-600'
                        } ${dayEvents.length > 0 ? 'bg-purple-50 dark:bg-purple-900/20' : 'bg-white dark:bg-gray-800'}`;

                        dayDiv.innerHTML = `
                            <div class="text-center font-semibold text-gray-800 dark:text-gray-100 text-xl">${day}</div>
                            ${dayEvents.length > 0 ? `<div class="text-xs text-center text-purple-600 dark:text-purple-400 font-bold mt-1">${dayEvents.length} 🔔</div>` : ''}
                        `;
                    }

                    dayDiv.onclick = () => {
                        if (this.selectedDate === dateStr) {
                            // Si hacemos clic en el día ya seleccionado, mostramos/editamos eventos
                            this.openDayEventsModal(dateStr);
                        } else {
                            // Si no, lo seleccionamos
                            this.selectedDate = dateStr;
                            this.renderCalendar();
                        }
                    };

                    gridEl.appendChild(dayDiv);
                }
            }


            async editMonth() {
                const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                                   'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                const currentMonth = monthNames[this.currentDate.getMonth()];
                const newMonth = await showCustomPrompt('Ingresa el mes:', currentMonth);
                if (newMonth) {
                    const monthIndex = monthNames.findIndex(m => m.toLowerCase() === newMonth.toLowerCase());
                    if (monthIndex !== -1) {
                        this.currentDate.setMonth(monthIndex);
                        // Mantener el día seleccionado en el 6 del nuevo mes
                        const year = this.currentDate.getFullYear();
                        this.selectedDate = `${year}-${String(monthIndex + 1).padStart(2, '0')}-06`;
                        this.renderCalendar();
                    } else {
                        await showCustomAlert('Mes inválido. Usa el nombre completo del mes.');
                    }
                }
            }

            async editYear() {
                const currentYear = this.currentDate.getFullYear();
                const newYear = await showCustomPrompt('Ingresa el a��o:', currentYear.toString());
                if (newYear) {
                    const yearNum = parseInt(newYear);
                    if (!isNaN(yearNum) && yearNum > 1900 && yearNum < 2100) {
                        this.currentDate.setFullYear(yearNum);
                        // Mantener el día seleccionado en el 6 del nuevo año
                        const month = this.currentDate.getMonth();
                        this.selectedDate = `${yearNum}-${String(month + 1).padStart(2, '0')}-06`;
                        this.renderCalendar();
                    } else {
                        await showCustomAlert('Año inválido. Usa un año entre 1900 y 2100.');
                    }
                }
            }

            nextDay() {
                if (!this.selectedDate) {
                    // Si no hay día seleccionado, seleccionar hoy
                    this.selectedDate = this.formatDate(new Date());
                } else {
                    // Avanzar al siguiente día
                    const currentSelected = new Date(this.selectedDate + 'T00:00:00');
                    currentSelected.setDate(currentSelected.getDate() + 1);
                    this.selectedDate = this.formatDate(currentSelected);

                    // Si cambiamos de mes, actualizar el mes mostrado
                    if (currentSelected.getMonth() !== this.currentDate.getMonth() ||
                        currentSelected.getFullYear() !== this.currentDate.getFullYear()) {
                        this.currentDate = new Date(currentSelected);
                    }
                }
                this.renderCalendar();
            }

            async deleteEventFromModal(eventId, dateStr) {
                const confirmed = await showCustomConfirm('¿Eliminar este evento?');

                    this.saveEvents();

                    this.renderCalendar();

                const dateStr = this.selectedDate || this.formatDate(new Date());

                if (!title) return;

                const time = await showCustomPrompt('Hora (HH:MM):', '09:00');

                const description = await showCustomPrompt('Descripción (opcional):', '');

                this.events.push({

                    date: dateStr,
                    time: time,
                    title: title,
                    description: description || ''
                });

                this.saveEvents();
                this.renderCalendar();

            async addEventFromModal(dateStr) {
                const modal = document.querySelector('.modal-backdrop');
                if (modal) document.body.removeChild(modal);

                const title = await showCustomPrompt('Título del evento:');
                if (!title) return;

                const time = await showCustomPrompt('Hora (HH:MM):', '09:00');
                if (!time) return;

                const description = await showCustomPrompt('Descripción (opcional):', '');

                this.events.push({
                    id: Date.now(),
                    date: dateStr,
                    time: time,
                    title: title,
                    description: description || ''
                });

                this.renderCalendar();
                this.openDayEventsModal(dateStr);

            renderMessages() {
                if (this.messages.length === 0) {
                    const persona = this.personas[this.activePersona];
                    return `

                            </div>
                        </div>
                    `;
                }

                return this.messages.map(msg => {
                    const isUser = msg.role === 'user';
                    const isError = msg.role === 'error';
                    const isSystem = msg.role === 'system';

                    if (isSystem) {
                        return `
                            <div class="text-center">
                                <span class="text-xs bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-400 px-3 py-1 rounded-full">

                        `;
                    }

                    if (isError) {
                        return `
                            <div class="bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 p-3 rounded">
                                <p class="text-sm text-red-700 dark:text-red-300">${msg.content}</p>
                            </div>
                        `;
                    }

                    return `
                        <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
                            <div class="max-w-[80%] ${isUser
                                ? 'bg-purple-500 text-white'
                                : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-gray-700'
                            } px-4 py-2 rounded-2xl ${isUser ? 'rounded-br-sm' : 'rounded-bl-sm'}">
                                ${msg.status === 'loading'
                                    ? '<div class="flex items-center gap-2"><div class="animate-pulse">⏳</div><span class="text-sm">Pensando...</span></div>'
                                    : `<p class="text-sm whitespace-pre-wrap">${msg.content}</p>`

            switchPersona(personaKey) {
                this.activePersona = personaKey;
                document.querySelector('.fixed.modal-backdrop')?.remove();
                this.messages.push({
                    role: 'system',
                    content: `Cambiado a ${this.personas[personaKey].name}`,
                    timestamp: Date.now()
                });
                this.renderFloatingPanel();
                window.aviaEventBus?.emit('assistant:persona-changed', { persona: personaKey }, 'AVIAAssistant');
            }

            async sendMessage() {
                const input = document.getElementById('aviaInput');
                if (!input || !input.value.trim()) return;

                const message = input.value.trim();
                input.value = '';

                // Agregar mensaje del usuario
                this.messages.push({
                    role: 'user',
                    content: message,
                    timestamp: Date.now()
                });

                // Verificar si es un comando
                if (message.startsWith('/')) {
                    this.executeCommand(message);
                    return;
                }

                // Mostrar estado de carga
                const loadingMsg = {
                    role: 'assistant',
                    content: 'Pensando...',
                    status: 'loading',
                    timestamp: Date.now()
                };
                this.messages.push(loadingMsg);
                this.updateMessages();

                // Enviar a Poe API si está disponible
                if (typeof window.Poe !== 'undefined') {
                    try {
                        const persona = this.personas[this.activePersona];
                        const fullPrompt = `${persona.prompt}\n\nUsuario: ${message}`;

                        await window.Poe.sendUserMessage(`@Claude-Sonnet-4.5 ${fullPrompt}`, {
                            handler: 'avia-assistant',
                            stream: true,
                            openChat: false,
                            handlerContext: { originalMessage: message }
                        });
                    } catch (error) {
                        console.error('Error sending to Poe:', error);
                        this.messages.pop(); // Remover loading
                        this.messages.push({
                            role: 'error',
                            content: `Error al comunicar con IA: ${error.message}`,
                            timestamp: Date.now()
                        });
                        this.updateMessages();
                    }
                } else {
                    // Fallback: respuesta simulada
                    this.messages.pop(); // Remover loading
                    this.messages.push({
                        role: 'assistant',
                        content: this.getLocalResponse(message),
                        timestamp: Date.now()
                    });
                    this.updateMessages();
                }
            }

            handlePoeResponse(result, context) {
                const msg = result.responses[0];

                // Remover mensaje de loading
                this.messages = this.messages.filter(m => m.status !== 'loading');

                if (msg.status === 'error') {
                    this.messages.push({
                        role: 'error',
                        content: `Error: ${msg.statusText}`,
                        timestamp: Date.now()
                    });
                } else if (msg.status === 'incomplete' || msg.status === 'complete') {
                    // Buscar si ya existe un mensaje del asistente siendo actualizado
                    const lastMsg = this.messages[this.messages.length - 1];
                    if (lastMsg && lastMsg.role === 'assistant' && lastMsg.messageId === msg.messageId) {
                        // Actualizar mensaje existente
                        lastMsg.content = msg.content;
                        lastMsg.status = msg.status;
                    } else {
                        // Crear nuevo mensaje
                        this.messages.push({
                            role: 'assistant',
                            content: msg.content,
                            status: msg.status,
                            messageId: msg.messageId,
                            timestamp: Date.now()
                        });
                    }
                }

                this.updateMessages();
            }

            executeCommand(command) {
                const cmd = command.split(' ')[0];

                switch (cmd) {
                    case '/help':
                        this.showHelp();
                        break;
                    case '/salud-sistema':
                        this.checkSystemHealth();
                        break;
                    case '/resumen-dia':
                        this.generateDailySummary();
                        break;
                    case '/analizar-tareas':
                        this.analyzeTasks();
                        break;
                    case '/optimizar':
                        this.optimizeSystem();
                        break;
                    default:
                        this.messages.push({
                            role: 'error',
                            content: `Comando no reconocido: ${cmd}. Usa /help para ver comandos disponibles.`,
                            timestamp: Date.now()
                        });
                }

                this.updateMessages();
            }

            showHelp() {
                const helpText = Object.entries(this.commands)
                    .map(([cmd, desc]) => `${cmd} - ${desc}`)
                    .join('\n');

                this.messages.push({
                    role: 'assistant',
                    content: `📚 Comandos Disponibles:\n\n${helpText}`,
                    timestamp: Date.now()
                });
            }

            checkSystemHealth() {
                const status = window.aviaHealth?.getAllStatus() || {};
                const moduleCount = Object.keys(status).length;
                const healthyCount = Object.values(status).filter(s => s.status === 'healthy').length;
                const warningCount = Object.values(status).filter(s => s.status === 'warning').length;
                const criticalCount = Object.values(status).filter(s => s.status === 'critical').length;

                let report = `🏥 Estado del Sistema AVIA\n\n`;
                report += `📊 Total de módulos: ${moduleCount}\n`;
                report += `✅ Saludables: ${healthyCount}\n`;
                report += `⚠️ Advertencias: ${warningCount}\n`;
                report += `🔴 Críticos: ${criticalCount}\n\n`;

                if (criticalCount > 0 || warningCount > 0) {
                    report += `Detalles de problemas:\n`;
                    Object.entries(status).forEach(([id, info]) => {
                        if (info.status !== 'healthy') {
                            report += `\n- ${id}: ${info.status} (${info.errorCount} errores)`;
                            if (info.lastError) {
                                report += `\n  Último error: ${info.lastError.message}`;
                            }
                        }
                    });
                }

                this.messages.push({
                    role: 'assistant',
                    content: report,
                    timestamp: Date.now()
                });
            }

            generateDailySummary() {
                const tasks = window._appStorage?.tasks || [];
                const completedTasks = tasks.filter(t => t.completed).length;
                const pendingTasks = tasks.filter(t => !t.completed).length;
                const notes = window._appStorage?.notes || [];
                const events = window._appStorage?.calendarEvents || [];

                const today = new Date().toISOString().split('T')[0];
                const todayEvents = events.filter(e => e.date === today);

                let summary = `📊 Resumen del Día\n\n`;
                summary += `📋 Tareas:\n`;
                summary += `  ✅ Completadas: ${completedTasks}\n`;
                summary += `  ⏳ Pendientes: ${pendingTasks}\n\n`;
                summary += `📝 Notas totales: ${notes.length}\n`;
                summary += `📅 Eventos hoy: ${todayEvents.length}\n\n`;

                if (todayEvents.length > 0) {
                    summary += `Eventos de hoy:\n`;
                    todayEvents.forEach(e => {
                        summary += `  • ${e.time} - ${e.title}\n`;
                    });
                }

                this.messages.push({
                    role: 'assistant',
                    content: summary,
                    timestamp: Date.now()
                });
            }

            analyzeTasks() {
                const tasks = window._appStorage?.tasks || [];
                const pending = tasks.filter(t => !t.completed);

                let analysis = `🎯 Análisis de Tareas\n\n`;

                if (pending.length === 0) {
                    analysis += `¡Excelente! No tienes tareas pendientes. 🎉\n`;
                    analysis += `Considera revisar tus objetivos a largo plazo.`;
                } else {
                    analysis += `Tienes ${pending.length} tareas pendientes.\n\n`;
                    analysis += `Sugerencias de priorización:\n\n`;

                    pending.slice(0, 5).forEach((task, i) => {
                        analysis += `${i + 1}. ${task.title}\n`;
                    });

                    if (pending.length > 5) {
                        analysis += `\n... y ${pending.length - 5} tareas más.\n`;
                    }

                    analysis += `\n💡 Consejo: Usa la técnica Pomodoro para mantener el enfoque.`;
                }

                this.messages.push({
                    role: 'assistant',
                    content: analysis,
                    timestamp: Date.now()
                });
            }

            optimizeSystem() {
                this.messages.push({
                    role: 'assistant',
                    content: `🚀 Optimizando sistema AVIA...\n\nComprobando módulos, limpiando caché y verificando integridad...\n\n✅ Sistema optimizado correctamente.`,
                    timestamp: Date.now()
                });

                window.aviaEventBus?.emit('system:optimized', {}, 'AVIAAssistant');
            }

            getLocalResponse(message) {
                const lowerMsg = message.toLowerCase();

                if (lowerMsg.includes('hola') || lowerMsg.includes('hi')) {
                    return `¡Hola! Soy ${this.personas[this.activePersona].name}. ¿En qué puedo ayudarte hoy?`;
                }

                if (lowerMsg.includes('ayuda') || lowerMsg.includes('help')) {
                    return `Puedo ayudarte con:\n\n- Análisis de tareas y productividad\n- Gestión de calendario y eventos\n- Generación de narrativas transmedia\n- Optimización del sistema\n\nPrueba comandos como /help, /salud-sistema o /resumen-dia`;
                }

                return `Entiendo tu mensaje: "${message}"\n\nPara funcionalidad completa de IA, asegúrate de que la Poe Embed API esté disponible. Mientras tanto, puedo ayudarte con comandos del sistema. Escribe /help para ver opciones.`;
            }

            updateMessages() {
                const container = document.getElementById('aviaChatMessages');
                if (container) {
                    container.innerHTML = this.renderMessages();
                    container.scrollTop = container.scrollHeight;
                }
            }

            reset() {
                this.messages = [];
                this.renderFloatingPanel();
            }
        }
