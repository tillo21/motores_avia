            // Template Selection
            async selectTemplate(templateKey) {
                const template = this.templates[templateKey];
                const title = await showCustomPrompt('Título del guion:', `Mi ${template.name}`);

                if (!title) return;

                const newScript = {
                    id: Date.now(),
                    template: templateKey,
                    title: title,
                    concept: '',
                    content: '',
                    storyboard: [],
                    createdAt: Date.now()
                };

                this.scripts.push(newScript);
                this.currentScript = newScript;
                this.currentView = 'editor';
                this.saveScripts();
                this.renderCurrentView();

                window.aviaEventBus?.emit('script:created', { scriptId: newScript.id, template: templateKey }, 'ScriptGenerator');
            }

            // Navigation
            backToTemplates() {
                this.currentScript = null;
                this.currentView = 'templates';
                this.renderCurrentView();
            }

            backToEditor() {
                this.currentView = 'editor';
                this.renderCurrentView();
            }

            backToStoryboard() {
                this.currentView = 'storyboard';
                this.renderCurrentView();
            }

            // Script Management
            editScript(scriptId) {
                this.currentScript = this.scripts.find(s => s.id === scriptId);
                if (this.currentScript) {
                    this.currentView = 'editor';
                    this.renderCurrentView();
                }
            }

            viewStoryboard(scriptId) {
                this.currentScript = this.scripts.find(s => s.id === scriptId);
                if (this.currentScript) {
                    this.currentView = 'storyboard';
                    this.renderCurrentView();
                }
            }

            viewTimeline(scriptId) {
                this.currentScript = this.scripts.find(s => s.id === scriptId);
                if (this.currentScript) {
                    this.currentView = 'timeline';
                    this.renderCurrentView();
                }
            }

            async deleteScript(scriptId) {
                const confirmed = await showCustomConfirm('¿Eliminar este guion permanentemente?');
                if (confirmed) {
                    this.scripts = this.scripts.filter(s => s.id !== scriptId);
                    this.saveScripts();
                    this.renderCurrentView();
                    window.aviaEventBus?.emit('script:deleted', { scriptId }, 'ScriptGenerator');
                }
            }

            updateScriptTitle(value) {
                if (this.currentScript) {
                    this.currentScript.title = value;
                }
            }

            updateScriptConcept(value) {
                if (this.currentScript) {
                    this.currentScript.concept = value;
                }
            }

            updateScriptContent(value) {
                if (this.currentScript) {
                    this.currentScript.content = value;
                }
            }

            saveScript() {
                this.saveScripts();
                showCustomAlert('✅ Guion guardado exitosamente');
                window.aviaEventBus?.emit('script:saved', { scriptId: this.currentScript.id }, 'ScriptGenerator');
            }

            // AI Generation
            async generateWithAI() {
                if (!this.currentScript) return;

                const template = this.templates[this.currentScript.template];
                const concept = this.currentScript.concept || 'una historia original';

                if (typeof window.Poe !== 'undefined') {
                    const fullPrompt = `${template.prompt}\n\nConcepto: ${concept}\n\nCrea un guion profesional y detallado. Incluye formato de guion estándar con ESCENAS, DIÁLOGOS y ACOTACIONES.`;

                    try {
                        showCustomAlert('🤖 Generando guion con IA... Esto puede tomar unos momentos.');

                        await window.Poe.sendUserMessage(`@Claude-Sonnet-4.5 ${fullPrompt}`, {
                            handler: 'script-generator-ai',
                            stream: false,
                            openChat: false,
                            handlerContext: { scriptId: this.currentScript.id }
                        });

                        // Registrar handler si no existe
                        if (!window._scriptGenHandlerRegistered) {
                            window.Poe.registerHandler('script-generator-ai', (result, context) => {
                                const msg = result.responses[0];
                                if (msg.status === 'complete') {
                                    const script = this.scripts.find(s => s.id === context.scriptId);
                                    if (script) {
                                        script.content = msg.content;
                                        this.currentScript = script;
                                        this.saveScripts();
                                        this.renderCurrentView();
                                        showCustomAlert('✅ Guion generado exitosamente con IA');
                                    }
                                } else if (msg.status === 'error') {
                                    showCustomAlert(`❌ Error al generar: ${msg.statusText}`);
                                }
                            });
                            window._scriptGenHandlerRegistered = true;
                        }
                    } catch (error) {
                        showCustomAlert(`❌ Error: ${error.message}`);
                    }
                } else {
                    // Fallback sin Poe API
                    this.currentScript.content = this.generateLocalScript(template, concept);
                    this.saveScripts();
                    this.renderCurrentView();
                    showCustomAlert('✅ Guion de ejemplo generado (Poe API no disponible)');
                }
            }

            generateLocalScript(template, concept) {
                return `TÍTULO: ${this.currentScript.title.toUpperCase()}
FORMATO: ${template.name}

=====================================

                });

                this.saveScripts();

            async editScene(index) {
                const scene = this.currentScript.storyboard[index];
                const newTitle = await showCustomPrompt('Título de la escena:', scene.title);
                if (newTitle) {
                    scene.title = newTitle;
                    const newDesc = await showCustomPrompt('Descripción:', scene.description);
                    if (newDesc) scene.description = newDesc;
                    this.saveScripts();
                    this.renderCurrentView();
                }

            async deleteScene(index) {
                const confirmed = await showCustomConfirm('¿Eliminar esta escena?');
                if (confirmed) {
                    this.currentScript.storyboard.splice(index, 1);
                    this.saveScripts();
                    this.renderCurrentView();
                }

            async generateSceneImage(scriptId, sceneIndex) {
                const script = this.scripts.find(s => s.id === scriptId);
                if (!script || !script.storyboard[sceneIndex]) return;

                const scene = script.storyboard[sceneIndex];

                if (typeof window.Poe !== 'undefined') {
                    try {
                        showCustomAlert('🎨 Generando imagen con IA... Esto puede tardar un momento.');

                        const imagePrompt = `${scene.description}. Cinematographic shot, professional lighting, detailed --aspect 16:9`;

                        await window.Poe.sendUserMessage(`@FLUX-pro-1.1 ${imagePrompt}`, {
                            handler: 'storyboard-image-gen',
                            stream: false,
                            openChat: false,
                            handlerContext: { scriptId, sceneIndex }
                        });

                        // Registrar handler
                        if (!window._storyboardImageHandlerRegistered) {
                            window.Poe.registerHandler('storyboard-image-gen', (result, context) => {
                                const msg = result.responses[0];
                                if (msg.status === 'complete' && msg.attachments && msg.attachments.length > 0) {
                                    const imageUrl = msg.attachments[0].url;
                                    const script = this.scripts.find(s => s.id === context.scriptId);
                                    if (script && script.storyboard[context.sceneIndex]) {
                                        script.storyboard[context.sceneIndex].imageUrl = imageUrl;
                                        this.currentScript = script;
                                        this.saveScripts();
                                        this.renderCurrentView();
                                        showCustomAlert('✅ Imagen generada exitosamente');
                                    }
                                } else if (msg.status === 'error') {
                                    showCustomAlert(`❌ Error: ${msg.statusText}`);
                                }
                            });
                            window._storyboardImageHandlerRegistered = true;
                        }
                    } catch (error) {
                        showCustomAlert(`❌ Error: ${error.message}`);
                    }
                } else {
                    showCustomAlert('⚠️ Poe API no disponible. Conecta con Poe para generar imágenes.');
                }
            }

                    .replace(/\n\n/g, '</p><p class="mb-3 text-gray-700 dark:text-gray-300">')

            toggle() {

                const btn = document.getElementById('pomodoroStart');

                if (this.isRunning) {
                    btn.textContent = '⏸️ Pausar';
                    btn.className = 'px-8 py-4 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg text-xl font-bold transition-colors';

                    this.pause();

            start() {
                this.interval = setInterval(() => {
                    this.timeLeft--;
                    if (this.timeLeft <= 0) {
                        this.switchMode();
                    }
                    this.updateDisplay();
                }, 1000);
            }

            pause() {
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }
            }

            reset() {
                this.pause();
                this.isRunning = false;
                this.timeLeft = this.isWork ? this.workTime : this.breakTime;
                const btn = document.getElementById('pomodoroStart');
                btn.textContent = '▶️ Iniciar';
                btn.className = 'px-8 py-4 bg-green-500 hover:bg-green-600 text-white rounded-lg text-xl font-bold transition-colors';
                this.updateDisplay();
            }

            async switchMode() {
                this.isWork = !this.isWork;
                this.timeLeft = this.isWork ? this.workTime : this.breakTime;
                await showCustomAlert(this.isWork ? '¡Tiempo de trabajar!' : '¡Toma un descanso!');
            }

            updateDisplay() {
                const minutes = Math.floor(this.timeLeft / 60);
                const seconds = this.timeLeft % 60;
                const display = document.getElementById('pomodoroTimer');
                const mode = document.getElementById('pomodoroMode');

                if (display) {
                    display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                }
                if (mode) {
                    mode.textContent = this.isWork ? '💼 Trabajo' : '☕ Descanso';
                }
            }

            destroy() {
                this.pause();
            }
        }

            createProject() {
                const title = document.getElementById('toocTitle').value;
                const description = document.getElementById('toocDescription').value;
                const genre = document.getElementById('toocGenre').value;
                const audience = document.getElementById('toocAudience').value;

                const platforms = Array.from(document.querySelectorAll('input[name="platform"]:checked')).map(cb => cb.value);

                if (!title.trim()) {
                    showCustomAlert('⚠️ Por favor ingresa un título para el proyecto.');
                    return;
                }

                const newProject = {
                    id: Date.now(),
                    title,
                    description,
                    genre,
                    audience,
                    platforms,
                    formats,
                    contents: [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                this.projects.push(newProject);
                this.saveProjects();

                showCustomAlert(`✅ Proyecto "${title}" creado exitosamente.`);
                this.currentProject = newProject;
                this.currentView = 'edit';
                this.render(document.getElementById('appContent'));

                showPromptDialog('Título del contenido', (title) => {

                        return;
                    }

                    const newContent = {
                        id: Date.now(),
                        title: title.trim(),
                        description: '',
                        type: 'text',
                        platform: this.currentProject.platforms[0] || 'web',
                        createdAt: new Date().toISOString()
                    };

                    this.currentProject.contents.push(newContent);
                    this.currentProject.updatedAt = new Date().toISOString();
                    this.saveProjects();
                    this.render(document.getElementById('appContent'));
                });
            }

            editContent(index) {
                try {
                    const content = this.currentProject.contents[index];
                    if (!content) {
                        showCustomAlert('❌ Contenido no encontrado.');
                        return;
                    }

                    // Usar el submódulo TOOCContentEditor
                    window.toocContentEditor.openEditor(content, (updatedContent) => {
                        this.currentProject.contents[index] = updatedContent;
                        this.currentProject.updatedAt = new Date().toISOString();
                        this.saveProjects();
                        this.render(document.getElementById('appContent'));
                    });
                } catch (error) {
                    console.error('Error al editar contenido:', error);
                    showCustomAlert('❌ Error al abrir el editor de contenidos.');
                }
            }

            deleteContent(index) {
                showConfirmDialog('¿Estás seguro de que deseas eliminar este contenido?', () => {

                    this.currentProject.updatedAt = new Date().toISOString();
                    this.saveProjects();
                    this.render(document.getElementById('appContent'));

            async generateContentSuggestionsAI() {
                try {
                    // Cerrar modal
                    const modal = document.querySelector('.fixed.inset-0');
                    if (modal) modal.remove();

                    // Mostrar indicador de carga
                    showCustomAlert('🤖 Generando sugerencias de contenidos con IA...\n\nEsto puede tomar unos segundos.');

                    const suggestions = await window.toocAIGenerator.generateContentSuggestions(
                        this.currentProject.title,
                        this.currentProject.description,
                        this.currentProject.platforms[0] || 'web'
                    );

                    if (suggestions && suggestions.length > 0) {
                        // Añadir sugerencias al proyecto
                        suggestions.forEach(suggestion => {
                            this.currentProject.contents.push({
                                id: Date.now() + Math.random(),
                                title: suggestion.title,
                                description: suggestion.description,
                                type: suggestion.type || 'text',
                                platform: this.currentProject.platforms[0] || 'web',
                                duration: suggestion.duration || '',
                                createdAt: new Date().toISOString()
                            });
                        });

                        this.currentProject.updatedAt = new Date().toISOString();
                        this.saveProjects();
                        this.render(document.getElementById('appContent'));
                        showCustomAlert(`✅ Se han añadido ${suggestions.length} contenidos sugeridos por IA.`);
                    } else {
                        showCustomAlert('⚠️ No se pudieron generar sugerencias. Inténtalo de nuevo.');
                    }
                } catch (error) {
                    console.error('Error al generar sugerencias:', error);
                    showCustomAlert('❌ Error al generar sugerencias con IA.');
                }

                try {
                    if (!this.currentProject.description || this.currentProject.description.trim() === '') {
                        showCustomAlert('⚠️ Primero debes tener una descripción para mejorar.');
                        return;
                    }

                    // Cerrar modal
                    const modal = document.querySelector('.fixed.inset-0');
                    if (modal) modal.remove();

                    showCustomAlert('✨ Mejorando descripción con IA...\n\nEsto puede tomar unos segundos.');

                    const enhancedDescription = await window.toocAIGenerator.enhanceDescription(this.currentProject.description);

                    if (enhancedDescription && enhancedDescription !== this.currentProject.description) {
                        this.currentProject.description = enhancedDescription;
                        this.currentProject.updatedAt = new Date().toISOString();
                        this.saveProjects();
                        this.render(document.getElementById('appContent'));
                        showCustomAlert('✅ Descripción mejorada con éxito.');
                    } else {
                        showCustomAlert('⚠️ No se pudo mejorar la descripción. Inténtalo de nuevo.');
                    }
                } catch (error) {
                    console.error('Error al mejorar descripción:', error);
                    showCustomAlert('❌ Error al mejorar la descripción.');
                }

        class TOOCAIGenerator {
            constructor() {
                this.isGenerating = false;
                this.availableBots = {
                    text: '@Claude-Sonnet-4.5',
                    image: '@GPT-Image-1',
                    ideas: '@Claude-Sonnet-4.5'
                };
            }

            // Genera ideas de proyectos TOOC basados en un tema
            async generateProjectIdeas(topic, count = 3) {
                try {
                    if (!topic || topic.trim() === '') {
                        throw new Error('El tema no puede estar vacío');
                    }

                    this.isGenerating = true;
                    const prompt = `${this.availableBots.ideas} Genera exactamente ${count} ideas de proyectos transmedia sobre "${topic}". Para cada idea, proporciona SOLO JSON sin explicaciones ni formato markdown:
[
  {
    "title": "Título del proyecto",
    "description": "Descripción breve del proyecto",
    "platforms": ["Plataforma1", "Plataforma2"],
    "targetAudience": "Audiencia objetivo"
  }
]`;

                    return new Promise((resolve, reject) => {
                        if (!window.Poe || !window.Poe.sendUserMessage) {
                            this.isGenerating = false;
                            reject(new Error('Poe API no disponible'));
                            return;
                        }

                        window.Poe.registerHandler('tooc-ideas-handler', (result) => {
                            try {
                                const msg = result.responses[0];

                                if (msg.status === 'error') {
                                    this.isGenerating = false;
                                    reject(new Error(msg.statusText || 'Error al generar ideas'));
                                } else if (msg.status === 'complete') {
                                    this.isGenerating = false;
                                    const ideas = this.parseAIResponse(msg.content);
                                    resolve(ideas);
                                }
                            } catch (error) {
                                this.isGenerating = false;
                                reject(error);
                            }
                        });

                        window.Poe.sendUserMessage(prompt, {
                            handler: 'tooc-ideas-handler',
                            stream: false,
                            openChat: false
                        }).catch(error => {
                            this.isGenerating = false;
                            reject(error);
                        });
                    });

                } catch (error) {
                    console.error('Error al generar ideas de proyectos:', error);
                    this.isGenerating = false;
                    return [];
                }
            }

            // Genera contenidos sugeridos para un proyecto TOOC
            async generateContentSuggestions(projectTitle, projectDescription, platformType) {
                try {
                    if (!projectTitle || projectTitle.trim() === '') {
                        throw new Error('El título del proyecto no puede estar vacío');
                    }

                    this.isGenerating = true;

    "title": "Título del contenido",

            // Genera descripción mejorada con IA
            async enhanceDescription(currentDescription) {
                try {
                    if (!currentDescription || currentDescription.trim() === '') {
                        throw new Error('La descripción no puede estar vacía');
                    }

                    this.isGenerating = true;
                    const prompt = `${this.availableBots.text} Mejora la siguiente descripción de proyecto transmedia haciéndola más atractiva y profesional (máximo 200 palabras): "${currentDescription}". Responde SOLO con la descripción mejorada, sin explicaciones adicionales.`;

                    return new Promise((resolve, reject) => {
                        if (!window.Poe || !window.Poe.sendUserMessage) {
                            this.isGenerating = false;
                            reject(new Error('Poe API no disponible'));
                            return;
                        }

                        window.Poe.registerHandler('tooc-enhance-handler', (result) => {
                            try {
                                const msg = result.responses[0];

                                if (msg.status === 'error') {
                                    this.isGenerating = false;
                                    reject(new Error(msg.statusText || 'Error al mejorar descripción'));
                                } else if (msg.status === 'complete') {
                                    this.isGenerating = false;
                                    resolve(msg.content.trim());
                                }
                            } catch (error) {
                                this.isGenerating = false;
                                reject(error);
                            }
                        });

                        window.Poe.sendUserMessage(prompt, {
                            handler: 'tooc-enhance-handler',
                            stream: false,
                            openChat: false
                        }).catch(error => {
                            this.isGenerating = false;
                            reject(error);
                        });
                    });

                } catch (error) {
                    console.error('Error al mejorar descripción:', error);
                    this.isGenerating = false;
                    return currentDescription;
                }
            }

            // Parser para respuestas JSON de IA con manejo robusto de errores
            parseAIResponse(content) {
                try {
                    // Intentar extraer JSON de la respuesta
                    let jsonStr = content.trim();

                    // Eliminar markdown code blocks si existen
                    jsonStr = jsonStr.replace(/```json\n?/g, '').replace(/```\n?/g, '');

                    // Intentar parsear JSON
                    const parsed = JSON.parse(jsonStr);

                    // Validar que sea un array
                    if (Array.isArray(parsed)) {
                        return parsed;
                    } else if (typeof parsed === 'object') {
                        return [parsed];
                    }

                    return [];
                } catch (error) {
                    console.error('Error al parsear respuesta de IA:', error);
                    console.log('Contenido recibido:', content);
                    return [];
                }
            }

            // Verifica si hay una generación en progreso
            isGeneratingContent() {
                return this.isGenerating;
            }

            // Cancela generación en progreso (si es posible)
            cancelGeneration() {
                try {
                    this.isGenerating = false;
                    return true;
                } catch (error) {
                    console.error('Error al cancelar generación:', error);
                    return false;
                }
            }
        }

        class TOOCExporter {
            constructor() {
                this.supportedFormats = ['json', 'csv', 'pdf', 'html'];
            }

            // Exporta proyecto a JSON
            exportToJSON(project) {
                try {
                    if (!project) {
                        throw new Error('Proyecto no válido para exportar');
                    }

                    const jsonStr = JSON.stringify(project, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);

                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `${this.sanitizeFilename(project.title || 'proyecto')}_tooc.json`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    return true;
                } catch (error) {
                    console.error('Error al exportar a JSON:', error);
                    return false;
                }
            }

            // Exporta proyecto a CSV
            exportToCSV(project) {

                    }

                    let csv = 'Título,Descripci��n,Tipo,Plataforma,Duración\n';

                            this.escapeCSV(content.type || ''),
                            this.escapeCSV(content.platform || ''),
                            this.escapeCSV(content.duration || '')
                        ];
                        csv += row.join(',') + '\n';
                    });

                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);

                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `${this.sanitizeFilename(project.title || 'proyecto')}_contenidos.csv`;

            formatMarkdown(content) {
                // Simple markdown formatter (mejor usar una librería como marked.js en producción)
                let formatted = content;

                // Headers
                formatted = formatted.replace(/^### (.*$)/gim, '<h3 class="text-xl font-bold mt-6 mb-3">$1</h3>');
                formatted = formatted.replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold mt-8 mb-4">$1</h2>');
                formatted = formatted.replace(/^# (.*$)/gim, '<h1 class="text-3xl font-bold mt-8 mb-4">$1</h1>');

                // Bold
                formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                // Lists
                formatted = formatted.replace(/^\- (.*$)/gim, '<li class="ml-4">$1</li>');
                formatted = formatted.replace(/(<li.*<\/li>)/s, '<ul class="list-disc ml-6 space-y-1">$1</ul>');

                // Line breaks
                formatted = formatted.replace(/\n/g, '<br>');

                return formatted;
            }

                }

                // Handler para generación de configuración de AVIA
                this.poeManager.registerHandler(

                    (result, context) => this.handleAVIAGeneration(result, context),
                    'aviaCreator'
                );
            }

            handleAVIAGeneration(result, context) {
                const msg = result.responses[0];
                const outputContainer = document.getElementById('aviaOutputContainer');

                if (!outputContainer) return;

                if (msg.status === 'error') {
                    outputContainer.innerHTML = window.PoeUI.ErrorDisplay(
                        msg.statusText || 'Error al generar configuración del agente AVIA',
                        null
                    ) + window.PoeUI.RetryButton('app.modules.aviaCreator.showCreate()');

                } else if (msg.status === 'incomplete') {
                    outputContainer.innerHTML = window.PoeUI.StreamingContainer(msg.content, false);
                    this.generatedConfig = msg.content;

                } else if (msg.status === 'complete') {
                    this.generatedConfig = msg.content;
                    this.showResultsView();
                }
            }

            formatMarkdown(content) {
                let formatted = content;
                formatted = formatted.replace(/^### (.*$)/gim, '<h3 class="text-xl font-bold mt-6 mb-3">$1</h3>');
                formatted = formatted.replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold mt-8 mb-4">$1</h2>');
                formatted = formatted.replace(/^# (.*$)/gim, '<h1 class="text-3xl font-bold mt-8 mb-4">$1</h1>');
                formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                formatted = formatted.replace(/`([^`]+)`/g, '<code class="bg-gray-200 dark:bg-gray-700 px-1 rounded">$1</code>');
                formatted = formatted.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre class="bg-gray-900 text-green-400 p-4 rounded-lg overflow-x-auto my-4"><code>$2</code></pre>');
                formatted = formatted.replace(/^\- (.*$)/gim, '<li class="ml-4">$1</li>');
                formatted = formatted.replace(/\n/g, '<br>');
                return formatted;
            }

            downloadConfig() {
                const blob = new Blob([this.generatedConfig], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${this.currentAVIA.name.replace(/\s+/g, '-')}-config.md`;
                a.click();
                URL.revokeObjectURL(url);

                    }
                });
            }

            destroy() {
                this.poeManager?.cleanupModule('aviaCreator');
            }
        }

                if (this.activeRowIndex < this.categoryKeys.length - 1) {

                    this.scrollToActiveRow();

                        }
                    } else {
                        scrollUpBtn.classList.add('hidden');
                    }

                    if (!hasMoreRows) {
                        scrollDownBtn.style.setProperty('opacity', '0', 'important');

                            scrollDownBtn.style.setProperty('opacity', '1.0', 'important');
                            console.log('⚫ Scroll DOWN ACTIVO');

                        const hasWhiteHorizontalBtn = hasPrevPage;  // Botón "−" horizontal

            renderPage() {
                const grid = document.getElementById('mainModulesGrid');
                if (!grid) {
                    console.error('⚠️ ERROR: No se encontró el elemento #mainModulesGrid');
                    return;
                }

                // Validar que this.rows existe
                if (!this.rows || this.rows.length === 0) {
                    console.error('⚠️ ERROR: No hay filas de módulos disponibles');
                    grid.innerHTML = '<div class="col-span-2 text-center text-gray-500">No hay módulos disponibles</div>';
                    return;
                }

                // Mostrar SIEMPRE 2 filas (4 espacios en total)
                const visibleRows = this.rows.slice(this.currentRowIndex, this.currentRowIndex + 2);
                const visibleModules = visibleRows.flat().filter(Boolean); // Convierte [[a,b], [c,d]] en [a,b,c,d] y elimina undefined

                const colorClasses = {
                    red: { bg: 'bg-red-500/50 dark:bg-red-600/60', border: 'border-red-600', button: 'bg-red-600 hover:bg-red-700' },
                    green: { bg: 'bg-green-500/50 dark:bg-green-600/60', border: 'border-green-600', button: 'bg-green-600 hover:bg-green-700' },
                    yellow: { bg: 'bg-yellow-500/50 dark:bg-yellow-600/60', border: 'border-yellow-600', button: 'bg-yellow-600 hover:bg-yellow-700' },
                    blue: { bg: 'bg-blue-500/50 dark:bg-blue-600/60', border: 'border-blue-600', button: 'bg-blue-600 hover:bg-blue-700' }
                };

                // Crear array de 4 espacios, rellenando con null los huecos vacíos
                const slots = [];
                for (let i = 0; i < 4; i++) {
                    slots.push(visibleModules[i] || null);
                }

                grid.innerHTML = slots.map((module, index) => {
                    if (!module) {
                        // Espacio vacío invisible (mantiene la estructura del grid)
                        return `<div class="invisible pointer-events-none" aria-hidden="true"></div>`;
                    }

                    const colors = colorClasses[module.color] || colorClasses.blue; // Fallback a azul si no existe el color
                    const backgroundImage = this.getBackgroundImage(module.color);
                    return `
                        <div onclick="app.showModule('${module.id}')"
                             onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); app.showModule('${module.id}'); }"
                             tabindex="0"
                             role="button"
                             aria-label="Abrir ${module.title}"
                             class="module-card default-active ${colors.bg} rounded-2xl shadow-2xl overflow-hidden border-l-[16px] ${colors.border} fade-in cursor-pointer hover:scale-105 focus:scale-105 focus:outline-none focus:ring-2 focus:ring-${module.color}-600 focus:ring-offset-2 transition-transform duration-300"
                             style="background-image: linear-gradient(to right, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.75) 100%), url('${backgroundImage}'); background-size: cover; background-position: center; background-blend-mode: lighten;">
                            <div class="p-8 h-full flex flex-col justify-center" style="background: transparent;">
                                <div class="flex items-center gap-4">
                                    <svg class="w-24 h-24 always-visible" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                        ${module.icon}
                                    </svg>
                                    <div class="flex-1">
                                        <h3 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">${module.title}</h3>
                                        <p class="text-gray-600 dark:text-gray-400 text-base">${module.description}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                console.log(`📜 SCROLL: Mostrando filas ${this.currentRowIndex} y ${this.currentRowIndex + 1}`);
                console.log(`   Módulos visibles: ${visibleModules.map(m => m.title).join(', ')}`);
                console.log(`   Total de espacios: 4, Módulos reales: ${visibleModules.length}`);
            }

            nextPage() {
                // SCROLL VERTICAL: Avanzar DOS filas (desaparecen 4 cards, aparecen 4 siguientes)
                const maxRowIndex = this.rows.length - 2; // -2 porque siempre mostramos 2 filas
                if (this.currentRowIndex < maxRowIndex) {
                    // Avanzar de 2 en 2 filas (4 cards)
                    this.currentRowIndex = Math.min(this.currentRowIndex + 2, maxRowIndex);
                    console.log(`⬇️  SCROLL DOWN: Avanzando 2 filas a índice ${this.currentRowIndex}`);
                    this.renderPage();
                    this.updateMenuNavIcon();
                    this.updatePageDots();
                } else {
                    console.log(`���️  Ya estás en la última página (fila ${this.currentRowIndex})`);
                }
            }

            previousPage() {
                // SCROLL VERTICAL: Retroceder DOS filas (desaparecen 4 cards, aparecen 4 anteriores)
                if (this.currentRowIndex > 0) {
                    // Retroceder de 2 en 2 filas (4 cards)
                    this.currentRowIndex = Math.max(this.currentRowIndex - 2, 0);
                    console.log(`⬆️  SCROLL UP: Retrocediendo 2 filas a índice ${this.currentRowIndex}`);
                    this.renderPage();
                    this.updateMenuNavIcon();
                    this.updatePageDots();
                } else {
                    console.log(`⚠️  Ya estás en la primera página (fila 0)`);
                }
            }

            updateMenuNavIcon() {
                const scrollUpButton = document.getElementById('menuScrollUpButton');
                const scrollDownButton = document.getElementById('menuScrollDownButton');
                const scrollUpBackground = document.getElementById('menuScrollUpBackground');

                if (!scrollUpButton || !scrollDownButton) return;

                const maxRowIndex = this.rows.length - 2;

                // Mostrar/ocultar botón de scroll UP (blanco, arriba) + fondo superior
                if (this.currentRowIndex === 0) {
                    // En la primera página: ocultar botón UP y su fondo
                    scrollUpButton.classList.add('hidden');
                    if (scrollUpBackground) scrollUpBackground.classList.add('hidden');
                } else {
                    // No estamos en la primera página: mostrar botón UP y su fondo
                    scrollUpButton.classList.remove('hidden');
                    if (scrollUpBackground) scrollUpBackground.classList.remove('hidden');
                }

                // Mostrar/ocultar botón de scroll DOWN (negro, abajo) - sin fondo
                if (this.currentRowIndex >= maxRowIndex) {
                    // En la última página: ocultar botón DOWN
                    scrollDownButton.classList.add('hidden');
                } else {
                    // No estamos en la última página: mostrar botón DOWN
                    scrollDownButton.classList.remove('hidden');
                }

                console.log(`🔼🔽 Botones scroll - UP: ${this.currentRowIndex > 0 ? 'visible' : 'oculto'}, DOWN: ${this.currentRowIndex < maxRowIndex ? 'visible' : 'oculto'}`);
            }

            updatePageDots() {
                const dotsContainer = document.getElementById('menuPageDots');
                if (!dotsContainer) return;

                // Número de dots = número de filas (cada dot representa una fila)
                const totalRows = this.rows.length;

                // Generar dots dinámicamente
                dotsContainer.innerHTML = Array.from({ length: totalRows }, (_, index) => {
                    const isActive = index === this.currentRowIndex;
                    const activeClass = isActive
                        ? 'w-3 h-3 rounded-full bg-black dark:bg-white transition-all'
                        : 'w-3 h-3 rounded-full bg-gray-400 dark:bg-gray-600 transition-all';
                    return `<div class="${activeClass}"></div>`;
                }).join('');
            }

            init() {
                // Renderizar la página inicial
                this.renderPage();
                this.updateMenuNavIcon();
                this.updatePageDots();
                this.isInitialized = true;

                // Agregar soporte para scroll con rueda del ratón
                this.initMouseWheelScroll();
            }

            initMouseWheelScroll() {
                // Detectar si estamos en el menú principal
                const mainMenu = document.getElementById('mainMenu');
                if (!mainMenu) return;

                let isScrolling = false;
                let scrollTimeout;

                mainMenu.addEventListener('wheel', (event) => {
                    // Solo procesar scroll si estamos en el menú principal (visible)
                    if (mainMenu.classList.contains('hidden')) return;

                    // Prevenir scroll nativo del navegador
                    event.preventDefault();

                    // Debounce: evitar múltiples scrolls rápidos
                    if (isScrolling) return;

                    const delta = event.deltaY;

                    if (delta > 0) {
                        // Scroll hacia ABAJO → nextPage()
                        console.log('🖱️  Scroll DOWN detectado con ratón');
                        this.nextPage();
                    } else if (delta < 0) {
                        // Scroll hacia ARRIBA → previousPage()
                        console.log('🖱️  Scroll UP detectado con ratón');
                        this.previousPage();
                    }

                    // Activar debounce (evitar scroll muy rápido)
                    isScrolling = true;
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        isScrolling = false;
                    }, 500); // 500ms de delay entre scrolls
                }, { passive: false }); // passive: false permite preventDefault()

                console.log('✅ Scroll con rueda del ratón habilitado en menú principal');
            }
        }

             *             <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12
             *                      5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
             *         </svg>
             *     </button>
             *     <span class="text-xs font-medium text-gray-800 dark:text-gray-200">Cerrar</span>
             * </div>
             *
             * CONSISTENCIA VISUAL:
             * - Botón negro (acción) siempre a la izquierda
             * - Botón blanco (cerrar) siempre a la derecha
             * - Texto descriptivo debajo de cada botón
             * - Espaciado de 16px entre botones (right-4 y right-20)
             * - Ambos botones a 16px del top (top-4)
             *
             * PROHIBIDO:
             * - NO usar otros colores para botones de acción (solo negro)
             * - NO usar otros colores para botones de cerrar (solo blanco)
             * - NO omitir el texto descriptivo debajo de los botones
             * - NO usar botones cuadrados (siempre circulares)
             * - NO cambiar el tamaño estándar (48x48 px)
             *
             * APLICACIÓN UNIVERSAL:
             * Esta regla se aplica a TODAS las ventanas modales en todo el sistema.
             *
             * ============================================
             * REGLA UNIVERSAL 9: FORMAS Y DIRECCIONES DE BOTONES NEGRO Y BLANCO
             * ============================================
             *
             * LIBRO BLANCO DE SIESTAOTT POE 2.2 - REGLA 9
             *
             * PRINCIPIO FUNDAMENTAL:
             * - ⚫ BOTÓN NEGRO: SOLO adelante / abajo / derecha / siguiente
             * - ⚪ BOTÓN BLANCO: SOLO atrás / arriba / izquierda / anterior / cerrar
             *
             * TODOS los botones triangulares deben seguir esta convención:
             *
             * 1. TRIÁNGULO VERTICAL NEGRO (▼ vértice abajo):
             *    - Color: NEGRO (#1a1a1a)
             *    - Símbolo: ↓ (flecha abajo blanca)
             *    - Función: Scroll HACIA ABAJO o Avanzar/Siguiente página
             *    - CSS: border-top: solid #1a1a1a (triángulo apunta abajo)
             *    - Uso: Menú principal, Analytics, ConfigView scroll down
             *
             * 2. TRIÁNGULO VERTICAL BLANCO (▲ vértice arriba):
             *    - Color: BLANCO (white)
             *    - Símbolo: ↑ (flecha arriba negra)
             *    - Función: Scroll HACIA ARRIBA o Retroceder/Página anterior
             *    - CSS: border-bottom: solid white (triángulo apunta arriba)
             *    - Uso: ConfigView scroll up, Analytics página anterior
             *
             * 3. TRIÁNGULO HORIZONTAL NEGRO (► vértice derecha):
             *    - Color: NEGRO (#1a1a1a)
             *    - Símbolo: + (más blanco)
             *    - Función: Mostrar las 4 SIGUIENTES subcategorías/elementos
             *    - CSS: border-left: solid #1a1a1a (triángulo apunta derecha)
             *    - Uso: ConfigView categorías (siguiente página), Calendario
             *
             * 4. TRIÁNGULO HORIZONTAL BLANCO (◄ vértice izquierda):
             *    - Color: BLANCO (white)
             *    - Símbolo: − (menos negro)
             *    - Función: Mostrar las 4 ANTERIORES subcategorías/elementos
             *    - CSS: border-right: solid white (triángulo apunta izquierda)
             *    - Uso: ConfigView categorías (página anterior)
             *
             * REGLA CRÍTICA:
             * - Triángulos VERTICALES usan FLECHAS: ↓ (negro) y ↑ (blanco)
             * - Triángulos HORIZONTALES usan SÍMBOLOS: + (negro) y − (blanco)
             *
             * COMPORTAMIENTO DE BOTONES INACTIVOS (repaso):
             * - Estado inactivo: opacity-30
             * - Al hover: opacity-100 + scale-110
             * - Al focus: opacity-100
             * - Ejecución: Un solo click + tecla Enter
             * - tabindex="0" para accesibilidad
             *
             * CÓDIGO DE EJEMPLO:
             *
             * <!-- Triángulo NEGRO vertical (▼) - REGLA 9: Flecha ↓ scroll down -->
             * <button onclick="scrollDown()"
             *         onkeydown="if(event.key === 'Enter') { scrollDown(); }"
             *         class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50
             *                hover:scale-110 transition-all"
             *         style="width: 0; height: 0;
             *                border-left: 50px solid transparent;
             *                border-right: 50px solid transparent;
             *                border-top: 80px solid #1a1a1a;
             *                filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));"
             *         tabindex="0">
             *     <div class="absolute left-1/2 -translate-x-1/2 -translate-y-1/2"
             *          style="top: -55px;">
             *         <span class="text-4xl text-white font-bold">↓</span>
             *     </div>
             * </button>
             *
             * <!-- Triángulo BLANCO vertical (▲) - REGLA 9: Flecha ↑ scroll up -->
             * <button onclick="scrollUp()"
             *         class="fixed top-6 left-1/2 -translate-x-1/2 z-50
             *                hover:scale-110 transition-all"
             *         style="width: 0; height: 0;
             *                border-left: 50px solid transparent;
             *                border-right: 50px solid transparent;
             *                border-bottom: 80px solid white;
             *                filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">
             *     <div class="absolute left-1/2 -translate-x-1/2" style="top: 45px;">
             *         <span class="text-4xl text-black font-bold">↑</span>
             *     </div>
             * </button>
             *
             * <!-- Triángulo NEGRO horizontal (►) - REGLA 9: Símbolo + siguiente página -->
             * <button onclick="nextPage()"
             *         style="width: 0; height: 0;
             *                border-top: 30px solid transparent;
             *                border-bottom: 30px solid transparent;
             *                border-left: 45px solid #1a1a1a;">
             *     <div class="absolute right-1/2 top-1/2" style="right: 31px;">
             *         <span class="text-3xl text-white font-bold">+</span>
             *     </div>
             * </button>
             *
             * <!-- Triángulo BLANCO horizontal (◄) - REGLA 9: Símbolo − página anterior -->
             * <button onclick="previousPage()"
             *         style="width: 0; height: 0;
             *                border-top: 30px solid transparent;
             *                border-bottom: 30px solid transparent;
             *                border-right: 45px solid white;">
             *     <div class="absolute left-1/2 top-1/2" style="left: 31px;">
             *         <span class="text-3xl text-black font-bold">−</span>
             *     </div>
             * </button>
             *
             * CONVENCIÓN DE ICONOS:
             * - NEGRO = + (avanzar, siguiente, abajo, derecha)
             * - BLANCO = − (retroceder, anterior, arriba, izquierda)
             *
             * CONSISTENCIA UNIVERSAL:
             * - La forma + color determinan la función
             * - Usuario puede identificar la acción visualmente
             * - Mismo comportamiento en todas las pantallas
             * - NO cambiar esta convención bajo ninguna circunstancia
             *
             * PROHIBIDO:
             * - NO usar triángulo negro para retroceder
             * - NO usar triángulo blanco para avanzar
             * - NO cambiar la convención de iconos (+ y −)
             * - NO usar otros colores en botones triangulares
             * - NO usar formas triangulares para otras funciones
             *
             * APLICACIÓN UNIVERSAL:
             * Esta regla se aplica en TODAS las pantallas:
             * - Menú principal
             * - Vista de aplicaciones
             * - Vista de configuración
             * - Analytics
             * - Calendar
             * - Cualquier componente con navegación
             *
             * ============================================
             * REGLA UNIVERSAL DE BOTONES NARANJA Y MORADO
             * ============================================
             *
             * IMPORTANTE: Gestión de visibilidad de botones principales según
             * la cantidad de zonas pulsables en pantalla.
             *
             * REGLA DE ACTIVACIÓN:
             *
             * Si una pantalla tiene MÁS DE 7 zonas pulsables (botones, enlaces, etc.):
             * - Solo UNO de los dos botones puede estar activo
             * - Por defecto: El botón MORADO (AVIA) está ACTIVO
             * - El botón NARANJA (Configuración) está INACTIVO (opacity-30)
             *
             * Si una pantalla tiene 7 o MENOS zonas pulsables:
             * - Ambos botones pueden estar activos simultáneamente
             *
             * BOTÓN NARANJA (Configuración):
             * - Posición: fixed bottom-6 left-6
             * - Tamaño: w-24 h-24 (96x96 px)
             * - Color activo: bg-orange-500
             * - Color inactivo: bg-orange-500/30 (opacidad 30%)
             * - Función: app.showConfig()
             * - Comportamiento inactivo: hover:bg-orange-500 (se activa al hover)
             *
             * BOTÓN MORADO (AVIA):
             * - Posición: fixed bottom-6 right-6
             * - Tamaño: 96x96 px
             * - Color: #c4b5fd (morado/purple)
             * - Siempre visible por defecto
             * - Función: Abrir asistente AVIA
             * - Logo oficial AVIA como contenido
             *
             * IMPLEMENTACIÓN:
             *
             * <!-- Pantalla con MÁS de 7 zonas pulsables -->
             * <!-- Botón Naranja INACTIVO -->
             * <button onclick="app.showConfig()"
             *         onkeydown="if(event.key === 'Enter') { app.showConfig(); }"
             *         class="fixed bottom-6 left-6 w-24 h-24
             *                bg-orange-500/30 hover:bg-orange-500 hover:scale-110
             *                transition-all focus:bg-orange-500 focus:outline-none"
             *         tabindex="0"
             *         title="Click o Enter para abrir configuración">
             *     <svg class="w-14 h-14 fill-white">...</svg>
             * </button>
             *
             * <!-- Botón AVIA ACTIVO -->
             * <button onclick="openAVIA()"
             *         class="fixed bottom-6 right-6 w-24 h-24
             *                rounded-2xl transition-all hover:scale-110"
             *         style="background: #c4b5fd;">
             *     <img src="..." alt="AVIA">
             * </button>
             *
             * PRIORIDAD:
             * 1. AVIA (morado) tiene prioridad por defecto
             * 2. Configuración (naranja) se activa solo cuando hay pocas zonas pulsables
             * 3. En pantallas complejas, Configuración requiere hover para activarse
             *
             * JUSTIFICACIÓN:
             * - Reduce saturación visual en pantallas complejas
             * - AVIA es asistente principal, siempre accesible
             * - Configuración es función secundaria, accesible con hover
             * - Mejora UX al reducir distracciones
             *
             * ============================================
             * REGLA UNIVERSAL DE SCROLL CON BOTONES TRIANGULARES
             * ============================================
             *
             * IMPORTANTE: Comportamiento de botones de scroll en pantallas largas.
             *
             * BOTÓN SCROLL DOWN (Triángulo Negro ⬇️):
             * - Posición inicial: Visible con opacity-30 (inactivo)
             * - Al hover: opacity-100 (se activa)
             * - Al click: Hace scroll hacia abajo
             * - Función: scrollBy({top: 400, behavior: 'smooth'})
             *
             * BOTÓN SCROLL UP (Triángulo Blanco ⬆️):
             * - Posición: top-6 left-1/2 (centrado superior)
             * - Estado inicial: OCULTO (hidden)
             * - Se muestra cuando: scrollTop > 200px
             * - Se oculta cuando: scrollTop <= 200px
             * - Función: scrollTo({top: 0, behavior: 'smooth'})
             *
             * COMPORTAMIENTO DINÁMICO:
             *
             * 1. Usuario en la parte SUPERIOR de la página:
             *    - Botón DOWN: Visible (opacity-30, se activa con hover)
             *    - Botón UP: OCULTO
             *
             * 2. Usuario hace SCROLL HACIA ABAJO (scrollTop > 200px):
             *    - Botón DOWN: Puede permanecer o ocultarse según diseño
             *    - Botón UP: APARECE (para volver arriba)
             *
             * 3. Usuario hace SCROLL HACIA ARRIBA (scrollTop <= 200px):
             *    - Botón DOWN: Visible
             *    - Botón UP: OCULTA
             *
             * IMPLEMENTACIÓN CON JAVASCRIPT:
             *
             * // Listener de scroll
             * const container = document.getElementById('configView');
             * const scrollUpBtn = document.getElementById('scrollUpBtn');
             *
             * container.addEventListener('scroll', () => {
             *     if (container.scrollTop > 200) {
             *         scrollUpBtn.classList.remove('hidden');
             *     } else {
             *         scrollUpBtn.classList.add('hidden');
             *     }
             * });
             *
             * APLICACIÓN:
             * - ConfigView (vista de configuración)
             * - Cualquier pantalla con contenido largo y scroll
             * - Analytics con múltiples páginas
             * - TOOCGenerator con contenido extenso
             *
             * CONSISTENCIA:
             * - Botón DOWN siempre negro con + (avanzar/bajar)
             * - Botón UP siempre blanco con − (retroceder/subir)
             * - Aparición/desaparición suave con transiciones
             * - Umbral de 200px para activación consistente
             *
             * ============================================
             * REGLA UNIVERSAL DE BOTONES EN MODALES (LEGACY)
             * ============================================
             *
             * TODAS las ventanas modales finales de información deben seguir este patrón:
             *
             * BOTONES EN ESQUINA SUPERIOR DERECHA (siempre):
             *
             * 1. BOTÓN DE ACCIÓN (izquierda, cuando sea necesario):
             *    - Posición: absolute top-4 right-20 (a la izquierda del botón cerrar)
             *    - Tamaño: w-12 h-12 (48x48px)
             *    - Color: bg-black (negro)
             *    - Icono: blanco (✓ check, + plus, o ↵ enter según contexto)
             *    - Hover: escala 1.1
             *    - Sombra VOLUMÉTRICA: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *    - Ejemplos de iconos: Guardar (✓), Nuevo (➕), Añadir (+), Confirmar (✓)
             *
             * 2. BOTÓN DE CERRAR (derecha, siempre presente):
             *    - Posición: absolute top-4 right-4
             *    - Tamaño: w-12 h-12 (48x48px)
             *    - Color: bg-white (blanco)
             *    - Icono: X negro
             *    - Hover: escala 1.1
             *    - Sombra VOLUMÉTRICA: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *
             * IMPORTANTE:
             * - TODOS los botones deben tener sombras volumétricas para crear sensación de profundidad
             * - Los botones SIEMPRE van en la esquina superior derecha
             * - NO poner botones en el footer de los modales
             * - El botón negro de acción va a la IZQUIERDA del botón blanco de cerrar
             *
             * ESTRUCTURA HTML:
             * <!-- Botón de acción (opcional) -->
             * <button class="action-btn absolute top-4 right-20 w-12 h-12 bg-black rounded-full..."
             *         style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);">
             *     <svg>icono</svg>
             * </button>
             * <!-- Botón de cerrar (obligatorio) -->
             * <button class="close-btn absolute top-4 right-4 w-12 h-12 bg-white rounded-full..."
             *         style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);">
             *     <svg>X</svg>
             * </button>
             *
             * ============================================
             * REGLA UNIVERSAL DE POSICIONAMIENTO DE BOTONES
             * ============================================
             *
             * TODOS los botones deben ser FLOTANTES con sombras volumétricas y aparecer
             * en posiciones consistentes según su forma y función:
             *
             * 1. BOTONES REDONDOS (Acciones Primarias):
             *    Posición: ESQUINA SUPERIOR DERECHA
             *    - Botón de Acción Principal (negro): absolute top-4 right-20
             *    - Botón de Cerrar (blanco): absolute top-4 right-4
             *    - Tamaño: w-12 h-12 (48x48px)
             *    - Sombra: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *    - Ejemplos: X (cerrar), ✓ (confirmar), + (añadir)
             *
             * 2. BOTONES CUADRADOS (Navegación y Grid):
             *    Posición: ESQUINAS INFERIORES
             *    - Botón Inferior Izquierda: absolute bottom-6 left-6
             *    - Botón Inferior Derecha: absolute bottom-6 right-6
             *    - Tamaño: w-16 h-16 a w-24 h-24 (según importancia)
             *    - Sombra: 0 6px 10px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *    - Ejemplos: ⚙️ (config), 📊 (stats), 🏠 (home)
             *
             * 3. BOTONES TRIANGULARES (Navegación Direccional):
             *    Posición: CENTRADOS EN BORDES LATERALES
             *    - Botón Izquierda: absolute top-1/2 left-4 -translate-y-1/2
             *    - Botón Derecha: absolute top-1/2 right-4 -translate-y-1/2
             *    - Tamaño: w-12 h-12 (48x48px)
             *    - Sombra: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *    - Ejemplos: ◀ (anterior), ▶ (siguiente)
             *
             * MAPA DE POSICIONES ESTÁNDAR:
             *
             *     [Botón Acción Negro]  [Botón Cerrar Blanco]
             *              ↑                    ↑
             *         (top-4, right-20)   (top-4, right-4)
             *
             * [◀ Anterior]                           [Siguiente ▶]
             *      ↑                                      ↑
             * (top-1/2, left-4)                  (top-1/2, right-4)
             *
             * [⚙️ Config]                            [📊 Stats]
             *      ↑                                      ↑
             * (bottom-6, left-6)                 (bottom-6, right-6)
             *
             * REGLAS CRÍTICAS:
             * ✅ SIEMPRE usar position: absolute o fixed
             * ✅ SIEMPRE incluir sombras volumétricas
             * ✅ SIEMPRE usar transition-all hover:scale-110
             * ✅ RESPETAR las posiciones estándar según forma del botón
             * ✖️ NUNCA poner botones en footers o áreas de contenido
             * ✖️ NUNCA solapar botones en la misma posición
             *
             * ============================================
             */
            showModule(moduleName) {
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('appView').classList.remove('hidden');

                const module = this.modules[moduleName];
                if (module) {
                    // Crear el header SiestaOTT unificado con toda la información
                    const colorMap = {
                        'red': 'bg-red-500',
                        'green': 'bg-green-500',
                        'yellow': 'bg-yellow-500',
                        'blue': 'bg-blue-500',
                        'orange': 'bg-orange-500',
                        'purple': 'bg-purple-500',
                        'gray': 'bg-gray-500',
                        'pink': 'bg-pink-500'
                    };

                    const bgColor = colorMap[module.color] || 'bg-gray-500';

                    // Modificar el contenedor padre para eliminar padding y permitir borde en extremo izquierdo
                    const headerParent = document.querySelector('#appView > div:first-child > div');
                    headerParent.className = 'flex items-center w-full';
                    headerParent.style.padding = '0';
                    headerParent.style.height = '80px';

                    // Determinar si el módulo necesita botón de acción
                    const actionButtons = {
                        'notes': { onclick: 'notes.createNote()', icon: '+', label: 'Nueva Nota' },
                        'tasks': { onclick: 'tasks.addTask()', icon: '+', label: 'Nueva Tarea' },
                        'calendar': { onclick: 'calendar.showAddEventForm()', icon: '+', label: 'Nuevo Evento' }
                    };

                    const actionBtn = actionButtons[moduleName];

                    // Reemplazar todo el contenido del header
                    headerParent.innerHTML = `
                        <!-- Barra vertical de color en extremo izquierdo (estándar SiestaOTT) -->
                        <div class="${bgColor}" style="width: 6px; height: 100%; border-radius: 12px 0 0 12px; flex-shrink: 0;"></div>

                        <!-- Contenido: Icono + Título/Descripción -->
                        <div class="flex items-center gap-4 flex-1 px-6">
                            <!-- Icono del módulo -->
                            <span class="text-5xl" style="line-height: 1;">${module.icon}</span>

                            <!-- Título y Descripción -->
                            <div class="flex-1">
                                <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-1">${module.title}</h2>
                                <p class="text-sm text-gray-600 dark:text-gray-400">${module.description}</p>
                            </div>
                        </div>

                        ${actionBtn ? `
                        <!-- Botón de Acción (Negro) flotante superior derecha - REGLA 3: SIEMPRE ACTIVO -->
                        <button onclick="${actionBtn.onclick}" class="always-active-button w-12 h-12 bg-black hover:bg-gray-800 dark:hover:bg-gray-900 rounded-full flex items-center justify-center transition-all hover:scale-110 flex-shrink-0 mr-4" style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);" title="${actionBtn.label}">
                            <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        </button>
                        ` : ''}

                        <!-- Botón VOLVER (X) en extremo derecho - REGLA 3: SIEMPRE ACTIVO -->
                        <button onclick="app.showMenu()" class="always-active-button w-12 h-12 bg-white hover:bg-gray-100 dark:bg-gray-700 dark:hover:bg-gray-600 rounded-full flex items-center justify-center transition-all hover:scale-110 flex-shrink-0 mr-6" style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);" title="Volver">
                            <svg class="w-6 h-6 fill-gray-800 dark:fill-gray-200" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        </button>
                    `;

                    const content = document.getElementById('appContent');
                    content.innerHTML = '';

                    // Ajustar scroll según el módulo
                    if (moduleName === 'calendar' || moduleName === 'analytics' || moduleName === 'ecosistema') {
                        // Calendario, Analytics y Ecosistema sin scroll - todo visible en pantalla
                        content.className = 'container mx-auto px-4 py-4 h-[calc(100vh-120px)] overflow-hidden';
                    } else {
                        // Otros módulos con scroll
                        content.className = 'container mx-auto px-4 py-4 overflow-y-auto';
                    }

                    module.render(content);
                    this.currentModule = moduleName;

                    // Registrar módulos globalmente para uso en onclick
                    if (moduleName === 'toocGenerator') {
                        window.toocModule = module;
                    }
                }
            }

            saveData() {
                showCustomAlert('Datos guardados correctamente ✓');
            }

            showConfig() {
                // Ocultar menú principal y mostrar vista de configuración
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('appView').classList.add('hidden');

                // Crear vista de configuración si no existe
                let configView = document.getElementById('configView');
                if (!configView) {
                    configView = document.createElement('div');
                    configView.id = 'configView';
                    // REGLA 4: Fondo más oscuro para mejor contraste de botones blancos y negros
                    configView.className = 'min-h-screen bg-gradient-to-br from-gray-200 to-gray-300 dark:from-gray-900 dark:to-gray-950 overflow-y-auto';
                    configView.style.height = '100vh';
                    document.body.appendChild(configView);
                }

                configView.classList.remove('hidden');
                configView.innerHTML = `
                    <!-- Header Informativo - Regla Universal del Libro Blanco -->
                    <header class="text-left px-8 py-6 fade-in">
                        <div class="flex items-center justify-between">

                                        <pre class="text-xs bg-gray-800 text-green-400 p-3 rounded overflow-x-auto mt-2"><code>configView.addEventListener('scroll', () => {{
    const scrollTop = configView.scrollTop;
    const scrollHeight = configView.scrollHeight;
    const clientHeight = configView.clientHeight;

    // Mostrar botón UP si hemos bajado más de 200px
    if (scrollTop > 200) {{
        scrollUpBtn.classList.remove('hidden');
    }} else {{
        scrollUpBtn.classList.add('hidden');
    }}

    // Ocultar botón DOWN si estamos cerca del final
    if (scrollTop + clientHeight >= scrollHeight - 100) {{
        scrollDownBtn.classList.add('opacity-0', 'pointer-events-none');
    }} else {{
        scrollDownBtn.classList.remove('opacity-0', 'pointer-events-none');
    }}
}});</code></pre>

        /**
         * SUBMÓDULO: Integración con Nanobanana para procesar icono AVIA
         * Flujo: Imagen original → Quitar fondo → Cambiar colores a blanco → Sombras REGLA 10
         * NO genera muñeco nuevo, solo cambia colores del original
         */
        const AVIAIconProcessor = {
            // Cache en memoria (no se puede usar localStorage en iframe)
            _cachedImageUrl: null,

            /**
             * Procesa el icono AVIA usando @Nanobanana en Poe
             * Paso 1: Quitar fondo
             * Paso 2: Cambiar morado y negro a blanco
             */
            async processIcon() {
                console.log('🌟 Procesando icono AVIA con @Nanobanana...');
                console.log('📋 Flujo: Quitar fondo → Cambiar colores morado/negro a blanco');

                // Verificar si Poe API está disponible
                if (!window.Poe || !window.Poe.sendUserMessage) {
                    console.error('❌ Poe Embed API no disponible');
                    return;
                }

                // Registrar handler para recibir imagen procesada
                if (!window.Poe._aviaIconProcessorRegistered) {
                    window.Poe.registerHandler("avia-icon-handler", this.handleProcessedResult.bind(this));
                    window.Poe._aviaIconProcessorRegistered = true;
                }

                try {
                    // Llamar a Nanobanana con comando combinado
                    await window.Poe.sendUserMessage(
                        "@Nanobanana remove the background and change all purple and black colors to white from this image: https://pfst.cf2.poecdn.net/base/image/8e17d58aa1d872f0c75dc9a68bebeda12fd116907538dc17928f3e3e497e0921?w=1024&h=1024",
                        {
                            handler: "avia-icon-handler",
                            stream: false,  // Bot de imagen, no streaming
                            openChat: false, // No abrir chat, procesar en background
                            handlerContext: { step: 'combined' }
                        }
                    );
                    console.log('✅ Solicitud enviada a @Nanobanana (comando combinado)');
                } catch (err) {
                    console.error('❌ Error llamando a @Nanobanana:', err);
                    this.showError('Error al procesar icono AVIA: ' + err.message);
                }
            },

            /**
             * Handler que recibe la imagen procesada de Nanobanana
             */
            handleProcessedResult(result, context) {
                const msg = result.responses[0];

                if (msg.status === "error") {
                    console.error('❌ Error procesando imagen:', msg.statusText);
                    this.showError('Error al procesar: ' + msg.statusText);
                    return;
                }

                if (msg.status === "incomplete") {
                    console.log('⏳ Procesando imagen...');
                    return;
                }

                if (msg.status === "complete") {
                    console.log('✅ Procesamiento completado');

                    // Buscar imagen como attachment
                    if (msg.attachments?.length > 0) {
                        // Buscar imagen PNG/JPEG procesada
                        const imageAttachment = msg.attachments.find(a =>
                            a.mimeType.includes('image/png') ||
                            a.mimeType.includes('image/jpeg') ||
                            a.mimeType.includes('image/webp')
                        );

                        if (imageAttachment) {
                            console.log('📎 Imagen procesada encontrada:', imageAttachment.url);
                            console.log('🎨 Aplicando al botón AVIA con sombras REGLA 10');
                            this.updateButton(imageAttachment.url);
                            return;
                        }
                    }

                    console.warn('⚠️ No se encontró imagen en la respuesta');
                    console.log('📝 Content recibido:', msg.content ? msg.content.substring(0, 200) : 'vacío');
                    this.showError('Nanobanana no devolvió una imagen válida');
                }
            },

            /**
             * Actualiza el botón AVIA con la imagen procesada (blanca) + sombras REGLA 10
             */
            updateButton(imageUrl) {
                const button = document.getElementById('menuAVIAButton');
                if (!button) {
                    console.error('❌ No se encontró botón #menuAVIAButton');
                    return;

                                display: block;
                                filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)) drop-shadow(0 1px 2px rgba(0,0,0,0.3));">
                `;

                console.log('✅ Botón AVIA actualizado con icono blanco + sombras REGLA 10');
                console.log('🎨 Muñeco original en blanco, texto AVIA original en blanco');

                // Guardar URL en caché
                this._cachedImageUrl = imageUrl;

                // Mostrar mensaje de éxito al usuario
                this.showSuccess('Icono AVIA actualizado correctamente');
            },

            /**
             * Muestra mensaje de error al usuario
             */
            showError(message) {

            showSuccess(message) {

        class AVIASelfModifier {
            constructor() {
                this.history = [];

                this.currentContext = this.gatherContext();
