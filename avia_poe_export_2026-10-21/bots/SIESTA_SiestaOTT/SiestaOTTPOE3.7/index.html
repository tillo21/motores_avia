            /**
             * Recopila información del estado actual de la aplicación
             * para proporcionar contexto al bot de IA
             */
            gatherContext() {
                const context = {
                    availableModules: [],
                    activeButtons: [],
                    currentScreen: 'menu',
                    timestamp: new Date().toISOString()
                };

                // Detectar módulos disponibles
                if (window.aviaAssistant) context.availableModules.push('AVIAAssistant');
                if (window.scriptGenerator) context.availableModules.push('ScriptGenerator');
                if (window.todoApp) context.availableModules.push('TODOApp');
                if (window.healthMonitor) context.availableModules.push('HealthMonitor');

                // Detectar botones visibles
                const menuButtons = document.querySelectorAll('#mainMenu button[id*="menu"]');
                menuButtons.forEach(btn => {
                    if (btn.offsetParent !== null) { // visible
                        context.activeButtons.push({
                            id: btn.id,
                            label: btn.getAttribute('aria-label') || btn.textContent.trim()
                        });
                    }
                });

                return context;
            }

            /**
             * Solicita a un bot de IA que genere código para modificar la app
             * @param {string} userCommand - Comando en lenguaje natural del usuario
             * @param {string} botHandle - Handle del bot a usar (default: @Claude-Sonnet-4.5)
             */
            async modifyApp(userCommand, botHandle = null) {
                if (this.isProcessing) {
                    this.showNotification('⏳ Ya hay una modificación en proceso. Espera un momento.', 'warning');
                    return;
                }

                // Si no se especifica bot, tomar del selector de la UI o usar default
                if (!botHandle) {
                    const botSelector = document.getElementById('botSelector');
                    botHandle = botSelector ? botSelector.value : '@Claude-Sonnet-4.5';
                }

                this.isProcessing = true;
                this.showNotification('🤖 Solicitando código a IA...', 'info');

                try {
                    // Actualizar contexto
                    this.currentContext = this.gatherContext();

                    // Construir prompt mejorado
                    const prompt = `${botHandle} Eres un experto en JavaScript y modificación dinámica de aplicaciones web.

**Comando del usuario:** "${userCommand}"

**Contexto de la aplicación:**
- Módulos disponibles: ${this.currentContext.availableModules.join(', ')}
- Botones activos: ${this.currentContext.activeButtons.map(b => b.id).join(', ')}
- Pantalla actual: ${this.currentContext.currentScreen}

**IDs importantes en el DOM:**
- Botón AVIA: #menuAVIAButton
- Menú principal: #mainMenu
- Contenedor de apps: #appContainer

**Tu tarea:**
1. Genera código JavaScript ejecutable que implemente el cambio solicitado
2. El código debe ser seguro y no romper la funcionalidad existente
3. Usa document.getElementById(), querySelector(), etc. según necesites
4. Puedes modificar estilos, clases, contenido, o ejecutar funciones

**IMPORTANTE:**
- Responde SOLO con código JavaScript puro y ejecutable
- NO uses markdown, NO uses \`\`\`javascript, NO añadas explicaciones
- El código debe ser una o más líneas ejecutables directamente con eval()
- Si necesitas múltiples líneas, sepáralas con punto y coma

**Ejemplo válido:**
document.getElementById('menuAVIAButton').style.background = '#9333ea'; document.getElementById('menuAVIAButton').style.transform = 'scale(1.2)';

Genera el código ahora:`;

                    await window.Poe.sendUserMessage(prompt, {
                        handler: 'self-modifier-handler',
                        stream: false,
                        openChat: false,
                        handlerContext: {

                        }
                    });

                } catch (error) {
                    this.isProcessing = false;
                    this.showNotification(`❌ Error: ${error.message}`, 'error');
                    console.error('AVIASelfModifier Error:', error);
                }
            }

            /**
             * Aplica el código generado por la IA
             * @param {string} code - Código JavaScript a ejecutar
             * @param {object} context - Contexto de la solicitud
             */
            applyCode(code, context = {}) {
                try {
                    // Limpiar markdown si viene
                    let cleanCode = code
                        .replace(/```javascript\n?/g, '')
                        .replace(/```js\n?/g, '')
                        .replace(/```\n?/g, '')
                        .trim();

                    // Remover comentarios de una línea
                    cleanCode = cleanCode.replace(/\/\/.*$/gm, '');

                    // Validación básica de seguridad
                    const dangerousPatterns = [
                        /document\.write/i,
                        /eval\(/i,
                        /Function\(/i,
                        /setTimeout.*eval/i,
                        /setInterval.*eval/i
                    ];

                    const hasDangerousCode = dangerousPatterns.some(pattern => pattern.test(cleanCode));
                    if (hasDangerousCode) {
                        throw new Error('Código rechazado: contiene patrones potencialmente peligrosos');
                    }

                    console.log('⚡ Ejecutando código generado por IA:', cleanCode);

                    // Ejecutar código
                    eval(cleanCode);

                    // Guardar en historial
                    this.addToHistory({
                        command: context.command || 'Comando desconocido',
                        code: cleanCode,
                        timestamp: new Date().toISOString(),
                        success: true
                    });

                    this.showNotification('✅ Modificación aplicada con éxito', 'success');
                    console.log('✅ Cambio aplicado exitosamente');

                } catch (error) {
                    this.addToHistory({
                        command: context.command || 'Comando desconocido',
                        code: code,
                        timestamp: new Date().toISOString(),
                        success: false,
                        error: error.message
                    });

                    this.showNotification(`❌ Error ejecutando código: ${error.message}`, 'error');
                    console.error('❌ Error aplicando código:', error);
                } finally {
                    this.isProcessing = false;
                }
            }

            /**
             * Agrega entrada al historial
             */
            addToHistory(entry) {
                this.history.unshift(entry);
                if (this.history.length > this.maxHistorySize) {
                    this.history.pop();
                }
                // Emitir evento
                window.aviaEventBus?.emit('self-modifier:change-applied', entry, 'AVIASelfModifier');
            }

            /**
             * Obtiene el historial de modificaciones
             */
            getHistory() {
                return [...this.history];
            }

            /**
             * Limpia el historial
             */
            clearHistory() {
                this.history = [];
                this.showNotification('🗑️ Historial limpiado', 'info');
            }

             * Muestra una notificación visual al usuario
             */

                notification.classList.add(colors[type] || colors.info);
                notification.textContent = message;

                // Agregar al DOM

                // Remover después de 4 segundos
                setTimeout(() => {
                    notification.style.transform = 'translateX(400px)';

        // MÓDULO 1: VOICE COMMAND MODULE
        // Sistema de reconocimiento de voz para comandos
        // ============================================

        class VoiceCommandModule {
            constructor() {
                this.recognition = null;
                this.isListening = false;
                this.language = 'es-ES'; // Español por defecto
                this.isSupported = this.checkSupport();
                this.transcript = '';
                this.onResultCallback = null;

                if (this.isSupported) {
                    this.initRecognition();
                }
            }

            /**
             * Verifica si el navegador soporta Web Speech API
             */
            checkSupport() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                return !!SpeechRecognition;
            }

            /**
             * Inicializa el objeto de reconocimiento de voz
             */
            initRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                this.recognition = new SpeechRecognition();

                // Configuración
                this.recognition.continuous = true; // Escucha continua
                this.recognition.interimResults = true; // Resultados parciales
                this.recognition.lang = this.language;
                this.recognition.maxAlternatives = 1;

                // Eventos
                this.recognition.onstart = () => {
                    this.isListening = true;
                    console.log('🎤 Reconocimiento de voz iniciado');
                    this.updateUIState('listening');
                };

                this.recognition.onend = () => {
                    this.isListening = false;
                    console.log('🎤 Reconocimiento de voz detenido');
                    this.updateUIState('idle');
                };

                this.recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript;
                        } else {
                            interimTranscript += transcript;
                        }
                    }

                    // Actualizar transcripción
                    this.transcript = finalTranscript || interimTranscript;

                    // Mostrar transcripción en tiempo real
                    this.updateTranscriptUI(this.transcript, !finalTranscript);

                    // Si hay resultado final, procesarlo
                    if (finalTranscript) {
                        this.processCommand(finalTranscript);
                    }

                    // Callback personalizado
                    if (this.onResultCallback) {
                        this.onResultCallback({
                            transcript: this.transcript,
                            isFinal: !!finalTranscript
                        });
                    }
                };

                this.recognition.onerror = (event) => {
                    console.error('❌ Error de reconocimiento de voz:', event.error);
                    this.updateUIState('error');

                    // Mensajes de error específicos
                    const errorMessages = {
                        'no-speech': 'No se detectó voz. Intenta de nuevo.',
                        'audio-capture': 'No se pudo acceder al micrófono.',
                        'not-allowed': 'Permiso de micrófono denegado.',
                        'network': 'Error de red. Verifica tu conexión.',
                        'aborted': 'Reconocimiento abortado.',
                        'language-not-supported': 'Idioma no soportado.'
                    };

                    const errorMsg = errorMessages[event.error] || `Error: ${event.error}`;
                    window.AVIASelfModifier?.showNotification(errorMsg, 'error');
                };

                this.recognition.onnomatch = () => {
                    console.log('⚠️ No se reconoció ningún comando');
                };
            }

            /**
             * Inicia el reconocimiento de voz
             */
            start() {
                if (!this.isSupported) {
                    window.AVIASelfModifier?.showNotification(
                        '❌ Tu navegador no soporta reconocimiento de voz. Usa Chrome, Edge o Safari.',
                        'error'
                    );
                    return false;
                }

                if (this.isListening) {
                    this.stop();
                    return false;
                }

                try {
                    this.recognition.start();
                    window.AVIASelfModifier?.showNotification('🎤 Escuchando... Di "AVIA" seguido de tu comando', 'info');
                    return true;
                } catch (error) {
                    console.error('Error iniciando reconocimiento:', error);
                    window.AVIASelfModifier?.showNotification('❌ Error al iniciar micrófono', 'error');
                    return false;
                }
            }

            /**
             * Detiene el reconocimiento de voz
             */
            stop() {
                if (this.recognition && this.isListening) {
                    this.recognition.stop();
                }
            }

            /**
             * Alterna entre iniciar/detener
             */
            toggle() {
                if (this.isListening) {
                    this.stop();
                } else {
                    this.start();
                }
            }

            /**
             * Procesa el comando de voz reconocido
             */
            processCommand(transcript) {
                const command = transcript.toLowerCase().trim();
                console.log('🎤 Comando reconocido:', command);

                // Comandos especiales
                if (command.includes('avia') || command.includes('había')) {
                    // Extraer el comando después de "AVIA"
                    const match = command.match(/(?:avia|había)\s+(.+)/i);
                    if (match && match[1]) {
                        const actualCommand = match[1].trim();
                        window.AVIASelfModifier?.showNotification(`🤖 Ejecutando: "${actualCommand}"`, 'info');

                        // Ejecutar modificación
                        window.AVIASelfModifier?.modifyApp(actualCommand);
                    }
                } else if (command.includes('deshacer')) {
                    window.AVIASelfModifier?.showNotification('↩️ Deshaciendo último cambio...', 'info');
                    window.UndoManager?.undo();
                } else if (command.includes('rehacer')) {
                    window.AVIASelfModifier?.showNotification('↪️ Rehaciendo cambio...', 'info');
                    window.UndoManager?.redo();
                } else if (command.includes('exportar')) {
                    window.AVIASelfModifier?.showNotification('📦 Exportando modificaciones...', 'info');
                    window.ImportExportModule?.exportModifications();
                } else if (command.includes('historial')) {
                    window.AVIASelfModifier?.showHistory();
                } else if (command.includes('limpiar historial')) {
                    window.AVIASelfModifier?.clearHistory();
                } else {
                    // Si no es un comando reconocido, mostrar sugerencia
                    console.log('💡 Comando no reconocido. Di "AVIA" seguido de tu comando.');
                }
            }

            /**
             * Actualiza el estado visual del botón de micrófono
             */
            updateUIState(state) {
                const micButton = document.getElementById('voiceMicButton');
                if (!micButton) return;

                // Remover todas las clases de estado
                micButton.classList.remove('listening', 'idle', 'error');

                // Agregar clase de estado actual
                micButton.classList.add(state);

                // Cambiar icono y color según estado
                const icon = micButton.querySelector('.mic-icon');
                if (icon) {
                    if (state === 'listening') {
                        icon.textContent = '🎤';
                        micButton.style.background = '#ef4444'; // rojo
                        micButton.classList.add('animate-pulse');
                    } else if (state === 'error') {
                        icon.textContent = '⚠️';
                        micButton.style.background = '#f59e0b'; // amarillo
                        micButton.classList.remove('animate-pulse');
                    } else {
                        icon.textContent = '🎙️';
                        micButton.style.background = '#3b82f6'; // azul
                        micButton.classList.remove('animate-pulse');
                    }
                }
            }

            /**
             * Actualiza la transcripción en la UI
             */
            updateTranscriptUI(text, isInterim) {
                const transcriptEl = document.getElementById('voiceTranscript');
                if (transcriptEl) {
                    transcriptEl.textContent = text;
                    transcriptEl.style.opacity = isInterim ? '0.6' : '1.0';
                }
            }

            /**
             * Cambia el idioma de reconocimiento
             */
            setLanguage(lang) {
                this.language = lang;
                if (this.recognition) {
                    this.recognition.lang = lang;
                }
                console.log(`🌐 Idioma cambiado a: ${lang}`);
            }

            /**
             * Obtiene información del estado
             */
            getStatus() {
                return {
                    isSupported: this.isSupported,
                    isListening: this.isListening,
                    language: this.language,
                    transcript: this.transcript
                };
            }
        }

        // Instanciar y exponer globalmente
        window.VoiceCommandModule = new VoiceCommandModule();

        if (window.VoiceCommandModule.isSupported) {

        } else {

                        timestamp: new Date().toISOString(),

                        preset: preset.name

        // Sistema de deshacer/rehacer cambios
        // ============================================

        class UndoManager {
            constructor() {
                this.undoStack = [];
                this.redoStack = [];
                this.maxStackSize = 20;
                this.snapshots = new Map(); // Guarda snapshots del DOM
            }

            /**
             * Crea un snapshot del elemento antes de modificarlo
             */
            createSnapshot(elementId) {
                const element = document.getElementById(elementId);
                if (!element) return null;

                return {
                    id: elementId,
                    styles: element.style.cssText,
                    classes: element.className,
                    innerHTML: element.innerHTML,
                    attributes: Array.from(element.attributes).reduce((acc, attr) => {
                        if (attr.name !== 'style' && attr.name !== 'class') {
                            acc[attr.name] = attr.value;
                        }
                        return acc;
                    }, {})
                };
            }

            /**
             * Guarda el estado actual antes de un cambio
             */
            saveState(description = 'Modificación') {
                const snapshot = {
                    description,
                    timestamp: Date.now(),
                    elements: ['menuAVIAButton', 'mainMenu', 'menuConfigButton'].map(id => this.createSnapshot(id)).filter(s => s),
                    bodyStyle: document.body.style.cssText
                };

                this.undoStack.push(snapshot);
                if (this.undoStack.length > this.maxStackSize) {
                    this.undoStack.shift();
                }

                // Limpiar redo stack al hacer un nuevo cambio
                this.redoStack = [];

                window.aviaEventBus?.emit('undo:state-saved', { description }, 'UndoManager');
            }

            /**
             * Restaura un snapshot
             */
            restoreSnapshot(snapshot) {
                snapshot.elements.forEach(elemSnapshot => {
                    const element = document.getElementById(elemSnapshot.id);
                    if (!element) return;

                    element.style.cssText = elemSnapshot.styles;
                    element.className = elemSnapshot.classes;

                    // Restaurar atributos (excepto los ya manejados)
                    Object.entries(elemSnapshot.attributes).forEach(([name, value]) => {
                        element.setAttribute(name, value);
                    });
                });

                // Restaurar estilo del body
                if (snapshot.bodyStyle) {
                    document.body.style.cssText = snapshot.bodyStyle;
                }
            }

            /**
             * Deshace el último cambio
             */
            undo() {
                if (this.undoStack.length === 0) {
                    window.AVIASelfModifier?.showNotification('⚠️ No hay cambios para deshacer', 'warning');
                    return false;
                }

                // Guardar estado actual en redo stack antes de deshacer
                const currentState = {
                    description: 'Estado actual',
                    timestamp: Date.now(),
                    elements: ['menuAVIAButton', 'mainMenu', 'menuConfigButton'].map(id => this.createSnapshot(id)).filter(s => s),
                    bodyStyle: document.body.style.cssText
                };
                this.redoStack.push(currentState);

                // Restaurar estado anterior
                const previousState = this.undoStack.pop();
                this.restoreSnapshot(previousState);

                window.AVIASelfModifier?.showNotification(`↩️ Deshecho: ${previousState.description}`, 'success');
                window.aviaEventBus?.emit('undo:undone', { description: previousState.description }, 'UndoManager');
                return true;
            }

            /**
             * Rehace el último cambio deshecho
             */
            redo() {
                if (this.redoStack.length === 0) {
                    window.AVIASelfModifier?.showNotification('⚠️ No hay cambios para rehacer', 'warning');
                    return false;
                }

                const nextState = this.redoStack.pop();

                // Guardar estado actual en undo stack
                const currentState = {
                    description: nextState.description,
                    timestamp: Date.now(),
                    elements: ['menuAVIAButton', 'mainMenu', 'menuConfigButton'].map(id => this.createSnapshot(id)).filter(s => s),
                    bodyStyle: document.body.style.cssText
                };
                this.undoStack.push(currentState);

                // Restaurar estado siguiente
                this.restoreSnapshot(nextState);

                window.AVIASelfModifier?.showNotification(`↪️ Rehecho: ${nextState.description}`, 'success');
                window.aviaEventBus?.emit('undo:redone', { description: nextState.description }, 'UndoManager');
                return true;
            }

            /**
             * Limpia los stacks
             */
            clear() {
                this.undoStack = [];
                this.redoStack = [];
                window.AVIASelfModifier?.showNotification('🗑️ Historial de undo/redo limpiado', 'info');
            }

            /**
             * Obtiene información del estado
             */
            getStatus() {
                return {
                    canUndo: this.undoStack.length > 0,
                    canRedo: this.redoStack.length > 0,
                    undoCount: this.undoStack.length,
                    redoCount: this.redoStack.length
                };
            }
        }

        // Instanciar y exponer globalmente
        window.UndoManager = new UndoManager();
        console.log('↩️ Undo Manager initialized');

        class ImportExportModule {
            constructor() {
                this.version = '1.0';
            }

            /**
             * Exporta las modificaciones como archivo JSON
             */
            exportModifications() {
                const history = window.AVIASelfModifier?.getHistory() || [];

                if (history.length === 0) {
                    window.AVIASelfModifier?.showNotification('⚠️ No hay modificaciones para exportar', 'warning');
                    return;
                }

                const exportData = {
                    version: this.version,
                    exportDate: new Date().toISOString(),
                    appName: 'TOOCAuthor AVIA Self-Modifier',
                    modifications: history.map(entry => ({
                        command: entry.command,
                        code: entry.code,
                        timestamp: entry.timestamp,
                        success: entry.success
                    }))
                };

                const json = JSON.stringify(exportData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = `avia-modifications-${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                window.AVIASelfModifier?.showNotification('📦 Modificaciones exportadas correctamente', 'success');
                window.aviaEventBus?.emit('export:completed', { count: history.length }, 'ImportExportModule');
            }

            /**
             * Importa modificaciones desde un archivo JSON
             */
            importModifications(file) {
                const reader = new FileReader();

                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);

                        // Validar formato
                        if (!data.version || !data.modifications || !Array.isArray(data.modifications)) {
                            throw new Error('Formato de archivo inválido');
                        }

                        // Mostrar confirmación
                        this.showImportConfirmation(data);

                    } catch (error) {
                        window.AVIASelfModifier?.showNotification(`❌ Error importando: ${error.message}`, 'error');
                    }
                };

                reader.readAsText(file);
            }

            /**
             * Muestra confirmación de importación
             */
            showImportConfirmation(data) {
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[130]';

                modal.innerHTML = `
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-2xl p-6 max-w-lg w-full mx-4">
                        <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-4">📦 Importar Modificaciones</h3>
                        <p class="text-gray-600 dark:text-gray-400 mb-4">
                            Se encontraron <strong>${data.modifications.length}</strong> modificaciones.
                            <br><small>Exportadas el: ${new Date(data.exportDate).toLocaleString()}</small>
                        </p>
                        <div class="flex gap-3">
                            <button onclick="this.closest('.fixed').remove()"
                                    class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 rounded-lg">
                                Cancelar
                            </button>
                            <button onclick="window.ImportExportModule.applyImportedModifications(${JSON.stringify(data.modifications).replace(/"/g, '&quot;')}); this.closest('.fixed').remove();"
                                    class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg">
                                ✓ Aplicar Todas
                            </button>
                        </div>
                    </div>
                `;

                document.body.appendChild(modal);
            }

            /**
             * Aplica las modificaciones importadas
             */
            applyImportedModifications(modifications) {
                let applied = 0;
                let failed = 0;

                modifications.forEach((mod, index) => {
                    try {
                        setTimeout(() => {
                            eval(mod.code);
                            window.AVIASelfModifier?.addToHistory({
                                command: `Importado: ${mod.command}`,
                                code: mod.code,
                                timestamp: new Date().toISOString(),
                                success: true
                            });
                            applied++;
                        }, index * 100); // Delay para evitar bloqueo
                    } catch (error) {
                        console.error(`Error aplicando modificación "${mod.command}":`, error);
                        failed++;
                    }
                });

                setTimeout(() => {
                    window.AVIASelfModifier?.showNotification(
                        `✅ Importación completa: ${applied} aplicadas, ${failed} fallidas`,
                        failed > 0 ? 'warning' : 'success'
                    );
                }, modifications.length * 100 + 500);

                window.aviaEventBus?.emit('import:completed', { applied, failed }, 'ImportExportModule');
            }

            /**
             * Muestra diálogo de import/export
             */
            showExportImport() {
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[120] p-4';

                modal.innerHTML = `

                        action: () => window.FavoritesModule?.showFavorites(),
                        icon: '⭐'
                    }
                };
            }

            /**
             * Registra los event listeners
             */
            registerListeners() {
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
                document.addEventListener('keyup', (e) => this.handleKeyUp(e));
            }

            /**
             * Maneja evento keydown
             */
            handleKeyDown(e) {
                if (!this.enabled) return;

                // Ignorar si el usuario está escribiendo en un input/textarea
                if (this.isTyping(e.target)) return;

                // Construir combinación de teclas
                const combo = this.getKeyCombo(e);
                this.pressedKeys.add(e.key.toLowerCase());

                // Buscar atajo
                const shortcut = this.shortcuts[combo];
                if (shortcut) {
                    e.preventDefault();

                    // Ejecutar acción
                    if (!shortcut.hold) {
                        shortcut.action();
                        this.showShortcutFeedback(shortcut.name, shortcut.icon);
                    }
                }
            }

            /**
             * Maneja evento keyup
             */
            handleKeyUp(e) {
                this.pressedKeys.delete(e.key.toLowerCase());

                // Si era un atajo con hold y se soltó
                const combo = this.getKeyCombo(e);
                const shortcut = this.shortcuts[combo];
                if (shortcut && shortcut.hold && e.key.toLowerCase() === 'v') {
                    window.VoiceCommandModule?.stop();
                }
            }

            /**
             * Obtiene la combinación de teclas presionadas
             */
            getKeyCombo(e) {
                const parts = [];
                if (e.ctrlKey || e.metaKey) parts.push('ctrl');
                if (e.shiftKey) parts.push('shift');
                if (e.altKey) parts.push('alt');

                const key = e.key.toLowerCase();
                if (key !== 'control' && key !== 'shift' && key !== 'alt' && key !== 'meta') {
                    parts.push(key);
                }

                return parts.join('+');
            }

            /**
             * Verifica si el usuario está escribiendo
             */
            isTyping(element) {
                const tagName = element.tagName.toLowerCase();
                return tagName === 'input' || tagName === 'textarea' || element.isContentEditable;
            }

            /**
             * Muestra feedback visual del atajo ejecutado
             */

                const feedback = document.createElement('div');
                feedback.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl z-[150] flex items-center gap-2 animate-bounce';
                feedback.innerHTML = `
                    <span class="text-2xl">${icon}</span>

                `;

                document.body.appendChild(feedback);

                setTimeout(() => {

                    feedback.style.transform = 'translateX(-50%) translateY(-20px)';
                    feedback.style.transition = 'all 0.3s';
                    setTimeout(() => feedback.remove(), 300);

            }

            /**

        // MÓDULO 7: FLOATING WINDOW SYSTEM
        // Sistema de ventanas flotantes arrastrables y redimensionables
        // ============================================

        class FloatingWindowModule {
            constructor() {
                this.windows = new Map();
                this.currentZIndex = 100;
                this.dragState = null;
                this.resizeState = null;
                this.minimizedWindows = [];
            }

            /**
             * Crea una ventana flotante
             */
            createWindow(config) {
                const {
                    id = 'floating-' + Date.now(),
                    title = 'Ventana',
                    content = '',
                    width = 600,
                    height = 400,
                    x = null,
                    y = null,
                    resizable = true,
                    draggable = true,
                    onClose = null
                } = config;

                // Calcular posición inicial si no se proporciona
                const finalX = x !== null ? x : (window.innerWidth - width) / 2;
                const finalY = y !== null ? y : (window.innerHeight - height) / 2;

                const windowEl = document.createElement('div');
                windowEl.id = id;
                windowEl.className = 'floating-window fixed bg-white dark:bg-gray-800 rounded-xl shadow-2xl flex flex-col overflow-hidden';
                windowEl.style.cssText = `
                    left: ${finalX}px;
                    top: ${finalY}px;
                    width: ${width}px;
                    height: ${height}px;
                    z-index: ${++this.currentZIndex};
                    transition: none;
                `;

                // Header con controles
                const header = document.createElement('div');
                header.className = 'floating-window-header bg-gradient-to-r from-purple-600 to-blue-600 text-white px-4 py-3 flex items-center justify-between cursor-move select-none';
                header.innerHTML = `
                    <h3 class="font-bold text-lg flex-1">${title}</h3>
                    <div class="flex items-center gap-2">
                        <button class="minimize-btn w-8 h-8 rounded-full bg-yellow-500 hover:bg-yellow-600 flex items-center justify-center transition-all" title="Minimizar">
                            <span class="text-sm font-bold">─</span>
                        </button>
                        <button class="fullscreen-btn w-8 h-8 rounded-full bg-green-500 hover:bg-green-600 flex items-center justify-center transition-all" title="Pantalla completa">
                            <span class="text-sm font-bold">□</span>
                        </button>
                        <button class="close-btn w-8 h-8 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center transition-all" title="Cerrar">
                            <span class="text-sm font-bold">✕</span>
                        </button>
                    </div>
                `;

                // Content
                const contentDiv = document.createElement('div');
                contentDiv.className = 'floating-window-content flex-1 overflow-auto p-6';
                if (typeof content === 'string') {
                    contentDiv.innerHTML = content;
                } else if (content instanceof HTMLElement) {
                    contentDiv.appendChild(content);
                }

                // Resize handles (solo si es redimensionable)
                if (resizable) {
                    const handles = ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'];
                    handles.forEach(dir => {
                        const handle = document.createElement('div');
                        handle.className = `resize-handle resize-${dir}`;
                        handle.dataset.direction = dir;
                        windowEl.appendChild(handle);
                    });
                }

                windowEl.appendChild(header);
                windowEl.appendChild(contentDiv);
                document.body.appendChild(windowEl);

                // Event listeners
                if (draggable) {
                    header.addEventListener('mousedown', (e) => this.startDrag(e, windowEl));
                }

                if (resizable) {
                    windowEl.querySelectorAll('.resize-handle').forEach(handle => {
                        handle.addEventListener('mousedown', (e) => this.startResize(e, windowEl, handle.dataset.direction));
                    });
                }

                // Botón minimizar
                windowEl.querySelector('.minimize-btn').addEventListener('click', () => this.minimizeWindow(id));

                // Botón fullscreen
                windowEl.querySelector('.fullscreen-btn').addEventListener('click', () => this.toggleFullscreen(id));

                // Botón cerrar
                windowEl.querySelector('.close-btn').addEventListener('click', () => {
                    if (onClose) onClose();
                    this.closeWindow(id);
                });

                // Traer al frente al hacer clic
                windowEl.addEventListener('mousedown', () => this.bringToFront(id));

                // Guardar referencia
                this.windows.set(id, {
                    element: windowEl,
                    config,
                    isFullscreen: false,
                    originalBounds: null
                });

                // Agregar estilos CSS si no existen
                this.injectStyles();

                return windowEl;
            }

            /**
             * Inicia el arrastre de una ventana
             */
            startDrag(e, windowEl) {
                if (e.target.classList.contains('close-btn') ||
                    e.target.classList.contains('minimize-btn') ||
                    e.target.classList.contains('fullscreen-btn')) {
                    return;
                }

                e.preventDefault();
                this.bringToFront(windowEl.id);

                const rect = windowEl.getBoundingClientRect();
                this.dragState = {
                    windowEl,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialLeft: rect.left,
                    initialTop: rect.top
                };

                document.addEventListener('mousemove', this.onDragMove);
                document.addEventListener('mouseup', this.onDragEnd);
                windowEl.style.transition = 'none';
            }

            onDragMove = (e) => {
                if (!this.dragState) return;

                const dx = e.clientX - this.dragState.startX;
                const dy = e.clientY - this.dragState.startY;

                let newLeft = this.dragState.initialLeft + dx;
                let newTop = this.dragState.initialTop + dy;

                // Límites del viewport
                const maxX = window.innerWidth - this.dragState.windowEl.offsetWidth;
                const maxY = window.innerHeight - this.dragState.windowEl.offsetHeight;

                newLeft = Math.max(0, Math.min(newLeft, maxX));
                newTop = Math.max(0, Math.min(newTop, maxY));

                this.dragState.windowEl.style.left = newLeft + 'px';
                this.dragState.windowEl.style.top = newTop + 'px';
            };

            onDragEnd = () => {
                if (this.dragState) {
                    this.dragState.windowEl.style.transition = '';
                    this.dragState = null;
                }
                document.removeEventListener('mousemove', this.onDragMove);
                document.removeEventListener('mouseup', this.onDragEnd);
            };

            /**
             * Inicia el redimensionamiento
             */
            startResize(e, windowEl, direction) {
                e.preventDefault();
                e.stopPropagation();
                this.bringToFront(windowEl.id);

                const rect = windowEl.getBoundingClientRect();
                this.resizeState = {
                    windowEl,
                    direction,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialWidth: rect.width,
                    initialHeight: rect.height,
                    initialLeft: rect.left,
                    initialTop: rect.top
                };

                document.addEventListener('mousemove', this.onResizeMove);
                document.addEventListener('mouseup', this.onResizeEnd);
                windowEl.style.transition = 'none';
            }

            onResizeMove = (e) => {
                if (!this.resizeState) return;

                const { direction, startX, startY, initialWidth, initialHeight, initialLeft, initialTop, windowEl } = this.resizeState;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                let newWidth = initialWidth;
                let newHeight = initialHeight;
                let newLeft = initialLeft;
                let newTop = initialTop;

                // Calcular nuevas dimensiones según dirección
                if (direction.includes('e')) {
                    newWidth = Math.max(300, initialWidth + dx);
                }
                if (direction.includes('w')) {
                    newWidth = Math.max(300, initialWidth - dx);
                    newLeft = initialLeft + dx;
                }
                if (direction.includes('s')) {
                    newHeight = Math.max(200, initialHeight + dy);
                }
                if (direction.includes('n')) {
                    newHeight = Math.max(200, initialHeight - dy);
                    newTop = initialTop + dy;
                }

                // Aplicar límites
                if (newLeft < 0) {
                    newWidth += newLeft;
                    newLeft = 0;
                }
                if (newTop < 0) {
                    newHeight += newTop;
                    newTop = 0;
                }

                windowEl.style.width = newWidth + 'px';
                windowEl.style.height = newHeight + 'px';
                windowEl.style.left = newLeft + 'px';
                windowEl.style.top = newTop + 'px';
            };

            onResizeEnd = () => {
                if (this.resizeState) {
                    this.resizeState.windowEl.style.transition = '';
                    this.resizeState = null;
                }
                document.removeEventListener('mousemove', this.onResizeMove);
                document.removeEventListener('mouseup', this.onResizeEnd);
            };

            /**
             * Trae la ventana al frente
             */
            bringToFront(windowId) {
                const windowData = this.windows.get(windowId);
                if (windowData) {
                    windowData.element.style.zIndex = ++this.currentZIndex;
                }
            }

            /**
             * Alterna pantalla completa
             */
            toggleFullscreen(windowId) {
                const windowData = this.windows.get(windowId);
                if (!windowData) return;

                const { element, isFullscreen } = windowData;

                if (!isFullscreen) {
                    // Guardar posición actual
                    windowData.originalBounds = {
                        left: element.style.left,
                        top: element.style.top,
                        width: element.style.width,
                        height: element.style.height
                    };

                    // Maximizar
                    element.style.left = '0px';
                    element.style.top = '0px';
                    element.style.width = '100vw';
                    element.style.height = '100vh';
                    windowData.isFullscreen = true;
                } else {
                    // Restaurar
                    const bounds = windowData.originalBounds;
                    element.style.left = bounds.left;
                    element.style.top = bounds.top;
                    element.style.width = bounds.width;
                    element.style.height = bounds.height;
                    windowData.isFullscreen = false;
                }
            }

            /**
             * Minimiza la ventana
             */
            minimizeWindow(windowId) {
                const windowData = this.windows.get(windowId);
                if (!windowData) return;

                windowData.element.style.display = 'none';
                this.minimizedWindows.push(windowId);

                // Mostrar en barra de minimizados
                this.updateMinimizedBar();
                window.AVIASelfModifier?.showNotification(`📦 Ventana minimizada`, 'info');
            }

            /**
             * Restaura ventana minimizada
             */
            restoreWindow(windowId) {
                const windowData = this.windows.get(windowId);
                if (!windowData) return;

                windowData.element.style.display = 'flex';
                this.minimizedWindows = this.minimizedWindows.filter(id => id !== windowId);
                this.bringToFront(windowId);
                this.updateMinimizedBar();
            }

            /**
             * Actualiza barra de ventanas minimizadas
             */
            updateMinimizedBar() {
                let bar = document.getElementById('minimizedWindowsBar');

                if (this.minimizedWindows.length === 0) {
                    if (bar) bar.remove();
                    return;
                }

                if (!bar) {
                    bar = document.createElement('div');
                    bar.id = 'minimizedWindowsBar';
                    bar.className = 'fixed bottom-4 left-4 flex gap-2 z-[200]';
                    document.body.appendChild(bar);
                }

                bar.innerHTML = this.minimizedWindows.map(id => {
                    const windowData = this.windows.get(id);
                    return `
                        <button onclick="window.FloatingWindowModule.restoreWindow('${id}')"
                                class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg shadow-lg transition-all">
                            ${windowData.config.title || 'Ventana'}
                        </button>
                    `;
                }).join('');
            }

            /**
             * Cierra una ventana
             */
            closeWindow(windowId) {
                const windowData = this.windows.get(windowId);
                if (windowData) {
                    windowData.element.remove();
                    this.windows.delete(windowId);
                    this.minimizedWindows = this.minimizedWindows.filter(id => id !== windowId);
                    this.updateMinimizedBar();
                }
            }

            /**
             * Inyecta estilos CSS necesarios
             */
            injectStyles() {
                if (document.getElementById('floatingWindowStyles')) return;

                const style = document.createElement('style');
                style.id = 'floatingWindowStyles';
                style.textContent = `
                    .floating-window {
                        border: 2px solid rgba(147, 51, 234, 0.3);
                    }

                    .floating-window:hover {
                        border-color: rgba(147, 51, 234, 0.6);
                    }

                    .resize-handle {
                        position: absolute;
                        background: transparent;
                    }

                    .resize-n, .resize-s { width: 100%; height: 8px; left: 0; cursor: ns-resize; }
                    .resize-e, .resize-w { width: 8px; height: 100%; top: 0; cursor: ew-resize; }
                    .resize-n { top: 0; }
                    .resize-s { bottom: 0; }
                    .resize-e { right: 0; }
                    .resize-w { left: 0; }

                    .resize-ne, .resize-nw, .resize-se, .resize-sw {
                        width: 16px;
                        height: 16px;
                    }

                    .resize-ne { top: 0; right: 0; cursor: nesw-resize; }
                    .resize-nw { top: 0; left: 0; cursor: nwse-resize; }

                    .resize-sw { bottom: 0; left: 0; cursor: nesw-resize; }

                document.head.appendChild(style);
            }

            convertModalToFloating(modalElement, title = 'Ventana') {
                // Extraer contenido del modal
                const content = modalElement.querySelector('.bg-white, .dark\\:bg-gray-800');

                if (content) {
                    const contentHTML = content.innerHTML;
                    modalElement.remove();

                    return this.createWindow({
                        title,
                        content: contentHTML,
                        width: 800,
                        height: 600
                    });
                }
            }

        class ConfigPanelModule {
            constructor() {
                this.isOpen = false;
                this.currentPage = 1;
                this.totalPages = 2;
                this.panel = null;
            }

            /**
             * Alterna el panel (abrir/cerrar)
             */
            toggle() {
                if (this.isOpen) {
                    this.close();
                } else {
                    this.open();
                }
            }

            /**
             * Abre el panel con efecto cremallera HORIZONTAL (de izquierda a derecha)
             */
            open() {
                if (this.isOpen) return;

                this.isOpen = true;
                this.createPanel();

                // Animar panel con efecto cremallera HORIZONTAL - desliza de izquierda a derecha
                setTimeout(() => {
                    this.panel.style.transform = 'translateX(0)';
                    this.panel.style.opacity = '1';
                }, 10);

                // Cerrar al hacer clic fuera
                setTimeout(() => {
                    document.addEventListener('click', this.handleOutsideClick);
                }, 100);
            }

            /**
             * Cierra el panel
             */
            close() {
                if (!this.isOpen) return;

                this.isOpen = false;

                // Animación de cierre HORIZONTAL - desliza hacia la izquierda
                if (this.panel) {
                    this.panel.style.transform = 'translateX(-100%)';
                    this.panel.style.opacity = '0';

                    setTimeout(() => {
                        if (this.overlay) {
                            this.overlay.remove();
                            this.overlay = null;
                        }
                        if (this.panel) {
                            this.panel.remove();
                            this.panel = null;
                        }
                    }, 400);
                }

                document.removeEventListener('click', this.handleOutsideClick);
            }

            /**
             * Maneja clics fuera del panel (incluyendo clics en overlay)
             */
            handleOutsideClick = (e) => {
                // Cerrar si hace clic en overlay o fuera del panel (pero no en el botón de config)
                if ((this.overlay && e.target === this.overlay) ||
                    (this.panel && !this.panel.contains(e.target) && !e.target.closest('#menuConfigButton'))) {
                    this.close();
                }
            };

            /**
             * Crea el panel HTML - HORIZONTAL junto al botón naranja (cremallera izquierda a derecha)
             */
            createPanel() {
                // Crear overlay TRANSPARENTE para aplicar filtro de inactividad según Regla Universal SiestaOTT
                this.overlay = document.createElement('div');
                this.overlay.id = 'configPanelOverlay';
                this.overlay.className = 'fixed inset-0 z-[55]';
                this.overlay.style.cssText = `
                    background: transparent;
                    backdrop-filter: opacity(0.4);
                    -webkit-backdrop-filter: opacity(0.4);
                    pointer-events: auto;
                `;
                document.body.appendChild(this.overlay);

                // NO crear conector - panel pegado directamente al botón naranja

                // Crear panel con sombra volumétrica y halo - Altura 100px, pegado al botón naranja
                this.panel = document.createElement('div');
                this.panel.id = 'configPanel';
                this.panel.className = 'fixed bg-gray-200 dark:bg-gray-800 rounded-2xl z-[60] flex flex-row items-center overflow-x-hidden overflow-y-hidden';
                // Panel PEGADO al botón naranja (left: 120px, justo después del botón de 96px que empieza en 24px)
                // Ancho reducido para dejar visible el botón morado (right: 140px - espacio para botón morado)
                // Altura 100px, bottom 24px
                // Sombras volumétricas + halo luminoso según Libro Blanco SiestaOTT (ACTIVO)
                this.panel.style.cssText = `
                    left: 120px;
                    right: 140px;
                    bottom: 24px;
                    height: 100px;
                    transform: translateX(-100%);
                    opacity: 0;
                    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
                    padding: 12px 0;
                    box-shadow:
                        0 10px 25px rgba(0,0,0,0.5),
                        0 6px 12px rgba(0,0,0,0.4),
                        0 3px 6px rgba(0,0,0,0.3),
                        inset 0 -2px 4px rgba(0,0,0,0.15),
                        0 0 30px rgba(147, 51, 234, 0.4),
                        0 0 60px rgba(147, 51, 234, 0.2);
                `;

                // Content (páginas) - flex horizontal
                const content = document.createElement('div');
                content.className = 'flex-1 overflow-hidden relative';
                content.id = 'configPanelContent';

                this.panel.appendChild(content);
                document.body.appendChild(this.panel);

                // Renderizar página actual
                this.renderPage(this.currentPage);
            }

            /**
             * Renderiza una página específica
             */
            renderPage(pageNumber) {
                this.currentPage = pageNumber;

                const content = document.getElementById('configPanelContent');
                if (!content) return;

                // Animación de salida (deslizar horizontalmente hacia la izquierda)
                content.style.opacity = '0';
                content.style.transform = 'translateX(-20px)';

                setTimeout(() => {
                    if (pageNumber === 1) {
                        content.innerHTML = this.getPage1HTML();
                    } else if (pageNumber === 2) {
                        content.innerHTML = this.getPage2HTML();
                    }

                    // Animación de entrada
                    content.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    setTimeout(() => {
                        content.style.opacity = '1';
                        content.style.transform = 'translateX(0)';
                    }, 50);
                }, 150);
            }

            /**
             * SUBMÓDULO: Abrir ventana Mi Configuración
             * Autocorregible con integración AVIA completa
             */
            openMyConfig() {
                // Cerrar panel si está abierto
                this.close();

                // Validar que FloatingWindowModule esté disponible
                if (!window.FloatingWindowModule || typeof window.FloatingWindowModule.createWindow !== 'function') {
                    console.error('openMyConfig: FloatingWindowModule no está disponible');
                    window.aviaEventBus?.emit('myconfig:error', { error: 'FloatingWindowModule no disponible' }, 'ConfigPanel');
                    return;
                }

                try {
                    // Crear ventana flotante personalizada con sistema de navegación
                    const windowEl = window.FloatingWindowModule.createWindow({
                        title: '🔴 Mi Configuración',
                        content: '', // Lo llenaremos manualmente
                        width: 700,
                        height: 600,
                        customHeader: true, // Indicar que usaremos header personalizado
                        // CRÍTICO: Callback de cierre para limpiar MyConfigManager
                        onClose: () => {
                            if (window.MyConfigManager) {
                                console.log('🧹 Limpiando MyConfigManager al cerrar ventana');
                                window.MyConfigManager.cleanup();
                            }
                        }
                    });

                    if (!windowEl) {
                        throw new Error('No se pudo crear la ventana flotante');
                    }

                    // Construir contenido HTML personalizado usando submódulo
                    windowEl.innerHTML = this.buildMyConfigHTML();

                    // CRÍTICO: Delay para permitir DOM rendering antes de buscar elementos
                    setTimeout(() => {
                        try {
                            // CRÍTICO: Siempre limpiar instancia anterior
                            if (window.MyConfigManager) {
                                console.log('🧹 Limpiando instancia anterior de MyConfigManager');
                                window.MyConfigManager.cleanup();
                            }

                            // Crear nueva instancia
                            window.MyConfigManager = new MyConfigNavigationManager(windowEl);

                            // Validar que se inicializó correctamente
                            if (!window.MyConfigManager.rows || window.MyConfigManager.rows.length === 0) {
                                throw new Error('MyConfigNavigationManager: No se inicializó correctamente');
                            }

                            console.log('✅ MyConfigNavigationManager inicializado con', window.MyConfigManager.rows.length, 'filas');
                            window.aviaEventBus?.emit('myconfig:opened', { rowCount: window.MyConfigManager.rows.length }, 'ConfigPanel');

                        } catch (error) {
                            console.error('❌ Error inicializando MyConfigNavigationManager:', error);

                            // Mostrar error visual al usuario
                            windowEl.innerHTML = `
                                <div class="p-8 text-center">
                                    <div class="text-6xl mb-4">⚠️</div>
                                    <h3 class="text-xl font-bold text-red-600 dark:text-red-400 mb-2">
                                        Error al cargar Mi Configuración
                                    </h3>
                                    <p class="text-gray-700 dark:text-gray-300 text-sm mb-4">
                                        ${error.message}
                                    </p>
                                    <button onclick="this.closest('.floating-window')?.remove()"
                                            class="px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-all">
                                        Cerrar
                                    </button>
                                </div>
                            `;

                            // Reportar a health monitor y event bus
                            window.aviaHealth?.reportError('myConfig', error);
                            window.aviaEventBus?.emit('myconfig:error', { error: error.message }, 'ConfigPanel');
                        }
                    }, 50); // 50ms suficiente para un reflow del navegador

            /**
