             */
            reset() {
                console.log('🔄 ConfigPanelModule: Ejecutando reset');
                // Cerrar ventanas abiertas
                if (this.panel) {
                    this.close();
                }
                // Limpiar MyConfigManager si existe
                if (window.MyConfigManager) {
                    window.MyConfigManager.cleanup();
                }
            }
        }

        // Registrar en AVIA Registry con ErrorBoundary wrapping
        if (window.aviaRegistry) {
            // register() retorna DIRECTAMENTE wrappedInstance, no un objeto con .instance
            window.ConfigPanelModule = window.aviaRegistry.register('configPanel', ConfigPanelModule);
            console.log('✅ Config Panel Module registered in AVIA Registry with ErrorBoundary');
        } else {
            // Fallback si Registry no está disponible
            window.ConfigPanelModule = new ConfigPanelModule();
            console.warn('⚠️ Config Panel Module initialized without Registry (fallback mode)');
        }

        // ============================================
        // MY CONFIG NAVIGATION MANAGER
        // Gestiona la navegación con triángulos y teclado en la ventana "Mi Configuración"
        // ============================================

        /**
         * SUBMÓDULO AUTÓNOMO: MyConfigNavigationManager
         * Gestiona la navegación por filas en Mi Configuración
         * Autocorregible y con validación de existencia de elementos
         */
        /**
         * SUBMÓDULO AUTÓNOMO: MyConfigNavigationManager
         * Gestor de navegación para Mi Configuración
         * Autocorregible con lanzamiento de errores (NO silencioso)
         */
        class MyConfigNavigationManager {
            constructor(windowEl) {
                // Validación estricta de entrada con lanzamiento de error
                if (!windowEl) {
                    const error = new Error('MyConfigNavigationManager: windowEl es requerido');
                    console.error(error);
                    throw error;
                }

                this.windowEl = windowEl;
                this.activeIndex = 0;

                // Validación de elementos DOM críticos
                this.rows = Array.from(windowEl.querySelectorAll('.myconfig-row'));
                this.scrollContainer = windowEl.querySelector('.myconfig-scroll-container');
                this.wrapper = windowEl.querySelector('.myconfig-rows-wrapper');

                // Lanzar errores si faltan elementos (NO retornar silenciosamente)
                if (!this.rows || this.rows.length === 0) {
                    const error = new Error('MyConfigNavigationManager: No se encontraron filas (.myconfig-row). HTML puede no estar renderizado.');
                    console.error(error);
                    throw error;
                }

                if (!this.scrollContainer) {
                    const error = new Error('MyConfigNavigationManager: No se encontró el contenedor de scroll (.myconfig-scroll-container)');
                    console.error(error);
                    throw error;
                }

                if (!this.wrapper) {
                    const error = new Error('MyConfigNavigationManager: No se encontró el wrapper de filas (.myconfig-rows-wrapper)');
                    console.error(error);
                    throw error;
                }

                // Inicialización de submódulos
                this.init();

                console.log('✅ MyConfigNavigationManager: Inicializado correctamente con', this.rows.length, 'filas');
            }

            /**
             * Inicialización del manager
             */
            init() {
                // Activar la primera fila por defecto
                if (this.rows.length > 0) {
                    this.activateRow(0);
                }

                // Setup de navegación por teclado
                this.setupKeyboardNav();
            }

            /**
             * SUBMÓDULO: Navegación por teclado
             */
            setupKeyboardNav() {
                this.keyHandler = (e) => {
                    // ROJO o ENTER: toggle checkbox de fila activa
                    if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
                        this.toggleActiveCheckbox();
                    }
                    // Flecha abajo: siguiente fila
                    else if (e.key === 'ArrowDown') {
                        this.scrollDown();
                    }
                    // Flecha arriba: fila anterior
                    else if (e.key === 'ArrowUp') {
                        this.scrollUp();
                    }
                };
                document.addEventListener('keydown', this.keyHandler);
            }

            /**
             * SUBMÓDULO: Scroll hacia abajo (siguiente fila)
             * Con validación autocorregible
             * Si activeIndex es -1 (pantalla inicial), va a la primera fila
             */
            scrollDown() {
                if (!this.rows || this.rows.length === 0) return;

                if (this.activeIndex === -1) {
                    // Desde pantalla inicial, ir a primera fila
                    this.activeIndex = 0;
                    this.hideHomeScreen();
                    this.activateRow(this.activeIndex);
                    this.scrollToVisible();
                } else if (this.activeIndex < this.rows.length - 1) {
                    this.deactivateRow(this.activeIndex);
                    this.activeIndex++;
                    this.activateRow(this.activeIndex);
                    this.scrollToVisible();
                }
            }

            /**
             * SUBMÓDULO: Scroll hacia arriba (fila anterior)
             * Con validación autocorregible
             * Si activeIndex llega a -1, muestra la pantalla inicial con botones
             */
            scrollUp() {
                if (!this.rows || this.rows.length === 0) return;

                if (this.activeIndex > 0) {
                    this.deactivateRow(this.activeIndex);
                    this.activeIndex--;
                    this.activateRow(this.activeIndex);
                    this.scrollToVisible();
                } else if (this.activeIndex === 0) {
                    // Ir a la pantalla inicial (índice -1)
                    this.deactivateRow(this.activeIndex);
                    this.activeIndex = -1;
                    this.showHomeScreen();
                }
            }

            /**
             * SUBMÓDULO: Activar fila con color según categoría
             * Autocorregible con validación de índice y categoría
             */
            activateRow(index) {
                if (!this.rows || index < 0 || index >= this.rows.length) {
                    console.error(`activateRow: índice ${index} fuera de rango`);
                    return;
                }

                const row = this.rows[index];
                if (!row) return;

                const category = row.dataset.category || 'default';

                // Aplicar color según categoría: diversidad=rojo, audio=verde
                let colorClass = '';
                if (category === 'diversidad') {
                    colorClass = 'bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500';
                } else if (category === 'audio') {
                    colorClass = 'bg-green-50 dark:bg-green-900/20 border-l-4 border-green-500';
                } else {
                    colorClass = 'bg-blue-50 dark:bg-blue-900/20 border-l-4 border-blue-500';
                }

                row.className = `myconfig-row p-4 ${colorClass}`;
                row.dataset.index = index;
            }

            /**
             * SUBMÓDULO: Desactivar fila
             * Autocorregible con validación de índice
             */
            deactivateRow(index) {
                if (!this.rows || index < 0 || index >= this.rows.length) {
                    console.error(`deactivateRow: índice ${index} fuera de rango`);
                    return;
                }

                const row = this.rows[index];
                if (!row) return;

                row.className = 'myconfig-row p-4 bg-white dark:bg-gray-800';
                row.dataset.index = index;
            }

            /**
             * SUBMÓDULO: Scroll visual para mantener fila activa visible
             * Autocorregible con validación de elementos
             */
            scrollToVisible() {
                if (!this.wrapper || !this.scrollContainer) {
                    console.error('scrollToVisible: elementos no disponibles');
                    return;
                }

                // Altura aproximada de cada fila
                const rowHeight = 60;
                const containerHeight = this.scrollContainer.offsetHeight;

                // Calcular offset para centrar la fila activa
                const offset = Math.max(0, (this.activeIndex * rowHeight) - (containerHeight / 2) + (rowHeight / 2));

                this.wrapper.style.transform = `translateY(-${offset}px)`;
            }

            /**
             * SUBMÓDULO: Toggle checkbox de fila activa
             * Autocorregible con validación de elementos
             */
            toggleActiveCheckbox() {
                if (!this.rows || this.activeIndex < 0 || this.activeIndex >= this.rows.length) {
                    console.error('toggleActiveCheckbox: índice activo fuera de rango');
                    return;
                }

                const activeRow = this.rows[this.activeIndex];
                if (!activeRow) return;

                const checkbox = activeRow.querySelector('input[type="checkbox"]');
                if (checkbox) {
                    checkbox.checked = !checkbox.checked;
                }
            }

            /**
             * SUBMÓDULO: Guardar configuración
             * Independiente y autocorregible
             */
            saveConfig() {
                console.log('💾 Guardando configuración...');

                // Recopilar todos los checkboxes y sus estados
                const config = {};
                this.rows.forEach(row => {
                    const checkbox = row.querySelector('input[type="checkbox"]');
                    if (checkbox && checkbox.dataset.option) {
                        config[checkbox.dataset.option] = checkbox.checked;
                    }
                });

                console.log('Configuración guardada:', config);

                // Mostrar notificación si está disponible
                if (window.AVIASelfModifier?.showNotification) {
                    window.AVIASelfModifier.showNotification('Configuración guardada correctamente', 'success');
                }
            }

            /**
             * SUBMÓDULO: Mostrar pantalla inicial con botones
             * Se muestra cuando activeIndex = -1
             */
            showHomeScreen() {
                if (!this.wrapper) return;

                // Crear pantalla inicial si no existe
                let homeScreen = this.windowEl.querySelector('.myconfig-home-screen');
                if (!homeScreen) {
                    homeScreen = document.createElement('div');
                    homeScreen.className = 'myconfig-home-screen absolute inset-0 flex flex-col items-center justify-center bg-white dark:bg-gray-800 z-20';
                    homeScreen.style.cssText = 'top: 80px; bottom: 80px;';

                    homeScreen.innerHTML = `
                        <h2 class="text-4xl font-bold text-black dark:text-white mb-12">Mi Configuración</h2>
                        <div class="flex gap-6">
                            <!-- Botón ROJO: Diversidad Funcional -->
                            <button class="myconfig-home-btn always-active-button w-32 h-32 bg-red-500 hover:bg-red-600 rounded-xl flex flex-col items-center justify-center transition-all hover:scale-110"
                                    style="opacity: 1.0 !important; box-shadow: 0 6px 10px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3), inset 0 -2px 4px rgba(0,0,0,0.15) !important;"
                                    onclick="window.MyConfigManager?.goToCategory('diversidad')">
                                <svg class="w-16 h-16 fill-white" viewBox="0 0 24 24" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));">
                                    <path d="M20.5 6c-2.61.7-5.67 1-8.5 1s-5.89-.3-8.5-1L3 8c1.86.5 4 .83 6 1v13h2v-6h2v6h2V9c2-.17 4.14-.5 6-1l-.5-2zM12 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
                                </svg>
                                <span class="text-white text-sm mt-2 font-semibold">Diversidad</span>
                            </button>

                            <!-- Botón VERDE: Audio -->
                            <button class="myconfig-home-btn always-active-button w-32 h-32 bg-green-500 hover:bg-green-600 rounded-xl flex flex-col items-center justify-center transition-all hover:scale-110"
                                    style="opacity: 1.0 !important; box-shadow: 0 6px 10px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3), inset 0 -2px 4px rgba(0,0,0,0.15) !important;"
                                    onclick="window.MyConfigManager?.goToCategory('audio')">
                                <svg class="w-16 h-16 fill-white" viewBox="0 0 24 24" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));">
                                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                                </svg>
                                <span class="text-white text-sm mt-2 font-semibold">Audio</span>
                            </button>

                            <!-- Botón AMARILLO: Preferencias Visuales -->
                            <button class="myconfig-home-btn always-active-button w-32 h-32 bg-yellow-500 hover:bg-yellow-600 rounded-xl flex flex-col items-center justify-center transition-all hover:scale-110"
                                    style="opacity: 1.0 !important; box-shadow: 0 6px 10px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3), inset 0 -2px 4px rgba(0,0,0,0.15) !important;"
                                    onclick="window.MyConfigManager?.goToCategory('visuales')">
                                <svg class="w-16 h-16 fill-white" viewBox="0 0 24 24" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                </svg>
                                <span class="text-white text-sm mt-2 font-semibold">Visual</span>
                            </button>

                            <!-- Botón AZUL: Todas las opciones -->
                            <button class="myconfig-home-btn always-active-button w-32 h-32 bg-blue-500 hover:bg-blue-600 rounded-xl flex flex-col items-center justify-center transition-all hover:scale-110"
                                    style="opacity: 1.0 !important; box-shadow: 0 6px 10px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3), inset 0 -2px 4px rgba(0,0,0,0.15) !important;"
                                    onclick="window.MyConfigManager?.goToCategory('all')">
                                <svg class="w-16 h-16 fill-white" viewBox="0 0 24 24" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));">
                                    <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                                </svg>
                                <span class="text-white text-sm mt-2 font-semibold">Todas</span>
                            </button>
                        </div>
                    `;

                    this.scrollContainer.appendChild(homeScreen);
                }

                // Mostrar pantalla inicial
                homeScreen.style.display = 'flex';

                // Scroll del wrapper para ocultar las filas
                this.wrapper.style.transform = 'translateY(500px)';
            }

            /**
             * SUBMÓDULO: Ocultar pantalla inicial
             */
            hideHomeScreen() {
                if (!this.windowEl) return;

                const homeScreen = this.windowEl.querySelector('.myconfig-home-screen');
                if (homeScreen) {
                    homeScreen.style.display = 'none';
                }
            }

            /**
             * SUBMÓDULO: Ir a categoría específica desde pantalla inicial
             */
            goToCategory(category) {
                // Encontrar la primera fila de la categoría
                let targetIndex = 0;

                if (category === 'all') {
                    targetIndex = 0; // Ir a la primera fila
                } else {
                    for (let i = 0; i < this.rows.length; i++) {
                        if (this.rows[i].dataset.category === category) {
                            targetIndex = i;
                            break;
                        }
                    }
                }

                // Salir de pantalla inicial
                this.activeIndex = targetIndex;
                this.hideHomeScreen();
                this.activateRow(this.activeIndex);
                this.scrollToVisible();
            }

            /**
             * SUBMÓDULO: Limpieza al cerrar
             * Autocorregible y completo
             */
            cleanup() {
                // Limpiar eventos
                if (this.keyHandler) {
                    document.removeEventListener('keydown', this.keyHandler);
                    this.keyHandler = null;
                }

                // Limpiar referencias
                this.rows = null;
                this.scrollContainer = null;
                this.wrapper = null;
                this.windowEl = null;

                // Limpiar instancia global
                window.MyConfigManager = null;
            }
        }

        // ============================================
        // ATOMIC DESIGN SYSTEM - CONSTANTES
        // ============================================

        /**
         * Sistema de colores estándar (8 colores del Libro Blanco)
         * Clases Tailwind LITERALES completas para evitar generación dinámica
         */
        const COLORS = {
            red: 'bg-gradient-to-br from-red-50 to-red-100 dark:from-red-900/20 dark:to-red-800/30 border-red-600',
            green: 'bg-gradient-to-br from-green-50 to-green-100 dark:from-green-900/20 dark:to-green-800/30 border-green-600',
            yellow: 'bg-gradient-to-br from-yellow-50 to-yellow-100 dark:from-yellow-900/20 dark:to-yellow-800/30 border-yellow-600',
            blue: 'bg-gradient-to-br from-blue-50 to-blue-100 dark:from-blue-900/20 dark:to-blue-800/30 border-blue-600',
            orange: 'bg-gradient-to-br from-orange-50 to-orange-100 dark:from-orange-900/20 dark:to-orange-800/30 border-orange-600',
            purple: 'bg-gradient-to-br from-purple-50 to-purple-100 dark:from-purple-900/20 dark:to-purple-800/30 border-purple-600',
            gray: 'bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900/20 dark:to-gray-800/30 border-gray-600',
            pink: 'bg-gradient-to-br from-pink-50 to-pink-100 dark:from-pink-900/20 dark:to-pink-800/30 border-pink-600'
        };

        /**
         * ÁTOMOS - Componentes básicos reutilizables
         */
        const Atoms = {
            triangularButton({ direction = 'down', color = 'black', symbol = '↓', onClick = '', isActive = false }) {
                const borders = {
                    up: 'border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 80px solid',
                    down: 'border-left: 50px solid transparent; border-right: 50px solid transparent; border-top: 80px solid',
                    left: 'border-top: 30px solid transparent; border-bottom: 30px solid transparent; border-right: 45px solid',
                    right: 'border-top: 30px solid transparent; border-bottom: 30px solid transparent; border-left: 45px solid'
                };

                const colorValue = color === 'black' ? '#1a1a1a' : 'white';
                const shadowClass = color === 'black' ? 'volumetric-shadow-black' : 'volumetric-shadow-white';
                const symbolColor = color === 'black' ? 'text-white' : 'text-black';
                const activeClass = isActive ? 'default-active' : '';

                return `
                    <button onclick="${onClick}" class="${activeClass} ${shadowClass} hover:scale-110 transition-all"
                            style="width: 0; height: 0; ${borders[direction]} ${colorValue};" tabindex="0">
                        <div class="absolute text-3xl ${symbolColor} font-bold">${symbol}</div>
                    </button>
                `;
            },

            moduleCard({ color = 'blue', icon = '📦', title = '', description = '', onClick = '', isActive = true }) {
                const activeClass = isActive ? 'default-active' : '';
                const colorClasses = COLORS[color] || COLORS.blue;

                return `
                    <button onclick="${onClick}"
                            class="module-card ${activeClass} p-6 ${colorClasses}
                                   rounded-2xl shadow-lg overflow-hidden border-l-8
                                   hover:scale-105 transition-all cursor-pointer text-left">
                        <div class="text-5xl mb-3">${icon}</div>
                        <h3 class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-2">${title}</h3>
                        <p class="text-sm text-gray-600 dark:text-gray-400">${description}</p>
                    </button>
                `;
            },

            circularButton({ color = 'white', content = '←', onClick = '', label = '', size = 'medium' }) {
                const sizes = { small: 'w-12 h-12', medium: 'w-16 h-16', large: 'w-24 h-24' };
                const bgColors = {
                    white: 'bg-white',
                    orange: 'bg-orange-500',
                    purple: 'bg-purple-400',
                    black: 'bg-black'
                };
                const shadowClass = color === 'white' ? 'volumetric-shadow-white' : 'volumetric-shadow-black';

                return `
                    <div class="flex flex-col items-center gap-1">
                        <button onclick="${onClick}"
                                class="always-active-button ${sizes[size]} ${bgColors[color]} rounded-full ${shadowClass}
                                       flex items-center justify-center hover:scale-110 transition-all"
                                tabindex="0">
                            ${content}
                        </button>
                        ${label ? `<span class="text-xs font-medium text-gray-800 dark:text-gray-200">${label}</span>` : ''}
                    </div>
                `;
            }
        };

        /**
         * MOLÉCULAS - Combinación de átomos
         */
        const Molecules = {
            moduleHeader({ title = '', icon = '', description = '', color = 'blue', showBackButton = true, actionButtons = {} }) {
                const borderColors = {
                    red: 'bg-red-500',
                    green: 'bg-green-500',
                    yellow: 'bg-yellow-500',
                    blue: 'bg-blue-500',
                    orange: 'bg-orange-500',
                    purple: 'bg-purple-500',
                    gray: 'bg-gray-500',
                    pink: 'bg-pink-500'
                };

                // REGLA 13: Botones de acción en orden derecha a izquierda
                const buttons = [];
                if (showBackButton) {
                    buttons.push(`<button onclick="app.showMenu()" class="w-16 h-16 bg-black rounded-full flex items-center justify-center hover:scale-110 transition-all volumetric-shadow-black"><span class="text-white text-2xl font-bold">✕</span></button>`);
                }
                if (actionButtons.save) {
                    buttons.push(`<button onclick="${actionButtons.save}" class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center hover:scale-110 transition-all volumetric-shadow-black"><span class="text-white text-2xl font-bold">✓</span></button>`);
                }
                if (actionButtons.warning) {
                    buttons.push(`<button onclick="${actionButtons.warning}" class="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center hover:scale-110 transition-all volumetric-shadow-black"><span class="text-white text-2xl font-bold">!</span></button>`);
                }
                if (actionButtons.delete) {
                    buttons.push(`<button onclick="${actionButtons.delete}" class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center hover:scale-110 transition-all volumetric-shadow-black"><span class="text-white text-2xl font-bold">🗑</span></button>`);
                }

                return `
                    <div class="bg-gray-300 dark:bg-gray-700 rounded-2xl shadow-lg p-6 mb-6 flex items-center gap-6 relative">
                        <div class="absolute left-0 top-0 bottom-0 w-2 ${borderColors[color]} rounded-l-2xl"></div>
                        <div class="text-6xl ml-4">${icon}</div>
                        <div class="flex-1">
                            <h2 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-1">${title}</h2>
                            <p class="text-sm text-gray-600 dark:text-gray-400">${description}</p>
                        </div>
                        <div class="flex gap-3">
                            ${buttons.join('')}
                        </div>
                    </div>
                `;
            }
        };

        // ============================================
        // INITIALIZATION
        // ============================================

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new ModularApp();

            // Intentar cargar icono AVIA procesado desde caché
            // Si no existe, el usuario puede llamar manualmente a window.AVIAIconProcessor.processIcon()
            if (!AVIAIconProcessor.loadFromCache()) {
                console.log('ℹ️  Para procesar el icono AVIA (cambiar a blanco): window.AVIAIconProcessor.processIcon()');
            }
        });
    </script>
</body>
</html>
