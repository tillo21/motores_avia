        * { font-family: 'Inter', sans-serif; }
        
        /* Sistema de variables CSS para accesibilidad */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --font-size-base: 16px;
            --font-size-scale: 1;
        }
        
        /* Modo claro */
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #e2e8f0;
            --bg-tertiary: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }
        
        /* Alto contraste */
        [data-theme="high-contrast"] {
            --bg-primary: #000000;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #333333;
            --text-primary: #ffffff;
            --text-secondary: #ffff00;
            --accent-primary: #00ffff;
            --accent-secondary: #ff00ff;
        }
        
        /* Escala de fuente */
        [data-font-scale="large"] { --font-size-scale: 1.25; }
        [data-font-scale="xlarge"] { --font-size-scale: 1.5; }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: calc(var(--font-size-base) * var(--font-size-scale));
            transition: all 0.3s ease;
        }
        
        /* Animaciones */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
            50% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.6); }
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes slide-in {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fade-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
        .animate-gradient { 
            background-size: 200% 200%;
            animation: gradient-shift 3s ease infinite; 
        }
        .animate-slide-in { animation: slide-in 0.5s ease-out; }
        .animate-fade-up { animation: fade-up 0.4s ease-out; }
        
        /* Efecto ripple en botones */
        .btn-ripple {
            position: relative;
            overflow: hidden;
        }
        
        .btn-ripple::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: scale(0);
            pointer-events: none;
        }
        
        .btn-ripple:active::after {
            animation: ripple 0.6s linear;
        }
        
        /* Scrollbar personalizada */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { 
            background: var(--accent-primary); 
            border-radius: 4px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-secondary); }
        
        /* Focus visible para accesibilidad */
        *:focus-visible {
            outline: 3px solid var(--accent-primary);
            outline-offset: 2px;
        }
        
        /* Skip link para navegación por teclado */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--accent-primary);
            color: white;
            padding: 8px 16px;
            z-index: 100;
            transition: top 0.3s;
        }
        
        .skip-link:focus {
            top: 0;
        }
        
        /* Tarjetas de bots */
        .bot-card {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .bot-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--accent-primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .bot-card:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        
        /* Badges de categoría */
        .badge {
            font-size: calc(0.75rem * var(--font-size-scale));
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 500;
        }
        
        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slide-in 0.3s ease-out;
            max-width: 400px;
        }
        
        .toast-success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast-error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast-info { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .toast-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        /* Panel de accesibilidad */
        .a11y-panel {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 16px 0 0 16px;
            padding: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .a11y-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.2s;
        }
        
        .a11y-btn:hover {
            background: var(--accent-primary);
            transform: scale(1.1);
        }
        
        /* Modal mejorado */
        .modal-overlay {
            backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.7);
        }
        
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        /* Pestañas de navegación */
        .nav-tab {
            position: relative;
            padding: 12px 24px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        
        .nav-tab.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }
        
        .nav-tab:not(.active):hover {
            background: var(--bg-tertiary);
        }
        
        /* Diagrama SIESTA */
        .siesta-diagram {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 40px;
        }
        
        .siesta-node {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border: 2px solid var(--accent-primary);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .siesta-node:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        
        .siesta-central {
            grid-column: 2;
            grid-row: 2;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        /* Dashboard de vigilancia */
        .vigilance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .vigilance-card {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }
        
        .vigilance-card:hover {
            border-color: var(--accent-primary);
        }
        
        .source-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-size: 0.875rem;
        }
        
        /* Indicador de carga */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-tertiary);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Barra de progreso */
        .progress-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 4px;
            transition: width 0.5s ease;
        }
    </style>
</head>

        const SafeStorage = {
            data: {},
            getItem(key) {
                try {
                    return localStorage.getItem(key) || this.data[key] || null;
                } catch {
                    return this.data[key] || null;
                }
            },
            setItem(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch {
                    this.data[key] = value;
                }
            }
        };

        // Sistema de Toast Notifications
        function showToast(message, type = 'info', duration = 4000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
            container.appendChild(toast);
            
            // Anunciar para lectores de pantalla
            if (AppState.voiceEnabled) {
                speak(message);
            }
            
            setTimeout(() => {
                toast.style.animation = 'slide-in 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // Sistema de Voz
        function speak(text) {
            if ('speechSynthesis' in window && AppState.voiceEnabled) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themes = ['dark', 'light'];
            const currentIndex = themes.indexOf(body.dataset.theme);
            const nextTheme = themes[(currentIndex + 1) % themes.length];
            body.dataset.theme = nextTheme;
            SafeStorage.setItem('avia-theme', nextTheme);
            showToast(`Tema cambiado a: ${nextTheme === 'dark' ? 'Oscuro' : 'Claro'}`, 'info');
        }

        function toggleContrast() {
            const body = document.body;
            if (body.dataset.theme === 'high-contrast') {
                body.dataset.theme = 'dark';
                showToast('Alto contraste desactivado', 'info');
            } else {
                body.dataset.theme = 'high-contrast';
                showToast('Alto contraste activado', 'success');
            }
        }

        function increaseFontSize() {
            const body = document.body;
            const scales = ['normal', 'large', 'xlarge'];
            const currentIndex = scales.indexOf(body.dataset.fontScale);
            if (currentIndex < scales.length - 1) {
                body.dataset.fontScale = scales[currentIndex + 1];
                showToast('Texto aumentado', 'info');
            } else {
                showToast('Tamaño máximo alcanzado', 'warning');
            }
        }

        function decreaseFontSize() {
            const body = document.body;
            const scales = ['normal', 'large', 'xlarge'];
            const currentIndex = scales.indexOf(body.dataset.fontScale);
            if (currentIndex > 0) {
                body.dataset.fontScale = scales[currentIndex - 1];
                showToast('Texto reducido', 'info');
            } else {
                showToast('Tamaño mínimo alcanzado', 'warning');
            }
        }

                    class="bot-card rounded-2xl p-6 cursor-pointer animate-fade-up"
                    style="animation-delay: ${index * 50}ms;"
                    onclick="selectBot('${bot.id}')"
                    tabindex="0"
                    role="button"
                    aria-label="Ver detalles de ${bot.name}"
                    onkeydown="if(event.key === 'Enter') selectBot('${bot.id}')"
                >
                    <!-- Header -->
                    <div class="flex items-start justify-between mb-4">
                        <div class="text-4xl">${bot.emoji}</div>
                        <div class="flex items-center gap-2">
                            <span class="${statusColors[bot.status]} w-2 h-2 rounded-full animate-pulse" title="${bot.status}"></span>
                            <span class="badge bg-gradient-to-r ${category.color} text-white">
                                ${category.emoji} ${category.name}
                            </span>
                        </div>
                    </div>
                    
                    <!-- Título y descripción -->
                    <h3 class="text-xl font-bold mb-2">${bot.name}</h3>
                    <p class="text-sm mb-4 line-clamp-2" style="color: var(--text-secondary);">
                        ${bot.description}
                    </p>
                    
                    <!-- Features preview -->
                    <div class="flex flex-wrap gap-1 mb-4">
                        ${bot.features.slice(0, 3).map(f => `
                            <span class="text-xs px-2 py-1 rounded-full" style="background: var(--bg-tertiary); color: var(--text-secondary);">
                                ${f}
                            </span>
                        `).join('')}
                        ${bot.features.length > 3 ? `
                            <span class="text-xs px-2 py-1 rounded-full text-blue-400">
                                +${bot.features.length - 3} más
                            </span>
                        ` : ''}
                    </div>
                    
                    <!-- Métricas -->
                    <div class="flex justify-between text-xs" style="color: var(--text-secondary);">
                        <span>👥 ${(bot.metrics.users / 1000).toFixed(1)}K usuarios</span>
                        <span>⭐ ${bot.metrics.satisfaction}% satisfacción</span>
                    </div>
                    
                    <!-- Barra de progreso de uso -->
                    <div class="mt-3 progress-bar">
                        <div class="progress-fill" style="width: ${Math.min(bot.metrics.satisfaction, 100)}%;"></div>
                    </div>
                </article>
            `;
        }

        function renderSiesta() {
            return `
                <section id="panel-siesta" role="tabpanel" aria-labelledby="tab-siesta" class="animate-fade-up">
                    <!-- Header SIESTA -->
                    <div class="text-center mb-12">
                        <h2 class="text-4xl font-bold mb-4 bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 bg-clip-text text-transparent">
                            🛌 Marco Metodológico SIESTA
                        </h2>
                        <p class="text-lg max-w-3xl mx-auto" style="color: var(--text-secondary);">
                            Sistema Integrado de e-Servicios y Tecnologías de Ayuda - El corazón de la constelación AVIA
                        </p>
                    </div>
                    
                    <!-- Diagrama SIESTA Interactivo -->
                    <div class="max-w-4xl mx-auto mb-12">
                        <div class="grid grid-cols-3 gap-4">
                            ${siestaComponents.map((comp, i) => `
                                <div class="siesta-node ${i === 2 ? 'col-span-3 md:col-span-1' : ''}" 
                                     tabindex="0"
                                     onclick="showToast('${comp.name}: ${comp.desc}', 'info')">
                                    <div class="text-3xl mb-2">${comp.emoji}</div>
                                    <div class="text-2xl font-bold text-blue-400">${comp.id === 'S2' ? 'S' : comp.id}</div>
                                    <div class="font-semibold">${comp.name}</div>
                                    <div class="text-sm mt-2" style="color: var(--text-secondary);">${comp.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <!-- Rúbricas AVIA -->
                    <div class="max-w-4xl mx-auto">
                        <h3 class="text-2xl font-bold mb-6 text-center">📋 Rúbricas de Evaluación AVIA</h3>
                        <div class="grid md:grid-cols-2 gap-6">
                            ${renderRubrica('Accesibilidad', 95, ['WCAG 2.1 AA', 'Navegación por teclado', 'Lectores de pantalla', 'Alto contraste'], '♿')}
                            ${renderRubrica('Usabilidad', 92, ['Interfaz intuitiva', 'Tiempo de aprendizaje <5min', 'Tasa de error <2%', 'Satisfacción >90%'], '🎯')}
                            ${renderRubrica('Ética', 98, ['Privacidad por diseño', 'Sin sesgos detectados', 'Transparencia algorítmica', 'Consentimiento informado'], '⚖️')}
                            ${renderRubrica('Impacto', 89, ['Reducción brecha digital', 'Mejora bienestar', 'Inclusión efectiva', 'Escalabilidad'], '🌍')}
                        </div>
                    </div>
                    
                    <!-- Estadísticas globales -->
                    <div class="max-w-4xl mx-auto mt-12">
                        <h3 class="text-2xl font-bold mb-6 text-center">📊 Impacto de la Constelación</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="text-center p-6 rounded-xl" style="background: var(--bg-secondary);">
                                <div class="text-4xl font-bold text-blue-400">${botsData.length}</div>
                                <div style="color: var(--text-secondary);">Bots activos</div>
                            </div>
                            <div class="text-center p-6 rounded-xl" style="background: var(--bg-secondary);">
                                <div class="text-4xl font-bold text-green-400">${Math.round(botsData.reduce((a, b) => a + b.metrics.users, 0) / 1000)}K</div>
                                <div style="color: var(--text-secondary);">Usuarios totales</div>
                            </div>
                            <div class="text-center p-6 rounded-xl" style="background: var(--bg-secondary);">
                                <div class="text-4xl font-bold text-purple-400">${Math.round(botsData.reduce((a, b) => a + b.metrics.sessions, 0) / 1000)}K</div>
                                <div style="color: var(--text-secondary);">Sesiones</div>
                            </div>
                            <div class="text-center p-6 rounded-xl" style="background: var(--bg-secondary);">
                                <div class="text-4xl font-bold text-pink-400">${Math.round(botsData.reduce((a, b) => a + b.metrics.satisfaction, 0) / botsData.length)}%</div>
                                <div style="color: var(--text-secondary);">Satisfacción media</div>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        function renderRubrica(nombre, puntuacion, criterios, emoji) {
            return `
                <div class="p-6 rounded-xl" style="background: var(--bg-secondary);">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">${emoji}</span>
                            <span class="font-bold text-lg">${nombre}</span>
                        </div>
                        <span class="text-2xl font-bold ${puntuacion >= 90 ? 'text-green-400' : puntuacion >= 70 ? 'text-yellow-400' : 'text-red-400'}">
                            ${puntuacion}%
                        </span>
                    </div>
                    <div class="progress-bar mb-4">
                        <div class="progress-fill" style="width: ${puntuacion}%;"></div>
                    </div>
                    <ul class="space-y-1">
                        ${criterios.map(c => `
                            <li class="flex items-center gap-2 text-sm" style="color: var(--text-secondary);">
                                <span class="text-green-400">✓</span> ${c}
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
        }

        function renderVigilancia() {
            return `
                <section id="panel-vigilancia" role="tabpanel" aria-labelledby="tab-vigilancia" class="animate-fade-up">
                    <!-- Header Vigilancia -->
                    <div class="text-center mb-12">
                        <h2 class="text-4xl font-bold mb-4 bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 bg-clip-text text-transparent">
                            📡 AVIA Transmedia Vigilance
                        </h2>
                        <p class="text-lg max-w-3xl mx-auto" style="color: var(--text-secondary);">
                            Monitoreo continuo de fuentes académicas y tecnológicas para mantener la constelación actualizada
                        </p>
                    </div>
                    
                    <!-- Grid de Fuentes -->
                    <div class="vigilance-grid mb-12">
                        ${vigilanceSources.map(source => renderSourceCard(source)).join('')}
                    </div>
                    
                    <!-- Alertas Recientes -->
                    <div class="max-w-4xl mx-auto">
                        <h3 class="text-2xl font-bold mb-6 text-center">🔔 Alertas Recientes</h3>
                        <div class="space-y-4">
                            ${renderAlerts()}
                        </div>
                    </div>
                    
                    <!-- Configuración de Alertas -->
                    <div class="max-w-4xl mx-auto mt-12">
                        <h3 class="text-2xl font-bold mb-6 text-center">⚙️ Configuración de Vigilancia</h3>
                        <div class="grid md:grid-cols-3 gap-4">
                            <div class="p-6 rounded-xl text-center cursor-pointer hover:scale-105 transition-all" 
                                 style="background: var(--bg-secondary);"
                                 onclick="showToast('Configuración de keywords guardada', 'success')">
                                <div class="text-3xl mb-2">🔑</div>
                                <div class="font-semibold">Keywords</div>
                                <div class="text-sm" style="color: var(--text-secondary);">Accesibilidad, IA ética, Inclusión digital</div>
                            </div>
                            <div class="p-6 rounded-xl text-center cursor-pointer hover:scale-105 transition-all" 
                                 style="background: var(--bg-secondary);"
                                 onclick="showToast('Frecuencia actualizada', 'success')">
                                <div class="text-3xl mb-2">⏰</div>
                                <div class="font-semibold">Frecuencia</div>
                                <div class="text-sm" style="color: var(--text-secondary);">Diaria • Semanal • Mensual</div>
                            </div>
                            <div class="p-6 rounded-xl text-center cursor-pointer hover:scale-105 transition-all" 
                                 style="background: var(--bg-secondary);"
                                 onclick="showToast('Canales configurados', 'success')">
                                <div class="text-3xl mb-2">📬</div>
                                <div class="font-semibold">Canales</div>
                                <div class="text-sm" style="color: var(--text-secondary);">Email • Push • Dashboard</div>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        function renderSourceCard(source) {
            return `
                <div class="vigilance-card">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">${source.emoji}</span>
                            <div>
                                <h4 class="font-bold">${source.name}</h4>
                                <span class="text-xs" style="color: var(--text-secondary);">Actualizado: ${source.lastUpdate}</span>
                            </div>
                        </div>
                        <a href="${source.url}" target="_blank" rel="noopener" 
                           class="px-3 py-1 rounded-lg text-sm bg-blue-500 hover:bg-blue-600 transition-all"
                           onclick="event.stopPropagation(); showToast('Abriendo ${source.name}...', 'info')">
                            🔗 Visitar
                        </a>
                    </div>
                    <p class="text-sm mb-4" style="color: var(--text-secondary);">
                        <strong>Foco:</strong> ${source.focus}
                    </p>
                    <div class="space-y-2">
                        <div class="text-xs font-semibold" style="color: var(--text-secondary);">Últimas alertas:</div>
                        ${source.alerts.map(alert => `
                            <div class="source-badge">
                                <span class="text-yellow-400">⚡</span>
                                <span>${alert}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAlerts() {
            const allAlerts = vigilanceSources.flatMap(source => 
                source.alerts.map(alert => ({
                    alert,
                    source: source.name,
                    emoji: source.emoji,
                    date: source.lastUpdate
                }))
            ).slice(0, 6);
            
            return allAlerts.map(item => `
                <div class="flex items-center gap-4 p-4 rounded-xl transition-all hover:scale-102" style="background: var(--bg-secondary);">
                    <span class="text-2xl">${item.emoji}</span>
                    <div class="flex-grow">
                        <div class="font-medium">${item.alert}</div>
                        <div class="text-sm" style="color: var(--text-secondary);">Fuente: ${item.source} • ${item.date}</div>
                    </div>
                    <button class="px-4 py-2 rounded-lg bg-blue-500 hover:bg-blue-600 text-sm transition-all"
                            onclick="showToast('Alerta marcada como leída', 'success')">
                        Ver más
                    </button>
                </div>
            `).join('');
        }

        function renderModal() {
            const bot = botsData.find(b => b.id === AppState.selectedBot);
            if (!bot) return '';
            
            const category = categories[bot.category];
            
            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" 
                     onclick="closeModal(event)"
                     role="dialog"
                     aria-modal="true"
                     aria-labelledby="modal-title">
                    <div class="modal-content w-full max-w-2xl rounded-2xl p-8 animate-fade-up" onclick="event.stopPropagation()">
                        <!-- Close button -->
                        <button 
                            class="absolute top-4 right-4 w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-700 transition-all"
                            onclick="closeModal()"
                            aria-label="Cerrar modal">
                            ✕
                        </button>
                        
                        <!-- Header -->
                        <div class="flex items-start gap-6 mb-6">
                            <div class="text-6xl animate-float">${bot.emoji}</div>
                            <div class="flex-grow">
                                <div class="flex items-center gap-3 mb-2">
                                    <h2 id="modal-title" class="text-3xl font-bold">${bot.name}</h2>
                                    <span class="badge bg-gradient-to-r ${category.color} text-white">
                                        ${category.emoji} ${category.name}
                                    </span>
                                </div>
                                <p style="color: var(--text-secondary);">${bot.description}</p>
                                <div class="mt-2 text-sm" style="color: var(--text-secondary);">
                                    v${bot.version} • ${bot.status === 'active' ? '🟢 Activo' : bot.status === 'beta' ? '🟡 Beta' : '🔵 En desarrollo'}
                                </div>
                            </div>
                        </div>
                        
                        <!-- Métricas -->
                        <div class="grid grid-cols-3 gap-4 mb-6">
                            <div class="text-center p-4 rounded-xl" style="background: var(--bg-tertiary);">
                                <div class="text-2xl font-bold text-blue-400">${(bot.metrics.users / 1000).toFixed(1)}K</div>
                                <div class="text-sm" style="color: var(--text-secondary);">Usuarios</div>
                            </div>
                            <div class="text-center p-4 rounded-xl" style="background: var(--bg-tertiary);">
                                <div class="text-2xl font-bold text-green-400">${bot.metrics.satisfaction}%</div>
                                <div class="text-sm" style="color: var(--text-secondary);">Satisfacción</div>
                            </div>
                            <div class="text-center p-4 rounded-xl" style="background: var(--bg-tertiary);">
                                <div class="text-2xl font-bold text-purple-400">${(bot.metrics.sessions / 1000).toFixed(1)}K</div>
                                <div class="text-sm" style="color: var(--text-secondary);">Sesiones</div>
                            </div>
                        </div>
                        
                        <!-- Features -->
                        <div class="mb-6">
                            <h3 class="font-semibold mb-3">✨ Funcionalidades</h3>
                            <div class="flex flex-wrap gap-2">
                                ${bot.features.map(f => `
                                    <span class="px-3 py-1 rounded-full text-sm" style="background: var(--bg-tertiary);">
                                        ${f}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- Target Audience -->
                        <div class="mb-6">
                            <h3 class="font-semibold mb-3">👥 Público Objetivo</h3>
                            <div class="flex flex-wrap gap-2">
                                ${bot.targetAudience.map(t => `
                                    <span class="px-3 py-1 rounded-full text-sm bg-blue-500/20 text-blue-300">
                                        ${t}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- Accessibility -->
                        <div class="mb-6">
                            <h3 class="font-semibold mb-3">♿ Accesibilidad</h3>
                            <div class="flex flex-wrap gap-2">
                                ${bot.accessibility.map(a => `
                                    <span class="px-3 py-1 rounded-full text-sm bg-green-500/20 text-green-300">
                                        ✓ ${a}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- AI Models -->
                        <div class="mb-6">
                            <h3 class="font-semibold mb-3">🤖 Modelos IA</h3>
                            <div class="flex flex-wrap gap-2">
                                ${bot.aiModels.map(m => `
                                    <span class="px-3 py-1 rounded-full text-sm bg-purple-500/20 text-purple-300">
                                        ${m}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="flex flex-wrap gap-4 mt-8">
                            <button 
                                class="flex-grow px-6 py-3 rounded-xl font-semibold bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 transition-all btn-ripple"
                                onclick="activateBot('${bot.id}')">
                                🚀 Activar Bot
                            </button>
                            <button 
                                class="px-6 py-3 rounded-xl font-semibold transition-all hover:bg-gray-600 btn-ripple"
                                style="background: var(--bg-tertiary);"
                                onclick="openDocumentation('${bot.id}')">
                                📄 Documentación
                            </button>
                            <button 
                                class="px-6 py-3 rounded-xl font-semibold transition-all hover:bg-gray-600 btn-ripple"
                                style="background: var(--bg-tertiary);"
                                onclick="shareBot('${bot.id}')">
                                📤 Compartir
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== FUNCIONES DE INTERACCIÓN =====
        
        function setActiveTab(tab) {
            AppState.activeTab = tab;
            renderApp();
            if (AppState.voiceEnabled) {
                speak(`Navegando a la sección ${tab}`);
            }
        }

        function setCategory(category) {
            AppState.categoryFilter = category;
            renderApp();
        }

        function selectBot(botId) {
            AppState.selectedBot = botId;
            renderApp();
            const bot = botsData.find(b => b.id === botId);
            if (bot && AppState.voiceEnabled) {
                speak(`${bot.name}. ${bot.description}`);
            }
        }

        function closeModal(event) {
            if (!event || event.target === event.currentTarget) {
                AppState.selectedBot = null;
                renderApp();
            }
        }

        function clearSearch() {
            AppState.searchTerm = '';
            AppState.categoryFilter = 'all';
            renderApp();
        }

        function activateBot(botId) {
            const bot = botsData.find(b => b.id === botId);
            if (bot) {
                showToast(`🚀 ${bot.name} activado correctamente!`, 'success');
                // Aquí iría la integración con Poe API
                // poe.sendUserMessage(`Activar ${bot.name}`);
            }
        }

        function openDocumentation(botId) {
            const bot = botsData.find(b => b.id === botId);
            if (bot) {
                showToast(`📄 Abriendo documentación de ${bot.name}...`, 'info');
                // En producción abriría la documentación real
            }
        }

        function shareBot(botId) {
            const bot = botsData.find(b => b.id === botId);
            if (bot) {
                const shareText = `Descubre ${bot.name} ${bot.emoji} - ${bot.description}`;
                if (navigator.share) {
                    navigator.share({
                        title: bot.name,
                        text: shareText,
                        url: window.location.href
                    });
                } else {
                    navigator.clipboard.writeText(shareText);
                    showToast('📋 Enlace copiado al portapapeles', 'success');
                }
            }
        }

        // ===== EVENT LISTENERS =====
        
        function attachEventListeners() {
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    AppState.searchTerm = e.target.value;
                    renderApp();
                });
            }
            
            // Navegación por teclado
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && AppState.selectedBot) {
                    closeModal();
                }
            });
        }

        // ===== INICIALIZACIÓN =====
        
        function init() {
            // Cargar preferencias guardadas
            const savedTheme = SafeStorage.getItem('avia-theme');
            if (savedTheme) {
                document.body.dataset.theme = savedTheme;
            }
            
            // Detectar preferencia de movimiento reducido
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                AppState.reducedMotion = true;
            }
            
            // Detectar preferencia de color scheme
            if (window.matchMedia('(prefers-color-scheme: light)').matches && !savedTheme) {
                document.body.dataset.theme = 'light';
            }
            
            renderApp();
            
            // Mensaje de bienvenida
            setTimeout(() => {
                showToast('🌟 ¡Bienvenido a AVIA Studio v2! Explora la constelación de bots accesibles.', 'info', 5000);
            }, 1000);
        }

        // Iniciar aplicación
        init();
    </script>
</body>
</html>
