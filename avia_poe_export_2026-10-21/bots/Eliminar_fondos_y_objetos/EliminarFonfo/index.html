<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminador de Fondos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE'
                    }
                }
            },
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-900 min-h-screen transition-colors">
    <!-- Dark mode detection -->
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">
                Eliminador de Fondos
            </h1>
            <p class="text-gray-600 dark:text-gray-300">
                Sube una imagen y elimina su fondo automáticamente
            </p>
        </div>

        <!-- Upload Area -->
        <div class="mb-8">
            <div id="uploadArea" 
                 class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-8 text-center hover:border-primary dark:hover:border-primary transition-colors cursor-pointer">
                <div id="uploadContent">
                    <svg class="mx-auto h-12 w-12 text-gray-400 dark:text-gray-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p class="text-lg font-medium text-gray-700 dark:text-gray-300 mb-2">
                        Arrastra tu imagen aquí
                    </p>
                    <p class="text-gray-500 dark:text-gray-400 mb-4">
                        o haz clic para seleccionar
                    </p>
                    <p class="text-sm text-gray-400 dark:text-gray-500">
                        Formatos soportados: JPG, PNG, WebP
                    </p>
                </div>
            </div>
            <input type="file" id="fileInput" class="hidden" accept="image/*">
        </div>

        <!-- Processing Status -->
        <div id="processingStatus" class="hidden mb-8">
            <div class="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-700 rounded-lg p-4">
                <div class="flex items-center">
                    <div class="animate-spin rounded-full h-5 w-5 border-2 border-blue-500 border-t-transparent mr-3"></div>
                    <span class="text-blue-700 dark:text-blue-300">Procesando imagen...</span>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden mb-8">
            <div class="bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-700 rounded-lg p-4">
                <div class="flex items-center">
                    <svg class="h-5 w-5 text-red-500 mr-3" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                    <span id="errorText" class="text-red-700 dark:text-red-300"></span>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div id="resultsContainer" class="hidden">
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Original Image -->
                <div class="space-y-4">
                    <h3 class="text-xl font-semibold text-gray-800 dark:text-white">
                        Imagen Original
                    </h3>
                    <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-4">
                        <img id="originalImage" class="w-full h-auto rounded-lg shadow-md" alt="Imagen original">
                    </div>
                </div>

                <!-- Processed Image -->
                <div class="space-y-4">
                    <h3 class="text-xl font-semibold text-gray-800 dark:text-white">
                        Sin Fondo
                    </h3>
                    <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-4 relative">
                        <!-- Checkered background to show transparency -->
                        <div class="absolute inset-4 opacity-20"
                             style="background-image: repeating-conic-gradient(#808080 0% 25%, transparent 0% 50%);
                                    background-size: 20px 20px;">
                        </div>
                        <img id="processedImage" class="w-full h-auto rounded-lg shadow-md relative z-10" alt="Imagen sin fondo">
                    </div>
                    <button id="downloadBtn" 
                            class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        <span>Descargar Imagen</span>
                    </button>
                </div>
            </div>

            <!-- New Image Button -->
            <div class="text-center mt-8">
                <button id="newImageBtn" 
                        class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 font-medium py-2 px-6 rounded-lg transition-colors">
                    Procesar Nueva Imagen
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentFile = null;
        let processedImageUrl = null;

        // DOM elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processingStatus = document.getElementById('processingStatus');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const resultsContainer = document.getElementById('resultsContainer');
        const originalImage = document.getElementById('originalImage');
        const processedImage = document.getElementById('processedImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const newImageBtn = document.getElementById('newImageBtn');

        // Upload area interactions
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-primary', 'bg-primary/5');
        });
        
        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-primary', 'bg-primary/5');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-primary', 'bg-primary/5');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelection(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelection(e.target.files[0]);
            }
        });

        function handleFileSelection(file) {
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showError('Por favor selecciona un archivo de imagen válido.');
                return;
            }

            // Validate file size (max 10MB)
            if (file.size > 10 * 1024 * 1024) {
                showError('El archivo es demasiado grande. Máximo 10MB.');
                return;
            }

            currentFile = file;
            processImage();
        }

        async function processImage() {
            if (!currentFile) return;

            // Hide previous results and errors
            hideAllMessages();
            
            // Show processing status
            processingStatus.classList.remove('hidden');

            // Show original image preview
            const originalUrl = URL.createObjectURL(currentFile);
            originalImage.src = originalUrl;

            try {
                await window.Poe.sendUserMessage(
                    "@remove-background Remove background from this image",
                    {
                        attachments: [currentFile],
                        handler: "background-remover",
                        stream: false,
                        openChat: false
                    }
                );
            } catch (error) {
                console.error('Error sending message:', error);
                hideProcessingStatus();
                showError('Error al procesar la imagen: ' + error.message);
            }
        }

        // Register handler for background removal response
        window.Poe.registerHandler("background-remover", (result) => {
            const response = result.responses[0];

            if (response.status === "error") {
                hideProcessingStatus();
                showError("Error al procesar la imagen: " + (response.statusText || "Error desconocido"));
                return;
            }

            if (response.status === "complete") {
                hideProcessingStatus();
                
                if (response.attachments && response.attachments.length > 0) {
                    const imageAttachment = response.attachments[0];
                    processedImageUrl = imageAttachment.url;
                    processedImage.src = processedImageUrl;
                    
                    // Show results
                    resultsContainer.classList.remove('hidden');
                } else {
                    showError("No se pudo procesar la imagen. Inténtalo con otra imagen.");
                }
            }
        });

        // Download functionality
        downloadBtn.addEventListener('click', async () => {
            if (!processedImageUrl) return;

            try {
                const response = await fetch(processedImageUrl);
                const blob = await response.blob();
                
                const fileName = currentFile.name.replace(/\.[^/.]+$/, '_sin_fondo.png');
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Error downloading image:', error);
                showError('Error al descargar la imagen.');
            }
        });

        // New image functionality
        newImageBtn.addEventListener('click', () => {
            resetApp();
        });

        function resetApp() {
            currentFile = null;
            processedImageUrl = null;
            fileInput.value = '';
            hideAllMessages();
            resultsContainer.classList.add('hidden');
            
            // Clean up object URLs
            if (originalImage.src.startsWith('blob:')) {
                URL.revokeObjectURL(originalImage.src);
            }
        }

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function hideProcessingStatus() {
            processingStatus.classList.add('hidden');
        }

        function hideAllMessages() {
            processingStatus.classList.add('hidden');
            errorMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
