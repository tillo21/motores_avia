<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Fondo de Imagen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-white dark:bg-[#181818] min-h-screen transition-colors duration-200">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-2">
                Eliminar Fondo de Imagen
            </h1>
            <p class="text-gray-600 dark:text-gray-400 text-base">
                Sube una imagen y elimina su fondo automáticamente
            </p>
        </div>

        <!-- Upload Section -->
        <div class="bg-gray-50 dark:bg-gray-900 rounded-lg p-6 mb-6 shadow-lg">
            <div class="mb-4">
                <label class="block text-gray-700 dark:text-gray-300 font-semibold mb-2 text-base">
                    Seleccionar Imagen
                </label>
                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    class="w-full text-base text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent p-2"
                >
            </div>

            <!-- Preview Section -->
            <div id="previewSection" class="hidden mb-4">
                <p class="text-gray-700 dark:text-gray-300 font-semibold mb-2 text-base">Vista Previa</p>
                <div class="flex justify-center">
                    <img id="previewImage" class="max-w-full h-auto rounded-lg shadow-md max-h-96" alt="Vista previa">
                </div>
            </div>

            <button
                id="processButton"
                disabled
                class="w-full bg-primary hover:bg-purple-700 disabled:bg-gray-400 dark:disabled:bg-gray-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 text-base disabled:cursor-not-allowed"
            >
                Eliminar Fondo
            </button>
        </div>

        <!-- Processing State -->
        <div id="processingState" class="hidden bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-lg p-6 mb-6">
            <div class="flex items-center justify-center">
                <svg class="spinner h-8 w-8 text-primary mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-gray-700 dark:text-gray-300 font-medium text-base">Procesando imagen...</span>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg p-6 mb-6">
            <div class="flex items-start">
                <svg class="h-6 w-6 text-red-500 mr-3 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div>
                    <h3 class="text-red-800 dark:text-red-300 font-semibold mb-1 text-base">Error</h3>
                    <p id="errorMessage" class="text-red-700 dark:text-red-400 text-base"></p>
                </div>
            </div>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden bg-gray-50 dark:bg-gray-900 rounded-lg p-6 shadow-lg">
            <div class="mb-4">
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Resultado</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Original Image -->
                    <div>
                        <p class="text-gray-700 dark:text-gray-300 font-semibold mb-2 text-base">Imagen Original</p>
                        <div class="bg-white dark:bg-gray-800 rounded-lg p-4">
                            <img id="originalImage" class="w-full h-auto rounded-lg" alt="Original">
                        </div>
                    </div>
                    <!-- Result Image -->
                    <div>
                        <p class="text-gray-700 dark:text-gray-300 font-semibold mb-2 text-base">Sin Fondo</p>
                        <div class="bg-white dark:bg-gray-800 rounded-lg p-4 checkerboard">
                            <img id="resultImage" class="w-full h-auto rounded-lg" alt="Resultado">
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <a
                    id="downloadButton"
                    download="sin-fondo.png"
                    class="flex-1 bg-primary hover:bg-purple-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 text-center text-base cursor-pointer"
                >
                    Descargar Imagen
                </a>
                <button
                    id="newImageButton"
                    class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 text-base"
                >
                    Procesar Otra Imagen
                </button>
            </div>
        </div>
    </div>

    <style>
        .checkerboard {
            background-image:
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .dark .checkerboard {
            background-image:
                linear-gradient(45deg, #374151 25%, transparent 25%),
                linear-gradient(-45deg, #374151 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #374151 75%),
                linear-gradient(-45deg, transparent 75%, #374151 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>

    <script>
        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // Elements
        const imageInput = document.getElementById('imageInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const processButton = document.getElementById('processButton');
        const processingState = document.getElementById('processingState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');
        const resultSection = document.getElementById('resultSection');
        const originalImage = document.getElementById('originalImage');
        const resultImage = document.getElementById('resultImage');
        const downloadButton = document.getElementById('downloadButton');
        const newImageButton = document.getElementById('newImageButton');

        let selectedFile = null;

        // Handle file selection
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewSection.classList.remove('hidden');
                    processButton.disabled = false;
                };
                reader.readAsDataURL(file);
            } else {
                selectedFile = null;
                previewSection.classList.add('hidden');
                processButton.disabled = true;
            }
        });

        // Register handler for bot response
        window.Poe.registerHandler("background-remover", (result) => {
            const msg = result.responses[0];

            if (msg.status === "error") {
                processingState.classList.add('hidden');
                errorMessage.textContent = msg.statusText || "Ocurrió un error al procesar la imagen";
                errorState.classList.remove('hidden');
            } else if (msg.status === "complete") {
                processingState.classList.add('hidden');

                if (msg.attachments && msg.attachments.length > 0) {
                    const imageAttachment = msg.attachments[0];
                    resultImage.src = imageAttachment.url;
                    downloadButton.href = imageAttachment.url;
                    resultSection.classList.remove('hidden');
                } else {
                    errorMessage.textContent = "No se pudo obtener la imagen procesada";
                    errorState.classList.remove('hidden');
                }
            }
        });

        // Process image
        processButton.addEventListener('click', async () => {
            if (!selectedFile) return;

            // Hide previous results/errors
            errorState.classList.add('hidden');
            resultSection.classList.add('hidden');

            // Show processing state
            processingState.classList.remove('hidden');

            // Store original image for comparison
            originalImage.src = previewImage.src;

            try {
                await window.Poe.sendUserMessage(
                    "@remove-background Remove background from this image",
                    {
                        attachments: [selectedFile],
                        handler: "background-remover",
                        stream: false,
                        openChat: false
                    }
                );
            } catch (err) {
                processingState.classList.add('hidden');

                let errorText = "Error al enviar la imagen";
                if (err.errorType === "USER_REJECTED_CONFIRMATION") {
                    errorText = "Cancelaste la confirmación";
                } else if (err.errorType === "INVALID_INPUT") {
                    errorText = "Entrada inválida. Por favor selecciona una imagen válida";
                } else if (err.message) {
                    errorText = err.message;
                }

                errorMessage.textContent = errorText;
                errorState.classList.remove('hidden');
            }
        });

        // Process another image
        newImageButton.addEventListener('click', () => {
            resultSection.classList.add('hidden');
            errorState.classList.add('hidden');
            imageInput.value = '';
            selectedFile = null;
            previewSection.classList.add('hidden');
            processButton.disabled = true;
        });
    </script>
</body>
</html>
