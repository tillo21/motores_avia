<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrquestaDeAgentes - Sistema AVIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin { animation: spin 1s linear infinite; }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="p-3 gradient-bg rounded-xl">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-4xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                            OrquestaDeAgentes
                        </h1>
                        <p class="text-gray-600 mt-1">Sistema de Orquestación Inteligente AVIA</p>
                    </div>
                </div>
                <button id="btnOrquestar" class="flex items-center gap-2 px-6 py-3 gradient-bg text-white rounded-xl hover:opacity-90 transition-all shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>Ejecutar Orquestación</span>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="p-5 bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl border border-blue-200">
                    <div class="flex items-center gap-3 mb-2">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <span class="font-semibold text-blue-900">Multimedia</span>
                    </div>
                    <div class="text-3xl font-bold text-blue-900" id="countMultimedia">0</div>
                    <p class="text-sm text-blue-700 mt-1">Archivos procesados</p>
                </div>

                <div class="p-5 bg-gradient-to-br from-green-50 to-green-100 rounded-xl border border-green-200">
                    <div class="flex items-center gap-3 mb-2">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                        <span class="font-semibold text-green-900">Enlaces</span>
                    </div>
                    <div class="text-3xl font-bold text-green-900" id="countEnlaces">0</div>
                    <p class="text-sm text-green-700 mt-1">URLs analizadas</p>
                </div>

                <div class="p-5 bg-gradient-to-br from-purple-50 to-purple-100 rounded-xl border border-purple-200">
                    <div class="flex items-center gap-3 mb-2">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <span class="font-semibold text-purple-900">Transcripciones</span>
                    </div>
                    <div class="text-3xl font-bold text-purple-900" id="countTranscripciones">0</div>
                    <p class="text-sm text-purple-700 mt-1">Generadas por IA</p>
                </div>
            </div>

            <div class="flex gap-2 mb-6 border-b border-gray-200" id="tabs">
                <button class="tab-btn px-6 py-3 font-medium text-indigo-600 border-b-2 border-indigo-600" data-tab="multimedia">Multimedia</button>
                <button class="tab-btn px-6 py-3 font-medium text-gray-600" data-tab="enlaces">Enlaces</button>
                <button class="tab-btn px-6 py-3 font-medium text-gray-600" data-tab="agentes">Agentes</button>
                <button class="tab-btn px-6 py-3 font-medium text-gray-600" data-tab="logs">Logs</button>
            </div>

            <div id="tabContent">
                <div id="tab-multimedia" class="tab-content">
                    <label class="flex flex-col items-center justify-center p-8 border-2 border-dashed border-indigo-300 rounded-xl bg-indigo-50 hover:bg-indigo-100 transition-colors cursor-pointer">
                        <svg class="w-12 h-12 text-indigo-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <span class="text-lg font-medium text-indigo-900">Subir archivos multimedia</span>
                        <span class="text-sm text-indigo-600 mt-1">Imágenes, videos o audio</span>
                        <input type="file" id="fileInput" multiple accept="image/*,video/*,audio/*" class="hidden">
                    </label>
                    <div id="listaArchivos" class="mt-4 space-y-3"></div>
                </div>

                <div id="tab-enlaces" class="tab-content hidden">
                    <form id="formEnlace" class="flex gap-3 mb-4">
                        <input type="url" id="inputUrl" placeholder="https://ejemplo.com/articulo" class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                        <button type="submit" class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">Procesar URL</button>
                    </form>
                    <div id="listaEnlaces" class="space-y-3"></div>
                </div>

                <div id="tab-agentes" class="tab-content hidden">
                    <div id="listaAgentes" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>

                <div id="tab-logs" class="tab-content hidden">
                    <div id="listaLogs" class="space-y-2 max-h-96 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Estado de la aplicación
        const estado = {
            archivos: [],
            enlaces: [],
            transcripciones: [],
            logs: [],
            agentes: [
                { id: 'avia-carlos', nombre: 'AVIA Clon Carlos', rol: 'Orquestador', tareas: 0 },
                { id: 'avia-studio', nombre: 'AVIA Studio v5.2', rol: 'Generación', tareas: 0 },
                { id: 'avia-persistencia', nombre: 'AVIA Persistencia', rol: 'Almacenamiento', tareas: 0 },
                { id: 'avia-semiotic', nombre: 'AVIA Semiotic', rol: 'Análisis Semiótico', tareas: 0 },
                { id: 'avia-ontologia', nombre: 'AVIA Ontología', rol: 'Schema & Validación', tareas: 0 },
                { id: 'avia-curator', nombre: 'AVIA Curator', rol: 'Curación Contenido', tareas: 0 },
                { id: 'avia-vigilance', nombre: 'AVIA Transmedia Vigilance', rol: 'Monitoreo', tareas: 0 },
                { id: 'avia-intelligence', nombre: 'AVIA Transmedia Intelligence', rol: 'Inteligencia', tareas: 0 },
                { id: 'avia-proyecto', nombre: 'AVIA Proyecto', rol: 'Gestión Proyectos', tareas: 0 },
                { id: 'avia-auditor', nombre: 'AVIA Auditor', rol: 'Auditoría & QA', tareas: 0 }
            ],
            procesando: false
        };

        // Funciones de utilidad
        function addLog(mensaje, tipo = 'info') {
            estado.logs.unshift({
                id: Date.now(),
                timestamp: new Date(),
                mensaje,
                tipo
            });
            if (estado.logs.length > 20) estado.logs.pop();
            renderLogs();
        }

        function actualizarContadores() {
            document.getElementById('countMultimedia').textContent = estado.archivos.length;
            document.getElementById('countEnlaces').textContent = estado.enlaces.length;
            document.getElementById('countTranscripciones').textContent = estado.transcripciones.length;
        }

        async function simularTareaAgente(agenteId, tarea, duracion) {
            const agente = estado.agentes.find(a => a.id === agenteId);
            if (agente) {
                agente.tareas++;
                renderAgentes();
            }
            addLog(`[${agenteId}] ${tarea}`, 'info');
            await new Promise(resolve => setTimeout(resolve, duracion));
        }

        // Procesamiento de archivos
        async function procesarArchivo(archivo) {
            estado.procesando = true;
            addLog(`Iniciando procesamiento: ${archivo.name}`, 'info');

            await simularTareaAgente('avia-ontologia', 'Validando schema multimedia', 300);
            await simularTareaAgente('avia-persistencia', 'Almacenando archivo', 500);
            await simularTareaAgente('avia-semiotic', 'Analizando contenido semiótico', 700);
            await simularTareaAgente('avia-curator', 'Extrayendo metadata', 400);

            if (archivo.type.includes('video') || archivo.type.includes('audio')) {
                await simularTareaAgente('avia-intelligence', 'Generando transcripción', 1000);
                estado.transcripciones.push({
                    id: Date.now(),
                    archivoId: archivo.name,
                    texto: 'Transcripción simulada del contenido multimedia.'
                });
            }

            estado.archivos.push({
                id: Date.now(),
                nombre: archivo.name,
                tipo: archivo.type,
                tamano: archivo.size
            });

            addLog(`Archivo procesado: ${archivo.name}`, 'success');
            actualizarContadores();
            renderArchivos();
            estado.procesando = false;
        }

        // Procesamiento de enlaces
        async function procesarEnlace(url) {
            estado.procesando = true;
            addLog(`Procesando enlace: ${url}`, 'info');

            await simularTareaAgente('avia-ontologia', 'Validando schema enlace', 200);
            await simularTareaAgente('avia-vigilance', 'Extrayendo metadata', 800);
            await simularTareaAgente('avia-intelligence', 'Analizando contenido', 600);
            await simularTareaAgente('avia-persistencia', 'Almacenando enlace', 300);

            const dominio = new URL(url).hostname;
            estado.enlaces.push({
                id: Date.now(),
                url,
                titulo: `Contenido de ${dominio}`,
                dominio
            });

            addLog(`Enlace procesado: ${dominio}`, 'success');
            actualizarContadores();
            renderEnlaces();
            estado.procesando = false;
        }

        // Orquestación completa
        async function ejecutarOrquestacion() {
            if (estado.procesando) return;
            estado.procesando = true;
            addLog('Iniciando orquestación completa', 'success');

            const tareas = [
                { agente: 'avia-carlos', tarea: 'Coordinando flujo', duracion: 300 },
                { agente: 'avia-proyecto', tarea: 'Inicializando proyecto', duracion: 400 },
                { agente: 'avia-ontologia', tarea: 'Cargando schemas', duracion: 500 },
                { agente: 'avia-persistencia', tarea: 'Preparando almacenamiento', duracion: 350 },
                { agente: 'avia-auditor', tarea: 'Verificando integridad', duracion: 600 }
            ];

            for (const tarea of tareas) {
                await simularTareaAgente(tarea.agente, tarea.tarea, tarea.duracion);
            }

            addLog('Orquestación completada', 'success');
            estado.procesando = false;
        }

        // Renders
        function renderArchivos() {
            const container = document.getElementById('listaArchivos');
            if (estado.archivos.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = estado.archivos.map(archivo => `
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        <div>
                            <p class="font-medium text-gray-900">${archivo.nombre}</p>
                            <p class="text-sm text-gray-600">${(archivo.tamano / 1024).toFixed(1)} KB</p>
                        </div>
                    </div>
                    <span class="text-xs px-3 py-1 bg-green-100 text-green-800 rounded-full">Procesado</span>
                </div>
            `).join('');
        }

        function renderEnlaces() {
            const container = document.getElementById('listaEnlaces');
            if (estado.enlaces.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = estado.enlaces.map(enlace => `
                <div class="p-4 bg-gray-50 rounded-lg">
                    <p class="font-medium text-gray-900">${enlace.titulo}</p>
                    <p class="text-sm text-indigo-600">${enlace.url}</p>
                </div>
            `).join('');
        }

        function renderAgentes() {
            const container = document.getElementById('listaAgentes');
            container.innerHTML = estado.agentes.map(agente => `
                <div class="p-4 bg-gradient-to-br from-gray-50 to-gray-100 rounded-lg border border-gray-200">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-semibold text-gray-900">${agente.nombre}</span>
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span class="text-xs text-green-600">Activo</span>
                        </div>
                    </div>
                    <p class="text-sm text-gray-600 mb-2">${agente.rol}</p>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-500">Tareas:</span>
                        <span class="text-sm font-bold text-indigo-600">${agente.tareas}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderLogs() {
            const container = document.getElementById('listaLogs');
            container.innerHTML = estado.logs.map(log => `
                <div class="flex items-start gap-3 p-3 bg-gray-50 rounded-lg">
                    <svg class="w-4 h-4 ${log.tipo === 'success' ? 'text-green-600' : 'text-blue-600'} mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <div>
                        <span class="text-xs text-gray-500">${log.timestamp.toLocaleTimeString()}</span>
                        <p class="text-sm text-gray-900">${log.mensaje}</p>
                    </div>
                </div>
            `).join('');
        }

        // Event listeners
        document.getElementById('fileInput').addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(procesarArchivo);
        });

        document.getElementById('formEnlace').addEventListener('submit', (e) => {
            e.preventDefault();
            const url = document.getElementById('inputUrl').value;
            procesarEnlace(url);
            e.target.reset();
        });

        document.getElementById('btnOrquestar').addEventListener('click', ejecutarOrquestacion);

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('text-indigo-600', 'border-b-2', 'border-indigo-600');
                    b.classList.add('text-gray-600');
                });
                e.target.classList.add('text-indigo-600', 'border-b-2', 'border-indigo-600');
                e.target.classList.remove('text-gray-600');

                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.add('hidden');
                });
                document.getElementById(`tab-${e.target.dataset.tab}`).classList.remove('hidden');
            });
        });

        // Inicialización
        addLog('Sistema AVIA inicializado - 10 agentes activos', 'success');
        renderAgentes();
    </script>
</body>
</html>
