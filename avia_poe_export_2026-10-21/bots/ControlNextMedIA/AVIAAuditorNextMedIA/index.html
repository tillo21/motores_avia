<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA-Auditor · ControlNextMedia v0.5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Manrope:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <style>
        :root {
            --bg-deep: #080a0f;
            --bg-primary: #0d1017;
            --bg-secondary: #131821;
            --bg-card: #181e2a;
            --bg-card-hover: #1f2736;
            --bg-elevated: #242d3d;
            --bg-glass: rgba(24, 30, 42, 0.85);
            --border: #262f42;
            --border-accent: #3a4868;
            --border-glow: rgba(212, 168, 83, 0.2);
            --text-primary: #eaf0fc;
            --text-secondary: #8694b0;
            --text-muted: #4e5b74;
            --gold: #e0b44a;
            --gold-dim: rgba(224, 180, 74, 0.12);
            --gold-bright: #f5d06b;
            --emerald: #3eeaad;
            --emerald-dim: rgba(62, 234, 173, 0.10);
            --blue: #5da4f7;
            --blue-dim: rgba(93, 164, 247, 0.10);
            --violet: #a482f7;
            --violet-dim: rgba(164, 130, 247, 0.10);
            --rose: #f76e8a;
            --rose-dim: rgba(247, 110, 138, 0.10);
            --amber: #f5b731;
            --amber-dim: rgba(245, 183, 49, 0.10);
            --cyan: #2ee4f0;
            --cyan-dim: rgba(46, 228, 240, 0.10);
            --status-done: #3eeaad;
            --status-progress: #5da4f7;
            --status-pending: #f5b731;
            --status-blocked: #f76e8a;
            --status-not-started: #4e5b74;
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow: 0 4px 24px rgba(0,0,0,0.35);
            --shadow-lg: 0 12px 48px rgba(0,0,0,0.5);
            --font-display: 'Playfair Display', serif;
            --font-body: 'Manrope', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        html.light {
            --bg-deep: #f0ece4;
            --bg-primary: #f5f1ea;
            --bg-secondary: #ebe7df;
            --bg-card: #ffffff;
            --bg-card-hover: #faf8f5;
            --bg-elevated: #f0ece4;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --border: #d6d0c6;
            --border-accent: #c2bab0;
            --border-glow: rgba(184, 137, 42, 0.25);
            --text-primary: #16130e;
            --text-secondary: #6b6256;
            --text-muted: #9e9588;
            --gold: #b88a2a;
            --gold-dim: rgba(184, 138, 42, 0.08);
            --gold-bright: #d4a040;
            --emerald: #0d9668;
            --emerald-dim: rgba(13, 150, 104, 0.07);
            --blue: #2563eb;
            --blue-dim: rgba(37, 99, 235, 0.07);
            --violet: #7c3aed;
            --violet-dim: rgba(124, 58, 237, 0.07);
            --rose: #dc2655;
            --rose-dim: rgba(220, 38, 85, 0.07);
            --amber: #cc8b08;
            --amber-dim: rgba(204, 139, 8, 0.07);
            --cyan: #0891b2;
            --cyan-dim: rgba(8, 145, 178, 0.07);
            --status-done: #0d9668;
            --status-progress: #2563eb;
            --status-pending: #cc8b08;
            --status-blocked: #dc2655;
            --status-not-started: #9e9588;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 48px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-atmosphere {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse 90% 50% at 15% 5%, rgba(224,180,74,0.05) 0%, transparent 55%),
                radial-gradient(ellipse 70% 60% at 85% 85%, rgba(93,164,247,0.04) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(164,130,247,0.025) 0%, transparent 55%);
        }
        .bg-grid {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.025;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .app-shell {
            position: relative; z-index: 1;
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 20px 100px;
        }

        /* ═══════════════ ATOMS ═══════════════ */
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 11px; border-radius: 20px;
            font-size: 0.68rem; font-weight: 700;
            letter-spacing: 0.04em; white-space: nowrap;
            transition: transform 0.15s ease;
        }
        .badge:hover { transform: scale(1.05); }
        .badge-done { background: var(--emerald-dim); color: var(--status-done); }
        .badge-progress { background: var(--blue-dim); color: var(--status-progress); }
        .badge-pending { background: var(--amber-dim); color: var(--status-pending); }
        .badge-blocked { background: var(--rose-dim); color: var(--status-blocked); }
        .badge-not-started { background: var(--bg-elevated); color: var(--status-not-started); }
        .badge-wp { background: var(--violet-dim); color: var(--violet); }
        .badge-gold { background: var(--gold-dim); color: var(--gold); }
        .badge-blue { background: var(--blue-dim); color: var(--blue); }
        .badge-cyan { background: var(--cyan-dim); color: var(--cyan); }
        .badge-rose { background: var(--rose-dim); color: var(--rose); }
        .badge-amber { background: var(--amber-dim); color: var(--amber); }
        .badge-emerald { background: var(--emerald-dim); color: var(--emerald); }
        .badge-violet { background: var(--violet-dim); color: var(--violet); }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); background: var(--bg-card);
            color: var(--text-primary); font-family: var(--font-body);
            font-size: 0.82rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .btn:hover { background: var(--bg-card-hover); border-color: var(--border-accent); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-gold { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
        .btn-gold:hover { background: var(--gold); color: var(--bg-deep); }
        .btn-sm { padding: 6px 14px; font-size: 0.75rem; }
        .btn-icon { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; }

        .progress-track {
            width: 100%; height: 6px;
            background: var(--bg-elevated);
            border-radius: 3px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 3px;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-field {
            width: 100%; padding: 12px 16px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-primary);
            font-family: var(--font-body); font-size: 16px;
            outline: none; transition: all 0.2s ease;
        }
        .input-field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
        .input-field::placeholder { color: var(--text-muted); }

        /* ═══════════════ MOLECULES ═══════════════ */
        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 22px;
            transition: all 0.25s ease; position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 1px; background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .card:hover { border-color: var(--border-accent); box-shadow: var(--shadow-sm); }
        .card:hover::before { opacity: 1; }

        .card-title {
            font-family: var(--font-display); font-size: 1.1rem;
            color: var(--text-primary); margin-bottom: 14px;
            display: flex; align-items: center; gap: 10px;
        }
        .card-title .icon {
            font-size: 0.8rem; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-xs);
        }

        .kpi-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 18px 16px;
            text-align: center; transition: all 0.25s ease;
            position: relative; overflow: hidden;
        }
        .kpi-card:hover { transform: translateY(-2px); border-color: var(--border-accent); box-shadow: var(--shadow-sm); }
        .kpi-value {
            font-family: var(--font-mono); font-size: 1.7rem;
            font-weight: 700; line-height: 1.15;
        }
        .kpi-label {
            font-size: 0.68rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px;
        }
        .kpi-sub { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }

        .toast-container {
            position: fixed; top: 16px; right: 16px; z-index: 9999;
            display: flex; flex-direction: column; gap: 8px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            padding: 14px 20px; border-radius: var(--radius-sm);
            background: var(--bg-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); color: var(--text-primary);
            font-size: 0.82rem; font-weight: 500;
            display: flex; align-items: center; gap: 10px;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            max-width: 380px;
        }
        .toast.removing { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px); z-index: 8000;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            animation: modalBgIn 0.3s ease;
        }
        @keyframes modalBgIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 28px;
            max-width: 520px; width: 100%;
            box-shadow: var(--shadow-lg);
            animation: modalIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* ═══════════════ ORGANISMS ═══════════════ */

        /* Header */
        .header {
            display: flex; align-items: flex-start; justify-content: space-between;
            margin-bottom: 28px; gap: 16px; flex-wrap: wrap;
        }
        .header-brand h1 {
            font-family: var(--font-display); font-size: 2rem;
            color: var(--gold); letter-spacing: -0.02em; line-height: 1.15;
        }
        .header-brand h1 .version-tag {
            font-family: var(--font-mono); font-size: 0.5em;
            color: var(--text-muted); vertical-align: middle; margin-left: 10px;
        }
        .header-subtitle {
            font-size: 0.88rem; color: var(--text-secondary); margin-top: 3px;
        }
        .header-meta {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
            padding: 5px 14px; background: var(--gold-dim);
            border: 1px solid rgba(224,180,74,0.2); border-radius: 24px;
            font-size: 0.72rem; color: var(--gold); font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
        }
        .header-actions {
            display: flex; align-items: center; gap: 10px; flex-shrink: 0;
        }
        .health-ring { width: 68px; height: 68px; position: relative; }
        .health-ring svg { transform: rotate(-90deg); width: 68px; height: 68px; }
        .health-ring .ring-bg { fill: none; stroke: var(--border); stroke-width: 4.5; }
        .health-ring .ring-fill { fill: none; stroke-width: 4.5; stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .health-ring .ring-pct {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-mono); font-size: 0.9rem; font-weight: 700;
        }

        /* Navigation */
        .nav-strip {
            display: flex; gap: 3px; margin-bottom: 24px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 4px;
            overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .nav-strip::-webkit-scrollbar { display: none; }
        .nav-btn {
            flex: 1; min-width: fit-content;
            padding: 10px 14px; border: none; background: transparent;
            color: var(--text-muted); font-family: var(--font-body);
            font-size: 0.78rem; font-weight: 600; cursor: pointer;
            border-radius: var(--radius-sm); transition: all 0.2s ease;
            white-space: nowrap; display: flex; align-items: center;
            justify-content: center; gap: 6px; position: relative;
        }
        .nav-btn:hover { color: var(--text-secondary); background: var(--bg-card); }
        .nav-btn.active {
            background: var(--bg-card); color: var(--gold);
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .nav-btn .tab-count {
            font-family: var(--font-mono); font-size: 0.65rem;
            background: var(--gold-dim); color: var(--gold);
            padding: 1px 7px; border-radius: 10px;
        }
        .nav-btn .pulse-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--rose); position: absolute; top: 6px; right: 8px;
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }

        /* KPI Grid */
        .kpi-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 10px; margin-bottom: 24px;
        }

        /* Layout helpers */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .stack { display: flex; flex-direction: column; gap: 12px; }
        .section { margin-bottom: 28px; }
        .section-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px; gap: 12px; flex-wrap: wrap;
        }
        .section-title {
            font-family: var(--font-display); font-size: 1.2rem;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title .s-icon {
            font-size: 0.85rem; width: 32px; height: 32px;
            border-radius: var(--radius-xs); display: flex;
            align-items: center; justify-content: center;
        }

        /* Module cards */
        .mod-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 18px 20px;
            display: flex; align-items: flex-start; gap: 14px;
            transition: all 0.25s ease; cursor: default;
        }
        .mod-card:hover { border-color: var(--border-accent); background: var(--bg-card-hover); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .mod-icon {
            width: 42px; height: 42px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; flex-shrink: 0;
        }
        .mod-body { flex: 1; min-width: 0; }
        .mod-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; }
        .mod-desc { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.5; }
        .mod-tags { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .mod-blocker {
            margin-top: 10px; padding: 8px 12px; background: var(--rose-dim);
            border-radius: var(--radius-xs); font-size: 0.76rem; color: var(--rose);
        }

        /* Pipeline */
        .pipe-flow { display: flex; gap: 0; overflow-x: auto; padding-bottom: 8px; }
        .pipe-flow::-webkit-scrollbar { height: 4px; }
        .pipe-flow::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 2px; }
        .pipe-flow::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }
        .pipe-stage {
            flex: 1; min-width: 150px; padding: 16px 14px; text-align: center;
            position: relative; border: 1px solid var(--border);
            border-radius: var(--radius-sm); margin-right: -1px;
            transition: all 0.2s;
        }
        .pipe-stage:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
        .pipe-stage:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-right: 0; }
        .pipe-stage:hover { z-index: 2; transform: scale(1.02); box-shadow: var(--shadow); }
        .pipe-arrow { display: flex; align-items: center; color: var(--text-muted); font-size: 0.8rem; flex-shrink: 0; padding: 0 2px; }

        /* Ontology */
        .onto-row {
            padding: 12px 16px; border-left: 3px solid var(--border);
            margin-left: 12px; margin-bottom: 6px;
            background: var(--bg-card); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            transition: all 0.2s;
        }
        .onto-row:hover { border-left-color: var(--gold); background: var(--bg-card-hover); }
        .onto-row.lv-0 { margin-left: 0; border-left-width: 4px; border-left-color: var(--gold); }
        .onto-row.lv-1 { margin-left: 24px; border-left-color: var(--blue); }
        .onto-row.lv-2 { margin-left: 48px; border-left-color: var(--violet); }
        .onto-label { font-weight: 700; font-size: 0.84rem; }
        .onto-type { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); margin-left: 8px; }
        .onto-desc { font-size: 0.76rem; color: var(--text-secondary); margin-top: 2px; }

        /* Rules */
        .rule-row {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 14px 16px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .rule-row:hover { border-color: var(--border-accent); }
        .rule-num {
            font-family: var(--font-display); font-size: 1.25rem;
            color: var(--gold); line-height: 1; flex-shrink: 0;
            width: 32px; text-align: center;
        }
        .rule-body { flex: 1; }
        .rule-name { font-weight: 700; font-size: 0.84rem; }
        .rule-desc-text { font-size: 0.76rem; color: var(--text-secondary); margin-top: 2px; }
        .rule-status {
            margin-left: auto; flex-shrink: 0; width: 26px; height: 26px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 0.7rem;
        }
        .rule-status.ok { background: var(--emerald-dim); color: var(--status-done); }
        .rule-status.partial { background: var(--amber-dim); color: var(--status-pending); }
        .rule-status.fail { background: var(--rose-dim); color: var(--status-blocked); }

        /* Atomic */
        .atomic-row {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
        }
        .atomic-orb {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; flex-shrink: 0;
        }
        .atomic-info { flex: 1; }
        .atomic-name { font-weight: 700; font-size: 0.84rem; }
        .atomic-examples { font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px; }
        .atomic-pct { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 700; }

        /* Constellation SVG */
        .constellation-wrap {
            position: relative; width: 100%; padding-top: 70%;
            background: var(--bg-secondary); border-radius: var(--radius);
            overflow: hidden; border: 1px solid var(--border);
        }
        .constellation-wrap svg {
            position: absolute; inset: 0; width: 100%; height: 100%;
        }
        .constellation-tooltip {
            position: absolute; pointer-events: none;
            background: var(--bg-glass); backdrop-filter: blur(16px);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 10px 14px; font-size: 0.78rem; color: var(--text-primary);
            box-shadow: var(--shadow); z-index: 10; opacity: 0;
            transition: opacity 0.2s;
            max-width: 200px;
        }
        .constellation-tooltip.visible { opacity: 1; }

        /* AI Console */
        .ai-console {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
        }
        .ai-console-header {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 20px; border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }
        .ai-console-header .dot { width: 8px; height: 8px; border-radius: 50%; }
        .ai-console-body {
            padding: 20px; min-height: 200px; max-height: 420px;
            overflow-y: auto; font-size: 0.84rem; line-height: 1.8;
            color: var(--text-secondary);
        }
        .ai-console-body::-webkit-scrollbar { width: 4px; }
        .ai-console-body::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }
        .ai-console-body .ai-msg {
            margin-bottom: 16px; padding: 14px 18px;
            background: var(--bg-card); border-radius: var(--radius-sm);
            border: 1px solid var(--border);

        .ai-console-body .ai-msg h2,
        .ai-console-body .ai-msg h3 {
            font-family: var(--font-display); color: var(--text-primary); margin: 12px 0 8px;
        }
        .ai-console-body .ai-msg h1 { font-size: 1.1rem; }
        .ai-console-body .ai-msg h2 { font-size: 1rem; }
        .ai-console-body .ai-msg h3 { font-size: 0.92rem; }
        .ai-console-body .ai-msg p { margin-bottom: 8px; }
        .ai-console-body .ai-msg ul, .ai-console-body .ai-msg ol { margin: 6px 0 6px 20px; }
        .ai-console-body .ai-msg li { margin-bottom: 3px; }
        .ai-console-body .ai-msg strong { color: var(--text-primary); }
        .ai-console-body .ai-msg code {
            font-family: var(--font-mono); font-size: 0.82em;
            background: var(--bg-elevated); padding: 2px 6px; border-radius: 4px;
        }
        .ai-console-body .ai-msg pre {
            background: var(--bg-secondary); padding: 12px; border-radius: var(--radius-xs);
            overflow-x: auto; margin: 8px 0;
        }
        .ai-console-body .ai-msg pre code { background: none; padding: 0; }
        .ai-console-footer {
            display: flex; gap: 8px; padding: 12px 20px;
            border-top: 1px solid var(--border); background: var(--bg-card);
        }
        .ai-typing {
            display: inline-flex; gap: 4px; align-items: center; padding: 8px 14px;
            background: var(--bg-elevated); border-radius: var(--radius-sm);
        }
        .ai-typing span {
            width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
            animation: typeDot 1.4s ease infinite;
        }
        .ai-typing span:nth-child(2) { animation-delay: 0.2s; }
        .ai-typing span:nth-child(3) { animation-delay: 0.4s; }

        /* Search */
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 16px; background: var(--bg-secondary);
            border: 1px solid var(--border); border-radius: var(--radius);
            margin-bottom: 16px; transition: border-color 0.2s;
        }
        .search-bar:focus-within { border-color: var(--gold); }
        .search-bar i { color: var(--text-muted); font-size: 0.85rem; }
        .search-bar input {
            flex: 1; border: none; background: transparent;
            color: var(--text-primary); font-family: var(--font-body);
            font-size: 16px; outline: none;
        }
        .search-bar input::placeholder { color: var(--text-muted); }
        .filter-row {
            display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap;
        }
        .filter-chip {
            padding: 5px 12px; border-radius: 20px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            color: var(--text-secondary); font-size: 0.72rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;

        .filter-chip:hover { border-color: var(--gold); color: var(--gold); }
        .filter-chip.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

        /* Roadmap */
        .sprint-lane {
            display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px;
        }
        .sprint-lane::-webkit-scrollbar { height: 4px; }
        .sprint-lane::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }
        .sprint-col {
            min-width: 260px; flex-shrink: 0;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
        }
        .sprint-head {
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            background: var(--bg-card); font-weight: 700; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .sprint-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .sprint-task {
            padding: 12px 14px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 0.78rem; transition: all 0.2s;
        }
        .sprint-task:hover { border-color: var(--border-accent); transform: translateY(-1px); }
        .sprint-task .st-name { font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
        .sprint-task .st-mod { font-size: 0.68rem; color: var(--text-muted); }

        /* Animations */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-in { animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-card-hover) 50%, var(--bg-elevated) 75%);
            background-size: 200% 100%; animation: shimmer 1.5s ease infinite;
            border-radius: var(--radius-sm);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 3px; }

        /* Tab content */
        .tab-panel { display: none; }
        .tab-panel.visible { display: block; }

        /* Responsive */
        @media (max-width: 768px) {
            .app-shell { padding: 14px 10px 90px; }
            .header { flex-direction: column; }
            .header-brand h1 { font-size: 1.5rem; }
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-btn { padding: 8px 10px; font-size: 0.72rem; }
            .nav-btn .nav-label { display: none; }
            .pipe-flow { flex-direction: column; }
            .pipe-stage { min-width: auto; border-radius: var(--radius-sm) !important; margin-right: 0; margin-bottom: 4px; }
            .pipe-arrow { transform: rotate(90deg); justify-content: center; }
            .sprint-col { min-width: 220px; }
        }
        @media (max-width: 420px) { .kpi-grid { grid-template-columns: 1fr; } }

        /* Details/Summary */
        details > summary {
            cursor: pointer; list-style: none; user-select: none;
        }
        details > summary::-webkit-details-marker { display: none; }
        details > summary::before {
            content: '▸'; display: inline-block; margin-right: 6px;
            transition: transform 0.2s;
        }
        details[open] > summary::before { transform: rotate(90deg); }
    </style>

    function applyTheme() {
        try {
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
                document.documentElement.classList.add("light");
            } else {
                document.documentElement.classList.remove("light");
            }
        } catch (_e) { /* ignore theme detection failure */ }
    }
    try {
        applyTheme();

            window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);

        function showToast(message, type, duration) {
            type = type || "info";
            duration = duration || 4000;
            var container = document.getElementById("toasts");
            var toast = document.createElement("div");
            toast.className = "toast";
            var iconMap = { info: "fa-circle-info", success: "fa-circle-check", warn: "fa-triangle-exclamation", error: "fa-circle-xmark" };
            var colorMap = { info: "var(--blue)", success: "var(--emerald)", warn: "var(--amber)", error: "var(--rose)" };
            toast.innerHTML = '<i class="fa-solid ' + (iconMap[type] || iconMap.info) + '" style="color:' + (colorMap[type] || colorMap.info) + ';font-size:1rem"><\/i><span>' + message + '<\/span>';
            container.appendChild(toast);
            setTimeout(function() {
                toast.classList.add("removing");
                setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, duration);
        }

        function showConfirmDialog(message, onConfirm) {
            var overlay = document.createElement("div");
            overlay.className = "modal-overlay";
            overlay.innerHTML =
                '<div class="modal-box">' +
                    '<p style="color:var(--text-secondary);margin-bottom:20px;font-size:0.9rem">' + message + '<\/p>' +
                    '<div style="display:flex;justify-content:flex-end;gap:10px">' +
                        '<button class="btn" id="modal-cancel">Cancelar<\/button>' +
                        '<button class="btn btn-gold" id="modal-confirm">Confirmar<\/button>' +
                    '<\/div>' +
                '<\/div>';
            document.body.appendChild(overlay);
            overlay.querySelector("#modal-cancel").addEventListener("click", function() {
                document.body.removeChild(overlay);
            });
            overlay.querySelector("#modal-confirm").addEventListener("click", function() {
                document.body.removeChild(overlay);
                if (onConfirm) onConfirm();
            });
            overlay.addEventListener("click", function(e) {
                if (e.target === overlay) document.body.removeChild(overlay);
            });
        }

        function calcResumen() {
            var totalDev = 0, totalPend = 0, done = 0, prog = 0, pend = 0, blocked = 0;
            MODULOS.forEach(function(m) {
                totalDev += m.desarrollado.length;
                totalPend += m.pendiente.length;
                if (m.estado === "completado") done++;
                else if (m.estado === "en-progreso" || m.estado === "parcial") prog++;
                else if (m.estado === "bloqueado") blocked++;
                else pend++;
            });
            var progGlobal = MODULOS.reduce(function(s, m) { return s + m.progreso; }, 0) / MODULOS.length;
            return {
                totalModulos: MODULOS.length, done: done, prog: prog, pend: pend, blocked: blocked,
                totalDev: totalDev, totalPend: totalPend, progGlobal: Math.round(progGlobal),
                reglasOK: REGLAS_ORO.filter(function(r) { return r.cumple === "si"; }).length,
                reglasParcial: REGLAS_ORO.filter(function(r) { return r.cumple === "parcial"; }).length,
                reglasNO: REGLAS_ORO.filter(function(r) { return r.cumple === "no"; }).length
            };
        }

                    simple: "economico", formato: "economico", lista: "economico",
                    codigo: "medio", analisis: "medio", json: "medio", razonamiento: "medio",

                };
                var nivel = mapa[tipo] || "economico";
                return this.NIVELES[nivel][0];
            },

            obtenerCadenaReserva: function(tipo) {
                var bot = this.seleccionarBot(tipo);
                var cadena = [bot];
                var todos = ["Claude-Sonnet-4.6", "Gemini-3-Flash", "Grok-4.1-Fast-Non-Reasoning"];
                var idx = todos.indexOf(bot);
                for (var i = idx + 1; i < todos.length; i++) {
                    if (cadena.indexOf(todos[i]) === -1) cadena.push(todos[i]);
                }
                if (cadena.indexOf("Grok-4.1-Fast-Non-Reasoning") === -1) {
                    cadena.push("Grok-4.1-Fast-Non-Reasoning");
                }
                return cadena;
            },

            truncarContexto: function(texto) {
                var est = Math.ceil(texto.length / 4);
                if (est > this.LIMITE_TOKENS) {
                    return texto.slice(0, this.LIMITE_TOKENS * 4);
                }
                return texto;
            },

            enviarConReserva: async function(prompt, tipo, opciones) {
                if (!window.Poe) {
                    throw new Error("[BotRouter] Poe Embed API no disponible");
                }
                var cadena = this.obtenerCadenaReserva(tipo);
                var truncado = this.truncarContexto(prompt);
                var ultimoError = null;
                for (var i = 0; i < cadena.length; i++) {
                    try {
                        var opts = Object.assign({ openChat: false, stream: false, parameters: {} }, opciones || {});
                        var resultado = await window.Poe.sendUserMessage("@" + cadena[i] + " " + truncado, opts);
                        this.registro.push({ fecha: new Date().toISOString(), bot: cadena[i], tipo: tipo, exito: true, intento: i + 1 });
                        return resultado;
                    } catch (err) {
                        ultimoError = err;
                        this.registro.push({ fecha: new Date().toISOString(), bot: cadena[i], tipo: tipo, exito: false, error: err.message || String(err), intento: i + 1 });
                    }
                }
                throw ultimoError;
            }

        /* ═══════════════════════════════════════════════

        function initConstellation() {
            var svg = document.getElementById("constellation-svg");
            if (!svg) return;

            var nodes = [
                { x: 400, y: 60, label: "ControlNextMedia", color: "#e0b44a", r: 24, desc: "Raíz del ecosistema", type: "centro" },
                { x: 180, y: 180, label: "WP2 Core", color: "#5da4f7", r: 18, desc: "Desarrollo Core" },

                { x: 90, y: 320, label: "IA Afectiva", color: "#f76e8a", r: 13, desc: "Motor emocional — 45%" },
                { x: 250, y: 300, label: "Ingesta Datos", color: "#f5b731", r: 11, desc: "BLOQUEADO — 4 días" },
                { x: 170, y: 420, label: "Motor Personal.", color: "#2ee4f0", r: 11, desc: "No iniciado" },
                { x: 400, y: 270, label: "Prototipo", color: "#3eeaad", r: 12, desc: "Integración — 0%" },
                { x: 540, y: 300, label: "OTT", color: "#5da4f7", r: 11, desc: "No iniciado" },
                { x: 660, y: 320, label: "Val. Técnica", color: "#3eeaad", r: 11, desc: "No iniciado" },
                { x: 600, y: 420, label: "Val. Emocional", color: "#f76e8a", r: 11, desc: "No iniciado" },
                { x: 400, y: 480, label: "Ontología", color: "#e0b44a", r: 14, desc: "Vocabulario controlado" },
                { x: 280, y: 510, label: "Pipeline", color: "#2ee4f0", r: 11, desc: "Orquestación" },
                { x: 520, y: 510, label: "Libro Blanco", color: "#e0b44a", r: 11, desc: "Reglas de oro" }
            ];

            var edges = [[0,1],[0,2],[1,3],[1,4],[1,5],[1,6],[2,7],[2,8],[2,9],[3,5],[4,3],[5,6],[6,7],[3,9],[10,11],[10,12],[0,10],[10,3],[10,7],[11,4],[11,7],[12,0]];

            var svgNS = "http://www.w3.org/2000/svg";
            svg.innerHTML = '';

            // Defs
            var defs = document.createElementNS(svgNS, "defs");
            nodes.forEach(function(n, i) {
                var grad = document.createElementNS(svgNS, "radialGradient");
                grad.setAttribute("id", "glow-" + i);
                var s1 = document.createElementNS(svgNS, "stop");
                s1.setAttribute("offset", "0%"); s1.setAttribute("stop-color", n.color); s1.setAttribute("stop-opacity", "0.3");
                var s2 = document.createElementNS(svgNS, "stop");
                s2.setAttribute("offset", "100%"); s2.setAttribute("stop-color", n.color); s2.setAttribute("stop-opacity", "0");
                grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad);
            });
            svg.appendChild(defs);

            // Edges
            edges.forEach(function(e) {
                var a = nodes[e[0]], b = nodes[e[1]];
                var line = document.createElementNS(svgNS, "line");
                line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
                line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
                line.setAttribute("stroke", "rgba(255,255,255,0.06)");
                line.setAttribute("stroke-width", "1");
                svg.appendChild(line);
            });

            // Nodes
            nodes.forEach(function(n, i) {
                var g = document.createElementNS(svgNS, "g");
                g.setAttribute("class", "const-node");
                g.setAttribute("data-idx", i);
                g.style.cursor = "pointer";

                // Glow
                var glowCircle = document.createElementNS(svgNS, "circle");
                glowCircle.setAttribute("cx", n.x); glowCircle.setAttribute("cy", n.y); glowCircle.setAttribute("r", n.r + 10);
                glowCircle.setAttribute("fill", "url(#glow-" + i + ")");
                g.appendChild(glowCircle);

                // Main circle
                var circ = document.createElementNS(svgNS, "circle");
                circ.setAttribute("cx", n.x); circ.setAttribute("cy", n.y); circ.setAttribute("r", n.r);
                circ.setAttribute("fill", n.color + "25"); circ.setAttribute("stroke", n.color);
                circ.setAttribute("stroke-width", "1.5");
                g.appendChild(circ);

                // Core dot
                var dot = document.createElementNS(svgNS, "circle");
                dot.setAttribute("cx", n.x); dot.setAttribute("cy", n.y); dot.setAttribute("r", "3");
                dot.setAttribute("fill", n.color);
                g.appendChild(dot);

                // Label
                var txt = document.createElementNS(svgNS, "text");
                txt.setAttribute("x", n.x); txt.setAttribute("y", n.y + n.r + 16);
                txt.setAttribute("text-anchor", "middle");
                txt.setAttribute("fill", "currentColor");
                txt.setAttribute("font-size", n.type === "centro" ? "12" : "10");
                txt.setAttribute("font-family", "Manrope, sans-serif");
                txt.setAttribute("font-weight", "600");
                txt.textContent = n.label;
                g.appendChild(txt);

                svg.appendChild(g);
            });

            // Tooltip
            var tooltip = document.getElementById("const-tooltip");
            if (tooltip) {
                svg.querySelectorAll(".const-node").forEach(function(g) {
                    g.addEventListener("mouseenter", function(e) {
                        var idx = parseInt(g.getAttribute("data-idx"), 10);
                        var n = nodes[idx];
                        tooltip.innerHTML = '<strong>' + n.label + '<\/strong><br><span style="font-size:0.72rem;color:var(--text-muted)">' + n.desc + '<\/span>';
                        var wrap = document.getElementById("constellation-area");
                        if (wrap) {
                            var rect = wrap.getBoundingClientRect();
                            var svgRect = svg.getBoundingClientRect();
                            var scaleX = svgRect.width / 800;
                            var scaleY = svgRect.height / 560;
                            tooltip.style.left = (n.x * scaleX + 16) + "px";
                            tooltip.style.top = (n.y * scaleY - 10) + "px";
                        }
                        tooltip.classList.add("visible");
                    });
                    g.addEventListener("mouseleave", function() {
                        tooltip.classList.remove("visible");
                    });
                });
            }
        }

                });

                searchInput.addEventListener("input", function() {

                    rerenderModules();

            document.querySelectorAll(".filter-chip").forEach(function(chip) {

                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();

                        if (text) sendAIMessage(text);

        /* ═══════════════════════════════════════════════
           AI MESSAGE HANDLING
        ═══════════════════════════════════════════════ */
        function sendAIMessage(text) {
            if (aiLoading) return;
            aiMessages.push({ role: "user", content: text });
            aiLoading = true;
            refreshAIPanel();

            var handlerName = "avia-ai-handler-" + Date.now();

            if (window.Poe) {
                window.Poe.registerHandler(handlerName, function(result) {
                    var msg = result.responses[0];
                    if (!msg) return;

                    if (msg.status === "error") {
                        aiLoading = false;
                        aiMessages.push({ role: "assistant", content: "**Error:** " + (msg.statusText || "Error desconocido al procesar la consulta.") });
                        refreshAIPanel();
                        showToast("Error en la consulta IA", "error");
                    } else if (msg.status === "incomplete") {
                        // Update streaming content
                        var lastMsg = aiMessages[aiMessages.length - 1];
                        if (lastMsg && lastMsg.role === "assistant" && lastMsg.streaming) {
                            lastMsg.content = msg.content;
                        } else {
                            aiMessages.push({ role: "assistant", content: msg.content, streaming: true });
                        }
                        refreshAIPanel();
                    } else if (msg.status === "complete") {
                        aiLoading = false;
                        var completedMsg = aiMessages[aiMessages.length - 1];
                        if (completedMsg && completedMsg.role === "assistant" && completedMsg.streaming) {
                            completedMsg.content = msg.content;
                            delete completedMsg.streaming;
                        } else {
                            aiMessages.push({ role: "assistant", content: msg.content });
                        }
                        refreshAIPanel();
                        showToast("Respuesta IA recibida", "success");
                        var botUsed = document.getElementById("ai-bot-used");
                        if (botUsed) botUsed.textContent = "Bot: " + msg.senderId;
                    }
                });

                var botToUse = BotRouter.seleccionarBot("analisis");
                var truncatedPrompt = BotRouter.truncarContexto(text);

                window.Poe.sendUserMessage(
                    "@" + botToUse + " " + truncatedPrompt,
                    {
                        handler: handlerName,
                        stream: true,
                        openChat: false,
                        parameters: {}
                    }
                ).catch(function(err) {
                    // Try fallback
                    var fallbackBot = "Gemini-3-Flash";
                    window.Poe.sendUserMessage(
                        "@" + fallbackBot + " " + truncatedPrompt,
                        {
                            handler: handlerName,
                            stream: true,
                            openChat: false,
                            parameters: {}
                        }
                    ).catch(function(err2) {
                        aiLoading = false;
                        aiMessages.push({ role: "assistant", content: "**Error de conexión:** No se pudo contactar con ningún bot. " + (err2.message || String(err2)) });
                        refreshAIPanel();
                        showToast("Error de conexión IA", "error");
                    });
                });
            } else {
                // Simulate response for development
                setTimeout(function() {
                    aiLoading = false;
                    aiMessages.push({
                        role: "assistant",
                        content: "**Modo desarrollo** — La API Poe Embed no está disponible en este entorno.\n\n" +
                            "En producción, el BotRouter enrutaría esta consulta al bot más eficiente según la Regla XI.\n\n" +
                            "**Cadena de reserva activa:**\n1. Claude-Sonnet-4.6 (medio)\n2. Gemini-3-Flash (económico)\n3. Grok-4.1-Fast-Non-Reasoning (mínimo)\n\n" +
                            "Para ver la respuesta real, ejecuta esta aplicación dentro del iframe de Poe."
                    });
                    refreshAIPanel();
                    showToast("Respuesta simulada (modo desarrollo)", "warn");
                }, 1200);
            }
        }

        function refreshAIPanel() {
            var panel = document.getElementById("tab-ia-consenso");
            if (panel) {
                panel.innerHTML = renderIAConsenso();
                // Rebind AI events
                document.querySelectorAll(".ai-quick-action").forEach(function(btn) {
                    btn.addEventListener("click", function() {
                        var prompt = btn.getAttribute("data-prompt");
                        sendAIMessage(prompt);
                    });
                });
                var aiSend = document.getElementById("ai-send");
                var aiInput = document.getElementById("ai-input");
                if (aiSend && aiInput) {
                    aiSend.addEventListener("click", function() {
                        var text = aiInput.value.trim();
                        if (text) sendAIMessage(text);
                    });
                    aiInput.addEventListener("keydown", function(e) {
                        if (e.key === "Enter" && !e.shiftKey) {
                            e.preventDefault();
                            var text = aiInput.value.trim();
                            if (text) sendAIMessage(text);
                        }
                    });
                }
                // Scroll to bottom
                var body = document.getElementById("ai-body");
                if (body) body.scrollTop = body.scrollHeight;
            }
        }

        /* ═══════════════════════════════════════════════
           EXPORT REPORT
        ═══════════════════════════════════════════════ */
        function exportReport() {
            var res = calcResumen();
            var lines = [];
            lines.push("═══════════════════════════════════════════════");
            lines.push("AVIA-AUDITOR · INFORME DE AUDITORÍA");
            lines.push("Proyecto: " + PROYECTO.nombre + " (" + PROYECTO.alias + ")");
            lines.push("Versión: " + PROYECTO.version);
            lines.push("Fecha: " + PROYECTO.fecha);
            lines.push("═══════════════════════════════════════════════");
            lines.push("");
            lines.push("RESUMEN EJECUTIVO");
            lines.push("─────────────────");
            lines.push("Módulos totales: " + res.totalModulos);
            lines.push("En progreso: " + res.prog + " | Bloqueados: " + res.blocked + " | No iniciados: " + res.pend);
            lines.push("Ítems desarrollados: " + res.totalDev + " | Pendientes: " + res.totalPend);
            lines.push("Progreso global: " + res.progGlobal + "%");
            lines.push("Confianza: " + PROYECTO.confianza + "% | Semanas restantes: " + PROYECTO.semanas_restantes);
            lines.push("Reglas cumplidas: " + res.reglasOK + "/" + REGLAS_ORO.length + " (" + res.reglasParcial + " parciales)");
            lines.push("");
            lines.push("MÓDULOS");
            lines.push("───────");
            MODULOS.forEach(function(m) {
                lines.push("");
                lines.push("▸ " + m.nombre + " [" + m.wp + "] — " + m.estado + " (" + m.progreso + "%)");
                if (m.propietario) lines.push("  Responsable: " + m.propietario);
                lines.push("  " + m.descripcion);
                if (m.desarrollado.length > 0) {
                    lines.push("  ✓ Desarrollado:");
                    m.desarrollado.forEach(function(d) { lines.push("    - " + d); });
                }
                if (m.pendiente.length > 0) {
                    lines.push("  ○ Pendiente:");
                    m.pendiente.forEach(function(p) { lines.push("    - " + p); });
                }
                if (m.bloqueador) lines.push("  ⚠ BLOQUEADOR: " + m.bloqueador);
            });
            lines.push("");
            lines.push("EQUIPO");
            lines.push("──────");
            EQUIPO.forEach(function(e) {
                lines.push("  " + e.nombre + " (" + e.rol + ") — Carga: " + e.carga + "% " + (e.estado === "sobrecarga" ? "⚠ SOBRECARGA" : "OK"));
            });
            lines.push("");
            lines.push("LIBRO BLANCO — REGLAS DE ORO");
            lines.push("────────────────────────────");
            REGLAS_ORO.forEach(function(r) {
                var status = r.cumple === "si" ? "✓" : r.cumple === "parcial" ? "◐" : "✗";
                lines.push("  " + status + " Regla " + r.num + ": " + r.nombre + (r.esNueva ? " [NUEVA]" : ""));
            });
            lines.push("");
            lines.push("═══ Generado por AVIA-Auditor v" + PROYECTO.version + " ═══");

            var content = lines.join("\n");
            var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = "AVIA-Auditoria-" + PROYECTO.fecha + ".txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Informe exportado correctamente", "success");
        }

    /* ═══════════════════════════════════════════════
       REGLA XII: Blindaje de Script en Iframe
       - Todas las funciones expuestas en window.*
       - Dependencias externas cargadas de forma no bloqueante
       - Init envuelto en try-catch con fallback visual
       - Cero secuencias de cierre HTML crudas en el bloque script
    ═══════════════════════════════════════════════ */

    // Exponer funciones críticas en window para máxima accesibilidad
    window.renderApp = renderApp;
    window.showToast = showToast;
    window.initConstellation = initConstellation;
    window.BotRouter = BotRouter;

    // Carga dinámica de marked.js (no bloqueante — Regla XII)
    function loadMarkedJS() {
        try {
            var s = document.createElement("script");
            s.src = "https://cdn.jsdelivr.net/npm/marked@14.1.4/marked.min.js";
            s.async = true;
            s.onerror = function() {
                // Si falla, la app funciona sin Markdown rendering
                window._markedFailed = true;
            };
            document.head.appendChild(s);
        } catch (_e) { /* ignore */ }
    }
    loadMarkedJS();

    // INIT — blindado
    setTimeout(function aviaInit() {
        try {
            window.renderApp();
            window.showToast("AVIA-Auditor v0.5.0 inicializado \u00b7 " + MODULOS.length + " m\u00f3dulos cargados", "info", 5000);
        } catch (initErr) {
            var app = document.getElementById("app");
            if (app) {
                app.innerHTML = '<div style="padding:40px;text-align:center;color:#f76e8a;font-family:monospace">' +
                    '<p style="font-size:1.2rem;margin-bottom:8px">Error de inicializaci\u00f3n<\/p>' +
                    '<p style="font-size:0.8rem;color:#8694b0">' + (initErr.message || String(initErr)) + '<\/p><\/div>';
            }
        }
    }, 500);
    </script>
</body>
