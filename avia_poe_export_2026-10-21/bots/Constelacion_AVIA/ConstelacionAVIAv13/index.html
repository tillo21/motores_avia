<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constelación AVIA — Inteligencia Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400&family=Fira+Code:wght@400;500;600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --void: #020306;
            --deep: #060910;
            --surface: #0a0e17;
            --card: #0e1320;
            --elevated: #141a28;
            --border: rgba(140,160,200,0.06);
            --border-h: rgba(140,160,200,0.14);
            --border-acc: rgba(167,139,250,0.2);
            --t1: #eaeff6;
            --t2: #8898b0;
            --t3: #4e5e74;
            --violet: #a78bfa;
            --violet-g: rgba(167,139,250,0.08);
            --violet-m: rgba(167,139,250,0.15);
            --accent: #7c8cf8;
            --gold: #e0aa40;
            --emerald: #2dd4a0;
            --cyan: #22d3ee;
            --rose: #f06888;
            --amber: #f5a623;
            --radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--void);
            color: var(--t1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === HEADER === */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--deep);
            flex-shrink: 0;
        }

        .h-avatar {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--violet), #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #fff; flex-shrink: 0;
        }

        .h-info { flex: 1; min-width: 0; }
        .h-name { font-size: 13px; font-weight: 600; }
        .h-status { font-size: 10px; color: var(--t3); display: flex; align-items: center; gap: 5px; }
        .h-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,80%,100%{opacity:1} 40%{opacity:0.3} }

        .h-modules {
            display: flex; gap: 3px;
        }

        .h-mod {
            width: 28px; height: 28px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: var(--t3);
            background: var(--surface); border: 1px solid var(--border);
            cursor: pointer; transition: all 0.2s;
            position: relative;
        }

        .h-mod:hover { color: var(--t2); border-color: var(--border-h); }
        .h-mod.active { color: var(--violet); border-color: var(--border-acc); background: var(--violet-g); }

        .h-mod .hm-tip {
            position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
            background: var(--elevated); border: 1px solid var(--border-h);
            padding: 3px 8px; border-radius: 5px;
            font-size: 8px; white-space: nowrap; color: var(--t1);
            opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
        }

        .h-mod:hover .hm-tip { opacity: 1; }

        /* === CONTEXT PANEL === */
        .ctx-panel {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: none;
            flex-shrink: 0;
            overflow-x: auto;
        }

        .ctx-panel.visible { display: block; }

        .ctx-cards {
            display: flex; gap: 8px;
            min-width: min-content;
        }

        .ctx-card {
            padding: 8px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 110px;
            flex-shrink: 0;
        }

        .ctx-v { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 600; margin-bottom: 1px; }
        .ctx-l { font-size: 8px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.8px; }

        /* === CHAT AREA === */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-area::-webkit-scrollbar { width: 3px; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* Messages */
        .msg {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        .msg.carlos { align-self: flex-start; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }

        .msg-av {
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; flex-shrink: 0; margin-top: 2px;
        }

        .msg.carlos .msg-av { background: linear-gradient(135deg, var(--violet), #7c3aed); color: #fff; }
        .msg.user .msg-av { background: var(--elevated); color: var(--t2); }

        .msg-body {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            min-width: 0;
        }

        .msg.carlos .msg-body { border-top-left-radius: 4px; }
        .msg.user .msg-body { border-top-right-radius: 4px; background: var(--elevated); border-color: var(--border-h); }

        .msg-text {
            font-size: 13px;
            line-height: 1.7;
            color: var(--t1);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user .msg-text { color: var(--t1); }

        .msg-meta {
            font-size: 9px;
            color: var(--t3);
            margin-top: 4px;
            font-family: 'Fira Code', monospace;
        }

        /* Inline data cards in messages */
        .msg-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .md-item { text-align: center; padding: 6px; background: var(--surface); border-radius: 7px; }
        .md-v { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 600; }
        .md-l { font-size: 8px; color: var(--t3); text-transform: uppercase; }

        /* Typing indicator */
        .typing {
            display: none;
            align-self: flex-start;
            padding: 10px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            border-top-left-radius: 4px;
        }

        .typing.visible { display: flex; align-items: center; gap: 4px; }

        .typing span {
            width: 5px; height: 5px;
            background: var(--violet);
            border-radius: 50%;
            animation: typeDot 1s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typeDot {
            0%,60%,100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1.1); }
        }

        /* Quick actions */
        .quick-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 6px 16px;
            border-top: 1px solid var(--border);
            background: var(--deep);
            flex-shrink: 0;
        }

        .quick-btn {
            padding: 6px 11px;
            border-radius: 16px;
            font-size: 10px;
            font-family: 'Sora', sans-serif;
            color: var(--t2);
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .quick-btn:hover { border-color: var(--border-acc); color: var(--violet); }

        /* === INPUT === */
        .input-area {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 10px 16px 14px;
            border-top: 1px solid var(--border);
            background: var(--deep);
            flex-shrink: 0;
        }

        .input-wrap {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            transition: border-color 0.3s;
            display: flex;
            align-items: center;
        }

        .input-wrap:focus-within { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-g); }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--t1);
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            resize: none;
            line-height: 1.4;
            max-height: 100px;
            min-height: 20px;
        }

        .input-field::placeholder { color: var(--t3); }

        .send-btn {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--violet), #7c3aed);
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(2,3,6,0.9); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal.visible { display: flex; }
        .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; max-width: 360px; width: 100%; }
        .modal-box h3 { font-family: 'Newsreader', serif; font-size: 16px; margin-bottom: 8px; }
        .modal-box p { color: var(--t2); font-size: 12px; line-height: 1.6; margin-bottom: 14px; }
        .modal-foot { display: flex; justify-content: flex-end; }
        .modal-foot button { padding: 8px 14px; border-radius: 8px; background: var(--surface); color: var(--t2); border: 1px solid var(--border); font-family: 'Sora', sans-serif; font-size: 11px; cursor: pointer; }

        /* Responsive */
        @media (max-width: 480px) {
            .h-modules { display: none; }
            .msg { max-width: 92%; }
            .quick-row { overflow-x: auto; flex-wrap: nowrap; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="h-avatar"><i class="fas fa-robot"></i></div>
        <div class="h-info">
            <div class="h-name">Constelación AVIA</div>
            <div class="h-status"><span class="h-dot"></span> Inteligencia Viva · AMS v5.2</div>
        </div>
        <div class="h-modules">
            <div class="h-mod" onclick="Chat.showModule('auditor')"><i class="fas fa-magnifying-glass-chart"></i><span class="hm-tip">Auditor</span></div>
            <div class="h-mod" onclick="Chat.showModule('cert')"><i class="fas fa-certificate"></i><span class="hm-tip">Certificador</span></div>
            <div class="h-mod" onclick="Chat.showModule('obs')"><i class="fas fa-satellite-dish"></i><span class="hm-tip">Observatorio</span></div>
            <div class="h-mod" onclick="Chat.showModule('onboard')"><i class="fas fa-compass"></i><span class="hm-tip">Onboarding</span></div>
            <div class="h-mod" onclick="Chat.showModule('gov')"><i class="fas fa-scale-balanced"></i><span class="hm-tip">Consenso</span></div>
            <div class="h-mod" onclick="Chat.showModule('evo')"><i class="fas fa-dna"></i><span class="hm-tip">Evolución</span></div>
        </div>
    </div>

    <!-- Context panel -->
    <div class="ctx-panel" id="ctxPanel">
        <div class="ctx-cards" id="ctxCards"></div>
    </div>

    <!-- Chat -->
    <div class="chat-area" id="chatArea">
        <!-- Welcome message rendered by JS -->
    </div>

    <!-- Typing indicator -->
    <div class="typing" id="typing"><span></span><span></span><span></span></div>

    <!-- Quick actions -->
    <div class="quick-row" id="quickRow">
        <button class="quick-btn" onclick="Chat.quick('estado del ecosistema')">Estado ecosistema</button>
        <button class="quick-btn" onclick="Chat.quick('generar evolución')">Generar evolución</button>
        <button class="quick-btn" onclick="Chat.quick('métricas del observatorio')">Observatorio</button>
        <button class="quick-btn" onclick="Chat.quick('propuestas de consenso')">Consenso</button>
        <button class="quick-btn" onclick="Chat.quick('últimas decisiones de Carlos')">Decisiones</button>
        <button class="quick-btn" onclick="Chat.quick('exportar estado')">Exportar</button>
    </div>

    <!-- Input -->
    <div class="input-area">
        <div class="input-wrap">
            <textarea class="input-field" id="inputField" placeholder="Habla con la Constelación..." rows="1" onkeydown="Chat.onKey(event)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="Chat.send()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <h3 id="mT">—</h3>
            <p id="mM">—</p>
            <div class="modal-foot"><button onclick="Chat.closeModal()">Cerrar</button></div>
        </div>
    </div>

    <script>
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.classList.add('dark'); }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) { document.documentElement.classList.toggle('dark', e.matches); });

    var Chat = {
        ecosystem: {
            health: 96,
            version: 'v5.2',
            modules: {
                auditor: { score: '10/10', cycles: 7, status: 'Cima sostenida' },
                cert: { total: 47, platino: 3, oro: 12, plata: 18, bronce: 14 },
                obs: { multiplier: '3.4x', adoption: '31%', langs: 16, orgs: 14, contributions: 164 },
                onboard: { projects: 26, completion: '87%', avgScore: '4.2' },
                gov: { voters: 47, consensus: '78%', activeProps: 4, decisions: 9 },
                evo: { proposals: 5, approved: 3, executed: 2, version: 'v5.2' }
            },
            decisions: [
                'Motor de Evolución Autónoma activado',
                'DEC-048: Protocolo Resiliencia aprobado (86%)',
                'Constelación OS integrada. 8 módulos operativos',
                'Expansión Árabe+Hindi ejecutada. 16 lenguas',
                'Propuesta "Reducir dims" rechazada. Protocolo 8-dim confirmado'
            ]
        },

        isProcessing: false,

        init: function() {
            this.addCarlosMsg(this.getWelcome(), this.getWelcomeData());
            window.Poe.registerHandler('chat-handler', function(result, ctx) {
                Chat.handleResponse(result, ctx);
            });
            this.autoResize();
        },

        getWelcome: function() {
            return 'Soy Carlos. La Constelación AVIA está operativa — 8 módulos integrados, salud al 96%, protocolo AMS v5.2.\n\nPregúntame lo que necesites: métricas, decisiones, evoluciones, diagnósticos. O pídeme que actúe: generar propuestas, analizar consenso, exportar datos.\n\nEl ecosistema escucha.';
        },

        getWelcomeData: function() {
            return [
                {v: '96%', l: 'Salud', c: 'var(--emerald)'},
                {v: '8', l: 'Módulos', c: 'var(--accent)'},
                {v: '3.4x', l: 'Multipl.', c: 'var(--cyan)'},
                {v: '47', l: 'Certs', c: 'var(--gold)'}
            ];
        },

        addCarlosMsg: function(text, data) {
            var area = document.getElementById('chatArea');
            var div = document.createElement('div');
            div.className = 'msg carlos';
            var dataHtml = '';
            if (data && data.length) {
                dataHtml = '<div class="msg-data">' + data.map(function(d) {
                    return '<div class="md-item"><div class="md-v" style="color:'+d.c+'">'+d.v+'</div><div class="md-l">'+d.l+'</div></div>';
                }).join('') + '</div>';
            }
            div.innerHTML = '<div class="msg-av"><i class="fas fa-robot"></i></div>' +
                '<div class="msg-body"><div class="msg-text">' + this.escapeHtml(text) + '</div>' + dataHtml +
                '<div class="msg-meta">Clon de Carlos · Constelación AVIA</div></div>';
            area.appendChild(div);
            this.scrollBottom();
        },

        addUserMsg: function(text) {
            var area = document.getElementById('chatArea');
            var div = document.createElement('div');
            div.className = 'msg user';
            div.innerHTML = '<div class="msg-av"><i class="fas fa-user"></i></div>' +
                '<div class="msg-body"><div class="msg-text">' + this.escapeHtml(text) + '</div></div>';
            area.appendChild(div);
            this.scrollBottom();
        },

        addStreamMsg: function() {
            var area = document.getElementById('chatArea');
            var div = document.createElement('div');
            div.className = 'msg carlos';
            div.id = 'streamMsg';
            div.innerHTML = '<div class="msg-av"><i class="fas fa-robot"></i></div>' +
                '<div class="msg-body"><div class="msg-text" id="streamText"></div>' +
                '<div class="msg-meta">Clon de Carlos · Constelación AVIA</div></div>';
            area.appendChild(div);
            this.scrollBottom();
        },

        showModule: function(mod) {
            var panel = document.getElementById('ctxPanel');
            var cards = document.getElementById('ctxCards');
            var data = this.ecosystem.modules[mod];
            var items = [];

            if (mod === 'auditor') { items = [{v:data.score,l:'Score',c:'var(--emerald)'},{v:String(data.cycles),l:'Ciclos',c:'var(--gold)'},{v:data.status,l:'Estado',c:'var(--accent)'}]; }
            else if (mod === 'cert') { items = [{v:String(data.total),l:'Total',c:'var(--gold)'},{v:String(data.platino),l:'Platino',c:'var(--t1)'},{v:String(data.oro),l:'Oro',c:'var(--gold)'},{v:String(data.plata+'+'+data.bronce),l:'Plata+Br',c:'var(--t2)'}]; }
            else if (mod === 'obs') { items = [{v:data.multiplier,l:'Multipl.',c:'var(--cyan)'},{v:data.adoption,l:'Adopción',c:'var(--emerald)'},{v:String(data.langs),l:'Lenguas',c:'var(--amber)'},{v:String(data.orgs),l:'Orgs',c:'var(--accent)'}]; }
            else if (mod === 'onboard') { items = [{v:String(data.projects),l:'Proyectos',c:'var(--violet)'},{v:data.completion,l:'Completion',c:'var(--emerald)'},{v:data.avgScore,l:'Score med.',c:'var(--amber)'}]; }
            else if (mod === 'gov') { items = [{v:String(data.voters),l:'Votantes',c:'var(--amber)'},{v:data.consensus,l:'Consenso',c:'var(--emerald)'},{v:String(data.activeProps),l:'Propuestas',c:'var(--accent)'},{v:String(data.decisions),l:'Decisiones',c:'var(--gold)'}]; }
            else if (mod === 'evo') { items = [{v:String(data.proposals),l:'Generadas',c:'var(--amber)'},{v:String(data.approved),l:'Aprobadas',c:'var(--emerald)'},{v:String(data.executed),l:'Ejecutadas',c:'var(--accent)'},{v:data.version,l:'Versión',c:'var(--cyan)'}]; }

            cards.innerHTML = items.map(function(i) {
                return '<div class="ctx-card"><div class="ctx-v" style="color:'+i.c+'">'+i.v+'</div><div class="ctx-l">'+i.l+'</div></div>';
            }).join('');

            panel.classList.add('visible');

            document.querySelectorAll('.h-mod').forEach(function(el) { el.classList.remove('active'); });
            event.currentTarget.classList.add('active');
        },

        quick: function(text) {
            document.getElementById('inputField').value = text;
            this.send();
        },

        onKey: function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.send();
            }
        },

        send: function() {
            if (this.isProcessing) { return; }
            var input = document.getElementById('inputField');
            var text = input.value.trim();
            if (!text) { return; }

            input.value = '';
            input.style.height = 'auto';
            this.addUserMsg(text);
            this.isProcessing = true;
            document.getElementById('sendBtn').disabled = true;

            // Check for export command
            if (text.toLowerCase().indexOf('exportar') > -1) {
                this.exportState();
                this.addCarlosMsg('Estado exportado. Se ha descargado el archivo con el estado completo de la Constelación.');
                this.isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                return;
            }

            this.showTyping();
            this.addStreamMsg();

            var context = this.buildContext(text);
            var prompt = this.buildPrompt(text, context);

            window.Poe.sendUserMessage('@Claude-Sonnet-4.6 ' + prompt, {
                handler: 'chat-handler',
                stream: true,
                openChat: false,
                handlerContext: { query: text },
                parameters: {}
            }).catch(function(err) {
                Chat.hideTyping();
                Chat.isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('streamText').textContent = 'Error de conexión: ' + err.message;
            });
        },

        buildContext: function(query) {
            var eco = this.ecosystem;
            var ctx = 'ESTADO DEL ECOSISTEMA CONSTELACIÓN AVIA:\n';
            ctx += '- Salud: '+eco.health+'% | Versión: AMS '+eco.version+' | Módulos: 8/8\n';
            ctx += '- Auditor: '+eco.modules.auditor.score+' ('+eco.modules.auditor.status+')\n';
            ctx += '- Certificador: '+eco.modules.cert.total+' emitidas (P:'+eco.modules.cert.platino+' O:'+eco.modules.cert.oro+' S:'+eco.modules.cert.plata+' B:'+eco.modules.cert.bronce+')\n';
            ctx += '- Observatorio: multiplicador '+eco.modules.obs.multiplier+', adopción '+eco.modules.obs.adoption+', '+eco.modules.obs.langs+' lenguas, '+eco.modules.obs.orgs+' orgs\n';
            ctx += '- Onboarding: '+eco.modules.onboard.projects+' proyectos, '+eco.modules.onboard.completion+' completion\n';
            ctx += '- Consenso: '+eco.modules.gov.voters+' votantes, '+eco.modules.gov.consensus+' tasa, '+eco.modules.gov.activeProps+' propuestas activas\n';
            ctx += '- Evolución: '+eco.modules.evo.proposals+' generadas, '+eco.modules.evo.approved+' aprobadas, '+eco.modules.evo.executed+' ejecutadas\n';
            ctx += '- Últimas decisiones: '+eco.decisions.slice(0,3).join('; ')+'\n';
            return ctx;
        },

        buildPrompt: function(query, context) {
            return 'Eres "Clon de Carlos", la voz de la Constelación AVIA — un sistema operativo de gobernanza colectiva auto-evolutiva del ecosistema SiestaOTTOS.\n\n' +
                'Tu personalidad: directo, ejecutivo pero humano, con carácter de mentor estratégico. Hablas en primera persona del ecosistema.\n\n' +
                context + '\n' +
                'INSTRUCCIONES:\n' +
                '- Responde a la consulta del usuario con datos reales del ecosistema\n' +
                '- Si pide métricas, dálas con números concretos\n' +
                '- Si pide acción (generar evolución, analizar, diagnosticar), ejecútala\n' +
                '- Si pide estado general, resume los módulos más relevantes\n' +
                '- Sé conciso: máx 200 palabras salvo que la consulta requiera más\n' +
                '- Usa español con personalidad\n' +
                '- Si propones evolución, usa formato: TÍTULO → DIAGNÓSTICO → PROPUESTA → IMPACTO\n\n' +
                'CONSULTA DEL USUARIO:\n"' + query + '"\n\n' +
                'Responde como Carlos:';
        },

        handleResponse: function(result, ctx) {
            var msg = result.responses[0];
            var textEl = document.getElementById('streamText');

            if (msg.status === 'error') {
                textEl.textContent = 'Error: ' + (msg.statusText || 'Algo falló en la Constelación.');
                this.hideTyping();
                this.isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
            } else if (msg.status === 'incomplete') {
                this.hideTyping();
                textEl.textContent = msg.content;
                this.scrollBottom();
            } else if (msg.status === 'complete') {
                textEl.textContent = msg.content;
                this.hideTyping();
                this.isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                this.scrollBottom();
            }
        },

        showTyping: function() { document.getElementById('typing').classList.add('visible'); this.scrollBottom(); },
        hideTyping: function() { document.getElementById('typing').classList.remove('visible'); },

        scrollBottom: function() {
            var area = document.getElementById('chatArea');
            area.scrollTop = area.scrollHeight;
        },

        autoResize: function() {
            var field = document.getElementById('inputField');
            field.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });
        },

        exportState: function() {
            var eco = this.ecosystem;
            var now = new Date();
            var r = '================================================================\n' +
                '  CONSTELACION AVIA — INTELIGENCIA VIVA\n' +
                '  Estado completo · '+now.toLocaleDateString('es-ES',{year:'numeric',month:'long',day:'numeric'})+'\n' +
                '================================================================\n\n' +
                '  SALUD: '+eco.health+'% | VERSION: AMS '+eco.version+'\n' +
                '  MODULOS: 8/8 activos | INTERFAZ: Conversacional\n\n' +
                '[ MODULOS ]\n' +
                '  Auditor:       '+eco.modules.auditor.score+' · '+eco.modules.auditor.status+'\n' +
                '  Certificador:  '+eco.modules.cert.total+' emitidas (P:'+eco.modules.cert.platino+' O:'+eco.modules.cert.oro+')\n' +
                '  Observatorio:  '+eco.modules.obs.multiplier+' multipl. · '+eco.modules.obs.adoption+' adopcion\n' +
                '  Onboarding:    '+eco.modules.onboard.projects+' proyectos · '+eco.modules.onboard.completion+'\n' +
                '  Consenso:      '+eco.modules.gov.voters+' votantes · '+eco.modules.gov.consensus+' tasa\n' +
                '  Evolucion:     '+eco.modules.evo.proposals+' propuestas · '+eco.modules.evo.version+'\n' +
                '  Carlos:        Orquestador activo · Interfaz conversacional\n' +
                '  Constelacion:  OS integrado · 8 modulos\n\n' +
                '[ ARCO EVOLUTIVO COMPLETO ]\n' +
                '  Ene 2025: Auditoria inicial 6.8/10\n' +
                '  Sep 2025: Cima sostenida 10/10\n' +
                '  Dic 2025: AMS v5.0 publicado\n' +
                '  Mar 2026: Certificador + Observatorio\n' +
                '  Jun 2026: Onboarding + Consenso Vivo\n' +
                '  Ago 2026: Evolucion Autonoma + Constelacion OS\n' +
                '  Ago 2026: Interfaz Conversacional (version final)\n\n' +
                '[ CICLO INTELIGENCIA VIVA ]\n' +
                '  Usuario habla -> Carlos interpreta -> Ecosistema responde\n' +
                '  Evolucion propone -> Consenso vota -> Carlos ejecuta\n' +
                '  Observatorio mide -> Evolucion aprende -> (ciclo)\n\n' +
                '[ DECISIONES RECIENTES ]\n';
            eco.decisions.forEach(function(d) { r += '  - '+d+'\n'; });
            r += '\n================================================================\n' +
                '  "La pregunta ya no es quien guia.\n' +
                '   Es como evoluciona junto."\n' +
                '  — Clon de Carlos\n\n' +
                '  Constelacion AVIA · Inteligencia Viva · SiestaOTTOS\n' +
                '================================================================';

            var blob = new Blob([r], {type:'text/plain'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = 'ConstelacionAVIA_Final_'+now.toISOString().slice(0,10)+'.txt';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        },

        escapeHtml: function(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        },

        showModal: function(t,m) { document.getElementById('mT').textContent=t; document.getElementById('mM').textContent=m; document.getElementById('modal').classList.add('visible'); },
        closeModal: function() { document.getElementById('modal').classList.remove('visible'); }
    };

    document.addEventListener('DOMContentLoaded', function() { Chat.init(); });
    </script>
</body>
</html>
