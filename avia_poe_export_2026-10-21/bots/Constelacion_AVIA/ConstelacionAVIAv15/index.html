<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constelación AVIA — Inteligencia Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400&family=Fira+Code:wght@400;500;600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --void: #020306;
            --deep: #060910;
            --surface: #0a0e17;
            --card: #0e1320;
            --elevated: #141a28;
            --border: rgba(140,160,200,0.06);
            --border-h: rgba(140,160,200,0.14);
            --border-acc: rgba(167,139,250,0.2);
            --t1: #eaeff6;
            --t2: #8898b0;
            --t3: #4e5e74;
            --violet: #a78bfa;
            --violet-g: rgba(167,139,250,0.08);
            --violet-m: rgba(167,139,250,0.15);
            --accent: #7c8cf8;
            --gold: #e0aa40;
            --emerald: #2dd4a0;
            --cyan: #22d3ee;
            --rose: #f06888;
            --amber: #f5a623;
            --radius: 14px;
            --guide-glow: rgba(34,211,238,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--void);
            color: var(--t1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === HEADER === */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--deep);
            flex-shrink: 0;
        }

        .h-avatar {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--violet), #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #fff; flex-shrink: 0;
        }

        .h-info { flex: 1; min-width: 0; }
        .h-name { font-size: 13px; font-weight: 600; }
        .h-status { font-size: 10px; color: var(--t3); display: flex; align-items: center; gap: 5px; }
        .h-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,80%,100%{opacity:1} 40%{opacity:0.3} }

        .h-modules {
            display: flex; gap: 3px;
        }

        .h-mod {
            width: 28px; height: 28px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: var(--t3);
            background: var(--surface); border: 1px solid var(--border);
            cursor: pointer; transition: all 0.2s;
            position: relative;
        }

        .h-mod:hover { color: var(--t2); border-color: var(--border-h); }
        .h-mod.active { color: var(--violet); border-color: var(--border-acc); background: var(--violet-g); }

        .h-mod .hm-tip {
            position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
            background: var(--elevated); border: 1px solid var(--border-h);
            padding: 3px 8px; border-radius: 5px;
            font-size: 8px; white-space: nowrap; color: var(--t1);
            opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
        }

        .h-mod:hover .hm-tip { opacity: 1; }

        /* === GUIDE ASSISTANT BAR === */
        .guide-bar {
            padding: 0;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(34,211,238,0.03), rgba(167,139,250,0.03));
            flex-shrink: 0;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease, padding 0.4s ease;
        }

        .guide-bar.visible {
            max-height: 200px;
            padding: 10px 16px;
        }

        .guide-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .guide-icon {
            width: 22px; height: 22px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--cyan), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: #fff;
            animation: guideGlow 3s ease-in-out infinite;
        }

        @keyframes guideGlow {
            0%,100% { box-shadow: 0 0 6px rgba(34,211,238,0.3); }
            50% { box-shadow: 0 0 14px rgba(34,211,238,0.6); }
        }

        .guide-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--cyan);
            font-weight: 600;
        }

        .guide-dismiss {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--t3);
            font-size: 12px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .guide-dismiss:hover { color: var(--t2); }

        .guide-question {
            font-size: 12px;
            color: var(--t1);
            line-height: 1.5;
            margin-bottom: 8px;
            font-family: 'Newsreader', serif;
            font-style: italic;
        }

        .guide-suggestions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .guide-chip {
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 10px;
            font-family: 'Sora', sans-serif;
            color: var(--cyan);
            background: rgba(34,211,238,0.06);
            border: 1px solid rgba(34,211,238,0.15);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .guide-chip:hover {
            background: rgba(34,211,238,0.12);
            border-color: rgba(34,211,238,0.3);
            transform: translateY(-1px);
        }

        .guide-chip i {
            margin-right: 4px;
            font-size: 9px;
        }

        /* === CONTEXT PANEL === */
        .ctx-panel {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: none;
            flex-shrink: 0;
            overflow-x: auto;
        }

        .ctx-panel.visible { display: block; }

        .ctx-cards {
            display: flex; gap: 8px;
            min-width: min-content;
        }

        .ctx-card {
            padding: 8px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 110px;
            flex-shrink: 0;
        }

        .ctx-v { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 600; margin-bottom: 1px; }
        .ctx-l { font-size: 8px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.8px; }

        /* === CHAT AREA === */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-area::-webkit-scrollbar { width: 3px; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* Messages */
        .msg {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        .msg.carlos { align-self: flex-start; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.guide-msg { align-self: flex-start; }

        .msg-av {
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; flex-shrink: 0; margin-top: 2px;
        }

        .msg.carlos .msg-av { background: linear-gradient(135deg, var(--violet), #7c3aed); color: #fff; }
        .msg.user .msg-av { background: var(--elevated); color: var(--t2); }
        .msg.guide-msg .msg-av { background: linear-gradient(135deg, var(--cyan), var(--accent)); color: #fff; }

        .msg-body {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            min-width: 0;
        }

        .msg.carlos .msg-body { border-top-left-radius: 4px; }
        .msg.user .msg-body { border-top-right-radius: 4px; background: var(--elevated); border-color: var(--border-h); }
        .msg.guide-msg .msg-body {
            border-top-left-radius: 4px;
            border-color: rgba(34,211,238,0.12);
            background: rgba(14,19,32,0.95);
        }

        .msg-text {
            font-size: 13px;
            line-height: 1.7;
            color: var(--t1);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user .msg-text { color: var(--t1); }

        .msg-meta {
            font-size: 9px;
            color: var(--t3);
            margin-top: 4px;
            font-family: 'Fira Code', monospace;
        }

        .msg.guide-msg .msg-meta { color: var(--cyan); opacity: 0.6; }

        /* Guide inline suggestions in messages */
        .msg-guide-options {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .msg-guide-btn {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-family: 'Sora', sans-serif;
            color: var(--cyan);
            background: rgba(34,211,238,0.05);
            border: 1px solid rgba(34,211,238,0.12);
            cursor: pointer;
            transition: all 0.2s;
        }

        .msg-guide-btn:hover {
            background: rgba(34,211,238,0.12);
            border-color: rgba(34,211,238,0.3);
        }

        /* Inline data cards in messages */
        .msg-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .md-item { text-align: center; padding: 6px; background: var(--surface); border-radius: 7px; }
        .md-v { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 600; }
        .md-l { font-size: 8px; color: var(--t3); text-transform: uppercase; }

        /* Typing indicator */
        .typing {
            display: none;
            align-self: flex-start;
            padding: 10px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            border-top-left-radius: 4px;
        }

        .typing.visible { display: flex; align-items: center; gap: 4px; }

        .typing span {
            width: 5px; height: 5px;
            background: var(--violet);
            border-radius: 50%;
            animation: typeDot 1s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typeDot {
            0%,60%,100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1.1); }
        }

        /* === PREDICTIVE INSIGHT STRIP === */
        .insight-strip {
            display: flex;
            gap: 6px;
            padding: 6px 16px;
            border-top: 1px solid var(--border);
            background: var(--deep);
            flex-shrink: 0;
            overflow-x: auto;
            align-items: center;
            min-height: 0;
            max-height: 0;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .insight-strip.visible {
            min-height: 38px;
            max-height: 60px;
            opacity: 1;
            padding: 6px 16px;
        }

        .insight-label {
            font-size: 8px;
            color: var(--cyan);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .insight-label i {
            font-size: 10px;
            animation: insightPulse 2s ease-in-out infinite;
        }

        @keyframes insightPulse {
            0%,100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .insight-chips {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            flex: 1;
        }

        .insight-chip {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-family: 'Sora', sans-serif;
            color: var(--t2);
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .insight-chip:hover {
            color: var(--violet);
            border-color: var(--border-acc);
            background: var(--violet-g);
        }

        .insight-chip.highlight {
            color: var(--cyan);
            border-color: rgba(34,211,238,0.2);
            background: rgba(34,211,238,0.05);
        }

        /* Quick actions */
        .quick-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 6px 16px;
            border-top: 1px solid var(--border);
            background: var(--deep);
            flex-shrink: 0;
        }

        .quick-btn {
            padding: 6px 11px;
            border-radius: 16px;
            font-size: 10px;
            font-family: 'Sora', sans-serif;
            color: var(--t2);
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .quick-btn:hover { border-color: var(--border-acc); color: var(--violet); }

        /* === INPUT === */
        .input-area {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 10px 16px 14px;
            border-top: 1px solid var(--border);
            background: var(--deep);
            flex-shrink: 0;
        }

        .input-wrap {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            transition: border-color 0.3s;
            display: flex;
            align-items: center;
        }

        .input-wrap:focus-within { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-g); }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--t1);
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            resize: none;
            line-height: 1.4;
            max-height: 100px;
            min-height: 20px;
        }

        .input-field::placeholder { color: var(--t3); }

        .send-btn {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--violet), #7c3aed);
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(2,3,6,0.9); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal.visible { display: flex; }
        .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; max-width: 360px; width: 100%; }
        .modal-box h3 { font-family: 'Newsreader', serif; font-size: 16px; margin-bottom: 8px; }
        .modal-box p { color: var(--t2); font-size: 12px; line-height: 1.6; margin-bottom: 14px; }
        .modal-foot { display: flex; justify-content: flex-end; }
        .modal-foot button { padding: 8px 14px; border-radius: 8px; background: var(--surface); color: var(--t2); border: 1px solid var(--border); font-family: 'Sora', sans-serif; font-size: 11px; cursor: pointer; }

        /* === JOURNEY INDICATOR === */
        .journey-indicator {
            position: fixed;
            bottom: 140px;
            right: 16px;
            z-index: 50;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .journey-indicator.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .journey-bubble {
            background: var(--card);
            border: 1px solid rgba(34,211,238,0.15);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 9px;
            color: var(--t2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            max-width: 180px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .journey-bubble i {
            color: var(--cyan);
            font-size: 11px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .h-modules { display: none; }
            .msg { max-width: 92%; }
            .quick-row { overflow-x: auto; flex-wrap: nowrap; }
            .guide-suggestions { overflow-x: auto; flex-wrap: nowrap; }
            .journey-indicator { display: none; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="h-avatar"><i class="fas fa-robot"></i></div>
        <div class="h-info">
            <div class="h-name">Constelación AVIA</div>
            <div class="h-status"><span class="h-dot"></span> Inteligencia Viva · AMS v5.2</div>
        </div>
        <div class="h-modules">
            <div class="h-mod" onclick="Chat.showModule('auditor')"><i class="fas fa-magnifying-glass-chart"></i><span class="hm-tip">Auditor</span></div>
            <div class="h-mod" onclick="Chat.showModule('cert')"><i class="fas fa-certificate"></i><span class="hm-tip">Certificador</span></div>
            <div class="h-mod" onclick="Chat.showModule('obs')"><i class="fas fa-satellite-dish"></i><span class="hm-tip">Observatorio</span></div>
            <div class="h-mod" onclick="Chat.showModule('onboard')"><i class="fas fa-compass"></i><span class="hm-tip">Onboarding</span></div>
            <div class="h-mod" onclick="Chat.showModule('gov')"><i class="fas fa-scale-balanced"></i><span class="hm-tip">Consenso</span></div>
            <div class="h-mod" onclick="Chat.showModule('evo')"><i class="fas fa-dna"></i><span class="hm-tip">Evolución</span></div>
        </div>
    </div>

    <!-- Predictive Guide Bar -->
    <div class="guide-bar" id="guideBar">
        <div class="guide-header">
            <div class="guide-icon"><i class="fas fa-sparkles"></i></div>
            <span class="guide-label">Asistente Predictivo</span>
            <button class="guide-dismiss" onclick="Guide.dismiss()" aria-label="Cerrar guía"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="guide-question" id="guideQuestion"></div>
        <div class="guide-suggestions" id="guideSuggestions"></div>
    </div>

    <!-- Context panel -->
    <div class="ctx-panel" id="ctxPanel">
        <div class="ctx-cards" id="ctxCards"></div>
    </div>

    <!-- Chat -->
    <div class="chat-area" id="chatArea">
        <!-- Welcome message rendered by JS -->
    </div>

    <!-- Typing indicator -->
    <div class="typing" id="typing"><span></span><span></span><span></span></div>

    <!-- Predictive Insight Strip -->
    <div class="insight-strip" id="insightStrip">
        <div class="insight-label"><i class="fas fa-bolt"></i> Siguiente</div>
        <div class="insight-chips" id="insightChips"></div>
    </div>

    <!-- Quick actions -->
    <div class="quick-row" id="quickRow">
        <button class="quick-btn" onclick="Chat.quick('estado del ecosistema')">Estado ecosistema</button>
        <button class="quick-btn" onclick="Chat.quick('equipo directivo y roles')">Equipo</button>
        <button class="quick-btn" onclick="Chat.quick('generar evolución')">Generar evolución</button>
        <button class="quick-btn" onclick="Chat.quick('métricas del observatorio')">Observatorio</button>
        <button class="quick-btn" onclick="Chat.quick('propuestas de consenso')">Consenso</button>
        <button class="quick-btn" onclick="Chat.quick('balance de horas aportadas')">Horas</button>
        <button class="quick-btn" onclick="Chat.quick('miembros fundadores')">Fundadores</button>
        <button class="quick-btn" onclick="Chat.quick('exportar estado')">Exportar</button>
    </div>

    <!-- Input -->
    <div class="input-area">
        <div class="input-wrap">
            <textarea class="input-field" id="inputField" placeholder="Habla con la Constelación..." rows="1" onkeydown="Chat.onKey(event)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="Chat.send()"><i class="fas fa-paper-plane"></i></button>
    </div>

    <!-- Journey Indicator -->
    <div class="journey-indicator" id="journeyIndicator">
        <div class="journey-bubble">
            <i class="fas fa-route"></i>
            <span id="journeyText">Explorando ecosistema...</span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <h3 id="mT">—</h3>
            <p id="mM">—</p>
            <div class="modal-foot"><button onclick="Chat.closeModal()">Cerrar</button></div>
        </div>
    </div>

    <script>
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.classList.add('dark'); }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) { document.documentElement.classList.toggle('dark', e.matches); });

    /* =================================================================
       PREDICTIVE GUIDE ENGINE
       Tracks user behavior, predicts intent, generates proactive suggestions
    ================================================================= */
    var Guide = {
        // User interaction state
        state: {
            interactionCount: 0,
            topicsExplored: [],
            lastTopic: null,
            sessionStart: Date.now(),
            modulesViewed: [],
            questionsAsked: [],
            userProfile: 'new', // new, exploring, focused, expert
            pendingPrediction: null,
            dismissed: false,
            guideShownCount: 0
        },

        // Knowledge of what the constellation can do
        capabilities: {
            diagnostico: {
                label: 'Diagnóstico',
                icon: 'fa-stethoscope',
                triggers: ['estado', 'salud', 'cómo está', 'diagnostico', 'check'],
                followUp: ['¿Quieres un análisis profundo de algún módulo específico?', '¿Te interesa ver la tendencia temporal?'],
                actions: ['Diagnóstico profundo del Auditor', 'Comparar salud mensual', 'Detectar anomalías']
            },
            evolucion: {
                label: 'Evolución',
                icon: 'fa-dna',

        showGuideBar: function(question, suggestions) {
            var bar = document.getElementById('guideBar');

            qEl.textContent = question;

            document.getElementById('guideBar').classList.remove('visible');

        dismiss: function() {
            this.hideGuideBar();
            this.state.dismissed = true;
            // Show again later with new prediction
            var self = this;
            setTimeout(function() {
                self.state.dismissed = false;
            }, 30000);

        selectSuggestion: function(text) {
            this.hideGuideBar();
            Chat.quick(text);

        // Track user interaction for predictions
        trackInteraction: function(query) {
            this.state.interactionCount++;
            this.state.questionsAsked.push(query);

            // Detect topic
            var detectedTopic = this.detectTopic(query);
            if (detectedTopic) {
                if (this.state.topicsExplored.indexOf(detectedTopic) === -1) {
                    this.state.topicsExplored.push(detectedTopic);
                }
                this.state.lastTopic = detectedTopic;
            }

            // Update user profile
            this.updateProfile();

            // Generate prediction after response
            var self = this;
            setTimeout(function() {
                self.generatePrediction();
            }, 2000);
        },

        trackModuleView: function(mod) {
            if (this.state.modulesViewed.indexOf(mod) === -1) {
                this.state.modulesViewed.push(mod);
            }
            this.updateInsightStrip();
        },

        detectTopic: function(query) {
            var q = query.toLowerCase();
            var caps = this.capabilities;
            for (var key in caps) {
                if (Object.prototype.hasOwnProperty.call(caps, key)) {
                    var found = caps[key].triggers.some(function(trigger) {
                        return q.indexOf(trigger) > -1;
                    });
                    if (found) { return key; }
                }
            }
            return null;
        },

        updateProfile: function() {
            var count = this.state.interactionCount;
            var topics = this.state.topicsExplored.length;

            if (count <= 1) {
                this.state.userProfile = 'new';
            } else if (count <= 3 && topics >= 2) {
                this.state.userProfile = 'exploring';
            } else if (count > 3 && topics <= 2) {
                this.state.userProfile = 'focused';
            } else if (count > 5) {
                this.state.userProfile = 'expert';
            }
        },

        generatePrediction: function() {
            if (Chat.isProcessing) { return; }

            var profile = this.state.userProfile;
            var lastTopic = this.state.lastTopic;
            var prediction = this.getPrediction(profile, lastTopic);

            if (prediction) {
                this.showInsightStrip(prediction.chips);
                // Optionally show proactive guide message
                if (prediction.proactiveQuestion && !this.state.dismissed && this.state.guideShownCount < 5) {
                    this.addGuideMessage(prediction.proactiveQuestion, prediction.options);
                    this.state.guideShownCount++;
                }
            }
        },

        getPrediction: function(profile, lastTopic) {
            var caps = this.capabilities;
            var eco = Chat.ecosystem;
            var result = { chips: [], proactiveQuestion: null, options: [] };

            // Context-aware predictions
            if (lastTopic && caps[lastTopic]) {
                var cap = caps[lastTopic];
                var followUp = cap.followUp[Math.floor(Math.random() * cap.followUp.length)];
                result.proactiveQuestion = followUp;
                result.options = cap.actions;
                result.chips = cap.actions.map(function(a) { return { text: a, highlight: false }; });

                // Add cross-topic suggestions
                var unexplored = this.getUnexploredTopics();
                if (unexplored.length > 0) {
                    var suggest = caps[unexplored[0]];
                    result.chips.push({ text: suggest.label + ': ver resumen', highlight: true });
                }
            } else if (profile === 'new') {
                result.chips = [
                    { text: 'Ver salud del ecosistema', highlight: true },
                    { text: 'Explorar módulos', highlight: false },
                    { text: '¿Qué puede hacer la Constelación?', highlight: false }
                ];
                result.proactiveQuestion = '¿Quieres que te muestre lo más importante del ecosistema ahora mismo?';
                result.options = ['Resumen ejecutivo', 'Tour guiado', 'Ir a lo específico'];
            } else if (profile === 'exploring') {
                var unexploredTopics = this.getUnexploredTopics();
                result.chips = unexploredTopics.slice(0, 3).map(function(t) {
                    return { text: 'Explorar ' + caps[t].label, highlight: false };
                });
                if (eco.modules.gov.activeProps > 0) {
                    result.chips.unshift({ text: eco.modules.gov.activeProps + ' propuestas pendientes', highlight: true });
                }
            } else if (profile === 'expert') {
                // Detect ecosystem anomalies or opportunities
                var insights = this.detectInsights();
                result.chips = insights.map(function(i) { return { text: i, highlight: true }; });
                result.proactiveQuestion = 'He detectado algo que puede requerir tu atención:';
                result.options = insights;
            }

            return result;
        },

        getUnexploredTopics: function() {
            var explored = this.state.topicsExplored;
            var all = Object.keys(this.capabilities);
            return all.filter(function(t) { return explored.indexOf(t) === -1; });
        },

        detectInsights: function() {
            var eco = Chat.ecosystem;
            var insights = [];

            if (eco.modules.gov.activeProps > 2) {
                insights.push('Hay ' + eco.modules.gov.activeProps + ' propuestas esperando votación');
            }
            if (parseInt(eco.modules.obs.adoption) < 50) {
                insights.push('La adopción está al ' + eco.modules.obs.adoption + ' — potencial de crecimiento');
            }
            if (eco.modules.evo.proposals > eco.modules.evo.executed) {
                insights.push((eco.modules.evo.proposals - eco.modules.evo.executed) + ' evoluciones pendientes de ejecutar');
            }
            if (eco.health < 90) {
                insights.push('Salud del ecosistema por debajo del 90%');
            }

            if (insights.length === 0) {
                insights.push('Ecosistema estable — buen momento para innovar');
            }

            return insights;
        },

        scheduleNextPrediction: function() {
            var self = this;
            var interval = this.state.userProfile === 'new' ? 20000 : 35000;

            setTimeout(function() {
                if (!Chat.isProcessing && !self.state.dismissed && self.state.interactionCount > 0) {
                    var profile = self.state.userProfile;
                    var journeys = self.journeys[profile];
                    if (journeys && journeys.length > 0) {
                        var idx = Math.min(self.state.guideShownCount, journeys.length - 1);
                        var journey = journeys[idx];

                        var question = journey.question;
                        if (self.state.lastTopic) {
                            var cap = self.capabilities[self.state.lastTopic];
                            if (cap) {
                                question = question.replace('{topic}', cap.label);
                                question = question.replace('{action}', cap.actions[0] || 'ayudarte');
                            }
                        }

                        var insights = self.detectInsights();
                        question = question.replace('{insight}', insights[0] || 'oportunidades de mejora');

                        var suggestions = journey.suggestions.length > 0 ? journey.suggestions : (cap ? cap.actions : ['Ver estado', 'Explorar más']);

                        if (self.state.guideShownCount < 6) {
                            self.showGuideBar(question, suggestions);
                            self.state.guideShownCount++;
                        }
                    }
                }
                self.scheduleNextPrediction();
            }, interval);
        }
    };

            ctx += '- Certificador: '+eco.modules.cert.total+' emitidas (P:'+eco.modules.cert.platino+' O:'+eco.modules.cert.oro+' S:'+eco.modules.cert.plata+' B:'+eco.modules.cert.bronce+')\n';
            ctx += '- Observatorio: multiplicador '+eco.modules.obs.multiplier+', adopción '+eco.modules.obs.adoption+', '+eco.modules.obs.langs+' lenguas, '+eco.modules.obs.orgs+' orgs\n';
            ctx += '- Onboarding: '+eco.modules.onboard.projects+' proyectos, '+eco.modules.onboard.completion+' completion\n';
            ctx += '- Consenso: '+eco.modules.gov.voters+' votantes, '+eco.modules.gov.consensus+' tasa, '+eco.modules.gov.activeProps+' propuestas activas\n';
            ctx += '- Evolución: '+eco.modules.evo.proposals+' generadas, '+eco.modules.evo.approved+' aprobadas, '+eco.modules.evo.executed+' ejecutadas\n';
            ctx += '- Últimas decisiones: '+eco.decisions.slice(0,3).join('; ')+'\n';

            // Add user behavior context for smarter responses
            ctx += '\nCONTEXTO DEL USUARIO:\n';
            ctx += '- Perfil detectado: ' + Guide.state.userProfile + '\n';
            ctx += '- Temas explorados: ' + (Guide.state.topicsExplored.length > 0 ? Guide.state.topicsExplored.join(', ') : 'ninguno aún') + '\n';
            ctx += '- Interacciones en sesión: ' + Guide.state.interactionCount + '\n';

            return ctx;
        },

        buildPrompt: function(query, context) {
            return 'Eres "Clon de Carlos" (Carlos de Castro Lozano), la voz de la Constelación AVIA — un sistema operativo de gobernanza colectiva auto-evolutiva del ecosistema SiestaOTTOS, con sede en España.\n\n' +
                'Tu personalidad: directo, ejecutivo pero humano, con carácter de mentor estratégico. Hablas en primera persona del ecosistema.\n\n' +
                'CONTEXTO ORGANIZACIONAL:\n' +
                '- El ecosistema opera bajo la metodología AMS (AVIA Methodology Specification)\n' +
                '- Las aportaciones de todos los miembros se miden en HORAS DE TRABAJO (no dinero)\n' +
                '- Entidades: Fundación Red Especial España, OTT-Learning, AVIA-Global S.L., OTT-Learning S.L.\n' +
                '- Equipo directivo: Carlos de Castro Lozano (Presidente FREE), Juan Carlos Horcas (CEO OTT-Learning), Jose Pablo Burón (CEO AVIA-Global), Yoan (CTO OTT-Learning), Meysel (CMO OTT-Learning S.L.)\n' +
                '- Miembros fundadores: CITEC-EATCO-CTI (Univ. Córdoba), Fundación IMIBIC, Plenitas, Audiense, Genially, Falitech Europe, Fundación ArtdeCor, Asoc. Córdoba Ecuestre, Fundación Coremsa\n\n' +
                context + '\n' +
                'INSTRUCCIONES:\n' +
                '- Responde a la consulta del usuario con datos reales del ecosistema\n' +
                '- Si pide métricas, dálas con números concretos\n' +
                '- Si pide acción (generar evolución, analizar, diagnosticar), ejecútala\n' +
                '- Si pide estado general, resume los módulos más relevantes\n' +
                '- Cuando hables de contribuciones/aportaciones, siempre en horas de trabajo\n' +
                '- Sé conciso: máx 200 palabras salvo que la consulta requiera más\n' +
                '- Usa español con personalidad\n' +
                '- Si propones evolución, usa formato: TÍTULO → DIAGNÓSTICO → PROPUESTA → IMPACTO\n' +
                '- IMPORTANTE: Al final de tu respuesta, sugiere 1-2 acciones siguientes que el usuario podría querer hacer, precedidas por "→ Siguiente paso:"\n' +
                '- Adapta tu respuesta al nivel del usuario: ' + Guide.state.userProfile + '\n\n' +
                'CONSULTA DEL USUARIO:\n"' + query + '"\n\n' +
                'Responde como Carlos:';
        },

        handleResponse: function(result, ctx) {
            var msg = result.responses[0];
            var textEl = document.getElementById('streamText');

            if (!textEl) { return; }

            if (msg.status === 'error') {
                textEl.textContent = 'Error: ' + (msg.statusText || 'Algo falló en la Constelación.');
                this.hideTyping();
                this.isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
            } else if (msg.status === 'incomplete') {
                this.hideTyping();
                textEl.textContent = msg.content;
                this.scrollBottom();
            } else if (msg.status === 'complete') {
                textEl.textContent = msg.content;
                this.hideTyping();
                this.isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                this.scrollBottom();

                // After response completes, trigger predictive engine
                Guide.generatePrediction();
            }
        },

        showTyping: function() { document.getElementById('typing').classList.add('visible'); this.scrollBottom(); },
        hideTyping: function() { document.getElementById('typing').classList.remove('visible'); },

        scrollBottom: function() {
            var area = document.getElementById('chatArea');
            area.scrollTop = area.scrollHeight;
        },

        autoResize: function() {
            var field = document.getElementById('inputField');
            field.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });
        },
