<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Hub Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 40px; }
        .header h1 { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .status {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .status-indicator {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .status-indicator.error { background: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .agent-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .agent-card:hover { transform: translateY(-5px); }
        .agent-card h3 { margin-bottom: 15px; font-size: 1.4em; }
        .agent-status { 
            background: rgba(255,255,255,0.2); 
            padding: 8px 12px; 
            border-radius: 6px; 
            margin: 10px 0;
            font-size: 0.95em;
        }
        .test-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .test-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            font-weight: 600;
        }
        .test-button:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .test-button:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 400px;
            overflow-y: auto;
        }
        .error-banner {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ef4444;
        }
        .connection-info {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.9em;
            color: #4b5563;
        }
        .loading { text-align: center; color: white; padding: 40px; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AVIA Hub Dashboard</h1>
            <p style="font-size: 1.2em; opacity: 0.95;">Constelación de Agentes Inteligentes</p>
        </div>

        <div id="error-banner" class="error-banner" style="display:none;">
            <strong>⚠️ Problema de Conexión</strong>
            <p id="error-message"></p>
            <button class="test-button" onclick="retryConnection()">🔄 Reintentar Conexión</button>
        </div>

        <div class="status">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>📊 Estado del Sistema</h2>
                <span id="status-indicator" class="status-indicator"></span>
            </div>
            <div id="system-status">🔄 Conectando con orchestrator...</div>
            <div class="connection-info">
                <strong>🌐 API:</strong> <span id="api-url-display">Detectando...</span>
            </div>
        </div>

        <div class="agents-grid" id="agents-grid">
            <div class="loading">⏳ Cargando información de agentes...</div>
        </div>

        <div class="test-section">
            <h2 style="margin-bottom: 20px;">🧪 Pruebas y Acciones</h2>
            <button class="test-button" onclick="testOrquestacion()" id="btn-orq">
                🎯 Test Orquestación
            </button>
            <button class="test-button" onclick="testMetricas()" id="btn-metrics">
                📊 Ver Métricas
            </button>
            <button class="test-button" onclick="testTareas()" id="btn-tasks">
                📝 Listar Tareas
            </button>
            <button class="test-button" onclick="refreshData()" id="btn-refresh">
                🔄 Actualizar Todo
            </button>
            <div id="result" class="result" style="display:none;"></div>
        </div>

        <div style="text-align: center; color: white; margin-top: 30px; opacity: 0.8;">
            <p>AVIA Hub v1.0 | Powered by FastAPI + Docker</p>
        </div>
    </div>

    <script>
        const POSSIBLE_URLS = [
            'http://localhost:8000',
            'http://127.0.0.1:8000',
            `http://${window.location.hostname}:8000`
        ];

        let API_URL = null;
        let retryCount = 0;
        const MAX_RETRIES = 3;

        // Detectar API disponible
        async function detectAPI() {
            console.log('🔍 Detectando API...');
            
            for (const url of POSSIBLE_URLS) {
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 2000);
                    
                    const response = await fetch(`${url}/health`, {
                        signal: controller.signal,
                        mode: 'cors',
                        cache: 'no-cache'
                    });
                    
                    clearTimeout(timeout);
                    
                    if (response.ok) {
                        API_URL = url;
                        console.log(`✅ API encontrada: ${url}`);
                        document.getElementById('api-url-display').innerHTML = 
                            `<span style="color: #10b981;">✅ ${url}</span>`;
                        return true;
                    }
                } catch (error) {
                    console.log(`❌ ${url} no disponible`);
                }
            }
            
            console.error('❌ No se encontró API disponible');
            return false;
        }

        function showError(message, details) {
            const banner = document.getElementById('error-banner');
            const errorMsg = document.getElementById('error-message');
            const indicator = document.getElementById('status-indicator');
            
            banner.style.display = 'block';
            errorMsg.textContent = `${message}${details ? ' - ' + details : ''}`;
            indicator.className = 'status-indicator error';
            
            document.querySelectorAll('.test-button').forEach(btn => btn.disabled = true);
        }

        function hideError() {
            document.getElementById('error-banner').style.display = 'none';
            document.getElementById('status-indicator').className = 'status-indicator';
            document.querySelectorAll('.test-button').forEach(btn => btn.disabled = false);
        }

        async function loadData() {
            if (!API_URL) {
                const detected = await detectAPI();
                if (!detected) {
                    showError(
                        'No se puede conectar con la API',
                        'Verifica: docker-compose ps | grep orchestrator'
                    );
                    document.getElementById('system-status').innerHTML = 
                        '<p style="color:#ef4444;">❌ Orchestrator no disponible</p>' +
                        '<p style="font-size: 0.9em; margin-top: 10px;">Ejecuta: docker-compose logs orchestrator</p>';
                    document.getElementById('agents-grid').innerHTML = 
                        '<div style="grid-column: 1/-1; text-align:center; color:white; padding:40px;">' +
                        '❌ No se puede cargar información de agentes</div>';
                    return;
                }
            }

            try {
                hideError();
                
                // Health check
                const health = await fetch(`${API_URL}/health`).then(r => r.json());
                
                document.getElementById('system-status').innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        <div>
                            <strong>Estado:</strong><br>
                            <span style="color:#10b981; font-size: 1.1em;">✅ ${health.estado}</span>
                        </div>
                        <div>
                            <strong>Agentes Activos:</strong><br>
                            <span style="font-size: 1.3em; color: #667eea;">${health.agentes_activos}</span>
                        </div>
                        <div>
                            <strong>Versión:</strong><br>
                            <span>${health.version || '1.0.0'}</span>
                        </div>
                        <div>
                            <strong>Última Actualización:</strong><br>
                            <span style="font-size: 0.9em;">${new Date(health.timestamp).toLocaleTimeString()}</span>
                        </div>
                    </div>
                `;

                // Cargar agentes
                const agentes = await fetch(`${API_URL}/agentes`).then(r => r.json());
                const grid = document.getElementById('agents-grid');
                
                grid.innerHTML = agentes.agentes.map(a => `
                    <div class="agent-card">
                        <h3>🤖 ${a.nombre}</h3>
                        <div class="agent-status">
                            <strong>Estado:</strong> ${a.estado === 'activo' ? '✅' : '⏸️'} ${a.estado}
                        </div>
                        <div class="agent-status">
                            <strong>Carga:</strong> ${a.carga_actual} tarea${a.carga_actual !== 1 ? 's' : ''}
                        </div>
                        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.2);">
                            <strong>Especialidades:</strong><br>
                            <span style="font-size: 0.9em; opacity: 0.9;">
                                ${a.especialidades.join(' • ')}
                            </span>
                        </div>
                    </div>
                `).join('');
                
                retryCount = 0;
                
            } catch (error) {
                console.error('❌ Error:', error);
                
                showError('Error de conexión', error.message);
                document.getElementById('system-status').innerHTML = 
                    `<p style="color:#ef4444;">❌ Error: ${error.message}</p>`;
                
                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    console.log(`Reintento ${retryCount}/${MAX_RETRIES} en 5s...`);
                    setTimeout(loadData, 5000);
                }
            }
        }

        async function testOrquestacion() {
            showResult('⏳ Ejecutando test de orquestación...');

            try {
                const response = await fetch(`${API_URL}/orquestar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo: 'test_dashboard',
                        descripcion: 'Test desde dashboard HTML',
                        prioridad: 7,
                        metadata: { origen: 'dashboard', timestamp: new Date().toISOString() }
                    })
                });
                
                const data = await response.json();
                showResult(`✅ <strong>Tarea Creada Exitosamente</strong><br><br><pre>${JSON.stringify(data, null, 2)}</pre>`);
                setTimeout(loadData, 1000);
            } catch (error) {
                showResult(`❌ <strong>Error:</strong> ${error.message}`);
            }
        }

        async function testMetricas() {
            showResult('⏳ Obteniendo métricas del sistema...');

            try {
                const data = await fetch(`${API_URL}/metricas`).then(r => r.json());
                showResult(`📊 <strong>Métricas del Sistema</strong><br><br><pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                showResult(`❌ <strong>Error:</strong> ${error.message}`);
            }
        }

        async function testTareas() {
            showResult('⏳ Cargando lista de tareas...');

            try {
                const data = await fetch(`${API_URL}/tareas`).then(r => r.json());
                showResult(`📝 <strong>Tareas Registradas</strong><br><br><pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                showResult(`❌ <strong>Error:</strong> ${error.message}`);
            }
        }

        function refreshData() {
            retryCount = 0;
            API_URL = null;
            showResult('🔄 Actualizando datos...');
            loadData().then(() => {
                showResult('✅ Datos actualizados correctamente');
            });
        }

        function retryConnection() {
            API_URL = null;
            retryCount = 0;
            hideError();
            loadData();
        }

        function showResult(html) {
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.innerHTML = html;
        }

        // Auto-refresh cada 30s
        setInterval(() => {
            if (API_URL && retryCount === 0) {
                loadData();
            }
        }, 30000);
        
        // Carga inicial con delay
        setTimeout(loadData, 1500);
    </script>
</body>
</html>
