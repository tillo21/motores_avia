<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Studio v4.5 - Constelación de Bots Inclusivos | Contexto Inteligente | WCAG 2.1 AA</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ============ AVIA-SIESTA v4.5 - CONTEXTO INTELIGENTE EDITION ============ */
        /* WCAG 2.1 AA Compliant | Performance Optimized | Last Update: 2025 */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* === VARIABLES CSS OPTIMIZADAS === */
        :root {
            /* Colores con contraste WCAG AA (4.5:1 mínimo) */
            --primary: #8b5cf6; --primary-light: #a78bfa; --primary-dark: #7c3aed;
            --secondary: #06b6d4; --accent: #f59e0b; --success: #10b981;
            --warning: #d97706; --error: #dc2626; --info: #2563eb;
            --bg-primary: #09090b; --bg-secondary: #18181b; --bg-tertiary: #27272a;
            --bg-elevated: #3f3f46; --bg-glass: rgba(24, 24, 27, 0.85);
            --text-primary: #fafafa; --text-secondary: #d4d4d8; --text-muted: #a1a1aa;
            --border: #3f3f46; --border-light: #52525b;
            --gradient-primary: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 50%, #10b981 100%);
            --gradient-warm: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            --gradient-bg: radial-gradient(ellipse at top left, #27272a 0%, #09090b 50%, #18181b 100%);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.5); --shadow-lg: 0 20px 60px rgba(0,0,0,0.6);
            --shadow-glow: 0 0 60px rgba(139, 92, 246, 0.25);
            /* Focus visible para accesibilidad */
            --focus-ring: 0 0 0 3px rgba(139, 92, 246, 0.5);
            --focus-ring-offset: 0 0 0 2px var(--bg-primary);
        }
        .light {
            --bg-primary: #fafafa; --bg-secondary: #f4f4f5; --bg-tertiary: #e4e4e7;
            --bg-elevated: #ffffff; --bg-glass: rgba(250, 250, 250, 0.92);
            --text-primary: #18181b; --text-secondary: #3f3f46; --text-muted: #52525b;
            --border: #d4d4d8; --border-light: #a1a1aa;
            --gradient-bg: radial-gradient(ellipse at top left, #f4f4f5 0%, #fafafa 50%, #e4e4e7 100%);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.1); --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
            --focus-ring-offset: 0 0 0 2px var(--bg-primary);
        }

        /* === ACCESIBILIDAD: Focus Visible === */
        *:focus { outline: none; }
        *:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
            box-shadow: var(--focus-ring);
        }

        /* === ACCESIBILIDAD: Reduced Motion === */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* === ACCESIBILIDAD: Skip Link === */
        .skip-link {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 12px 24px;
            border-radius: 0 0 12px 12px; z-index: 9999; font-weight: 600;
            transition: top 0.3s ease;
        }
        .skip-link:focus { top: 0; }

        /* === ACCESIBILIDAD: Screen Reader Only === */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gradient-bg); background-attachment: fixed;
            color: var(--text-primary); min-height: 100vh; line-height: 1.6;
            /* Mejora de rendimiento */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); } 50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6); } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* === AVIA AVATAR 3D - CAIMAN-BOT === */
        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-3px) rotate(1deg); }
            50% { transform: translateY(-6px) rotate(0deg); }
            75% { transform: translateY(-3px) rotate(-1deg); }
        }
        @keyframes avatarBlink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
        @keyframes avatarTalk {
            0%, 100% { transform: scaleY(1); }
            25% { transform: scaleY(0.7); }
            50% { transform: scaleY(1.1); }
            75% { transform: scaleY(0.8); }
        }
        @keyframes avatarThink {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px) rotate(-3deg); }
            75% { transform: translateX(2px) rotate(3deg); }
        }
        @keyframes avatarWave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(15deg); }
        }
        @keyframes avatarTailWag {
            0%, 100% { transform: rotate(-5deg) scaleX(1); }
            50% { transform: rotate(10deg) scaleX(1.05); }
        }
        @keyframes avatarBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes avatarGlow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(100, 180, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 20px rgba(100, 180, 255, 0.8)); }
        }
        @keyframes avatarBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        .avia-avatar-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .avia-avatar-container:hover {
            transform: scale(1.08);
        }
        .avia-avatar {
            width: 52px;
            height: 52px;
            animation: avatarFloat 4s ease-in-out infinite, avatarGlow 3s ease-in-out infinite;
        }
        .avia-avatar.talking {
            animation: avatarFloat 2s ease-in-out infinite, avatarGlow 1s ease-in-out infinite;
        }
        .avia-avatar.thinking {
            animation: avatarThink 1.5s ease-in-out infinite, avatarGlow 2s ease-in-out infinite;
        }
        .avia-avatar.celebrating {
            animation: avatarBounce 0.6s ease-in-out infinite, avatarGlow 0.5s ease-in-out infinite;
        }
        .avia-avatar .avatar-eye {
            transform-origin: center;
            animation: avatarBlink 4s ease-in-out infinite;
        }
        .avia-avatar.talking .avatar-mouth {
            animation: avatarTalk 0.3s ease-in-out infinite;
        }
        .avia-avatar .avatar-tail {
            transform-origin: left center;
            animation: avatarTailWag 1.5s ease-in-out infinite;
        }
        .avia-avatar .avatar-body {
            animation: avatarBreathe 3s ease-in-out infinite;
        }
        .avia-avatar .avatar-arm-right {
            transform-origin: top center;
        }
        .avia-avatar.waving .avatar-arm-right {
            animation: avatarWave 0.8s ease-in-out infinite;
        }

        .avatar-status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            border: 2px solid var(--bg-primary);
            animation: pulse 2s ease-in-out infinite;
        }
        .avatar-status-dot.busy {
            background: var(--warning);
        }
        .avatar-status-dot.offline {
            background: var(--text-muted);
            animation: none;
        }

        /* Avatar Panel Flotante */
        .avatar-panel {
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            opacity: 0;
            visibility: hidden;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            min-width: 280px;
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .avatar-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
        }
        .avatar-panel::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 14px;
            height: 14px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            border-top: 1px solid var(--border);
        }
        .avatar-panel-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .avatar-panel-avatar {
            width: 60px;
            height: 60px;
        }
        .avatar-panel-info h4 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .avatar-panel-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .avatar-panel-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            font-size: 0.88rem;
        }
        .avatar-panel-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        .avatar-panel-status-dot.talking {
            background: linear-gradient(135deg, #5BA4D9, #3A7AB9);
            animation: talkingWave 0.5s ease-in-out infinite alternate;
        }
        @keyframes talkingWave {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(91, 164, 217, 0.7); }
            100% { transform: scale(1.3); box-shadow: 0 0 0 6px rgba(91, 164, 217, 0); }
        }
        .avatar-panel-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .avatar-panel-btn {
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .avatar-panel-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .avatar-panel-btn.speaking {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--primary);
            color: white;
            animation: speakingPulse 1s ease-in-out infinite;
        }
        @keyframes speakingPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(91, 164, 217, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(91, 164, 217, 0); }
        }
        .avatar-mood-bar {
            display: flex;
            gap: 6px;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .mood-btn {
            flex: 1;
            padding: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mood-btn:hover, .mood-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(1.1);
        }
        .mood-btn.stop-btn {
            background: var(--danger);
            border-color: var(--danger);
        }
        .mood-btn.stop-btn:hover {
            background: #dc2626;
            border-color: #dc2626;
        }
        .avatar-panel-tip {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border);
        }

        /* Avatar grande para panel */
        .avatar-lg {
            width: 120px;
            height: 120px;
        }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        .animate-fadeInUp { animation: fadeInUp 0.5s ease-out backwards; }
        .animate-fadeInScale { animation: fadeInScale 0.35s ease-out; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }
        .animate-glow { animation: glow 2s ease-in-out infinite; }
        .animate-slideIn { animation: slideIn 0.4s ease-out; }
        .app-container { display: flex; flex-direction: column; min-height: 100vh; }
        .header {
            background: var(--bg-glass); backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem;
            position: sticky; top: 0; z-index: 100;
        }
        .header-content {
            max-width: 1800px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
        }
        .logo { display: flex; align-items: center; gap: 14px; }
        .logo-icon {
            width: 48px; height: 48px; background: var(--gradient-primary);
            border-radius: 14px; display: flex; align-items: center;
            justify-content: center; font-size: 24px; box-shadow: var(--shadow-glow);
        }
        .logo-text h1 {
            font-size: 1.5rem; font-weight: 800; background: var(--gradient-primary);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .logo-text span { font-size: 0.72rem; color: var(--text-muted); display: block; letter-spacing: 0.5px; }
        .search-container { flex: 1; max-width: 420px; position: relative; }
        .search-input {
            width: 100%; padding: 12px 18px 12px 48px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: 14px; color: var(--text-primary);
            font-size: 0.95rem; font-family: inherit; transition: all 0.3s ease;
        }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15); }
        .search-input::placeholder { color: var(--text-muted); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.1rem; }
        .nav-tabs { display: flex; gap: 4px; background: var(--bg-tertiary); padding: 5px; border-radius: 14px; }
        .nav-tab {
            padding: 10px 18px; border: none; background: transparent; color: var(--text-secondary);
            font-size: 0.88rem; font-weight: 600; cursor: pointer; border-radius: 10px;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; font-family: inherit;
        }
        .nav-tab:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .nav-tab.active { background: var(--gradient-primary); color: white; }
        .nav-tab .badge { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 8px; font-size: 0.72rem; }
        .theme-toggle {
            background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 14px; cursor: pointer; color: var(--text-secondary); font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover { background: var(--bg-elevated); color: var(--text-primary); transform: scale(1.05); }
        .main-content { flex: 1; max-width: 1800px; margin: 0 auto; padding: 1.5rem; width: 100%; }
        .task-dashboard { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .task-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .task-progress { display: flex; align-items: center; gap: 14px; }
        .progress-bar { width: 220px; height: 10px; background: var(--bg-tertiary); border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--gradient-primary); border-radius: 5px; transition: width 0.6s ease; }
        .progress-text { font-size: 0.88rem; color: var(--text-secondary); font-weight: 600; }
        .task-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
        .task-category { background: var(--bg-tertiary); border-radius: 14px; padding: 1.25rem; }
        .task-category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
        .task-category-title { font-size: 0.95rem; font-weight: 700; }
        .task-count { background: var(--bg-elevated); padding: 3px 10px; border-radius: 8px; font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
        .task-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .task-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-secondary); border-radius: 10px; font-size: 0.85rem; transition: all 0.2s ease; }
        .task-item:hover { background: var(--bg-elevated); transform: translateX(4px); }
        .task-item.completed { opacity: 0.5; }
        .task-item.completed .task-text { text-decoration: line-through; }
        .task-checkbox { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.75rem; }
        .task-checkbox.completed { background: var(--success); border-color: var(--success); color: white; }
        .task-checkbox.in-progress { background: var(--warning); border-color: var(--warning); color: white; }
        .task-text { flex: 1; color: var(--text-secondary); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .section-title { font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; gap: 12px; }
        .section-subtitle { color: var(--text-secondary); font-size: 1rem; margin-top: 6px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
        .bot-card {
            background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px;
            padding: 1.5rem; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
            position: relative; overflow: hidden;
        }
        .bot-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--gradient-primary); opacity: 0; transition: opacity 0.3s ease;
        }
        .bot-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: var(--shadow-lg), var(--shadow-glow); }
        .bot-card:hover::before { opacity: 1; }
        .bot-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
        .bot-avatar { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
        .bot-info h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 3px; }
        .bot-info .acronym { font-size: 0.78rem; color: var(--text-muted); }
        .bot-description { color: var(--text-secondary); font-size: 0.88rem; line-height: 1.6; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .bot-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .bot-tag { padding: 4px 12px; background: var(--bg-tertiary); border-radius: 8px; font-size: 0.75rem; color: var(--text-muted); border: 1px solid var(--border); font-weight: 500; }
        .bot-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--border); }
        .status-badge { padding: 5px 12px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-badge.development { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-badge.planned { background: rgba(139, 92, 246, 0.15); color: var(--primary); }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; }
        .btn-primary { background: var(--gradient-primary); color: white; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: var(--shadow-md), var(--shadow-glow); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-elevated); border-color: var(--primary); }
        .btn-ghost { background: transparent; color: var(--text-secondary); padding: 8px 14px; }
        .btn-ghost:hover { background: var(--bg-tertiary); color: var(--text-primary); }

                          '📌 Interacciones: Implementar pausa automática en cada escena interactiva\n\n' +
                          '🎵 MÚSICA: Fondo suave educativo, bajar volumen durante narración\n' +
                          '🔊 EFECTOS: Whoosh en transiciones, ping en interacciones correctas\n';

            // Reproducción automática con sincronización de audio
            useEffect(function() {
                if (isPlaying) {
                    var sceneDuration = scenes[currentScene] ? scenes[currentScene].duration * 1000 : 3000;
                    var scene = scenes[currentScene];

                    // Si hay interacción, pausar automáticamente
                    if (scene && scene.interaction && !interactionResults[scene.id]) {
                        setPlaying(false);
                        addToast({ type: 'info', title: '⏸️ Interacción', message: 'Completa la actividad para continuar' });
                        return;
                    }

                    // Actualizar progreso
                    var progressInterval = setInterval(function() {
                        setVideoProgress(function(prev) {
                            var increment = (100 / (sceneDuration / 100));
                            return Math.min(100, prev + increment);
                        });
                    }, 100);

                    intervalRef.current = setTimeout(function() {
                        if (currentScene >= scenes.length - 1) {
                            setPlaying(false);
                            setCurrentScene(0);
                            setVideoProgress(0);
                            addToast({ type: 'success', title: '🎉 Video completado', message: '¡Excelente trabajo!' });
                        } else {
                            setCurrentScene(currentScene + 1);
                            setVideoProgress(0);
                        }
                    }, sceneDuration);

                    return function() {
                        clearInterval(progressInterval);
                        if (intervalRef.current) clearTimeout(intervalRef.current);
                    };
                }
                return function() { if (intervalRef.current) clearTimeout(intervalRef.current); };
            }, [isPlaying, currentScene, interactionResults]);

            // Sincronizar audio con escenas
            useEffect(function() {
                if (audioRef.current && audioUrl && isPlaying) {
                    var totalDuration = scenes.reduce(function(sum, s) { return sum + s.duration; }, 0);
                    var currentTime = scenes.slice(0, currentScene).reduce(function(sum, s) { return sum + s.duration; }, 0);
                    audioRef.current.currentTime = currentTime;
                    audioRef.current.play().catch(function() {});
                }
            }, [currentScene, isPlaying, audioUrl]);

            function handleInteraction(sceneId, result) {
                setInteractionResults(function(prev) {
                    var updated = Object.assign({}, prev);
                    updated[sceneId] = result;
                    return updated;
                });
                addToast({ type: 'success', title: '✅ Interacción completada', message: 'Puedes continuar' });
            }

            function generateNarration() {
                setNarrating(true);
                addToast({ type: 'info', title: '🎙️ Generando narración', message: 'Conectando con ElevenLabs v2.5 Turbo...' });

                if (window.Poe && window.Poe.sendUserMessage) {
                    var handlerName = 'elevenlabs-narration-' + Date.now();
                    window.Poe.registerHandler(handlerName, function(result) {
                        var response = result.responses && result.responses[0];
                        if (response) {
                            if (response.attachments && response.attachments.length > 0) {
                                var audioAtt = response.attachments.find(function(a) {
                                    return a.mimeType && a.mimeType.indexOf('audio') !== -1;
                                });
                                if (audioAtt) {
                                    setAudioUrl(audioAtt.url);
                                    addToast({ type: 'success', title: '🎉 ¡Audio generado!', message: 'Narración de ' + scenes.length + ' escenas lista' });
                                }
                            }
                            if (response.status === 'complete' || response.status === 'error') {
                                setNarrating(false);
                                if (response.status === 'error') {
                                    addToast({ type: 'error', title: 'Error', message: response.statusText || 'Error generando audio' });
                                }
                            }
                        }
                    });

                    // Usar el script limpio sin marcadores
                    var cleanScript = elevenLabsScript.substring(0, 4900); // Límite de 5000 chars
                    window.Poe.sendUserMessage('@ElevenLabs-v2.5-Turbo ' + cleanScript + ' --voice Jessica --language es', {
                        handler: handlerName,
                        stream: false,
                        openChat: false
                    }).catch(function(err) {
                        addToast({ type: 'error', title: 'Error', message: err.message || 'No se pudo conectar' });
                        setNarrating(false);
                    });
                } else {
                    // Modo demo
                    setTimeout(function() {
                        setNarrating(false);
                        setAudioUrl('demo');
                        addToast({ type: 'success', title: '🎙️ Demo completado', message: 'En Poe se generaría audio real con ElevenLabs' });
                    }, 2500);
                }
            }

            // ============ SISTEMA MEJORADO DE EXPORTACIÓN DE VIDEO ============
            function generateFullVideo() {
                setGeneratingVideo(true);

                // Verificar disponibilidad de Poe API
                var hasPoeAPI = window.Poe && window.Poe.sendUserMessage;

                if (!hasPoeAPI) {
                    // Mostrar guía para el usuario sobre cómo obtener el video real
                    addToast({ type: 'warning', title: '⚠️ Modo Demo Activo', message: 'Para generar video real, abre desde Poe' });

                    // Simular proceso con feedback detallado
                    var steps = [
                        { delay: 500, msg: '📡 Verificando conexión con Veo-v3.1...' },
                        { delay: 1500, msg: '🎨 Preparando assets visuales...' },
                        { delay: 2500, msg: '🎬 Renderizando escenas...' },
                        { delay: 3500, msg: '✨ Aplicando efectos finales...' }
                    ];

                    steps.forEach(function(step) {
                        setTimeout(function() {
                            addToast({ type: 'info', title: 'Progreso', message: step.msg });
                        }, step.delay);
                    });

                    setTimeout(function() {
                        setGeneratingVideo(false);
                        setVideoUrl('demo');
                        addToast({
                            type: 'success',
                            title: '🎬 Demo Completado',
                            message: 'Para video real: abre esta app desde Poe y usa modo "🌐 Real"'
                        });
                    }, 4000);
                    return;
                }

                // Modo Real con Poe API
                addToast({ type: 'info', title: '🎬 Iniciando generación', message: 'Conectando con Veo-v3.1...' });

                var handlerName = 'veo-video-' + Date.now();
                var startTime = Date.now();

                window.Poe.registerHandler(handlerName, function(result) {
                    var response = result.responses && result.responses[0];
                    if (response) {
                        // Mostrar progreso mientras se genera
                        if (response.status === 'incomplete') {
                            var elapsed = Math.floor((Date.now() - startTime) / 1000);
                            addToast({ type: 'info', title: '⏳ Generando...', message: 'Tiempo: ' + elapsed + 's - Por favor espera' });
                        }

                        if (response.attachments && response.attachments.length > 0) {
                            var videoAtt = response.attachments.find(function(a) {
                                return a.mimeType && a.mimeType.indexOf('video') !== -1;
                            });
                            if (videoAtt) {
                                setVideoUrl(videoAtt.url);
                                var totalTime = Math.floor((Date.now() - startTime) / 1000);
                                addToast({
                                    type: 'success',
                                    title: '🎬 ¡Video Generado!',
                                    message: 'Completado en ' + totalTime + 's - Listo para reproducir'
                                });
                            }
                        }

                        if (response.status === 'complete' || response.status === 'error') {
                            setGeneratingVideo(false);
                            if (response.status === 'error') {
                                addToast({
                                    type: 'error',
                                    title: '❌ Error de Generación',
                                    message: response.statusText || 'Veo-v3.1 no pudo completar. Intenta de nuevo.'
                                });
                            }
                        }
                    }
                });

                var videoPrompt = 'Crea un video educativo animado de 8 segundos sobre: ' + prompt + '. ' +
                                 'Estilo: colorido, moderno, dinámico, con movimiento fluido. ' +
                                 'Incluye texto superpuesto con el título del tema. ' +
                                 'Transiciones suaves entre escenas. Fondo con gradientes vibrantes morados y cian. ' +
                                 'Añade elementos visuales relacionados al tema educativo.';

                window.Poe.sendUserMessage('@Veo-v3.1 ' + videoPrompt + ' --duration 8s --aspect 9:16', {
                    handler: handlerName,
                    stream: false,
                    openChat: false
                }).catch(function(err) {
                    addToast({
                        type: 'error',
                        title: '❌ Error de Conexión',
                        message: err.message || 'No se pudo conectar con Veo-v3.1'
                    });
                    setGeneratingVideo(false);
                });
            }

                    audioUrl: audioUrl,

                var blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });

            var scene = scenes[currentScene] || scenes[0];

            var completedInteractions = Object.keys(interactionResults).length;
            var totalInteractions = scenes.filter(function(s) { return s.interaction; }).length;

            // Renderizar interacción según tipo

                if (inter.type === 'quiz') {

                                    color: 'white',

                                },
                                disabled: isCompleted,
                                onClick: function() {

                                    if (inter.feedback) addToast({ type: 'info', title: 'Feedback', message: inter.feedback[i] || 'Respuesta registrada' });
                                }
                            }, opt);
                        })
                    );
                }

                if (inter.type === 'hotspot') {
                    return h('div', { style: { position: 'relative', width: '100%', height: '80px', background: 'rgba(0,0,0,0.2)', borderRadius: '12px', marginTop: '1rem' } },
                        inter.spots.map(function(spot) {
                            var revealed = hotspotsRevealed.indexOf(spot.id) !== -1;
                            return h('button', {
                                key: spot.id,
                                style: {
                                    position: 'absolute',
                                    left: spot.x + '%',
                                    top: spot.y + '%',
                                    transform: 'translate(-50%, -50%)',
                                    width: '36px', height: '36px', borderRadius: '50%',
                                    background: revealed ? 'var(--success)' : 'var(--primary)',
                                    border: '3px solid white',
                                    cursor: 'pointer',
                                    animation: revealed ? 'none' : 'pulse 1.5s infinite',
                                    fontSize: '0.8rem', color: 'white', fontWeight: 700
                                },
                                onClick: function() {
                                    if (!revealed) {
                                        setHotspotsRevealed(function(prev) { return prev.concat([spot.id]); });
                                        addToast({ type: 'info', title: spot.label, message: spot.info });
                                        if (hotspotsRevealed.length + 1 >= inter.spots.length) {
                                            handleInteraction(sceneId, { completed: true });

                                    }
                                }
                            }, revealed ? '✓' : spot.label.charAt(0));
                        }),
                        h('p', { style: { position: 'absolute', bottom: '4px', width: '100%', textAlign: 'center', fontSize: '0.75rem', color: 'white' } },

                    );

                if (inter.type === 'dragdrop') {

                            return h('button', {
                                key: i,

                    h('div', null,
                        h('h3', { style: { fontSize: '1.4rem', fontWeight: 800, display: 'flex', alignItems: 'center', gap: '10px' } },

                        h('p', { style: { fontSize: '0.85rem', color: 'var(--text-muted)', marginTop: '4px' } },

                        var angleA = -g / len * Math.sin(angle);
