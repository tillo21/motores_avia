<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - CreatorHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        
        .offline-container {
            max-width: 600px;
        }
        
        .offline-icon {
            font-size: 6rem;
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.25rem;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        
        .btn {
            background: white;
            color: #1e40af;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .features {
            margin-top: 3rem;
            padding-top: 3rem;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        
        .feature {
            margin: 1rem 0;
            font-size: 1rem;
            opacity: 0.8;
        }
        
        @media (prefers-reduced-motion: reduce) {
            .offline-icon {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon" aria-hidden="true">📡</div>
        <h1>Sin conexión a Internet</h1>
        <p>
            No te preocupes, CreatorHub funciona offline.<br>
            Tus datos están seguros y guardados en tu dispositivo.
        </p>
        <button class="btn" onclick="location.reload()">
            🔄 Reintentar conexión
        </button>
        
        <div class="features">
            <div class="feature">✅ Tus proyectos están disponibles localmente</div>
            <div class="feature">✅ Los cambios se guardan automáticamente</div>
            <div class="feature">✅ Funcionamiento completo sin internet</div>
        </div>
    </div>
    
    <script>
        // Retry connection every 5 seconds
        let retryInterval = setInterval(() => {
            if (navigator.onLine) {
                location.reload();
            }
        }, 5000);
        
        // Listen for online event
        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
