<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- T7: Meta tags (mantener igual) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%232563eb'/%3E%3Cstop offset='100%25' style='stop-color:%231e40af'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23bg)'/%3E%3Ctext x='50' y='35' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='white' text-anchor='middle'%3E🎬%3C/text%3E%3Ctext x='50' y='65' font-family='Arial,sans-serif' font-size='20' font-weight='bold' fill='%23fbbf24' text-anchor='middle'%3ECH%3C/text%3E%3Ctext x='50' y='85' font-family='Arial,sans-serif' font-size='10' fill='%2394a3b8' text-anchor='middle'%3EAVIA%3C/text%3E%3C/svg%3E">
    
    <title>CreatorHub v24.4.1-hotfix - Gestor de Proyectos Transmedia</title>
    <meta name="description" content="Herramienta profesional para gestionar proyectos transmedia con degradación elegante de almacenamiento.">
    <meta name="version" content="24.4.1-hotfix">
    
    <style>
        /* CSS anterior se mantiene igual */
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #64748b;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow: rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1rem 2rem;
            box-shadow: 0 2px 8px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: 0 2px 8px var(--shadow);
            margin-bottom: 1rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .btn-secondary {
            background: var(--secondary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
        }

        #projectList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .project-item {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1rem;
            box-shadow: 0 2px 8px var(--shadow);
            transition: var(--transition);
        }

        .project-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px var(--shadow);
        }
    </style>
</head>
<body>
    <header>
        <h1>🎬 CreatorHub <span style="font-size: 0.75rem; opacity: 0.8;">v24.4.1-hotfix</span></h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>📋 Mis Proyectos</h2>
            <button class="btn" onclick="showNewProjectModal()">➕ Nuevo Proyecto</button>
            <button class="btn btn-secondary" onclick="exportData()">💾 Exportar Datos</button>
            <button class="btn btn-secondary" onclick="importData()">📥 Importar Datos</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="handleImport(event)">
        </div>

        <div id="projectList"></div>
    </div>

    <div id="consentModal" class="modal">
        <div class="modal-content">
            <h2>🔒 Consentimiento de Uso</h2>
            <p><strong>CreatorHub</strong> almacena tus datos localmente. No se envía información a servidores.</p>
            <button class="btn" onclick="acceptConsent()">Acepto y Continuar</button>
        </div>
    </div>

    <div id="projectModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Nuevo Proyecto</h2>
            <button style="float: right; background: none; border: none; font-size: 1.5rem; cursor: pointer;" onclick="closeProjectModal()">✕</button>
            <form id="projectForm">
                <input type="hidden" id="projectId">
                <div class="form-group">
                    <label for="projectName">Nombre del Proyecto</label>
                    <input type="text" id="projectName" required>
                </div>
                <div class="form-group">
                    <label for="projectDescription">Descripción</label>
                    <textarea id="projectDescription" rows="4"></textarea>
                </div>
                <button type="submit" class="btn">💾 Guardar</button>
                <button type="button" class="btn btn-secondary" onclick="closeProjectModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        // CÓDIGO ACTUALIZADO CON REGLA #11
        class AVIAStorageGuard {
            static #inMemoryStorage = new Map();
            static #isLocalStorageAvailable = null;

            static #testLocalStorage() {
                if (this.#isLocalStorageAvailable !== null) {
                    return this.#isLocalStorageAvailable;
                }

                try {
                    const test = '__avia_test__';
                    localStorage.setItem(test, test);
                    localStorage.removeItem(test);
                    this.#isLocalStorageAvailable = true;
                    console.log('✅ localStorage disponible');
                    return true;
                } catch (e) {
                    this.#isLocalStorageAvailable = false;
                    console.warn('⚠️ localStorage bloqueado. Usando memoria volátil.');
                    return false;
                }
            }

            static save(key, data) {
                try {
                    const serialized = JSON.stringify(data);
                    if (this.#testLocalStorage()) {
                        localStorage.setItem(key, serialized);
                    } else {
                        this.#inMemoryStorage.set(key, serialized);
                    }
                    return true;
                } catch (e) {
                    console.error('Error guardando:', e);
                    return false;
                }
            }

            static load(key) {
                try {
                    let data = null;
                    if (this.#testLocalStorage()) {
                        data = localStorage.getItem(key);
                    } else {
                        data = this.#inMemoryStorage.get(key);
                    }
                    return data ? JSON.parse(data) : null;
                } catch (e) {
                    return null;
                }
            }

            static isVolatile() {
                return !this.#testLocalStorage();
            }

            static getStorageMode() {
                return this.#testLocalStorage() ? 'localStorage' : 'memory';
            }
        }

        class AVIAConsent {
            static check() {
                const consent = AVIAStorageGuard.load('avia_consent');
                if (!consent) {
                    document.getElementById('consentModal').classList.add('active');
                    if (AVIAStorageGuard.isVolatile()) {
                        this.#showVolatileWarning();
                    }
                    return false;
                }
                return true;
            }

            static grant() {
                AVIAStorageGuard.save('avia_consent', {
                    granted: true,
                    date: new Date().toISOString(),
                    version: '24.4.1-hotfix'
                });
            }

            static #showVolatileWarning() {
                const modal = document.getElementById('consentModal');
                const warning = document.createElement('div');
                warning.style.cssText = 'background: #fef3c7; border: 2px solid #f59e0b; border-radius: 8px; padding: 1rem; margin-top: 1rem;';
                warning.innerHTML = '<strong>⚠️ Modo Volátil</strong><p style="margin: 0.5rem 0 0 0;">Datos se perderán al cerrar. Usa "Exportar" antes de salir.</p>';
                modal.querySelector('.modal-content').appendChild(warning);
            }
        }

        let projects = [];
        let currentProject = null;

        function init() {
            projects = AVIAStorageGuard.load('avia_projects') || [];
            renderProjects();
            updateStorageIndicator();
        }

        function updateStorageIndicator() {
            const header = document.querySelector('header h1');
            const indicator = document.createElement('span');
            indicator.style.cssText = `
                font-size: 0.75rem;
                padding: 0.25rem 0.5rem;
                border-radius: 4px;
                margin-left: 1rem;
                ${AVIAStorageGuard.isVolatile() 
                    ? 'background: #fef3c7; color: #92400e;' 
                    : 'background: #d1fae5; color: #065f46;'}
            `;
            indicator.textContent = AVIAStorageGuard.isVolatile() ? '⚠️ Volátil' : '✅ Persistente';
            indicator.title = AVIAStorageGuard.isVolatile()
                ? 'Usa servidor HTTP para persistencia'
                : 'Datos guardados en localStorage';
            header.appendChild(indicator);
        }

        function renderProjects() {
            const list = document.getElementById('projectList');
            if (projects.length === 0) {
                list.innerHTML = '<div class="card"><p>No hay proyectos. Crea uno nuevo.</p></div>';
                return;
            }
            list.innerHTML = projects.map(p => `
                <div class="project-item">
                    <h3>${p.name}</h3>
                    <p>${p.description || 'Sin descripción'}</p>
                    <button class="btn" onclick="editProject('${p.id}')">✏️ Editar</button>
                    <button class="btn btn-secondary" onclick="deleteProject('${p.id}')">🗑️</button>
                </div>
            `).join('');
        }

        function showNewProjectModal() {
            currentProject = null;
            document.getElementById('projectForm').reset();
            document.getElementById('projectModal').classList.add('active');
        }

        function closeProjectModal() {
            document.getElementById('projectModal').classList.remove('active');
        }

        function editProject(id) {
            currentProject = projects.find(p => p.id === id);
            if (!currentProject) return;
            document.getElementById('projectId').value = currentProject.id;
            document.getElementById('projectName').value = currentProject.name;
            document.getElementById('projectDescription').value = currentProject.description || '';
            document.getElementById('projectModal').classList.add('active');
        }

        function deleteProject(id) {
            if (!confirm('¿Eliminar?')) return;
            projects = projects.filter(p => p.id !== id);
            AVIAStorageGuard.save('avia_projects', projects);
            renderProjects();
        }

        function exportData() {
            const data = { version: '24.4.1-hotfix', projects };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `creatorhub-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            document.getElementById('importFile').click();
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    projects = data.projects || [];
                    AVIAStorageGuard.save('avia_projects', projects);
                    renderProjects();
                    alert('✅ Importado correctamente');
                } catch (err) {
                    alert('❌ Error: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function acceptConsent() {
            AVIAConsent.grant();
            document.getElementById('consentModal').classList.remove('active');
            init();
        }

        document.getElementById('projectForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('projectId').value || 'proj_' + Date.now();
            const name = document.getElementById('projectName').value.trim();
            const description = document.getElementById('projectDescription').value.trim();

            const project = {
                id,
                name,
                description,
                createdAt: currentProject?.createdAt || new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            if (currentProject) {
                const index = projects.findIndex(p => p.id === id);
                projects[index] = project;
            } else {
                projects.push(project);
            }

            AVIAStorageGuard.save('avia_projects', projects);
            closeProjectModal();
            renderProjects();
        });

        if (AVIAConsent.check()) {
            init();
        }

        console.log('%c🎬 CreatorHub v24.4.1-hotfix', 'font-size: 20px; color: #2563eb;');
        console.log('%c✅ Regla #11: Storage Graceful Degradation ACTIVA', 'color: #10b981;');
    </script>
</body>
</html>
