<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Senior - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .status {
            display: inline-block;
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .card-title {
            color: #64748b;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .card-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #1e293b;
        }
        
        .card-unit {
            color: #94a3b8;
            font-size: 0.8em;
        }
        
        .metric-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }
        
        .metric-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        .log-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .log-title {
            color: #1e293b;
            font-size: 1.3em;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .log-entry {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            background: #f8fafc;
            border-left: 4px solid #667eea;
        }
        
        .log-time {
            color: #64748b;
            font-weight: bold;
        }
        
        .log-success {
            border-left-color: #10b981;
        }
        
        .log-warning {
            border-left-color: #f59e0b;
        }
        
        .log-error {
            border-left-color: #ef4444;
        }
        
        .mock-indicator {
            display: inline-block;
            padding: 4px 8px;
            background: #fbbf24;
            color: #78350f;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 10px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .updating {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AVIA Senior Dashboard</h1>
            <div class="status" id="systemStatus">● SISTEMA OPERACIONAL</div>
            <span class="mock-indicator" id="mockIndicator" data-testid="mock-mode">MODO SANDBOX</span>
        </div>
        
        <div class="grid">
            <div class="card">
                <div class="card-title">CPU Usage</div>
                <div class="card-value"><span id="cpuValue">0</span><span class="card-unit">%</span></div>
                <div class="metric-bar">
                    <div class="metric-fill" id="cpuBar" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">Memory</div>
                <div class="card-value"><span id="memoryValue">0</span><span class="card-unit">%</span></div>
                <div class="metric-bar">
                    <div class="metric-fill" id="memoryBar" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">Requests</div>
                <div class="card-value"><span id="requestsValue">0</span></div>
                <div class="metric-bar">
                    <div class="metric-fill" id="requestsBar" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">Latency</div>
                <div class="card-value"><span id="latencyValue">0</span><span class="card-unit">ms</span></div>
                <div class="metric-bar">
                    <div class="metric-fill" id="latencyBar" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <div class="log-panel" data-testid="metrics-panel">
            <div class="log-title">📊 System Logs</div>
            <div id="logContainer"></div>
        </div>
    </div>

    <script>
        // ✅ REGLA #47: SafeFetch Implementation
        const IS_SANDBOX = window.location.protocol === 'about:' || window.self !== window.top;
        
        class CircuitBreaker {
            constructor(name, threshold = 3, timeout = 30000) {
                this.name = name;
                this.failures = 0;
                this.threshold = threshold;
                this.timeout = timeout;
                this.state = 'CLOSED';
                this.nextAttempt = 0;
            }
            
            async execute(fn, fallback) {
                if (this.state === 'OPEN') {
                    if (Date.now() < this.nextAttempt) {
                        console.warn(`⚠️ ${this.name}: Circuit OPEN`);
                        return fallback();
                    }
                    this.state = 'HALF_OPEN';
                }
                
                try {
                    const result = await fn();
                    this.reset();
                    return result;
                } catch (error) {
                    this.failures++;
                    if (this.failures >= this.threshold) {
                        this.state = 'OPEN';
                        this.nextAttempt = Date.now() + this.timeout;
                        addLog(`🔴 ${this.name}: Circuit OPEN`, 'error');
                    }
                    return fallback();
                }
            }
            
            reset() {
                this.failures = 0;
                this.state = 'CLOSED';
            }
        }
        
        const SafeFetch = {
            breakers: new Map(),
            
            getBreaker(key) {
                if (!this.breakers.has(key)) {
                    this.breakers.set(key, new CircuitBreaker(key));
                }
                return this.breakers.get(key);
            },
            
            async fetch(url, options = {}, mockGenerator) {
                if (IS_SANDBOX) {
                    return mockGenerator();
                }
                
                const breaker = this.getBreaker(url);
                
                return breaker.execute(
                    async () => {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 5000);
                        
                        const response = await fetch(url, {
                            ...options,
                            signal: controller.signal
                        });
                        
                        clearTimeout(timeoutId);
                        
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        
                        return response.json();
                    },
                    mockGenerator
                );
            }
        };
        
        // Logging system
        function addLog(message, type = 'success') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            
            logContainer.insertBefore(entry, logContainer.firstChild);
            
            // Keep only last 10 logs
            while (logContainer.children.length > 10) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }
        
        // Update dashboard
        function updateDashboard(data) {
            document.getElementById('cpuValue').textContent = data.cpu.toFixed(1);
            document.getElementById('cpuBar').style.width = data.cpu + '%';
            
            document.getElementById('memoryValue').textContent = data.memory.toFixed(1);
            document.getElementById('memoryBar').style.width = data.memory + '%';
            
            document.getElementById('requestsValue').textContent = data.requests;
            document.getElementById('requestsBar').style.width = Math.min(data.requests / 10, 100) + '%';
            
            document.getElementById('latencyValue').textContent = data.latency;
            document.getElementById('latencyBar').style.width = Math.min(data.latency / 5, 100) + '%';
        }
        
        // Load metrics with SafeFetch
        async function loadMetrics() {
            try {
                const data = await SafeFetch.fetch(
                    '/api/metrics',
                    {},
                    () => ({
                        cpu: 35 + Math.random() * 40,
                        memory: 50 + Math.random() * 30,
                        requests: 100 + Math.floor(Math.random() * 200),
                        latency: 80 + Math.floor(Math.random() * 150),
                        timestamp: Date.now()
                    })
                );
                
                updateDashboard(data);
                addLog('✅ Metrics loaded successfully', 'success');
                
            } catch (error) {
                addLog(`⚠️ Error loading metrics: ${error.message}`, 'warning');
            }
        }
        
        // Initialize
        if (IS_SANDBOX) {
            addLog('🔒 Running in SANDBOX mode - using mock data', 'warning');
            document.getElementById('mockIndicator').style.display = 'inline-block';
        } else {
            document.getElementById('mockIndicator').style.display = 'none';
        }
        
        addLog('🚀 System initialized', 'success');
        
        // Start polling
        loadMetrics();
        setInterval(loadMetrics, 5000);
    </script>
</body>
</html>
