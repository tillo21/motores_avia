<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Orquesta AVIA - Genially Integration</title>
    <script>
        const ORQUESTA_API = 'http://localhost:8000/api/v1';
        
        async function createAgent(agentData) {
            const response = await fetch(`${ORQUESTA_API}/agents`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(agentData)
            });
            return response.json();
        }
        
        async function createTask(taskData) {
            const response = await fetch(`${ORQUESTA_API}/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(taskData)
            });
            return response.json();
        }
        
        // Integración con Genially
        window.addEventListener('message', async (event) => {
            if (event.data.type === 'GENIALLY_EVENT') {
                const { action, payload } = event.data;
                
                if (action === 'CREATE_AGENT') {
                    const agent = await createAgent(payload);
                    event.source.postMessage({
                        type: 'ORQUESTA_RESPONSE',
                        data: agent
                    }, '*');
                }
            }
        });
    </script>
</head>
<body>
    <h1>Orquesta AVIA - Genially Bridge</h1>
    <p>Plugin cargado y escuchando eventos...</p>
</body>
</html>
