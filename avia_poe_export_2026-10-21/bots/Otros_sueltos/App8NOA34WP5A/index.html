<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Senior - Sistema Atómico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .avia-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .avia-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .avia-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .avia-header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        .avia-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }
        .avia-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            border-left: 4px solid #667eea;
        }
        .avia-section h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avia-log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .avia-html-output {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .avia-controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .avia-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .avia-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .avia-btn:active {
            transform: translateY(0);
        }
        .avia-btn.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .avia-btn.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .avia-status {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            color: #1e3c72;
            font-size: 1.1em;
        }
        .avia-validation {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
        }
        .avia-validation.valid {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .avia-validation.invalid {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        @media (max-width: 768px) {
            .avia-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="avia-container">
        <div class="avia-header">
            <h1>🚀 AVIA SENIOR</h1>
            <p>Sistema Atómico de Generación HTML | Libro Blanco v1.0</p>
        </div>
        
        <div class="avia-body">
            <div class="avia-section">
                <h2>📝 Log del Sistema</h2>
                <div class="avia-log" id="logOutput"></div>
            </div>
            
            <div class="avia-section">
                <h2>🌐 HTML Generado</h2>
                <div class="avia-html-output" id="htmlOutput"></div>
                <div class="avia-controls">
                    <button class="avia-btn" onclick="generarHTML()">Generar HTML</button>
                    <button class="avia-btn success" onclick="validarHTML()">Validar HTML</button>
                    <button class="avia-btn warning" onclick="exportarHTML()">Exportar HTML</button>
                </div>
                <div id="validationResult"></div>
            </div>
            
            <div class="avia-status" id="statusBar">
                Sistema iniciado | Modo Automático Continuo ACTIVO
            </div>
        </div>
    </div>

    <script>
        // Estado persistente
        const AVIAState = {
            log: [],
            htmlGenerado: '',
            version: '1.0.0',
            atomosEjecutados: []
        };

        // Átomo: Logging
        function addLog(mensaje, tipo = 'info') {
            const timestamp = new Date().toLocaleString('es-ES');
            const icono = {
                'info': 'ℹ️',
                'success': '✅',
                'warning': '⚠️',
                'error': '❌'
            }[tipo] || 'ℹ️';
            
            AVIAState.log.push({ timestamp, tipo, mensaje });
            actualizarLog();
        }

        function actualizarLog() {
            const logOutput = document.getElementById('logOutput');
            logOutput.innerHTML = AVIAState.log.map(entry => 
                `<div>[${entry.timestamp}] ${entry.tipo === 'info' ? 'ℹ️' : entry.tipo === 'success' ? '✅' : entry.tipo === 'warning' ? '⚠️' : '❌'} ${entry.mensaje}</div>`
            ).join('');
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // Átomo: Generación HTML
        function generarHTML() {
            addLog('Iniciando generación de HTML...', 'info');
            
            const timestamp = new Date().toLocaleString('es-ES');
            AVIAState.htmlGenerado = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento AVIA | ${timestamp}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #1e3c72;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }
        .metadata {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .content {
            line-height: 1.8;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Documento Generado por AVIA</h1>
        <div class="metadata">
            <p><strong>Fecha de generación:</strong> ${timestamp}</p>
            <p><strong>Versión AVIA:</strong> ${AVIAState.version}</p>
            <p><strong>Tipo:</strong> Documento Atómico</p>
        </div>
        <div class="content">
            <h2>Contenido del Documento</h2>
            <p>Este documento ha sido generado automáticamente siguiendo los principios del Libro Blanco AVIA Senior:</p>
            <ul>
                <li>Constelación Económica de Consenso</li>
                <li>Diseño Atómico</li>
                <li>AVIA-Persistencia</li>
                <li>Flujo Automático Continuo</li>
            </ul>
            <p>El sistema opera en modo autónomo, ejecutando componentes atómicos de forma secuencial sin necesidad de intervención manual.</p>
        </div>
    </div>
</body>
</html>`;
            
            document.getElementById('htmlOutput').textContent = AVIAState.htmlGenerado;
            addLog('HTML generado exitosamente', 'success');
            actualizarEstado('HTML generado | Listo para validar');
            
            AVIAState.atomosEjecutados.push('GenerarHTML');
        }

        // Átomo: Validación HTML (NUEVO)
        function validarHTML() {
            addLog('Iniciando validación de HTML...', 'info');
            
            if (!AVIAState.htmlGenerado) {
                addLog('No hay HTML para validar', 'error');
                mostrarValidacion(false, 'No hay HTML generado');
                return;
            }

            const validaciones = [
                { test: () => AVIAState.htmlGenerado.includes('<!DOCTYPE html>'), msg: 'DOCTYPE declarado' },
                { test: () => AVIAState.htmlGenerado.includes('<html'), msg: 'Etiqueta HTML presente' },
                { test: () => AVIAState.htmlGenerado.includes('<head>'), msg: 'HEAD presente' },
                { test: () => AVIAState.htmlGenerado.includes('<body>'), msg: 'BODY presente' },
                { test: () => AVIAState.htmlGenerado.includes('charset='), msg: 'Charset definido' },
                { test: () => AVIAState.htmlGenerado.includes('<title>'), msg: 'Título presente' }
            ];

            const resultados = validaciones.map(v => ({
                valido: v.test(),
                mensaje: v.msg
            }));

            const todasValidas = resultados.every(r => r.valido);

            resultados.forEach(r => {
                addLog(`${r.mensaje}: ${r.valido ? 'OK' : 'FALLO'}`, r.valido ? 'success' : 'warning');
            });

            mostrarValidacion(todasValidas, 
                todasValidas ? 'HTML válido y bien formado' : 'HTML con advertencias');
            
            addLog(`Validación completada: ${todasValidas ? 'VÁLIDO' : 'CON ADVERTENCIAS'}`, 
                todasValidas ? 'success' : 'warning');
            
            AVIAState.atomosEjecutados.push('ValidarHTML');
            
            // Flujo automático: siguiente átomo
            setTimeout(previsualizarHTML, 1000);
        }

        function mostrarValidacion(valido, mensaje) {
            const div = document.getElementById('validationResult');
            div.className = `avia-validation ${valido ? 'valid' : 'invalid'}`;
            div.textContent = `${valido ? '✅' : '⚠️'} ${mensaje}`;
        }

        // Átomo: Exportación
        function exportarHTML() {
            if (!AVIAState.htmlGenerado) {
                addLog('No hay HTML para exportar', 'error');
                return;
            }
            
            addLog('Exportando HTML...', 'info');
            const blob = new Blob([AVIAState.htmlGenerado], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `avia_documento_${Date.now()}.html`;
            a.click();
            URL.revokeObjectURL(url);
            
            addLog('HTML exportado exitosamente', 'success');
            AVIAState.atomosEjecutados.push('ExportarHTML');
        }

        // Átomo: Previsualización (SIGUIENTE AUTOMÁTICO)
        function previsualizarHTML() {
            addLog('Preparando previsualización...', 'info');
            // Este átomo se implementará en el siguiente ciclo automático
            addLog('Átomo de previsualización en cola', 'info');
        }

        function actualizarEstado(mensaje) {
            document.getElementById('statusBar').textContent = mensaje;
        }

        // Inicialización automática
        window.addEventListener('DOMContentLoaded', () => {
            addLog('🚀 Sistema AVIA Senior iniciado', 'success');
            addLog('📘 Libro Blanco v1.0 cargado', 'info');
            addLog('⚙️ Modo Automático Continuo ACTIVO', 'success');
            addLog('🔄 Aplicando Constelación Económica de Consenso', 'info');
            
            // Flujo automático: generar HTML al iniciar
            setTimeout(() => {
                generarHTML();
                addLog('Átomo inicial ejecutado automáticamente', 'success');
            }, 1000);
        });
    </script>
</body>
</html>
