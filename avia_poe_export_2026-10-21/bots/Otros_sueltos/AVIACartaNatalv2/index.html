<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA - Calculadora Astral</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        input, button { margin: 10px 0; padding: 8px; width: 100%; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        pre { background: #f4f4f4; padding: 15px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🌌 AVIA - Carta Natal</h1>
    <form id="chartForm">
        <input type="date" id="date" required placeholder="Fecha">
        <input type="time" id="time" required placeholder="Hora">
        <input type="text" id="timezone" value="CET" placeholder="Timezone">
        <input type="text" id="place" value="Cazalla de la Sierra, Sevilla" placeholder="Lugar">
        <input type="number" step="0.0001" id="lat" value="37.9333" placeholder="Latitud">
        <input type="number" step="0.0001" id="lon" value="-5.7500" placeholder="Longitud">
        <button type="submit">Calcular Carta</button>
    </form>
    <h2>Resultado:</h2>
    <pre id="result">Esperando cálculo...</pre>

    <script>
        document.getElementById('chartForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                timezone: document.getElementById('timezone').value,
                place_name: document.getElementById('place').value,
                latitude: parseFloat(document.getElementById('lat').value),
                longitude: parseFloat(document.getElementById('lon').value)
            };
            
            try {
                const response = await fetch('http://localhost:8000/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                document.getElementById('result').textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
