<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIAConcienciaOS 5.0 — Constelación Económica de Consenso</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg-primary: #080a0f;
    --bg-secondary: #0e1117;
    --bg-tertiary: #151a23;
    --bg-card: #1a1f2b;
    --bg-card-hover: #212838;
    --bg-input: #121620;
    --bg-consensus: #0d1a12;
    --border: #252c3d;
    --border-light: #303a50;
    --border-consensus: #1a3d25;
    --text-primary: #e8e6e1;
    --text-secondary: #9b97a0;
    --text-muted: #5e5a66;
    --accent: #c8965a;
    --accent-light: #daa76b;
    --accent-dim: rgba(200, 150, 90, 0.12);
    --accent-glow: rgba(200, 150, 90, 0.06);
    --success: #4ade80;
    --success-dim: rgba(74, 222, 128, 0.10);
    --warning: #fbbf24;
    --warning-dim: rgba(251, 191, 36, 0.10);
    --danger: #f87171;
    --danger-dim: rgba(248, 113, 113, 0.10);
    --info: #60a5fa;
    --info-dim: rgba(96, 165, 250, 0.10);
    --purple: #a78bfa;
    --purple-dim: rgba(167, 139, 250, 0.10);
    --consensus: #34d399;
    --consensus-dim: rgba(52, 211, 153, 0.08);
    --economic: #f59e0b;
    --economic-dim: rgba(245, 158, 11, 0.08);
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --font-display: 'Playfair Display', serif;
    --font-body: 'Source Sans 3', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ═══ Shell ═══ */
  .shell { display: flex; height: 100vh; }

  /* ═══ Sidebar ═══ */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 100;
  }

  .sidebar-header {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--consensus), var(--accent));
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff;
    box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
    position: relative;
    overflow: hidden;
  }

  .brand-icon::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
    animation: shimmer 3s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .brand h1 {
    font-family: var(--font-display);
    font-size: 16px; font-weight: 700;
    line-height: 1.2;
  }

  .brand small {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--consensus);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .sidebar-nav { flex: 1; padding: 14px 12px; overflow-y: auto; }

  .nav-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 14px 10px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
    font-size: 13px;
    font-weight: 500;
    position: relative;
  }

  .nav-item:hover { background: var(--accent-glow); color: var(--text-primary); }
  .nav-item.active { background: var(--consensus-dim); color: var(--consensus); }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 6px; bottom: 6px;
    width: 3px;
    background: var(--consensus);
    border-radius: 0 2px 2px 0;
  }

  .nav-item i { width: 18px; text-align: center; font-size: 13px; }

  .nav-badge {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
  }

  .badge-consensus { background: var(--consensus-dim); color: var(--consensus); }
  .badge-economic { background: var(--economic-dim); color: var(--economic); }
  .badge-info { background: var(--info-dim); color: var(--info); }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pulse-dot {
    width: 6px; height: 6px;
    background: var(--consensus);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* ═══ Main ═══ */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .topbar {
    height: 54px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    flex-shrink: 0;
  }

  .topbar-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    flex: 1;
  }

  .topbar-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .consensus-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 12px;
    background: var(--consensus-dim);
    border: 1px solid var(--border-consensus);
    color: var(--consensus);
    font-size: 10px;
    font-family: var(--font-mono);
    font-weight: 600;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    font-family: var(--font-body);
  }

  .btn:hover { border-color: var(--border-light); }
  .btn-consensus { background: var(--consensus-dim); border-color: var(--border-consensus); color: var(--consensus); }
  .btn-consensus:hover { background: rgba(52, 211, 153, 0.15); }
  .btn-economic { background: var(--economic-dim); border-color: rgba(245, 158, 11, 0.3); color: var(--economic); }

  .page { flex: 1; overflow-y: auto; padding: 28px; }

  /* ═══ Stats Grid ═══ */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity var(--transition);
  }

  .stat-card:hover { border-color: var(--border-light); transform: translateY(-2px); box-shadow: var(--shadow); }
  .stat-card:hover::before { opacity: 1; }

  .stat-card.consensus-card { border-color: var(--border-consensus); }
  .stat-card.consensus-card::before { background: linear-gradient(90deg, transparent, var(--consensus), transparent); opacity: 1; }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }

  .stat-delta {
    font-family: var(--font-mono);
    font-size: 10px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .delta-up { color: var(--success); }
  .delta-down { color: var(--danger); }
  .delta-neutral { color: var(--text-muted); }

  /* ═══ Consensus Engine ═══ */
  .consensus-engine {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }

  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title i { color: var(--consensus); font-size: 12px; }

  .panel-body { padding: 16px 18px; }

  /* ═══ Economic Matrix ═══ */
  .eco-matrix {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .eco-matrix th {
    text-align: left;
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg-card);
  }

  .eco-matrix td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .eco-matrix tr:hover td { background: var(--bg-card-hover); }

  .eco-id {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
  }

  .eco-bar {
    width: 60px;
    height: 4px;
    background: var(--bg-tertiary);
    border-radius: 2px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }

  .eco-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  .eco-score {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
  }

  .eco-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 8px;
    font-weight: 600;
  }

  .eco-tag-roi { background: var(--success-dim); color: var(--success); }
  .eco-tag-cost { background: var(--warning-dim); color: var(--warning); }
  .eco-tag-risk { background: var(--danger-dim); color: var(--danger); }

  /* ═══ Consensus Votes ═══ */
  .vote-list { list-style: none; }

  .vote-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .vote-item:last-child { border-bottom: none; }

  .vote-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600;
    font-family: var(--font-mono);
  }

  .vote-info { flex: 1; }
  .vote-name { font-size: 12px; font-weight: 600; }
  .vote-role { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }

  .vote-value {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
  }

  .vote-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  /* ═══ Dependency Map ═══ */
  .dep-graph {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .dep-node {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    text-align: center;
    transition: all var(--transition);
    cursor: pointer;
    position: relative;
  }

  .dep-node:hover { border-color: var(--consensus); box-shadow: 0 0 12px var(--consensus-dim); }
  .dep-node.critical { border-color: var(--danger); }
  .dep-node.active { border-color: var(--consensus); background: var(--consensus-dim); }

  .dep-node-id {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
  }

  .dep-node-label {
    font-size: 10px;
    color: var(--text-secondary);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dep-node-cost {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--economic);
    margin-top: 4px;
  }

  /* ═══ ISD Indicators ═══ */
  .isd-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .isd-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    transition: all var(--transition);
  }

  .isd-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

  .isd-icon {
    width: 36px; height: 36px;
    margin: 0 auto 10px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .isd-value {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .isd-label {
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .isd-bar {
    width: 100%;
    height: 3px;
    background: var(--bg-tertiary);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }

  .isd-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s ease;
  }

  /* ═══ Sprint Economics ═══ */
  .sprint-eco {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
  }

  /* ═══ Timeline Consensus ═══ */
  .consensus-timeline {
    position: relative;
    padding-left: 24px;
  }

  .consensus-timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, var(--consensus), var(--accent), var(--border));
  }

  .ct-entry {
    position: relative;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .ct-entry::before {
    content: '';
    position: absolute;
    left: -20px; top: 14px;
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 2px solid var(--bg-primary);
  }

  .ct-entry.consensus::before { background: var(--consensus); }
  .ct-entry.economic::before { background: var(--economic); }
  .ct-entry.system::before { background: var(--info); }

  .ct-meta {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ct-message { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

  /* ═══ Animations ═══ */
  .fade-in {
    opacity: 0;
    transform: translateY(12px);
    animation: fadeIn 0.5s ease forwards;
  }

  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

  /* ═══ Toast ═══ */
  .toast-area {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12px;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

  /* ═══ Responsive ═══ */
  @media (max-width: 1100px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .consensus-engine { grid-template-columns: 1fr; }
    .isd-grid { grid-template-columns: repeat(2, 1fr); }
    .sprint-eco { grid-template-columns: 1fr; }
  }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .dep-graph { grid-template-columns: repeat(3, 1fr); }
    .isd-grid { grid-template-columns: 1fr 1fr; }
    .page { padding: 16px; }
  }
</style>
</head>
<body>

<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon"><i class="fas fa-atom"></i></div>
        <div>
          <h1>ConcienciaOS</h1>
          <small>Constelación v5.0</small>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Constelación</div>
      <div class="nav-item active" data-page="consensus">
        <i class="fas fa-handshake-angle"></i> Consenso Económico
        <span class="nav-badge badge-consensus">●</span>
      </div>
      <div class="nav-item" data-page="matrix">
        <i class="fas fa-table-cells"></i> Matriz Coste-Impacto
        <span class="nav-badge badge-economic">9</span>
      </div>
      <div class="nav-item" data-page="dependencies">
        <i class="fas fa-diagram-project"></i> Dependencias
      </div>

      <div class="nav-label">Sostenibilidad</div>
      <div class="nav-item" data-page="isd">
        <i class="fas fa-leaf"></i> Indicadores ISD
        <span class="nav-badge badge-info">4</span>
      </div>
      <div class="nav-item" data-page="forecast">
        <i class="fas fa-chart-area"></i> Proyecciones
      </div>

      <div class="nav-label">Gobernanza</div>
      <div class="nav-item" data-page="votes">
        <i class="fas fa-check-to-slot"></i> Votaciones
      </div>
      <div class="nav-item" data-page="timeline">
        <i class="fas fa-timeline"></i> Histórico
      </div>
    </nav>
    <div class="sidebar-footer">
      <span class="pulse-dot"></span>
      consenso activo · 4 agentes · T003 en disputa
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <span class="topbar-title" id="topbarTitle">Constelación Económica de Consenso</span>
      <div class="topbar-meta">
        <div class="consensus-indicator">
          <i class="fas fa-circle-nodes"></i>
          Consenso: 78%
        </div>
        <span>Sprint 1 · Epoch 3</span>
      </div>
      <button class="btn btn-consensus" id="btnSync"><i class="fas fa-rotate"></i> Sincronizar</button>
    </header>

    <div class="page" id="pageContent"></div>
  </div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
(function() {
  "use strict";

  // ══════════════════════════════════════════════════
  // DATA: Modelo Económico de Consenso
  // ══════════════════════════════════════════════════
  var TASKS = [
    { id:"T001", title:"Arquitectura Atómica", cost:8, impact:95, roi:11.9, risk:0.1, consensus:100, status:"done", votes:{AQ:1,MR:1,LG:1,EC:1}, deps:[], category:"Arquitectura" },
    { id:"T002", title:"Persistencia IndexedDB", cost:12, impact:88, roi:7.3, risk:0.15, consensus:100, status:"done", votes:{AQ:1,MR:1,LG:1,EC:1}, deps:["T001"], category:"Backend" },

  function qs(s) { return document.querySelector(s); }
  function qsa(s) { return document.querySelectorAll(s); }

  function getConsensusColor(c) {
    if (c >= 90) return "var(--success)";
    if (c >= 70) return "var(--consensus)";
    if (c >= 50) return "var(--warning)";
    return "var(--danger)";
  }

  function getRoiColor(r) {
    if (r >= 8) return "var(--success)";
    if (r >= 5) return "var(--info)";
    return "var(--warning)";
  }

  function getRiskColor(r) {
    if (r <= 0.1) return "var(--success)";
    if (r <= 0.2) return "var(--warning)";
    return "var(--danger)";
  }

  function getTotalCost() { return TASKS.reduce(function(a,t){return a+t.cost;},0); }
  function getAvgROI() { return (TASKS.reduce(function(a,t){return a+t.roi;},0)/TASKS.length).toFixed(1); }
  function getGlobalConsensus() { return Math.round(TASKS.reduce(function(a,t){return a+t.consensus;},0)/TASKS.length); }
  function getCompletedValue() { return TASKS.filter(function(t){return t.status==="done";}).reduce(function(a,t){return a+t.impact;},0); }

    el.innerHTML = html;
  }

  // ── Forecast ──
  function renderForecast(el) {
    var remaining = TASKS.filter(function(t){return t.status!=="done";});
    var remainingCost = remaining.reduce(function(a,t){return a+t.cost;},0);
    var remainingImpact = remaining.reduce(function(a,t){return a+t.impact;},0);

    el.innerHTML =
      '<div class="stats-grid fade-in" style="grid-template-columns:repeat(4,1fr)">' +
        '<div class="stat-card"><div class="stat-label">Horas Restantes</div><div class="stat-value" style="color:var(--economic)">' + remainingCost + 'h</div><div class="stat-delta delta-neutral">~' + Math.ceil(remainingCost/8) + ' días hábiles</div></div>' +
        '<div class="stat-card"><div class="stat-label">Impacto Pendiente</div><div class="stat-value" style="color:var(--info)">' + remainingImpact + '</div><div class="stat-delta delta-neutral">pts por desbloquear</div></div>' +
        '<div class="stat-card"><div class="stat-label">Velocidad Actual</div><div class="stat-value" style="color:var(--consensus)">12.5</div><div class="stat-delta delta-up"><i class="fas fa-arrow-up"></i> h/día promedio</div></div>' +
        '<div class="stat-card"><div class="stat-label">ETA Sprint</div><div class="stat-value" style="color:var(--accent)">' + Math.ceil(remainingCost/12.5) + 'd</div><div class="stat-delta delta-neutral">al ritmo actual</div></div>' +
      '</div>' +
      '<div class="panel fade-in" style="animation-delay:0.1s">' +
        '<div class="panel-header"><span class="panel-title"><i class="fas fa-chart-area"></i> Proyección de Entrega por Prioridad</span></div>' +
        '<div class="panel-body">' +
          '<div style="font-size:12px;color:var(--text-secondary);line-height:2">' +
            '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="eco-tag eco-tag-risk">Ruta Crítica</span> T003 → T007: <strong style="color:var(--danger)">44h</strong> — <em>requiere resolver disputa de consenso primero</em></div>' +
            '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="eco-tag eco-tag-roi">Quick Wins</span> T004 + T005: <strong style="color:var(--success)">14h</strong> — ROI combinado 9.9x, consenso >85%</div>' +
            '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span class="eco-tag eco-tag-cost">Desbloqueadores</span> T006 depende de T003+T004+T005 — <strong style="color:var(--warning)">no iniciar antes de epoch 4</strong></div>' +
            '<div style="display:flex;align-items:center;gap:10px"><span class="eco-tag" style="background:var(--consensus-dim);color:var(--consensus)">Recomendación</span> Priorizar T004+T005 → desbloquear T006+T008 → resolver T003 en paralelo con apoyo de EC</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  // ── Votes ──
  function renderVotes(el) {
    var disputed = TASKS.filter(function(t){return t.consensus < 80;});
    var html =
      '<div style="margin-bottom:20px" class="fade-in">' +
        '<div style="font-size:14px;color:var(--text-secondary);margin-bottom:12px">Tareas con consenso < 80% requieren votación activa</div>' +
      '</div>';

    disputed.forEach(function(t, i) {
      html +=
        '<div class="panel fade-in" style="margin-bottom:16px;animation-delay:' + (i*0.05) + 's">' +
          '<div class="panel-header">' +
            '<span class="panel-title" style="gap:10px"><span class="eco-id" style="font-size:12px">' + t.id + '</span> ' + t.title + '</span>' +
            '<span style="font-family:var(--font-mono);font-size:11px;color:' + getConsensusColor(t.consensus) + '">' + t.consensus + '% consenso</span>' +
          '</div>' +
          '<div class="panel-body">' +
            '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">';

      STAKEHOLDERS.forEach(function(s) {
        var vote = t.votes[s.id];
        var voteLabel = vote >= 0.8 ? "Aprueba" : vote >= 0.5 ? "Condicional" : "Objeta";
        var voteColor = vote >= 0.8 ? "var(--success)" : vote >= 0.5 ? "var(--warning)" : "var(--danger)";
        html +=
          '<div style="text-align:center;padding:12px;background:var(--bg-tertiary);border-radius:var(--radius-sm)">' +
            '<div class="vote-avatar" style="background:' + s.color + '20;color:' + s.color + ';margin:0 auto 6px">' + s.id + '</div>' +
            '<div style="font-size:10px;font-weight:600">' + s.name + '</div>' +
            '<div style="font-family:var(--font-mono);font-size:10px;color:' + voteColor + ';margin-top:4px">' + voteLabel + ' (' + (vote*100).toFixed(0) + '%)</div>' +
          '</div>';
      });

      html +=
            '</div>' +
            '<div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">' +
              '<button class="btn btn-consensus" onclick="showToast(\'' + t.id + ': solicitud de re-votación enviada\')"><i class="fas fa-redo"></i> Re-votar</button>' +
              '<button class="btn btn-economic" onclick="showToast(\'' + t.id + ': escalado a mediación económica\')"><i class="fas fa-gavel"></i> Mediar</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    });

    if (disputed.length === 0) {
      html += '<div style="text-align:center;padding:40px;color:var(--text-muted)"><i class="fas fa-check-circle" style="font-size:32px;color:var(--success)"></i><p style="margin-top:12px">Todas las tareas tienen consenso ≥ 80%</p></div>';
    }

    el.innerHTML = html;
  }

  // ── Timeline ──
  function renderTimeline(el) {
    var html = '<div class="consensus-timeline fade-in">';
    CONSENSUS_LOG.forEach(function(entry, i) {
      html +=
        '<div class="ct-entry ' + entry.type + '" style="animation-delay:' + (i*0.04) + 's">' +
          '<div class="ct-meta">' +
            '<span style="color:var(--text-secondary)">' + entry.time + '</span>' +
            '<span style="color:var(--accent)">' + entry.agents + '</span>' +
            '<span class="eco-tag" style="background:var(--' + entry.type + '-dim,var(--bg-tertiary));color:var(--' + entry.type + ',var(--text-muted));font-size:8px">' + entry.type + '</span>' +
          '</div>' +
          '<div class="ct-message">' + entry.msg + '</div>' +
        '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  // ══════════════════════════════════════════════════
  // INIT
  // ══════════════════════════════════════════════════
  qs("#btnSync").addEventListener("click", function() {
    showToast("Sincronización epoch 3 completada · 4 agentes · consenso recalculado");
  });

  navigate("consensus");

})();
</script>
</body>
</html>
