<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inteligencia Viva - Portada v2.4 Final</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap');

* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
}

body {
  background: #0a1f2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Inter', -apple-system, sans-serif;
  padding: 20px;
}

.portada {
  width: 595px;
  height: 842px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 35px 100px rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* FONDO FOTOGRÁFICO MULTICAPA */
.fondo-fotografico {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: 
    linear-gradient(135deg, 
      rgba(10, 61, 98, 0.92) 0%, 
      rgba(10, 61, 98, 0.75) 35%,
      rgba(39, 174, 96, 0.35) 65%,
      rgba(0, 122, 255, 0.45) 100%
    ),
    radial-gradient(ellipse at 18% 28%, rgba(39, 174, 96, 0.45) 0%, transparent 35%),
    radial-gradient(ellipse at 82% 72%, rgba(0, 122, 255, 0.4) 0%, transparent 40%),
    radial-gradient(circle at 50% 45%, rgba(243, 156, 18, 0.25) 0%, transparent 50%),
    repeating-linear-gradient(125deg, 
      transparent 0px, 
      transparent 3px, 
      rgba(255, 255, 255, 0.03) 3px, 
      rgba(255, 255, 255, 0.03) 6px
    ),
    repeating-linear-gradient(35deg, 
      transparent 0px, 
      transparent 4px, 
      rgba(39, 174, 96, 0.04) 4px, 
      rgba(39, 174, 96, 0.04) 8px
    ),
    linear-gradient(160deg, 
      #0d1f2d 0%, 
      #1a3a4a 35%, 
      #234856 70%, 
      #1e4a5f 100%
    );
  background-size: 
    cover,
    180% 180%,
    190% 190%,
    200% 200%,
    100% 100%,
    100% 100%,
    cover;
  background-position: 
    center,
    top left,
    bottom right,
    center,
    0 0,
    0 0,
    center;
  animation: photoShift 25s ease-in-out infinite;
}

@keyframes photoShift {
  0%, 100% { 
    background-position: center, top left, bottom right, center, 0 0, 0 0, center; 
  }
  50% { 
    background-position: center, bottom left, top right, center top, 0 0, 0 0, center bottom; 
  }
}

.bokeh-particles {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image:
    radial-gradient(circle at 12% 22%, rgba(255, 255, 255, 0.18) 0%, transparent 4%),
    radial-gradient(circle at 78% 38%, rgba(39, 174, 96, 0.22) 0%, transparent 6%),
    radial-gradient(circle at 88% 78%, rgba(0, 122, 255, 0.2) 0%, transparent 7%),
    radial-gradient(circle at 25% 82%, rgba(243, 156, 18, 0.15) 0%, transparent 5%),
    radial-gradient(circle at 62% 18%, rgba(255, 255, 255, 0.12) 0%, transparent 4%),
    radial-gradient(circle at 45% 92%, rgba(39, 174, 96, 0.1) 0%, transparent 3%);
  filter: blur(12px);
  opacity: 0.7;
  animation: bokehFloat 20s ease-in-out infinite;
}

@keyframes bokehFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-15px) scale(1.05); }
}

.glass-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(1px) saturate(1.3);
  -webkit-backdrop-filter: blur(1px) saturate(1.3);
}

/* HEADER - CENTRADO ABSOLUTO */
.header {
  position: absolute;
  top: 55px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
  width: 100%;
}

.titulo {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 52pt;
  line-height: 1.1;
  letter-spacing: 2px;
  color: #ffffff;
  margin-bottom: 16px;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  text-shadow: 
    0 2px 4px rgba(0, 0, 0, 0.4),
    0 8px 24px rgba(10, 61, 98, 0.6);
}

.titulo .viva {
  color: #27ae60;
  text-shadow: 
    0 2px 4px rgba(0, 0, 0, 0.4),
    0 4px 16px rgba(39, 174, 96, 0.8),
    0 0 40px rgba(39, 174, 96, 0.4);
}

.subtitulo {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 13pt;
  line-height: 1.5;
  letter-spacing: 0.3px;
  color: rgba(255, 255, 255, 0.92);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
  max-width: 480px;
  margin: 0 auto;
  padding: 0 30px;
}

/* INFOGRAFÍA - CENTRADA Y BAJADA */
.infografia-container {
  position: absolute;
  top: 56%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 420px;
  height: 300px;
  z-index: 5;
}

.infografia-svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.25));
}

.circuito-organico {
  fill: none;
  stroke: #27ae60;
  stroke-width: 2.8;
  opacity: 0.85;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.circuito-neural {
  fill: none;
  stroke: #f39c12;
  stroke-width: 3;
  opacity: 0.9;
  stroke-linecap: round;
}

.circuito-tech {
  fill: none;
  stroke: #007AFF;
  stroke-width: 2.5;
  opacity: 0.8;
  stroke-linecap: round;
}

.nodo-organico {
  fill: #27ae60;
  filter: drop-shadow(0 2px 6px rgba(39, 174, 96, 0.5));
}

.nodo-neural {
  fill: #f39c12;
  filter: drop-shadow(0 3px 8px rgba(243, 156, 18, 0.6));
}

.nodo-tech {
  fill: #007AFF;
  filter: drop-shadow(0 2px 6px rgba(0, 122, 255, 0.5));
}

.hoja-organica {
  fill: #27ae60;
  opacity: 0.9;
  filter: drop-shadow(0 2px 5px rgba(39, 174, 96, 0.4));
}

.conexion-integradora {
  fill: none;
  stroke: rgba(255, 255, 255, 0.6);
  stroke-width: 2;
  stroke-dasharray: 10, 8;
  opacity: 0.5;
  animation: pulsoConexion 4s ease-in-out infinite;
}

@keyframes pulsoConexion {
  0%, 100% { opacity: 0.3; stroke-width: 2; }
  50% { opacity: 0.8; stroke-width: 2.5; }
}

.chip-tech {
  fill: none;
  stroke: #007AFF;
  stroke-width: 2.2;
  opacity: 0.7;
}

.chip-fill {
  fill: #007AFF;
  opacity: 0.25;
}

/* FOOTER - CENTRADO ABSOLUTO */
.footer {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  z-index: 10;
  padding: 0 30px;
}

.autores {
  font-family: 'Inter', sans-serif;
  font-size: 8.5pt;
  font-weight: 400;
  line-height: 1.7;
  color: rgba(255, 255, 255, 0.85);
  text-align: center;
  margin-bottom: 15px;
  letter-spacing: 0.15px;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
}

.autor {
  display: inline;
  white-space: nowrap;
}

.autor::after {
  content: ' • ';
  color: rgba(39, 174, 96, 0.9);
  margin: 0 4px;
  font-weight: 600;
}

.autor:last-child::after {
  content: '';
}

.metadata {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Inter', sans-serif;
  font-size: 8.5pt;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.75);
  padding-top: 13px;
  border-top: 1.5px solid rgba(39, 174, 96, 0.4);
  max-width: 520px;
  margin: 0 auto;
}

.isbn {
  letter-spacing: 0.3px;
  color: rgba(255, 255, 255, 0.9);
}

.sello-avia {
  background: rgba(39, 174, 96, 0.18);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: rgba(255, 255, 255, 0.95);
  padding: 6px 12px;
  border-radius: 18px;
  font-size: 7.5pt;
  font-weight: 700;
  letter-spacing: 0.8px;
  border: 1px solid rgba(39, 174, 96, 0.35);
  box-shadow: 0 4px 16px rgba(39, 174, 96, 0.25);
}

.depth-line {
  position: absolute;
  bottom: 150px;
  left: 40px;
  width: 4px;
  height: 90px;
  background: linear-gradient(180deg, 
    rgba(39, 174, 96, 0.85) 0%, 
    rgba(243, 156, 18, 0.7) 50%,
    rgba(0, 122, 255, 0.6) 100%
  );
  border-radius: 4px;
  box-shadow: 0 0 24px rgba(39, 174, 96, 0.6);
}
</style>
</head>
<body>

  <!-- Header con centrado absoluto perfecto -->
