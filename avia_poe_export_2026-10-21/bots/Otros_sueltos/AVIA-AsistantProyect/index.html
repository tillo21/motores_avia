<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA - Asistente de Proyectos IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .project-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .project-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .project-item.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .project-item h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .project-item p {
            color: #666;
            font-size: 0.85em;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 15px;
            text-align: left;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .message-time {
            font-size: 0.75em;
            color: #999;
            margin-top: 5px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border 0.3s;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin: 10px 0;
        }

        .modal-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-textarea {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin: 10px 0;
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .modal-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .modal-button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-button.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .modal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
            padding: 40px;
        }

        .empty-state h2 {
            font-size: 2em;
            margin: 20px 0;
            color: #667eea;
        }

        .empty-state p {
            max-width: 500px;
            line-height: 1.6;
        }

        .typing-indicator {
            display: inline-block;
            padding: 15px 20px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .status-bar {
            background: #f0f4ff;
            padding: 8px 20px;
            font-size: 0.85em;
            color: #667eea;
            border-bottom: 1px solid #dee2e6;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>🤖</span>
                AVIA - Asistente de Proyectos
            </h1>
            <div class="header-buttons">
                <button class="btn" onclick="newProject()">+ Nuevo Proyecto</button>
                <button class="btn" onclick="exportProject()">📥 Exportar</button>
            </div>
        </div>

        <div class="status-bar">
            💾 Datos almacenados en memoria de sesión (no persisten al recargar)
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h3>Mis Proyectos</h3>
                <div id="projectList"></div>
            </div>

            <div class="chat-area">
                <div class="messages" id="messages">
                    <div class="empty-state">
                        <h2>👋 ¡Hola!</h2>
                        <p>Soy tu asistente de proyectos IA. Puedo ayudarte a planificar, organizar y desarrollar tus ideas. Crea un nuevo proyecto o selecciona uno existente para comenzar.</p>
                    </div>
                </div>

                <div class="input-area">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Escribe tu mensaje aquí..."
                        disabled
                    >
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled>
                        Enviar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay"></div>

    <script>
        // ═══════════════════════════════════════════════════════
        // REGLA #002: ALMACENAMIENTO EN MEMORIA (NO localStorage)
        // ═══════════════════════════════════════════════════════
        
        // Estado global de la aplicación (solo en memoria)
        const APP_STATE = {
            projects: [],
            currentProject: null
        };

        // Sistema de Modal Custom (REGLA #001)
        class CustomModal {
            static async prompt(message, defaultValue = '') {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('modalOverlay');
                    overlay.innerHTML = `
                        <div class="modal-content">
                            <h2>📝 ${message}</h2>
                            <input type="text" class="modal-input" id="modalInput" value="${defaultValue}">
                            <div class="modal-buttons">
                                <button class="modal-button primary" onclick="window.modalResolve(document.getElementById('modalInput').value)">Aceptar</button>
                                <button class="modal-button secondary" onclick="window.modalResolve(null)">Cancelar</button>
                            </div>
                        </div>
                    `;
                    overlay.classList.add('active');
                    document.getElementById('modalInput').focus();
                    
                    window.modalResolve = (value) => {
                        overlay.classList.remove('active');
                        resolve(value);
                    };
                });
            }

            static async promptProject() {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('modalOverlay');
                    overlay.innerHTML = `
                        <div class="modal-content">
                            <h2>🚀 Nuevo Proyecto</h2>
                            <input type="text" class="modal-input" id="projectName" placeholder="Nombre del proyecto">
                            <textarea class="modal-textarea" id="projectDesc" placeholder="Descripción del proyecto"></textarea>
                            <div class="modal-buttons">
                                <button class="modal-button primary" onclick="window.modalResolve({
                                    name: document.getElementById('projectName').value,
                                    description: document.getElementById('projectDesc').value
                                })">Crear</button>
                                <button class="modal-button secondary" onclick="window.modalResolve(null)">Cancelar</button>
                            </div>
                        </div>
                    `;
                    overlay.classList.add('active');
                    document.getElementById('projectName').focus();
                    
                    window.modalResolve = (value) => {
                        overlay.classList.remove('active');
                        resolve(value);
                    };
                });
            }

            static async alert(message) {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('modalOverlay');
                    overlay.innerHTML = `
                        <div class="modal-content">
                            <h2>ℹ️ Información</h2>
                            <p style="margin: 20px 0; color: #555;">${message}</p>
                            <div class="modal-buttons">
                                <button class="modal-button primary" onclick="window.modalResolve()">Aceptar</button>
                            </div>
                        </div>
                    `;
                    overlay.classList.add('active');
                    
                    window.modalResolve = () => {
                        overlay.classList.remove('active');
                        resolve();
                    };
                });
            }
        }

        // Plantillas de respuestas del asistente
        const assistantResponses = {
            greeting: "¡Hola! Veo que has creado el proyecto '{name}'. Cuéntame más sobre lo que quieres desarrollar.",
            planning: "Perfecto. Para organizar mejor tu proyecto, te sugiero dividirlo en fases. ¿Te gustaría que te ayude a crear un plan de trabajo?",
            technical: "Interesante enfoque técnico. ¿Qué tecnologías estás considerando usar? Puedo ayudarte a evaluar opciones.",
            progress: "Excelente progreso. ¿Hay algún aspecto específico en el que necesites ayuda o clarificación?",
            help: "Estoy aquí para ayudarte. Puedo asistirte con: planificación, estructura del proyecto, sugerencias técnicas, organización de tareas, o resolver dudas específicas.",
            tasks: "Entiendo. ¿Quieres que te ayude a definir tareas concretas para este objetivo?",
            timeline: "Para establecer un cronograma realista, ¿cuánto tiempo tienes disponible para trabajar en esto?",
            resources: "Te puedo recomendar recursos según el tipo de proyecto. ¿Es algo técnico, creativo, educativo...?",
            clarification: "Entiendo tu punto. ¿Podrías darme más detalles sobre esto? Así podré ayudarte mejor."
        };

        // Inicializar aplicación
        function init() {
            renderProjects();
            
            // Crear proyecto de ejemplo
            if (APP_STATE.projects.length === 0) {
                APP_STATE.projects.push({
                    id: Date.now(),
                    name: "Ejemplo: App Web",
                    description: "Proyecto de demostración",
                    created: new Date().toISOString(),
                    messages: [
                        {
                            role: 'assistant',
                            content: 'Este es un proyecto de ejemplo. ¡Crea uno nuevo para comenzar!',
                            timestamp: new Date().toISOString()
                        }
                    ]
                });
                renderProjects();
            }
        }

        // Nuevo proyecto
        async function newProject() {
            const data = await CustomModal.promptProject();
            
            if (!data || !data.name.trim()) {
                if (data) {
                    await CustomModal.alert('⚠️ El nombre del proyecto es obligatorio');
                }
                return;
            }

            const project = {
                id: Date.now(),
                name: data.name.trim(),
                description: data.description.trim(),
                created: new Date().toISOString(),
                messages: []
            };

            APP_STATE.projects.unshift(project);
            renderProjects();
            selectProject(project.id);

            setTimeout(() => {
                addAssistantMessage(assistantResponses.greeting.replace('{name}', project.name));
            }, 500);
        }

        // Renderizar lista de proyectos
        function renderProjects() {
            const list = document.getElementById('projectList');
            
            if (APP_STATE.projects.length === 0) {
                list.innerHTML = '<p style="color: #999; text-align: center;">No hay proyectos aún</p>';
                return;
            }

            list.innerHTML = APP_STATE.projects.map(p => `
                <div class="project-item ${APP_STATE.currentProject && APP_STATE.currentProject.id === p.id ? 'active' : ''}" 
                     onclick="selectProject(${p.id})">
                    <h4>${p.name}</h4>
                    <p>${p.description || 'Sin descripción'}</p>
                    <p style="font-size: 0.75em; color: #999; margin-top: 5px;">
                        ${new Date(p.created).toLocaleDateString()}
                    </p>
                </div>
            `).join('');
        }

        // Seleccionar proyecto
        function selectProject(id) {
            APP_STATE.currentProject = APP_STATE.projects.find(p => p.id === id);
            renderProjects();
            renderMessages();
            
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('messageInput').focus();
        }

        // Renderizar mensajes
        function renderMessages() {
            const container = document.getElementById('messages');
            
            if (!APP_STATE.currentProject || APP_STATE.currentProject.messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>💬 ${APP_STATE.currentProject.name}</h2>
                        <p>${APP_STATE.currentProject.description || 'Comienza la conversación escribiendo un mensaje'}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = APP_STATE.currentProject.messages.map(m => `
                <div class="message ${m.role}">
                    <div class="message-content">
                        ${m.content}
                        <div class="message-time">${new Date(m.timestamp).toLocaleTimeString()}</div>
                    </div>
                </div>
            `).join('');

            container.scrollTop = container.scrollHeight;
        }

        // Enviar mensaje
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !APP_STATE.currentProject) return;

            APP_STATE.currentProject.messages.push({
                role: 'user',
                content: message,
                timestamp: new Date().toISOString()
            });

            input.value = '';
            renderMessages();

            showTypingIndicator();

            setTimeout(() => {
                hideTypingIndicator();
                generateAssistantResponse(message);
            }, 1500);
        }

        // Generar respuesta del asistente
        function generateAssistantResponse(userMessage) {
            let response = '';
            const msg = userMessage.toLowerCase();

            if (msg.includes('plan') || msg.includes('organizar') || msg.includes('estructura')) {
                response = assistantResponses.planning;
            } else if (msg.includes('tecnolog') || msg.includes('código') || msg.includes('desarrollo')) {
                response = assistantResponses.technical;
            } else if (msg.includes('progreso') || msg.includes('avance') || msg.includes('estado')) {
                response = assistantResponses.progress;
            } else if (msg.includes('tarea') || msg.includes('tareas') || msg.includes('hacer')) {
                response = assistantResponses.tasks;
            } else if (msg.includes('tiempo') || msg.includes('cuándo') || msg.includes('cronograma')) {
                response = assistantResponses.timeline;
            } else if (msg.includes('recurso') || msg.includes('herramienta') || msg.includes('material')) {
                response = assistantResponses.resources;
            } else if (msg.includes('ayuda') || msg.includes('help') || msg.includes('?')) {
                response = assistantResponses.help;
            } else {
                response = assistantResponses.clarification;
            }

            addAssistantMessage(response);
        }

        // Agregar mensaje del asistente
        function addAssistantMessage(content) {
            if (!APP_STATE.currentProject) return;

            APP_STATE.currentProject.messages.push({
                role: 'assistant',
                content: content,
                timestamp: new Date().toISOString()
            });

            renderMessages();
        }

        // Indicador de escritura
        function showTypingIndicator() {
            const container = document.getElementById('messages');
            const indicator = document.createElement('div');
            indicator.className = 'message assistant';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            container.appendChild(indicator);
            container.scrollTop = container.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // Exportar proyecto
        async function exportProject() {
            if (!APP_STATE.currentProject) {
                await CustomModal.alert('⚠️ Selecciona un proyecto primero');
                return;
            }

            const data = JSON.stringify(APP_STATE.currentProject, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${APP_STATE.currentProject.name.replace(/\s+/g, '_')}_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);

            await CustomModal.alert('✅ Proyecto exportado correctamente');
        }

        // Enter para enviar
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Iniciar aplicación
        init();
    </script>
</body>
</html>
