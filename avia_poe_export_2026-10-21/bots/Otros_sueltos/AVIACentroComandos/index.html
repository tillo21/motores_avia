<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constelación AVIA — Centro de Comando Integrado</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --void: #010309;
            --deep: #050a14;
            --surface: #0a1220;
            --card: #0e1829;
            --elevated: #132035;
            --border: rgba(120, 160, 220, 0.07);
            --border-hover: rgba(120, 160, 220, 0.2);
            --text-1: #e6edf6;
            --text-2: #8da0b8;
            --text-3: #4d6478;
            --node-auditor: #f472b6;
            --node-cert: #fbbf24;
            --node-obs: #22d3ee;
            --node-carlos: #a78bfa;
            --node-hub: #60a5fa;
            --glow-auditor: rgba(244, 114, 182, 0.15);
            --glow-cert: rgba(251, 191, 36, 0.15);
            --glow-obs: rgba(34, 211, 238, 0.15);
            --glow-carlos: rgba(167, 139, 250, 0.15);
            --glow-hub: rgba(96, 165, 250, 0.12);
            --emerald: #10b981;
            --radius: 14px;
            --radius-lg: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--void);
            color: var(--text-1);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Starfield background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.35) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.25) 0%, transparent 100%),
                radial-gradient(1px 1px at 15% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.15) 0%, transparent 100%),
                radial-gradient(1px 1px at 60% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 25% 75%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(ellipse 60% 40% at 50% 30%, rgba(96, 165, 250, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .command-center {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 16px 14px 60px;
        }

        /* === TOP BAR === */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            margin-bottom: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar-logo {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--node-hub), var(--node-carlos));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
        }

        .top-bar-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-2);
            letter-spacing: 0.5px;
        }

        .top-bar-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--emerald);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 70%, 100% { opacity: 1; }
            35% { opacity: 0.3; }
        }

        /* === CONSTELLATION SVG === */
        .constellation-section {
            margin-bottom: 28px;
        }

        .constellation-wrap {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            overflow: hidden;
        }

        .constellation-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(96, 165, 250, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .constellation-svg {
            width: 100%;
            height: 320px;
            display: block;
        }

        .node-group { cursor: pointer; }
        .node-group:hover .node-ring { opacity: 1; }
        .node-group:hover .node-label { opacity: 1; }

        .node-core {
            transition: r 0.3s ease;
        }

        .node-group:hover .node-core {
            r: 22;
        }

        .node-ring {
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .node-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            fill: var(--text-2);
            text-anchor: middle;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .node-status-label {
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            fill: var(--text-3);
            text-anchor: middle;
            letter-spacing: 0.5px;
        }

        .edge-line {
            stroke-width: 1;
            fill: none;
            opacity: 0.3;
            stroke-dasharray: 4 4;
            animation: dashFlow 12s linear infinite;
        }

        @keyframes dashFlow {
            to { stroke-dashoffset: -48; }
        }

        .edge-pulse {
            stroke-width: 2;
            fill: none;
            opacity: 0;
            animation: edgePulse 3s ease-in-out infinite;
        }

        @keyframes edgePulse {
            0%, 100% { opacity: 0; stroke-dashoffset: 60; }
            50% { opacity: 0.6; stroke-dashoffset: 0; }
        }

        /* === MODULE CARDS === */
        .section-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 12px;
            padding-left: 2px;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }

        .module-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .module-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
        }

        .module-card.auditor::before { background: var(--node-auditor); }
        .module-card.cert::before { background: var(--node-cert); }
        .module-card.obs::before { background: var(--node-obs); }
        .module-card.carlos::before { background: var(--node-carlos); }

        .module-icon-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .module-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .module-card.auditor .module-icon { background: var(--glow-auditor); color: var(--node-auditor); }
        .module-card.cert .module-icon { background: var(--glow-cert); color: var(--node-cert); }
        .module-card.obs .module-icon { background: var(--glow-obs); color: var(--node-obs); }
        .module-card.carlos .module-icon { background: var(--glow-carlos); color: var(--node-carlos); }

        .module-status-badge {
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-active { background: rgba(16, 185, 129, 0.1); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-ready { background: rgba(96, 165, 250, 0.08); color: var(--node-hub); border: 1px solid rgba(96, 165, 250, 0.15); }

        .module-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .module-desc {
            font-size: 11px;
            color: var(--text-2);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .module-metric {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 11px;
        }

        .module-metric-label { color: var(--text-3); }
        .module-metric-value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--text-1); }

        /* === GLOBAL HEALTH === */
        .health-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 28px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 20px;
            align-items: center;
        }

        .health-ring-wrap {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .health-ring {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .health-ring-bg {
            fill: none;
            stroke: var(--surface);
            stroke-width: 6;
        }

        .health-ring-fill {
            fill: none;
            stroke: var(--emerald);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 264;
            stroke-dashoffset: 264;
            transition: stroke-dashoffset 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .health-value {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .health-number {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 22px;
            font-weight: 600;
            color: var(--emerald);
        }

        .health-label {
            font-size: 8px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .health-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .health-stat {
            padding: 8px 12px;
            background: var(--surface);
            border-radius: 8px;
        }

        .health-stat-val {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-1);
        }

        .health-stat-name {
            font-size: 10px;
            color: var(--text-3);
            margin-top: 2px;
        }

        /* === DECISION LOG === */
        .decision-log {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 28px;
        }

        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .log-header h3 {
            font-family: 'Libre Baskerville', serif;
            font-size: 15px;
            font-weight: 700;
        }

        .log-carlos-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--node-carlos);
            padding: 4px 10px;
            background: var(--glow-carlos);
            border-radius: 12px;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        .log-entries {
            max-height: 240px;
            overflow-y: auto;
        }

        .log-entries::-webkit-scrollbar { width: 3px; }
        .log-entries::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .log-entry {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .log-entry:last-child { border-bottom: none; }

        .log-entry-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .log-entry-icon.decision { background: var(--glow-carlos); color: var(--node-carlos); }
        .log-entry-icon.transition { background: var(--glow-cert); color: var(--node-cert); }
        .log-entry-icon.milestone { background: rgba(16, 185, 129, 0.1); color: var(--emerald); }

        .log-entry-content { flex: 1; }

        .log-entry-time {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            color: var(--text-3);
            margin-bottom: 2px;
        }

        .log-entry-text {
            font-size: 12px;
            color: var(--text-2);
            line-height: 1.5;
        }

        .log-entry-text strong { color: var(--text-1); font-weight: 600; }

        /* === ACTIONS === */
        .cmd-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 18px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cmd {
            background: linear-gradient(135deg, var(--node-hub), #3b82f6);
            color: #fff;
            box-shadow: 0 4px 16px rgba(96, 165, 250, 0.2);
        }

        .btn-cmd:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(96, 165, 250, 0.3); }
        .btn-cmd:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .btn-outline {
            background: transparent;
            color: var(--text-2);
            border: 1px solid var(--border);
        }

        .btn-outline:hover { border-color: var(--border-hover); color: var(--text-1); }

        /* === AI OUTPUT === */
        .ai-output {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 20px;
            display: none;
        }

        .ai-output.visible { display: block; }

        .ai-output-text {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            line-height: 1.9;
            color: var(--text-2);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 320px;
            overflow-y: auto;
        }

        .ai-output-text::-webkit-scrollbar { width: 3px; }
        .ai-output-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* Loader */
        .cmd-loader {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px;
            font-size: 11px;
            color: var(--text-2);
        }

        .cmd-loader.visible { display: flex; }

        .orbit-loader {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--node-hub);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal */
        .modal-layer {
            position: fixed;
            inset: 0;
            background: rgba(1, 3, 9, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-layer.visible { display: flex; }

        .modal-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            max-width: 440px;
            width: 100%;
        }

        .modal-panel h3 {
            font-family: 'Libre Baskerville', serif;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .modal-panel p {
            color: var(--text-2);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .modal-panel .modal-foot {
            display: flex;
            justify-content: flex-end;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .modules-grid { grid-template-columns: 1fr; }
            .health-panel { grid-template-columns: 1fr; justify-items: center; text-align: center; }
            .health-details { width: 100%; }
            .constellation-svg { height: 260px; }
            .cmd-actions { flex-direction: column; }
            .btn { justify-content: center; }
            .top-bar { flex-direction: column; gap: 8px; text-align: center; }
        }

        /* Animations */
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .rise { animation: riseIn 0.5s ease forwards; opacity: 0; }
        .rise-d1 { animation-delay: 0.05s; }
        .rise-d2 { animation-delay: 0.1s; }
        .rise-d3 { animation-delay: 0.15s; }
        .rise-d4 { animation-delay: 0.2s; }
    </style>
</head>
<body>
    <div class="command-center">
        <!-- Top bar -->
        <div class="top-bar rise">
            <div class="top-bar-left">
                <div class="top-bar-logo"><i class="fas fa-star-of-life"></i></div>
                <span class="top-bar-title">CONSTELACIÓN AVIA · Centro de Comando</span>
            </div>
            <div class="top-bar-status">
                <span class="status-dot"></span>
                <span>Ecosistema activo</span>
            </div>
        </div>

        <!-- Constellation map -->
        <div class="constellation-section rise rise-d1">
            <div class="constellation-wrap">
                <svg class="constellation-svg" id="constellationSvg" viewBox="0 0 800 320"></svg>
            </div>
        </div>

        <!-- Global Health -->
        <div class="section-tag rise rise-d2">Estado Global del Ecosistema</div>
        <div class="health-panel rise rise-d2" id="healthPanel">
            <div class="health-ring-wrap">
                <svg class="health-ring" viewBox="0 0 100 100">
                    <circle class="health-ring-bg" cx="50" cy="50" r="42"/>
                    <circle class="health-ring-fill" id="healthRingFill" cx="50" cy="50" r="42"/>
                </svg>
                <div class="health-value">
                    <div class="health-number" id="healthNumber">0%</div>
                    <div class="health-label">Salud</div>
                </div>
            </div>
            <div class="health-details" id="healthDetails"></div>
        </div>

        <!-- Module cards -->
        <div class="section-tag rise rise-d3">Módulos del Ecosistema</div>
        <div class="modules-grid rise rise-d3" id="modulesGrid"></div>

        <!-- Decision log -->
        <div class="decision-log rise rise-d4" id="decisionLog">
            <div class="log-header">
                <h3>Historial de Decisiones</h3>
                <div class="log-carlos-badge"><i class="fas fa-robot"></i> Clon de Carlos</div>
            </div>
            <div class="log-entries" id="logEntries"></div>
        </div>

        <!-- Actions -->
        <div class="cmd-actions">
            <button class="btn btn-cmd" id="btnDiagnostic" onclick="Command.runDiagnostic()">
                <i class="fas fa-stethoscope"></i> Diagnóstico IA Global
            </button>
            <button class="btn btn-outline" onclick="Command.newDecision()">
                <i class="fas fa-plus"></i> Registrar Decisión
            </button>
            <button class="btn btn-outline" onclick="Command.exportState()">
                <i class="fas fa-file-arrow-down"></i> Exportar Estado
            </button>
        </div>

        <!-- Loader -->
        <div class="cmd-loader" id="cmdLoader">
            <div class="orbit-loader"></div>
            <span id="cmdLoaderText">Procesando...</span>
        </div>

        <!-- AI Output -->
        <div class="ai-output" id="aiOutput">
            <div class="section-tag" style="margin-bottom:10px;"><i class="fas fa-satellite"></i> Diagnóstico Ecosistémico</div>
            <div class="ai-output-text" id="aiOutputText"></div>
        </div>

        <!-- Modal -->
        <div class="modal-layer" id="modalLayer">
            <div class="modal-panel">
                <h3 id="mTitle">—</h3>
                <p id="mMsg">—</p>
                <div class="modal-foot">
                    <button class="btn btn-outline" onclick="Command.closeModal()">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    /* Dark mode */
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        document.documentElement.classList.toggle('dark', e.matches);
    });

    /* ====== Command Center Engine ====== */
    var Command = {
        state: {
            health: 94,
            modules: [
                {
                    id: 'auditor', name: 'AVIA Auditor', icon: 'fa-magnifying-glass-chart',
                    cls: 'auditor', status: 'Activo', badge: 'badge-active',
                    desc: 'Motor de auditoría AMS con scoring multidimensional y análisis IA.',
                    metric: { label: 'Última auditoría', value: '10/10' }
                },
                {
                    id: 'certifier', name: 'Generador de Certificaciones', icon: 'fa-certificate',
                    cls: 'cert', status: 'Activo', badge: 'badge-active',
                    desc: 'Auto-auditoría contra Protocolo Referente. Niveles Bronce→Platino.',
                    metric: { label: 'Certificados emitidos', value: '47' }
                },
                {
                    id: 'observatory', name: 'Observatorio de Adopción', icon: 'fa-satellite-dish',
                    cls: 'obs', status: 'Activo', badge: 'badge-active',
                    desc: 'Monitoreo post-publicación: adopción, lenguas, multiplicador.',
                    metric: { label: 'Factor multiplicador', value: '3.2x' }
                },
                {
                    id: 'carlos', name: 'Clon de Carlos', icon: 'fa-robot',
                    cls: 'carlos', status: 'Ready', badge: 'badge-ready',
                    desc: 'Orquestador AMS. Toma de decisiones, transiciones, gobernanza.',
                    metric: { label: 'Decisiones registradas', value: '23' }
                }
            ],
            healthStats: [
                { name: 'Uptime', value: '99.7%' },
                { name: 'Módulos', value: '4/4' },
                { name: 'Cert. activas', value: '47' },
                { name: 'Lenguas', value: '16' }
            ],
            decisions: [
                { time: '2026-Q3 · Sem 34', icon: 'milestone', text: '<strong>Observatorio activado.</strong> Monitoreo ecosistémico en producción.' },
                { time: '2026-Q2 · Sem 22', icon: 'transition', text: '<strong>Generador de Certificaciones</strong> publicado. Primeras 12 certificaciones Oro emitidas.' },
                { time: '2026-Q1 · Sem 8', icon: 'decision', text: '<strong>Decisión:</strong> Priorizar expansión lingüística antes de escalar adopción organizacional.' },
                { time: '2025-Q4 · Sem 48', icon: 'transition', text: '<strong>AMS v5.0 publicado.</strong> Transición de referente interno a protocolo abierto.' },
                { time: '2025-Q3 · Sem 38', icon: 'milestone', text: '<strong>CIMA SOSTENIDA.</strong> Score 10/10 mantenido durante 3 ciclos consecutivos.' },
                { time: '2025-Q2 · Sem 20', icon: 'decision', text: '<strong>Decisión:</strong> Activar Sprint 6 — Granularidad Afectiva como prioridad de cierre.' },
                { time: '2025-Q1 · Sem 4', icon: 'decision', text: '<strong>Decisión:</strong> Iniciar auditoría AVIA Nómada Acceso Universal. Score inicial: 6.8/10.' }
            ]
        },

        init: function() {
            this.renderConstellation();
            this.renderHealth();
            this.renderModules();
            this.renderDecisions();

            window.Poe.registerHandler('cmd-diagnostic-handler', function(result) {
                Command.handleDiagnostic(result);
            });
        },

        renderConstellation: function() {
            var svg = document.getElementById('constellationSvg');
            var nodes = [
                { id: 'hub', x: 400, y: 160, r: 24, color: 'var(--node-hub)', label: 'CONSTELACIÓN', sublabel: 'HUB CENTRAL' },
                { id: 'auditor', x: 160, y: 100, r: 18, color: 'var(--node-auditor)', label: 'AUDITOR', sublabel: '10/10' },
                { id: 'cert', x: 640, y: 100, r: 18, color: 'var(--node-cert)', label: 'CERTIFICADOR', sublabel: '47 EMITIDOS' },
                { id: 'obs', x: 640, y: 240, r: 18, color: 'var(--node-obs)', label: 'OBSERVATORIO', sublabel: 'ACTIVO' },
                { id: 'carlos', x: 160, y: 240, r: 18, color: 'var(--node-carlos)', label: 'CLON CARLOS', sublabel: 'ORQUESTADOR' }
            ];

            var edges = [
                { from: 'hub', to: 'auditor' },
                { from: 'hub', to: 'cert' },
                { from: 'hub', to: 'obs' },
                { from: 'hub', to: 'carlos' },
                { from: 'auditor', to: 'cert' },
                { from: 'cert', to: 'obs' },
                { from: 'carlos', to: 'auditor' },
                { from: 'carlos', to: 'obs' }
            ];

            var nodeMap = {};
            nodes.forEach(function(n) { nodeMap[n.id] = n; });

            var svgContent = '';

            // Edges
            edges.forEach(function(e) {
                var from = nodeMap[e.from];
                var to = nodeMap[e.to];
                svgContent += '<line class="edge-line" x1="' + from.x + '" y1="' + from.y + '" x2="' + to.x + '" y2="' + to.y + '" stroke="' + from.color + '"/>';
            });

            // Nodes
            nodes.forEach(function(n) {
                svgContent += '<g class="node-group" data-node="' + n.id + '">';
                svgContent += '<circle class="node-ring" cx="' + n.x + '" cy="' + n.y + '" r="' + (n.r + 8) + '" fill="none" stroke="' + n.color + '" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>';
                svgContent += '<circle class="node-core" cx="' + n.x + '" cy="' + n.y + '" r="' + n.r + '" fill="' + n.color + '" opacity="0.15"/>';
                svgContent += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + (n.r * 0.5) + '" fill="' + n.color + '"/>';
                svgContent += '<text class="node-label" x="' + n.x + '" y="' + (n.y + n.r + 18) + '">' + n.label + '</text>';
                svgContent += '<text class="node-status-label" x="' + n.x + '" y="' + (n.y + n.r + 30) + '">' + n.sublabel + '</text>';
                svgContent += '</g>';
            });

            svg.innerHTML = svgContent;
        },

        renderHealth: function() {
            var health = this.state.health;
            var circumference = 2 * Math.PI * 42;
            var offset = circumference - (health / 100) * circumference;

            setTimeout(function() {
                document.getElementById('healthRingFill').style.strokeDashoffset = offset;
                document.getElementById('healthNumber').textContent = health + '%';
            }, 400);

            var details = document.getElementById('healthDetails');
            details.innerHTML = this.state.healthStats.map(function(s) {
                return '<div class="health-stat">' +
                    '<div class="health-stat-val">' + s.value + '</div>' +
                    '<div class="health-stat-name">' + s.name + '</div>' +
                '</div>';
            }).join('');
        },

        renderModules: function() {
            var grid = document.getElementById('modulesGrid');
            grid.innerHTML = this.state.modules.map(function(mod) {
                return '<div class="module-card ' + mod.cls + '" onclick="Command.showModuleInfo(\'' + mod.id + '\')">' +
                    '<div class="module-icon-row">' +
                        '<div class="module-icon"><i class="fas ' + mod.icon + '"></i></div>' +
                        '<span class="module-status-badge ' + mod.badge + '">' + mod.status + '</span>' +
                    '</div>' +
                    '<div class="module-name">' + mod.name + '</div>' +
                    '<div class="module-desc">' + mod.desc + '</div>' +
                    '<div class="module-metric">' +
                        '<span class="module-metric-label">' + mod.metric.label + '</span>' +
                        '<span class="module-metric-value">' + mod.metric.value + '</span>' +
                    '</div>' +
                '</div>';
            }).join('');
        },

        renderDecisions: function() {
            var container = document.getElementById('logEntries');
            container.innerHTML = this.state.decisions.map(function(d) {
                return '<div class="log-entry">' +
                    '<div class="log-entry-icon ' + d.icon + '"><i class="fas ' +
                        (d.icon === 'decision' ? 'fa-gavel' : d.icon === 'transition' ? 'fa-arrow-right-arrow-left' : 'fa-flag') +
                    '"></i></div>' +
                    '<div class="log-entry-content">' +
                        '<div class="log-entry-time">' + d.time + '</div>' +
                        '<div class="log-entry-text">' + d.text + '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        },

        showModuleInfo: function(moduleId) {
            var mod = this.state.modules.find(function(m) { return m.id === moduleId; });
            if (mod) {
                this.showModal(mod.name, mod.desc + '\n\nEstado: ' + mod.status + ' | ' + mod.metric.label + ': ' + mod.metric.value);
            }
        },

        runDiagnostic: function() {
            var btn = document.getElementById('btnDiagnostic');
            btn.disabled = true;
            var loader = document.getElementById('cmdLoader');
            loader.classList.add('visible');
            document.getElementById('cmdLoaderText').textContent = 'Clon de Carlos ejecutando diagnóstico ecosistémico...';

            var output = document.getElementById('aiOutput');
            output.classList.add('visible');
            document.getElementById('aiOutputText').textContent = '';

            var mods = this.state.modules;
            var stats = this.state.healthStats;
            var lastDecisions = this.state.decisions.slice(0, 3);

            var prompt = 'Eres "Clon de Carlos", el orquestador del ecosistema AVIA dentro de SiestaOTTOS.\n' +
                'Tu rol: generar un diagnóstico ejecutivo del Centro de Comando Integrado "Constelación AVIA".\n\n' +
                'ESTADO ACTUAL:\n' +
                '- Salud global: ' + this.state.health + '%\n' +
                '- Módulos activos: ' + mods.map(function(m) { return m.name + ' (' + m.status + ')'; }).join(', ') + '\n' +
                '- Stats: ' + stats.map(function(s) { return s.name + ': ' + s.value; }).join(' | ') + '\n' +
                '- Métricas clave: Auditor 10/10, Certificados 47, Multiplicador 3.2x\n' +
                '- Últimas decisiones:\n' + lastDecisions.map(function(d) { return '  [' + d.time + '] ' + d.text.replace(/<[^>]+>/g, ''); }).join('\n') + '\n\n' +
                'Genera un DIAGNÓSTICO EJECUTIVO que incluya:\n' +
                '1. PULSO ECOSISTÉMICO: Estado general en 2 líneas\n' +
                '2. MÓDULOS: Evaluación rápida de cada uno (1 línea c/u)\n' +
                '3. COHERENCIA SISTÉMICA: Si los módulos trabajan bien juntos\n' +
                '4. PRÓXIMA DECISIÓN RECOMENDADA: Qué debería hacer Carlos ahora\n' +
                '5. VECTOR DE EVOLUCIÓN: Hacia dónde apunta el ecosistema\n\n' +
                'Tono: ejecutivo, directo, con personalidad. Máx 300 palabras. Español.';

            window.Poe.sendUserMessage('@Claude-Sonnet-4.6 ' + prompt, {
                handler: 'cmd-diagnostic-handler',
                stream: true,
                openChat: false,
                parameters: {}
            }).catch(function(err) {
                loader.classList.remove('visible');
                btn.disabled = false;
                document.getElementById('aiOutputText').textContent = 'Error: ' + err.message;
            });
        },

        handleDiagnostic: function(result) {
            var msg = result.responses[0];
            var textEl = document.getElementById('aiOutputText');
            var loader = document.getElementById('cmdLoader');
            var btn = document.getElementById('btnDiagnostic');

            if (msg.status === 'error') {
                textEl.textContent = 'Error: ' + (msg.statusText || 'desconocido');
                loader.classList.remove('visible');
                btn.disabled = false;
            } else if (msg.status === 'incomplete') {
                textEl.textContent = msg.content;
            } else if (msg.status === 'complete') {
                textEl.textContent = msg.content;
                loader.classList.remove('visible');
                btn.disabled = false;
            }
        },

        newDecision: function() {
            var now = new Date();
            var q = 'Q' + (Math.ceil((now.getMonth() + 1) / 3));
            var week = Math.ceil((now.getDate() + new Date(now.getFullYear(), now.getMonth(), 1).getDay()) / 7);
            var timeStr = now.getFullYear() + '-' + q + ' \u00B7 Sem ' + (Math.ceil((now.getMonth() * 4.33) + week));

            var entry = {
                time: timeStr,
                icon: 'decision',
                text: '<strong>Decisión:</strong> Diagnóstico ecosistémico solicitado. Evaluación de coherencia sistémica en curso.'
            };

            this.state.decisions.unshift(entry);
            this.renderDecisions();
            this.showModal('Decisión registrada', 'Se ha añadido una nueva entrada al historial del Clon de Carlos. El registro de decisiones permite trazar la evolución del ecosistema.');
        },

        exportState: function() {
            var state = this.state;
            var now = new Date();
            var analysis = document.getElementById('aiOutputText').textContent;

            var report = '================================================================\n' +
                '  CONSTELACION AVIA - CENTRO DE COMANDO INTEGRADO\n' +
                '  Estado del Ecosistema · ' + now.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' }) + '\n' +
                '================================================================\n\n' +
                '[ SALUD GLOBAL: ' + state.health + '% ]\n\n' +
                '[ MODULOS ]\n';

            state.modules.forEach(function(m) {
                report += '  ' + m.name + '\n';
                report += '    Estado: ' + m.status + ' | ' + m.metric.label + ': ' + m.metric.value + '\n';
                report += '    ' + m.desc + '\n\n';
            });

            report += '[ ESTADISTICAS ]\n';
            state.healthStats.forEach(function(s) {
                report += '  ' + s.name + ': ' + s.value + '\n';
            });

            report += '\n[ HISTORIAL DE DECISIONES (Clon de Carlos) ]\n';
            state.decisions.forEach(function(d) {
                report += '  [' + d.time + '] ' + d.text.replace(/<[^>]+>/g, '') + '\n';
            });

            if (analysis) {
                report += '\n[ DIAGNOSTICO IA ]\n' + analysis + '\n';
            }

            report += '\n================================================================\n' +
                '  Generado por Constelacion AVIA · SiestaOTTOS\n' +
                '  AMS v5.0 Protocolo Referente · Inteligencia Viva\n' +
                '================================================================';

            var blob = new Blob([report], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'Constelacion_AVIA_' + now.toISOString().slice(0, 10) + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        },

        showModal: function(title, message) {
            document.getElementById('mTitle').textContent = title;
            document.getElementById('mMsg').textContent = message;
            document.getElementById('modalLayer').classList.add('visible');
        },

        closeModal: function() {
            document.getElementById('modalLayer').classList.remove('visible');
        }
    };

    /* Initialize */
    document.addEventListener('DOMContentLoaded', function() {
        Command.init();
    });
    </script>
</body>
</html>
