<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Senior v3.2 - Plataforma Educativa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --success: #10B981;
            --warning: #F59E0B;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-600: #4B5563;
            --gray-800: #1F2937;
            --gray-900: #111827;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            color: var(--gray-900);
            font-size: 28px;
            font-weight: 700;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .user-name {
            font-weight: 600;
            color: var(--gray-900);
        }

        /* Stats Bar */
        .stats-bar {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            background: var(--gray-50);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            color: var(--gray-600);
            font-size: 14px;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
        }

        /* Sidebar */
        .sidebar {
            background: white;
            border-radius: 16px;
            padding: 24px;
            height: fit-content;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--gray-900);
        }

        .category {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            color: var(--gray-600);
        }

        .category:hover {
            background: var(--gray-100);
        }

        .category.active {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .category-icon {
            width: 20px;
            height: 20px;
        }

        /* Lessons Grid */
        .lessons-section {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .section-header {
            margin-bottom: 24px;
        }

        .section-header h2 {
            font-size: 24px;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .section-subtitle {
            color: var(--gray-600);
            font-size: 15px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        /* Lesson Card */
        .lesson-card {
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .lesson-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.2);
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
        }

        .lesson-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-completed {
            background: #D1FAE5;
            color: #065F46;
        }

        .badge-in-progress {
            background: #FEF3C7;
            color: #92400E;
        }

        .badge-new {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .lesson-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .lesson-description {
            color: var(--gray-600);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .lesson-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--gray-600);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--gray-200);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), #34D399);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .lesson-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: var(--gray-200);
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--gray-300);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: 2;
            }

            .lessons-section {
                order: 1;
            }

            .lessons-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🎓 AVIA Senior v3.2</h1>
            <div class="user-info">
                <div class="avatar">MC</div>
                <div>
                    <div class="user-name">María Carmen</div>
                    <div style="font-size: 13px; color: var(--gray-600);">Nivel Intermedio</div>
                </div>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value">12</div>
                <div class="stat-label">Lecciones Completadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">3</div>
                <div class="stat-label">En Progreso</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">85%</div>
                <div class="stat-label">Tasa de Éxito</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">24h</div>
                <div class="stat-label">Tiempo Total</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Sidebar -->
            <aside class="sidebar">
                <h2>Categorías</h2>
                <div class="category active" data-category="all">
                    <span class="category-icon">📚</span>
                    Todas
                </div>
                <div class="category" data-category="tecnologia">
                    <span class="category-icon">💻</span>
                    Tecnología
                </div>
                <div class="category" data-category="salud">
                    <span class="category-icon">🏥</span>
                    Salud
                </div>
                <div class="category" data-category="finanzas">
                    <span class="category-icon">💰</span>
                    Finanzas
                </div>
                <div class="category" data-category="comunicacion">
                    <span class="category-icon">📱</span>
                    Comunicación
                </div>
            </aside>

            <!-- Lessons Section -->
            <section class="lessons-section">
                <div class="section-header">
                    <h2>Tus Lecciones</h2>
                    <p class="section-subtitle">Continúa aprendiendo a tu ritmo</p>
                </div>

                <div class="lessons-grid" id="lessonsGrid">
                    <!-- Lessons will be injected by JavaScript -->
                </div>
            </section>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="lessonModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // Mock Data
        const lessons = [
            {
                id: 1,
                title: "Uso de WhatsApp",
                description: "Aprende a enviar mensajes, fotos y realizar videollamadas con tus seres queridos.",
                category: "comunicacion",
                duration: "45 min",
                difficulty: "Básico",
                progress: 100,
                status: "completed"
            },
            {
                id: 2,
                title: "Seguridad en Internet",
                description: "Protege tu información personal y detecta fraudes online.",
                category: "tecnologia",
                duration: "60 min",
                difficulty: "Intermedio",
                progress: 65,
                status: "in-progress"
            },
            {
                id: 3,
                title: "Banca Digital",
                description: "Realiza transferencias y consulta tu saldo desde tu móvil de forma segura.",
                category: "finanzas",
                duration: "50 min",
                difficulty: "Intermedio",
                progress: 30,
                status: "in-progress"
            },
            {
                id: 4,
                title: "Ejercicios para la Memoria",
                description: "Técnicas y actividades para mantener tu mente activa y saludable.",
                category: "salud",
                duration: "40 min",
                difficulty: "Básico",
                progress: 0,
                status: "new"
            },
            {
                id: 5,
                title: "Google Maps",
                description: "Aprende a usar el GPS, buscar direcciones y planificar tus viajes.",
                category: "tecnologia",
                duration: "35 min",
                difficulty: "Básico",
                progress: 100,
                status: "completed"
            },
            {
                id: 6,
                title: "Videollamadas por Zoom",
                description: "Participa en reuniones virtuales con amigos y familia.",
                category: "comunicacion",
                duration: "55 min",
                difficulty: "Intermedio",
                progress: 0,
                status: "new"
            }
        ];

        let currentCategory = 'all';

        function renderLessons(category = 'all') {
            const grid = document.getElementById('lessonsGrid');
            const filtered = category === 'all' 
                ? lessons 
                : lessons.filter(l => l.category === category);

            grid.innerHTML = filtered.map(lesson => `
                <div class="lesson-card" onclick="openLesson(${lesson.id})">
                    <div class="lesson-header">
                        <span class="lesson-badge badge-${lesson.status}">
                            ${lesson.status === 'completed' ? '✓ Completado' : 
                              lesson.status === 'in-progress' ? '⏳ En Progreso' : 
                              '🆕 Nuevo'}
                        </span>
                    </div>
                    <h3 class="lesson-title">${lesson.title}</h3>
                    <p class="lesson-description">${lesson.description}</p>
                    <div class="lesson-meta">
                        <div class="meta-item">
                            <span>⏱️</span>
                            <span>${lesson.duration}</span>
                        </div>
                        <div class="meta-item">
                            <span>📊</span>
                            <span>${lesson.difficulty}</span>
                        </div>
                    </div>
                    ${lesson.progress > 0 ? `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${lesson.progress}%"></div>
                        </div>
                    ` : ''}
                    <div class="lesson-footer">
                        <span style="font-size: 13px; color: var(--gray-600);">
                            ${lesson.progress}% completado
                        </span>
                        <button class="btn ${lesson.status === 'completed' ? 'btn-outline' : 'btn-primary'}">
                            ${lesson.status === 'completed' ? 'Repasar' : 
                              lesson.status === 'in-progress' ? 'Continuar' : 
                              'Comenzar'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openLesson(id) {
            const lesson = lessons.find(l => l.id === id);
            const modal = document.getElementById('lessonModal');
            const content = document.getElementById('modalContent');
            
            content.innerHTML = `
                <h2 style="margin-bottom: 16px; color: var(--gray-900);">${lesson.title}</h2>
                <p style="color: var(--gray-600); margin-bottom: 24px; line-height: 1.6;">
                    ${lesson.description}
                </p>
                <div style="background: var(--gray-50); padding: 20px; border-radius: 12px; margin-bottom: 24px;">
                    <h3 style="font-size: 16px; margin-bottom: 12px;">Detalles del Curso</h3>
                    <p><strong>Duración:</strong> ${lesson.duration}</p>
                    <p><strong>Dificultad:</strong> ${lesson.difficulty}</p>
                    <p><strong>Progreso:</strong> ${lesson.progress}%</p>
                </div>
                <div style="background: #EEF2FF; padding: 20px; border-radius: 12px; border-left: 4px solid var(--primary); margin-bottom: 24px;">
                    <p style="margin: 0; color: var(--gray-700);">
                        💡 <strong>Consejo:</strong> Tómate tu tiempo y repite las secciones las veces que necesites. 
                        El aprendizaje es un proceso personal.
                    </p>
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="startLesson(${id})">
                    ${lesson.status === 'completed' ? 'Repasar Lección' : 
                      lesson.status === 'in-progress' ? 'Continuar Lección' : 
                      'Comenzar Lección'}
                </button>
            `;
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('lessonModal').classList.remove('active');
        }

        function startLesson(id) {
            alert(`Iniciando lección ${id}... [HIPÓTESIS: Integrar con sistema de contenidos real]`);
            closeModal();
        }

        // Category Filter
        document.querySelectorAll('.category').forEach(cat => {
            cat.addEventListener('click', function() {
                document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderLessons(currentCategory);
            });
        });

        // Close modal on outside click
        document.getElementById('lessonModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Initialize
        renderLessons();
    </script>
</body>
</html>
