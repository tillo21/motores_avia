<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Incidencias CEISH - AVIA Senior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-red { animation: pulseRed 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .severity-critical { border-left: 4px solid #DC2626; }
        .severity-high { border-left: 4px solid #EA580C; }
        .severity-medium { border-left: 4px solid #F59E0B; }
        .severity-low { border-left: 4px solid #3B82F6; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="container mx-auto p-4 max-w-7xl">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-red-600 via-orange-600 to-yellow-600 text-white rounded-xl p-8 mb-6 shadow-2xl">
            <div class="flex justify-between items-center flex-wrap gap-4">
                <div>
                    <h1 class="text-4xl font-bold mb-2">🚨 Gestión de Incidencias CEISH</h1>
                    <p class="text-red-100">Sistema de Brechas | Art. 33-34 RGPD | Notificación 72h</p>
                    <div class="flex gap-3 mt-3">
                        <span class="bg-white bg-opacity-20 px-3 py-1 rounded text-sm">
                            ⏱️ Última actualización: <span id="lastUpdate">--:--</span>
                        </span>
                        <span class="bg-white bg-opacity-20 px-3 py-1 rounded text-sm">
                            📅 <span id="currentDate">--</span>
                        </span>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="bg-white bg-opacity-20 rounded-lg px-4 py-2 text-center">
                        <div class="text-sm opacity-90">Incidencias Activas</div>
                        <div class="text-3xl font-bold" id="activeIncidents">0</div>
                    </div>
                    <div class="bg-white bg-opacity-20 rounded-lg px-4 py-2 text-center">
                        <div class="text-sm opacity-90">Críticas (72h)</div>
                        <div class="text-3xl font-bold pulse-red" id="criticalIncidents">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel de Creación Rápida -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span>➕</span> Registrar Nueva Incidencia
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Incidencia</label>
                    <select id="incidentType" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-red-500">
                        <option value="">Seleccionar...</option>
                        <option value="breach">🔓 Brecha de Seguridad</option>
                        <option value="unauthorized">🚫 Acceso No Autorizado</option>
                        <option value="loss">📉 Pérdida de Datos</option>
                        <option value="leak">💧 Filtración de Información</option>
                        <option value="consent">❌ Violación de Consentimiento</option>
                        <option value="retention">📅 Incumplimiento Retención</option>
                        <option value="other">❓ Otro</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Severidad</label>
                    <select id="severity" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-red-500">
                        <option value="low">🟢 Baja</option>
                        <option value="medium">🟡 Media</option>
                        <option value="high">🟠 Alta</option>
                        <option value="critical">🔴 Crítica (Notif. 72h)</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Afectados Estimados</label>
                    <input type="number" id="affectedCount" value="1" min="1" 
                           class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-red-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Detección</label>
                    <input type="datetime-local" id="detectionDate" 
                           class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-red-500">
                </div>
            </div>
            
            <div class="mt-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Descripción de la Incidencia</label>
                <textarea id="description" rows="3" placeholder="Describa el incidente, datos afectados, alcance..."
                          class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-red-500"></textarea>
            </div>
            
            <div class="mt-4 flex gap-3">
                <button onclick="createIncident()" 
                        class="bg-red-600 text-white px-6 py-3 rounded-lg hover:bg-red-700 font-semibold shadow-lg">
                    🚨 Registrar Incidencia
                </button>
                <button onclick="clearForm()" 
                        class="bg-gray-300 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-400 font-semibold">
                    🗑️ Limpiar
                </button>
            </div>
        </div>

        <!-- Filtros y Búsqueda -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-64">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Buscar</label>
                    <input type="text" id="searchIncident" placeholder="ID, descripción..." 
                           oninput="filterIncidents()"
                           class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                    <select id="filterStatus" onchange="filterIncidents()" 
                            class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                        <option value="all">Todos</option>
                        <option value="open">Abiertos</option>
                        <option value="investigating">En Investigación</option>
                        <option value="notified">Notificado</option>
                        <option value="resolved">Resuelto</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Severidad</label>
                    <select id="filterSeverity" onchange="filterIncidents()" 
                            class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                        <option value="all">Todas</option>
                        <option value="critical">Crítica</option>
                        <option value="high">Alta</option>
                        <option value="medium">Media</option>
                        <option value="low">Baja</option>
                    </select>
                </div>
                <button onclick="exportIncidents()" 
                        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-semibold">
                    📥 Exportar CSV
                </button>
            </div>
        </div>

        <!-- Lista de Incidencias -->
        <div id="incidentsList" class="space-y-4">
            <div class="text-center text-gray-400 py-12 bg-white rounded-xl">
                <svg class="w-16 h-16 mx-auto mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <p>No hay incidencias registradas</p>
            </div>
        </div>

        <!-- Modal de Detalle -->
        <div id="detailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full max-h-screen overflow-y-auto">
                <div class="p-6">
                    <div class="flex justify-between items-start mb-6">
                        <h2 class="text-2xl font-bold text-gray-800" id="modalTitle">Detalle de Incidencia</h2>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <div id="modalContent"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 🔒 ALMACENAMIENTO IN-MEMORY (Regla #001 CEISH)
        let incidents = [];
        let incidentCounter = 1;

        function updateDateTime() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('es-ES');
            document.getElementById('currentDate').textContent = now.toLocaleDateString('es-ES', { 
                day: 'numeric', month: 'long', year: 'numeric'
            });
            
            // Auto-set fecha detección
            const dateInput = document.getElementById('detectionDate');
            if (!dateInput.value) {
                dateInput.value = now.toISOString().slice(0, 16);
            }
        }

        function updateStats() {
            const active = incidents.filter(i => i.status !== 'resolved').length;
            const critical = incidents.filter(i => i.severity === 'critical' && i.status !== 'resolved').length;
            
            document.getElementById('activeIncidents').textContent = active;
            document.getElementById('criticalIncidents').textContent = critical;
        }

        function getSeverityColor(severity) {
            const colors = {
                critical: { bg: 'bg-red-100', text: 'text-red-700', border: 'border-red-300', icon: '🔴' },
                high: { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-300', icon: '🟠' },
                medium: { bg: 'bg-yellow-100', text: 'text-yellow-700', border: 'border-yellow-300', icon: '🟡' },
                low: { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-300', icon: '🟢' }
            };
            return colors[severity] || colors.low;
        }

        function getStatusBadge(status) {
            const badges = {
                open: '<span class="px-2 py-1 bg-red-100 text-red-700 rounded text-xs font-semibold">🔴 ABIERTO</span>',
                investigating: '<span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded text-xs font-semibold">🔍 INVESTIGANDO</span>',
                notified: '<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs font-semibold">📢 NOTIFICADO</span>',
                resolved: '<span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-semibold">✅ RESUELTO</span>'
            };
            return badges[status] || badges.open;
        }

        function calculateDeadline(detectionDate, severity) {
            if (severity !== 'critical') return null;
            const deadline = new Date(detectionDate);
            deadline.setHours(deadline.getHours() + 72);
            return deadline;
        }

        function getTimeRemaining(deadline) {
            if (!deadline) return null;
            const now = new Date();
            const diff = deadline - now;
            
            if (diff < 0) return { expired: true, text: '⏰ PLAZO EXPIRADO' };
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if (hours < 24) {
                return { expired: false, urgent: true, text: `⚠️ ${hours}h ${minutes}m restantes` };
            }
            return { expired: false, urgent: false, text: `🕐 ${hours}h restantes` };
        }

        function createIncident() {
            const type = document.getElementById('incidentType').value;
            const severity = document.getElementById('severity').value;
            const affectedCount = parseInt(document.getElementById('affectedCount').value);
            const detectionDate = document.getElementById('detectionDate').value;
            const description = document.getElementById('description').value;

            if (!type || !description || !detectionDate) {
                alert('⚠️ Por favor, completa todos los campos obligatorios');
                return;
            }

            const incident = {
                id: `INC-${String(incidentCounter).padStart(4, '0')}`,
                type,
                severity,
                affectedCount,
                detectionDate: new Date(detectionDate).toISOString(),
                description,
                status: 'open',
                createdAt: new Date().toISOString(),
                deadline: calculateDeadline(detectionDate, severity),
                timeline: [
                    {
                        timestamp: new Date().toISOString(),
                        action: 'Incidencia registrada',
                        user: 'Sistema AVIA',
                        notes: 'Registro inicial de incidencia CEISH'
                    }
                ]
            };

            incidents.unshift(incident);
            incidentCounter++;
            
            updateStats();
            renderIncidents();
            clearForm();
            
            if (severity === 'critical') {
                alert('🚨 INCIDENCIA CRÍTICA\n\nRecuerda: Notificación obligatoria a la AEPD en 72 horas (Art. 33 RGPD)');
            }
        }

        function renderIncidents() {
            const container = document.getElementById('incidentsList');
            
            if (incidents.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-12 bg-white rounded-xl">
                        <svg class="w-16 h-16 mx-auto mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <p>No hay incidencias registradas</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = incidents.map(inc => {
                const colors = getSeverityColor(inc.severity);
                const timeRemaining = getTimeRemaining(inc.deadline);
                
                return `
                    <div class="fade-in bg-white rounded-xl shadow-lg p-6 severity-${inc.severity}">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <h3 class="text-xl font-bold text-gray-800">${inc.id}</h3>
                                    ${getStatusBadge(inc.status)}
                                    <span class="px-2 py-1 ${colors.bg} ${colors.text} rounded text-xs font-semibold">
                                        ${colors.icon} ${inc.severity.toUpperCase()}
                                    </span>
                                </div>
                                <div class="text-sm text-gray-600 mb-3">
                                    📅 ${new Date(inc.detectionDate).toLocaleString('es-ES')} | 
                                    👥 ${inc.affectedCount} afectado${inc.affectedCount > 1 ? 's' : ''}
                                </div>
                                <p class="text-gray-700">${inc.description}</p>
                            </div>
                            <button onclick="viewIncident('${inc.id}')" 
                                    class="ml-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm font-semibold">
                                Ver Detalle
                            </button>
                        </div>
                        
                        ${timeRemaining ? `
                            <div class="mt-4 p-3 rounded ${timeRemaining.expired ? 'bg-red-100 border border-red-300' : timeRemaining.urgent ? 'bg-orange-100 border border-orange-300' : 'bg-blue-100 border border-blue-300'}">
                                <div class="flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
                                    </svg>
                                    <span class="font-semibold text-sm">${timeRemaining.text}</span>
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="mt-4 flex gap-2">
                            ${inc.status === 'open' ? `
                                <button onclick="updateStatus('${inc.id}', 'investigating')" 
                                        class="text-sm bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">
                                    🔍 Investigar
                                </button>
                            ` : ''}
                            ${inc.status === 'investigating' ? `
                                <button onclick="updateStatus('${inc.id}', 'notified')" 
                                        class="text-sm bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">
                                    📢 Notificar AEPD
                                </button>
                            ` : ''}
                            ${inc.status !== 'resolved' ? `
                                <button onclick="updateStatus('${inc.id}', 'resolved')" 
                                        class="text-sm bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">
                                    ✅ Resolver
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function viewIncident(id) {
            const incident = incidents.find(i => i.id === id);
            if (!incident) return;

            const colors = getSeverityColor(incident.severity);
            const timeRemaining = getTimeRemaining(incident.deadline);

            document.getElementById('modalTitle').textContent = incident.id;
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <div class="text-sm text-gray-600 mb-1">Estado</div>
                            ${getStatusBadge(incident.status)}
                        </div>
                        <div>
                            <div class="text-sm text-gray-600 mb-1">Severidad</div>
                            <span class="px-2 py-1 ${colors.bg} ${colors.text} rounded text-xs font-semibold">
                                ${colors.icon} ${incident.severity.toUpperCase()}
                            </span>
                        </div>
                        <div>
                            <div class="text-sm text-gray-600 mb-1">Afectados</div>
                            <div class="font-semibold">${incident.affectedCount} persona${incident.affectedCount > 1 ? 's' : ''}</div>
                        </div>
                        <div>
                            <div class="text-sm text-gray-600 mb-1">Detección</div>
                            <div class="text-sm">${new Date(incident.detectionDate).toLocaleString('es-ES')}</div>
                        </div>
                    </div>

                    ${timeRemaining ? `
                        <div class="p-4 rounded ${timeRemaining.expired ? 'bg-red-50 border border-red-200' : 'bg-yellow-50 border border-yellow-200'}">
                            <div class="font-semibold mb-1">Plazo Notificación Art. 33 RGPD</div>
                            <div class="text-sm">${timeRemaining.text}</div>
                            ${timeRemaining.expired ? '<div class="text-xs text-red-600 mt-2">⚠️ Incumplimiento normativo: Notificación fuera de plazo</div>' : ''}
                        </div>
                    ` : ''}

                    <div>
                        <div class="text-sm font-semibold text-gray-700 mb-2">Descripción</div>
                        <div class="bg-gray-50 p-4 rounded">${incident.description}</div>
                    </div>

                    <div>
                        <div class="text-sm font-semibold text-gray-700 mb-2">Timeline de Acciones</div>
                        <div class="space-y-2">
                            ${incident.timeline.map(event => `
                                <div class="flex gap-3 p-3 bg-gray-50 rounded">
                                    <div class="text-2xl">📝</div>
                                    <div class="flex-1">
                                        <div class="font-semibold text-sm">${event.action}</div>
                                        <div class="text-xs text-gray-600">${new Date(event.timestamp).toLocaleString('es-ES')} | ${event.user}</div>
                                        ${event.notes ? `<div class="text-xs text-gray-600 mt-1">${event.notes}</div>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function updateStatus(id, newStatus) {
            const incident = incidents.find(i => i.id === id);
            if (!incident) return;

            const statusActions = {
                investigating: 'Inicio de investigación',
                notified: 'Notificación enviada a AEPD',
                resolved: 'Incidencia resuelta'
            };

            incident.status = newStatus;
            incident.timeline.push({
                timestamp: new Date().toISOString(),
                action: statusActions[newStatus],
                user: 'AVIA-Clon-Carlos',
                notes: `Estado actualizado a: ${newStatus}`
            });

            updateStats();
            renderIncidents();
        }

        function filterIncidents() {
            const search = document.getElementById('searchIncident').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            const severityFilter = document.getElementById('filterSeverity').value;

            const filtered = incidents.filter(inc => {
                const matchSearch = !search || inc.id.toLowerCase().includes(search) || inc.description.toLowerCase().includes(search);
                const matchStatus = statusFilter === 'all' || inc.status === statusFilter;
                const matchSeverity = severityFilter === 'all' || inc.severity === severityFilter;
                return matchSearch && matchStatus && matchSeverity;
            });

            // Render filtered
            const container = document.getElementById('incidentsList');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-12 bg-white rounded-xl">No se encontraron incidencias</div>';
            } else {
                incidents = filtered;
                renderIncidents();
                incidents = [...filtered];
            }
        }

        function exportIncidents() {
            if (incidents.length === 0) {
                alert('⚠️ No hay incidencias para exportar');
                return;
            }

            let csv = 'ID,Tipo,Severidad,Afectados,Estado,Fecha_Deteccion,Descripcion\n';
            incidents.forEach(inc => {
                csv += `${inc.id},${inc.type},${inc.severity},${inc.affectedCount},${inc.status},${inc.detectionDate},"${inc.description.replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ceish_incidencias_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearForm() {
            document.getElementById('incidentType').value = '';
            document.getElementById('severity').value = 'low';
            document.getElementById('affectedCount').value = '1';
            document.getElementById('description').value = '';
            document.getElementById('detectionDate').value = '';
            updateDateTime();
        }

        // Init
        updateDateTime();
        setInterval(updateDateTime, 1000);
        updateStats();
    </script>

</body>
</html>
