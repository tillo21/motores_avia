function calc(){
    var td=0,tp=0,mok=0,mpr=0,mof=0,loc=0;
    MODS.forEach(function(m){
        td+=m.hecho.length; tp+=m.pend.length; loc+=m.loc;
        if(m.estado==="ok") mok++;
        else if(m.estado==="prog") mpr++;
        else mof++;
    });
    var rs=0,rp=0;
    REGLAS.forEach(function(r){ if(r.c==="s") rs++; else rp++; });
    return{tm:MODS.length,mok:mok,mpr:mpr,mof:mof,td:td,tp:tp,pg:P.progreso_real,loc:loc,rs:rs,rp:rp};
}

function stb(s){
    var m={
        "ok":'<span class="b b-ok"><i class="fa-solid fa-check"></i> Completo</span>',
        "prog":'<span class="b b-prog"><i class="fa-solid fa-spinner"></i> En progreso</span>',
        "warn":'<span class="b b-warn"><i class="fa-solid fa-exclamation"></i> Parcial</span>',
        "bloq":'<span class="b b-err"><i class="fa-solid fa-ban"></i> Bloqueado</span>',
        "off":'<span class="b b-off"><i class="fa-solid fa-minus"></i> No iniciado</span>',
        "agotado":'<span class="b b-red"><i class="fa-solid fa-battery-empty"></i> Agotado</span>',
        "activo":'<span class="b b-ok"><i class="fa-solid fa-circle"></i> Activo</span>'
    };
    return m[s]||m["off"];
}
function pclr(p){ return p>=90?"var(--emerald)":p>=50?"var(--blue)":p>0?"var(--amber)":"var(--t3)"; }
function ring(p){
    var r=28,c=Math.PI*2*r,o=c-(p/100)*c;
    var cl=p>=60?"var(--emerald)":p>=30?"var(--amber)":"var(--red)";
    return '<div class="ring"><svg viewBox="0 0 72 72"><circle class="rb" cx="36" cy="36" r="'+r+'"/><circle class="rf" cx="36" cy="36" r="'+r+'" stroke="'+cl+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+o+'"/></svg><div class="rl" style="color:'+cl+'">'+p+'%</div></div>';
}
function kpi(v,l,s,cl){ return '<div class="kpi"><div class="v" style="color:'+cl+'">'+v+'</div><div class="l">'+l+'</div><div class="s">'+s+'</div></div>'; }

    var es=[[0,1],[0,2],[1,3],[1,4],[1,5],[2,6],[2,7],[2,8],[0,9],[0,10],[0,11],[11,12],[11,13],[11,14],[3,4],[4,5],[6,7],[7,8],[9,10],[12,14]];
    es.forEach(function(e){
        var a=ns[e[0]],b=ns[e[1]];
        x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);
        x.strokeStyle=lt?"rgba(0,0,0,.07)":"rgba(255,255,255,.06)";x.lineWidth=1;x.stroke();
    });
    ns.forEach(function(n){
        x.beginPath();x.arc(n.x,n.y,n.r+5,0,Math.PI*2);x.fillStyle=n.c+"15";x.fill();
        x.beginPath();x.arc(n.x,n.y,n.r,0,Math.PI*2);x.fillStyle=n.c+"28";x.fill();
        x.strokeStyle=n.c;x.lineWidth=1.5;x.stroke();
        x.beginPath();x.arc(n.x,n.y,2.5,0,Math.PI*2);x.fillStyle=n.c;x.fill();
        x.font="500 "+(n.t?"10":"8")+"px Manrope,sans-serif";
        x.fillStyle=lt?"#18140f":"#eaf0fa";x.textAlign="center";
        x.fillText(n.l,n.x,n.y+n.r+12);
    });
}

/* ══════════════════════════════════════════════════════════════════════
   AVIA BotRouter — Regla XI
   ══════════════════════════════════════════════════════════════════════ */
var BotRouter={
    NIVELES:{eco:["Grok-4.1-Fast-Non-Reasoning","Gemini-3-Flash"],med:["Claude-Sonnet-4.6","Gemini-3.1-Pro"],pro:["Claude-Opus-4.6","GPT-5.4-Pro"]},
    LIM:50000,log:[],
    sel:function(t){var m={simple:"eco",formato:"eco",codigo:"med",analisis:"med",json:"med",inv:"pro",audit:"pro"};return this.NIVELES[m[t]||"eco"][0];},
    cadena:function(t){
        var b=this.sel(t),c=[b],all=["Claude-Sonnet-4.6","Gemini-3-Flash","Grok-4.1-Fast-Non-Reasoning"];
        var i=all.indexOf(b);
        for(var j=i+1;j<all.length;j++){if(c.indexOf(all[j])===-1) c.push(all[j]);}
        if(c.indexOf("Grok-4.1-Fast-Non-Reasoning")===-1) c.push("Grok-4.1-Fast-Non-Reasoning");
        return c;
    },
    trunc:function(t){var e=Math.ceil(t.length/4);return e>this.LIM?t.slice(0,this.LIM*4):t;},
    send:async function(prompt,tipo,opts){
        if(!window.Poe) throw new Error("Poe API no disponible");
        var ch=this.cadena(tipo),txt=this.trunc(prompt),err=null;
        for(var i=0;i<ch.length;i++){
            try{
                var r=await window.Poe.sendUserMessage("@"+ch[i]+" "+txt,Object.assign({openChat:false,stream:false,parameters:{}},opts||{}));
                this.log.push({t:new Date().toISOString(),bot:ch[i],ok:true});return r;
            }catch(e2){
                err=e2;this.log.push({t:new Date().toISOString(),bot:ch[i],ok:false,e:e2.message||String(e2)});
            }
        }
        throw err;
    }
};
window.BotRouter=BotRouter;
