<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA-Auditor · ControlNextMedia</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0c0f14;
            --bg-secondary: #141820;
            --bg-card: #1a1f2b;
            --bg-card-hover: #212838;
            --bg-elevated: #252d3a;
            --border: #2a3244;
            --border-accent: #3a4560;
            --text-primary: #e8ecf4;
            --text-secondary: #8a95aa;
            --text-muted: #5a6578;
            --accent-gold: #d4a853;
            --accent-gold-dim: rgba(212, 168, 83, 0.15);
            --accent-emerald: #34d399;
            --accent-emerald-dim: rgba(52, 211, 153, 0.12);
            --accent-blue: #60a5fa;
            --accent-blue-dim: rgba(96, 165, 250, 0.12);
            --accent-violet: #a78bfa;
            --accent-violet-dim: rgba(167, 139, 250, 0.12);
            --accent-rose: #fb7185;
            --accent-rose-dim: rgba(251, 113, 133, 0.12);
            --accent-amber: #fbbf24;
            --accent-amber-dim: rgba(251, 191, 36, 0.12);
            --accent-cyan: #22d3ee;
            --accent-cyan-dim: rgba(34, 211, 238, 0.12);
            --status-done: #34d399;
            --status-progress: #60a5fa;
            --status-pending: #fbbf24;
            --status-blocked: #fb7185;
            --status-not-started: #5a6578;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        html.light {
            --bg-primary: #f4f1ec;
            --bg-secondary: #eae6df;
            --bg-card: #ffffff;
            --bg-card-hover: #f9f7f4;
            --bg-elevated: #f0ede7;
            --border: #d8d3cb;
            --border-accent: #c5bfb4;
            --text-primary: #1a1612;
            --text-secondary: #6b6358;
            --text-muted: #9a9185;
            --accent-gold: #b8892a;
            --accent-gold-dim: rgba(184, 137, 42, 0.1);
            --accent-emerald: #059669;
            --accent-emerald-dim: rgba(5, 150, 105, 0.08);
            --accent-blue: #2563eb;
            --accent-blue-dim: rgba(37, 99, 235, 0.08);
            --accent-violet: #7c3aed;
            --accent-violet-dim: rgba(124, 58, 237, 0.08);
            --accent-rose: #e11d48;
            --accent-rose-dim: rgba(225, 29, 72, 0.08);
            --accent-amber: #d97706;
            --accent-amber-dim: rgba(217, 119, 6, 0.08);
            --accent-cyan: #0891b2;
            --accent-cyan-dim: rgba(8, 145, 178, 0.08);
            --status-done: #059669;
            --status-progress: #2563eb;
            --status-pending: #d97706;
            --status-blocked: #e11d48;
            --status-not-started: #9a9185;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-pattern {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(212,168,83,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(96,165,250,0.05) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(167,139,250,0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1360px;
            margin: 0 auto;
            padding: 24px 20px 80px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 32px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .header-left h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            color: var(--accent-gold);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .header-left h1 span {
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55em;
            vertical-align: middle;
            margin-left: 8px;
            opacity: 0.5;
        }
        .header-left .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 400;
        }
        .header-left .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 12px;
            background: var(--accent-gold-dim);
            border: 1px solid rgba(212,168,83,0.25);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--accent-gold);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .health-ring {
            width: 64px;
            height: 64px;
            position: relative;
        }
        .health-ring svg {
            transform: rotate(-90deg);
            width: 64px;
            height: 64px;
        }
        .health-ring .ring-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 5;
        }
        .health-ring .ring-fill {
            fill: none;
            stroke-width: 5;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease;
        }
        .health-ring .ring-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 28px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .nav-tab {
            flex: 1;
            min-width: fit-content;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .nav-tab:hover { color: var(--text-primary); background: var(--bg-card); }
        .nav-tab.active {
            background: var(--bg-card);
            color: var(--accent-gold);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .nav-tab .tab-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: var(--accent-gold-dim);
            color: var(--accent-gold);
            padding: 1px 7px;
            border-radius: 10px;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: all 0.25s ease;
        }
        .card:hover { border-color: var(--border-accent); }
        .card-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.15rem;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .icon {
            font-size: 0.85rem;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-xs);
        }

        /* Grid layouts */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .stack { display: flex; flex-direction: column; gap: 16px; }

        /* Summary KPIs */
        .kpi-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }
        .kpi {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
        }
        .kpi .kpi-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .kpi .kpi-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 4px;
        }
        .kpi .kpi-sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Module Items */
        .module-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transition: all 0.2s;
        }
        .module-item:hover {
            border-color: var(--border-accent);
            background: var(--bg-card-hover);
        }
        .module-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .module-content { flex: 1; min-width: 0; }
        .module-name {
            font-weight: 600;
            font-size: 0.92rem;
            color: var(--text-primary);
            margin-bottom: 3px;
        }
        .module-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .module-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        /* Status badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .badge-done { background: var(--accent-emerald-dim); color: var(--status-done); }
        .badge-progress { background: var(--accent-blue-dim); color: var(--status-progress); }
        .badge-pending { background: var(--accent-amber-dim); color: var(--status-pending); }
        .badge-blocked { background: var(--accent-rose-dim); color: var(--status-blocked); }
        .badge-not-started { background: var(--bg-elevated); color: var(--status-not-started); }
        .badge-wp { background: var(--accent-violet-dim); color: var(--accent-violet); }
        .badge-gold { background: var(--accent-gold-dim); color: var(--accent-gold); }
        .badge-blue { background: var(--accent-blue-dim); color: var(--accent-blue); }
        .badge-cyan { background: var(--accent-cyan-dim); color: var(--accent-cyan); }

        /* Progress bar */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-elevated);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s ease;
        }

        /* Pipeline flow */
        .pipeline-flow {
            display: flex;
            gap: 0;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .pipeline-flow::-webkit-scrollbar { height: 4px; }
        .pipeline-flow::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 2px; }
        .pipeline-flow::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }
        .pipeline-stage {
            flex: 1;
            min-width: 160px;
            padding: 16px 14px;
            text-align: center;
            position: relative;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-right: -1px;
        }
        .pipeline-stage:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
        .pipeline-stage:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-right: 0; }
        .pipeline-stage .stage-icon {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .pipeline-stage .stage-name {
            font-weight: 600;
            font-size: 0.78rem;
            margin-bottom: 2px;
        }
        .pipeline-stage .stage-sub {
            font-size: 0.68rem;
            color: var(--text-muted);
        }
        .pipeline-stage .stage-status {
            margin-top: 8px;
        }
        .pipeline-arrow {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            flex-shrink: 0;
            padding: 0 2px;
        }

        /* Ontology tree */
        .onto-node {
            padding: 12px 16px;
            border-left: 3px solid var(--border);
            margin-left: 12px;
            margin-bottom: 8px;
            background: var(--bg-card);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            transition: all 0.2s;
        }
        .onto-node:hover { border-left-color: var(--accent-gold); background: var(--bg-card-hover); }
        .onto-node.level-0 { margin-left: 0; border-left-width: 4px; border-left-color: var(--accent-gold); }
        .onto-node.level-1 { margin-left: 24px; border-left-color: var(--accent-blue); }
        .onto-node.level-2 { margin-left: 48px; border-left-color: var(--accent-violet); }
        .onto-node .onto-label {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .onto-node .onto-type {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-left: 8px;
        }
        .onto-node .onto-desc {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Libro Blanco rules */
        .rule-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .rule-number {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            color: var(--accent-gold);
            line-height: 1;
            flex-shrink: 0;
            width: 32px;
            text-align: center;
        }
        .rule-content .rule-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .rule-content .rule-desc {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .rule-check {
            margin-left: auto;
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        .rule-check.pass { background: var(--accent-emerald-dim); color: var(--status-done); }
        .rule-check.fail { background: var(--accent-rose-dim); color: var(--status-blocked); }
        .rule-check.partial { background: var(--accent-amber-dim); color: var(--status-pending); }

        /* Constellation diagram */
        .constellation-container {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .constellation-inner {
            position: absolute;
            inset: 0;
        }
        .constellation-container canvas {
            width: 100%;
            height: 100%;
        }

        /* Atomic design */
        .atomic-level {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .atomic-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .atomic-info { flex: 1; }
        .atomic-name {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .atomic-examples {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .atomic-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 3px; }

        /* Section spacing */
        .section { margin-bottom: 32px; }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .section-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .section-icon {
            font-size: 0.9rem;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-xs);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animate in */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeSlideIn 0.5s ease forwards;
            opacity: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container { padding: 16px 12px 60px; }
            .header { flex-direction: column; }
            .header-left h1 { font-size: 1.5rem; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .kpi-strip { grid-template-columns: repeat(2, 1fr); }
            .nav-tab { padding: 8px 12px; font-size: 0.76rem; }
            .pipeline-flow { flex-direction: column; }
            .pipeline-stage { min-width: auto; border-radius: var(--radius-sm) !important; margin-right: 0; margin-bottom: 4px; }
            .pipeline-arrow { transform: rotate(90deg); justify-content: center; }
        }

        @media (max-width: 420px) {
            .kpi-strip { grid-template-columns: 1fr; }
        }

        /* Hidden sections */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="app-container" id="app">
        <!-- Cargando -->
        <div id="loader" style="display:flex;align-items:center;justify-content:center;min-height:80vh;flex-direction:column;gap:16px;">
            <div style="width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent-gold);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <p style="color:var(--text-secondary);font-size:0.9rem;">Inicializando Auditoría AVIA…</p>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>

    <script>
    (function() {

        function applyTheme() {

                document.documentElement.classList.add("light");
            } else {
                document.documentElement.classList.remove("light");
            }
        }
        applyTheme();
        if (window.matchMedia) {
            window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);
        }

        // =====================================================================
        // DATOS DEL PROYECTO CONTROLNEXTMEDIA — MAPA COMPLETO AVIA
        // =====================================================================

        var PROYECTO = {
            nombre: "ControlNextMedia",
            alias: "NEXTMED_IA",
            version: "0.4.2-auditoría",
            fecha: "2026-05-15",
            salud: 31,
            semanas_restantes: 14,
            confianza: 68
        };

        // MÓDULOS: lo DESARROLLADO y lo PENDIENTE
        var MODULOS = [
            {
                id: "dashboard-cto",

                    "Carga del equipo con indicadores de sobrecarga",
                    "Filtros por paquete de trabajo (WP2/WP3)",
                    "Auto-sincronización cada 60 segundos",
                    "Estadísticas globales (total, activas, completadas, bloqueadas)"
                ],
                pendiente: [
                    "Modo oscuro / claro con detección automática",
                    "Diseño responsivo avanzado (móvil)",
                    "Diseño Atómico (descomposición en átomos, moléculas, organismos)",
                    "Integración con API Poe Embed",
                    "Backend real (sustituir simulador)",
                    "Accesibilidad WCAG 2.1",
                    "Exportación de informes"
                ],
                icono: "fa-chart-line",
                color: "blue"
            },
            {
                id: "arquitectura-sistema",
                nombre: "Arquitectura del Sistema",
                wp: "WP2",
                estado: "en-progreso",
                progreso: 85,

        // =====================================================================
        // CÁLCULOS DE RESUMEN
        // =====================================================================

        function calcResumen() {
            var totalDesarrollado = 0;
            var totalPendiente = 0;
            var modulosDone = 0;
            var modulosProgress = 0;
            var modulosPending = 0;
            var modulosBlocked = 0;

            MODULOS.forEach(function(m) {
                totalDesarrollado += m.desarrollado.length;
                totalPendiente += m.pendiente.length;
                if (m.estado === "completado") modulosDone++;
                else if (m.estado === "en-progreso" || m.estado === "parcial") modulosProgress++;
                else if (m.estado === "bloqueado") modulosBlocked++;
                else modulosPending++;
            });

            var progresoGlobal = MODULOS.reduce(function(s, m) { return s + m.progreso; }, 0) / MODULOS.length;

            return {
                totalModulos: MODULOS.length,
                modulosDone: modulosDone,
                modulosProgress: modulosProgress,
                modulosPending: modulosPending,
                modulosBlocked: modulosBlocked,
                totalDesarrollado: totalDesarrollado,
                totalPendiente: totalPendiente,
                progresoGlobal: Math.round(progresoGlobal),
                reglasOK: REGLAS_ORO.filter(function(r) { return r.cumple === "si"; }).length,
                reglasParcial: REGLAS_ORO.filter(function(r) { return r.cumple === "parcial"; }).length,
                reglasNO: REGLAS_ORO.filter(function(r) { return r.cumple === "no"; }).length
            };
        }

        function progressColor(p) {
            if (p >= 75) return "var(--status-done)";
            if (p >= 40) return "var(--status-progress)";
            if (p > 0) return "var(--status-pending)";
            return "var(--status-not-started)";
        }

            var offset = c - (pct / 100) * c;
            var color = pct >= 60 ? "var(--status-done)" : pct >= 30 ? "var(--status-pending)" : "var(--status-blocked)";
            return '<div class="health-ring">' +
                '<svg viewBox="0 0 64 64"><circle class="ring-bg" cx="32" cy="32" r="' + r + '"/>' +
                '<circle class="ring-fill" cx="32" cy="32" r="' + r + '" stroke="' + color + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '"/></svg>' +
                '<div class="ring-label" style="color:' + color + '">' + pct + '%</div></div>';
        }

        function renderKPI(value, label, sub, color) {
            return '<div class="kpi"><div class="kpi-value" style="color:' + color + '">' + value + '</div>' +

        // =================== CONSTELLATION CANVAS ===================
        function drawConstellation() {
            var canvas = document.getElementById("constellation-canvas");
            if (!canvas) return;
            var container = canvas.parentElement;
            var rect = container.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            canvas.style.width = rect.width + "px";
            canvas.style.height = rect.height + "px";
            var ctx = canvas.getContext("2d");
            ctx.scale(2, 2);
            var w = rect.width;
            var h = rect.height;

            var isLight = document.documentElement.classList.contains("light");

            // Nodes
            var nodes = [
                { x: w * 0.5, y: h * 0.15, label: "ControlNextMedia", color: "#d4a853", r: 22, type: "centro" },
                { x: w * 0.22, y: h * 0.38, label: "WP2 Core", color: "#60a5fa", r: 16 },
                { x: w * 0.78, y: h * 0.38, label: "WP3 Validación", color: "#a78bfa", r: 16 },
                { x: w * 0.12, y: h * 0.62, label: "IA Afectiva", color: "#fb7185", r: 12 },
                { x: w * 0.32, y: h * 0.58, label: "Ingesta Datos", color: "#fbbf24", r: 10 },
                { x: w * 0.22, y: h * 0.78, label: "Motor Personal.", color: "#22d3ee", r: 10 },
                { x: w * 0.5, y: h * 0.5, label: "Prototipo", color: "#34d399", r: 11 },
                { x: w * 0.68, y: h * 0.58, label: "OTT", color: "#60a5fa", r: 10 },
                { x: w * 0.82, y: h * 0.62, label: "Val. Técnica", color: "#34d399", r: 10 },
                { x: w * 0.75, y: h * 0.78, label: "Val. Emocional", color: "#fb7185", r: 10 },
                { x: w * 0.5, y: h * 0.88, label: "Ontología AVIA", color: "#d4a853", r: 13 },
                { x: w * 0.35, y: h * 0.92, label: "Pipeline", color: "#22d3ee", r: 10 },
                { x: w * 0.65, y: h * 0.92, label: "Libro Blanco", color: "#d4a853", r: 10 }
            ];

            // Edges
            var edges = [
                [0, 1], [0, 2], [1, 3], [1, 4], [1, 5], [1, 6], [2, 7], [2, 8], [2, 9],
                [3, 5], [4, 3], [5, 6], [6, 7], [3, 9], [10, 11], [10, 12],
                [0, 10], [10, 3], [10, 7], [11, 4], [11, 7], [12, 0]
            ];

            // Draw edges
            edges.forEach(function(e) {
                var a = nodes[e[0]];
                var b = nodes[e[1]];
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = isLight ? "rgba(0,0,0,0.08)" : "rgba(255,255,255,0.07)";
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // Draw nodes
            nodes.forEach(function(n) {
                // Glow
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r + 6, 0, Math.PI * 2);
                ctx.fillStyle = n.color + "18";
                ctx.fill();

                // Node
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                ctx.fillStyle = n.color + "30";
                ctx.fill();
                ctx.strokeStyle = n.color;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Core dot
                ctx.beginPath();
                ctx.arc(n.x, n.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = n.color;
                ctx.fill();

                // Label
                ctx.font = "500 " + (n.type === "centro" ? "11" : "9") + "px Outfit, sans-serif";
                ctx.fillStyle = isLight ? "#1a1612" : "#e8ecf4";
                ctx.textAlign = "center";
                ctx.fillText(n.label, n.x, n.y + n.r + 14);
            });
        }

        // =====================================================================
        // INIT
        // =====================================================================
        setTimeout(function() {
            renderApp();
            window.addEventListener("resize", function() {
                setTimeout(drawConstellation, 100);
            });
        }, 600);
    })();
    </script>
</body>
</html>
