*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',sans-serif;background:var(--bg-0);color:var(--t1);line-height:1.6;min-height:100vh;overflow-x:hidden}
.bg-grad{position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 15% 8%,rgba(212,167,78,.05) 0%,transparent 55%),radial-gradient(ellipse 50% 45% at 85% 75%,rgba(91,156,246,.04) 0%,transparent 50%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:20px 16px 80px}

/* Typography */
.hd{font-family:'Playfair Display',serif}
.mono{font-family:'JetBrains Mono',monospace}

/* Header */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.hdr h1{font-family:'Playfair Display',serif;font-size:1.85rem;color:var(--gold);line-height:1.2}
.hdr h1 em{font-style:italic;color:var(--t1);font-size:.55em;display:block;margin-top:2px}
.hdr-sub{font-size:.82rem;color:var(--t2);margin-top:4px}
.hdr-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:var(--red-d);border:1px solid rgba(239,83,80,.25);border-radius:16px;font-size:.68rem;color:var(--red);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.ring{width:68px;height:68px;position:relative}
.ring svg{transform:rotate(-90deg);width:68px;height:68px}
.ring .rb{fill:none;stroke:var(--border);stroke-width:5}
.ring .rf{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring .rl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:700}

/* Tabs */
.tabs{display:flex;gap:3px;margin-bottom:24px;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r);padding:3px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:fit-content;padding:9px 12px;border:none;background:transparent;color:var(--t3);font-family:'Manrope',sans-serif;font-size:.76rem;font-weight:500;cursor:pointer;border-radius:var(--rs);transition:all .2s;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.tab:hover{color:var(--t1);background:var(--bg-2)}
.tab.on{background:var(--bg-2);color:var(--gold);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tab .tc{font-family:'JetBrains Mono',monospace;font-size:.62rem;background:var(--gold-d);color:var(--gold);padding:1px 6px;border-radius:8px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:24px}
.kpi{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px;text-align:center;transition:border-color .2s}
.kpi:hover{border-color:var(--border-h)}
.kpi .v{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700;line-height:1.2}
.kpi .l{font-size:.65rem;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.kpi .s{font-size:.65rem;color:var(--t2);margin-top:1px}

.card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:border-color .2s;margin-bottom:14px}
.card:hover{border-color:var(--border-h)}
.card-t{font-family:'Playfair Display',serif;font-size:1.05rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}

.b{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:14px;font-size:.66rem;font-weight:600;letter-spacing:.02em}
.b-ok{background:var(--emerald-d);color:var(--emerald)}.b-prog{background:var(--blue-d);color:var(--blue)}

.b-off{background:var(--bg-4);color:var(--t3)}.b-wp{background:var(--violet-d);color:var(--violet)}
.b-gold{background:var(--gold-d);color:var(--gold)}.b-cyan{background:var(--cyan-d);color:var(--cyan)}
.b-red{background:var(--red-d);color:var(--red)}

.pbar{width:100%;height:5px;background:var(--bg-4);border-radius:3px;overflow:hidden;margin-top:6px}
.pfill{height:100%;border-radius:3px;transition:width .8s ease}

/* Stack */
.stk{display:flex;flex-direction:column;gap:12px}

.mod{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;align-items:flex-start;gap:12px;transition:all .2s}

.mic{width:36px;height:36px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.mbd{flex:1;min-width:0}
.mbd .mn{font-weight:600;font-size:.88rem}
.mbd .md{font-size:.78rem;color:var(--t2);margin-top:2px;line-height:1.5}
.mbd .mm{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}

.disc{border-left:3px solid var(--red);padding:14px 16px;background:var(--red-d);border-radius:0 var(--rs) var(--rs) 0;margin-bottom:10px;font-size:.82rem}
.disc strong{color:var(--red)}

.cblk{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--t2);background:var(--bg-1);padding:14px;border-radius:var(--rs);overflow-x:auto;line-height:1.7;white-space:pre-wrap;word-break:break-word}

.ot .od{font-size:.74rem;color:var(--t2);margin-top:1px}

.rn{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);flex-shrink:0;width:28px;text-align:center;line-height:1}

.rchk.y{background:var(--emerald-d);color:var(--emerald)}.rchk.n{background:var(--rose-d);color:var(--rose)}.rchk.p{background:var(--amber-d);color:var(--amber)}

/* Constellation */
.cstl{position:relative;width:100%;padding-top:65%;background:var(--bg-1);border-radius:var(--r);overflow:hidden}
.cstl-i{position:absolute;inset:0}
.cstl canvas{width:100%;height:100%}

/* Details */
details summary{cursor:pointer;font-size:.76rem;font-weight:600;padding:4px 0}
details ul{margin:4px 0 0 14px;padding:0;list-style:none;font-size:.76rem;color:var(--t2);line-height:1.8}

/* Tab panels */
.tp{display:none}.tp.on{display:block}

/* Animate */
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ai{animation:fi .45s ease forwards;opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:768px){.wrap{padding:14px 10px 60px}.hdr{flex-direction:column}.hdr h1{font-size:1.4rem}.kpis{grid-template-columns:repeat(2,1fr)}.pflw{flex-direction:column}.pstg{min-width:auto;border-radius:var(--rs)!important;margin-right:0;margin-bottom:3px}.parr{transform:rotate(90deg);justify-content:center}}
@media(max-width:420px){.kpis{grid-template-columns:1fr}.tab{padding:7px 8px;font-size:.7rem}}

var BotRouter={
NIVELES:{eco:["Grok-4.1-Fast-Non-Reasoning","Gemini-3-Flash"],med:["Claude-Sonnet-4.6","Gemini-3.1-Pro"],pro:["Claude-Opus-4.6","GPT-5.4-Pro"]},
LIM:50000,log:[],
sel:function(t){var m={simple:"eco",formato:"eco",codigo:"med",analisis:"med",json:"med",inv:"pro",audit:"pro"};return this.NIVELES[m[t]||"eco"][0]},
cadena:function(t){var b=this.sel(t),c=[b],all=["Claude-Sonnet-4.6","Gemini-3-Flash","Grok-4.1-Fast-Non-Reasoning"];
var i=all.indexOf(b);for(var j=i+1;j<all.length;j++)if(c.indexOf(all[j])===-1)c.push(all[j]);
if(c.indexOf("Grok-4.1-Fast-Non-Reasoning")===-1)c.push("Grok-4.1-Fast-Non-Reasoning");return c},
trunc:function(t){var e=Math.ceil(t.length/4);return e>this.LIM?t.slice(0,this.LIM*4):t},
send:async function(prompt,tipo,opts){
if(!window.Poe)throw new Error("Poe API no disponible");
var ch=this.cadena(tipo),txt=this.trunc(prompt),err=null;
for(var i=0;i<ch.length;i++){try{
var r=await window.Poe.sendUserMessage("@"+ch[i]+" "+txt,Object.assign({openChat:false,stream:false,parameters:{}},opts||{}));
this.log.push({t:new Date().toISOString(),bot:ch[i],ok:true});return r;
}catch(e){err=e;this.log.push({t:new Date().toISOString(),bot:ch[i],ok:false,e:e.message||String(e)})}}
throw err}
};
window.BotRouter=BotRouter;
