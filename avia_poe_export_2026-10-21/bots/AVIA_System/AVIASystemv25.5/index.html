<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA System v25.5 - Autonomous Intelligence Architecture</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #faf9f7;
            --bg-secondary: #f0eeeb;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-hover: rgba(245, 243, 240, 0.95);
            --bg-console: rgba(25, 25, 35, 0.95);
            --border-color: rgba(60, 60, 80, 0.1);
            --border-glow: rgba(108, 92, 231, 0.35);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8888a0;
            --text-console: #e0e0e0;
            --accent-1: #6c5ce7;
            --accent-2: #a855f7;
            --accent-3: #0ea5e9;
            --accent-4: #f472b6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gradient-main: linear-gradient(160deg, #faf9f7 0%, #f0eeeb 40%, #e8e5ff 100%);
            --gradient-accent: linear-gradient(135deg, #6c5ce7, #a855f7, #0ea5e9);
            --shadow-soft: 0 4px 24px rgba(60, 60, 80, 0.06);
            --shadow-glow: 0 0 24px rgba(108, 92, 231, 0.12);
            --shadow-elevated: 0 12px 40px rgba(60, 60, 80, 0.1);
            --font-display: 'Syne', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 14px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark {
            --bg-primary: #0c0a1a;
            --bg-secondary: #14112a;
            --bg-card: rgba(20, 17, 42, 0.88);
            --bg-card-hover: rgba(30, 27, 55, 0.92);
            --bg-console: rgba(8, 6, 18, 0.95);
            --border-color: rgba(108, 92, 231, 0.15);
            --border-glow: rgba(108, 92, 231, 0.5);
            --text-primary: #f0eeff;
            --text-secondary: #b0a8d0;
            --text-muted: #6b6490;
            --text-console: #d0ccee;
            --gradient-main: linear-gradient(160deg, #0c0a1a 0%, #14112a 40%, #1a1040 100%);
            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 30px rgba(108, 92, 231, 0.2);
            --shadow-elevated: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--gradient-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(108, 92, 231, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 85%, rgba(168, 85, 247, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(14, 165, 233, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 28px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            animation: headerReveal 0.6s ease forwards;
        }

        @keyframes headerReveal {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gradient-accent);
            animation: shimmer 3s linear infinite;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: clamp(1.6em, 4.5vw, 2.6em);
            font-weight: 800;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
            letter-spacing: -0.03em;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95em;
            font-weight: 400;
        }

        .header-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .header-meta small {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.72em;
        }

        .health-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 600;
            font-family: var(--font-mono);
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .health-badge .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--success);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .status-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 14px;
            border: 1px solid var(--border-color);
            transition: all var(--transition);
            box-shadow: var(--shadow-soft);
            animation: cardReveal 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-card:hover {
            border-color: var(--border-glow);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }

        .status-card h3 {
            font-size: 0.65em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .status-card .value {
            font-size: 1.3em;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent-1);
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 18px;
            border: 1px solid var(--border-color);
            transition: all var(--transition);
            box-shadow: var(--shadow-soft);
            animation: cardReveal 0.5s ease forwards;
            opacity: 0;
            animation-delay: 0.3s;
        }

        .panel h2 {
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-display);
            font-size: 1.05em;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .console {
            background: var(--bg-console);
            border-radius: 10px;
            padding: 12px;
            height: 220px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.72em;
            border: 1px solid rgba(108, 92, 231, 0.08);
            margin-top: 10px;
            color: var(--text-console);
        }

        .console::-webkit-scrollbar { width: 5px; }
        .console::-webkit-scrollbar-track { background: transparent; }
        .console::-webkit-scrollbar-thumb { background: var(--accent-1); border-radius: 3px; }

        .console-line {
            margin-bottom: 3px;
            padding: 3px 8px;
            border-left: 3px solid transparent;
            border-radius: 2px;
            animation: lineSlide 0.2s ease;
            word-break: break-word;
        }

        @keyframes lineSlide {
            from { opacity: 0; transform: translateX(-4px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .console-line.info { border-left-color: var(--accent-3); }
        .console-line.success { border-left-color: var(--success); color: #6ee7b7; }
        .console-line.warning { border-left-color: var(--warning); color: #fcd34d; }
        .console-line.error { border-left-color: var(--danger); color: #fca5a5; }
        .console-line.system { border-left-color: var(--accent-4); color: #f9a8d4; font-style: italic; }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: var(--font-body);
            font-size: 0.8em;
            transition: all var(--transition);
            flex: 1;
            min-width: 80px;
            text-align: center;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--accent-1); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: #1a1a1a; }
        .btn-danger { background: var(--danger); color: white; }

        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            margin-top: 8px;
            font-size: 0.72em;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>AVIA System v25.5</h1>
            <p>Autonomous Verification Intelligence Architecture</p>
            <div class="header-meta">
                <small>Orquestado por AVIA-Clon-Carlos</small>
                <span class="health-badge">
                    <span class="dot"></span>
                    <span>SYSTEM OK</span>
                </span>
            </div>
        </header>

        <section class="status-bar">
            <div class="status-card">
                <h3>Estado</h3>
                <div class="value" id="systemStatus">● ONLINE</div>
            </div>
            <div class="status-card">
                <h3>Nodos</h3>
                <div class="value" id="activeNodes">1</div>
            </div>
            <div class="status-card">
                <h3>Tokens</h3>
                <div class="value" id="tokenBalance">1000</div>
            </div>
            <div class="status-card">
                <h3>Ledger</h3>
                <div class="value" id="ledgerCount">0</div>
            </div>
        </section>

        <div class="main-grid">
            <div class="panel">
                <h2><i class="fa-solid fa-database"></i> Persistencia AVIA</h2>
                <div class="btn-group">
                    <button class="btn btn-success" id="btnSave">Guardar</button>
                    <button class="btn btn-primary" id="btnLoad">Cargar</button>
                    <button class="btn btn-warning" id="btnExport">Export</button>
                    <button class="btn btn-danger" id="btnClear">Limpiar</button>
                </div>
                <div class="console" id="persistenceConsole"></div>
            </div>

            <div class="panel">
                <h2><i class="fa-solid fa-coins"></i> Constelación de Consenso</h2>
                <div style="text-align:center;font-size:2em;font-family:var(--font-mono);padding:20px;color:var(--accent-1);" id="tokenDisplay">1000 AVIA</div>
                <input type="text" id="proposalInput" placeholder="Descripción..." style="width:100%;padding:10px;border:1px solid var(--border-color);border-radius:8px;margin-bottom:8px;">
                <div class="btn-group">
                    <button class="btn btn-success" id="btnPropose">Proponer</button>
                    <button class="btn btn-primary" id="btnVoteYes">Sí</button>
                    <button class="btn btn-danger" id="btnVoteNo">No</button>
                </div>
                <div id="proposalList" style="margin-top:10px;"></div>
            </div>
        </div>

        <div class="panel">
            <h2><i class="fa-solid fa-terminal"></i> Consola Global AVIA</h2>
            <div class="console" id="globalConsole" style="height:180px;"></div>
        </div>

        <footer class="footer-bar">
            <span>AVIA v25.5 | SHA-256 Ledger | IndexedDB</span>
            <span id="footerClock"></span>
        </footer>
    </div>

    <script>
    (function() {
        "use strict";

        var AVIA = {
            version: "25.5",
            nodeId: "avia-" + Date.now(),
            state: {
                tokens: 1000,
                nodes: {},
                proposals: [],
                ledger: []
            }
        };

        var memoryStore = {};
        var storage = {
            setItem: function(key, value) { memoryStore[key] = value; },
            getItem: function(key) { return memoryStore[key] || null; },
            removeItem: function(key) { delete memoryStore[key]; }
        };

        function log(message, type) {
            type = type || "info";
            var consoleEl = document.getElementById("globalConsole");
            if (consoleEl) {
                var line = document.createElement("div");
                line.className = "console-line " + type;
                line.textContent = "[" + new Date().toLocaleTimeString() + "] " + message;
                consoleEl.appendChild(line);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        }

        function logTo(containerId, message, type) {
            type = type || "info";
            var consoleEl = document.getElementById(containerId);
            if (consoleEl) {
                var line = document.createElement("div");
                line.className = "console-line " + type;
                line.textContent = "[" + new Date().toLocaleTimeString() + "] " + message;
                consoleEl.appendChild(line);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        }

        function updateUI() {
            document.getElementById("systemStatus").textContent = "● ONLINE";
            document.getElementById("activeNodes").textContent = Object.keys(AVIA.state.nodes).length + 1;
            document.getElementById("tokenBalance").textContent = AVIA.state.tokens;
            document.getElementById("ledgerCount").textContent = AVIA.state.ledger.length;
            document.getElementById("tokenDisplay").textContent = AVIA.state.tokens + " AVIA";
        }

        function updateClock() {
            var el = document.getElementById("footerClock");
            if (el) { el.textContent = new Date().toLocaleTimeString(); }
        }

        AVIA.saveState = function() {
            try {
                var stateStr = JSON.stringify(AVIA.state);
                storage.setItem("avia_state_v25", stateStr);
                logTo("persistenceConsole", "Estado guardado (" + stateStr.length + " bytes)", "success");
                log("Estado guardado", "success");
            } catch (e) {
                logTo("persistenceConsole", "Error: " + e.message, "error");
            }
        };

        AVIA.loadState = function() {
            try {
                var stateStr = storage.getItem("avia_state_v25");
                if (stateStr) {
                    AVIA.state = JSON.parse(stateStr);
                    updateUI();
                    logTo("persistenceConsole", "Estado cargado", "success");
                    log("Estado recuperado", "success");
                } else {
                    logTo("persistenceConsole", "No hay estado guardado", "warning");
                }
            } catch (e) {
                logTo("persistenceConsole", "Error: " + e.message, "error");
            }
        };

        AVIA.exportData = function() {
            try {
                var dataStr = JSON.stringify(AVIA.state, null, 2);
                var blob = new Blob([dataStr], { type: "application/json" });
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a");
                a.href = url;
                a.download = "avia_export_" + Date.now() + ".json";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                logTo("persistenceConsole", "Exportado", "success");
            } catch (e) {
                logTo("persistenceConsole", "Error: " + e.message, "error");
            }
        };

        AVIA.clearData = function() {
            storage.removeItem("avia_state_v25");
            AVIA.state = { tokens: 1000, nodes: {}, proposals: [], ledger: [] };
            updateUI();
            logTo("persistenceConsole", "Datos eliminados", "success");
            log("Sistema reiniciado", "warning");
        };

        AVIA.createProposal = function() {
            var desc = document.getElementById("proposalInput").value.trim();
            if (!desc) { return; }

            var proposal = {
                id: "prop-" + Date.now(),
                description: desc,
                cost: 100,
                votes: { yes: 0, no: 0 },
                status: "pending"
            };

            AVIA.state.proposals.push(proposal);
            updateProposalList();
            updateUI();
            log("Propuesta: " + desc, "success");
            document.getElementById("proposalInput").value = "";
        };

        AVIA.voteLatest = function(approve) {
            var pending = AVIA.state.proposals.filter(function(p) { return p.status === "pending"; });
            if (pending.length === 0) { return; }

            var proposal = pending[pending.length - 1];
            if (approve) { proposal.votes.yes++; }
            else { proposal.votes.no++; }

            var totalVotes = proposal.votes.yes + proposal.votes.no;
            if (totalVotes >= 3) {
                if (proposal.votes.yes > proposal.votes.no) {
                    proposal.status = "approved";
                    AVIA.state.tokens -= proposal.cost;
                    log("Aprobada: " + proposal.description, "success");
                } else {
                    proposal.status = "rejected";
                    log("Rechazada: " + proposal.description, "error");
                }
            }

            updateProposalList();
            updateUI();
        };

        function updateProposalList() {
            var listEl = document.getElementById("proposalList");
            if (!listEl) { return; }
            listEl.innerHTML = "";

            for (var i = Math.max(0, AVIA.state.proposals.length - 3); i < AVIA.state.proposals.length; i++) {
                var prop = AVIA.state.proposals[i];
                var item = document.createElement("div");
                item.style.cssText = "background:var(--bg-console);padding:10px;border-radius:8px;margin-bottom:8px;font-size:0.85em;";
                item.innerHTML = "<strong>" + prop.description + "</strong><br>" +
                                 "<span style='color:var(--text-muted);font-size:0.9em;'>" + prop.status.toUpperCase() + 
                                 " | " + prop.votes.yes + "↑ " + prop.votes.no + "↓</span>";
                listEl.appendChild(item);
            }
        }

        document.getElementById("btnSave").addEventListener("click", function() { AVIA.saveState(); });
        document.getElementById("btnLoad").addEventListener("click", function() { AVIA.loadState(); });
        document.getElementById("btnExport").addEventListener("click", function() { AVIA.exportData(); });
        document.getElementById("btnClear").addEventListener("click", function() { AVIA.clearData(); });
        document.getElementById("btnPropose").addEventListener("click", function() { AVIA.createProposal(); });
        document.getElementById("btnVoteYes").addEventListener("click", function() { AVIA.voteLatest(true); });
        document.getElementById("btnVoteNo").addEventListener("click", function() { AVIA.voteLatest(false); });

        setInterval(updateClock, 1000);
        updateUI();
        log("AVIA System v25.5 inicializado", "success");
    })();
    </script>
</body>
</html>
