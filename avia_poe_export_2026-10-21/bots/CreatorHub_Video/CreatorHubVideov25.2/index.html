<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorHubVideo v25.1 - Seedance 2.5 Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
        }

        .panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #e9ecef;
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }

        .file-upload {
            border: 3px dashed #dee2e6;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .file-upload input {
            display: none;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .result-panel {
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .video-container {
            width: 100%;
            max-width: 100%;
        }

        .video-container video {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 500;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .reference-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .reference-item {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #dee2e6;
        }

        .api-config {
            background: #e7f3ff;
            border: 2px solid #2196F3;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .api-config h3 {
            color: #1565C0;
            margin-bottom: 15px;
        }

        .info-box {
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #856404;
        }

        .credential-saved {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .config-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 CreatorHubVideo v25.1</h1>
            <p>Integración Seedance 2.5 - Generación de Video con IA</p>
        </div>

        <div class="main-content">
            <!-- Panel de Configuración -->
            <div class="panel">
                <h2>⚙️ Configuración de Generación</h2>

                <!-- API Configuration -->
                <div class="api-config">
                    <h3>🔑 Credenciales API <span id="credentialStatus"></span></h3>
                    <div class="form-group">
                        <label>Cloudflare Account ID:</label>
                        <input type="text" id="accountId" placeholder="tu-account-id">
                    </div>
                    <div class="form-group">
                        <label>Cloudflare API Token:</label>
                        <input type="text" id="apiToken" placeholder="tu-api-token">
                    </div>
                    <button class="btn btn-secondary" id="saveCredentialsBtn">
                        💾 Guardar Credenciales en Sesión
                    </button>
                    <div class="info-box">
                        ℹ️ Tus credenciales se guardan solo en memoria durante esta sesión por seguridad
                    </div>
                </div>

                <!-- Prompt -->
                <div class="form-group">
                    <label>📝 Prompt de Video (Descripción detallada):</label>
                    <textarea id="prompt" placeholder="Ejemplo: A futuristic city at sunset with flying cars moving smoothly through glass skyscrapers, warm orange and purple lighting, cinematic camera movement"></textarea>
                </div>

                <!-- Configuración técnica -->
                <div class="config-row">
                    <div class="form-group">
                        <label>⏱️ Duración (seg):</label>
                        <select id="duration">
                            <option value="5">5 segundos</option>
                            <option value="10">10 segundos</option>
                            <option value="15">15 segundos</option>
                            <option value="20">20 segundos</option>
                            <option value="30">30 segundos</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>🎥 Resolución:</label>
                        <select id="resolution">
                            <option value="480p">480p</option>
                            <option value="720p">720p (Recomendado)</option>
                        </select>
                    </div>
                </div>

                <!-- Upload de referencias -->
                <div class="form-group">
                    <label>🖼️ Imágenes de Referencia (Opcional, máx 30):</label>
                    <div class="file-upload" onclick="document.getElementById('imageUpload').click()">
                        <p>📤 Clic para subir imágenes</p>
                        <input type="file" id="imageUpload" accept="image/*" multiple>
                    </div>
                    <div class="reference-preview" id="imagePreview"></div>
                </div>

                <!-- Botón de generación -->
                <button class="btn btn-primary" id="generateBtn">
                    ✨ Generar Video con Seedance 2.5
                </button>
            </div>

            <!-- Panel de Resultados -->
            <div class="panel">
                <h2>🎞️ Resultado</h2>
                <div class="result-panel" id="resultPanel">
                    <div style="text-align: center; color: #adb5bd;">
                        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                            <line x1="7" y1="2" x2="7" y2="22"></line>
                            <line x1="17" y1="2" x2="17" y2="22"></line>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <line x1="2" y1="7" x2="7" y2="7"></line>
                            <line x1="2" y1="17" x2="7" y2="17"></line>
                            <line x1="17" y1="17" x2="22" y2="17"></line>
                            <line x1="17" y1="7" x2="22" y2="7"></line>
                        </svg>
                        <p style="margin-top: 20px; font-size: 1.1em;">
                            Configura los parámetros y genera tu video
                        </p>
                    </div>
                </div>
                <div id="statusMessage"></div>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // ESTADO EN MEMORIA (NO localStorage)
        // ========================================
        const appState = {
            accountId: '',
            apiToken: '',
            referenceImages: [],
            credentialsSaved: false
        };

        // Elementos del DOM
        const elements = {
            accountId: document.getElementById('accountId'),
            apiToken: document.getElementById('apiToken'),
            saveCredentialsBtn: document.getElementById('saveCredentialsBtn'),
            credentialStatus: document.getElementById('credentialStatus'),
            prompt: document.getElementById('prompt'),
            duration: document.getElementById('duration'),
            resolution: document.getElementById('resolution'),
            imageUpload: document.getElementById('imageUpload'),
            imagePreview: document.getElementById('imagePreview'),
            generateBtn: document.getElementById('generateBtn'),
            resultPanel: document.getElementById('resultPanel'),
            statusMessage: document.getElementById('statusMessage')
        };

        // ========================================
        // GUARDAR CREDENCIALES EN MEMORIA
        // ========================================
        elements.saveCredentialsBtn.addEventListener('click', () => {
            const accountId = elements.accountId.value.trim();
            const apiToken = elements.apiToken.value.trim();

            if (!accountId || !apiToken) {
                showStatus('error', '⚠️ Por favor completa ambos campos de credenciales');
                return;
            }

            appState.accountId = accountId;
            appState.apiToken = apiToken;
            appState.credentialsSaved = true;

            elements.credentialStatus.innerHTML = '<span class="credential-saved">✓ Guardadas</span>';
            showStatus('success', '✅ Credenciales guardadas en memoria (válidas durante esta sesión)');
        });

        // ========================================
        // PREVIEW DE IMÁGENES
        // ========================================
        elements.imageUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            appState.referenceImages = files;

            elements.imagePreview.innerHTML = '';
            files.slice(0, 30).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'reference-item';
                    elements.imagePreview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });

            if (files.length > 0) {
                showStatus('info', `📎 ${files.length} imagen${files.length > 1 ? 'es' : ''} cargada${files.length > 1 ? 's' : ''}`);
            }
        });

        // ========================================
        // GENERACIÓN DE VIDEO
        // ========================================
        elements.generateBtn.addEventListener('click', async () => {
            // Validación de credenciales
            if (!appState.credentialsSaved) {
                showStatus('warning', '⚠️ Por favor guarda tus credenciales primero');
                return;
            }

            const prompt = elements.prompt.value.trim();
            if (!prompt) {
                showStatus('error', '⚠️ Por favor ingresa una descripción del video');
                return;
            }

            // Deshabilitar botón
            elements.generateBtn.disabled = true;
            elements.generateBtn.textContent = '⏳ Generando video...';

            // Mostrar loading
            showLoading();

            try {
                // Preparar request
                const requestBody = {
                    model: 'bytedance/seedance-2.5',
                    input: {
                        prompt: prompt,
                        duration: parseInt(elements.duration.value),
                        resolution: elements.resolution.value
                    }
                };

                // Info sobre referencias
                if (appState.referenceImages.length > 0) {
                    showStatus('info', `📎 Procesando ${appState.referenceImages.length} imágenes de referencia...`);
                }

                // Llamada API real
                const result = await generateVideoAPI(
                    appState.accountId, 
                    appState.apiToken, 
                    requestBody
                );

                // Mostrar resultado
                displayVideo(result);
                showStatus('success', '✅ Video generado exitosamente');

            } catch (error) {
                console.error('Error:', error);
                showStatus('error', `❌ Error: ${error.message}`);
                showErrorState();
            } finally {
                elements.generateBtn.disabled = false;
                elements.generateBtn.textContent = '✨ Generar Video con Seedance 2.5';
            }
        });

        // ========================================
        // FUNCIÓN API CLOUDFLARE
        // ========================================
        async function generateVideoAPI(accountId, apiToken, requestBody) {
            const url = `https://api.cloudflare.com/client/v4/accounts/${accountId}/ai/run`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.errors?.[0]?.message || 'Error en la API de Cloudflare');
                }

                const data = await response.json();
                
                if (data.success && data.result) {
                    return {
                        videoUrl: data.result.video || null,
                        status: 'completed',
                        metadata: data.result
                    };
                } else {
                    throw new Error('No se recibió video en la respuesta');
                }

            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // ========================================
        // FUNCIONES UI
        // ========================================
        function showLoading() {
            elements.resultPanel.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="color: #667eea; font-weight: 600; font-size: 1.1em;">
                        Generando video con Seedance 2.5...
                    </p>
                    <p style="color: #868e96; margin-top: 10px;">
                        Esto puede tomar entre 30-90 segundos
                    </p>
                </div>
            `;
        }

        function displayVideo(result) {
            if (result.videoUrl) {
                elements.resultPanel.innerHTML = `
                    <div class="video-container">
                        <video controls autoplay loop>
                            <source src="${result.videoUrl}" type="video/mp4">
                            Tu navegador no soporta video HTML5
                        </video>
                        <button class="btn btn-primary" style="margin-top: 20px;" onclick="downloadVideo('${result.videoUrl}')">
                            💾 Descargar Video
                        </button>
                    </div>
                `;
            } else {
                elements.resultPanel.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h3 style="color: #667eea; margin-bottom: 15px;">🎉 Video en procesamiento</h3>
                        <p style="color: #495057; line-height: 1.6;">
                            Tu video está siendo generado por Seedance 2.5.<br>
                            En producción real, implementar polling o webhooks<br>
                            para recibir la URL del video final.
                        </p>
                        <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 8px; text-align: left;">
                            <strong>Configuración usada:</strong><br>
                            📝 Prompt: ${elements.prompt.value.substring(0, 100)}...<br>
                            ⏱️ Duración: ${elements.duration.value}s<br>
                            🎥 Resolución: ${elements.resolution.value}<br>
                            🖼️ Referencias: ${appState.referenceImages.length} imágenes
                        </div>
                    </div>
                `;
            }
        }

        function showErrorState() {
            elements.resultPanel.innerHTML = `
                <div style="text-align: center; color: #dc3545;">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <p style="margin-top: 20px; font-size: 1.1em;">
                        Error al generar el video
                    </p>
                    <p style="margin-top: 10px; font-size: 0.9em; color: #6c757d;">
                        Verifica tus credenciales y conexión
                    </p>
                </div>
            `;
        }

        function showStatus(type, message) {
            const className = `status-${type}`;
            elements.statusMessage.innerHTML = `
                <div class="status-message ${className}">
                    ${message}
                </div>
            `;

            setTimeout(() => {
                if (elements.statusMessage.innerHTML.includes(message)) {
                    elements.statusMessage.innerHTML = '';
                }
            }, 5000);
        }

        function downloadVideo(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = `seedance-video-${Date.now()}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showStatus('success', '💾 Descarga iniciada');
        }

        // ========================================
        // INICIALIZACIÓN
        // ========================================
        console.log('✅ CreatorHubVideo v25.1 inicializado correctamente');
        console.log('ℹ️ Estado persistente en memoria (sin localStorage por restricciones sandbox)');
    </script>
</body>
</html>
