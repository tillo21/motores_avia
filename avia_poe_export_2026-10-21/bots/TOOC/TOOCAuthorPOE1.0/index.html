        // AVIA MODULAR ARCHITECTURE - Carlos System

        /**
         * Event Bus - Sistema de comunicación inter-modular sin dependencias
         * Permite que los módulos se comuniquen sin acoplamiento
         */
        class AVIAEventBus {
            constructor() {
                this.listeners = new Map();
                this.eventHistory = [];
                this.maxHistory = 100;
            }

            on(event, callback, moduleId = 'unknown') {
                if (!this.listeners.has(event)) {
                    this.listeners.set(event, []);
                }
                this.listeners.get(event).push({ callback, moduleId });
                console.log(`📡 EventBus: ${moduleId} listening to '${event}'`);
            }

            off(event, callback) {
                if (this.listeners.has(event)) {
                    const callbacks = this.listeners.get(event);
                    const index = callbacks.findIndex(cb => cb.callback === callback);
                    if (index !== -1) callbacks.splice(index, 1);
                }
            }

            emit(event, data = {}, sourceModule = 'unknown') {
                console.log(`📡 EventBus: Event '${event}' emitted by ${sourceModule}`, data);

                // Guardar en historial
                this.eventHistory.push({
                    event,
                    data,
                    sourceModule,
                    timestamp: Date.now()
                });
                if (this.eventHistory.length > this.maxHistory) {
                    this.eventHistory.shift();
                }

                if (this.listeners.has(event)) {
                    this.listeners.get(event).forEach(({ callback, moduleId }) => {
                        try {
                            callback(data, sourceModule);
                        } catch (error) {
                            console.error(`❌ Error in listener ${moduleId} for event ${event}:`, error);
                        }
                    });
                }
            }

            getHistory() {
                return [...this.eventHistory];
            }
        }

        /**
         * Module Health Monitor - Monitoreo de salud de módulos
         * Detecta y reporta problemas en tiempo real
         */
        class ModuleHealthMonitor {
            constructor() {
                this.modules = new Map();
                this.checkInterval = 30000; // 30 segundos
                this.autoRepairEnabled = true;
            }

            register(moduleId, module) {
                this.modules.set(moduleId, {
                    module,
                    status: 'healthy',
                    lastCheck: Date.now(),
                    errorCount: 0,
                    lastError: null
                });
                console.log(`💚 HealthMonitor: Module '${moduleId}' registered`);
            }

            reportError(moduleId, error) {
                if (this.modules.has(moduleId)) {
                    const info = this.modules.get(moduleId);
                    info.errorCount++;
                    info.lastError = {
                        message: error.message,
                        stack: error.stack,
                        timestamp: Date.now()
                    };

                    if (info.errorCount > 3) {
                        info.status = 'critical';
                        console.error(`🔴 Module '${moduleId}' is CRITICAL (${info.errorCount} errors)`);

                        if (this.autoRepairEnabled) {
                            this.attemptRepair(moduleId);
                        }
                    } else {
                        info.status = 'warning';
                        console.warn(`⚠️ Module '${moduleId}' has warning (${info.errorCount} errors)`);
                    }
                }
            }

            attemptRepair(moduleId) {
                console.log(`🔧 Attempting auto-repair for module '${moduleId}'...`);
                const info = this.modules.get(moduleId);

                try {
                    // Intentar reinicializar el módulo
                    if (info.module && typeof info.module.reset === 'function') {
                        info.module.reset();
                        info.errorCount = 0;
                        info.status = 'healthy';
                        console.log(`✅ Module '${moduleId}' repaired successfully`);
                        window.aviaEventBus?.emit('module:repaired', { moduleId }, 'HealthMonitor');
                    }
                } catch (error) {
                    console.error(`❌ Auto-repair failed for '${moduleId}':`, error);
                }
            }

            getStatus(moduleId) {
                return this.modules.get(moduleId)?.status || 'unknown';
            }

            getAllStatus() {
                const status = {};
                this.modules.forEach((info, id) => {
                    status[id] = {
                        status: info.status,
                        errorCount: info.errorCount,
                        lastError: info.lastError
                    };
                });
                return status;
            }
        }

        /**
         * Error Boundary - Wrapper para módulos con manejo de errores
         * Contiene errores dentro del módulo sin afectar a otros
         */
        class ErrorBoundary {
            constructor(moduleId, component) {
                this.moduleId = moduleId;
                this.component = component;
                this.hasError = false;
                this.error = null;
            }

            wrap(method, methodName) {
                return (...args) => {
                    try {
                        return method.apply(this.component, args);
                    } catch (error) {
                        this.hasError = true;
                        this.error = error;
                        console.error(`❌ Error in ${this.moduleId}.${methodName}:`, error);
                        window.aviaHealth?.reportError(this.moduleId, error);

                        // Mostrar error en UI si es un método de render
                        if (methodName === 'render' && args[0]) {
                            args[0].innerHTML = `
                                <div class="max-w-2xl mx-auto mt-8">
                                    <div class="bg-red-50 dark:bg-red-900/20 border-l-8 border-red-500 rounded-lg p-6">
                                        <div class="flex items-start gap-4">
                                            <div class="text-4xl">⚠️</div>
                                            <div class="flex-1">
                                                <h3 class="text-xl font-bold text-red-800 dark:text-red-200 mb-2">
                                                    Error en módulo: ${this.moduleId}
                                                </h3>
                                                <p class="text-red-700 dark:text-red-300 mb-4">
                                                    ${error.message}
                                                </p>
                                                <button onclick="window.aviaHealth?.attemptRepair('${this.moduleId}')"
                                                        class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">
                                                    🔧 Intentar Reparar
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }

                        return null;
                    }
                };
            }

            wrapAll() {
                const methods = Object.getOwnPropertyNames(Object.getPrototypeOf(this.component));
                methods.forEach(method => {
                    if (method !== 'constructor' && typeof this.component[method] === 'function') {
                        this.component[method] = this.wrap(this.component[method], method);
                    }
                });
                return this.component;
            }
        }

        /**
         * Module Registry - Registro central de módulos
         * Gestiona el ciclo de vida de todos los módulos
         */
        class ModuleRegistry {
            constructor() {
                this.modules = new Map();
                this.activeModules = new Set();
            }

            register(moduleId, ModuleClass, config = {}) {
                try {
                    const instance = new ModuleClass();
                    const boundary = new ErrorBoundary(moduleId, instance);
                    const wrappedInstance = boundary.wrapAll();

                    this.modules.set(moduleId, {
                        instance: wrappedInstance,
                        class: ModuleClass,
                        config,
                        boundary,
                        createdAt: Date.now()
                    });

                    window.aviaHealth?.register(moduleId, wrappedInstance);
                    console.log(`✅ Module '${moduleId}' registered successfully`);

                    return wrappedInstance;
                } catch (error) {
                    console.error(`❌ Failed to register module '${moduleId}':`, error);
                    return null;
                }
            }

            get(moduleId) {
                return this.modules.get(moduleId)?.instance;
            }

            has(moduleId) {
                return this.modules.has(moduleId);
            }

            activate(moduleId) {
                this.activeModules.add(moduleId);
                window.aviaEventBus?.emit('module:activated', { moduleId }, 'Registry');
            }

            deactivate(moduleId) {
                this.activeModules.delete(moduleId);
                window.aviaEventBus?.emit('module:deactivated', { moduleId }, 'Registry');
            }

            getAll() {
                const result = {};
                this.modules.forEach((data, id) => {
                    result[id] = {
                        title: data.instance.title,
                        active: this.activeModules.has(id),
                        status: window.aviaHealth?.getStatus(id)
                    };
                });
                return result;
            }
        }

        // Inicializar sistemas globales
        window.aviaEventBus = new AVIAEventBus();
        window.aviaHealth = new ModuleHealthMonitor();
        window.aviaRegistry = new ModuleRegistry();

        console.log('🚀 AVIA Modular Architecture initialized');

        function showCustomPrompt(message, defaultValue = '') {
            return new Promise((resolve) => {
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-50 modal-backdrop flex items-center justify-center z-50 fade-in';
                modal.innerHTML = `
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 border-l-8 border-blue-500 relative">
                        <!-- Botón de acción: Aceptar -->
                        <button class="ok-btn absolute top-4 right-20 w-12 h-12 bg-black hover:bg-gray-800 dark:hover:bg-gray-900 rounded-full flex items-center justify-center transition-all hover:scale-110" style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);" title="Aceptar">
                            <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                        </button>

                        <!-- Botón cerrar (X) superior derecha -->
                        <button class="close-btn absolute top-4 right-4 w-12 h-12 bg-white hover:bg-gray-100 dark:bg-gray-700 dark:hover:bg-gray-600 rounded-full flex items-center justify-center transition-all hover:scale-110" style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);" title="Cerrar">
                            <svg class="w-5 h-5 fill-gray-800 dark:fill-gray-200" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        </button>

                        <p class="text-gray-700 dark:text-gray-300 mb-4 text-lg font-medium pr-32">${message}</p>
                        <input type="text" value="${defaultValue}"
                               class="w-full px-4 py-3 text-base bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 border-2 border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 mb-4">
                    </div>
                `;
                document.body.appendChild(modal);

                const input = modal.querySelector('input');
                input.focus();
                input.select();

                modal.querySelector('.close-btn').onclick = () => {
                    document.body.removeChild(modal);

            inputDigit(digit) {
                if (this.waitingForOperand) {
                    this.currentValue = String(digit);
                    this.waitingForOperand = false;
                } else {
                    this.currentValue = this.currentValue === '0' ? String(digit) : this.currentValue + digit;
                }
                this.updateDisplay();
            }

            inputOperator(op) {
                const value = parseFloat(this.currentValue);
                if (this.previousValue === '') {
                    this.previousValue = value;
                } else if (this.operation) {
                    const result = this.performOperation(this.previousValue, value, this.operation);
                    this.currentValue = String(result);
                    this.previousValue = result;
                }
                this.waitingForOperand = true;
                this.operation = op;
            }

            performOperation(prev, current, op) {
                switch (op) {
                    case '+': return prev + current;
                    case '-': return prev - current;
                    case '*': return prev * current;
                    case '/': return prev / current;
                    case '%': return prev % current;
                    default: return current;
                }
            }

            calculate() {
                const value = parseFloat(this.currentValue);
                if (this.previousValue !== '' && this.operation) {
                    const result = this.performOperation(this.previousValue, value, this.operation);
                    const expr = `${this.previousValue} ${this.operation} ${value} = ${result}`;
                    this.history.unshift(expr);
                    if (this.history.length > 10) this.history.pop();
                    this.currentValue = String(result);
                    this.previousValue = '';
                    this.operation = null;
                    this.updateDisplay();
                    this.updateHistory();
                }
            }

            clear() {
                this.currentValue = '0';
                this.previousValue = '';
                this.operation = null;
                this.updateDisplay();
            }

            delete() {
                this.currentValue = this.currentValue.slice(0, -1) || '0';
                this.updateDisplay();
            }

            updateDisplay() {
                const display = document.getElementById('calcDisplay');
                if (display) display.value = this.currentValue;
            }

            updateHistory() {
                const histEl = document.getElementById('calcHistory');
                if (histEl) {
                    histEl.innerHTML = this.history.map(h => `<div>${h}</div>`).join('');
                }
            }
        }

            loadConfig() {
                this.config = {
                    theme: {

                    },

                        { id: "users", title: "Usuarios Activos", icon: "👥", format: "number", color: "blue" },
                        { id: "revenue", title: "Ingresos", icon: "💰", format: "currency", color: "green" },
                        { id: "conversions", title: "Conversiones", icon: "🎯", format: "percentage", color: "purple" },
                        { id: "satisfaction", title: "Satisfacción", icon: "⭐", format: "rating", color: "yellow" }

            generateSampleData() {
                const now = new Date();
                const days = 30;

                this.data = {
                    kpiValues: {
                        users: { current: 12543, previous: 11234, trend: "up" },
                        revenue: { current: 45678.90, previous: 42345.50, trend: "up" },
                        conversions: { current: 3.45, previous: 3.12, trend: "up" },
                        satisfaction: { current: 4.7, previous: 4.5, trend: "up" }
                    },
                    timeSeries: Array.from({length: days}, (_, i) => ({
                        date: new Date(now.getTime() - (days - i - 1) * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                        users: Math.floor(10000 + Math.random() * 5000),
                        revenue: Math.floor(40000 + Math.random() * 20000)
                    })),
                    categories: [
                        { name: "Producto A", value: 35, revenue: 15000 },
                        { name: "Producto B", value: 25, revenue: 12000 },
                        { name: "Producto C", value: 20, revenue: 10000 },
                        { name: "Producto D", value: 12, revenue: 6000 },

                    performance: {

                        Calidad: 92,
                        Usabilidad: 88,
                        Seguridad: 95,
                        SEO: 78,
                        Accesibilidad: 90
                    }
                };

            setupEventListeners() {
                document.querySelectorAll('.time-range-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.time-range-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentRange = e.target.dataset.range;
                        this.generateSampleData();
                        this.renderKPIs();
                        this.renderCharts();
                    });
                });
            }

            renderKPIs() {
                const container = document.getElementById('kpiContainer');
                if (!container) return;

                container.innerHTML = '';

                this.config.kpis.forEach(kpi => {
                    const data = this.data.kpiValues[kpi.id];
                    const change = ((data.current - data.previous) / data.previous * 100).toFixed(1);

                    const card = document.createElement('div');
                    // Fondo gris para no parecer botones - más compacto
                    card.className = 'bg-gray-100 dark:bg-gray-700 rounded-lg p-3 shadow-sm border-l-4 border-gray-400 dark:border-gray-500';
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div class="text-2xl">${kpi.icon}</div>
                            <span class="text-xs bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-300 px-2 py-1 rounded">${data.trend === 'up' ? '📈' : '📉'} ${change}%</span>
                        </div>
                        <div class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-1">${this.formatValue(data.current, kpi.format)}</div>
                        <div class="text-xs text-gray-600 dark:text-gray-400">${kpi.title}</div>
                    `;
                    container.appendChild(card);
                });

            renderCharts() {
                this.renderLineChart();
                this.renderBarChart();
                this.renderPieChart();
                this.renderRadarChart();
            }

            renderLineChart() {
                const ctx = document.getElementById('lineChart');
                if (!ctx) return;
                if (this.charts.line) this.charts.line.destroy();

                this.charts.line = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: this.data.timeSeries.map(d => d.date.split('-')[2]),
                        datasets: [{
                            label: 'Usuarios',
                            data: this.data.timeSeries.map(d => d.users),
                            borderColor: this.config.theme.chartColors[0],
                            backgroundColor: this.config.theme.chartColors[0] + '20',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: false } }
                    }
                });
            }

            renderBarChart() {
                const ctx = document.getElementById('barChart');
                if (!ctx) return;
                if (this.charts.bar) this.charts.bar.destroy();

                this.charts.bar = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: this.data.categories.map(c => c.name),
                        datasets: [{
                            label: 'Ingresos',
                            data: this.data.categories.map(c => c.revenue),
                            backgroundColor: this.config.theme.chartColors
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: false } }
                    }
                });
            }

            renderPieChart() {
                const ctx = document.getElementById('pieChart');
                if (!ctx) return;
                if (this.charts.pie) this.charts.pie.destroy();

                this.charts.pie = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: this.data.categories.map(c => c.name),
                        datasets: [{
                            data: this.data.categories.map(c => c.value),
                            backgroundColor: this.config.theme.chartColors
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
            }

            renderRadarChart() {
                const ctx = document.getElementById('radarChart');
                if (!ctx) return;
                if (this.charts.radar) this.charts.radar.destroy();

                this.charts.radar = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: Object.keys(this.data.performance),
                        datasets: [{
                            label: 'Rendimiento',
                            data: Object.values(this.data.performance),
                            backgroundColor: this.config.theme.chartColors[4] + '40',
                            borderColor: this.config.theme.chartColors[4],
                            pointBackgroundColor: this.config.theme.chartColors[4]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            r: {
                                beginAtZero: true,
                                max: 100
                            }
                        }
                    }
                });
            }

            formatValue(value, format) {
                switch(format) {
                    case 'currency':
                        return '$' + value.toLocaleString('es-ES', {minimumFractionDigits: 2});
                    case 'percentage':
                        return value.toFixed(2) + '%';
                    case 'rating':
                        return '⭐ ' + value.toFixed(1);
                    default:
                        return value.toLocaleString();
                }
            }

            nextPage() {
                this.currentPage = 1;
                document.getElementById('chartsPage1').classList.add('hidden');
                document.getElementById('chartsPage2').classList.remove('hidden');
                // Ocultar botón siguiente (no hay más páginas)
                document.getElementById('nextPageBtn').classList.add('hidden');
                // Mostrar botón anterior
                document.getElementById('prevPageBtn').classList.remove('hidden');
            }

            previousPage() {
                this.currentPage = 0;
                document.getElementById('chartsPage1').classList.remove('hidden');
                document.getElementById('chartsPage2').classList.add('hidden');
                // Mostrar botón siguiente
                document.getElementById('nextPageBtn').classList.remove('hidden');
                // Ocultar botón anterior (ya estamos en la primera página)
                document.getElementById('prevPageBtn').classList.add('hidden');
            }

            destroy() {
                if (this.charts.line) this.charts.line.destroy();
                if (this.charts.bar) this.charts.bar.destroy();
                if (this.charts.pie) this.charts.pie.destroy();
                if (this.charts.radar) this.charts.radar.destroy();
            }
        }

            renderCalendar() {
                const monthEl = document.getElementById('calendarMonth');
                const gridEl = document.getElementById('calendarGrid');
                const yearEl = document.getElementById('calendarYear');
                const currentDateTextEl = document.getElementById('currentDateText');
                if (!monthEl || !gridEl) return;

                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();

                // Actualizar título del mes
                const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                                   'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                const dayNames = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

                monthEl.textContent = monthNames[month];

                // Actualizar año
                if (yearEl) {
                    yearEl.textContent = year;
                }

                // Actualizar fecha completa basada en el día seleccionado
                if (currentDateTextEl && this.selectedDate) {
                    const selectedDateObj = new Date(this.selectedDate + 'T00:00:00');
                    const dayName = dayNames[selectedDateObj.getDay()];
                    const dayNum = selectedDateObj.getDate();
                    const monthName = monthNames[selectedDateObj.getMonth()];
                    const yearNum = selectedDateObj.getFullYear();
                    currentDateTextEl.textContent = `${dayName} ${dayNum} de ${monthName} ${yearNum}`;
                }

                // Calcular primer día del mes y total de días
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const today = new Date();

                // Limpiar grid
                gridEl.innerHTML = '';

                // Días vacíos al inicio
                for (let i = 0; i < firstDay; i++) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'aspect-square';
                    gridEl.appendChild(emptyDiv);
                }

                // Días del mes
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = this.formatDate(new Date(year, month, day));
                    const dayEvents = this.events.filter(e => e.date === dateStr);
                    const isToday = today.getDate() === day &&
                                   today.getMonth() === month &&
                                   today.getFullYear() === year;
                    const isSelected = this.selectedDate === dateStr;

                    const dayDiv = document.createElement('div');
                    // Si está seleccionado: fondo azul con número blanco
                    // Si es hoy pero no seleccionado: borde verde
                    // Si tiene eventos: indicador morado
                    if (isSelected) {
                        dayDiv.className = 'aspect-square p-2 rounded-lg cursor-pointer transition-all bg-blue-500 hover:bg-blue-600';
                        dayDiv.innerHTML = `
                            <div class="text-center font-bold text-white text-2xl">${day}</div>
                            ${dayEvents.length > 0 ? `<div class="text-xs text-center text-white font-bold mt-1">${dayEvents.length} 🔔</div>` : ''}
                        `;
                    } else {
                        dayDiv.className = `aspect-square p-2 rounded-lg cursor-pointer transition-all border-2 ${
                            isToday ? 'border-green-500 bg-green-50 dark:bg-green-900/30' :
                            'border-gray-200 dark:border-gray-700 hover:border-blue-300 dark:hover:border-blue-600'
                        } ${dayEvents.length > 0 ? 'bg-purple-50 dark:bg-purple-900/20' : 'bg-white dark:bg-gray-800'}`;

                        dayDiv.innerHTML = `
                            <div class="text-center font-semibold text-gray-800 dark:text-gray-100 text-xl">${day}</div>
                            ${dayEvents.length > 0 ? `<div class="text-xs text-center text-purple-600 dark:text-purple-400 font-bold mt-1">${dayEvents.length} 🔔</div>` : ''}
                        `;
                    }

                    dayDiv.onclick = () => {
                        if (this.selectedDate === dateStr) {
                            // Si hacemos clic en el día ya seleccionado, mostramos/editamos eventos
                            this.openDayEventsModal(dateStr);
                        } else {
                            // Si no, lo seleccionamos
                            this.selectedDate = dateStr;
                            this.renderCalendar();
                        }
                    };

                    gridEl.appendChild(dayDiv);
                }
            }


            async editMonth() {
                const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                                   'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                const currentMonth = monthNames[this.currentDate.getMonth()];
                const newMonth = await showCustomPrompt('Ingresa el mes:', currentMonth);
                if (newMonth) {
                    const monthIndex = monthNames.findIndex(m => m.toLowerCase() === newMonth.toLowerCase());
                    if (monthIndex !== -1) {
                        this.currentDate.setMonth(monthIndex);
                        // Mantener el día seleccionado en el 6 del nuevo mes
                        const year = this.currentDate.getFullYear();
                        this.selectedDate = `${year}-${String(monthIndex + 1).padStart(2, '0')}-06`;
                        this.renderCalendar();
                    } else {
                        await showCustomAlert('Mes inválido. Usa el nombre completo del mes.');
                    }
                }
            }

            async editYear() {
                const currentYear = this.currentDate.getFullYear();
                const newYear = await showCustomPrompt('Ingresa el año:', currentYear.toString());
                if (newYear) {
                    const yearNum = parseInt(newYear);
                    if (!isNaN(yearNum) && yearNum > 1900 && yearNum < 2100) {
                        this.currentDate.setFullYear(yearNum);
                        // Mantener el día seleccionado en el 6 del nuevo año
                        const month = this.currentDate.getMonth();
                        this.selectedDate = `${yearNum}-${String(month + 1).padStart(2, '0')}-06`;
                        this.renderCalendar();
                    } else {
                        await showCustomAlert('Año inválido. Usa un año entre 1900 y 2100.');
                    }
                }
            }

            nextDay() {
                if (!this.selectedDate) {
                    // Si no hay día seleccionado, seleccionar hoy
                    this.selectedDate = this.formatDate(new Date());
                } else {
                    // Avanzar al siguiente día
                    const currentSelected = new Date(this.selectedDate + 'T00:00:00');
                    currentSelected.setDate(currentSelected.getDate() + 1);
                    this.selectedDate = this.formatDate(currentSelected);

                    // Si cambiamos de mes, actualizar el mes mostrado
                    if (currentSelected.getMonth() !== this.currentDate.getMonth() ||
                        currentSelected.getFullYear() !== this.currentDate.getFullYear()) {
                        this.currentDate = new Date(currentSelected);
                    }
                }
                this.renderCalendar();
            }

                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p class="text-gray-500 mb-6">No hay eventos programados para este día.</p>'}
                    </div>
                `;
                document.body.appendChild(modal);

                // Botón cerrar (X) superior derecha
                modal.querySelector('.close-btn').onclick = () => {
                    document.body.removeChild(modal);
                };

                // Botón de acción: Nuevo Evento
                modal.querySelector('.action-btn').onclick = () => {
                    this.addEventFromModal(dateStr);
                };
            }

            async deleteEventFromModal(eventId, dateStr) {
                const confirmed = await showCustomConfirm('¿Eliminar este evento?');
                if (confirmed) {
                    this.events = this.events.filter(e => e.id !== eventId);
                    this.saveEvents();
                    // Cerrar modal actual
                    const modal = document.querySelector('.modal-backdrop');
                    if (modal) document.body.removeChild(modal);
                    // Reabrir modal actualizado
                    this.openDayEventsModal(dateStr);
                    this.renderCalendar();
                }
            }

            async showAddEventForm() {
                // Usar el día seleccionado o hoy
                const dateStr = this.selectedDate || this.formatDate(new Date());
                const title = await showCustomPrompt('Título del evento:');
                if (!title) return;

                const time = await showCustomPrompt('Hora (HH:MM):', '09:00');
                if (!time) return;

                const description = await showCustomPrompt('Descripción (opcional):', '');

                this.events.push({
                    id: Date.now(),
                    date: dateStr,
                    time: time,
                    title: title,
                    description: description || ''
                });

                this.saveEvents();
                this.renderCalendar();
            }

            async addEventFromModal(dateStr) {
                const modal = document.querySelector('.modal-backdrop');
                if (modal) document.body.removeChild(modal);

                const title = await showCustomPrompt('Título del evento:');
                if (!title) return;

                const time = await showCustomPrompt('Hora (HH:MM):', '09:00');
                if (!time) return;

                const description = await showCustomPrompt('Descripción (opcional):', '');

                this.events.push({
                    id: Date.now(),
                    date: dateStr,
                    time: time,
                    title: title,
                    description: description || ''
                });

                this.saveEvents();
                this.renderCalendar();
                this.openDayEventsModal(dateStr);
            }

            formatDate(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
        }

            switchPersona(personaKey) {
                this.activePersona = personaKey;

            async sendMessage() {
                const input = document.getElementById('aviaInput');
                if (!input || !input.value.trim()) return;

                const message = input.value.trim();
                input.value = '';

                // Agregar mensaje del usuario
                this.messages.push({
                    role: 'user',
                    content: message,
                    timestamp: Date.now()
                });

                // Verificar si es un comando
                if (message.startsWith('/')) {
                    this.executeCommand(message);
                    return;
                }

                // Mostrar estado de carga
                const loadingMsg = {
                    role: 'assistant',
                    content: 'Pensando...',
                    status: 'loading',
                    timestamp: Date.now()
                };
                this.messages.push(loadingMsg);
                this.updateMessages();

                // Enviar a Poe API si está disponible
                if (typeof window.Poe !== 'undefined') {
                    try {
                        const persona = this.personas[this.activePersona];
                        const fullPrompt = `${persona.prompt}\n\nUsuario: ${message}`;

                        await window.Poe.sendUserMessage(`@Claude-Sonnet-4.5 ${fullPrompt}`, {
                            handler: 'avia-assistant',
                            stream: true,
                            openChat: false,
                            handlerContext: { originalMessage: message }
                        });
                    } catch (error) {
                        console.error('Error sending to Poe:', error);
                        this.messages.pop(); // Remover loading
                        this.messages.push({
                            role: 'error',
                            content: `Error al comunicar con IA: ${error.message}`,
                            timestamp: Date.now()
                        });
                        this.updateMessages();
                    }
                } else {
                    // Fallback: respuesta simulada
                    this.messages.pop(); // Remover loading
                    this.messages.push({
                        role: 'assistant',
                        content: this.getLocalResponse(message),
                        timestamp: Date.now()
                    });
                    this.updateMessages();
                }
            }

            handlePoeResponse(result, context) {
                const msg = result.responses[0];

                // Remover mensaje de loading
                this.messages = this.messages.filter(m => m.status !== 'loading');

                if (msg.status === 'error') {
                    this.messages.push({
                        role: 'error',
                        content: `Error: ${msg.statusText}`,
                        timestamp: Date.now()
                    });
                } else if (msg.status === 'incomplete' || msg.status === 'complete') {
                    // Buscar si ya existe un mensaje del asistente siendo actualizado
                    const lastMsg = this.messages[this.messages.length - 1];
                    if (lastMsg && lastMsg.role === 'assistant' && lastMsg.messageId === msg.messageId) {
                        // Actualizar mensaje existente
                        lastMsg.content = msg.content;
                        lastMsg.status = msg.status;
                    } else {
                        // Crear nuevo mensaje
                        this.messages.push({
                            role: 'assistant',
                            content: msg.content,
                            status: msg.status,
                            messageId: msg.messageId,
                            timestamp: Date.now()
                        });
                    }
                }

                this.updateMessages();
            }

            executeCommand(command) {
                const cmd = command.split(' ')[0];

                switch (cmd) {
                    case '/help':
                        this.showHelp();
                        break;
                    case '/salud-sistema':
                        this.checkSystemHealth();
                        break;
                    case '/resumen-dia':
                        this.generateDailySummary();
                        break;
                    case '/analizar-tareas':
                        this.analyzeTasks();
                        break;
                    case '/optimizar':
                        this.optimizeSystem();
                        break;
                    default:
                        this.messages.push({
                            role: 'error',
                            content: `Comando no reconocido: ${cmd}. Usa /help para ver comandos disponibles.`,
                            timestamp: Date.now()
                        });
                }

                this.updateMessages();
            }

            showHelp() {
                const helpText = Object.entries(this.commands)
                    .map(([cmd, desc]) => `${cmd} - ${desc}`)
                    .join('\n');

                this.messages.push({
                    role: 'assistant',
                    content: `📚 Comandos Disponibles:\n\n${helpText}`,
                    timestamp: Date.now()
                });
            }

            checkSystemHealth() {
                const status = window.aviaHealth?.getAllStatus() || {};
                const moduleCount = Object.keys(status).length;
                const healthyCount = Object.values(status).filter(s => s.status === 'healthy').length;
                const warningCount = Object.values(status).filter(s => s.status === 'warning').length;
                const criticalCount = Object.values(status).filter(s => s.status === 'critical').length;

                let report = `🏥 Estado del Sistema AVIA\n\n`;
                report += `📊 Total de módulos: ${moduleCount}\n`;
                report += `✅ Saludables: ${healthyCount}\n`;
                report += `⚠️ Advertencias: ${warningCount}\n`;
                report += `🔴 Críticos: ${criticalCount}\n\n`;

                if (criticalCount > 0 || warningCount > 0) {
                    report += `Detalles de problemas:\n`;
                    Object.entries(status).forEach(([id, info]) => {
                        if (info.status !== 'healthy') {
                            report += `\n- ${id}: ${info.status} (${info.errorCount} errores)`;
                            if (info.lastError) {
                                report += `\n  Último error: ${info.lastError.message}`;
                            }
                        }
                    });
                }

                this.messages.push({
                    role: 'assistant',
                    content: report,
                    timestamp: Date.now()
                });
            }

            generateDailySummary() {
                const tasks = window._appStorage?.tasks || [];
                const completedTasks = tasks.filter(t => t.completed).length;
                const pendingTasks = tasks.filter(t => !t.completed).length;
                const notes = window._appStorage?.notes || [];
                const events = window._appStorage?.calendarEvents || [];

                const today = new Date().toISOString().split('T')[0];
                const todayEvents = events.filter(e => e.date === today);

                let summary = `📊 Resumen del Día\n\n`;
                summary += `📋 Tareas:\n`;
                summary += `  ✅ Completadas: ${completedTasks}\n`;
                summary += `  ⏳ Pendientes: ${pendingTasks}\n\n`;
                summary += `📝 Notas totales: ${notes.length}\n`;
                summary += `📅 Eventos hoy: ${todayEvents.length}\n\n`;

                if (todayEvents.length > 0) {
                    summary += `Eventos de hoy:\n`;
                    todayEvents.forEach(e => {
                        summary += `  • ${e.time} - ${e.title}\n`;
                    });
                }

                this.messages.push({
                    role: 'assistant',
                    content: summary,
                    timestamp: Date.now()
                });
            }

            analyzeTasks() {
                const tasks = window._appStorage?.tasks || [];
                const pending = tasks.filter(t => !t.completed);

                let analysis = `🎯 Análisis de Tareas\n\n`;

                if (pending.length === 0) {
                    analysis += `¡Excelente! No tienes tareas pendientes. 🎉\n`;
                    analysis += `Considera revisar tus objetivos a largo plazo.`;
                } else {
                    analysis += `Tienes ${pending.length} tareas pendientes.\n\n`;
                    analysis += `Sugerencias de priorización:\n\n`;

                    pending.slice(0, 5).forEach((task, i) => {
                        analysis += `${i + 1}. ${task.title}\n`;
                    });

                    if (pending.length > 5) {
                        analysis += `\n... y ${pending.length - 5} tareas más.\n`;
                    }

                    analysis += `\n💡 Consejo: Usa la técnica Pomodoro para mantener el enfoque.`;
                }

                this.messages.push({
                    role: 'assistant',
                    content: analysis,
                    timestamp: Date.now()
                });
            }

            optimizeSystem() {
                this.messages.push({
                    role: 'assistant',
                    content: `🚀 Optimizando sistema AVIA...\n\nComprobando módulos, limpiando caché y verificando integridad...\n\n✅ Sistema optimizado correctamente.`,
                    timestamp: Date.now()
                });

                window.aviaEventBus?.emit('system:optimized', {}, 'AVIAAssistant');
            }

            getLocalResponse(message) {
                const lowerMsg = message.toLowerCase();

                if (lowerMsg.includes('hola') || lowerMsg.includes('hi')) {
                    return `¡Hola! Soy ${this.personas[this.activePersona].name}. ¿En qué puedo ayudarte hoy?`;
                }

                if (lowerMsg.includes('ayuda') || lowerMsg.includes('help')) {
                    return `Puedo ayudarte con:\n\n- Análisis de tareas y productividad\n- Gestión de calendario y eventos\n- Generación de narrativas transmedia\n- Optimización del sistema\n\nPrueba comandos como /help, /salud-sistema o /resumen-dia`;
                }

                return `Entiendo tu mensaje: "${message}"\n\nPara funcionalidad completa de IA, asegúrate de que la Poe Embed API esté disponible. Mientras tanto, puedo ayudarte con comandos del sistema. Escribe /help para ver opciones.`;
            }

            updateMessages() {
                const container = document.getElementById('aviaChatMessages');
                if (container) {
                    container.innerHTML = this.renderMessages();
                    container.scrollTop = container.scrollHeight;
                }
            }

            reset() {
                this.messages = [];
                this.renderFloatingPanel();
            }
        }

            // AI Generation
            async generateWithAI() {
                if (!this.currentScript) return;

                const template = this.templates[this.currentScript.template];
                const concept = this.currentScript.concept || 'una historia original';

                if (typeof window.Poe !== 'undefined') {
                    const fullPrompt = `${template.prompt}\n\nConcepto: ${concept}\n\nCrea un guion profesional y detallado. Incluye formato de guion estándar con ESCENAS, DIÁLOGOS y ACOTACIONES.`;

                    try {
                        showCustomAlert('🤖 Generando guion con IA... Esto puede tomar unos momentos.');

                        await window.Poe.sendUserMessage(`@Claude-Sonnet-4.5 ${fullPrompt}`, {
                            handler: 'script-generator-ai',
                            stream: false,
                            openChat: false,
                            handlerContext: { scriptId: this.currentScript.id }
                        });

                        // Registrar handler si no existe
                        if (!window._scriptGenHandlerRegistered) {
                            window.Poe.registerHandler('script-generator-ai', (result, context) => {
                                const msg = result.responses[0];
                                if (msg.status === 'complete') {
                                    const script = this.scripts.find(s => s.id === context.scriptId);
                                    if (script) {
                                        script.content = msg.content;
                                        this.currentScript = script;
                                        this.saveScripts();
                                        this.renderCurrentView();
                                        showCustomAlert('✅ Guion generado exitosamente con IA');
                                    }
                                } else if (msg.status === 'error') {
                                    showCustomAlert(`❌ Error al generar: ${msg.statusText}`);
                                }
                            });
                            window._scriptGenHandlerRegistered = true;
                        }
                    } catch (error) {
                        showCustomAlert(`❌ Error: ${error.message}`);
                    }
                } else {
                    // Fallback sin Poe API
                    this.currentScript.content = this.generateLocalScript(template, concept);
                    this.saveScripts();
                    this.renderCurrentView();
                    showCustomAlert('✅ Guion de ejemplo generado (Poe API no disponible)');
                }
            }

            generateLocalScript(template, concept) {
                return `TÍTULO: ${this.currentScript.title.toUpperCase()}

=====================================

${template.structure.map((section, i) => `

Descripción de la escena...

PERSONAJE

(Acotación)

---
`).join('\n')}

FIN

=====================================
Generado por AVIA-Studio

                    scene.title = newTitle;
                    const newDesc = await showCustomPrompt('Descripción:', scene.description);
                    if (newDesc) scene.description = newDesc;
                    this.saveScripts();
                    this.renderCurrentView();

                    this.saveScripts();
                    this.renderCurrentView();

            async generateSceneImage(scriptId, sceneIndex) {
                const script = this.scripts.find(s => s.id === scriptId);
                if (!script || !script.storyboard[sceneIndex]) return;

                const scene = script.storyboard[sceneIndex];

                if (typeof window.Poe !== 'undefined') {
                    try {
                        showCustomAlert('🎨 Generando imagen con IA... Esto puede tardar un momento.');

                        const imagePrompt = `${scene.description}. Cinematographic shot, professional lighting, detailed --aspect 16:9`;

                        await window.Poe.sendUserMessage(`@FLUX-pro-1.1 ${imagePrompt}`, {
                            handler: 'storyboard-image-gen',
                            stream: false,
                            openChat: false,
                            handlerContext: { scriptId, sceneIndex }
                        });

                        // Registrar handler
                        if (!window._storyboardImageHandlerRegistered) {
                            window.Poe.registerHandler('storyboard-image-gen', (result, context) => {
                                const msg = result.responses[0];
                                if (msg.status === 'complete' && msg.attachments && msg.attachments.length > 0) {
                                    const imageUrl = msg.attachments[0].url;
                                    const script = this.scripts.find(s => s.id === context.scriptId);
                                    if (script && script.storyboard[context.sceneIndex]) {
                                        script.storyboard[context.sceneIndex].imageUrl = imageUrl;
                                        this.currentScript = script;
                                        this.saveScripts();
                                        this.renderCurrentView();
                                        showCustomAlert('✅ Imagen generada exitosamente');
                                    }
                                } else if (msg.status === 'error') {
                                    showCustomAlert(`❌ Error: ${msg.statusText}`);
                                }
                            });
                            window._storyboardImageHandlerRegistered = true;
                        }
                    } catch (error) {
                        showCustomAlert(`❌ Error: ${error.message}`);
                    }
                } else {
                    showCustomAlert('⚠️ Poe API no disponible. Conecta con Poe para generar imágenes.');
                }
            }

                if (!this.currentScript) return;

                const content = `${this.currentScript.title}
=====================================
${this.templates[this.currentScript.template].name}
Creado: ${new Date(this.currentScript.createdAt).toLocaleDateString()}

CONCEPTO:
${this.currentScript.concept || 'Sin concepto'}

GUION:
${this.currentScript.content || 'Sin contenido'}

=====================================
Generado por AVIA-Studio
Ecosistema AVIA
`;

                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;

                URL.revokeObjectURL(url);

                showCustomAlert('📄 Guion exportado exitosamente');

                    </div>
                `;

                this.lastGeneratedContent = markdown;
                this.lastGeneratedTitle = title;
            }

            downloadDocs(title) {
                if (!this.lastGeneratedContent) return;

                const blob = new Blob([this.lastGeneratedContent], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AVIA_${title.replace(/[^a-zA-Z0-9]/g, '_')}_${Date.now()}.md`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showCustomAlert('📄 Documentación descargada exitosamente');
            }

            reset() {
                this.lastGeneratedContent = null;
                this.lastGeneratedTitle = null;
            }
        }

        class PomodoroModule {
            constructor() {

                this.color = 'orange';

                this.timeLeft = this.workTime;
                this.isWork = true;
                this.isRunning = false;
                this.interval = null;
            }

            render(container) {
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto">
                        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 text-center border-l-8 border-purple-500">
                            <div id="pomodoroMode" class="text-2xl font-bold mb-6 text-gray-800 dark:text-gray-100">
                                💼 Trabajo
                            </div>
                            <div id="pomodoroTimer" class="text-8xl font-bold mb-8 text-purple-600 dark:text-purple-400">
                                25:00
                            </div>
                            <div class="flex gap-4 justify-center flex-wrap">
                                <button id="pomodoroStart" onclick="pomodoro.toggle()"
                                        class="px-8 py-4 bg-green-500 hover:bg-green-600 text-white rounded-lg text-xl font-bold transition-colors">
                                    ▶️ Iniciar
                                </button>
                                <button onclick="pomodoro.reset()"
                                        class="px-8 py-4 bg-red-500 hover:bg-red-600 text-white rounded-lg text-xl font-bold transition-colors">
                                    🔄 Reiniciar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                window.pomodoro = this;
                this.updateDisplay();
            }

            toggle() {
                this.isRunning = !this.isRunning;
                const btn = document.getElementById('pomodoroStart');

                if (this.isRunning) {
                    btn.textContent = '⏸️ Pausar';
                    btn.className = 'px-8 py-4 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg text-xl font-bold transition-colors';
                    this.start();
                } else {
                    btn.textContent = '▶️ Iniciar';
                    btn.className = 'px-8 py-4 bg-green-500 hover:bg-green-600 text-white rounded-lg text-xl font-bold transition-colors';
                    this.pause();
                }
            }

            start() {
                this.interval = setInterval(() => {
                    this.timeLeft--;
                    if (this.timeLeft <= 0) {
                        this.switchMode();
                    }
                    this.updateDisplay();
                }, 1000);
            }

            pause() {
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }
            }

            reset() {
                this.pause();
                this.isRunning = false;
                this.timeLeft = this.isWork ? this.workTime : this.breakTime;
                const btn = document.getElementById('pomodoroStart');
                btn.textContent = '▶️ Iniciar';
                btn.className = 'px-8 py-4 bg-green-500 hover:bg-green-600 text-white rounded-lg text-xl font-bold transition-colors';
                this.updateDisplay();
            }

            async switchMode() {
                this.isWork = !this.isWork;
                this.timeLeft = this.isWork ? this.workTime : this.breakTime;
                await showCustomAlert(this.isWork ? '¡Tiempo de trabajar!' : '¡Toma un descanso!');
            }

            updateDisplay() {
                const minutes = Math.floor(this.timeLeft / 60);
                const seconds = this.timeLeft % 60;
                const display = document.getElementById('pomodoroTimer');
                const mode = document.getElementById('pomodoroMode');

                if (display) {
                    display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                }
                if (mode) {
                    mode.textContent = this.isWork ? '💼 Trabajo' : '☕ Descanso';
                }
            }

            destroy() {
                this.pause();
            }
        }

            renderCategory(categoryId) {
                const category = this.categories[categoryId];
                if (!category) return '';

                const currentPage = this.currentPages[categoryId] || 0;
                const totalPages = category.pages.length;
                const items = category.pages[currentPage];

                const colorClasses = {
                    red: 'bg-red-500/20 dark:bg-red-600/30 border-red-600',
                    green: 'bg-green-500/20 dark:bg-green-600/30 border-green-600',
                    yellow: 'bg-yellow-500/20 dark:bg-yellow-600/30 border-yellow-600',
                    blue: 'bg-blue-500/20 dark:bg-blue-600/30 border-blue-600'
                };

                const showNextBtn = currentPage < totalPages - 1;
                const showPrevBtn = currentPage > 0;

                return `
                    <div class="mb-8">
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-4">${category.icon} ${category.title}</h3>
                        <div class="relative">
                            <!-- Botón Anterior (triángulo izquierda con -) -->
                            ${showPrevBtn ? `
                                <button onclick="configManager.previousPage('${categoryId}')"
                                    class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-16 z-10 hover:scale-110 transition-all"
                                    style="width: 0; height: 0; border-top: 30px solid transparent; border-bottom: 30px solid transparent; border-right: 45px solid white; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">

                                    </div>
                                </button>
                            ` : ''}

                            <!-- Grid de subcategorías -->

                                ${items.map(item => `
                                    <button onclick="${item.moduleId ? `app.closeConfigAndShow('${item.moduleId}')` : 'void(0)'}"
                                        class="p-6 ${colorClasses[item.color]} rounded-xl border-l-8 hover:scale-105 transition-all text-left ${!item.moduleId ? 'opacity-70' : ''}">
                                        <div class="text-4xl mb-2">${item.icon}</div>
                                        <h4 class="text-lg font-bold text-gray-800 dark:text-gray-100 mb-1">${item.name}</h4>
                                        <p class="text-xs text-gray-600 dark:text-gray-400">${item.desc}</p>
                                    </button>
                                `).join('')}
                            </div>

                            <!-- Botón Siguiente (triángulo derecha con +) -->
                            ${showNextBtn ? `
                                <button onclick="configManager.nextPage('${categoryId}')"
                                    class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-16 z-10 hover:scale-110 transition-all"
                                    style="width: 0; height: 0; border-top: 30px solid transparent; border-bottom: 30px solid transparent; border-left: 45px solid #1a1a1a; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">
                                    <div class="absolute right-1/2 top-1/2 translate-x-1/2 -translate-y-1/2 flex items-center justify-center" style="right: 31px;">
                                        <span class="text-3xl text-white font-bold">+</span>
                                    </div>
                                </button>
                            ` : `
                                <div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-16 z-10 opacity-30"
                                    style="width: 0; height: 0; border-top: 30px solid transparent; border-bottom: 30px solid transparent; border-left: 45px solid #1a1a1a; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">
                                    <div class="absolute right-1/2 top-1/2 translate-x-1/2 -translate-y-1/2 flex items-center justify-center" style="right: 31px;">
                                        <span class="text-3xl text-white font-bold opacity-50">+</span>
                                    </div>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }

            nextPage(categoryId) {
                const category = this.categories[categoryId];
                const currentPage = this.currentPages[categoryId] || 0;
                if (currentPage < category.pages.length - 1) {
                    this.currentPages[categoryId] = currentPage + 1;
                    this.refresh();
                }
            }

            previousPage(categoryId) {
                const currentPage = this.currentPages[categoryId] || 0;
                if (currentPage > 0) {
                    this.currentPages[categoryId] = currentPage - 1;
                    this.refresh();
                }
            }

            refresh() {
                const container = document.getElementById('configCategoriesContainer');
                if (container) {
                    container.innerHTML = Object.keys(this.categories).map(id => this.renderCategory(id)).join('');
                }
            }
        }

            renderPage() {
                const grid = document.getElementById('mainModulesGrid');
                if (!grid) return;

                const currentPageModules = this.menuPages[this.currentPage];
                if (!currentPageModules) return;

                const colorClasses = {
                    red: { bg: 'bg-red-500/50 dark:bg-red-600/60', border: 'border-red-600', button: 'bg-red-600 hover:bg-red-700' },
                    green: { bg: 'bg-green-500/50 dark:bg-green-600/60', border: 'border-green-600', button: 'bg-green-600 hover:bg-green-700' },
                    yellow: { bg: 'bg-yellow-500/50 dark:bg-yellow-600/60', border: 'border-yellow-600', button: 'bg-yellow-600 hover:bg-yellow-700' },
                    blue: { bg: 'bg-blue-500/50 dark:bg-blue-600/60', border: 'border-blue-600', button: 'bg-blue-600 hover:bg-blue-700' }
                };

                grid.innerHTML = currentPageModules.map(module => {
                    const colors = colorClasses[module.color];
                    return `
                        <div onclick="app.showModule('${module.id}')" class="${colors.bg} rounded-2xl shadow-2xl overflow-hidden border-l-[16px] ${colors.border} fade-in cursor-pointer hover:scale-105 transition-transform duration-300">

                                    Abrir Aplicación →
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            nextPage() {
                const maxPage = Object.keys(this.menuPages).length - 1;
                if (this.currentPage < maxPage) {
                    this.currentPage++;
                    this.renderPage();
                }
            }

            previousPage() {
                if (this.currentPage > 0) {
                    this.currentPage--;
                    this.renderPage();
                }
            }

            init() {
                // Renderizar la página inicial
                this.renderPage();
                this.isInitialized = true;
            }
