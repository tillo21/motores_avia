        class ModularApp {
            constructor() {
                this.currentModule = null;
                this.currentPage = 0;

                // Inicializar módulo de paginación de menú (AVIA ontológico)
                this.menuPagination = new MenuPaginationModule();

                // Registrar módulos en la arquitectura AVIA
                this.modules = {
                    // Nuevas aplicaciones principales TOOCAuthor
                    toocGenerator: window.aviaRegistry.register('toocGenerator', TOOCGeneratorModule),
                    webGenerator: window.aviaRegistry.register('webGenerator', WebGeneratorModule),
                    usabilityLab: window.aviaRegistry.register('usabilityLab', UsabilityLabModule),
                    aviaCreator: window.aviaRegistry.register('aviaCreator', AVIACreatorModule),
                    digitalTwin: window.aviaRegistry.register('digitalTwin', DigitalTwinModule),
                    // Aplicaciones originales (ahora en Configuración)
                    calculator: window.aviaRegistry.register('calculator', CalculatorModule),
                    notes: window.aviaRegistry.register('notes', NotesModule),
                    tasks: window.aviaRegistry.register('tasks', TasksModule),
                    pomodoro: window.aviaRegistry.register('pomodoro', PomodoroModule),
                    analytics: window.aviaRegistry.register('analytics', AnalyticsModule),
                    calendar: window.aviaRegistry.register('calendar', CalendarModule),
                    documentation: window.aviaRegistry.register('documentation', DocumentationModule),
                    scriptGenerator: window.aviaRegistry.register('scriptGenerator', ScriptGeneratorModule),
                    ecosistema: window.aviaRegistry.register('ecosistema', EcosistemaModule),
                    timeline: window.aviaRegistry.register('timeline', TimelineModule),
                    assistant: window.aviaRegistry.register('assistant', AVIAAssistantModule)
                };

                this.init();
            }

            init() {
                // Dark mode support
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                }
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                    if (event.matches) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                });

                // Inicializar módulo de paginación de menú
                this.menuPagination.init();

                // Inicializar asistente flotante
                if (this.modules.assistant) {
                    this.modules.assistant.renderFloatingPanel();
                    window.aviaAssistant = this.modules.assistant;
                }

                // Registrar eventos globales
                this.setupGlobalEventListeners();

                console.log('🚀 Sistema Modular AVIA inicializado');
                console.log('📋 Módulos registrados:', Object.keys(this.modules));
                console.log('🤖 AVIA-Clon de Carlos activado');
                console.log('🏥 Health Monitor activo');
                console.log('📡 Event Bus activo');
            }

            setupGlobalEventListeners() {
                // Escuchar eventos del sistema
                window.aviaEventBus?.on('module:activated', (data) => {
                    console.log(`✅ Módulo activado: ${data.moduleId}`);
                }, 'ModularApp');

                window.aviaEventBus?.on('module:deactivated', (data) => {
                    console.log(`❌ Módulo desactivado: ${data.moduleId}`);
                }, 'ModularApp');

                window.aviaEventBus?.on('module:repaired', (data) => {
                    console.log(`🔧 Módulo reparado: ${data.moduleId}`);
                    showCustomAlert(`Módulo ${data.moduleId} reparado exitosamente.`);
                }, 'ModularApp');

                window.aviaEventBus?.on('system:optimized', () => {
                    console.log('🚀 Sistema optimizado');
                }, 'ModularApp');
            }

            showMenu() {
                document.getElementById('mainMenu').classList.remove('hidden');
                document.getElementById('appView').classList.add('hidden');
                if (this.currentModule && this.modules[this.currentModule].destroy) {
                    this.modules[this.currentModule].destroy();
                }
                this.currentModule = null;
            }

            /*
             * ============================================
             * LIBRO BLANCO DE SIESTAOTT - REGLA GENERAL
             * Header Estándar para Módulos
             * ============================================
             *
             * REGLA: Todos los módulos deben tener UN ÚNICO espacio de información (header)
             * que contenga TODA la información necesaria sin duplicaciones.
             *
             * ESTRUCTURA DEL HEADER ESTÁNDAR:
             * 1. Barra vertical de color (extremo izquierdo):
             *    - Ancho: 6px
             *    - Altura: 100% del espacio
             *    - Posición: Pegada al extremo izquierdo (sin padding)
             *    - Esquinas redondeadas: Solo lado izquierdo (border-radius: 12px 0 0 12px)
             *    - Color: Según el módulo (red, green, yellow, blue, orange, purple)
             *
             * 2. Contenido central:
             *    - Icono del módulo (emoji grande, 5xl)
             *    - Título del módulo (2xl, bold)
             *    - Descripción funcional (text-sm)
             *
             * 3. Botón VOLVER (extremo derecho):
             *    - Botón circular blanco (48x48px)
             *    - Icono X negro
             *    - Sombras volumétricas
             *    - Posicionado en el extremo derecho
             *
             * PROPIEDADES REQUERIDAS EN CADA MÓDULO:
             * - title: String (nombre del módulo sin emoji)
             * - icon: String (emoji representativo)
             * - description: String (descripción funcional breve)
             * - color: String ('red'|'green'|'yellow'|'blue'|'orange'|'purple'|'gray'|'pink')
             *
             * COLORES ESTÁNDAR DEL SISTEMA (8 colores definidos):
             * 🔴 Red (Rojo) - Calculadora, Tasks
             * 🟢 Green (Verde) - Tasks, Analytics
             * 🟡 Yellow (Amarillo) - Notes
             * 🔵 Blue (Azul) - Analytics
             * 🟠 Orange (Naranja) - Pomodoro, Config
             * 🟣 Purple (Morado) - Calendar, AVIA
             * ⚫ Gray (Gris) - Sistema
             * 🌸 Pink (Rosa) - Especial
             *
             * NO INVENTES COLORES - Usa solo los 8 definidos arriba
             * NO REPITAS INFORMACIÓN - Un solo header con toda la info
             *
             * ============================================
             * REGLA UNIVERSAL DE BOTONES EN MODALES
             * ============================================
             *
             * TODAS las ventanas modales finales de información deben seguir este patrón:
             *
             * BOTONES EN ESQUINA SUPERIOR DERECHA (siempre):
             *
             * 1. BOTÓN DE ACCIÓN (izquierda, cuando sea necesario):
             *    - Posición: absolute top-4 right-20 (a la izquierda del botón cerrar)
             *    - Tamaño: w-12 h-12 (48x48px)
             *    - Color: bg-black (negro)
             *    - Icono: blanco (✓ check, + plus, o ↵ enter según contexto)
             *    - Hover: escala 1.1
             *    - Sombra VOLUMÉTRICA: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *    - Ejemplos de iconos: Guardar (✓), Nuevo (➕), Añadir (+), Confirmar (✓)
             *
             * 2. BOTÓN DE CERRAR (derecha, siempre presente):
             *    - Posición: absolute top-4 right-4
             *    - Tamaño: w-12 h-12 (48x48px)
             *    - Color: bg-white (blanco)
             *    - Icono: X negro
             *    - Hover: escala 1.1
             *    - Sombra VOLUMÉTRICA: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *
             * IMPORTANTE:
             * - TODOS los botones deben tener sombras volumétricas para crear sensación de profundidad
             * - Los botones SIEMPRE van en la esquina superior derecha
             * - NO poner botones en el footer de los modales
             * - El botón negro de acción va a la IZQUIERDA del botón blanco de cerrar
             *
             * ESTRUCTURA HTML:
             * <!-- Botón de acción (opcional) -->
             * <button class="action-btn absolute top-4 right-20 w-12 h-12 bg-black rounded-full..."
             *         style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);">
             *     <svg>icono</svg>
             * </button>
             * <!-- Botón de cerrar (obligatorio) -->
             * <button class="close-btn absolute top-4 right-4 w-12 h-12 bg-white rounded-full..."
             *         style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);">
             *     <svg>X</svg>
             * </button>
             *
             * ============================================
             * REGLA UNIVERSAL DE POSICIONAMIENTO DE BOTONES
             * ============================================
             *
             * TODOS los botones deben ser FLOTANTES con sombras volumétricas y aparecer
             * en posiciones consistentes según su forma y función:
             *
             * 1. BOTONES REDONDOS (Acciones Primarias):
             *    Posición: ESQUINA SUPERIOR DERECHA
             *    - Botón de Acción Principal (negro): absolute top-4 right-20
             *    - Botón de Cerrar (blanco): absolute top-4 right-4
             *    - Tamaño: w-12 h-12 (48x48px)
             *    - Sombra: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *    - Ejemplos: X (cerrar), ✓ (confirmar), + (añadir)
             *
             * 2. BOTONES CUADRADOS (Navegación y Grid):
             *    Posición: ESQUINAS INFERIORES
             *    - Botón Inferior Izquierda: absolute bottom-6 left-6
             *    - Botón Inferior Derecha: absolute bottom-6 right-6
             *    - Tamaño: w-16 h-16 a w-24 h-24 (según importancia)
             *    - Sombra: 0 6px 10px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *    - Ejemplos: ⚙️ (config), 📊 (stats), 🏠 (home)
             *
             * 3. BOTONES TRIANGULARES (Navegación Direccional):
             *    Posición: CENTRADOS EN BORDES LATERALES
             *    - Botón Izquierda: absolute top-1/2 left-4 -translate-y-1/2
             *    - Botón Derecha: absolute top-1/2 right-4 -translate-y-1/2
             *    - Tamaño: w-12 h-12 (48x48px)
             *    - Sombra: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3)
             *    - Ejemplos: ◀ (anterior), ▶ (siguiente)
             *
             * MAPA DE POSICIONES ESTÁNDAR:
             *
             *     [Botón Acción Negro]  [Botón Cerrar Blanco]
             *              ↑                    ↑
             *         (top-4, right-20)   (top-4, right-4)
             *
             * [◀ Anterior]                           [Siguiente ▶]
             *      ↑                                      ↑
             * (top-1/2, left-4)                  (top-1/2, right-4)
             *
             * [⚙️ Config]                            [📊 Stats]
             *      ↑                                      ↑
             * (bottom-6, left-6)                 (bottom-6, right-6)
             *
             * REGLAS CRÍTICAS:
             * ✅ SIEMPRE usar position: absolute o fixed
             * ✅ SIEMPRE incluir sombras volumétricas
             * ✅ SIEMPRE usar transition-all hover:scale-110
             * ✅ RESPETAR las posiciones estándar según forma del botón
             * ✖️ NUNCA poner botones en footers o áreas de contenido
             * ✖️ NUNCA solapar botones en la misma posición
             *
             * ============================================
             */
            showModule(moduleName) {
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('appView').classList.remove('hidden');

                const module = this.modules[moduleName];
                if (module) {
                    // Crear el header SiestaOTT unificado con toda la información
                    const colorMap = {
                        'red': 'bg-red-500',
                        'green': 'bg-green-500',
                        'yellow': 'bg-yellow-500',
                        'blue': 'bg-blue-500',
                        'orange': 'bg-orange-500',
                        'purple': 'bg-purple-500',
                        'gray': 'bg-gray-500',
                        'pink': 'bg-pink-500'
                    };

                    const bgColor = colorMap[module.color] || 'bg-gray-500';

                    // Modificar el contenedor padre para eliminar padding y permitir borde en extremo izquierdo
                    const headerParent = document.querySelector('#appView > div:first-child > div');
                    headerParent.className = 'flex items-center w-full';
                    headerParent.style.padding = '0';
                    headerParent.style.height = '80px';

                    // Determinar si el módulo necesita botón de acción
                    const actionButtons = {
                        'notes': { onclick: 'notes.createNote()', icon: '+', label: 'Nueva Nota' },
                        'tasks': { onclick: 'tasks.addTask()', icon: '+', label: 'Nueva Tarea' },
                        'calendar': { onclick: 'calendar.showAddEventForm()', icon: '+', label: 'Nuevo Evento' }
                    };

                    const actionBtn = actionButtons[moduleName];

                    // Reemplazar todo el contenido del header
                    headerParent.innerHTML = `
                        <!-- Barra vertical de color en extremo izquierdo (estándar SiestaOTT) -->
                        <div class="${bgColor}" style="width: 6px; height: 100%; border-radius: 12px 0 0 12px; flex-shrink: 0;"></div>

                        <!-- Contenido: Icono + Título/Descripción -->
                        <div class="flex items-center gap-4 flex-1 px-6">
                            <!-- Icono del módulo -->
                            <span class="text-5xl" style="line-height: 1;">${module.icon}</span>

                            <!-- Título y Descripción -->
                            <div class="flex-1">
                                <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-1">${module.title}</h2>
                                <p class="text-sm text-gray-600 dark:text-gray-400">${module.description}</p>
                            </div>
                        </div>

                        ${actionBtn ? `
                        <!-- Botón de Acción (Negro) flotante superior derecha -->
                        <button onclick="${actionBtn.onclick}" class="w-12 h-12 bg-black hover:bg-gray-800 dark:hover:bg-gray-900 rounded-full flex items-center justify-center transition-all hover:scale-110 flex-shrink-0 mr-4" style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);" title="${actionBtn.label}">
                            <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        </button>
                        ` : ''}

                        <!-- Botón VOLVER (X) en extremo derecho -->
                        <button onclick="app.showMenu()" class="w-12 h-12 bg-white hover:bg-gray-100 dark:bg-gray-700 dark:hover:bg-gray-600 rounded-full flex items-center justify-center transition-all hover:scale-110 flex-shrink-0 mr-6" style="box-shadow: 0 4px 8px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);" title="Volver">
                            <svg class="w-6 h-6 fill-gray-800 dark:fill-gray-200" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        </button>
                    `;

                    const content = document.getElementById('appContent');
                    content.innerHTML = '';

                    // Ajustar scroll según el módulo
                    if (moduleName === 'calendar' || moduleName === 'analytics' || moduleName === 'ecosistema') {
                        // Calendario, Analytics y Ecosistema sin scroll - todo visible en pantalla
                        content.className = 'container mx-auto px-4 py-4 h-[calc(100vh-120px)] overflow-hidden';
                    } else {
                        // Otros módulos con scroll
                        content.className = 'container mx-auto px-4 py-4 overflow-y-auto';
                    }

                    module.render(content);
                    this.currentModule = moduleName;
                }
            }

                                <li>✔️ <strong>RESPETA POSICIONES ESTÁNDAR</strong> - Redondos arriba, cuadrados abajo, triangulares laterales</li>
                                <li>✔️ <strong>CONSISTENCIA TOTAL</strong> - Todos los modales y pantallas siguen el mismo patrón</li>
                            </ul>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                // Botón cerrar (X) superior derecha
                modal.querySelector('.close-btn').onclick = () => {
                    document.body.removeChild(modal);
                };
            }

            previousPage() {
                // Delegar al módulo de paginación autónomo
                if (this.menuPagination) {
                    this.menuPagination.previousPage();
                }
            }

            nextPage() {
                // Delegar al módulo de paginación autónomo
                if (this.menuPagination) {
                    this.menuPagination.nextPage();
                }
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new ModularApp();
        });
    </script>
</body>
</html>
