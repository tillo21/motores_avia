<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA - Task Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slide-in-right {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slide-out-right {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .animate-slide-in-right { animation: slide-in-right 0.3s ease-out; }
        .animate-slide-out-right { animation: slide-out-right 0.3s ease-in; }
        
        .dark {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
    
    <!-- Navbar -->
    <nav id="navbar" class="bg-white dark:bg-gray-800 shadow-md hidden">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">✈️</span>
                <h1 class="text-xl font-bold text-gray-800 dark:text-white">AVIA Tasks</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-name" class="text-gray-600 dark:text-gray-300"></span>
                <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                    <span class="text-xl">🌙</span>
                </button>
                <button id="logout-btn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <!-- Auth Screen -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
                <span class="text-6xl">✈️</span>
                <h2 class="text-3xl font-bold text-gray-800 dark:text-white mt-4">AVIA Tasks</h2>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Gestión de tareas profesional</p>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Email
                        </label>
                        <input type="email" id="login-email" required
                               class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg 
                                      bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                                      focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Contraseña
                        </label>
                        <input type="password" id="login-password" required
                               class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg 
                                      bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                                      focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <button type="submit" 
                            class="w-full py-3 bg-blue-500 text-white rounded-lg font-semibold
                                   hover:bg-blue-600 transition-colors">
                        Iniciar Sesión
                    </button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <button id="show-register" class="text-blue-500 hover:underline">
                    ¿No tienes cuenta? Regístrate
                </button>
            </div>

            <!-- Register Form (hidden) -->
            <form id="register-form" class="hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Nombre
                        </label>
                        <input type="text" id="register-name" required
                               class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg 
                                      bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                                      focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Email
                        </label>
                        <input type="email" id="register-email" required
                               class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg 
                                      bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                                      focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Contraseña (mín. 6 caracteres)
                        </label>
                        <input type="password" id="register-password" required minlength="6"
                               class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg 
                                      bg-white dark:bg-gray-700 text-gray-900 dark:text-white
                                      focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <button type="submit" 
                            class="w-full py-3 bg-green-500 text-white rounded-lg font-semibold
                                   hover:bg-green-600 transition-colors">
                        Registrarse
                    </button>
                </div>
            </form>

            <div id="back-to-login" class="mt-4 text-center hidden">
                <button class="text-blue-500 hover:underline">
                    ← Volver al login
                </button>
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="hidden">
        <div class="container mx-auto px-4 py-8">
            
            <!-- Filters & Actions -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 mb-6">
                <div class="flex flex-wrap gap-4 items-center justify-between">
                    <div class="flex flex-wrap gap-3">
                        <select id="filter-status" 
                                class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg
                                       bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                            <option value="">Todos los estados</option>
                            <option value="pending">Pendiente</option>
                            <option value="in_progress">En Progreso</option>
                            <option value="completed">Completada</option>
                        </select>
                        <select id="filter-priority" 
                                class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg
                                       bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                            <option value="">Todas las prioridades</option>
                            <option value="low">Baja</option>
                            <option value="medium">Media</option>
                            <option value="high">Alta</option>
                        </select>
                        <input type="text" id="search-input" placeholder="Buscar tareas..."
                               class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg
                                      bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                    </div>
                    <button id="create-task-btn" 
                            class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 font-semibold">
                        ➕ Nueva Tarea
                    </button>
                </div>
            </div>

            <!-- Tasks Grid -->
            <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Tasks will be inserted here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="text-center py-16 hidden">
                <span class="text-6xl">📋</span>
                <p class="text-xl text-gray-600 dark:text-gray-400 mt-4">
                    No hay tareas aún
                </p>
                <button onclick="document.getElementById('create-task-btn').click()"
                        class="mt-4 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                    Crear primera tarea
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Create/Edit Task -->
    <div id="task-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl p-6 w-full max-w-md">
            <h3 id="modal-title" class="text-2xl font-bold text-gray-800 dark:text-white mb-6">Nueva Tarea</h3>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Título *
                        </label>
                        <input type="text" id="task-title" required
                               class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg 
                                      bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Descripción
                        </label>
                        <textarea id="task-description" rows="3"
                                  class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg 
                                         bg-white dark:bg-gray-700 text-gray-900 dark:text-white"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                Estado
                            </label>
                            <select id="task-status" 
                                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg 
                                           bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                                <option value="pending">Pendiente</option>
                                <option value="in_progress">En Progreso</option>
                                <option value="completed">Completada</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                Prioridad
                            </label>
                            <select id="task-priority" 
                                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg 
                                           bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                                <option value="low">Baja</option>
                                <option value="medium">Media</option>
                                <option value="high">Alta</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex gap-3 mt-6">
                        <button type="submit" 
                                class="flex-1 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                            Guardar
                        </button>
                        <button type="button" id="cancel-modal" 
                                class="flex-1 py-2 bg-gray-300 dark:bg-gray-600 text-gray-800 dark:text-white rounded-lg hover:bg-gray-400">
                            Cancelar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
