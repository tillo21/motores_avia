<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA - Gestión de Proyectos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .sidebar {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .sidebar h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .projects-area {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .projects-area h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .project-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
            cursor: pointer;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .project-card.pendiente {
            border-left-color: #ffa726;
        }

        .project-card.en-progreso {
            border-left-color: #42a5f5;
        }

        .project-card.completado {
            border-left-color: #66bb6a;
        }

        .project-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .project-card p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .project-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .priority {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .priority.alta {
            background: #ffebee;
            color: #c62828;
        }

        .priority.media {
            background: #fff3e0;
            color: #ef6c00;
        }

        .priority.baja {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status.pendiente {
            background: #fff3e0;
            color: #f57c00;
        }

        .status.en-progreso {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.completado {
            background: #e8f5e9;
            color: #388e3c;
        }

        .project-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-edit {
            background: #42a5f5;
            color: white;
        }

        .btn-delete {
            background: #ef5350;
            color: white;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #667eea;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AVIA Gestión de Proyectos</h1>
            <p>Sistema de orquestación y seguimiento de proyectos</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Proyectos</h3>
                <div class="number" id="totalProjects">0</div>
            </div>
            <div class="stat-card">
                <h3>En Progreso</h3>
                <div class="number" id="inProgressProjects">0</div>
            </div>
            <div class="stat-card">
                <h3>Completados</h3>
                <div class="number" id="completedProjects">0</div>
            </div>
            <div class="stat-card">
                <h3>Pendientes</h3>
                <div class="number" id="pendingProjects">0</div>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h2>➕ Nuevo Proyecto</h2>
                <form id="projectForm">
                    <div class="form-group">
                        <label>Nombre del Proyecto</label>
                        <input type="text" id="projectName" required placeholder="Ej: Sistema de Automatización">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="projectDescription" required placeholder="Describe el proyecto..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Prioridad</label>
                        <select id="projectPriority" required>
                            <option value="baja">Baja</option>
                            <option value="media" selected>Media</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="projectStatus" required>
                            <option value="pendiente" selected>Pendiente</option>
                            <option value="en-progreso">En Progreso</option>
                            <option value="completado">Completado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fecha Límite</label>
                        <input type="date" id="projectDeadline" required>
                    </div>
                    <button type="submit" class="btn">Crear Proyecto</button>
                </form>
            </div>

            <div class="projects-area">
                <h2>📋 Proyectos Activos</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="todos">Todos</button>
                    <button class="filter-btn" data-filter="pendiente">Pendientes</button>
                    <button class="filter-btn" data-filter="en-progreso">En Progreso</button>
                    <button class="filter-btn" data-filter="completado">Completados</button>
                </div>
                <div class="projects-grid" id="projectsGrid">
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <h3>No hay proyectos aún</h3>
                        <p>Crea tu primer proyecto para comenzar</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ Editar Proyecto</h2>
                <button class="close-btn" onclick="closeEditModal()">×</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editProjectId">
                <div class="form-group">
                    <label>Nombre del Proyecto</label>
                    <input type="text" id="editProjectName" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="editProjectDescription" required></textarea>
                </div>
                <div class="form-group">
                    <label>Prioridad</label>
                    <select id="editProjectPriority" required>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="editProjectStatus" required>
                        <option value="pendiente">Pendiente</option>
                        <option value="en-progreso">En Progreso</option>
                        <option value="completado">Completado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha Límite</label>
                    <input type="date" id="editProjectDeadline" required>
                </div>
                <button type="submit" class="btn">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script>
        // Sistema de almacenamiento en memoria (sin localStorage)
        let projectsData = [];
        let currentFilter = 'todos';
        let projectIdCounter = 1;

        // Inicializar con datos de ejemplo
        function initializeSampleData() {
            projectsData = [
                {
                    id: projectIdCounter++,
                    name: "Sistema de Automatización AVIA",
                    description: "Desarrollo del sistema principal de orquestación",
                    priority: "alta",
                    status: "en-progreso",
                    deadline: "2024-12-31",
                    created: new Date().toISOString()
                },
                {
                    id: projectIdCounter++,
                    name: "Migración Base de Datos",
                    description: "Migración a PostgreSQL con optimización",
                    priority: "media",
                    status: "pendiente",
                    deadline: "2024-11-15",
                    created: new Date().toISOString()
                }
            ];
            renderProjects();
            updateStats();
        }

        // Crear proyecto
        document.getElementById('projectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const project = {
                id: projectIdCounter++,
                name: document.getElementById('projectName').value,
                description: document.getElementById('projectDescription').value,
                priority: document.getElementById('projectPriority').value,
                status: document.getElementById('projectStatus').value,
                deadline: document.getElementById('projectDeadline').value,
                created: new Date().toISOString()
            };

            projectsData.push(project);
            renderProjects();
            updateStats();
            this.reset();
            
            showNotification('✅ Proyecto creado exitosamente');
        });

        // Renderizar proyectos
        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            let filteredProjects = projectsData;

            if (currentFilter !== 'todos') {
                filteredProjects = projectsData.filter(p => p.status === currentFilter);
            }

            if (filteredProjects.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <h3>No hay proyectos ${currentFilter !== 'todos' ? 'con este filtro' : 'aún'}</h3>
                        <p>${currentFilter !== 'todos' ? 'Prueba con otro filtro' : 'Crea tu primer proyecto para comenzar'}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredProjects.map(project => `
                <div class="project-card ${project.status}">
                    <h3>${project.name}</h3>
                    <p>${project.description}</p>
                    <div class="project-meta">
                        <span class="priority ${project.priority}">
                            ${project.priority.charAt(0).toUpperCase() + project.priority.slice(1)}
                        </span>
                        <span class="status ${project.status}">
                            ${project.status.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')}
                        </span>
                    </div>
                    <p style="margin-top: 10px; font-size: 0.9em; color: #999;">
                        📅 Vence: ${new Date(project.deadline).toLocaleDateString('es-ES')}
                    </p>
                    <div class="project-actions">
                        <button class="action-btn btn-edit" onclick="editProject(${project.id})">Editar</button>
                        <button class="action-btn btn-delete" onclick="deleteProject(${project.id})">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        // Actualizar estadísticas
        function updateStats() {
            document.getElementById('totalProjects').textContent = projectsData.length;
            document.getElementById('inProgressProjects').textContent = 
                projectsData.filter(p => p.status === 'en-progreso').length;
            document.getElementById('completedProjects').textContent = 
                projectsData.filter(p => p.status === 'completado').length;
            document.getElementById('pendingProjects').textContent = 
                projectsData.filter(p => p.status === 'pendiente').length;
        }

        // Filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderProjects();
            });
        });

        // Editar proyecto
        function editProject(id) {
            const project = projectsData.find(p => p.id === id);
            if (!project) return;

            document.getElementById('editProjectId').value = project.id;
            document.getElementById('editProjectName').value = project.name;
            document.getElementById('editProjectDescription').value = project.description;
            document.getElementById('editProjectPriority').value = project.priority;
            document.getElementById('editProjectStatus').value = project.status;
            document.getElementById('editProjectDeadline').value = project.deadline;

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = parseInt(document.getElementById('editProjectId').value);
            const projectIndex = projectsData.findIndex(p => p.id === id);

            if (projectIndex !== -1) {
                projectsData[projectIndex] = {
                    ...projectsData[projectIndex],
                    name: document.getElementById('editProjectName').value,
                    description: document.getElementById('editProjectDescription').value,
                    priority: document.getElementById('editProjectPriority').value,
                    status: document.getElementById('editProjectStatus').value,
                    deadline: document.getElementById('editProjectDeadline').value
                };

                renderProjects();
                updateStats();
                closeEditModal();
                showNotification('✅ Proyecto actualizado');
            }
        });

        // Eliminar proyecto
        function deleteProject(id) {
            if (confirm('¿Estás seguro de eliminar este proyecto?')) {
                projectsData = projectsData.filter(p => p.id !== id);
                renderProjects();
                updateStats();
                showNotification('🗑️ Proyecto eliminado');
            }
        }

        // Notificaciones
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #4caf50;
                color: white;
                padding: 15px 25px;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 2000;
                animation: slideIn 0.3s ease;
            `;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Cerrar modal al hacer clic fuera
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });

        // Inicializar aplicación
        initializeSampleData();
    </script>
</body>
</html>
