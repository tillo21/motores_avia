<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto AVIA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #app {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #667eea; margin-bottom: 20px; }
        .status { 
            padding: 15px;
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            margin-top: 20px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        button:hover { background: #5568d3; }
        
        /* Modal personalizado */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .modal-content h2 { color: #667eea; margin-bottom: 15px; }
        .modal-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }
        .modal-btn:hover { background: #5568d3; }
    </style>
</head>
<body>
    <div id="app">
        <h1>🚀 Proyecto AVIA</h1>
        <p>Sistema inicializado correctamente</p>
        <div class="status">
            <strong>Estado:</strong> ✅ Operativo
        </div>
        <button onclick="ejecutarAccion()">Ejecutar acción</button>
    </div>

    <!-- Modal personalizado -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Notificación</h2>
            <p id="modal-message"></p>
            <button class="modal-btn" onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        // Sistema de notificaciones (reemplazo de alert)
        function mostrarMensaje(mensaje, titulo = 'Notificación') {
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').textContent = titulo;
            document.getElementById('modal-message').textContent = mensaje;
            modal.classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // AVIA Core
        window.AVIA = {
            version: '1.0.0',
            inicializar() {
                console.log('✅ AVIA Core inicializado');
                return true;
            },
            ejecutar(accion) {
                console.log('Ejecutando:', accion);
                return { success: true, resultado: 'Acción completada exitosamente' };
            }
        };

        // Inicialización
        if (AVIA.inicializar()) {
            console.log('Sistema AVIA listo');
        }

        function ejecutarAccion() {
            const resultado = AVIA.ejecutar('test');
            mostrarMensaje('✅ ' + resultado.resultado, 'AVIA');
        }

        // Cerrar modal con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') cerrarModal();
        });
    </script>
</body>
</html>
