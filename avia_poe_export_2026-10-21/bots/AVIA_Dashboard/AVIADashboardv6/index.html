<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AVIA Auditoría</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 440px;
            width: 100%;
            padding: 48px 40px;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 { font-size: 28px; text-align: center; margin-bottom: 32px; color: #111827; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4); }
        .error { color: #ef4444; font-size: 14px; margin-top: 8px; }
        .toggle { text-align: center; margin-top: 24px; color: #6b7280; }
        .toggle a { color: #667eea; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔐</div>
        <h1 id="formTitle">Iniciar Sesión</h1>
        
        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label for="name">Nombre Completo</label>
                <input type="text" id="name" placeholder="Tu nombre">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="error" id="errorMsg"></div>
            
            <button type="submit" class="btn" id="submitBtn">Ingresar</button>
        </form>
        
        <div class="toggle">
            <span id="toggleText">¿No tienes cuenta?</span>
            <a href="#" id="toggleLink">Regístrate</a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let isLogin = true;
        
        document.getElementById('toggleLink').addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            
            document.getElementById('formTitle').textContent = isLogin ? 'Iniciar Sesión' : 'Crear Cuenta';
            document.getElementById('nameGroup').style.display = isLogin ? 'none' : 'block';
            document.getElementById('submitBtn').textContent = isLogin ? 'Ingresar' : 'Registrarse';
            document.getElementById('toggleText').textContent = isLogin ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?';
            document.getElementById('toggleLink').textContent = isLogin ? 'Regístrate' : 'Inicia sesión';
            document.getElementById('errorMsg').textContent = '';
        });
        
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.textContent = '';
            
            try {
                const endpoint = isLogin ? '/auth/login' : '/auth/register';
                const body = isLogin ? { email, password } : { email, password, name };
                
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Error en la autenticación');
                }
                
                // Guardar token y usuario
                localStorage.setItem('avia_token', data.token);
                localStorage.setItem('avia_user', JSON.stringify(data.user));
                
                // Redirigir al dashboard
                window.location.href = '/dashboard';
                
            } catch (error) {
                errorMsg.textContent = error.message;
            }
        });
    </script>
</body>
</html>
