<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA-Proyecto v2.1 | Sistema Anti-Pérdida de Contexto</title>
    <style>
        /**
         * DISEÑO ATÓMICO - NIVEL ATOMS
         * Tokens de diseño base
         */
        :root {
            --color-primary: #00ff88;
            --color-secondary: #0088ff;
            --color-warning: #ffaa00;
            --color-error: #ff4444;
            --color-bg-dark: rgba(0, 0, 0, 0.95);
            --color-bg-panel: rgba(0, 0, 0, 0.8);
            --color-text: #e0e0e0;
            --color-text-muted: #888;
            --spacing-xs: 5px;
            --spacing-sm: 10px;
            --spacing-md: 15px;
            --spacing-lg: 20px;
            --border-radius: 8px;
            --font-mono: 'Courier New', monospace;
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /**
         * DISEÑO ATÓMICO - NIVEL MOLECULES
         * Componentes compuestos básicos
         */
        .panel {
            background: var(--color-bg-panel);
            padding: var(--spacing-sm);
            border-radius: var(--border-radius);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .button {
            padding: var(--spacing-xs) var(--spacing-md);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .button-primary {
            background: var(--color-secondary);
            color: white;
        }

        .button-warning {
            background: var(--color-warning);
            color: white;
        }

        .indicator {
            font-size: 12px;
            padding: var(--spacing-xs);
            border-radius: 4px;
            transition: color 0.3s ease;
        }

        /**
         * DISEÑO ATÓMICO - NIVEL ORGANISMS
         * Componentes complejos
         */
        #consensus-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            min-width: 200px;
        }

        #consensus-indicator {
            color: var(--color-primary);
            font-weight: bold;
            font-size: 14px;
        }

        #context-counter {
            margin-top: var(--spacing-xs);
            color: var(--color-text-muted);
        }

        .controls-group {
            margin-top: var(--spacing-sm);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        #chat-container {
            max-width: 900px;
            margin: 80px auto 20px;
            padding: var(--spacing-lg);
            background: var(--color-bg-dark);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.1);
        }

        .message {
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-md);
            border-radius: var(--border-radius);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: rgba(0, 136, 255, 0.1);
            border-left: 3px solid var(--color-secondary);
        }

        .message.assistant {
            background: rgba(0, 255, 136, 0.05);
            border-left: 3px solid var(--color-primary);
        }

        .input-container {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-lg);
        }

        #user-input {
            flex: 1;
            padding: var(--spacing-md);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: var(--border-radius);
            color: var(--color-text);
            font-family: var(--font-sans);
            font-size: 14px;
        }

        #send-button {
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--color-primary);
            color: black;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #send-button:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }

        /**
         * DISEÑO ATÓMICO - NIVEL TEMPLATES
         * Layouts y estructuras de página
         */
        .header-template {
            text-align: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid rgba(0, 255, 136, 0.2);
        }

        .header-template h1 {
            color: var(--color-primary);
            font-size: 2em;
            margin-bottom: var(--spacing-xs);
        }

        .header-template .subtitle {
            color: var(--color-text-muted);
            font-size: 0.9em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #consensus-panel {
                top: 5px;
                right: 5px;
                font-size: 10px;
            }

            #chat-container {
                margin: 60px 10px 10px;
                padding: var(--spacing-sm);
            }
        }
    </style>
</head>
<body>
    <!-- DISEÑO ATÓMICO - NIVEL PAGES: Página principal -->
    
    <!-- Organism: Panel de Consenso -->
    <div id="consensus-panel" class="panel">
        <div id="consensus-indicator" class="indicator">Consenso: 100%</div>
        <div id="context-counter" class="indicator">
            Interacciones: <span id="interaction-count">0</span>/<span id="max-interactions">50</span>
        </div>
        <div class="controls-group">
            <button onclick="exportSnapshot()" class="button button-primary" title="Exportar snapshot del proyecto">
                💾 Exportar
            </button>
            <button onclick="restoreSnapshot()" class="button button-warning" title="Restaurar último snapshot">
                📂 Restaurar
            </button>
            <button onclick="forceCompress()" class="button" style="background: #8800ff; color: white;" title="Comprimir contexto manualmente">
                🗜️ Comprimir
            </button>
        </div>
    </div>

    <!-- Template: Chat Container -->
    <div id="chat-container">
        <div class="header-template">
            <h1>🎯 AVIA-PROYECTO v2.1</h1>
            <p class="subtitle">Sistema Anti-Pérdida de Contexto | Constelación Económica Activa</p>
        </div>
        
        <div id="messages"></div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Escribe tu mensaje..." 
                onkeypress="handleKeyPress(event)"
            />
            <button id="send-button" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        /**
         * AVIA-PROYECTO v2.1 - Sistema Anti-Pérdida de Contexto
         * 
         * Arquitectura:
         * - Diseño Atómico (Brad Frost)
         * - Constelación Económica de Consenso
         * - Compresión Inteligente de Contexto
         * - Persistencia en LocalStorage vía CapabilityGuard
         * 
         * Parches Aplicados:
         * ✅ #1: AVIAContextManager
         * ✅ #2: Sistema de Consenso
         * ✅ #3: Hook en processInput
         * ✅ #4-5: Indicadores Visuales
         * ✅ #6: Lazy Loading
         * ✅ #7: Auto-Recovery
         * ✅ #8-9: Export/Import
         */

        // ========================================
        // PARCHE #0: CapabilityGuard (Base Existente)
        // ========================================
        class CapabilityGuard {
            static setItem(key, value) {
                try {
                    localStorage.setItem(key, value);
                    return true;
                } catch (e) {
                    console.error('❌ Error guardando en localStorage:', e);
                    return false;
                }
            }

            static getItem(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    console.error('❌ Error leyendo localStorage:', e);
                    return null;
                }
            }

            static removeItem(key) {
                try {
                    localStorage.removeItem(key);
                    return true;
                } catch (e) {
                    console.error('❌ Error eliminando de localStorage:', e);
                    return false;
                }
            }
        }

        // ========================================
        // SISTEMA BASE: Proyecto
        // ========================================
        window.currentProject = {
            name: 'AVIA-Proyecto-Activo',
            status: 'INICIADO',
            decisions: [],
            evidences: [],
            deliverables: [],
            created: Date.now()
        };

        // ========================================
        // PARCHE #1: AVIAContextManager (NUEVO)
        // ========================================
        class AVIAContextManager {
            static MAX_CONTEXT = 50;
            static COMPRESSION_THRESHOLD = 40;
            
            static compress(project) {
                if (!project) return null;
                
                return {
                    meta: { 
                        compressed: true, 
                        timestamp: Date.now(),
                        version: '2.1'
                    },
                    summary: this.generateSummary(project),
                    keyDecisions: (project.decisions || []).slice(-10),
                    keyEvidences: (project.evidences || []).slice(-10),
                    deliverables: (project.deliverables || []).map(d => ({
                        id: d.id,
                        type: d.type,
                        timestamp: d.timestamp,
                        title: d.title
                    })),
                    stats: {
                        totalDecisions: (project.decisions || []).length,
                        totalEvidences: (project.evidences || []).length,
                        totalDeliverables: (project.deliverables || []).length
                    }
                };
            }
            
            static generateSummary(project) {
                return `${project.name} | ${project.status} | D:${(project.deliverables || []).length} | E:${(project.evidences || []).length} | Dec:${(project.decisions || []).length}`;
            }
            
            static autoSave() {
                if (!window.currentProject) {
                    console.warn('⚠️ No hay proyecto activo para guardar');
                    return false;
                }
                
                const compressed = this.compress(window.currentProject);
                const success = CapabilityGuard.setItem('avia-snapshot', JSON.stringify(compressed));
                
                if (success) {
                    console.log('📸 Snapshot guardado:', compressed.summary);
                    this.updateConsensus(5); // Bonus por guardado exitoso
                    return true;
                } else {
                    console.error('❌ Error guardando snapshot');
                    this.updateConsensus(-10); // Penalización por error
                    return false;
                }
            }
            
            static restore() {
                try {
                    const data = CapabilityGuard.getItem('avia-snapshot');
                    if (!data) return null;
                    
                    const snapshot = JSON.parse(data);
                    console.log('✅ Snapshot restaurado:', snapshot.summary);
                    return snapshot;
                } catch(e) {
                    console.error('⚠️ Error restaurando snapshot:', e);
                    return null;
                }
            }

            static updateConsensus(delta) {
                window.aviaConsensusScore = Math.max(0, Math.min(100, window.aviaConsensusScore + delta));
                this.updateUI();
            }

            static updateUI() {
                const indicator = document.getElementById('consensus-indicator');
                const score = window.aviaConsensusScore;
                
                if (indicator) {
                    indicator.textContent = `Consenso: ${score.toFixed(0)}%`;
                    indicator.style.color = score > 80 ? '#00ff88' : score > 50 ? '#ffaa00' : '#ff4444';
                }
            }
        }

        // ========================================
        // PARCHE #2: Sistema de Consenso (NUEVO)
        // ========================================
        window.aviaInteractionCounter = 0;
        window.aviaConsensusScore = 100;

        function incrementInteraction(quality = 1.0) {
            window.aviaInteractionCounter++;
            
            // Actualizar consenso basado en calidad
            const consensusDelta = quality * 2;
            AVIAContextManager.updateConsensus(consensusDelta);
            
            // Actualizar contador visual
            document.getElementById('interaction-count').textContent = window.aviaInteractionCounter;
            
            // Auto-save cada 5 interacciones
            if (window.aviaInteractionCounter % 5 === 0) {
                console.log(`🔄 Auto-guardado programado (interacción #${window.aviaInteractionCounter})`);
                AVIAContextManager.autoSave();
            }
            
            // Alerta temprana al aproximarse al límite
            if (window.aviaInteractionCounter >= AVIAContextManager.COMPRESSION_THRESHOLD) {
                console.warn(`⚠️ Límite de contexto alcanzado (${window.aviaInteractionCounter}/${AVIAContextManager.MAX_CONTEXT})`);
                alert('⚠️ Aproximándose al límite de contexto. Comprimiendo automáticamente...');
                AVIAContextManager.autoSave();
                window.aviaInteractionCounter = 0; // Reset tras compresión
                document.getElementById('interaction-count').textContent = '0';
            }
            
            return window.aviaConsensusScore;
        }

        // ========================================
        // PARCHE #7: Auto-Recovery de Errores (NUEVO)
        // ========================================
        window.addEventListener('error', (e) => {
            console.error('🔴 Error detectado:', e.message);
            
            // Guardar snapshot de emergencia
            AVIAContextManager.autoSave();
            
            // Registrar en proyecto si existe
            if (window.currentProject) {
                window.currentProject.decisions = window.currentProject.decisions || [];
                window.currentProject.decisions.push({
                    type: 'ERROR_AUTO_RECOVERY',
                    description: e.message,
                    timestamp: Date.now(),
                    context: 'AUTO_SAVE_TRIGGERED'
                });
            }
            
            // Penalización de consenso
            AVIAContextManager.updateConsensus(-10);
        });

        // ========================================
        // PARCHE #8: Exportación de Snapshot (NUEVO)
        // ========================================
        function exportSnapshot() {
            const snapshot = AVIAContextManager.compress(window.currentProject);
            
            if (!snapshot) {
                alert('⚠️ No hay proyecto para exportar');
                return;
            }
            
            const blob = new Blob([JSON.stringify(snapshot, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `avia-snapshot-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            console.log('✅ Snapshot exportado:', snapshot.summary);
            AVIAContextManager.updateConsensus(3);
        }

        // ========================================
        // PARCHE #9: Restauración de Snapshot (NUEVO)
        // ========================================
        function restoreSnapshot() {
            const snapshot = AVIAContextManager.restore();
            
            if (snapshot) {
                alert(`✅ Snapshot restaurado:\n\n${snapshot.summary}\n\nEstadísticas:\n- Decisiones: ${snapshot.stats.totalDecisions}\n- Evidencias: ${snapshot.stats.totalEvidences}\n- Entregables: ${snapshot.stats.totalDeliverables}`);
                AVIAContextManager.updateConsensus(5);
            } else {
                alert('⚠️ No hay snapshot disponible para restaurar');
            }
        }

        // ========================================
        // Función auxiliar: Compresión Manual
        // ========================================
        function forceCompress() {
            const success = AVIAContextManager.autoSave();
            if (success) {
                window.aviaInteractionCounter = 0;
                document.getElementById('interaction-count').textContent = '0';
                alert('✅ Contexto comprimido y guardado correctamente');
            } else {
                alert('❌ Error al comprimir contexto');
            }
        }

        // ========================================
        // SISTEMA DE MENSAJERÍA
        // ========================================
        function displayMessage(text, sender) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<strong>${sender === 'user' ? '👤 Usuario' : '🤖 AVIA'}:</strong> ${text}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Guardar en proyecto
            if (window.currentProject) {
                window.currentProject.deliverables = window.currentProject.deliverables || [];
                window.currentProject.deliverables.push({
                    id: `msg-${Date.now()}`,
                    type: 'MESSAGE',
                    timestamp: Date.now(),
                    title: text.substring(0, 50),
                    sender: sender
                });
            }
        }

        // ========================================
        // PARCHE #3: processInput con Hook (MODIFICADO)
        // ========================================
        async function processInput(userInput) {
            if (!userInput.trim()) return;

            displayMessage(userInput, 'user');

            // Simular procesamiento
            let response = '';
            const lowerInput = userInput.toLowerCase();

            if (lowerInput.includes('hola') || lowerInput.includes('hello')) {
                response = '✅ ¡Hola! Sistema AVIA-Proyecto v2.1 operativo. Sistema anti-pérdida de contexto activado. ¿En qué puedo ayudarte?';
            } else if (lowerInput.includes('estado') || lowerInput.includes('status')) {
                response = `✅ Estado del Sistema:\n- Proyecto: ${window.currentProject.name}\n- Interacciones: ${window.aviaInteractionCounter}/${AVIAContextManager.MAX_CONTEXT}\n- Consenso: ${window.aviaConsensusScore.toFixed(0)}%\n- Entregables: ${(window.currentProject.deliverables || []).length}`;
            } else if (lowerInput.includes('ayuda') || lowerInput.includes('help')) {
                response = '✅ Comandos disponibles:\n- "estado": Ver estado del sistema\n- "exportar": Exportar snapshot\n- "restaurar": Restaurar último snapshot\n- "comprimir": Forzar compresión de contexto\n- "consenso": Ver score de consenso';
            } else if (lowerInput.includes('consenso')) {
                response = `✅ Score de Consenso Económico: ${window.aviaConsensusScore.toFixed(1)}%\n\nFactores:\n- Calidad de respuesta: +2%\n- Guardado exitoso: +5%\n- Error detectado: -10%\n- Exportación: +3%`;
            } else {
                response = `✅ Procesado: "${userInput}". Sistema anti-pérdida activo. Snapshot automático cada 5 interacciones.`;
            }

            displayMessage(response, 'assistant');

            // HOOK NUEVO: Registrar interacción con calidad
            const quality = response.includes('✅') ? 1.0 : 0.8;
            incrementInteraction(quality);

            // Limpiar input
            document.getElementById('user-input').value = '';
        }

        // ========================================
        // MANEJADORES DE UI
        // ========================================
        function sendMessage() {
            const input = document.getElementById('user-input').value;
            processInput(input);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // ========================================
        // INICIALIZACIÓN
        // ========================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 AVIA-Proyecto v2.1 iniciado');
            console.log('✅ Sistema anti-pérdida de contexto: ACTIVO');
            console.log('✅ Constelación económica: ACTIVA');
            console.log('✅ Diseño atómico: IMPLEMENTADO');
            
            // Mensaje de bienvenida
            displayMessage('Sistema AVIA-Proyecto v2.1 iniciado correctamente. Sistema anti-pérdida de contexto activo. Escribe "ayuda" para ver comandos disponibles.', 'assistant');
            
            // Intentar restaurar snapshot previo
            const prevSnapshot = AVIAContextManager.restore();
            if (prevSnapshot) {
                console.log('📂 Snapshot previo detectado:', prevSnapshot.summary);
            }

            // Actualizar UI inicial
            document.getElementById('max-interactions').textContent = AVIAContextManager.MAX_CONTEXT;
            AVIAContextManager.updateUI();
        });

        // Auto-guardado preventivo al cerrar
        window.addEventListener('beforeunload', () => {
            console.log('💾 Guardado preventivo antes de cerrar...');
            AVIAContextManager.autoSave();
        });
    </script>
</body>
</html>
