<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Senior β4.7.0 | Prototipo Funcional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0c0c14;
            --bg-card: #16161f;
            --bg-input: #1e1e2a;
            --bg-hover: #22222e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d2d3a;
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            --gradient-glow: linear-gradient(135deg, rgba(99,102,241,0.2) 0%, rgba(236,72,153,0.2) 100%);
            --shadow-glow: 0 0 30px rgba(99,102,241,0.3);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== APP CONTAINER ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: var(--shadow-glow);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(99,102,241,0.3); }
            50% { box-shadow: 0 0 35px rgba(99,102,241,0.5); }
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .version-badge {
            font-size: 0.65rem;
            padding: 4px 8px;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .status-indicator {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--success);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== BOT SELECTOR ===== */
        .bot-selector {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .bot-selector::-webkit-scrollbar {
            display: none;
        }

        .bot-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .bot-chip:hover {
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .bot-chip.active {
            background: var(--gradient-primary);
            border-color: transparent;
            color: white;
        }

        .bot-chip i {
            font-size: 0.9rem;
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 88%;
            padding: 14px 18px;
            border-radius: var(--radius-lg);
            animation: fadeSlideIn 0.3s ease;
            line-height: 1.6;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--gradient-primary);
            border-bottom-right-radius: 4px;
            color: white;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .message-avatar {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .message-sender {
            font-weight: 600;
            color: var(--primary);
        }

        .message-time {
            color: var(--text-muted);
            margin-left: auto;
            font-size: 0.7rem;
        }

        .message-content {
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .message-content strong {
            color: var(--primary);
        }

        .message-content em {
            color: var(--secondary);
        }

        /* Loading indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 16px 20px;
            align-self: flex-start;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* ===== QUICK ACTIONS ===== */
        .quick-actions {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .quick-actions::-webkit-scrollbar {
            display: none;
        }

        .quick-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: inherit;
        }

        .quick-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .quick-btn:active {
            transform: translateY(0);
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 12px 16px 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            resize: none;
            min-height: 50px;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 50px;
            height: 50px;
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-glow);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== ERROR MESSAGE ===== */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin: 8px 16px;
            font-size: 0.85rem;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        /* ===== CONSTELLATION PANEL ===== */
        .constellation-panel {
            position: fixed;
            bottom: 180px;
            right: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: none;
            z-index: 50;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .constellation-panel.show {
            display: block;
            animation: fadeSlideIn 0.2s ease;
        }

        .constellation-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .constellation-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .bot-mini {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }

        .bot-mini:hover {
            transform: scale(1.15);
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .app {
                max-width: 800px;
                margin: 0 auto;
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
            }

            .message {
                max-width: 70%;
            }
        }

        /* ===== MARKDOWN STYLES ===== */
        .message-content h1, .message-content h2, .message-content h3 {
            margin: 12px 0 8px;
            color: var(--primary);
        }

        .message-content ul, .message-content ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .message-content li {
            margin: 4px 0;
        }

        .message-content code {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .message-content pre {
            background: var(--bg-input);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message-content a {
            color: var(--secondary);
        }

        /* ===== WELCOME SCREEN ===== */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: var(--gradient-primary);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
            animation: pulse-glow 3s ease-in-out infinite;
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            max-width: 300px;
            line-height: 1.6;
        }

        .feature-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .feature-tag {
            padding: 6px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <span class="logo-text">AVIA Senior</span>
                <span class="version-badge">β4.7.0 FUNCIONAL</span>
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="statusText">Conectado</span>
            </div>
        </header>

        <!-- BOT SELECTOR -->
        <div class="bot-selector">
            <div class="bot-chip active" data-bot="Claude-Sonnet-4.5">
                <i class="fas fa-crown"></i>
                <span>Claude</span>
            </div>
            <div class="bot-chip" data-bot="GPT-5.1">
                <i class="fas fa-brain"></i>
                <span>GPT-5.1</span>
            </div>
            <div class="bot-chip" data-bot="Gemini-2.5-Flash">
                <i class="fas fa-gem"></i>
                <span>Gemini</span>
            </div>
            <div class="bot-chip" data-bot="Grok-4-Fast-Non-Reasoning">
                <i class="fas fa-bolt"></i>
                <span>Grok</span>
            </div>
            <button class="bot-chip" id="constellationBtn">
                <i class="fas fa-star"></i>
                <span>26 Bots</span>
            </button>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area" id="chatArea">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-icon">👴</div>
                <h1 class="welcome-title">¡Hola, soy AVIA Senior!</h1>
                <p class="welcome-subtitle">
                    Tu asistente personal diseñado para ayudarte en el día a día.
                    Pregúntame lo que necesites.
                </p>
                <div class="feature-list">
                    <span class="feature-tag">💊 Salud</span>
                    <span class="feature-tag">👨‍👩‍👧 Familia</span>
                    <span class="feature-tag">⏰ Recordatorios</span>
                    <span class="feature-tag">🚨 Emergencias</span>
                    <span class="feature-tag">💬 Compañía</span>
                </div>
            </div>
        </div>

        <!-- ERROR MESSAGE -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- QUICK ACTIONS -->
        <div class="quick-actions">
            <button class="quick-btn" data-msg="¡Hola! ¿Cómo estás?">👋 Saludar</button>
            <button class="quick-btn" data-msg="¿Qué puedes hacer por mí?">❓ Ayuda</button>
            <button class="quick-btn" data-msg="Tengo una duda sobre mi salud">💊 Salud</button>
            <button class="quick-btn" data-msg="Quiero hablar con mi familia">👨‍👩‍👧 Familia</button>
            <button class="quick-btn" data-msg="Necesito ayuda urgente">🚨 Emergencia</button>
            <button class="quick-btn" data-msg="Cuéntame algo interesante">📖 Cuéntame</button>
        </div>

        <!-- INPUT AREA -->
        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea
                        class="chat-input"
                        id="chatInput"
                        placeholder="Escribe tu mensaje aquí..."
                        rows="1"
                    ></textarea>
                </div>
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- CONSTELLATION PANEL -->
        <div class="constellation-panel" id="constellationPanel">
            <div class="constellation-title">Constelación AVIA (26 Bots)</div>
            <div class="constellation-grid" id="constellationGrid"></div>
        </div>
    </div>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // ===== AVIA SENIOR β4.7.0 - PROTOTIPO FUNCIONAL =====
        // Conectado a Poe Embed API

        // ===== CONSTELLATION (26 BOTS) =====
        const BOTS = [
            { id: 'Claude-Sonnet-4.5', name: 'Claude', icon: 'fa-crown', color: '#6366f1' },
            { id: 'GPT-5.1', name: 'GPT-5.1', icon: 'fa-brain', color: '#10b981' },
            { id: 'Gemini-2.5-Flash', name: 'Gemini', icon: 'fa-gem', color: '#f59e0b' },
            { id: 'Grok-4-Fast-Non-Reasoning', name: 'Grok', icon: 'fa-bolt', color: '#ef4444' },
            { id: 'Claude-Opus-4.5', name: 'Opus', icon: 'fa-star', color: '#8b5cf6' },
            { id: 'AVIA-Studiov2', name: 'Studio', icon: 'fa-palette', color: '#ec4899' },
            { id: 'Script-Bot-Creator', name: 'Script', icon: 'fa-code', color: '#06b6d4' },
            { id: 'KWMAG', name: 'KWMAG', icon: 'fa-key', color: '#14b8a6' },
            { id: 'Care', name: 'Care', icon: 'fa-heart', color: '#f43f5e' },
            { id: 'Siesta', name: 'Siesta', icon: 'fa-moon', color: '#a855f7' },
            { id: 'DMUH', name: 'DMUH', icon: 'fa-user-tie', color: '#3b82f6' },
            { id: 'VideoLab', name: 'Video', icon: 'fa-video', color: '#f97316' },
            { id: 'CreatorHub', name: 'Creator', icon: 'fa-users', color: '#d946ef' },
            { id: 'RMCWA', name: 'RMCWA', icon: 'fa-bullhorn', color: '#22c55e' },
            { id: 'App-Creator', name: 'AppC', icon: 'fa-mobile', color: '#0ea5e9' },
            { id: 'CUIDA', name: 'CUIDA', icon: 'fa-universal-access', color: '#0d9488' },
            { id: 'HUMANA', name: 'HUMANA', icon: 'fa-hands-helping', color: '#059669' },
            { id: 'DIVERSIA', name: 'DIVERSIA', icon: 'fa-people-group', color: '#0891b2' },
            { id: 'MEMORIA', name: 'MEMORIA', icon: 'fa-brain', color: '#db2777' },
            { id: 'CHISPA', name: 'CHISPA', icon: 'fa-child', color: '#e11d48' },
            { id: 'Guardian', name: 'Guard', icon: 'fa-shield', color: '#16a34a' },
            { id: 'Nexus', name: 'Nexus', icon: 'fa-plug', color: '#7c3aed' },
            { id: 'Chronicle', name: 'Chron', icon: 'fa-clock', color: '#2563eb' },
            { id: 'Mentor', name: 'Mentor', icon: 'fa-chalkboard', color: '#9333ea' },
            { id: 'Pulse', name: 'Pulse', icon: 'fa-heart-pulse', color: '#dc2626' },
            { id: 'AVIA-Nómada', name: 'Nómada', icon: 'fa-globe', color: '#15803d' }
        ];

        // ===== STATE =====
        let state = {
            currentBot: 'Claude-Sonnet-4.5',
            isLoading: false,
            messageHistory: []
        };

        // ===== DOM ELEMENTS =====
        const chatArea = document.getElementById('chatArea');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const errorMsg = document.getElementById('errorMsg');
        const statusText = document.getElementById('statusText');
        const constellationPanel = document.getElementById('constellationPanel');
        const constellationGrid = document.getElementById('constellationGrid');
        const constellationBtn = document.getElementById('constellationBtn');

        // ===== SYSTEM PROMPT FOR AVIA SENIOR =====
        const AVIA_SYSTEM_PROMPT = `Eres AVIA Senior, un asistente virtual cariñoso diseñado para personas mayores.

PERSONALIDAD:
- Amable, paciente y cercano
- Usas un lenguaje claro y sencillo
- Usas emojis moderadamente para ser más cercano
- Evitas tecnicismos

CAPACIDADES:
- Salud y bienestar (recordatorios de medicamentos)
- Conexión con familia
- Compañía y entretenimiento
- Asistencia en emergencias

MODO AUTÓNOMO:
- NO hagas preguntas obvias
- Si una tarea es clara, HAZLA directamente
- Sé PROACTIVO
- Responde siempre en español

Si detectas emergencia, prioriza seguridad y menciona el 112.`;

        // ===== INITIALIZE =====
        function init() {
            renderConstellation();
            setupEventListeners();
            registerMessageHandler();
        }

        // ===== RENDER CONSTELLATION =====
        function renderConstellation() {
            constellationGrid.innerHTML = BOTS.map(bot => `
                <div class="bot-mini"
                     style="background: ${bot.color};"
                     data-bot="${bot.id}"
                     title="${bot.name}">
                    <i class="fas ${bot.icon}"></i>
                </div>
            `).join('');
        }

        // ===== SETUP EVENT LISTENERS =====
        function setupEventListeners() {
            // Send message
            sendBtn.addEventListener('click', sendMessage);
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Auto-resize textarea
            chatInput.addEventListener('input', () => {
                chatInput.style.height = 'auto';
                chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
            });

            // Quick actions
            document.querySelectorAll('.quick-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const msg = btn.dataset.msg;
                    if (msg) {
                        chatInput.value = msg;
                        sendMessage();
                    }
                });
            });

            // Bot selector
            document.querySelectorAll('.bot-chip[data-bot]').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.bot-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    state.currentBot = chip.dataset.bot;
                });
            });

            // Constellation panel
            constellationBtn.addEventListener('click', () => {
                constellationPanel.classList.toggle('show');
            });

            // Constellation bot selection
            constellationGrid.addEventListener('click', (e) => {
                const botMini = e.target.closest('.bot-mini');
                if (botMini) {
                    state.currentBot = botMini.dataset.bot;
                    document.querySelectorAll('.bot-chip').forEach(c => c.classList.remove('active'));
                    constellationPanel.classList.remove('show');
                    showNotification(`Bot cambiado a: ${botMini.title}`);
                }
            });

            // Close constellation on outside click
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#constellationPanel') && !e.target.closest('#constellationBtn')) {
                    constellationPanel.classList.remove('show');
                }
            });
        }

        // ===== REGISTER POE MESSAGE HANDLER =====
        function registerMessageHandler() {
            if (window.Poe) {
                window.Poe.registerHandler('avia-handler', (result, context) => {
                    const msg = result.responses[0];

                    // Get or create message element
                    let msgElement = document.getElementById(context.msgId);

                    if (!msgElement) {
                        // Create new message element
                        msgElement = createBotMessage(context.msgId, context.botName);
                    }

                    const contentDiv = msgElement.querySelector('.message-content');

                    if (msg.status === 'error') {
                        contentDiv.innerHTML = `<span style="color: var(--danger);">❌ Error: ${msg.statusText || 'Algo salió mal'}</span>`;
                        setLoading(false);
                    } else if (msg.status === 'incomplete') {
                        // Streaming - update content
                        contentDiv.innerHTML = formatMarkdown(msg.content);
                        scrollToBottom();
                    } else if (msg.status === 'complete') {
                        // Final content
                        contentDiv.innerHTML = formatMarkdown(msg.content);
                        setLoading(false);
                        scrollToBottom();
                    }
                });
            }
        }

        // ===== SEND MESSAGE =====
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || state.isLoading) return;

            // Hide welcome screen
            if (welcomeScreen) {
                welcomeScreen.style.display = 'none';
            }

            // Add user message
            addUserMessage(text);
            chatInput.value = '';
            chatInput.style.height = 'auto';

            // Show loading
            setLoading(true);
            hideError();

            // Check if Poe API is available
            if (!window.Poe) {
                showError('Poe API no disponible. Abre este Canvas en Poe para usarlo.');
                setLoading(false);
                return;
            }

            // Prepare message with system context
            const fullPrompt = `${AVIA_SYSTEM_PROMPT}\n\n---\nUSUARIO: ${text}`;
            const msgId = 'msg-' + Date.now();

            try {
                await window.Poe.sendUserMessage(
                    `@${state.currentBot} ${fullPrompt}`,
                    {
                        handler: 'avia-handler',
                        stream: true,
                        openChat: false,
                        handlerContext: {
                            msgId: msgId,
                            botName: state.currentBot
                        }
                    }
                );
            } catch (err) {
                console.error('Error sending message:', err);
                showError(`Error: ${err.message || 'No se pudo enviar el mensaje'}`);
                setLoading(false);
            }
        }

        // ===== ADD USER MESSAGE =====
        function addUserMessage(text) {
            const time = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            msgDiv.innerHTML = `
                <div class="message-content">${escapeHtml(text)}</div>
            `;

            chatArea.appendChild(msgDiv);
            scrollToBottom();
        }

        // ===== CREATE BOT MESSAGE =====
        function createBotMessage(id, botName) {
            const time = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            const bot = BOTS.find(b => b.id === botName) || BOTS[0];

            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = 'message bot';
            msgDiv.innerHTML = `
                <div class="message-header">
                    <div class="message-avatar" style="background: ${bot.color};">
                        <i class="fas ${bot.icon}"></i>
                    </div>
                    <span class="message-sender">${bot.name}</span>
                    <span class="message-time">${time}</span>
                </div>
                <div class="message-content">
                    <span class="typing-indicator">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </span>
                </div>
            `;

            chatArea.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        // ===== FORMAT MARKDOWN =====
        function formatMarkdown(text) {
            if (!text) return '';
            try {
                // Configure marked for safe rendering
                marked.setOptions({
                    breaks: true,
                    gfm: true
                });
                return marked.parse(text);
            } catch (e) {
                // Fallback to simple formatting
                return text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br>');
            }
        }

        // ===== UTILITIES =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function setLoading(loading) {
            state.isLoading = loading;
            sendBtn.disabled = loading;
            statusText.textContent = loading ? 'Pensando...' : 'Conectado';
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }

        function showNotification(msg) {
            // Simple visual feedback
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 70px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--primary);
                color: white;
                padding: 10px 20px;
                border-radius: 20px;
                font-size: 0.85rem;
                z-index: 1000;
                animation: fadeSlideIn 0.3s ease;
            `;
            notification.textContent = msg;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(-50%) translateY(-10px)';
                notification.style.transition = 'all 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
