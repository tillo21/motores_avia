<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Senior - Multi-Agent Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['DM Sans', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap');

        * { font-family: 'DM Sans', sans-serif; }

        :root {
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --surface: #ffffff;
            --surface-hover: #f9fafb;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
        }

        .dark {
            --surface: #1e1e2e;
            --surface-hover: #262638;
            --text-primary: #cdd6f4;
            --text-secondary: #a6adc8;
            --border: #313244;
        }

        .gradient-bg {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .agent-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .agent-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }
        .dark .agent-card:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .progress-bar { transition: width 1s ease-in-out; }

        .pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .fade-in { animation: fadeIn 0.5s ease-out both; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notification { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .modal-overlay {
            animation: fadeOverlay 0.2s ease-out;
        }
        @keyframes fadeOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            animation: scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chart-bar { transition: height 0.8s ease-in-out; }

        .task-row { transition: all 0.2s ease; }
        .task-row:hover { transform: translateX(4px); }

        .btn-action {
            transition: all 0.15s ease;
        }
        .btn-action:hover {
            transform: scale(1.1);
        }
        .btn-action:active {
            transform: scale(0.95);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #a0aec0; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #4a5568; }

        input, select, textarea {
            font-size: 16px;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#11111b] transition-colors duration-300">

    <!-- Header -->
    <header class="gradient-bg text-white shadow-2xl">
        <div class="container mx-auto px-4 sm:px-6 py-4 sm:py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3 sm:space-x-4">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-white rounded-xl flex items-center justify-center">
                        <i class="fas fa-robot text-purple-600 text-xl sm:text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-3xl font-bold tracking-tight">AVIA SENIOR</h1>
                        <p class="text-purple-200 text-xs sm:text-sm">Multi-Agent Development Platform</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2 sm:space-x-4">
                    <div class="hidden sm:flex items-center glass px-3 py-1.5 rounded-lg">
                        <span class="text-xs sm:text-sm">Staging</span>
                    </div>
                    <div class="hidden sm:flex items-center space-x-2">
                        <div class="w-2.5 h-2.5 bg-green-400 rounded-full pulse-dot"></div>
                        <span class="text-xs font-medium">Operacional</span>
                    </div>
                    <button onclick="openSettingsModal()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-lg font-semibold transition text-sm">
                        <i class="fas fa-cog"></i><span class="hidden sm:inline ml-2">Settings</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container mx-auto px-4 sm:px-6 py-6 sm:py-8">

        <!-- Stats Overview -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-6 mb-6 sm:mb-8">
            <div class="bg-white dark:bg-[#1e1e2e] rounded-2xl shadow-lg dark:shadow-none dark:border dark:border-[#313244] p-4 sm:p-6 fade-in">
                <div class="flex items-center justify-between mb-3 sm:mb-4">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-blue-100 dark:bg-blue-900/30 rounded-xl flex items-center justify-center">
                        <i class="fas fa-users text-blue-600 dark:text-blue-400 text-lg sm:text-xl"></i>
                    </div>
                    <span class="text-green-600 dark:text-green-400 text-xs font-semibold">+2 hoy</span>
                </div>
                <h3 class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm font-medium mb-1">Agentes Activos</h3>
                <p class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-100" id="stat-agents">4</p>
            </div>

            <div class="bg-white dark:bg-[#1e1e2e] rounded-2xl shadow-lg dark:shadow-none dark:border dark:border-[#313244] p-4 sm:p-6 fade-in" style="animation-delay: 0.1s">
                <div class="flex items-center justify-between mb-3 sm:mb-4">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-purple-100 dark:bg-purple-900/30 rounded-xl flex items-center justify-center">
                        <i class="fas fa-tasks text-purple-600 dark:text-purple-400 text-lg sm:text-xl"></i>
                    </div>
                    <span class="text-blue-600 dark:text-blue-400 text-xs font-semibold">85%</span>
                </div>
                <h3 class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm font-medium mb-1">Tareas Totales</h3>
                <p class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-100" id="stat-tasks">23</p>
            </div>

            <div class="bg-white dark:bg-[#1e1e2e] rounded-2xl shadow-lg dark:shadow-none dark:border dark:border-[#313244] p-4 sm:p-6 fade-in" style="animation-delay: 0.2s">
                <div class="flex items-center justify-between mb-3 sm:mb-4">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-green-100 dark:bg-green-900/30 rounded-xl flex items-center justify-center">
                        <i class="fas fa-project-diagram text-green-600 dark:text-green-400 text-lg sm:text-xl"></i>
                    </div>
                    <span class="text-purple-600 dark:text-purple-400 text-xs font-semibold">1 activo</span>
                </div>
                <h3 class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm font-medium mb-1">Proyectos</h3>
                <p class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-100" id="stat-projects">1</p>
            </div>

            <div class="bg-white dark:bg-[#1e1e2e] rounded-2xl shadow-lg dark:shadow-none dark:border dark:border-[#313244] p-4 sm:p-6 fade-in" style="animation-delay: 0.3s">
                <div class="flex items-center justify-between mb-3 sm:mb-4">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-orange-100 dark:bg-orange-900/30 rounded-xl flex items-center justify-center">
                        <i class="fas fa-clock text-orange-600 dark:text-orange-400 text-lg sm:text-xl"></i>
                    </div>
                    <span class="text-red-600 dark:text-red-400 text-xs font-semibold">Crítico</span>
                </div>
                <h3 class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm font-medium mb-1">Deploy en</h3>
                <p class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-100" id="countdown">2:45:30</p>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">

            <!-- Left Column: Agents -->
            <div class="lg:col-span-2">
                <div class="flex items-center justify-between mb-4 sm:mb-6">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800 dark:text-gray-100">
                        <i class="fas fa-robot text-purple-600 dark:text-purple-400 mr-2"></i>
                        Agentes
                    </h2>
                    <button onclick="openNewAgentModal()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 sm:px-4 py-2 rounded-lg font-semibold transition text-sm">
                        <i class="fas fa-plus mr-1 sm:mr-2"></i>Nuevo Agente
                    </button>
                </div>

                <div id="agents-container" class="space-y-4">
                </div>
            </div>

            <!-- Right Column: Tasks & Activity -->
            <div class="space-y-6">

                <!-- Active Tasks -->
                <div class="bg-white dark:bg-[#1e1e2e] rounded-2xl shadow-lg dark:shadow-none dark:border dark:border-[#313244] p-4 sm:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg sm:text-xl font-bold text-gray-800 dark:text-gray-100">
                            <i class="fas fa-list-check text-blue-600 dark:text-blue-400 mr-2"></i>
                            Tareas Activas
                        </h3>
                        <button onclick="openNewTaskModal()" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 text-sm font-semibold transition">
                            <i class="fas fa-plus mr-1"></i>Nueva
                        </button>
                    </div>
                    <div id="tasks-container" class="space-y-2">
                    </div>
                </div>

                <!-- System Activity -->
                <div class="bg-white dark:bg-[#1e1e2e] rounded-2xl shadow-lg dark:shadow-none dark:border dark:border-[#313244] p-4 sm:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg sm:text-xl font-bold text-gray-800 dark:text-gray-100">
                            <i class="fas fa-bolt text-amber-500 mr-2"></i>
                            Actividad
                        </h3>
                        <button onclick="clearActivity()" class="text-gray-400 hover:text-red-500 text-sm transition" title="Limpiar actividad">
                            <i class="fas fa-trash-can"></i>
                        </button>
                    </div>
                    <div id="activity-container" class="space-y-2 max-h-72 overflow-y-auto">
                    </div>
                </div>

            </div>
        </div>

        <!-- Performance Chart -->
        <div class="mt-6 sm:mt-8 bg-white dark:bg-[#1e1e2e] rounded-2xl shadow-lg dark:shadow-none dark:border dark:border-[#313244] p-4 sm:p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg sm:text-xl font-bold text-gray-800 dark:text-gray-100">
                    <i class="fas fa-chart-line text-indigo-600 dark:text-indigo-400 mr-2"></i>
                    Rendimiento
                </h3>
                <button onclick="refreshChart()" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 text-sm font-semibold transition">
                    <i class="fas fa-sync-alt mr-1"></i>Actualizar
                </button>
            </div>
            <div class="flex items-end justify-around h-52 sm:h-64" id="chart-container">
            </div>
        </div>

    </div>

    <!-- Notification Container -->
    <div id="notifications" class="fixed top-4 right-4 space-y-3 z-[60] max-w-xs sm:max-w-sm"></div>

    <!-- Modal Container -->
    <div id="modal-root"></div>

    <script>
        // ============ DARK MODE ============
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // ============ STATE ============
        let agents = [
            {
                id: '1', name: 'Carlos', role: 'ORCHESTRATOR', status: 'available',
                capabilities: ['Orquestación', 'Decisión', 'Coordinación'],
                currentTask: 'Supervisión del deployment', progress: 100, avatar: '👨‍💼'
            },
            {
                id: '2', name: 'Ulises', role: 'BACKEND_LEAD', status: 'busy',
                capabilities: ['APIs', 'Database', 'Architecture'],
                currentTask: 'Implementación CRUD de agentes', progress: 85, avatar: '👨‍💻'
            },
            {
                id: '3', name: 'Diego', role: 'FRONTEND_LEAD', status: 'busy',
                capabilities: ['React', 'UI/UX', 'TypeScript'],
                currentTask: 'Integración con backend', progress: 90, avatar: '👨‍🎨'
            },
            {
                id: '4', name: 'Armando', role: 'DEVOPS', status: 'busy',
                capabilities: ['CI/CD', 'Docker', 'Cloud'],
                currentTask: 'Pipeline de staging', progress: 95, avatar: '👨‍🔧'
            },
            {
                id: '5', name: 'Javier', role: 'QA_LEAD', status: 'available',
                capabilities: ['Testing', 'Automation', 'Quality'],
                currentTask: 'Smoke tests staging', progress: 75, avatar: '👨‍🔬'
            }
        ];

        let tasks = [
            { id: '1', title: 'CI/CD Pipeline Setup', status: 'in_progress', assignedTo: 'Armando', priority: 'critical' },
            { id: '2', title: 'API Integration', status: 'in_progress', assignedTo: 'Diego', priority: 'high' },
            { id: '3', title: 'Database Seeding', status: 'pending', assignedTo: 'Ulises', priority: 'high' },
            { id: '4', title: 'Smoke Tests', status: 'pending', assignedTo: 'Javier', priority: 'medium' },
            { id: '5', title: 'Documentation', status: 'pending', assignedTo: 'Carlos', priority: 'medium' }
        ];

        let activityLog = [
            { agent: 'Armando', action: 'completó Dockerfile configuration', time: 'hace 2 min', type: 'success' },
            { agent: 'Javier', action: 'ejecutó tests con 100% coverage', time: 'hace 5 min', type: 'success' },
            { agent: 'Diego', action: 'actualizó Dashboard UI', time: 'hace 12 min', type: 'info' },
            { agent: 'Ulises', action: 'optimizó queries MongoDB', time: 'hace 18 min', type: 'info' },
            { agent: 'Carlos', action: 'revisó deployment strategy', time: 'hace 25 min', type: 'info' }
        ];

        let nextAgentId = 6;
        let nextTaskId = 6;

        // ============ UTILITIES ============
        function getStatusColor(status) {
            return { available: 'text-green-600 bg-green-100 dark:text-green-400 dark:bg-green-900/40', busy: 'text-orange-600 bg-orange-100 dark:text-orange-400 dark:bg-orange-900/40', offline: 'text-red-600 bg-red-100 dark:text-red-400 dark:bg-red-900/40' }[status] || '';
        }
        function getStatusIcon(s) {
            return { available: 'fa-circle-check', busy: 'fa-clock', offline: 'fa-circle-xmark' }[s] || 'fa-circle-xmark';
        }
        function getTaskStatusClass(s) {
            return { completed: 'bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300', in_progress: 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300', pending: 'bg-indigo-100 text-indigo-800 dark:bg-indigo-900/40 dark:text-indigo-300' }[s] || '';
        }
        function getTaskStatusLabel(s) {
            return { completed: 'Completada', in_progress: 'En progreso', pending: 'Pendiente' }[s] || s;
        }
        function nextTaskStatus(s) {
            return { pending: 'in_progress', in_progress: 'completed', completed: 'pending' }[s] || 'pending';
        }

        // ============ NOTIFICATIONS ============
        function showNotification(message, type) {
            type = type || 'info';
            var colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-indigo-600', warning: 'bg-orange-500' };
            var icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
            var n = document.createElement('div');
            n.className = 'notification ' + (colors[type] || colors.info) + ' text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-sm';
            n.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i><span>' + message + '</span>';
            document.getElementById('notifications').appendChild(n);
            setTimeout(function () {
                n.style.opacity = '0';
                n.style.transform = 'translateX(100px)';
                n.style.transition = 'all 0.3s ease';
                setTimeout(function () { n.remove(); }, 300);
            }, 3500);
        }

        // ============ MODAL SYSTEM ============
        function openModal(title, bodyHTML, footerHTML) {
            closeModal();
            var root = document.getElementById('modal-root');
            var overlay = document.createElement('div');
            overlay.id = 'modal-overlay';
            overlay.className = 'modal-overlay fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4';
            overlay.onclick = function (e) { if (e.target === overlay) closeModal(); };

            overlay.innerHTML =
                '<div class="modal-content bg-white dark:bg-[#1e1e2e] rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">' +
                    '<div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-[#313244]">' +
                        '<h2 class="text-lg font-bold text-gray-800 dark:text-gray-100">' + title + '</h2>' +
                        '<button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition text-xl"><i class="fas fa-times"></i></button>' +
                    '</div>' +
                    '<div class="p-5">' + bodyHTML + '</div>' +
                    (footerHTML ? '<div class="p-5 border-t border-gray-200 dark:border-[#313244] flex justify-end space-x-3">' + footerHTML + '</div>' : '') +
                '</div>';
            root.appendChild(overlay);
        }

        function closeModal() {
            var el = document.getElementById('modal-overlay');
            if (el) el.remove();
        }

        // ============ SETTINGS MODAL ============
        function openSettingsModal() {
            var isDark = document.documentElement.classList.contains('dark');
            var refreshInterval = 30;

            var body =
                '<div class="space-y-5">' +
                    '<div>' +
                        '<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Apariencia</label>' +
                        '<div class="flex gap-2">' +
                            '<button onclick="setTheme(\'light\')" id="btn-theme-light" class="flex-1 px-4 py-2.5 rounded-xl border-2 text-sm font-medium transition ' + (!isDark ? 'border-purple-500 bg-purple-50 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300' : 'border-gray-200 dark:border-[#313244] text-gray-600 dark:text-gray-400 hover:border-gray-300') + '"><i class="fas fa-sun mr-2"></i>Claro</button>' +
                            '<button onclick="setTheme(\'dark\')" id="btn-theme-dark" class="flex-1 px-4 py-2.5 rounded-xl border-2 text-sm font-medium transition ' + (isDark ? 'border-purple-500 bg-purple-50 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300' : 'border-gray-200 dark:border-[#313244] text-gray-600 dark:text-gray-400 hover:border-gray-300') + '"><i class="fas fa-moon mr-2"></i>Oscuro</button>' +
                        '</div>' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Auto-refresh (segundos)</label>' +
                        '<input type="number" id="settings-refresh" value="' + refreshInterval + '" min="10" max="300" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-[#313244] bg-white dark:bg-[#11111b] text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-purple-500 outline-none" />' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Notificaciones simuladas</label>' +
                        '<div class="flex items-center gap-3">' +
                            '<button onclick="toggleSimNotifications(this)" id="btn-sim-notif" class="relative w-12 h-7 rounded-full transition bg-purple-500">' +
                                '<span class="absolute top-0.5 left-0.5 w-6 h-6 bg-white rounded-full transition-transform transform translate-x-5"></span>' +
                            '</button>' +
                            '<span class="text-sm text-gray-600 dark:text-gray-400" id="sim-notif-label">Activadas</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="pt-2 border-t border-gray-200 dark:border-[#313244]">' +
                        '<p class="text-xs text-gray-400 dark:text-gray-500 mb-3">Zona de peligro</p>' +
                        '<button onclick="resetAllData()" class="w-full px-4 py-2.5 rounded-xl border-2 border-red-300 dark:border-red-800 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 text-sm font-medium transition"><i class="fas fa-trash-alt mr-2"></i>Resetear todos los datos</button>' +
                    '</div>' +
                '</div>';

            openModal('<i class="fas fa-cog text-purple-600 dark:text-purple-400 mr-2"></i>Settings', body, '');
        }

        var simNotificationsEnabled = true;
        function toggleSimNotifications(btn) {
            simNotificationsEnabled = !simNotificationsEnabled;
            var dot = btn.querySelector('span');
            var label = document.getElementById('sim-notif-label');
            if (simNotificationsEnabled) {
                btn.className = 'relative w-12 h-7 rounded-full transition bg-purple-500';
                dot.className = 'absolute top-0.5 left-0.5 w-6 h-6 bg-white rounded-full transition-transform transform translate-x-5';
                label.textContent = 'Activadas';
            } else {
                btn.className = 'relative w-12 h-7 rounded-full transition bg-gray-300 dark:bg-gray-600';
                dot.className = 'absolute top-0.5 left-0.5 w-6 h-6 bg-white rounded-full transition-transform transform translate-x-0';
                label.textContent = 'Desactivadas';
            }
        }

        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            closeModal();
            openSettingsModal();
            showNotification('Tema cambiado a ' + (theme === 'dark' ? 'oscuro' : 'claro'), 'success');
        }

        function resetAllData() {
            openConfirmDialog('¿Resetear todos los datos a los valores iniciales?', function () {
                location.reload();
            });
        }

        var selectedAvatar = '👨‍💻';
        function pickAvatar(btn, emoji) {
            selectedAvatar = emoji;
            document.getElementById('new-agent-avatar').value = emoji;
            var picker = document.getElementById('avatar-picker');
            Array.from(picker.children).forEach(function (b) {
                b.className = b.className.replace(/border-purple-500 bg-purple-50 dark:bg-purple-900\/30/g, 'border-gray-200 dark:border-[#313244] hover:border-gray-300');
            });
            btn.className = btn.className.replace(/border-gray-200 dark:border-\[#313244\] hover:border-gray-300/g, 'border-purple-500 bg-purple-50 dark:bg-purple-900/30');

        function createAgent() {
            var name = document.getElementById('new-agent-name').value.trim();
            var role = document.getElementById('new-agent-role').value;
            var avatar = document.getElementById('new-agent-avatar').value;
            var capsStr = document.getElementById('new-agent-caps').value.trim();

            if (!name) {
                showNotification('Por favor ingresa un nombre para el agente', 'warning');
                return;

            var caps = capsStr ? capsStr.split(',').map(function (c) { return c.trim(); }).filter(Boolean) : ['General'];

                name: name,
                role: role,
                status: 'available',
                capabilities: caps,
                currentTask: 'Sin tarea asignada',
                progress: 0,
                avatar: avatar
            });

            closeModal();
            renderAll();

        // ============ AGENT DETAIL MODAL ============
        function openAgentDetail(agentId) {
            var agent = agents.find(function (a) { return a.id === agentId; });
            if (!agent) return;

            var statuses = ['available', 'busy', 'offline'];
            var agentTasks = tasks.filter(function (t) { return t.assignedTo === agent.name; });

                '<div class="flex items-center space-x-4 mb-5">' +
                    '<div class="text-5xl">' + agent.avatar + '</div>' +

                    '</div>' +
                '</div>' +
                '<div class="space-y-4">' +
                    '<div>' +
                        '<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Estado</label>' +

                                var active = s === agent.status;
                                var colors = { available: 'border-green-500 bg-green-50 text-green-700 dark:bg-green-900/30 dark:text-green-300', busy: 'border-orange-500 bg-orange-50 text-orange-700 dark:bg-orange-900/30 dark:text-orange-300', offline: 'border-red-500 bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-300' };

                    '<div>' +
                        '<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Tarea actual</label>' +

                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Progreso: <span id="progress-val">' + agent.progress + '%</span></label>' +
                        '<input type="range" id="agent-progress-input" min="0" max="100" value="' + agent.progress + '" oninput="document.getElementById(\'progress-val\').textContent=this.value+\'%\'" class="w-full accent-purple-600" />' +
                    '</div>' +
                    (agentTasks.length > 0 ?
                        '<div>' +

                            '<div class="space-y-1.5">' +
                                agentTasks.map(function (t) {
                                    return '<div class="flex items-center justify-between text-xs px-3 py-2 rounded-lg ' + getTaskStatusClass(t.status) + '">' +
                                        '<span class="font-medium">' + t.title + '</span>' +
                                        '<span class="opacity-75">' + getTaskStatusLabel(t.status) + '</span>' +
                                    '</div>';

                            '</div>' +
                        '</div>'
                    : '') +
                '</div>';

            var footer =
                '<button onclick="removeAgent(\'' + agentId + '\')" class="px-4 py-2 rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition text-sm font-medium mr-auto"><i class="fas fa-trash mr-1"></i>Eliminar</button>' +
                '<button onclick="closeModal()" class="px-4 py-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-[#313244] transition text-sm font-medium">Cancelar</button>' +
                '<button onclick="saveAgentDetail(\'' + agentId + '\')" class="px-5 py-2 rounded-lg bg-purple-600 hover:bg-purple-700 text-white transition text-sm font-semibold">Guardar</button>';

            openModal('<i class="fas fa-user-gear text-purple-600 dark:text-purple-400 mr-2"></i>Detalle del Agente', body, footer);
        }

        function changeAgentStatus(agentId, status) {
            var agent = agents.find(function (a) { return a.id === agentId; });
            if (agent) {
                agent.status = status;
                openAgentDetail(agentId);
            }
        }

        function saveAgentDetail(agentId) {
            var agent = agents.find(function (a) { return a.id === agentId; });
            if (!agent) return;
            agent.currentTask = document.getElementById('agent-task-input').value.trim() || 'Sin tarea asignada';
            agent.progress = parseInt(document.getElementById('agent-progress-input').value, 10);
            closeModal();
            renderAll();
            addActivity(agent.name, 'fue actualizado', 'info');
            showNotification('Agente "' + agent.name + '" actualizado', 'success');
        }

        function removeAgent(agentId) {
            var agent = agents.find(function (a) { return a.id === agentId; });
            if (!agent) return;
            closeModal();
            openConfirmDialog('¿Eliminar al agente "' + agent.name + '"? Esta acción no se puede deshacer.', function () {
                var name = agent.name;
                agents = agents.filter(function (a) { return a.id !== agentId; });
                renderAll();
                addActivity(name, 'fue eliminado del equipo', 'warning');
                showNotification('Agente "' + name + '" eliminado', 'warning');
            });
        }

        // ============ NEW TASK MODAL ============
        function openNewTaskModal() {
            var priorities = ['critical', 'high', 'medium', 'low'];
            var priLabels = { critical: 'Crítica', high: 'Alta', medium: 'Media', low: 'Baja' };

            var body =
                '<div class="space-y-4">' +
                    '<div>' +
                        '<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Título</label>' +
                        '<input type="text" id="new-task-title" placeholder="Nombre de la tarea" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-[#313244] bg-white dark:bg-[#11111b] text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-purple-500 outline-none" />' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Asignado a</label>' +
                        '<select id="new-task-assignee" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-[#313244] bg-white dark:bg-[#11111b] text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-purple-500 outline-none">' +
                            agents.map(function (a) { return '<option value="' + a.name + '">' + a.avatar + ' ' + a.name + '</option>'; }).join('') +
                        '</select>' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Prioridad</label>' +
                        '<div class="flex gap-2">' +
                            priorities.map(function (p) {
                                var colors = { critical: 'border-red-500 bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-300', high: 'border-orange-500 bg-orange-50 text-orange-700 dark:bg-orange-900/30 dark:text-orange-300', medium: 'border-blue-500 bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300', low: 'border-gray-400 bg-gray-50 text-gray-600 dark:bg-gray-800 dark:text-gray-400' };
                                return '<button type="button" onclick="pickPriority(this, \'' + p + '\')" class="flex-1 px-2 py-2 rounded-xl border-2 text-xs font-medium transition ' +
                                    (p === 'medium' ? colors[p] : 'border-gray-200 dark:border-[#313244] text-gray-500 dark:text-gray-400 hover:border-gray-300') +
                                    '" data-priority="' + p + '">' + priLabels[p] + '</button>';
                            }).join('') +
                        '</div>' +
                        '<input type="hidden" id="new-task-priority" value="medium" />' +
                    '</div>' +
                '</div>';

            var footer =
                '<button onclick="closeModal()" class="px-4 py-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-[#313244] transition text-sm font-medium">Cancelar</button>' +
                '<button onclick="createTask()" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition text-sm font-semibold"><i class="fas fa-plus mr-1"></i>Crear Tarea</button>';

            openModal('<i class="fas fa-clipboard-list text-blue-600 dark:text-blue-400 mr-2"></i>Nueva Tarea', body, footer);
        }

        function pickPriority(btn, priority) {
            document.getElementById('new-task-priority').value = priority;
            var colors = { critical: 'border-red-500 bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-300', high: 'border-orange-500 bg-orange-50 text-orange-700 dark:bg-orange-900/30 dark:text-orange-300', medium: 'border-blue-500 bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300', low: 'border-gray-400 bg-gray-50 text-gray-600 dark:bg-gray-800 dark:text-gray-400' };
            var siblings = btn.parentElement.querySelectorAll('button');
            siblings.forEach(function (s) {
                var p = s.getAttribute('data-priority');
                if (p === priority) {
                    s.className = 'flex-1 px-2 py-2 rounded-xl border-2 text-xs font-medium transition ' + colors[p];
                } else {
                    s.className = 'flex-1 px-2 py-2 rounded-xl border-2 text-xs font-medium transition border-gray-200 dark:border-[#313244] text-gray-500 dark:text-gray-400 hover:border-gray-300';
                }
            });
        }

        function createTask() {
            var title = document.getElementById('new-task-title').value.trim();
            var assignee = document.getElementById('new-task-assignee').value;
            var priority = document.getElementById('new-task-priority').value;

            if (!title) {
                showNotification('Por favor ingresa un título para la tarea', 'warning');
                return;
            }

            tasks.push({
                id: String(nextTaskId++),
                title: title,
                status: 'pending',
                assignedTo: assignee,
                priority: priority
            });

            closeModal();
            renderAll();
            addActivity(assignee, 'recibió nueva tarea: ' + title, 'info');
            showNotification('Tarea "' + title + '" creada', 'success');
        }

        // ============ TASK ACTIONS ============
        function cycleTaskStatus(taskId) {
            var task = tasks.find(function (t) { return t.id === taskId; });
            if (!task) return;
            var oldStatus = task.status;
            task.status = nextTaskStatus(oldStatus);
            renderAll();
            addActivity(task.assignedTo, 'cambió "' + task.title + '" a ' + getTaskStatusLabel(task.status), task.status === 'completed' ? 'success' : 'info');
        }

        function removeTask(taskId) {
            var task = tasks.find(function (t) { return t.id === taskId; });
            if (!task) return;
            openConfirmDialog('¿Eliminar la tarea "' + task.title + '"?', function () {
                var title = task.title;
                tasks = tasks.filter(function (t) { return t.id !== taskId; });
                renderAll();
                showNotification('Tarea "' + title + '" eliminada', 'warning');
            });
        }

        // ============ ACTIVITY ============
        function addActivity(agent, action, type) {
            activityLog.unshift({ agent: agent, action: action, time: 'ahora', type: type || 'info' });
            if (activityLog.length > 20) activityLog.pop();
            renderActivity();
        }

        function clearActivity() {
            openConfirmDialog('¿Limpiar todo el historial de actividad?', function () {
                activityLog = [];
                renderActivity();
                showNotification('Actividad limpiada', 'info');
            });
        }

        // ============ CHART ============
        function refreshChart() {
            agents.forEach(function (a) {
                a.progress = Math.min(100, a.progress + Math.floor(Math.random() * 10));
            });
            renderChart();
            showNotification('Gráfico actualizado', 'success');
        }

        // ============ RENDERERS ============

            container.innerHTML = agents.map(function (agent) {
                return '<div class="agent-card bg-white dark:bg-[#1e1e2e] rounded-2xl shadow-lg dark:shadow-none dark:border dark:border-[#313244] p-4 sm:p-6 cursor-pointer" onclick="openAgentDetail(\'' + agent.id + '\')">' +
                    '<div class="flex items-start justify-between mb-3">' +
                        '<div class="flex items-center space-x-3 sm:space-x-4">' +
                            '<div class="text-4xl sm:text-5xl">' + agent.avatar + '</div>' +
                            '<div>' +
                                '<h3 class="text-lg sm:text-xl font-bold text-gray-800 dark:text-gray-100">' + agent.name + '</h3>' +
                                '<p class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm font-medium">' + agent.role.replace(/_/g, ' ') + '</p>' +
                            '</div>' +
                        '</div>' +
                        '<div class="flex items-center space-x-2 ' + getStatusColor(agent.status) + ' px-2.5 py-1 rounded-full">' +

                            '<span class="text-[10px] sm:text-xs font-semibold uppercase">' + agent.status + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="mb-3">' +
                        '<p class="text-gray-600 dark:text-gray-400 text-xs sm:text-sm mb-2">' +
                            '<i class="fas fa-tasks text-purple-500 mr-2"></i>' + agent.currentTask +
                        '</p>' +
                        '<div class="flex items-center space-x-2">' +
                            '<div class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-2 overflow-hidden">' +
                                '<div class="progress-bar bg-gradient-to-r from-purple-500 to-indigo-500 h-full rounded-full" style="width: ' + agent.progress + '%"></div>' +
                            '</div>' +
                            '<span class="text-xs sm:text-sm font-bold text-gray-700 dark:text-gray-300">' + agent.progress + '%</span>' +

                    '</div>' +
                    '<div class="flex flex-wrap gap-1.5 sm:gap-2">' +
                        agent.capabilities.map(function (cap) {

                    '</div>' +
                    '<div class="mt-3 pt-3 border-t border-gray-100 dark:border-[#313244] flex items-center justify-between">' +

                        '<div class="flex space-x-1">' +
                            '<button onclick="event.stopPropagation(); openAgentDetail(\'' + agent.id + '\')" class="btn-action w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition text-xs" title="Editar"><i class="fas fa-pen"></i></button>' +
                            '<button onclick="event.stopPropagation(); removeAgent(\'' + agent.id + '\')" class="btn-action w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 transition text-xs" title="Eliminar"><i class="fas fa-trash"></i></button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');

        function renderTasks() {
            var container = document.getElementById('tasks-container');
            var priorityIcons = { critical: 'fa-circle-exclamation text-red-500', high: 'fa-arrow-up text-orange-500', medium: 'fa-minus text-blue-500', low: 'fa-arrow-down text-gray-400' };

            container.innerHTML = tasks.map(function (task) {
                return '<div class="task-row flex items-center justify-between p-2.5 sm:p-3 rounded-xl ' + getTaskStatusClass(task.status) + ' group">' +
                    '<div class="flex items-center space-x-2.5 flex-1 min-w-0">' +
                        '<button onclick="cycleTaskStatus(\'' + task.id + '\')" class="btn-action flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition ' +
                            (task.status === 'completed' ? 'border-green-500 bg-green-500 text-white' : task.status === 'in_progress' ? 'border-amber-500 bg-amber-500 text-white' : 'border-gray-300 dark:border-gray-500 hover:border-purple-400') + '" title="Cambiar estado">' +
                            (task.status === 'completed' ? '<i class="fas fa-check text-[10px]"></i>' : task.status === 'in_progress' ? '<i class="fas fa-play text-[8px]"></i>' : '') +
                        '</button>' +
                        '<div class="min-w-0">' +
                            '<p class="font-semibold text-xs sm:text-sm truncate ' + (task.status === 'completed' ? 'line-through opacity-60' : '') + '">' + task.title + '</p>' +
                            '<p class="text-[10px] opacity-60">' + task.assignedTo + ' · ' + getTaskStatusLabel(task.status) + '</p>' +
                        '</div>' +
                    '</div>' +
                    '<div class="flex items-center space-x-1.5 flex-shrink-0">' +
                        '<i class="fas ' + (priorityIcons[task.priority] || '') + ' text-sm"></i>' +
                        '<button onclick="removeTask(\'' + task.id + '\')" class="btn-action w-6 h-6 rounded-lg flex items-center justify-center text-gray-400 hover:text-red-500 transition opacity-0 group-hover:opacity-100 text-xs" title="Eliminar"><i class="fas fa-times"></i></button>' +
                    '</div>' +
                '</div>';
            }).join('');

            document.getElementById('stat-tasks').textContent = tasks.length;

        function renderActivity() {
            var container = document.getElementById('activity-container');
            var typeColors = { success: 'bg-green-500', info: 'bg-blue-500', warning: 'bg-amber-500' };

            if (activityLog.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-400 dark:text-gray-500 text-center py-4">Sin actividad reciente</p>';
                return;
            }

            container.innerHTML = activityLog.map(function (a) {
                return '<div class="flex items-start space-x-3 p-2.5 rounded-lg hover:bg-gray-50 dark:hover:bg-[#262638] transition">' +
                    '<div class="w-2 h-2 ' + (typeColors[a.type] || typeColors.info) + ' rounded-full mt-1.5 flex-shrink-0"></div>' +
                    '<div class="flex-1 min-w-0">' +
                        '<p class="text-xs sm:text-sm text-gray-800 dark:text-gray-200"><span class="font-semibold">' + a.agent + '</span> ' + a.action + '</p>' +
                        '<p class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5">' + a.time + '</p>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderChart() {
            var container = document.getElementById('chart-container');
            var colors = ['bg-purple-500', 'bg-blue-500', 'bg-emerald-500', 'bg-orange-500', 'bg-pink-500', 'bg-cyan-500', 'bg-amber-500', 'bg-rose-500'];

            container.innerHTML = agents.map(function (agent, i) {
                return '<div class="flex flex-col items-center flex-1 min-w-0">' +
                    '<div class="w-full flex flex-col items-center justify-end h-full">' +
                        '<span class="text-xs font-bold text-gray-600 dark:text-gray-400 mb-1">' + agent.progress + '%</span>' +
                        '<div class="chart-bar ' + colors[i % colors.length] + ' rounded-t-lg w-8 sm:w-14 opacity-90 hover:opacity-100 transition" style="height: ' + agent.progress + '%"></div>' +
                    '</div>' +
                    '<p class="text-[10px] sm:text-sm font-semibold text-gray-700 dark:text-gray-300 mt-2 truncate max-w-full">' + agent.name + '</p>' +
                '</div>';
            }).join('');

            document.getElementById('stat-agents').textContent = agents.length;
        }

        function renderAll() {
            renderAgents();
            renderTasks();
            renderActivity();
            renderChart();
        }

        // ============ COUNTDOWN ============
        function startCountdown() {
            var targetTime = new Date();
            targetTime.setHours(16, 0, 0, 0);
            if (new Date() > targetTime) targetTime.setDate(targetTime.getDate() + 1);

            setInterval(function () {
                var now = new Date();
                var diff = targetTime - now;
                var el = document.getElementById('countdown');
                if (diff > 0) {
                    var h = Math.floor(diff / 3600000);
                    var m = Math.floor((diff % 3600000) / 60000);
                    var s = Math.floor((diff % 60000) / 1000);
                    el.textContent = h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                } else {
                    el.textContent = 'DEMO TIME!';
                }
            }, 1000);
        }

        // ============ SIMULATED NOTIFICATIONS ============
        var simInterval = setInterval(function () {
            if (!simNotificationsEnabled || agents.length === 0) return;
            var randomAgent = agents[Math.floor(Math.random() * agents.length)];
            var actions = ['completó una tarea', 'actualizó el código', 'revisó un PR', 'deployó cambios', 'optimizó el rendimiento'];
            showNotification(randomAgent.name + ' ' + actions[Math.floor(Math.random() * actions.length)], 'info');
        }, 45000);

        // ============ INIT ============
        document.addEventListener('DOMContentLoaded', function () {
            renderAll();
            startCountdown();
            showNotification('¡Bienvenido a AVIA Senior Platform!', 'info');
        });
    </script>
</body>
</html>
