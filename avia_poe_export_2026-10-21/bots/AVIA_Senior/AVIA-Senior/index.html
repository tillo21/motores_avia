<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Senior - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-8 text-white text-center">
            <i class="fas fa-shield-alt text-5xl mb-4"></i>
            <h1 class="text-3xl font-bold">AVIA Senior</h1>
            <p class="text-blue-100 mt-2">Panel de Administración</p>
        </div>

        <!-- Form -->
        <form class="p-8 space-y-6" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    <i class="fas fa-user mr-2 text-blue-600"></i>Email
                </label>
                <input 
                    type="email" 
                    id="email"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="admin@avia-senior.com"
                    value="admin@avia-senior.com"
                    required
                >
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    <i class="fas fa-lock mr-2 text-blue-600"></i>Contraseña
                </label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition pr-12"
                        placeholder="••••••••"
                        value="admin123"
                        required
                    >
                    <button 
                        type="button"
                        onclick="togglePassword()"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-blue-600"
                    >
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" class="w-4 h-4 text-blue-600 rounded">
                    <span class="ml-2 text-sm text-gray-600">Recordarme</span>
                </label>
                <a href="#" class="text-sm text-blue-600 hover:text-blue-800">¿Olvidaste tu contraseña?</a>
            </div>

            <button 
                type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-purple-700 transform hover:scale-105 transition duration-200 shadow-lg"
            >
                <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
            </button>

            <div class="text-center mt-4">
                <p class="text-sm text-gray-600">
                    ¿Usuario regular? 
                    <a href="../frontend/index.html" class="text-blue-600 hover:text-blue-800 font-semibold">Ir al portal de usuarios</a>
                </p>
            </div>
        </form>

        <!-- Footer -->
        <div class="bg-gray-50 px-8 py-4 text-center text-sm text-gray-500">
            <p>© 2026 AVIA Senior. Todos los derechos reservados.</p>
            <p class="mt-1">Versión 1.0.0</p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simulación de login
            if (email === 'admin@avia-senior.com' && password === 'admin123') {
                // Mostrar mensaje de éxito
                const button = event.target.querySelector('button[type="submit"]');
                button.innerHTML = '<i class="fas fa-check mr-2"></i>Accediendo...';
                button.disabled = true;
                
                // Redirigir después de 1 segundo
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                alert('Credenciales incorrectas. Usa:\nEmail: admin@avia-senior.com\nPassword: admin123');
            }
        }

        // Auto-focus en el email al cargar
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('email').focus();
        });
    </script>
</body>
</html>
