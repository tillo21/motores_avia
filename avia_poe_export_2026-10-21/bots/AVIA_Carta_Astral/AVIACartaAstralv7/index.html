<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVIA Carta Astral v7.0 — Diseño Atómico</title>
  <style>
    /* ════════════════════════════════════════════════════════════
       AVIA Design System v7.0 — Variables Atómicas
       ════════════════════════════════════════════════════════════ */
    :root {
      --avia-bg-primary: #0a0a1a;
      --avia-bg-secondary: #151525;
      --avia-accent: #667eea;
      --avia-accent-light: #818cf8;
      --avia-text: #e8e8f0;
      --avia-text-dim: #8888aa;
      --avia-border: rgba(255,255,255,0.1);
      --avia-radius: 12px;
      --avia-shadow: 0 4px 24px rgba(102,126,234,0.15);
      --avia-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--avia-bg-primary) 0%, #0f0f2a 100%);
      color: var(--avia-text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ══ HEADER ══ */
    header {
      background: rgba(21,21,37,0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--avia-border);
      padding: 1.25rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--avia-shadow);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--avia-accent) 0%, var(--avia-accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
    }

    .tab-btn {
      padding: 0.5rem 1.25rem;
      border: none;
      background: transparent;
      color: var(--avia-text-dim);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: var(--avia-transition);
      position: relative;
    }

    .tab-btn:hover {
      background: rgba(102,126,234,0.1);
      color: var(--avia-text);
    }

    .tab-btn.active {
      background: var(--avia-accent);
      color: white;
      box-shadow: 0 4px 12px rgba(102,126,234,0.3);
    }

    /* ══ CONTAINER ══ */
    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .tab-content.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ══ CARDS (Organismos) ══ */
    .card {
      background: var(--avia-bg-secondary);
      border: 1px solid var(--avia-border);
      border-radius: var(--avia-radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--avia-shadow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--avia-border);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--avia-accent-light);
    }

    /* ══ FORMS ══ */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--avia-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      padding: 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--avia-border);
      border-radius: 8px;
      color: var(--avia-text);
      font-size: 1rem;
      transition: var(--avia-transition);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--avia-accent);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    /* ══ BUTTONS ══ */
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--avia-transition);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--avia-accent) 0%, var(--avia-accent-light) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102,126,234,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102,126,234,0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: var(--avia-text);
      border: 1px solid var(--avia-border);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }

    /* ══ LAYOUT ══ */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    @media (max-width: 968px) {
      .two-col, .three-col { grid-template-columns: 1fr; }
    }

    /* ══ CHART WRAPPER ══ */
    .chart-wrapper {
      position: relative;
      background: radial-gradient(circle at center, rgba(102,126,234,0.05) 0%, transparent 70%);
      border-radius: var(--avia-radius);
      padding: 2rem;
    }

    /* ══ LOADING ══ */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--avia-text-dim);
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(102,126,234,0.1);
      border-top-color: var(--avia-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ══ BADGES ══ */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-success { background: rgba(16,185,129,0.2); color: #10b981; }
    .badge-warning { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .badge-info { background: rgba(59,130,246,0.2); color: #3b82f6; }

    /* ══ SCORE DISPLAY ══ */
    .score-display {
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle, rgba(102,126,234,0.1) 0%, transparent 70%);
      border-radius: var(--avia-radius);
    }

    .score-number {
      font-size: 4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ══ INSIGHTS LIST ══ */
    .insight-item {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--avia-accent);
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }

    .insight-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .insight-content h4 {
      font-size: 0.9rem;
      color: var(--avia-accent-light);
      margin-bottom: 0.25rem;
    }

    .insight-content p {
      font-size: 0.9rem;
      color: var(--avia-text-dim);
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════
       HEADER (Organismo: Navegación)
       ══════════════════════════════════════════════════════════ -->
  <header>
    <div class="header-content">
      <div class="logo">✦ AVIA Carta Astral v7.0</div>
      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="natal">Natal</button>
        <button class="tab-btn" data-tab="transits">Tránsitos</button>
        <button class="tab-btn" data-tab="synastry">Sinastría</button>
        <button class="tab-btn" data-tab="saved">Guardadas</button>
      </nav>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════
       MAIN CONTAINER
       ══════════════════════════════════════════════════════════ -->
  <main class="container">

    <!-- ══ TAB: NATAL ══ -->
    <div id="tab-natal" class="tab-content active">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Calcular Carta Natal</h2>
          <span class="badge badge-info">Motor Astronómico</span>
        </div>
        
        <form id="form-natal">
          <div class="form-grid">
            <div class="form-group">
              <label for="natal-date">Fecha de Nacimiento</label>
              <input type="date" id="natal-date" required>
            </div>
            <div class="form-group">
              <label for="natal-time">Hora (HH:MM)</label>
              <input type="time" id="natal-time" required>
            </div>
            <div class="form-group">
              <label for="natal-place">Lugar</label>
              <input type="text" id="natal-place" placeholder="Ciudad, País">
            </div>
            <div class="form-group">
              <label for="natal-lat">Latitud</label>
              <input type="number" id="natal-lat" step="0.0001" placeholder="40.7128" required>
            </div>
            <div class="form-group">
              <label for="natal-lon">Longitud</label>
              <input type="number" id="natal-lon" step="0.0001" placeholder="-74.0060" required>
            </div>
            <div class="form-group">
              <label for="natal-label">Etiqueta</label>
              <input type="text" id="natal-label" placeholder="Mi carta">
            </div>
          </div>
          <button type="submit" class="btn btn-primary">✨ Calcular Carta</button>
          <button type="button" id="btn-save-natal" class="btn btn-secondary" style="display:none;">💾 Guardar</button>
        </form>
      </div>

      <!-- Resultados Natal -->
      <div id="natal-results" style="display:none;">
        <div class="two-col">
          <div class="card chart-wrapper">
            <avia-chart-wheel id="natal-wheel" size="600"></avia-chart-wheel>
          </div>
          <div class="card">
            <h3 class="card-title">Posiciones Planetarias</h3>
            <avia-planet-list id="natal-planets"></avia-planet-list>
          </div>
        </div>
        
        <div class="card">
          <h3 class="card-title">Aspectos Natales</h3>
          <avia-aspect-list id="natal-aspects"></avia-aspect-list>
        </div>

        <div class="card">
          <h3 class="card-title">Distribución Elemental</h3>
          <avia-element-bar id="natal-elements"></avia-element-bar>
        </div>
      </div>
    </div>

    <!-- ══ TAB: TRANSITS ══ -->
    <div id="tab-transits" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Tránsitos Actuales</h2>
          <span class="badge badge-warning">Tiempo Real</span>
        </div>
        
        <div class="form-grid">
          <div class="form-group">
            <label for="transit-chart-select">Carta Natal Base</label>
            <select id="transit-chart-select">
              <option value="">Seleccionar carta...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="transit-date">Fecha de Tránsito (opcional)</label>
            <input type="datetime-local" id="transit-date">
          </div>
        </div>
        <button id="btn-calc-transits" class="btn btn-primary">⏱ Calcular Tránsitos</button>
      </div>

      <div id="transit-results" style="display:none;">
        <div class="two-col">
          <div class="card chart-wrapper">
            <avia-chart-wheel id="transit-wheel" mode="transit" size="600"></avia-chart-wheel>
          </div>
          <div class="card">
            <h3 class="card-title">Aspectos de Tránsito</h3>
            <avia-aspect-list id="transit-aspects"></avia-aspect-list>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ TAB: SYNASTRY ══ -->
    <div id="tab-synastry" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Comparar Dos Cartas</h2>
          <span class="badge badge-success">Relaciones</span>
        </div>
        
        <div class="form-grid">
          <div class="form-group">
            <label for="syn-chart1">Carta 1</label>
            <select id="syn-chart1">
              <option value="">Seleccionar...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="syn-chart2">Carta 2</label>
            <select id="syn-chart2">
              <option value="">Seleccionar...</option>
            </select>
          </div>
        </div>
        <button id="btn-calc-synastry" class="btn btn-primary">♡ Calcular Sinastría</button>
      </div>

      <div id="synastry-results" style="display:none;">
        <div class="card">
          <div class="score-display">
            <div class="score-number" id="syn-score">—</div>
            <p style="color: var(--avia-text-dim);">Compatibilidad</p>
          </div>
        </div>

        <div class="two-col">
          <div class="card chart-wrapper">
            <avia-chart-wheel id="synastry-wheel" mode="synastry" size="600"></avia-chart-wheel>
          </div>
          <div class="card">
            <h3 class="card-title">Aspectos Cruzados</h3>
            <avia-aspect-list id="synastry-aspects"></avia-aspect-list>
          </div>
        </div>

        <div class="card">
          <h3 class="card-title">Análisis por Áreas</h3>
          <div id="synastry-insights"></div>
        </div>
      </div>
    </div>

    <!-- ══ TAB: SAVED ══ -->
    <div id="tab-saved" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Cartas Guardadas</h2>
          <button id="btn-refresh-saved" class="btn btn-secondary">🔄 Actualizar</button>
        </div>
        <div id="saved-list"></div>
      </div>
    </div>

  </main>

  <!-- ══════════════════════════════════════════════════════════
       WEB COMPONENTS (importados)
       ══════════════════════════════════════════════════════════ -->
  <script type="module">
    import './components/avia-chart-wheel.js';
    import './components/avia-planet-list.js';
    import './components/avia-aspect-list.js';
    import './components/avia-element-bar.js';

    // ══ STATE ══
    let currentNatalChart = null;
    let savedCharts = [];

    // ══ TAB NAVIGATION ══
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
      });
    });

    // ══ NATAL CHART CALCULATION ══
    document.getElementById('form-natal').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const date = document.getElementById('natal-date').value;
      const time = document.getElementById('natal-time').value;
      const [year, month, day] = date.split('-').map(Number);
      const [hour, minute] = time.split(':').map(Number);

      const data = {
        year, month, day,
        hourDecimal: hour + minute / 60,
        latitude: parseFloat(document.getElementById('natal-lat').value),
        longitude: parseFloat(document.getElementById('natal-lon').value),
        placeName: document.getElementById('natal-place').value,
        houseSystem: 'P'
      };

      try {
        const res = await fetch('/api/natal-chart', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const chart = await res.json();
        
        currentNatalChart = {
          ...data,
          birth_date: date,
          birth_time: time,
          chart_data: chart,
          label: document.getElementById('natal-label').value || 'Mi carta'
        };

        displayNatalChart(chart);
        document.getElementById('btn-save-natal').style.display = 'inline-flex';
      } catch (err) {
        alert('Error al calcular: ' + err.message);
      }
    });

    function displayNatalChart(chart) {
      document.getElementById('natal-results').style.display = 'block';
      
      const wheel = document.getElementById('natal-wheel');
      wheel.chart = chart;

      const planetList = document.getElementById('natal-planets');
      planetList.chart = chart;

      const aspectList = document.getElementById('natal-aspects');
      aspectList.aspects = wheel.aspects;

      const elements = document.getElementById('natal-elements');
      elements.planets = chart.planets;
    }

    // ══ SAVE NATAL ══
    document.getElementById('btn-save-natal').addEventListener('click', async () => {
      if (!currentNatalChart) return;
      
      const payload = {
        ...currentNatalChart,
        ascendant_lon: currentNatalChart.chart_data.houses.ascendant,
        mc_lon: currentNatalChart.chart_data.houses.mc,
        sun_lon: currentNatalChart.chart_data.planets.sol.longitude,
        moon_lon: currentNatalChart.chart_data.planets.luna.longitude,
        source: 'user_input'
      };

      try {
        const res = await fetch('/api/storage/charts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        alert('✅ Carta guardada con ID: ' + result.id);
        loadSavedCharts();
      } catch (err) {
        alert('Error al guardar: ' + err.message);
      }
    });

    // ══ LOAD SAVED CHARTS ══
    async function loadSavedCharts() {
      try {
        const res = await fetch('/api/storage/charts');
        const data = await res.json();
        savedCharts = data.charts;

        // Populate selects
        const selects = [
          document.getElementById('transit-chart-select'),
          document.getElementById('syn-chart1'),
          document.getElementById('syn-chart2')
        ];

        selects.forEach(select => {
          select.innerHTML = '<option value="">Seleccionar...</option>';
          savedCharts.forEach(chart => {
            const opt = document.createElement('option');
            opt.value = chart.id;
            opt.textContent = `${chart.label} (${chart.birth_date})`;
            select.appendChild(opt);
          });
        });

        // Display in saved tab
        const list = document.getElementById('saved-list');
        list.innerHTML = savedCharts.map(c => `
          <div class="insight-item">
            <div class="insight-icon">📊</div>
            <div class="insight-content">
              <h4>${c.label}</h4>
              <p>${c.birth_date} ${c.birth_time} — ${c.place_name || 'Sin ubicación'}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading charts:', err);
      }
    }

    document.getElementById('btn-refresh-saved').addEventListener('click', loadSavedCharts);
    loadSavedCharts(); // Initial load

    // ══ TRANSITS ══
    document.getElementById('btn-calc-transits').addEventListener('click', async () => {
      const chartId = document.getElementById('transit-chart-select').value;
      if (!chartId) return alert('Selecciona una carta natal');

      const date = document.getElementById('transit-date').value || undefined;

      try {
        const res = await fetch('/api/transits/to-natal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ natalChartId: parseInt(chartId), date })
        });
        const data = await res.json();

        document.getElementById('transit-results').style.display = 'block';
        
        const wheel = document.getElementById('transit-wheel');
        wheel.chart = data.natalPlanets;
        wheel.transits = { planets: data.transitPlanets };

        const aspectList = document.getElementById('transit-aspects');
        aspectList.aspects = data.crossAspects;
        aspectList.crossLabel = `Tránsitos → Natal (${new Date(data.transitDate).toLocaleDateString()})`;
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    // ══ SYNASTRY ══
    document.getElementById('btn-calc-synastry').addEventListener('click', async () => {
      const id1 = document.getElementById('syn-chart1').value;
      const id2 = document.getElementById('syn-chart2').value;
      if (!id1 || !id2) return alert('Selecciona ambas cartas');

      try {
        const res = await fetch('/api/synastry/compare', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chart1Id: parseInt(id1),
            chart2Id: parseInt(id2),
            save: true
          })
        });
        const data = await res.json();

        document.getElementById('synastry-results').style.display = 'block';
        document.getElementById('syn-score').textContent = data.score;

        const wheel = document.getElementById('synastry-wheel');
        wheel.chart = { planets: data.chart1.planets, houses: { ascendant: 0 } };
        wheel.synastry = { planets: data.chart2.planets };

        const aspectList = document.getElementById('synastry-aspects');
        aspectList.aspects = data.aspects;

        const insights = document.getElementById('synastry-insights');
        insights.innerHTML = data.insights.map(ins => `
          <div class="insight-item">
            <div class="insight-icon">${ins.icon}</div>
            <div class="insight-content">
              <h4>${ins.category}</h4>
              <p>${ins.text}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });
  </script>
</body>
</html>
