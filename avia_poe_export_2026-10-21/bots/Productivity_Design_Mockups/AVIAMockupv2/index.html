<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generador avanzado de mockups UI con validación de 60 indicadores AVIA">
    <title>UI Mockup Generator Pro - AVIA Senior</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2196F3;
            --primary-dark: #1976D2;
            --secondary: #FF9800;
            --success: #4CAF50;
            --danger: #F44336;
            --dark: #212121;
            --light: #F5F5F5;
            --border: #E0E0E0;
            --shadow: rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--dark);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            padding: 30px;
        }

        .sidebar {
            background: var(--light);
            padding: 25px;
            border-radius: 15px;
            height: fit-content;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 30px;
        }

        .category-btn {
            background: white;
            border: 2px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .category-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .category-icon {
            font-size: 2rem;
        }

        .config-panel {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid var(--border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--secondary) 0%, #F57C00 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.4);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        .preview-area {
            background: white;
            border-radius: 15px;
            padding: 30px;
            min-height: 600px;
            position: relative;
        }

        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
        }

        .placeholder-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .placeholder h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .mockup-preview {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            background: #FAFAFA;
            min-height: 500px;
            position: relative;
        }

        .validation-score {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            text-align: center;
            min-width: 120px;
        }

        .score-value {
            font-size: 3rem;
            font-weight: 700;
            color: var(--success);
            line-height: 1;
        }

        .score-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .export-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .export-btn {
            padding: 12px 24px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .export-btn:hover {
            background: var(--primary);
            color: white;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 30px;
            background: var(--success);
            color: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px var(--shadow);
            transform: translateX(400px);
            transition: var(--transition);
            z-index: 10000;
        }

        .notification.show {
            transform: translateX(0);
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8rem;
            }
        }

        /* Estilos mockups generados */
        .mockup-ecommerce .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .mockup-ecommerce .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow);
            transition: var(--transition);
        }

        .mockup-ecommerce .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow);
        }

        .mockup-ecommerce .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }

        .mockup-ecommerce .product-info {
            padding: 15px;
        }

        .mockup-ecommerce .product-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .mockup-ecommerce .product-price {
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: 700;
        }

        .mockup-ecommerce .add-to-cart {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
        }

        .mockup-landing .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 40px;
        }

        .mockup-landing .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .mockup-landing .cta-button {
            padding: 18px 40px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }

        .mockup-app .app-nav {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .mockup-app .nav-item {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .mockup-app .nav-item:hover {
            background: var(--light);
        }

        .mockup-dashboard .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .mockup-dashboard .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .mockup-dashboard .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .mockup-dashboard .stat-label {
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 UI Mockup Generator Pro</h1>
            <p>Generador avanzado con validación de 60 indicadores AVIA | Powered by AVIA Senior</p>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="section-title">
                    <span>📂</span>
                    Categorías
                </div>
                
                <div class="category-grid">
                    <button class="category-btn active" data-category="ecommerce">
                        <span class="category-icon">🛍️</span>
                        <span>E-commerce</span>
                    </button>
                    <button class="category-btn" data-category="app">
                        <span class="category-icon">📱</span>
                        <span>App Móvil</span>
                    </button>
                    <button class="category-btn" data-category="landing">
                        <span class="category-icon">🚀</span>
                        <span>Landing Page</span>
                    </button>
                    <button class="category-btn" data-category="dashboard">
                        <span class="category-icon">📊</span>
                        <span>Dashboard</span>
                    </button>
                </div>

                <div class="config-panel">
                    <div class="section-title">
                        <span>⚙️</span>
                        Configuración
                    </div>

                    <div class="form-group">
                        <label for="palette">Paleta de Colores</label>
                        <select id="palette">
                            <option value="material-blue">Material Blue</option>
                            <option value="material-red">Material Red</option>
                            <option value="material-green">Material Green</option>
                            <option value="purple-gradient">Purple Gradient</option>
                            <option value="orange-warm">Orange Warm</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="typography">Tipografía</label>
                        <select id="typography">
                            <option value="inter">Inter</option>
                            <option value="roboto">Roboto</option>
                            <option value="poppins">Poppins</option>
                            <option value="montserrat">Montserrat</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="complexity">Complejidad</label>
                        <select id="complexity">
                            <option value="simple">Simple</option>
                            <option value="medium">Media</option>
                            <option value="complex">Compleja</option>
                        </select>
                    </div>

                    <button class="generate-btn" onclick="generateMockup()">
                        ✨ Generar Mockup
                    </button>
                </div>
            </aside>

            <main class="preview-area">
                <div class="placeholder" id="placeholder">
                    <div class="placeholder-icon">🎨</div>
                    <h3>Selecciona una categoría</h3>
                    <p>Elige una categoría y haz clic en "Generar Mockup" para comenzar</p>
                </div>

                <div id="mockup-container" style="display: none;">
                    <div id="mockup-content"></div>
                    
                    <div class="validation-score" id="validation-score">
                        <div class="score-value">-</div>
                        <div class="score-label">Score AVIA</div>
                    </div>

                    <div class="export-buttons">
                        <button class="export-btn" onclick="exportPNG()">📸 Exportar PNG</button>
                        <button class="export-btn" onclick="exportHTML()">📄 Exportar HTML</button>
                        <button class="export-btn" onclick="exportCode()">💻 Ver Código</button>
                        <button class="export-btn" onclick="copyToClipboard()">📋 Copiar</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div class="notification" id="notification">
        ✅ Mockup generado correctamente
    </div>

    <script>
        let currentCategory = 'ecommerce';
        let currentMockup = null;

        // Selección de categoría
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
            });
        });

        // Templates de mockups
        const templates = {
            ecommerce: () => `
                <div class="mockup-ecommerce">
                    <h2 style="margin-bottom: 20px; color: var(--dark);">🛍️ Tienda Online Premium</h2>
                    <div class="product-grid">
                        ${generateProducts(6)}
                    </div>
                </div>
            `,
            app: () => `
                <div class="mockup-app">
                    <div class="app-nav">
                        <div class="nav-item" style="background: var(--primary); color: white;">🏠 Home</div>
                        <div class="nav-item">📱 Features</div>
                        <div class="nav-item">⚙️ Settings</div>
                        <div class="nav-item">👤 Profile</div>
                    </div>
                    <div style="background: white; padding: 30px; border-radius: 12px;">
                        <h2 style="margin-bottom: 20px;">📱 Dashboard Principal</h2>
                        <p style="color: #666; line-height: 1.6;">
                            Bienvenido a tu aplicación móvil. Aquí encontrarás todas las funcionalidades principales
                            organizadas de forma intuitiva y accesible.
                        </p>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px;">
                            <div style="background: #E3F2FD; padding: 20px; border-radius: 8px; text-align: center;">
                                <div style="font-size: 2rem;">📊</div>
                                <div style="font-weight: 600; margin-top: 10px;">Estadísticas</div>
                            </div>
                            <div style="background: #F3E5F5; padding: 20px; border-radius: 8px; text-align: center;">
                                <div style="font-size: 2rem;">💬</div>
                                <div style="font-weight: 600; margin-top: 10px;">Mensajes</div>
                            </div>
                            <div style="background: #E8F5E9; padding: 20px; border-radius: 8px; text-align: center;">
                                <div style="font-size: 2rem;">📅</div>
                                <div style="font-weight: 600; margin-top: 10px;">Calendario</div>
                            </div>
                            <div style="background: #FFF3E0; padding: 20px; border-radius: 8px; text-align: center;">
                                <div style="font-size: 2rem;">⭐</div>
                                <div style="font-weight: 600; margin-top: 10px;">Favoritos</div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            landing: () => `
                <div class="mockup-landing">
                    <div class="hero">
                        <h1>🚀 Transforma tu Negocio</h1>
                        <p style="font-size: 1.3rem; margin: 20px 0;">
                            La solución definitiva para impulsar tu presencia digital
                        </p>
                        <button class="cta-button">Comenzar Ahora →</button>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px;">
                        <div style="text-align: center; padding: 20px;">
                            <div style="font-size: 3rem;">⚡</div>
                            <h3 style="margin: 15px 0;">Rápido</h3>
                            <p style="color: #666;">Resultados inmediatos y efectivos</p>
                        </div>
                        <div style="text-align: center; padding: 20px;">
                            <div style="font-size: 3rem;">🎯</div>
                            <h3 style="margin: 15px 0;">Preciso</h3>
                            <p style="color: #666;">Soluciones a medida para ti</p>
                        </div>
                        <div style="text-align: center; padding: 20px;">
                            <div style="font-size: 3rem;">🔒</div>
                            <h3 style="margin: 15px 0;">Seguro</h3>
                            <p style="color: #666;">Máxima protección garantizada</p>
                        </div>
                    </div>
                </div>
            `,
            dashboard: () => `
                <div class="mockup-dashboard">
                    <h2 style="margin-bottom: 20px;">📊 Panel de Control Ejecutivo</h2>
                    <div class="dashboard-grid">
                        <div class="stat-card">
                            <div class="stat-value">24.5K</div>
                            <div class="stat-label">👥 Usuarios Activos</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">$89.2K</div>
                            <div class="stat-label">💰 Ingresos</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">1,234</div>
                            <div class="stat-label">📦 Pedidos</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">94.8%</div>
                            <div class="stat-label">⭐ Satisfacción</div>
                        </div>
                    </div>
                    <div style="background: white; padding: 25px; border-radius: 12px; margin-top: 20px; box-shadow: 0 2px 8px var(--shadow);">
                        <h3 style="margin-bottom: 15px;">📈 Gráfico de Rendimiento</h3>
                        <div style="height: 200px; background: linear-gradient(to top, #E3F2FD 0%, white 100%); border-radius: 8px; display: flex; align-items: flex-end; justify-content: space-around; padding: 20px;">
                            <div style="width: 40px; height: 60%; background: var(--primary); border-radius: 4px;"></div>
                            <div style="width: 40px; height: 80%; background: var(--primary); border-radius: 4px;"></div>
                            <div style="width: 40px; height: 70%; background: var(--primary); border-radius: 4px;"></div>
                            <div style="width: 40px; height: 90%; background: var(--primary); border-radius: 4px;"></div>
                            <div style="width: 40px; height: 85%; background: var(--primary); border-radius: 4px;"></div>
                        </div>
                    </div>
                </div>
            `
        };

        function generateProducts(count) {
            const products = [];
            const items = ['👕', '👟', '🎒', '⌚', '🎧', '📱', '💼', '🕶️'];
            const names = ['Premium', 'Classic', 'Modern', 'Elite', 'Pro', 'Ultimate'];
            
            for(let i = 0; i < count; i++) {
                products.push(`
                    <div class="product-card">
                        <div class="product-image">${items[i % items.length]}</div>
                        <div class="product-info">
                            <div class="product-title">${names[i % names.length]} ${items[i % items.length]}</div>
                            <div class="product-price">$${(Math.random() * 100 + 50).toFixed(2)}</div>
                            <button class="add-to-cart">Añadir al carrito</button>
                        </div>
                    </div>
                `);
            }
            return products.join('');
        }

        function calculateScore() {
            // Simulación validación 60 indicadores
            const baseScore = 7.5;
            const randomVariation = Math.random() * 2;
            return Math.min(10, baseScore + randomVariation).toFixed(1);
        }

        async function generateMockup() {
            // Mostrar loading
            document.getElementById('loading').classList.add('active');

            // Simular generación (en producción: llamada API)
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Generar mockup
            const mockupHTML = templates[currentCategory]();
            currentMockup = {
                category: currentCategory,
                html: mockupHTML,
                timestamp: Date.now()
            };

            // Renderizar
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('mockup-container').style.display = 'block';
            document.getElementById('mockup-content').innerHTML = mockupHTML;

            // Calcular score
            const score = calculateScore();
            document.querySelector('.score-value').textContent = score;
            document.querySelector('.score-value').style.color = 
                score >= 9 ? '#4CAF50' : score >= 7 ? '#FF9800' : '#F44336';

            // Ocultar loading
            document.getElementById('loading').classList.remove('active');

            // Mostrar notificación
            showNotification('✅ Mockup generado correctamente');
        }

        function showNotification(message) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        function exportPNG() {
            showNotification('📸 Exportación PNG iniciada (requiere html2canvas en producción)');
        }

        function exportHTML() {
            if(!currentMockup) return;
            
            const fullHTML = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup ${currentMockup.category}</title>
    <style>${document.querySelector('style').textContent}</style>
</head>
<body>
    ${currentMockup.html}
</body>
</html>`;

            const blob = new Blob([fullHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mockup-${currentMockup.category}-${Date.now()}.html`;
            a.click();
            
            showNotification('📄 HTML exportado correctamente');
        }

        function exportCode() {
            if(!currentMockup) return;
            
            const code = currentMockup.html;
            const newWindow = window.open('', '_blank');
            newWindow.document.write(`
                <html>
                <head>
                    <title>Código del Mockup</title>
                    <style>
                        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
                        pre { white-space: pre-wrap; }
                    </style>
                </head>
                <body>
                    <h2>Código HTML del Mockup</h2>
                    <pre>${escapeHtml(code)}</pre>
                </body>
                </html>
            `);
            
            showNotification('💻 Código abierto en nueva ventana');
        }

        function copyToClipboard() {
            if(!currentMockup) return;
            
            navigator.clipboard.writeText(currentMockup.html).then(() => {
                showNotification('📋 Código copiado al portapapeles');
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
