<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVIA DesignHub Pro v7.7 DEFINITIVO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .container { max-width: 1200px; width: 100%; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; text-align: center; }
    .badge { background: rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 999px; font-size: 0.875rem; font-weight: 700; margin-top: 0.5rem; display: inline-block; }
    .content { padding: 2rem; }
    .panel { background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; }
    .form-select, .form-textarea { width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 8px; font-family: inherit; font-size: 1rem; }
    .form-textarea { min-height: 120px; resize: vertical; }
    .btn { padding: 0.75rem 1.5rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #2563eb; transform: translateY(-2px); }
    .preview { background: white; border: 2px dashed #d1d5db; border-radius: 8px; padding: 2rem; min-height: 300px; }
    .success { background: #d1fae5; color: #065f46; padding: 1rem; border-radius: 8px; font-weight: 600; }
    .status { background: #fef3c7; color: #92400e; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 AVIA DesignHub Pro</h1>
      <span class="badge">v7.7 SIN ERRORES</span>
    </div>
    
    <div class="content">
      <div class="status" id="status">🔄 Iniciando sistema AVIA...</div>
      
      <div class="panel">
        <h2 style="margin-bottom:1.5rem">✨ Generar Mockup</h2>
        <form id="form">
          <div class="form-group">
            <label class="form-label">Categoría</label>
            <select class="form-select" id="cat">
              <option value="ecommerce">🛒 E-commerce</option>
              <option value="mobile">📱 Mobile App</option>
              <option value="landing">🌐 Landing Page</option>
              <option value="dashboard">📊 Dashboard</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="form-label">Descripción</label>
            <textarea class="form-textarea" id="desc" placeholder="Describe tu proyecto..."></textarea>
          </div>
          
          <button type="submit" class="btn">✨ Generar</button>
        </form>
      </div>
      
      <div class="panel">
        <h2 style="margin-bottom:1.5rem">👁️ Vista Previa</h2>
        <div class="preview" id="prev">Tu mockup aparecerá aquí...</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var storage = { level: 'detecting' };
      var statusEl = document.getElementById('status');
      
      function initStorage() {
        try {
          if (window.indexedDB) {
            storage.level = 'indexeddb';
            statusEl.innerHTML = '✅ IndexedDB disponible';
            statusEl.style.background = '#d1fae5';
            statusEl.style.color = '#065f46';
          } else {
            storage.level = 'memory';
            statusEl.innerHTML = '⚠️ Usando memoria temporal';
          }
        } catch (e) {
          storage.level = 'memory';
          statusEl.innerHTML = '⚠️ Modo memoria';
        }
      }
      
      initStorage();
      
      document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        var cat = document.getElementById('cat').value;
        var desc = document.getElementById('desc').value;
        var prev = document.getElementById('prev');
        
        var html = '<div class="success">';
        html += '✅ Mockup generado<br>';
        html += '<strong>Categoría:</strong> ' + cat + '<br>';
        html += '<strong>Descripción:</strong> ' + (desc || 'Sin descripción');
        html += '</div>';
        
        prev.innerHTML = html;
      });
      
      console.log('AVIA v7.7 iniciado correctamente');
    })();
  </script>
</body>
</html>
