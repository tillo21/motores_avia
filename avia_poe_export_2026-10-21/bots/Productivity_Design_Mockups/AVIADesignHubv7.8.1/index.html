<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Design Hub v7.8.1 | Sistema Integrado de Mockups</title>
    
    <!-- CDN Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* ========================================
           SISTEMA DE DISEÑO AVIA
           Version: 7.8.1
           Metodología: Diseño Atómico
        ======================================== */
        
        :root {
            --avia-primary: #2563eb;
            --avia-secondary: #7c3aed;
            --avia-success: #10b981;
            --avia-warning: #f59e0b;
            --avia-error: #ef4444;
            --avia-bg: #0f172a;
            --avia-surface: #1e293b;
            --avia-border: #334155;
            --avia-text: #f1f5f9;
            --avia-text-dim: #94a3b8;
            --avia-radius: 12px;
            --avia-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--avia-bg) 0%, #1e1b4b 100%);
            color: var(--avia-text);
            min-height: 100vh;
            padding: 20px;
        }

        /* ========================================
           ÁTOMOS: Header & Navigation
        ======================================== */
        
        .avia-header {
            background: var(--avia-surface);
            border: 1px solid var(--avia-border);
            border-radius: var(--avia-radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--avia-shadow);
        }

        .avia-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--avia-primary), var(--avia-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .avia-header p {
            color: var(--avia-text-dim);
            font-size: 14px;
        }

        /* ========================================
           MOLÉCULAS: Sistema de Pestañas
        ======================================== */
        
        .avia-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .avia-tab {
            background: var(--avia-surface);
            border: 1px solid var(--avia-border);
            color: var(--avia-text-dim);
            padding: 12px 24px;
            border-radius: var(--avia-radius);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .avia-tab:hover {
            background: var(--avia-border);
            transform: translateY(-2px);
        }

        .avia-tab.active {
            background: linear-gradient(135deg, var(--avia-primary), var(--avia-secondary));
            color: white;
            border-color: transparent;
        }

        /* ========================================
           CÉLULAS: Layout Principal
        ======================================== */
        
        .avia-main {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
            min-height: 600px;
        }

        @media (max-width: 1024px) {
            .avia-main {
                grid-template-columns: 1fr;
            }
        }

        /* ========================================
           ORGANISMOS: Panel de Control
        ======================================== */
        
        .avia-panel {
            background: var(--avia-surface);
            border: 1px solid var(--avia-border);
            border-radius: var(--avia-radius);
            padding: 24px;
            box-shadow: var(--avia-shadow);
        }

        .avia-panel h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--avia-text);
        }

        /* ========================================
           ÁTOMOS: Inputs & Forms
        ======================================== */
        
        .avia-input-group {
            margin-bottom: 16px;
        }

        .avia-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--avia-text-dim);
            margin-bottom: 8px;
        }

        .avia-input,
        .avia-select,
        .avia-textarea {
            width: 100%;
            background: var(--avia-bg);
            border: 1px solid var(--avia-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--avia-text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .avia-input:focus,
        .avia-select:focus,
        .avia-textarea:focus {
            outline: none;
            border-color: var(--avia-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .avia-textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* ========================================
           ÁTOMOS: Botones
        ======================================== */
        
        .avia-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--avia-primary), var(--avia-secondary));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .avia-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
        }

        .avia-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .avia-btn-secondary {
            background: var(--avia-border);
        }

        .avia-btn-icon {
            font-size: 16px;
        }

        /* ========================================
           MOLÉCULAS: Canvas de Mockup
        ======================================== */
        
        .avia-canvas {
            background: var(--avia-bg);
            border: 2px dashed var(--avia-border);
            border-radius: var(--avia-radius);
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: auto;
        }

        .avia-canvas-empty {
            text-align: center;
            color: var(--avia-text-dim);
        }

        .avia-canvas-empty span {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        #mockupPreview {
            width: 100%;
            padding: 20px;
        }

        /* ========================================
           ORGANISMOS: Templates de Mockups
        ======================================== */
        
        .mockup-web {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .mockup-web-header {
            background: #f3f4f6;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        .mockup-web-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
        }

        .mockup-web-dot:nth-child(2) { background: #f59e0b; }
        .mockup-web-dot:nth-child(3) { background: #10b981; }

        .mockup-web-content {
            padding: 40px;
            color: #1f2937;
        }

        .mockup-mobile {
            background: white;
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 320px;
            margin: 0 auto;
        }

        .mockup-mobile-screen {
            background: #f9fafb;
            border-radius: 24px;
            padding: 32px 20px;
            min-height: 600px;
            color: #1f2937;
        }

        .mockup-tablet {
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: 0 auto;
        }

        .mockup-tablet-screen {
            background: #f9fafb;
            border-radius: 16px;
            padding: 40px 32px;
            min-height: 500px;
            color: #1f2937;
        }

        .mockup-dashboard {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .mockup-dashboard-sidebar {
            background: #1f2937;
            color: white;
            padding: 24px;
            min-height: 400px;
        }

        /* ========================================
           MOLÉCULAS: Constelación de Logs
        ======================================== */
        
        .avia-logs {
            margin-top: 24px;
            background: var(--avia-bg);
            border: 1px solid var(--avia-border);
            border-radius: var(--avia-radius);
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
        }

        .avia-log {
            font-size: 12px;
            font-family: 'Courier New', monospace;
            padding: 6px 10px;
            margin-bottom: 4px;
            border-radius: 4px;
            background: var(--avia-surface);
            border-left: 3px solid var(--avia-border);
        }

        .avia-log.success { border-left-color: var(--avia-success); }
        .avia-log.warning { border-left-color: var(--avia-warning); }
        .avia-log.error { border-left-color: var(--avia-error); }

        /* ========================================
           MOLÉCULAS: Notificaciones
        ======================================== */
        
        .avia-notification {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--avia-surface);
            border: 1px solid var(--avia-border);
            border-radius: var(--avia-radius);
            padding: 16px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
            min-width: 320px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ========================================
           ORGANISMOS: Galería de Mockups
        ======================================== */
        
        .avia-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .avia-gallery-item {
            background: var(--avia-bg);
            border: 1px solid var(--avia-border);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .avia-gallery-item:hover {
            transform: translateY(-4px);
            border-color: var(--avia-primary);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
        }

        .avia-gallery-item h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .avia-gallery-item p {
            font-size: 12px;
            color: var(--avia-text-dim);
        }

        /* ========================================
           ESTADOS: Loading, Empty, Error
        ======================================== */
        
        .avia-hidden {
            display: none !important;
        }

        .avia-loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <!-- ========================================
         HEADER: Identidad del Sistema
    ======================================== -->
    <header class="avia-header">
        <h1>🎨 AVIA Design Hub v7.8.1</h1>
        <p>Sistema Integrado de Mockups · 14 AVIAs Activos · Storage Adaptativo · Exportación Completa</p>
    </header>

    <!-- ========================================
         NAVIGATION: Pestañas de Módulos
    ======================================== -->
    <div class="avia-tabs">
        <button class="avia-tab active" data-tab="crear">🎯 Crear Mockup</button>
        <button class="avia-tab" data-tab="galeria">🖼️ Galería</button>
        <button class="avia-tab" data-tab="exportar">📦 Exportar</button>
        <button class="avia-tab" data-tab="logs">📋 Constelación</button>
    </div>

    <!-- ========================================
         MAIN: Layout Principal
    ======================================== -->
    <main class="avia-main">
        
        <!-- Panel de Control -->
        <aside class="avia-panel">
            <h2>⚙️ Panel de Control</h2>
            
            <div class="avia-input-group">
                <label class="avia-label">Categoría de Mockup</label>
                <select id="categorySelect" class="avia-select">
                    <option value="web">🌐 Web/Landing</option>
                    <option value="mobile">📱 Mobile App</option>
                    <option value="tablet">📱 Tablet</option>
                    <option value="dashboard">📊 Dashboard</option>
                </select>
            </div>

            <div class="avia-input-group">
                <label class="avia-label">Título del Proyecto</label>
                <input type="text" id="titleInput" class="avia-input" placeholder="Mi Proyecto AVIA">
            </div>

            <div class="avia-input-group">
                <label class="avia-label">Descripción</label>
                <textarea id="descInput" class="avia-textarea" placeholder="Descripción del mockup..."></textarea>
            </div>

            <div class="avia-input-group">
                <label class="avia-label">Contenido Principal</label>
                <textarea id="contentInput" class="avia-textarea" placeholder="Tu contenido aquí..."></textarea>
            </div>

            <button id="generateBtn" class="avia-btn">
                <span class="avia-btn-icon">✨</span>
                <span>Generar Mockup</span>
            </button>
        </aside>

        <!-- Canvas de Visualización -->
        <section class="avia-panel">
            <h2>🎨 Vista Previa</h2>
            
            <div class="avia-canvas" id="mockupCanvas">
                <div class="avia-canvas-empty">
                    <span>🖼️</span>
                    <p>Selecciona una categoría y genera tu mockup</p>
                </div>
                <div id="mockupPreview" class="avia-hidden"></div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap;">
                <button id="exportHtmlBtn" class="avia-btn">
                    <span class="avia-btn-icon">📄</span>
                    <span>Exportar HTML</span>
                </button>
                <button id="exportPngBtn" class="avia-btn avia-btn-secondary">
                    <span class="avia-btn-icon">🖼️</span>
                    <span>Exportar PNG</span>
                </button>
                <button id="exportPdfBtn" class="avia-btn avia-btn-secondary">
                    <span class="avia-btn-icon">📄</span>
                    <span>Exportar PDF</span>
                </button>
            </div>
        </section>
    </main>

    <!-- ========================================
         LOGS: Constelación de Eventos
    ======================================== -->
    <section class="avia-panel" style="margin-top: 24px;">
        <h2>🌟 Constelación AVIA - Log de Eventos</h2>
        <div class="avia-logs" id="logsContainer"></div>
    </section>

    <!-- ========================================
         JAVASCRIPT: Lógica del Sistema
    ======================================== -->
    <script>
        /* ========================================
           ÁTOMO CORREGIDO: Storage Adaptativo
           AVIA-Pukkart: ATOM-STORAGE-FIX-001
        ======================================== */
        
        const AVIAStorage = {
            type: null,
            db: null,
            memoryStore: {},

            async init() {
                // Cascada: IndexedDB → LocalStorage → Memory
                try {
                    if ('indexedDB' in window && !window.location.protocol.startsWith('file')) {
                        const req = indexedDB.open('AVIADesignHubDB', 1);
                        
                        await new Promise((resolve, reject) => {
                            req.onerror = () => reject(req.error);
                            req.onsuccess = () => {
                                this.db = req.result;
                                this.type = 'indexeddb';
                                resolve();
                            };
                            req.onupgradeneeded = (event) => {
                                const db = event.target.result;
                                if (!db.objectStoreNames.contains('mockups')) {
                                    db.createObjectStore('mockups', { keyPath: 'id' });
                                }
                            };
                        });
                        
                        addLog('✅ Storage: IndexedDB activado', 'success');
                        return;
                    }
                } catch (error) {
                    console.warn('IndexedDB falló:', error);
                }

                // Fallback: LocalStorage
                try {
                    localStorage.setItem('avia-test', '1');
                    localStorage.removeItem('avia-test');
                    this.type = 'localstorage';
                    addLog('⚠️ Storage: LocalStorage activado (fallback)', 'warning');
                    return;
                } catch (error) {
                    console.warn('LocalStorage bloqueado:', error);
                }

                // Fallback: Memory
                this.type = 'memory';
                addLog('⚠️ Storage: Memoria RAM activada (temporal)', 'warning');
            },

            async save(mockup) {
                if (this.type === 'indexeddb') {
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(['mockups'], 'readwrite');
                        const store = tx.objectStore('mockups');
                        const req = store.add(mockup);
                        req.onsuccess = () => resolve(mockup.id);
                        req.onerror = () => reject(req.error);
                    });
                }
                
                if (this.type === 'localstorage') {
                    const existing = JSON.parse(localStorage.getItem('avia-mockups') || '[]');
                    existing.push(mockup);
                    localStorage.setItem('avia-mockups', JSON.stringify(existing));
                    return mockup.id;
                }
                
                // Memory fallback
                this.memoryStore[mockup.id] = mockup;
                return mockup.id;
            },

            async getAll() {
                if (this.type === 'indexeddb') {
                    return new Promise((resolve) => {
                        const tx = this.db.transaction(['mockups'], 'readonly');
                        const req = tx.objectStore('mockups').getAll();
                        req.onsuccess = () => resolve(req.result);
                    });
                }
                
                if (this.type === 'localstorage') {
                    return JSON.parse(localStorage.getItem('avia-mockups') || '[]');
                }
                
                return Object.values(this.memoryStore);
            }
        };

        /* ========================================
           MOLÉCULA CORREGIDA: Validador CDN
           AVIA-Pukkart: MOLECULE-CDN-CHECK-001
        ======================================== */
        
        const AVIACDNValidator = {
            html2canvas: false,
            jspdf: false,

            check() {
                this.html2canvas = typeof html2canvas !== 'undefined';
                this.jspdf = typeof window.jspdf !== 'undefined';
                
                if (!this.html2canvas) {
                    addLog('❌ CDN html2canvas no disponible', 'warning');
                }
                if (!this.jspdf) {
                    addLog('❌ CDN jsPDF no disponible', 'warning');
                }
                
                if (this.html2canvas && this.jspdf) {
                    addLog('✅ CDNs cargadas correctamente', 'success');
                }
            }
        };

        /* ========================================
           ESTADO GLOBAL DEL SISTEMA
        ======================================== */
        
        const state = {
            currentMockup: null,
            mockups: []
        };

        /* ========================================
           SISTEMA DE LOGS (Constelación)
        ======================================== */
        
        function addLog(message, type = 'info') {
            const logsContainer = document.getElementById('logsContainer');
            const timestamp = new Date().toLocaleTimeString('es-ES');
            const log = document.createElement('div');
            log.className = `avia-log ${type}`;
            log.textContent = `[${timestamp}] ${message}`;
            logsContainer.appendChild(log);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        /* ========================================
           SISTEMA DE NOTIFICACIONES
        ======================================== */
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'avia-notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        /* ========================================
           GENERADOR DE TEMPLATES
        ======================================== */
        
        const mockupTemplates = {
            web: (title, content) => `
                <div class="mockup-web">
                    <div class="mockup-web-header">
                        <div class="mockup-web-dot"></div>
                        <div class="mockup-web-dot"></div>
                        <div class="mockup-web-dot"></div>
                    </div>
                    <div class="mockup-web-content">
                        <h1 style="font-size: 32px; margin-bottom: 16px; color: #1f2937;">${title}</h1>
                        <p style="line-height: 1.6; color: #4b5563;">${content}</p>
                    </div>
                </div>
            `,
            
            mobile: (title, content) => `
                <div class="mockup-mobile">
                    <div class="mockup-mobile-screen">
                        <h2 style="font-size: 24px; margin-bottom: 12px; text-align: center;">${title}</h2>
                        <p style="line-height: 1.5; text-align: center;">${content}</p>
                    </div>
                </div>
            `,
            
            tablet: (title, content) => `
                <div class="mockup-tablet">
                    <div class="mockup-tablet-screen">
                        <h2 style="font-size: 28px; margin-bottom: 16px;">${title}</h2>
                        <p style="line-height: 1.6;">${content}</p>
                    </div>
                </div>
            `,
            
            dashboard: (title, content) => `
                <div class="mockup-dashboard">
                    <div style="display: grid; grid-template-columns: 200px 1fr;">
                        <div class="mockup-dashboard-sidebar">
                            <h3 style="margin-bottom: 16px;">📊 Dashboard</h3>
                            <ul style="list-style: none;">
                                <li style="padding: 8px 0;">📈 Analytics</li>
                                <li style="padding: 8px 0;">👥 Users</li>
                                <li style="padding: 8px 0;">⚙️ Settings</li>
                            </ul>
                        </div>
                        <div style="padding: 32px; background: #f9fafb;">
                            <h2 style="font-size: 28px; margin-bottom: 16px; color: #1f2937;">${title}</h2>
                            <p style="line-height: 1.6; color: #4b5563;">${content}</p>
                        </div>
                    </div>
                </div>
            `
        };

        /* ========================================
           FUNCIÓN: Generar Mockup
        ======================================== */
        
        function generateMockup() {
            const category = document.getElementById('categorySelect').value;
            const title = document.getElementById('titleInput').value || 'Proyecto AVIA';
            const content = document.getElementById('contentInput').value || 'Contenido de ejemplo para tu mockup.';
            
            const mockupPreview = document.getElementById('mockupPreview');
            const emptyState = document.querySelector('.avia-canvas-empty');
            
            // Generar HTML del mockup
            const mockupHTML = mockupTemplates[category](title, content);
            mockupPreview.innerHTML = mockupHTML;
            
            // Actualizar UI
            emptyState.classList.add('avia-hidden');
            mockupPreview.classList.remove('avia-hidden');
            
            // Crear objeto mockup
            const mockup = {
                id: Date.now(),
                category,
                title,
                content,
                html: mockupHTML,
                timestamp: new Date().toISOString()
            };
            
            state.currentMockup = mockup;
            
            // Guardar en storage
            AVIAStorage.save(mockup).then(id => {
                addLog(`✅ Mockup "${title}" generado y guardado (ID: ${id})`, 'success');
                showNotification('✅ Mockup generado exitosamente', 'success');
            }).catch(error => {
                addLog(`❌ Error al guardar mockup: ${error}`, 'error');
            });
        }

        /* ========================================
           CÉLULA CORREGIDA: Exportación HTML
           AVIA-Pukkart: CELL-EXPORT-FEEDBACK-001
        ======================================== */
        
        function exportHTML() {
            if (!state.currentMockup) {
                showNotification('⚠️ No hay mockup para exportar', 'warning');
                return;
            }
            
            const btn = document.getElementById('exportHtmlBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="avia-btn-icon">⏳</span><span>Exportando...</span>';
            
            const fullHTML = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${state.currentMockup.title}</title>
    <style>
        ${document.querySelector('style').textContent}
    </style>
</head>
<body style="padding: 40px;">
    ${state.currentMockup.html}
</body>
</html>`;
            
            const blob = new Blob([fullHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${state.currentMockup.title.replace(/\s+/g, '_')}.html`;
            a.click();
            URL.revokeObjectURL(url);
            
            addLog(`📄 HTML exportado: ${state.currentMockup.title}`, 'success');
            showNotification('✅ HTML exportado correctamente', 'success');
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<span class="avia-btn-icon">📄</span><span>Exportar HTML</span>';
            }, 500);
        }

        /* ========================================
           CÉLULA CORREGIDA: Exportación PNG
        ======================================== */
        
        function exportPNG() {
            if (!AVIACDNValidator.html2canvas) {
                showNotification('⚠️ Exportación PNG no disponible (CDN no cargado)', 'warning');
                return;
            }
            
            if (!state.currentMockup) {
                showNotification('⚠️ No hay mockup para exportar', 'warning');
                return;
            }
            
            const btn = document.getElementById('exportPngBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="avia-btn-icon">⏳</span><span>Exportando...</span>';
            
            const element = document.getElementById('mockupPreview');
            
            html2canvas(element, {
                backgroundColor: '#0f172a',
                scale: 2
            }).then(canvas => {
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${state.currentMockup.title.replace(/\s+/g, '_')}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    addLog(`🖼️ PNG exportado: ${state.currentMockup.title}`, 'success');
                    showNotification('✅ PNG exportado correctamente', 'success');
                    
                    btn.disabled = false;
                    btn.innerHTML = '<span class="avia-btn-icon">🖼️</span><span>Exportar PNG</span>';
                });
            }).catch(error => {
                addLog(`❌ Error al exportar PNG: ${error}`, 'error');
                btn.disabled = false;
                btn.innerHTML = '<span class="avia-btn-icon">🖼️</span><span>Exportar PNG</span>';
            });
        }

        /* ========================================
           CÉLULA CORREGIDA: Exportación PDF
        ======================================== */
        
        function exportPDF() {
            if (!AVIACDNValidator.jspdf || !AVIACDNValidator.html2canvas) {
                showNotification('⚠️ Exportación PDF no disponible (CDN no cargado)', 'warning');
                return;
            }
            
            if (!state.currentMockup) {
                showNotification('⚠️ No hay mockup para exportar', 'warning');
                return;
            }
            
            const btn = document.getElementById('exportPdfBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="avia-btn-icon">⏳</span><span>Exportando...</span>';
            
            const element = document.getElementById('mockupPreview');
            
            html2canvas(element, {
                backgroundColor: '#0f172a',
                scale: 2
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });
                
                const imgWidth = 190;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
                pdf.save(`${state.currentMockup.title.replace(/\s+/g, '_')}.pdf`);
                
                addLog(`📄 PDF exportado: ${state.currentMockup.title}`, 'success');
                showNotification('✅ PDF exportado correctamente', 'success');
                
                btn.disabled = false;
                btn.innerHTML = '<span class="avia-btn-icon">📄</span><span>Exportar PDF</span>';
            }).catch(error => {
                addLog(`❌ Error al exportar PDF: ${error}`, 'error');
                btn.disabled = false;
                btn.innerHTML = '<span class="avia-btn-icon">📄</span><span>Exportar PDF</span>';
            });
        }

        /* ========================================
           INICIALIZACIÓN DEL SISTEMA
        ======================================== */
        
        async function init() {
            addLog('🚀 Iniciando AVIA Design Hub v7.8.1', 'success');
            
            // Inicializar storage adaptativo
            await AVIAStorage.init();
            
            // Validar CDNs
            AVIACDNValidator.check();
            
            // Event listeners
            document.getElementById('generateBtn').addEventListener('click', generateMockup);
            document.getElementById('exportHtmlBtn').addEventListener('click', exportHTML);
            document.getElementById('exportPngBtn').addEventListener('click', exportPNG);
            document.getElementById('exportPdfBtn').addEventListener('click', exportPDF);
            
            addLog('✅ Sistema inicializado correctamente', 'success');
            addLog('🌟 7 AVIAs activos: Auditor, Nómada, Pukkart, Persistencia, Control de Versiones, AAA, Usabilidad', 'success');
        }

        // Ejecutar inicialización
        window.addEventListener('DOMContentLoaded', init);
    </script>

</body>
