<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Design Hub v8.0 DEMO</title>
    
    <!-- CDN Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        /* ========================================
           VARIABLES CSS - ÁTOMOS BASE
        ======================================== */
        :root {
            --avia-primary: #2563eb;
            --avia-secondary: #7c3aed;
            --avia-success: #10b981;
            --avia-warning: #f59e0b;
            --avia-error: #ef4444;
            --avia-bg: #0f172a;
            --avia-surface: #1e293b;
            --avia-border: #334155;
            --avia-text: #f1f5f9;
            --avia-text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--avia-bg) 0%, #1e293b 100%);
            color: var(--avia-text);
            min-height: 100vh;
            padding: 20px;
        }

        /* ========================================
           MOLÉCULA: Panel Container
        ======================================== */
        .avia-panel {
            background: var(--avia-surface);
            border: 1px solid var(--avia-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .avia-panel h1, .avia-panel h2 {
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--avia-primary), var(--avia-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ========================================
           ÁTOMOS: Inputs y Selects
        ======================================== */
        .avia-input, .avia-select {
            width: 100%;
            padding: 12px 16px;
            background: var(--avia-bg);
            border: 2px solid var(--avia-border);
            border-radius: 8px;
            color: var(--avia-text);
            font-size: 14px;
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        .avia-input:focus, .avia-select:focus {
            outline: none;
            border-color: var(--avia-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* NUEVO: Estados de validación */
        .avia-input--valid {
            border-color: var(--avia-success);
        }

        .avia-input--invalid {
            border-color: var(--avia-error);
        }

        .input-error {
            color: var(--avia-error);
            font-size: 0.85rem;
            margin-top: -12px;
            margin-bottom: 12px;
            display: none;
        }

        .input-error.active {
            display: block;
        }

        /* ========================================
           ÁTOMO: Botón base
        ======================================== */
        .avia-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .avia-btn--primary {
            background: linear-gradient(135deg, var(--avia-primary), var(--avia-secondary));
            color: white;
        }

        .avia-btn--primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .avia-btn--primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .avia-btn--secondary {
            background: var(--avia-surface);
            color: var(--avia-text);
            border: 1px solid var(--avia-border);
        }

        .avia-btn--secondary:hover {
            background: var(--avia-bg);
            border-color: var(--avia-primary);
        }

        /* ========================================
           MOLÉCULA: Preview Canvas
        ======================================== */
        #mockupPreview {
            margin-top: 20px;
            padding: 20px;
            background: var(--avia-bg);
            border: 2px dashed var(--avia-border);
            border-radius: 12px;
            min-height: 300px;
        }

        /* ========================================
           ORGANISMO: Galería de Mockups
        ======================================== */
        .gallery-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        #categoryFilter {
            background: var(--avia-bg);
            border: 2px solid var(--avia-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--avia-text);
            font-size: 14px;
            transition: all 0.3s ease;
            min-width: 180px;
        }

        #searchBar {
            flex: 1;
            min-width: 250px;
            background: var(--avia-bg);
            border: 2px solid var(--avia-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--avia-text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #categoryFilter:focus-visible,
        #searchBar:focus-visible {
            outline: 3px solid var(--avia-primary);
            outline-offset: 2px;
            border-color: var(--avia-primary);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* MOLÉCULA: Card de Mockup */
        .mockup-card {
            background: var(--avia-bg);
            border: 1px solid var(--avia-border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .mockup-card:hover {
            transform: translateY(-4px);
            border-color: var(--avia-primary);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
        }

        /* ÁTOMO: Thumbnail */
        .mockup-thumbnail {
            width: 100%;
            height: 160px;
            background: var(--avia-surface);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .mockup-thumbnail canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .mockup-thumbnail-loading {
            color: var(--avia-text-dim);
            font-size: 12px;
            text-align: center;
        }

        .mockup-card h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--avia-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mockup-category {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, var(--avia-primary), var(--avia-secondary));
            color: white;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* MOLÉCULA: Botones de acción */
        .mockup-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .mockup-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            background: var(--avia-surface);
            border: 1px solid var(--avia-border);
            border-radius: 6px;
            color: var(--avia-text);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .mockup-actions button:hover {
            background: var(--avia-primary);
            color: white;
            border-color: var(--avia-primary);
            transform: scale(1.05);
        }

        .mockup-actions button:focus-visible {
            outline: 3px solid var(--avia-primary);
            outline-offset: 2px;
        }

        .mockup-actions .btn-delete:hover {
            background: var(--avia-error);
            border-color: var(--avia-error);
        }

        .gallery-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--avia-text-dim);
            grid-column: 1 / -1;
        }

        .gallery-empty-icon {
            font-size: 64px;
            opacity: 0.5;
            margin-bottom: 16px;
        }

        /* ========================================
           SISTEMA: Focus visible global
        ======================================== */
        *:focus-visible {
            outline: 3px solid var(--avia-primary);
            outline-offset: 2px;
        }

        /* ========================================
           MOLÉCULA: Logs
        ======================================== */
        #logContainer {
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 12px;
            background: var(--avia-bg);
            border-radius: 8px;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid var(--avia-border);
        }

        .log-success { color: var(--avia-success); }
        .log-error { color: var(--avia-error); }
        .log-warning { color: var(--avia-warning); }
        .log-info { color: var(--avia-text-dim); }

        /* ========================================
           ÁTOMO: Notificación
        ======================================== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: var(--avia-surface);
            border-left: 4px solid var(--avia-primary);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <main class="avia-panel">
        <h1>🎨 AVIA Design Hub v8.0-DEMO</h1>
        
        <label for="categorySelect">Categoría de mockup:</label>
        <select id="categorySelect" class="avia-select" aria-label="Seleccionar categoría de mockup">
            <option value="web">🌐 Web/Landing Page</option>
            <option value="mobile">📱 Mobile App</option>
            <option value="tablet">📱 Tablet</option>
            <option value="dashboard">📊 Dashboard</option>
        </select>

        <label for="titleInput">Título del mockup:</label>
        <input 
            type="text" 
            id="titleInput" 
            class="avia-input" 
            placeholder="Ej: Landing Page Corporativa"
            aria-label="Título del mockup"
            aria-required="true"
            aria-describedby="titleError"
        >
        <div id="titleError" class="input-error" role="alert">El título debe tener al menos 3 caracteres</div>

        <label for="contentInput">Contenido personalizado (opcional):</label>

            type="text"

        <button id="generateBtn" class="avia-btn avia-btn--primary" aria-label="Generar mockup">
            ✨ Generar Mockup
        </button>

        <div id="mockupPreview" role="region" aria-label="Vista previa del mockup"></div>

        <div style="display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;">
            <button id="exportHtmlBtn" class="avia-btn avia-btn--secondary" aria-label="Exportar como HTML">
                💾 Exportar HTML
            </button>
            <button id="exportPngBtn" class="avia-btn avia-btn--secondary" aria-label="Exportar como PNG">
                🖼️ Exportar PNG
            </button>
            <button id="exportPdfBtn" class="avia-btn avia-btn--secondary" aria-label="Exportar como PDF">

    </main>

    <!-- NUEVO: Sección de Galería -->
    <section class="avia-panel" id="gallery-section">
        <h2>🖼️ Galería de Mockups</h2>
        <div id="gallery-container"></div>
    </section>

    <!-- Logs del sistema -->
    <section class="avia-panel">
        <h2>📋 Logs del Sistema</h2>
        <div id="logContainer" role="log" aria-live="polite" aria-atomic="false"></div>
    </section>

    <script>
        /* ========================================
           SISTEMA: Storage Adaptativo
        ======================================== */
        const AVIAStorage = {
            db: null,
            type: 'memory',
            memoryStore: {},

            async init() {
                try {
                    const request = indexedDB.open('AVIADesignHub', 1);
                    
                    request.onerror = () => {
                        addLog('⚠️ IndexedDB no disponible, usando LocalStorage', 'warning');
                        this.type = 'localstorage';
                    };

                    request.onsuccess = (event) => {
                        this.db = event.target.result;
                        this.type = 'indexeddb';
                        addLog('✅ Storage: IndexedDB activo', 'success');
                    };

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('mockups')) {
                            db.createObjectStore('mockups', { keyPath: 'id' });
                        }
                    };

                    await new Promise(resolve => setTimeout(resolve, 100));
                } catch (error) {
                    addLog('⚠️ Error inicializando storage: ' + error.message, 'warning');
                    this.type = 'memory';
                }
            },

            async save(mockup) {
                if (this.type === 'indexeddb' && this.db) {
                    const tx = this.db.transaction(['mockups'], 'readwrite');
                    await tx.objectStore('mockups').put(mockup);
                    return mockup.id;
                } else if (this.type === 'localstorage') {
                    const mockups = JSON.parse(localStorage.getItem('avia-mockups') || '[]');
                    const index = mockups.findIndex(m => m.id === mockup.id);
                    if (index >= 0) mockups[index] = mockup;
                    else mockups.push(mockup);
                    localStorage.setItem('avia-mockups', JSON.stringify(mockups));
                    return mockup.id;
                } else {
                    this.memoryStore[mockup.id] = mockup;
                    return mockup.id;
                }
            },

            async getAll() {
                if (this.type === 'indexeddb' && this.db) {
                    const tx = this.db.transaction(['mockups'], 'readonly');
                    const store = tx.objectStore('mockups');
                    return new Promise((resolve) => {
                        const request = store.getAll();
                        request.onsuccess = () => resolve(request.result || []);
                        request.onerror = () => resolve([]);
                    });
                } else if (this.type === 'localstorage') {
                    return JSON.parse(localStorage.getItem('avia-mockups') || '[]');
                } else {
                    return Object.values(this.memoryStore);
                }
            }
        };

        /* ========================================
           SISTEMA: Templates de Mockup
        ======================================== */
        const mockupTemplates = {
            web: (title, content) => `
                <div style="max-width: 800px; margin: 0 auto; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 60px 40px; border-radius: 12px; color: white; font-family: Inter, sans-serif;">
                    <h1 style="font-size: 48px; margin-bottom: 20px; font-weight: 700;">${title}</h1>
                    <p style="font-size: 20px; opacity: 0.9; line-height: 1.6;">${content || 'Bienvenido a nuestra plataforma innovadora diseñada para transformar tu experiencia digital.'}</p>
                    <button style="margin-top: 30px; padding: 16px 32px; background: white; color: #667eea; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;">Comenzar ahora</button>
                </div>
            `,
            mobile: (title, content) => `
                <div style="max-width: 375px; margin: 0 auto; background: #1e293b; padding: 40px 24px; border-radius: 24px; color: white; font-family: Inter, sans-serif; box-shadow: 0 20px 60px rgba(0,0,0,0.5);">
                    <div style="text-align: center; margin-bottom: 30px;">
                        <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 32px;">📱</div>
                        <h2 style="font-size: 28px; margin-bottom: 12px;">${title}</h2>
                        <p style="font-size: 14px; opacity: 0.7;">${content || 'Tu app favorita, ahora más rápida y potente'}</p>
                    </div>
                    <div style="background: #334155; padding: 20px; border-radius: 12px; margin-bottom: 16px;">
                        <div style="font-size: 12px; opacity: 0.6; margin-bottom: 8px;">ESTADÍSTICAS</div>
                        <div style="font-size: 32px; font-weight: 700;">1,234</div>
                    </div>
                </div>
            `,
            tablet: (title, content) => `
                <div style="max-width: 600px; margin: 0 auto; background: white; padding: 50px; border-radius: 16px; color: #1e293b; font-family: Inter, sans-serif; box-shadow: 0 16px 48px rgba(0,0,0,0.2);">
                    <h2 style="font-size: 36px; margin-bottom: 24px; color: #667eea;">${title}</h2>
                    <p style="font-size: 18px; line-height: 1.8; color: #475569; margin-bottom: 30px;">${content || 'Optimizado para tablets y dispositivos medianos con una experiencia inmersiva.'}</p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div style="padding: 24px; background: #f1f5f9; border-radius: 12px;">
                            <div style="font-size: 24px; margin-bottom: 8px;">🎯</div>
                            <div style="font-weight: 600;">Preciso</div>
                        </div>
                        <div style="padding: 24px; background: #f1f5f9; border-radius: 12px;">
                            <div style="font-size: 24px; margin-bottom: 8px;">⚡</div>
                            <div style="font-weight: 600;">Rápido</div>
                        </div>
                    </div>
                </div>
            `,
            dashboard: (title, content) => `
                <div style="max-width: 900px; margin: 0 auto; background: #0f172a; padding: 40px; border-radius: 16px; color: white; font-family: Inter, sans-serif;">
                    <h2 style="font-size: 32px; margin-bottom: 8px;">${title}</h2>
                    <p style="font-size: 14px; opacity: 0.6; margin-bottom: 30px;">${content || 'Panel de control y métricas en tiempo real'}</p>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                        <div style="background: #1e293b; padding: 24px; border-radius: 12px; border-left: 4px solid #10b981;">
                            <div style="font-size: 12px; opacity: 0.6; margin-bottom: 8px;">USUARIOS ACTIVOS</div>
                            <div style="font-size: 36px; font-weight: 700; color: #10b981;">2,847</div>
                        </div>
                        <div style="background: #1e293b; padding: 24px; border-radius: 12px; border-left: 4px solid #3b82f6;">
                            <div style="font-size: 12px; opacity: 0.6; margin-bottom: 8px;">INGRESOS</div>
                            <div style="font-size: 36px; font-weight: 700; color: #3b82f6;">$45.2K</div>
                        </div>
                        <div style="background: #1e293b; padding: 24px; border-radius: 12px; border-left: 4px solid #f59e0b;">
                            <div style="font-size: 12px; opacity: 0.6; margin-bottom: 8px;">CONVERSIÓN</div>
                            <div style="font-size: 36px; font-weight: 700; color: #f59e0b;">24.3%</div>
                        </div>
                    </div>
                </div>
            `
        };

        /* ========================================
           TRACK B: Sistema de Validación
        ======================================== */
        function validateInputs() {
            const titleInput = document.getElementById('titleInput');
            const titleError = document.getElementById('titleError');
            const generateBtn = document.getElementById('generateBtn');
            
            const title = titleInput.value.trim();
            const isValid = title.length >= 3;

            if (title.length === 0) {
                titleInput.classList.remove('avia-input--valid', 'avia-input--invalid');
                titleError.classList.remove('active');
                generateBtn.disabled = true;
            } else if (isValid) {
                titleInput.classList.add('avia-input--valid');
                titleInput.classList.remove('avia-input--invalid');
                titleError.classList.remove('active');
                generateBtn.disabled = false;
            } else {
                titleInput.classList.add('avia-input--invalid');
                titleInput.classList.remove('avia-input--valid');
                titleError.classList.add('active');
                generateBtn.disabled = true;
            }

            return isValid;
        }

        /* ========================================
           TRACK A: Sistema de Galería
        ======================================== */
        async function renderGallery(filters = {}) {
            const mockups = await AVIAStorage.getAll();
            let filtered = mockups;

            if (filters.category && filters.category !== 'all') {
                filtered = filtered.filter(m => m.category === filters.category);
            }

            if (filters.search) {
                const search = filters.search.toLowerCase();
                filtered = filtered.filter(m => 
                    m.title.toLowerCase().includes(search)
                );
            }

            filtered.sort((a, b) => b.id - a.id);

            const galleryHTML = `
                <div class="gallery-controls">
                    <select id="categoryFilter" aria-label="Filtrar por categoría de mockup">
                        <option value="all">📂 Todas las categorías</option>
                        <option value="web" ${filters.category === 'web' ? 'selected' : ''}>🌐 Web/Landing</option>
                        <option value="mobile" ${filters.category === 'mobile' ? 'selected' : ''}>📱 Mobile App</option>
                        <option value="tablet" ${filters.category === 'tablet' ? 'selected' : ''}>📱 Tablet</option>
                        <option value="dashboard" ${filters.category === 'dashboard' ? 'selected' : ''}>📊 Dashboard</option>
                    </select>
                    <input 
                        type="search" 
                        id="searchBar"
                        placeholder="🔍 Buscar mockups por título..."
                        aria-label="Buscar mockups por título"
                        value="${filters.search || ''}"
                    />
                </div>
                <div class="gallery-grid" role="list" aria-label="Galería de mockups guardados">
                    ${filtered.length === 0 ? 
                        `<div class="gallery-empty">
                            <div class="gallery-empty-icon">🖼️</div>
                            <p style="font-size: 16px; margin-bottom: 8px;">No hay mockups guardados</p>
                            <p style="font-size: 14px;">Crea tu primer mockup en el panel de control</p>
                        </div>` :
                        filtered.map(m => createMockupCard(m)).join('')
                    }
                </div>
            `;

            document.getElementById('gallery-container').innerHTML = galleryHTML;

            if (filtered.length > 0) {
                filtered.forEach(mockup => generateThumbnail(mockup));
            }

            attachGalleryEvents();
            addLog(`🖼️ Galería renderizada: ${filtered.length} mockups`, 'success');
        }

        function createMockupCard(mockup) {
            const date = new Date(mockup.timestamp).toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            return `
                <article class="mockup-card" data-id="${mockup.id}" role="listitem">
                    <div class="mockup-thumbnail" id="thumb-${mockup.id}">
                        <div class="mockup-thumbnail-loading">Generando preview...</div>
                    </div>
                    <h3 title="${mockup.title}">${mockup.title}</h3>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <span class="mockup-category">${mockup.category}</span>
                        <span style="font-size: 11px; color: var(--avia-text-dim);">${date}</span>
                    </div>
                    <div class="mockup-actions">
                        <button 
                            class="btn-edit" 
                            data-id="${mockup.id}"
                            aria-label="Editar mockup ${mockup.title}"
                            title="Cargar en panel de control">
                            ✏️ Editar
                        </button>
                        <button 
                            class="btn-duplicate" 
                            data-id="${mockup.id}"
                            aria-label="Duplicar mockup ${mockup.title}"
                            title="Crear copia">
                            📋 Copiar
                        </button>
                        <button 
                            class="btn-delete" 
                            data-id="${mockup.id}"
                            aria-label="Eliminar mockup ${mockup.title}"
                            title="Eliminar permanentemente">
                            🗑️ Borrar
                        </button>
                    </div>
                </article>
            `;
        }

        async function generateThumbnail(mockup) {
            const container = document.getElementById(`thumb-${mockup.id}`);
            if (!container) return;

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = mockup.html;
            tempDiv.style.cssText = 'position:absolute; left:-9999px; top:0; width:800px;';
            document.body.appendChild(tempDiv);

            try {
                if (typeof html2canvas !== 'undefined') {
                    const canvas = await html2canvas(tempDiv.firstChild, {
                        backgroundColor: '#0f172a',
                        scale: 0.3,
                        logging: false,
                        windowWidth: 800,
                        windowHeight: 600
                    });
                    
                    container.innerHTML = '';
                    container.appendChild(canvas);
                } else {
                    container.innerHTML = '<div style="font-size: 48px; opacity: 0.5;">📄</div>';
                }
            } catch (error) {
                container.innerHTML = '<div style="font-size: 48px; opacity: 0.5;">📄</div>';
                addLog(`⚠️ Error generando thumbnail: ${error.message}`, 'warning');
            } finally {
                document.body.removeChild(tempDiv);
            }
        }

        function attachGalleryEvents() {
            const categoryFilter = document.getElementById('categoryFilter');
            if (categoryFilter) {
                categoryFilter.addEventListener('change', (e) => {
                    const searchBar = document.getElementById('searchBar');
                    renderGallery({
                        category: e.target.value,
                        search: searchBar?.value || ''
                    });
                });
            }

            const searchBar = document.getElementById('searchBar');
            if (searchBar) {
                searchBar.addEventListener('input', (e) => {
                    const categoryFilter = document.getElementById('categoryFilter');
                    renderGallery({
                        category: categoryFilter?.value || 'all',
                        search: e.target.value
                    });
                });
            }

            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    editMockup(e.target.dataset.id);
                });
            });

            document.querySelectorAll('.btn-duplicate').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    duplicateMockup(e.target.dataset.id);
                });
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteMockup(e.target.dataset.id);
                });
            });
        }

        async function editMockup(id) {
            const mockups = await AVIAStorage.getAll();
            const mockup = mockups.find(m => m.id == id);
            
            if (!mockup) {
                showNotification('⚠️ Mockup no encontrado', 'warning');
                return;
            }

            document.getElementById('categorySelect').value = mockup.category;
            document.getElementById('titleInput').value = mockup.title;
            document.getElementById('contentInput').value = mockup.content || '';

            validateInputs();

            window.scrollTo({ top: 0, behavior: 'smooth' });

            showNotification(`✏️ Editando: ${mockup.title}`, 'info');
            addLog(`✏️ Mockup cargado para edición: ${mockup.title}`, 'info');
        }

        async function duplicateMockup(id) {
            const mockups = await AVIAStorage.getAll();
            const original = mockups.find(m => m.id == id);
            
            if (!original) {
                showNotification('⚠️ Mockup no encontrado', 'warning');
                return;
            }

            const duplicate = {
                ...original,
                id: Date.now(),
                title: `${original.title} (copia)`,
                timestamp: new Date().toISOString()
            };

            await AVIAStorage.save(duplicate);
            showNotification(`✅ Mockup duplicado: ${duplicate.title}`, 'success');
            addLog(`📋 Mockup duplicado: ${original.title} → ${duplicate.title}`, 'success');
            
            renderGallery();
        }

        async function deleteMockup(id) {
            const mockups = await AVIAStorage.getAll();
            const mockup = mockups.find(m => m.id == id);
            
            if (!mockup) {
                showNotification('⚠️ Mockup no encontrado', 'warning');
                return;
            }

            if (!confirm(`¿Eliminar "${mockup.title}"?\n\nEsta acción no se puede deshacer.`)) {
                return;
            }

            if (AVIAStorage.type === 'indexeddb' && AVIAStorage.db) {
                const tx = AVIAStorage.db.transaction(['mockups'], 'readwrite');
                const store = tx.objectStore('mockups');
                await store.delete(Number(id));
            } else if (AVIAStorage.type === 'localstorage') {
                const updated = mockups.filter(m => m.id != id);
                localStorage.setItem('avia-mockups', JSON.stringify(updated));
            } else {
                delete AVIAStorage.memoryStore[id];
            }

            showNotification(`🗑️ Mockup eliminado: ${mockup.title}`, 'info');
            addLog(`🗑️ Mockup eliminado: ${mockup.title}`, 'info');
            
            renderGallery();
        }

        /* ========================================
           SISTEMA: Generar Mockup
        ======================================== */
        async function generateMockup() {
            if (!validateInputs()) {
                showNotification('⚠️ Completa todos los campos requeridos', 'warning');
                return;
            }

            const category = document.getElementById('categorySelect').value;
            const title = document.getElementById('titleInput').value.trim();
            const content = document.getElementById('contentInput').value.trim();

            const html = mockupTemplates[category](title, content);
            const preview = document.getElementById('mockupPreview');
            preview.innerHTML = html;

            const mockup = {
                id: Date.now(),
                category,
                title,
                content,
                html,
                timestamp: new Date().toISOString()
            };

            await AVIAStorage.save(mockup);
            addLog(`✅ Mockup "${title}" generado y guardado (ID: ${mockup.id})`, 'success');
            showNotification('✅ Mockup generado exitosamente', 'success');
            
            renderGallery();
        }

        /* ========================================
           SISTEMA: Exportación
        ======================================== */
        function exportHTML() {
            const preview = document.getElementById('mockupPreview');
            if (!preview.innerHTML.trim()) {
                showNotification('⚠️ Genera un mockup primero', 'warning');
                return;
            }

            const html = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Mockup Export</title>
</head>
<body>
    ${preview.innerHTML}
</body>
</html>`;

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'avia-mockup.html';
            a.click();
            URL.revokeObjectURL(url);

            addLog('💾 Mockup exportado como HTML', 'success');
            showNotification('✅ HTML descargado', 'success');
        }

        async function exportPNG() {
            const preview = document.getElementById('mockupPreview');
            if (!preview.innerHTML.trim()) {
                showNotification('⚠️ Genera un mockup primero', 'warning');
                return;
            }

            if (typeof html2canvas === 'undefined') {
                showNotification('⚠️ html2canvas CDN no disponible', 'warning');
                return;
            }

            try {
                const canvas = await html2canvas(preview.firstChild, {
                    backgroundColor: '#0f172a',
                    scale: 2
                });
                
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'avia-mockup.png';
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    addLog('🖼️ Mockup exportado como PNG', 'success');
                    showNotification('✅ PNG descargado', 'success');
                });
            } catch (error) {
                addLog(`❌ Error exportando PNG: ${error.message}`, 'error');
                showNotification('❌ Error al exportar PNG', 'error');
            }
        }

        async function exportPDF() {
            const preview = document.getElementById('mockupPreview');
            if (!preview.innerHTML.trim()) {
                showNotification('⚠️ Genera un mockup primero', 'warning');
                return;
            }

            if (typeof jspdf === 'undefined') {
                showNotification('⚠️ jsPDF CDN no disponible', 'warning');
                return;
            }

            try {
                const canvas = await html2canvas(preview.firstChild, {
                    backgroundColor: '#0f172a',
                    scale: 2
                });
                
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = jspdf;
                const pdf = new jsPDF({
                    orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [canvas.width, canvas.height]
                });
                
                pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                pdf.save('avia-mockup.pdf');
                
                addLog('📄 Mockup exportado como PDF', 'success');
                showNotification('✅ PDF descargado', 'success');
            } catch (error) {
                addLog(`❌ Error exportando PDF: ${error.message}`, 'error');
                showNotification('❌ Error al exportar PDF', 'error');
            }
        }

        /* ========================================
           SISTEMA: Logs y Notificaciones
        ======================================== */
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString('es-ES');
            entry.textContent = `[${timestamp}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function showNotification(message, type = 'info') {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 3000);
        }

        /* ========================================
           SISTEMA: Inicialización
        ======================================== */
        async function init() {
            addLog('🚀 Iniciando AVIA Design Hub v8.0-DEMO', 'success');

            await AVIAStorage.init();

            await renderGallery();

            document.getElementById('generateBtn').addEventListener('click', generateMockup);
            document.getElementById('exportHtmlBtn').addEventListener('click', exportHTML);
            document.getElementById('exportPngBtn').addEventListener('click', exportPNG);
            document.getElementById('exportPdfBtn').addEventListener('click', exportPDF);

            // TRACK B: Validación en tiempo real
            document.getElementById('titleInput').addEventListener('input', validateInputs);
            document.getElementById('contentInput').addEventListener('input', validateInputs);

            // Validación inicial
            validateInputs();

            addLog('✅ Sistema inicializado correctamente', 'success');
            addLog('🌟 Tracks activos: A (Galería), B (Validación), C (Accesibilidad)', 'success');
        }

        // Iniciar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
