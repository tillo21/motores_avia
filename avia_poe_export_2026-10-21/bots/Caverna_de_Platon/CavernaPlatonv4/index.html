<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Caverna Digital – Con botón Home</title>
<style>
body{margin:0;font-family:"Poppins",sans-serif;background:linear-gradient(135deg,#3d5270,#4e678e);color:#fff;text-align:center;display:flex;flex-direction:column;min-height:100vh}
.nav-btn{position:fixed;top:50%;transform:translateY(-50%);width:70px;height:70px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;transition:transform .3s ease}
.nav-btn:hover{transform:translateY(-50%) scale(1.1)}
.nav-btn svg{width:32px;height:32px}
.nav-left{left:1.5rem;background:#fff;box-shadow:0 0 15px rgba(255,255,255,0.95),0 0 25px rgba(255,255,255,0.6),inset 0 0 5px rgba(255,255,255,1)}
.nav-left svg path{fill:#111}
.nav-right{right:1.5rem;background:#000;box-shadow:0 0 20px 4px rgba(255,255,255,0.9),inset 0 0 6px rgba(255,255,255,0.5);animation:pulse 2.5s infinite ease-in-out}
.nav-right svg path{fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 18px 3px rgba(255,255,255,0.8)}50%{box-shadow:0 0 26px 8px rgba(255,255,255,0.6)}100%{box-shadow:0 0 18px 3px rgba(255,255,255,0.8)}}

/* Botón Home */
.home-btn{position:fixed;top:1rem;left:1rem;width:55px;height:55px;border-radius:50%;border:none;background:#00e5ff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 15px rgba(0,229,255,0.6);transition:transform 0.3s ease, box-shadow 0.3s ease;z-index:60}
.home-btn:hover{transform:scale(1.1);box-shadow:0 0 25px rgba(0,229,255,0.95)}
.home-btn svg{width:28px;height:28px;fill:#002b36}

main{flex:1;display:flex;justify-content:center;align-items:center;padding:0 1rem;text-align:center;min-height:calc(100vh - 150px)}
.center-area{display:flex;flex-direction:column;justify-content:center;align-items:center}
.titulo{font-size:2rem;font-weight:700;margin-bottom:0.5rem}
.instruccion{font-size:1.1rem;margin-bottom:1.5rem;opacity:0.9}
.quiz{max-width:600px;width:100%}
.question{font-size:1.4rem;font-weight:600;margin-bottom:1.3rem}
.options{list-style:none;padding:0;margin:0}
.options li{margin:.6rem auto;padding:1rem 1.2rem;border-radius:12px;cursor:pointer;width:100%;max-width:600px;transition:transform .2s ease,opacity .3s ease}
.options li:hover{transform:scale(1.05)}
.redOpt{background:linear-gradient(145deg,#ef5350,#b71c1c)}
.greenOpt{background:linear-gradient(145deg,#43a047,#1b5e20)}
.yellowOpt{background:linear-gradient(145deg,#ffee58,#fbc02d);color:#000}
.correct{box-shadow:0 0 15px #00ff99 inset}
.incorrect{box-shadow:0 0 15px #ff0033 inset}
.feedback{margin-top:1rem;font-weight:500;font-size:1.05rem;max-width:600px;line-height:1.4}
.card{width:260px;height:190px;perspective:900px;margin-top:2rem}
.card-inner{width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s ease;cursor:pointer}
.card:hover .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;width:100%;height:100%;border-radius:12px;display:flex;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.35)}
.card-back{background:rgba(0,0,0,0.9);color:#fff;transform:rotateY(180deg)}
.rojo{background:linear-gradient(145deg,#ef5350,#b71c1c)}
.verde{background:linear-gradient(145deg,#43a047,#1b5e20)}
.amarillo{background:linear-gradient(145deg,#ffee58,#fbc02d);color:#000}
.azul{background:linear-gradient(145deg,#2196f3,#1565c0)}
.indicador{margin-top:1.5rem;font-size:0.9rem;opacity:0.8}
.mando-container{display:flex;justify-content:center;align-items:center;background:rgba(60,80,110,0.75);padding:1.5rem 6rem 2rem;border-top:1px solid rgba(255,255,255,0.15)}
.mando-button{width:30px;height:30px;border-radius:50%;margin:0.5rem .8rem;opacity:0.6;transition:all .4s ease;flex-shrink:0}
.mando-button.active{transform:scale(1.2);opacity:1;box-shadow:0 0 15px rgba(255,255,255,0.9)}
.rojo-btn{background:#e53935}.verde-btn{background:#43a047}.amarillo-btn{background:#ffeb3b}.azul-btn{background:#2196f3}.negro-btn{background:#000}.blanco-btn{background:#fafafa;border:1px solid #888}.turquesa-btn{background:#00e5ff}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .4s ease}
.modal.active{opacity:1;pointer-events:all}
.modal-content{background:#fff;color:#111;border-radius:12px;padding:2rem;max-width:400px;width:90%;text-align:center}
.modal-content h2{margin-top:0}
.modal-content button{margin-top:1.5rem;padding:.6rem 1.4rem;border:none;border-radius:8px;background:#4e678e;color:#fff;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<!-- HOME -->
<button class="home-btn" id="btnHome" title="Inicio">
  <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
</button>

<!-- BOTONES LATERALES -->
<button class="nav-btn nav-left" id="btnLeft">
  <svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
</button>
<button class="nav-btn nav-right" id="btnRight">
  <svg viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
</button>

<main id="content"></main>

<!-- MANDO INFERIOR -->
<div class="mando-container">
  <div class="mando-button rojo-btn"></div>
  <div class="mando-button verde-btn"></div>
  <div class="mando-button amarillo-btn"></div>
  <div class="mando-button azul-btn"></div>
  <div class="mando-button negro-btn"></div>
  <div class="mando-button blanco-btn"></div>
  <div class="mando-button turquesa-btn"></div>
</div>

<div class="modal" id="modal"><div class="modal-content" id="modalContent"></div></div>

<script>
const quizData=[
  {q:"¿Qué representa la caverna de Platón?",
   options:["La libertad del pensamiento","La ignorancia y las apariencias","El conocimiento verdadero"],
   ans:1,
   explicacion:"La caverna simboliza la ignorancia y el mundo de las apariencias donde vive la mayoría; solo al salir se descubre la luz de la verdad."},
  {q:"¿Qué simboliza la salida de la caverna?",
   options:["El miedo a lo desconocido","El descubrimiento de la verdad","El regreso a la oscuridad"],
   ans:1,
   explicacion:"Salir de la caverna representa liberarse de los engaños sensoriales y comprender la verdad mediante la razón."},
  {q:"¿Qué diferencia el mundo sensible del inteligible?",
   options:["Lo aparente y lo real","La tecnología y la filosofía","La alegría y la tristeza"],
   ans:0,
   explicacion:"El mundo sensible es el de las apariencias cambiantes; el inteligible es el de las ideas eternas y verdaderas."}
];

const cards=[
  {cls:"rojo",title:"Caverna digital",text:"El mundo virtual de las apariencias."},
  {cls:"verde",title:"Mundo inteligible",text:"La razón que busca la verdad."},
  {cls:"amarillo",title:"Salir de la caverna",text:"Liberar la mente de ilusiones."},
  {cls:"azul",title:"Mundo sensible",text:"Lo cambiante que percibimos."}
];

let currentScreen="quiz",currentQuestion=0,answered=false,correctAnswers=0,wrongAnswers=0,currentCard=0;

/* ==== Renderizado del test ==== */
function renderQuiz(i){
  const item=quizData[i];answered=false;
  const content=document.getElementById("content");
  content.innerHTML=`
  <div class="center-area">
    <div class="titulo">TEST FILOSÓFICO</div>
    <div class="instruccion">Pulsa sobre la respuesta correcta y lee el feedback.</div>
    <div class="quiz">
      <div class="question">${i+1}. ${item.q}</div>
      <ul class="options">
        ${item.options.map((op,idx)=>`<li class="${["redOpt","greenOpt","yellowOpt"][idx]}" data-index="${idx}">${op}</li>`).join("")}
      </ul>
      <div class="feedback" id="fb"></div>
    </div>
  </div>`;
  document.querySelectorAll(".options li").forEach(li=>{
    li.addEventListener("click",()=>{
      if(answered) return;answered=true;
      const idx=parseInt(li.dataset.index);
      const fb=document.getElementById("fb");
      if(idx===item.ans){
        li.classList.add("correct");
        fb.innerHTML=`✅ Correcto.<br>${item.explicacion}`;
        correctAnswers++;
      }else{
        li.classList.add("incorrect");
        const correcta=item.options[item.ans];
        fb.innerHTML=`❌ Incorrecto.<br>La correcta es <strong>${correcta}</strong> porque ${item.explicacion.toLowerCase()}`;
        wrongAnswers++;
      }
    });
  });
}

/* ==== Navegación test ==== */
function nextQuestion(){
  if(currentScreen==="quiz"){if(!answered)return;
    currentQuestion++;
    if(currentQuestion>=quizData.length)showResult();else renderQuiz(currentQuestion);
  }else if(currentScreen==="cards"){nextCard();}
}
function prevQuestion(){
  if(currentScreen==="quiz" && currentQuestion>0){currentQuestion--;renderQuiz(currentQuestion);}
  else if(currentScreen==="cards"){prevCard();}
}

/* ==== Modal ==== */
function showResult(){
  const modal=document.getElementById("modal");
  const m=document.getElementById("modalContent");
  if(wrongAnswers===0){
    m.innerHTML=`<h2>🏛️ Has salido de la cueva</h2><p>Has acertado todo. Continúa con las fichas.</p><button id="btnNext">Continuar</button>`;
    modal.classList.add("active");
    document.getElementById("btnNext").onclick=()=>{modal.classList.remove("active");currentScreen="cards";currentCard=0;loadCard(currentCard);};
  }else{
    m.innerHTML=`<h2>🔦 Aún estás dentro</h2><p>Tienes ${wrongAnswers} fallo${wrongAnswers>1?"s":""}. Reintenta.</p><button id="btnRetry">Reintentar</button>`;
    modal.classList.add("active");
    document.getElementById("btnRetry").onclick=()=>{modal.classList.remove("active");restartQuiz();};
  }
}
function restartQuiz(){currentQuestion=0;answered=false;correctAnswers=0;wrongAnswers=0;renderQuiz(0);}

/* ==== Fichas ==== */
function loadCard(i){
  const c=cards[i];
  const content=document.getElementById("content");
  content.innerHTML=`
  <div class="center-area">
    <div class="titulo">FICHAS FILOSÓFICAS</div>
    <div class="instruccion">Botones negro y blanco para navegar.</div>
    <div class="card">
      <div class="card-inner">
        <div class="card-front ${c.cls}">${c.title}</div>
        <div class="card-back">${c.text}</div>
      </div>
    </div>
    <div class="indicador">Ficha ${i+1} de ${cards.length}</div>
  </div>`;
}
function nextCard(){
  currentCard++;
  if(currentCard>=cards.length){
    // Ha completado todas las fichas
    const modal=document.getElementById("modal");
    const m=document.getElementById("modalContent");
    m.innerHTML=`<h2>🎓 ¡Tema Completado!</h2><p>Has revisado todas las fichas filosóficas. ¡Excelente trabajo!</p><p style="margin-top:1rem;font-size:0.95rem;opacity:0.85;">Puedes volver al inicio o continuar con el siguiente concepto/lección.</p><button id="btnFinish">Volver al Inicio</button>`;
    modal.classList.add("active");
    document.getElementById("btnFinish").onclick=()=>{modal.classList.remove("active");goHome();};
    currentCard=cards.length-1; // Mantener en la última ficha
  } else {
    loadCard(currentCard);
  }
}
function prevCard(){currentCard--;if(currentCard<0)currentCard=cards.length-1;loadCard(currentCard);}
function goHome(){currentScreen="quiz";restartQuiz();}

/* ==== Listeners ==== */
document.getElementById("btnRight").addEventListener("click",nextQuestion);
document.getElementById("btnLeft").addEventListener("click",prevQuestion);
document.getElementById("btnHome").addEventListener("click",goHome);

/* ==== Mando animado, ahora 7 zonas ==== */
const botones=document.querySelectorAll(".mando-button");
let iB=0;
setInterval(()=>{botones.forEach(b=>b.classList.remove("active"));botones[iB].classList.add("active");iB=(iB+1)%botones.length;},1400);

/* ==== Inicio ==== */
renderQuiz(0);
</script>
</body>
</html>
