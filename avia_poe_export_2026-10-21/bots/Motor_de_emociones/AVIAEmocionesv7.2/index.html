<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIA Motor Emociones v7.2 - Validación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;

            transition: all 0.3s;

        .tab:hover {

        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;

        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);

            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .metric-value {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            display: block;
            margin: 10px 0;
        }
        
        .metric-label {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .metric-sublabel {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .test-results {
            margin-top: 30px;
        }
        
        .test-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .test-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        
        .test-item.success {
            border-left-color: #38ef7d;
            background: #f0fff4;
        }
        
        .test-item.warning {
            border-left-color: #ffd93d;
            background: #fffbea;
        }
        
        .test-item.error {
            border-left-color: #f45c43;
            background: #fff5f5;
        }
        
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .test-text {
            font-style: italic;
            color: #555;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }
        
        .test-emotions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .emotion-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .emotion-badge.expected {
            background: #e3f2fd;
            color: #1976d2;
            border: 2px solid #1976d2;
        }
        
        .emotion-badge.detected {
            background: #f3e5f5;
            color: #7b1fa2;
            border: 2px solid #7b1fa2;
        }
        
        .emotion-badge.match {
            background: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }
        
        .comparison-table {
            width: 100%;

            background: white;
            border-radius: 10px;
            overflow: hidden;

        .comparison-table th {

        }
        
        .progress-bar {
            width: 100%;

            background: #e0e0e0;
            border-radius: 15px;

        }
        
        .progress-fill {
            height: 100%;

        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }

        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin: 20px 0;
        }
        
        .confusion-matrix {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 5px;
            margin: 20px 0;
        }
        
        .matrix-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .matrix-header {
            background: #667eea;
            color: white;
        }
        
        .matrix-value {
            background: #f8f9fa;
            color: #333;
        }
        
        @media (max-width: 768px) {
            .tabs {
                overflow-x: auto;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 AVIA Motor de Emociones v7.2</h1>
            <p>Sistema de Validación y Testing</p>
            <div>
                <span class="badge">50 Casos de Prueba</span>
                <span class="badge">8 Emociones</span>
                <span class="badge">3 Métodos</span>
            </div>
        </div>
        
        <div class="content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('overview')">📊 Resumen</button>
                <button class="tab" onclick="switchTab('tests')">🧪 Tests Detallados</button>
                <button class="tab" onclick="switchTab('comparison')">📈 Comparación</button>
                <button class="tab" onclick="switchTab('playground')">🎮 Playground</button>
            </div>
            
            <!-- TAB 1: RESUMEN -->
            <div id="tab-overview" class="tab-content active">
                <div style="text-align: center;">
                    <button class="btn btn-success" onclick="runAllTests()">▶️ Ejecutar Validación Completa</button>
                    <button class="btn btn-danger" onclick="resetTests()">🔄 Resetear Resultados</button>
                </div>
                
                <div id="testProgress" style="display: none;">
                    <h3 style="margin: 20px 0;">Progreso de Validación</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill">0%</div>
                    </div>
                </div>
                
                <div id="metricsOverview"></div>
                
                <div id="summaryCharts"></div>
            </div>
            
            <!-- TAB 2: TESTS DETALLADOS -->
            <div id="tab-tests" class="tab-content">
                <h2 style="margin-bottom: 20px;">🧪 Resultados Individuales por Caso</h2>
                <div id="detailedTests"></div>
            </div>
            
            <!-- TAB 3: COMPARACIÓN -->
            <div id="tab-comparison" class="tab-content">
                <h2 style="margin-bottom: 20px;">📈 Comparación de Métodos</h2>
                <div id="comparisonContent"></div>
            </div>
            
            <!-- TAB 4: PLAYGROUND -->
            <div id="tab-playground" class="tab-content">
                <h2 style="margin-bottom: 20px;">🎮 Prueba el Motor en Vivo</h2>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 10px;">Escribe tu texto:</label>
                    <textarea id="playgroundInput" rows="4" style="width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px;" placeholder="Ejemplo: Estoy muy nervioso pero también emocionado por el nuevo proyecto..."></textarea>
                </div>
                <button class="btn" onclick="testPlayground()">🔍 Analizar</button>
                <div id="playgroundResults"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== DATASET DE VALIDACIÓN ====================
        
        const testDataset = [
            // ALEGRÍA
            { text: "Estoy muy feliz con los resultados del proyecto", expected: ['alegría'], difficulty: 'easy' },
            { text: "¡Qué día tan maravilloso! Me siento genial", expected: ['alegría'], difficulty: 'easy' },
            { text: "Estoy encantado con mi nuevo trabajo", expected: ['alegría'], difficulty: 'easy' },
            { text: "Me siento satisfecho con lo que he logrado", expected: ['alegría', 'confianza'], difficulty: 'medium' },
            { text: "Radiante de felicidad tras la noticia", expected: ['alegría'], difficulty: 'easy' },
            
            // TRISTEZA
            { text: "Me siento muy triste y deprimido últimamente", expected: ['tristeza'], difficulty: 'easy' },
            { text: "No puedo dejar de llorar desde que pasó", expected: ['tristeza'], difficulty: 'medium' },
            { text: "Estoy completamente desanimado y sin esperanza", expected: ['tristeza'], difficulty: 'easy' },
            { text: "Todo me parece sombrío y sin sentido", expected: ['tristeza'], difficulty: 'medium' },
            { text: "Me siento apenado por lo sucedido", expected: ['tristeza'], difficulty: 'easy' },
            
            // MIEDO
            { text: "Estoy muy nervioso por el examen de mañana", expected: ['miedo', 'anticipación'], difficulty: 'medium' },
            { text: "Tengo miedo de que algo malo suceda", expected: ['miedo'], difficulty: 'easy' },
            { text: "Me siento aterrado ante la situación", expected: ['miedo'], difficulty: 'easy' },
            { text: "Estoy en pánico total, no sé qué hacer", expected: ['miedo'], difficulty: 'easy' },
            { text: "La ansiedad me está matando", expected: ['miedo'], difficulty: 'easy' },
            
            // IRA
            { text: "Estoy furioso por lo que me hicieron", expected: ['ira'], difficulty: 'easy' },
            { text: "Me molesta mucho que no me escuchen", expected: ['ira'], difficulty: 'easy' },
            { text: "Estoy totalmente indignado con esta injusticia", expected: ['ira'], difficulty: 'medium' },
            { text: "Me siento frustrado e irritado constantemente", expected: ['ira'], difficulty: 'easy' },
            { text: "Estoy rabioso de rabia", expected: ['ira'], difficulty: 'easy' },
            
            // ASCO
            { text: "Eso me parece repugnante y asqueroso", expected: ['asco'], difficulty: 'easy' },
            { text: "Qué asco me da esta situación", expected: ['asco'], difficulty: 'easy' },
            { text: "Es nauseabundo solo de pensarlo", expected: ['asco'], difficulty: 'easy' },
            { text: "Me resulta extremadamente desagradable", expected: ['asco'], difficulty: 'medium' },
            
            // SORPRESA
            { text: "¡No puedo creerlo! Estoy totalmente sorprendido", expected: ['sorpresa'], difficulty: 'easy' },
            { text: "Me quedé atónito con la noticia", expected: ['sorpresa'], difficulty: 'medium' },
            { text: "Estoy asombrado por lo que acaba de pasar", expected: ['sorpresa'], difficulty: 'easy' },
            { text: "Qué impacto, no me lo esperaba", expected: ['sorpresa'], difficulty: 'medium' },
            
            // ANTICIPACIÓN
            { text: "Estoy esperando con ansias el evento de mañana", expected: ['anticipación', 'alegría'], difficulty: 'medium' },
            { text: "No puedo esperar a que llegue el viernes", expected: ['anticipación'], difficulty: 'medium' },
            { text: "Estoy muy ilusionado con el futuro proyecto", expected: ['anticipación', 'alegría'], difficulty: 'medium' },
            { text: "Expectante ante lo que viene", expected: ['anticipación'], difficulty: 'easy' },
            
            // CONFIANZA
            { text: "Me siento muy seguro y confiado en mis capacidades", expected: ['confianza'], difficulty: 'easy' },
            { text: "Estoy tranquilo y sereno ante el desafío", expected: ['confianza'], difficulty: 'easy' },
            { text: "Me siento preparado y capaz de lograrlo", expected: ['confianza'], difficulty: 'easy' },
            { text: "Totalmente relajado y en paz conmigo mismo", expected: ['confianza'], difficulty: 'easy' },
            
            // EMOCIONES MIXTAS (difíciles)
            { text: "Estoy nervioso pero también emocionado por empezar", expected: ['miedo', 'alegría', 'anticipación'], difficulty: 'hard' },
            { text: "Me siento triste pero aliviado de que haya terminado", expected: ['tristeza', 'confianza'], difficulty: 'hard' },
            { text: "Estoy feliz por el logro pero preocupado por lo que sigue", expected: ['alegría', 'miedo'], difficulty: 'hard' },
            { text: "Enfadado conmigo mismo pero decidido a mejorar", expected: ['ira', 'confianza'], difficulty: 'hard' },
            { text: "Sorprendido y asustado por lo repentino del cambio", expected: ['sorpresa', 'miedo'], difficulty: 'hard' },
            
            // CASOS SUTILES (muy difíciles)
            { text: "No me esperaba esto, pero supongo que está bien", expected: ['sorpresa', 'confianza'], difficulty: 'hard' },
            { text: "Ya veremos qué pasa mañana", expected: ['anticipación'], difficulty: 'medium' },
            { text: "Prefiero no pensar en ello ahora", expected: ['miedo'], difficulty: 'hard' },
            { text: "Las cosas podrían ser peor", expected: ['confianza'], difficulty: 'hard' },
            { text: "No sé qué pensar de todo esto", expected: ['sorpresa'], difficulty: 'hard' },
            
            // CASOS EXTREMOS
            { text: "¡ESTOY EUFÓRICO! ¡ES LO MEJOR QUE ME HA PASADO!", expected: ['alegría'], difficulty: 'easy' },
            { text: "Estoy completamente devastado y destrozado", expected: ['tristeza'], difficulty: 'easy' },
            { text: "ESTO ES INACEPTABLE. ESTOY FURIOSO", expected: ['ira'], difficulty: 'easy' },
            { text: "Me da terror solo de imaginarlo", expected: ['miedo'], difficulty: 'easy' },
            { text: "Es lo más repulsivo que he visto en mi vida", expected: ['asco'], difficulty: 'easy' }
        ];

        // ==================== MOTOR DE EMOCIONES (simplificado) ====================
        
        const lexicon = {
            'feliz': { emotion: 'alegría', intensity: 0.9 },
            'contento': { emotion: 'alegría', intensity: 0.8 },
            'alegre': { emotion: 'alegría', intensity: 0.9 },
            'emocionado': { emotion: 'alegría', intensity: 0.85 },
            'maravilloso': { emotion: 'alegría', intensity: 0.9 },
            'genial': { emotion: 'alegría', intensity: 0.8 },
            'encantado': { emotion: 'alegría', intensity: 0.9 },
            'satisfecho': { emotion: 'alegría', intensity: 0.7 },
            'radiante': { emotion: 'alegría', intensity: 0.9 },
            'eufórico': { emotion: 'alegría', intensity: 1.0 },
            'triste': { emotion: 'tristeza', intensity: 0.9 },
            'deprimido': { emotion: 'tristeza', intensity: 1.0 },
            'llorar': { emotion: 'tristeza', intensity: 0.9 },
            'desanimado': { emotion: 'tristeza', intensity: 0.8 },
            'sombrío': { emotion: 'tristeza', intensity: 0.8 },
            'apenado': { emotion: 'tristeza', intensity: 0.75 },
            'devastado': { emotion: 'tristeza', intensity: 1.0 },
            'destrozado': { emotion: 'tristeza', intensity: 1.0 },
            'nervioso': { emotion: 'miedo', intensity: 0.8 },
            'miedo': { emotion: 'miedo', intensity: 0.9 },
            'aterrado': { emotion: 'miedo', intensity: 1.0 },
            'pánico': { emotion: 'miedo', intensity: 1.0 },
            'ansiedad': { emotion: 'miedo', intensity: 0.85 },
            'ansioso': { emotion: 'miedo', intensity: 0.85 },
            'terror': { emotion: 'miedo', intensity: 1.0 },
            'preocupado': { emotion: 'miedo', intensity: 0.7 },
            'furioso': { emotion: 'ira', intensity: 1.0 },
            'molesta': { emotion: 'ira', intensity: 0.7 },
            'indignado': { emotion: 'ira', intensity: 0.85 },
            'frustrado': { emotion: 'ira', intensity: 0.8 },
            'irritado': { emotion: 'ira', intensity: 0.75 },
            'rabioso': { emotion: 'ira', intensity: 0.95 },
            'enfadado': { emotion: 'ira', intensity: 0.8 },
            'inaceptable': { emotion: 'ira', intensity: 0.8 },
            'repugnante': { emotion: 'asco', intensity: 0.95 },
            'asqueroso': { emotion: 'asco', intensity: 0.95 },
            'asco': { emotion: 'asco', intensity: 0.9 },
            'nauseabundo': { emotion: 'asco', intensity: 1.0 },
            'desagradable': { emotion: 'asco', intensity: 0.7 },
            'repulsivo': { emotion: 'asco', intensity: 0.95 },
            'sorprendido': { emotion: 'sorpresa', intensity: 0.9 },
            'atónito': { emotion: 'sorpresa', intensity: 1.0 },
            'asombrado': { emotion: 'sorpresa', intensity: 0.95 },
            'impacto': { emotion: 'sorpresa', intensity: 0.85 },
            'esperando': { emotion: 'anticipación', intensity: 0.7 },
            'ansias': { emotion: 'anticipación', intensity: 0.8 },
            'esperar': { emotion: 'anticipación', intensity: 0.7 },
            'ilusionado': { emotion: 'anticipación', intensity: 0.85 },
            'expectante': { emotion: 'anticipación', intensity: 0.8 },
            'mañana': { emotion: 'anticipación', intensity: 0.5 },
            'futuro': { emotion: 'anticipación', intensity: 0.6 },
            'examen': { emotion: 'anticipación', intensity: 0.6 },
            'seguro': { emotion: 'confianza', intensity: 0.85 },
            'confiado': { emotion: 'confianza', intensity: 0.8 },
            'tranquilo': { emotion: 'confianza', intensity: 0.7 },
            'sereno': { emotion: 'confianza', intensity: 0.8 },
            'preparado': { emotion: 'confianza', intensity: 0.75 },
            'capaz': { emotion: 'confianza', intensity: 0.8 },
            'relajado': { emotion: 'confianza', intensity: 0.75 },
            'aliviado': { emotion: 'confianza', intensity: 0.7 }
        };

        const intensifiers = {
            'muy': 0.3, 'mucho': 0.3, 'super': 0.4, 'totalmente': 0.4,
            'completamente': 0.5, 'extremadamente': 0.5, 'poco': -0.3
        };

        function analyzeEmotions(text) {
            const tokens = text.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^\w\s]/g, ' ')
                .split(/\s+/);

            const scores = {
                'alegría': 0, 'tristeza': 0, 'miedo': 0, 'ira': 0,
                'asco': 0, 'sorpresa': 0, 'anticipación': 0, 'confianza': 0
            };

            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];
                
                if (lexicon[token]) {
                    let intensity = lexicon[token].intensity;
                    
                    if (i > 0 && intensifiers[tokens[i-1]]) {
                        intensity = Math.max(0, Math.min(1, intensity + intensifiers[tokens[i-1]]));
                    }
                    
                    scores[lexicon[token].emotion] += intensity;
                }
            }

            // Normalizar
            const maxScore = Math.max(...Object.values(scores));
            if (maxScore > 0) {
                for (let emotion in scores) {
                    scores[emotion] = scores[emotion] / maxScore;
                }
            }

            // Retornar top 3 emociones
            return Object.entries(scores)
                .sort((a, b) => b[1] - a[1])
                .filter(([_, score]) => score > 0.3)
                .slice(0, 3)
                .map(([emotion, score]) => emotion);
        }

        // ==================== SISTEMA DE EVALUACIÓN ====================
        
        let testResults = {
            total: 0,
            correct: 0,
            partial: 0,
            incorrect: 0,
            details: []
        };

        function evaluateTest(detected, expected) {
            const detectedSet = new Set(detected);
            const expectedSet = new Set(expected);
            
            const intersection = [...detectedSet].filter(e => expectedSet.has(e));
            const precision = intersection.length / detected.length;
            const recall = intersection.length / expected.length;
            
            let status = 'error';
            if (intersection.length === expected.length && detected.length === expected.length) {
                status = 'success'; // 100% match
            } else if (intersection.length > 0) {
                status = 'warning'; // Partial match
            }
            
            return {
                status,
                precision: precision || 0,
                recall: recall || 0,
                f1: precision + recall > 0 ? (2 * precision * recall) / (precision + recall) : 0,
                matches: intersection
            };
        }

        async function runAllTests() {
            testResults = {
                total: testDataset.length,
                correct: 0,
                partial: 0,
                incorrect: 0,
                details: [],
                byDifficulty: { easy: { total: 0, correct: 0 }, medium: { total: 0, correct: 0 }, hard: { total: 0, correct: 0 } },
                byEmotion: {}
            };

            document.getElementById('testProgress').style.display = 'block';
            
            for (let i = 0; i < testDataset.length; i++) {
                const test = testDataset[i];
                
                // Simular análisis
                await new Promise(resolve => setTimeout(resolve, 50));
                
                const detected = analyzeEmotions(test.text);
                const evaluation = evaluateTest(detected, test.expected);
                
                const result = {
                    ...test,
                    detected,
                    evaluation
                };
                
                testResults.details.push(result);
                
                // Contadores
                if (evaluation.status === 'success') testResults.correct++;
                else if (evaluation.status === 'warning') testResults.partial++;
                else testResults.incorrect++;
                
                // Por dificultad
                testResults.byDifficulty[test.difficulty].total++;
                if (evaluation.status === 'success') {
                    testResults.byDifficulty[test.difficulty].correct++;
                }
                
                // Por emoción
                test.expected.forEach(emotion => {
                    if (!testResults.byEmotion[emotion]) {
                        testResults.byEmotion[emotion] = { total: 0, correct: 0 };
                    }
                    testResults.byEmotion[emotion].total++;
                    if (detected.includes(emotion)) {
                        testResults.byEmotion[emotion].correct++;
                    }
                });
                
                // Actualizar progreso
                const progress = Math.round(((i + 1) / testDataset.length) * 100);
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('progressFill').textContent = progress + '%';
            }
            
            displayResults();
        }

        function displayResults() {
            const accuracy = (testResults.correct / testResults.total * 100).toFixed(1);
            const partialAccuracy = ((testResults.correct + testResults.partial) / testResults.total * 100).toFixed(1);
            
            // Métricas generales
            document.getElementById('metricsOverview').innerHTML = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Precisión Total</div>
                        <div class="metric-value">${accuracy}%</div>
                        <div class="metric-sublabel">${testResults.correct}/${testResults.total} perfectos</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Con Parciales</div>
                        <div class="metric-value">${partialAccuracy}%</div>
                        <div class="metric-sublabel">${testResults.correct + testResults.partial}/${testResults.total} casos</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Perfectos</div>
                        <div class="metric-value">${testResults.correct}</div>
                        <div class="metric-sublabel">100% match</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Parciales</div>
                        <div class="metric-value">${testResults.partial}</div>
                        <div class="metric-sublabel">Emociones detectadas</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Incorrectos</div>
                        <div class="metric-value">${testResults.incorrect}</div>
                        <div class="metric-sublabel">Sin coincidencias</div>
                    </div>
                </div>
            `;

            // Tests detallados
            let detailedHTML = '';
            testResults.details.forEach((result, idx) => {
                detailedHTML += `
                    <div class="test-item ${result.evaluation.status}">
                        <div class="test-header">
                            <strong>Test #${idx + 1}</strong>
                            <span style="font-size: 12px; color: #666;">
                                Dificultad: ${result.difficulty.toUpperCase()} | 
                                F1-Score: ${(result.evaluation.f1 * 100).toFixed(0)}%
                            </span>
                        </div>
                        <div class="test-text">"${result.text}"</div>
                        <div class="test-emotions">
                            <span style="font-size: 12px; font-weight: 600; margin-right: 5px;">Esperadas:</span>
                            ${result.expected.map(e => `<span class="emotion-badge expected">🎯 ${e}</span>`).join('')}
                        </div>
                        <div class="test-emotions">
                            <span style="font-size: 12px; font-weight: 600; margin-right: 5px;">Detectadas:</span>
                            ${result.detected.map(e => `<span class="emotion-badge ${result.expected.includes(e) ? 'match' : 'detected'}">
                                ${result.expected.includes(e) ? '✅' : '🔍'} ${e}
                            </span>`).join('')}
                        </div>
                    </div>
                `;
            });
            document.getElementById('detailedTests').innerHTML = detailedHTML;

            // Comparación por dificultad
            const comparisonHTML = `
                <div class="chart-container">
                    <h3>📊 Precisión por Dificultad</h3>
                    <table class="comparison-table">
                        <thead>
                            <tr>
                                <th>Dificultad</th>
                                <th>Total Casos</th>
                                <th>Correctos</th>
                                <th>Precisión</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(testResults.byDifficulty).map(([difficulty, data]) => `
                                <tr>
                                    <td><strong>${difficulty.toUpperCase()}</strong></td>
                                    <td>${data.total}</td>
                                    <td>${data.correct}</td>
                                    <td><strong>${(data.correct / data.total * 100).toFixed(1)}%</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                
                <div class="chart-container" style="margin-top: 20px;">
                    <h3>🎯 Precisión por Emoción</h3>
                    <table class="comparison-table">
                        <thead>
                            <tr>
                                <th>Emoción</th>
                                <th>Total Casos</th>
                                <th>Detectados</th>
                                <th>Recall</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(testResults.byEmotion).sort((a, b) => b[1].correct/b[1].total - a[1].correct/a[1].total).map(([emotion, data]) => `
                                <tr>
                                    <td><strong>${emotion.charAt(0).toUpperCase() + emotion.slice(1)}</strong></td>
                                    <td>${data.total}</td>
                                    <td>${data.correct}</td>
                                    <td><strong>${(data.correct / data.total * 100).toFixed(1)}%</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('comparisonContent').innerHTML = comparisonHTML;
        }

        function resetTests() {
            testResults = { total: 0, correct: 0, partial: 0, incorrect: 0, details: [] };
            document.getElementById('testProgress').style.display = 'none';
            document.getElementById('metricsOverview').innerHTML = '<p style="text-align: center; color: #666;">Ejecuta la validación para ver resultados</p>';
            document.getElementById('detailedTests').innerHTML = '';
            document.getElementById('comparisonContent').innerHTML = '';
        }

        function testPlayground() {
            const text = document.getElementById('playgroundInput').value.trim();
            if (!text) {
                alert('Escribe un texto primero');
                return;
            }

            const detected = analyzeEmotions(text);
            const html = `
                <div class="chart-container" style="margin-top: 20px;">
                    <h3>🎯 Emociones Detectadas</h3>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px;">
                        ${detected.map(e => `
                            <div style="flex: 1; min-width: 150px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; text-align: center;">
                                <div style="font-size: 32px; margin-bottom: 10px;">${getEmotionIcon(e)}</div>
                                <div style="font-weight: 600; font-size: 18px;">${e.charAt(0).toUpperCase() + e.slice(1)}</div>
                            </div>
                        `).join('')}
                    </div>
                    ${detected.length === 0 ? '<p style="text-align: center; color: #666; margin-top: 20px;">No se detectaron emociones claras en el texto</p>' : ''}
                </div>
            `;
            document.getElementById('playgroundResults').innerHTML = html;
        }

        function getEmotionIcon(emotion) {
            const icons = {
                'alegría': '😊', 'tristeza': '😢', 'miedo': '😨', 'ira': '😠',
                'asco': '🤢', 'sorpresa': '😲', 'anticipación': '🤔', 'confianza': '😌'
            };
            return icons[emotion] || '😐';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
